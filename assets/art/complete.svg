<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none" role="img" aria-label="A shining gold medal with a tick in the centre and a red and blue ribbon: complete">
<title>A shining gold medal with a tick in the centre and a red and blue ribbon: complete</title>
<style>
.cm-sw{animation:cm-sw 4.5s ease-in-out infinite}
@keyframes cm-sw{0%,55%{transform:translateX(-90px)}85%,100%{transform:translateX(90px)}}
.cm-tw{animation:cm-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes cm-tw{0%,100%{opacity:.3;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.cm-bob{animation:cm-bob 5s ease-in-out infinite}@keyframes cm-bob{50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .cm-sw { opacity: 0; } }
</style>
