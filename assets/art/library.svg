<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A source library: a wooden shelf of books with spines of different heights, a reading lamp shining on them, a pair of headphones on a stack of books and a gold star">
<title>A source library: a wooden shelf of books with spines of different heights, a reading lamp shining on them, a pair of headphones on a stack of books and a gold star</title>
<style>
.lb-tw { animation: lb-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
