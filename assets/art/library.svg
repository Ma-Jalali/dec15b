.lb-cone { animation: lb-cone 5s ease-in-out infinite; } @keyframes lb-cone { 50% { opacity: .6; } }
.lb-wv { animation: lb-wv 2.4s ease-in-out infinite; } .lb-w2 { animation-delay: .4s; } @keyframes lb-wv { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.lb-star { animation: lb-star 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes lb-star { 50% { transform: translateY(-5px) rotate(8deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
