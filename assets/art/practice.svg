<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="An evening study scene at home: a small house with a warm lit window and smoke from the chimney, a checklist for tonight with three tasks ticked, and a sprout growing in a pot under the moon">
