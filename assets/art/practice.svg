.pr-sw { animation: pr-sw 5s ease-in-out infinite; transform-origin: 58px 268px; } @keyframes pr-sw { 50% { transform: rotate(4deg); } }
.pr-tk { stroke-dasharray: 16; animation: pr-tk 7s ease-in-out infinite; } .pr-k2 { animation-delay: .5s; } .pr-k3 { animation-delay: 1s; }
@keyframes pr-tk { 0%, 6% { stroke-dashoffset: 16; } 22%, 100% { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
