<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A magnifying glass examines a claim card marked with a question; a balance weighs a ticked piece of evidence against an open question">
<title>A magnifying glass examines a claim card marked with a question; a balance weighs a ticked piece of evidence against an open question</title>
<style>
.sc-tw{animation:sc-tw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
