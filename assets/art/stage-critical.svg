.sc-fl{animation:sc-fl 6s ease-in-out infinite}.sc-fl2{animation:sc-fl 7s ease-in-out -3.5s infinite}
@keyframes sc-fl{50%{transform:translateY(-4px)}}
.sc-bl{animation:sc-bl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sc-bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
.sc-bm{animation:sc-bm 6s ease-in-out infinite;transform-origin:330px 104px}
@keyframes sc-bm{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(-2deg)}}
.sc-pl{animation:sc-pl 6s ease-in-out infinite}@keyframes sc-pl{0%,100%{transform:translateY(5.6px)}50%{transform:translateY(2.2px)}}
.sc-pr{animation:sc-pr 6s ease-in-out infinite}@keyframes sc-pr{0%,100%{transform:translateY(-5.6px)}50%{transform:translateY(-2.2px)}}
.sc-mg{animation:sc-mg 7s ease-in-out infinite}@keyframes sc-mg{50%{transform:translate(10px,4px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
