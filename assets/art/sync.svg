.sy-flow { stroke-dasharray: 2 7; animation: sy-flow 1.4s linear infinite; } @keyframes sy-flow { to { stroke-dashoffset: -18; } }
.sy-halo { animation: sy-halo 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes sy-halo { 50% { opacity: .55; transform: scale(.93); } }
.sy-sc { animation: sy-sc 5s ease-in-out infinite; } @keyframes sy-sc { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
