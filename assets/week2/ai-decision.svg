<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="adt">
<title id="adt">Before you use AI, ask three questions. Question 1: does this task need my own ideas, creativity or reflection? If yes, do it yourself; AI may stop you from growing. If no, go to question 2: will AI take the learning away, because the task builds a skill such as paraphrasing or analysis? If yes, try it yourself first, then compare with AI. If no, go to question 3: is AI allowed here? If no, for example in-class tasks and exams, work independently. If yes, AI can help with a mechanical job.</title>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
</defs>
<rect width="1040" height="440" rx="24" fill="#fffdf8"/>
<rect x="910" y="22" width="100" height="56" fill="url(#dots)"/>
<text x="40" y="54" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600" fill="#14293a">AI or not? Ask three questions</text>
<path d="M40 64c90-5 230-5 360-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="90" font-size="14" fill="#6b7882">Start with question 1 and follow the arrows.</text>

<!-- start -->
<g filter="url(#sh)"><rect x="40" y="128" width="110" height="88" rx="16" fill="#14293a"/></g>
<g fill="none" stroke="#e3a843" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M80 148h22l8 8v24H80z"/><path d="M102 148v8h8M86 164h16M86 172h12"/></g>
<text x="95" y="204" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">A task</text>

<!-- questions -->
<g filter="url(#sh)"><rect x="186" y="118" width="236" height="108" rx="16" fill="#fff"/><rect x="458" y="118" width="236" height="108" rx="16" fill="#fff"/><rect x="730" y="118" width="270" height="108" rx="16" fill="#fff"/></g>
<g font-size="13" font-weight="800" fill="#fff" text-anchor="middle"><circle cx="212" cy="144" r="13" fill="#7a4a8c"/><text x="212" y="149">1</text><circle cx="484" cy="144" r="13" fill="#2b776e"/><text x="484" y="149">2</text><circle cx="756" cy="144" r="13" fill="#3a58a0"/><text x="756" y="149">3</text></g>
<g font-size="14.5" font-weight="800" fill="#14293a"><text x="234" y="149">Does it need my own</text><text x="506" y="149">Will AI take the</text><text x="778" y="149">Is AI allowed here?</text></g>
<g font-size="14.5" font-weight="800" fill="#14293a"><text x="206" y="170">ideas, creativity or reflection?</text><text x="478" y="170">learning away?</text></g>
<g font-size="12" fill="#6b7882"><text x="206" y="200">e.g. a reflective journal</text><text x="478" y="194">the task builds a skill:</text><text x="478" y="211">paraphrasing, analysis</text><text x="752" y="194">in-class tasks and exams</text><text x="752" y="211">usually need independent work</text></g>

<!-- no arrows -->
<g fill="none" stroke="#c9bfae" stroke-width="2.5" stroke-linecap="round"><path d="M152 172h26"/><path d="M424 172h26"/><path d="M696 172h26"/></g>
<g fill="#c9bfae"><path d="M178 166l9 6-9 6z"/><path d="M450 166l9 6-9 6z"/><path d="M722 166l9 6-9 6z"/></g>
<g font-size="11" font-weight="800" fill="#8b969e" text-anchor="middle"><text x="437" y="162">NO</text><text x="709" y="162">NO</text></g>

<!-- outcome arrows -->
<g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M304 230v38" stroke="#7a4a8c"/><path d="M297 261l7 8 7-8" stroke="#7a4a8c"/>
  <path d="M576 230v38" stroke="#2b776e"/><path d="M569 261l7 8 7-8" stroke="#2b776e"/>
  <path d="M820 230v38" stroke="#b0512a"/><path d="M813 261l7 8 7-8" stroke="#b0512a"/>
  <path d="M940 230v38" stroke="#3f7a3a"/><path d="M933 261l7 8 7-8" stroke="#3f7a3a"/>
</g>
<g font-size="11" font-weight="800" text-anchor="start"><text x="314" y="254" fill="#7a4a8c">YES</text><text x="586" y="254" fill="#2b776e">YES</text><text x="830" y="254" fill="#b0512a">NO</text><text x="950" y="254" fill="#3f7a3a">YES</text></g>

<!-- outcomes -->
<g>
  <rect x="186" y="278" width="236" height="104" rx="16" fill="#f6eff8"/>
  <rect x="458" y="278" width="236" height="104" rx="16" fill="#e9f4f2"/>
  <rect x="730" y="278" width="130" height="104" rx="16" fill="#fbefe8"/>
  <rect x="870" y="278" width="130" height="104" rx="16" fill="#eef6ea"/>
</g>
<g font-size="14" font-weight="800"><text x="206" y="306" fill="#5e3570">Do it yourself</text><text x="478" y="306" fill="#22655d">Try it yourself first</text><text x="746" y="306" fill="#8e3b1c">Work</text><text x="746" y="324" fill="#8e3b1c">independently</text><text x="886" y="306" fill="#2f5e2b">AI can help</text></g>
<g font-size="12.5" fill="#3d505e"><text x="206" y="328">AI may stop you</text><text x="206" y="346">from growing.</text><text x="478" y="328">then compare your version</text><text x="478" y="346">with AI.</text><text x="746" y="346">no AI</text><text x="886" y="328">with a mechanical</text><text x="886" y="346">job</text></g>
<g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M396 300l-6 10h12z M396 314v6" stroke="#7a4a8c" opacity="0"/>
  <circle cx="976" cy="360" r="9" stroke="#3f7a3a"/><path d="M972 360l3 3 5-6" stroke="#3f7a3a"/>
  <circle cx="836" cy="360" r="9" stroke="#b0512a"/><path d="M830 366l12-12" stroke="#b0512a"/>
</g>
<text x="40" y="418" font-size="12.5" fill="#8b969e">Always check your university’s AI rules for each assessment.</text>
<path d="M992 44l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e3a843"/>
</svg>
