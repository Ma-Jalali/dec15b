<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="avt">
<title id="avt">Academic writing is a dialogue. Left: voices identified. Your essay brings together the voices of sources, such as Nicastro and Carillo 2021, Berti et al. 2021 and About That 2024, and your own voice. Each source voice has a reference, so the reader knows who is speaking. Right: voices not identified. The ideas have no references, so the dialogue disappears and the essay looks like a personal opinion. Based on Brick, 2011, page 107.</title>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
</defs>
<rect width="1040" height="450" rx="24" fill="#fffdf8"/>
<rect x="30" y="300" width="90" height="60" fill="url(#dots)"/>
<text x="40" y="54" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600" fill="#14293a">Academic writing is a dialogue</text>
<path d="M40 64c80-5 200-5 300-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="90" font-size="14" fill="#6b7882">Your reader must always know whose voice is speaking.</text>

<!-- LEFT: identified -->
<rect x="30" y="112" width="640" height="300" rx="20" fill="#f4f8f6"/>
<g transform="translate(52 140)"><circle r="12" fill="#2b776e"/><path d="M-5 0l3.5 3.5L5-4" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="72" y="145" font-size="13" font-weight="800" letter-spacing="1.8" fill="#22655d">VOICES IDENTIFIED</text>

<!-- connectors -->
<g stroke-width="2.2" stroke-dasharray="2 6" stroke-linecap="round" fill="none">
  <path d="M206 196C250 200 262 216 292 226" stroke="#2b776e"/>
  <path d="M206 330C250 324 262 306 292 296" stroke="#3a58a0"/>
  <path d="M494 196C450 200 438 216 408 226" stroke="#7a4a8c"/>
  <path d="M494 330C450 324 438 306 408 296" stroke="#ad6a12"/>
</g>
<!-- essay page -->
<g filter="url(#sh)"><rect x="292" y="168" width="116" height="196" rx="10" fill="#fff"/></g>
<text x="350" y="190" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.5" fill="#6b7882">YOUR ESSAY</text>
<g stroke-width="5" stroke-linecap="round">
  <path d="M306 208h88" stroke="#dfe5e9"/><path d="M306 222h60" stroke="#2b776e" opacity=".55"/><path d="M370 222h24" stroke="#dfe5e9"/>
  <path d="M306 240h88" stroke="#dfe5e9"/><path d="M306 254h40" stroke="#dfe5e9"/><path d="M350 254h44" stroke="#7a4a8c" opacity=".55"/>
  <path d="M306 272h88" stroke="#e3a843" opacity=".75"/><path d="M306 286h70" stroke="#e3a843" opacity=".75"/>
  <path d="M306 304h88" stroke="#dfe5e9"/><path d="M306 318h52" stroke="#3a58a0" opacity=".55"/><path d="M362 318h32" stroke="#dfe5e9"/>
  <path d="M306 336h88" stroke="#dfe5e9"/><path d="M306 350h56" stroke="#dfe5e9"/>
</g>

<!-- source bubbles -->
<g filter="url(#sh)">
  <rect x="58" y="164" width="150" height="62" rx="14" fill="#fff"/><rect x="58" y="300" width="150" height="62" rx="14" fill="#fff"/>
  <rect x="492" y="164" width="158" height="62" rx="14" fill="#fff"/><rect x="492" y="300" width="158" height="62" rx="14" fill="#fff"/>
</g>
<g>
  <circle cx="82" cy="186" r="12" fill="#2b776e"/><path d="M76 194c1-5 3-7 6-7s5 2 6 7" fill="#fff"/><circle cx="82" cy="181" r="3.4" fill="#fff"/>
  <circle cx="82" cy="322" r="12" fill="#3a58a0"/><path d="M76 330c1-5 3-7 6-7s5 2 6 7" fill="#fff"/><circle cx="82" cy="317" r="3.4" fill="#fff"/>
  <circle cx="516" cy="186" r="12" fill="#7a4a8c"/><path d="M510 194c1-5 3-7 6-7s5 2 6 7" fill="#fff"/><circle cx="516" cy="181" r="3.4" fill="#fff"/>
  <circle cx="516" cy="322" r="12" fill="#e3a843"/><path d="M509 323l5 5 9-10" stroke="#14293a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g font-size="12.5" font-weight="800" fill="#14293a"><text x="100" y="185">Nicastro &amp;</text><text x="100" y="321">Berti et al.</text><text x="534" y="185">About That</text><text x="534" y="321">Your voice</text></g>
<g font-size="12" fill="#6b7882"><text x="100" y="201">Carillo (2021)</text><text x="100" y="337">(2021)</text><text x="534" y="201">(2024)</text><text x="534" y="337">your position</text></g>
<g font-size="11.5" font-style="italic" fill="#6b7882"><text x="74" y="216">“…argue that…”</text><text x="74" y="352">“…point out…”</text><text x="508" y="216">“…suggests…”</text><text x="508" y="352">“This shows that…”</text></g>

<!-- RIGHT: not identified -->
<rect x="690" y="112" width="320" height="300" rx="20" fill="#fbf1ec"/>
<g transform="translate(712 140)"><circle r="12" fill="#b0512a"/><path d="M-4-4l8 8M4-4l-8 8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="732" y="145" font-size="13" font-weight="800" letter-spacing="1.8" fill="#8e3b1c">NOT IDENTIFIED</text>
<g filter="url(#sh)"><rect x="792" y="168" width="116" height="150" rx="10" fill="#fff"/></g>
<g stroke="#dfe5e9" stroke-width="5" stroke-linecap="round"><path d="M806 192h88M806 206h70M806 222h88M806 236h80M806 252h88M806 266h60M806 282h88M806 296h74"/></g>
<g font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#c9a89a"><text x="752" y="210">?</text><text x="928" y="250">?</text><text x="760" y="290">?</text></g>
<text x="850" y="350" text-anchor="middle" font-size="13.5" font-weight="800" fill="#8e3b1c">The dialogue disappears.</text>
<text x="850" y="370" text-anchor="middle" font-size="13" fill="#6b7882">It looks like a personal opinion.</text>

<text x="40" y="436" font-size="12" fill="#8b969e">Idea from Brick (2011, p. 107)</text>
<path d="M988 46l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e3a843"/><circle cx="962" cy="74" r="3" fill="#2b776e" opacity=".6"/>
</svg>
