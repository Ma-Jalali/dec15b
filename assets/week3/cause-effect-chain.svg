<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="cet">
<title id="cet">Building a cause and effect chain with nominalisation. Two clauses: cause, food waste decomposes in landfills; effect, methane is produced. Nominalise both: the decomposition of food waste in landfills; the production of methane. Join them with causal language: the decomposition of food waste in landfills results in the production of methane, a potent greenhouse gas. Cause to effect: leads to, results in, contributes to, increases. Effect from cause: is due to, is a result of, because of, as a result of.</title>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
  </defs>
<rect width="1040" height="450" rx="24" fill="#fffdf8"/>
<rect x="910" y="22" width="100" height="56" fill="url(#dots)"/>
<text x="40" y="54" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600" fill="#14293a">Cause → effect in one sentence</text>
<path d="M40 64c90-5 230-5 370-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="90" font-size="14" fill="#6b7882">Turn both clauses into noun phrases, then join them with causal language.</text>

<!-- row 1: two clauses -->
<g font-size="12" font-weight="800" letter-spacing="2" ><text x="40" y="132" fill="#ad6a12">CAUSE</text><text x="560" y="132" fill="#2b776e">EFFECT</text></g>
<g filter="url(#sh)"><rect x="40" y="142" width="440" height="56" rx="14" fill="#fff"/><rect x="560" y="142" width="440" height="56" rx="14" fill="#fff"/></g>
<rect x="40" y="142" width="6" height="56" rx="3" fill="#ad6a12"/><rect x="560" y="142" width="6" height="56" rx="3" fill="#2b776e"/>
<g font-family="Fraunces, Georgia, serif" font-size="18" fill="#3d505e"><text x="62" y="177">Food waste <tspan fill="#8a520b" font-weight="600">decomposes</tspan> in landfills.</text><text x="582" y="177">Methane <tspan fill="#22655d" font-weight="600">is produced</tspan>.</text></g>
<path d="M488 170h60" stroke="#c9bfae" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M546 164l10 6-10 6z" fill="#c9bfae"/>

<!-- nominalise arrows -->
<g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M200 206v34" stroke="#ad6a12"/><path d="M193 233l7 8 7-8" stroke="#ad6a12"/>
  <path d="M720 206v34" stroke="#2b776e"/><path d="M713 233l7 8 7-8" stroke="#2b776e"/>
</g>
<g font-size="12.5" font-weight="700"><text x="214" y="230" fill="#ad6a12">decompose → decomposition</text><text x="734" y="230" fill="#2b776e">produce → production</text></g>

<!-- row 2: chain -->
<g filter="url(#sh)">
  <rect x="40" y="252" width="384" height="64" rx="16" fill="#fbf3e4"/>
  <rect x="436" y="246" width="168" height="76" rx="18" fill="#14293a"/>
  <rect x="616" y="252" width="384" height="64" rx="16" fill="#e9f4f2"/>
</g>
<g font-family="Fraunces, Georgia, serif" font-size="17.5" text-anchor="middle">
  <text x="232" y="290" fill="#8a520b">the <tspan font-weight="600">decomposition</tspan> of food waste in landfills</text>
  <text x="520" y="291" fill="#fff" font-weight="600" font-size="20">results in</text>
  <text x="808" y="290" fill="#22655d">the <tspan font-weight="600">production</tspan> of methane</text>
</g>
<g fill="#fff" opacity=".9"><circle cx="452" cy="284" r="3"/><circle cx="588" cy="284" r="3"/></g>
<text x="40" y="344" font-size="13.5" fill="#3d505e"><tspan font-weight="800" fill="#14293a">One sentence:</tspan> The decomposition of food waste in landfills results in the production of methane, a potent greenhouse gas.</text>

<!-- language -->
<g transform="translate(40 366)">
  <rect width="470" height="62" rx="14" fill="#fff" stroke="#efe6d4"/>
  <text x="18" y="25" font-size="11.5" font-weight="800" letter-spacing="1.6" fill="#ad6a12">CAUSE → EFFECT</text>
  <text x="18" y="47" font-size="13.5" fill="#3d505e">leads to · results in · contributes to · increases</text>
</g>
<g transform="translate(530 366)">
  <rect width="470" height="62" rx="14" fill="#fff" stroke="#e1ece9"/>
  <text x="18" y="25" font-size="11.5" font-weight="800" letter-spacing="1.6" fill="#2b776e">EFFECT ← CAUSE</text>
  <text x="18" y="47" font-size="13.5" fill="#3d505e">is due to · is a result of · because of · as a result of</text>
</g>
<path d="M992 44l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e3a843"/>
</svg>
