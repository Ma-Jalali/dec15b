<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="cst">
<title id="cst">How a conclusion works. The conclusion mirrors the introduction. The introduction moves from general background to your thesis. The conclusion starts from the thesis and opens out: 1, restate your position in new words; 2, sum up the main reasons, one for each body paragraph; 3, give a final message: why it matters, a recommendation or an implication. Do not add new evidence or new reasons.</title>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
</defs>
<rect width="1040" height="470" rx="24" fill="#fffdf8"/>
<rect x="900" y="24" width="110" height="60" fill="url(#dots)"/>
<text x="40" y="54" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600" fill="#14293a">How a conclusion works</text>
<path d="M40 64c60-5 140-5 228-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="90" font-size="14" fill="#6b7882">It mirrors the introduction: start from your thesis, then open out to the big picture.</text>

<!-- introduction funnel (small, muted) -->
<text x="40" y="136" font-size="12" font-weight="800" letter-spacing="2.2" fill="#6b7882">INTRODUCTION</text>
<g fill="#eef1f4">
  <path d="M40 150h300l-26 54H66z"/><path d="M70 212h244l-26 54H96z"/><path d="M100 274h184l-26 54H126z" fill="#14293a"/>
</g>
<g font-size="14" text-anchor="middle" fill="#3d505e"><text x="190" y="182">General background</text><text x="192" y="244">Narrow the focus</text></g>
<text x="192" y="306" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Thesis</text>

<!-- bridge arrow -->
<path d="M296 300c40 0 54-6 70-14M500 172c-40 10-70 40-92 104" stroke="#c9bfae" stroke-width="2.5" fill="none" stroke-dasharray="2 7" stroke-linecap="round"/>
<path d="M494 164l12 8-13 7" stroke="#c9bfae" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(372 300)"><rect x="-4" y="-17" width="138" height="26" rx="13" fill="#fff" stroke="#ead9b8"/><text x="65" y="1" text-anchor="middle" font-size="12" font-weight="700" fill="#ad6a12">paraphrase, don’t copy</text></g>

<!-- conclusion: opens out -->
<text x="520" y="136" font-size="12" font-weight="800" letter-spacing="2.2" fill="#6b7882">CONCLUSION</text>
<g filter="url(#sh)">
  <path d="M600 150h300l26 70H574z" fill="#fff"/>
  <path d="M572 228h356l26 70H546z" fill="#fff"/>
  <path d="M544 306h412l26 74H518z" fill="#fff"/>
</g>
<g><path d="M600 150h300l2 6H598z" fill="#ba781b"/><path d="M572 228h356l2 6H570z" fill="#328379"/><path d="M544 306h412l2 6H542z" fill="#845496"/></g>
<g font-size="14" font-weight="800" fill="#fff" text-anchor="middle">
  <circle cx="612" cy="186" r="15" fill="#ba781b"/><text x="612" y="191">1</text>
  <circle cx="588" cy="264" r="15" fill="#328379"/><text x="588" y="269">2</text>
  <circle cx="562" cy="344" r="15" fill="#845496"/><text x="562" y="349">3</text>
</g>
<g font-size="16" font-weight="800" fill="#14293a"><text x="638" y="182">Restate your position</text><text x="614" y="260">Sum up the main reasons</text><text x="588" y="340">Final message</text></g>
<g font-size="13" fill="#6b7882"><text x="638" y="202">In conclusion, … (the thesis in new words)</text><text x="614" y="280">one short point for each body paragraph</text><text x="588" y="360">why it matters · a recommendation or an implication</text></g>


<!-- rule -->
<rect x="40" y="404" width="960" height="44" rx="14" fill="#fbefe8"/>
<g transform="translate(64 426)"><circle r="12" fill="#b0512a"/><path d="M-5-5l10 10M5-5L-5 5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="88" y="431" font-size="14" fill="#3d505e"><tspan font-weight="800" fill="#8e3b1c">No new evidence and no new reasons.</tspan> A conclusion only brings together what your essay has already shown.</text>
<path d="M972 40l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e3a843"/>
</svg>
