<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Manrope, 'Segoe UI', Arial, sans-serif">
<rect width="720" height="540" fill="#fffdf8"/>
<text x="320" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#14293a" font-family="Fraunces, Georgia, 'Times New Roman', serif">Food Recovery Hierarchy</text>
<g text-anchor="middle">
<polygon points="40,56 600,56 563.3,126 76.7,126" fill="#5b3f8c"/><text x="320" y="86" fill="#fff" font-size="17" font-weight="800">Source reduction</text><text x="320" y="110" fill="#e4dbf2" font-size="13">Reduce the amount of surplus food produced</text>
<polygon points="76.7,128 563.3,128 526.7,198 113.3,198" fill="#2f5f9e"/><text x="320" y="158" fill="#fff" font-size="17" font-weight="800">Feed hungry people</text><text x="320" y="182" fill="#dbe7f6" font-size="13">Donate extra food to food banks, soup kitchens, shelters</text>
<polygon points="113.3,200 526.7,200 490,270 150,270" fill="#3f7a3a"/><text x="320" y="230" fill="#fff" font-size="17" font-weight="800">Feed animals</text><text x="320" y="254" fill="#dcefd8" font-size="13">Divert food scraps to animal feed</text>
<polygon points="150,272 490,272 453.3,342 186.7,342" fill="#a8841c"/><text x="320" y="302" fill="#fff" font-size="17" font-weight="800">Industrial uses</text><text x="320" y="326" fill="#fbf0cf" font-size="12.5">Recover energy: fuel, oils, digestion</text>
<polygon points="186.7,344 453.3,344 416.7,414 223.3,414" fill="#c9774e"/><text x="320" y="374" fill="#fff" font-size="17" font-weight="800">Composting</text><text x="320" y="398" fill="#fde8dc" font-size="12.5">Make nutrient-rich soil</text>
<polygon points="223.3,416 416.7,416 380,500 260,500" fill="#6f7880"/><text x="320" y="446" fill="#fff" font-size="15" font-weight="800">Landfill /</text><text x="320" y="464" fill="#fff" font-size="15" font-weight="800">incineration</text><text x="320" y="484" fill="#e6e9ec" font-size="12">Last resort</text>
</g>
<g font-size="11" font-weight="800" letter-spacing="1.4" fill="#6b7882" text-anchor="middle">
<text x="660" y="74">MOST</text><text x="660" y="88">PREFERRED</text>
<path d="M660 100v370" stroke="#c9bfae" stroke-width="2"/><path d="m652 462 8 12 8-12" fill="none" stroke="#c9bfae" stroke-width="2" stroke-linejoin="round"/>
<text x="660" y="494">LEAST</text><text x="660" y="508">PREFERRED</text>
</g>
<text x="320" y="528" text-anchor="middle" font-size="11" fill="#8a949b">Redrawn from the US EPA Food Recovery Hierarchy (epa.gov/foodscraps)</text>
</svg>
