<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Writing day: an essay page built in four coloured parts — introduction, body paragraph 1, body paragraph 2 and conclusion — with a fountain pen, a sticky note reading “because · but · so”, and a speech bubble for your own voice.</title>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .36  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2a1d10" flood-opacity=".22"/></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".2"/></filter>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93600f" opacity=".22"/></pattern>
</defs>
<rect width="1400" height="933" fill="#f3ebdd"/>
<rect width="1400" height="933" fill="#f3ebdd" filter="url(#paper)" opacity=".9"/>
<circle cx="700" cy="470" r="400" fill="#f6e7c9" opacity=".75"/>
<circle cx="700" cy="470" r="436" fill="none" stroke="#93600f" stroke-opacity=".2" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
<rect x="110" y="120" width="176" height="128" fill="url(#dots)"/>
<rect x="1120" y="690" width="176" height="128" fill="url(#dots)"/>
<path d="M1170 170l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#e3a843"/>
<path d="M220 720l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#2b776e" opacity=".8"/>
<ellipse cx="700" cy="850" rx="470" ry="24" fill="#2a1d10" opacity=".08"/>

<!-- essay page -->
<g transform="rotate(-4 680 480)" filter="url(#soft)">
  <rect x="470" y="110" width="440" height="700" rx="10" fill="#fffdf7"/>
  <rect x="486" y="126" width="408" height="668" rx="5" fill="none" stroke="#93600f" stroke-opacity=".2" stroke-width="2"/>
  <text x="520" y="178" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.6" fill="#ad6a12">ARGUMENT ESSAY</text>
  <path d="M520 196h220" stroke="#14293a" stroke-width="3" stroke-linecap="round"/>
  <!-- intro -->
  <rect x="520" y="222" width="340" height="112" rx="12" fill="#ad6a12" fill-opacity=".12"/>
  <rect x="520" y="222" width="6" height="112" rx="3" fill="#ad6a12"/>
  <text x="542" y="250" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#ad6a12">INTRODUCTION</text>
  <g stroke="#14293a" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"><path d="M542 274h290M542 294h250M542 314h200"/></g>
  <path d="M760 314h70" stroke="#ad6a12" stroke-width="7" stroke-linecap="round"/>
  <!-- body 1 -->
  <rect x="520" y="352" width="340" height="132" rx="12" fill="#2b776e" fill-opacity=".11"/>
  <rect x="520" y="352" width="6" height="132" rx="3" fill="#2b776e"/>
  <text x="542" y="380" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#2b776e">BODY 1 · REASON + EVIDENCE</text>
  <g stroke="#14293a" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"><path d="M542 404h300M542 424h260M542 444h290M542 464h180"/></g>
  <!-- body 2 -->
  <rect x="520" y="502" width="340" height="132" rx="12" fill="#7a4a8c" fill-opacity=".1"/>
  <rect x="520" y="502" width="6" height="132" rx="3" fill="#7a4a8c"/>
  <text x="542" y="530" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#7a4a8c">BODY 2 · REASON + EVIDENCE</text>
  <g stroke="#14293a" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"><path d="M542 554h280M542 574h300M542 594h230M542 614h260"/></g>
  <!-- conclusion -->
  <rect x="520" y="652" width="340" height="112" rx="12" fill="#3f7a3a" fill-opacity=".11"/>
  <rect x="520" y="652" width="6" height="112" rx="3" fill="#3f7a3a"/>
  <text x="542" y="680" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#3f7a3a">CONCLUSION</text>
  <g stroke="#14293a" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"><path d="M542 704h270M542 724h300M542 744h170"/></g>
</g>

<!-- sticky note -->
<g transform="rotate(7 300 380)" filter="url(#lift)">
  <rect x="190" y="280" width="230" height="210" rx="6" fill="#f6d987"/>
  <path d="M190 286h230" stroke="#e8c15d" stroke-width="12"/>
  <g font-family="Fraunces, Georgia, serif" font-weight="600" fill="#5a3d07">
    <text x="220" y="356" font-size="32">because</text>
    <text x="220" y="404" font-size="32">but</text>
    <text x="220" y="452" font-size="32">so</text>
  </g>
  <g fill="#ad6a12"><circle cx="208" cy="345" r="4"/><circle cx="208" cy="393" r="4"/><circle cx="208" cy="441" r="4"/></g>
</g>

<!-- voice bubble -->
<g filter="url(#lift)">
  <path d="M960 210h230a40 40 0 0 1 40 40v70a40 40 0 0 1-40 40h-130l-50 40 10-40h-60a40 40 0 0 1-40-40v-70a40 40 0 0 1 40-40z" fill="#2b776e"/>
  <text x="1075" y="282" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="600" fill="#fff">In my view…</text>
  <text x="1075" y="318" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2.4" fill="#cfe9e4">YOUR VOICE</text>
</g>

<!-- fountain pen -->
<g transform="rotate(-38 1010 640)" filter="url(#lift)">
  <rect x="860" y="620" width="270" height="34" rx="17" fill="#172d3f"/>
  <rect x="1060" y="618" width="16" height="38" rx="3" fill="#daa74a"/>
  <rect x="900" y="614" width="110" height="9" rx="4.5" fill="#daa74a"/>
  <path d="M860 622l-62 15 62 15z" fill="#daa74a"/>
  <path d="M800 637h40" stroke="#7d5410" stroke-width="2"/>
</g>
<path d="M800 760c30-14 60-14 90 0s60 14 90 0" fill="none" stroke="#14293a" stroke-width="3" stroke-linecap="round" opacity=".35"/>
</svg>
