  <path fill="none" d="M640 386c100-20 190-20 270 0" stroke="#7fc2b9" stroke-opacity=".8" stroke-width="16" stroke-linecap="round"/>
  <path fill="none" d="M640 386c100-20 190-20 270 0" stroke="#14293a" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"/>
  <path fill="none" d="M640 494c100-20 190-20 270 0" stroke="#14293a" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"/>
  <path fill="none" d="M640 504c60-8 120-8 180 0" stroke="#7a4a8c" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <path d="M830 300v84l18-14 18 14v-90" fill="#b0512a"/>
</g>

<!-- headphones -->
<g filter="url(#lift)" transform="translate(0 -44)">
  <path d="M440 300c0-120 90-190 200-190s200 70 200 190" fill="none" stroke="#14293a" stroke-width="20" stroke-linecap="round"/>
  <path d="M440 300c0-120 90-190 200-190s200 70 200 190" fill="none" stroke="#2b4458" stroke-width="8" stroke-linecap="round"/>
  <rect x="404" y="270" width="72" height="108" rx="30" fill="url(#phone)"/>
  <rect x="804" y="270" width="72" height="108" rx="30" fill="url(#phone)"/>
  <rect x="420" y="290" width="18" height="68" rx="9" fill="#fff" opacity=".22"/>
  <rect x="820" y="290" width="18" height="68" rx="9" fill="#fff" opacity=".22"/>
</g>
<g fill="none" stroke="#2b776e" stroke-width="5" stroke-linecap="round" opacity=".7" transform="translate(0 -44)">
  <path d="M920 280c18 20 18 50 0 70"/><path d="M950 260c30 32 30 82 0 112"/><path d="M980 240c42 44 42 116 0 156" opacity=".6"/>
