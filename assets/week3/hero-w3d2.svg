    <path d="M640 350c100-20 190-20 270 0"/><path d="M640 422c100-20 190-20 270 0"/><path d="M640 458c100-20 190-20 230 0"/><path d="M640 530c100-20 190-20 270 0"/><path d="M640 566c100-20 190-20 200 0"/>
  </g>
