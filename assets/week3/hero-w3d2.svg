<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Reading and listening day: an open book with highlighted lines, a pair of headphones with sound waves, and a food-bank crate of fresh produce marked with a heart — reading and listening about solutions to food loss.</title>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .36  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2a1d10" flood-opacity=".22"/></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".2"/></filter>
  <radialGradient id="light" cx="24%" cy="18%" r="90%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#f3ebdd"/><stop offset="1" stop-color="#e6d9c3"/></radialGradient>
  <linearGradient id="cover" x1="0" x2="1"><stop offset="0" stop-color="#6c3d7d"/><stop offset="1" stop-color="#8b5a9d"/></linearGradient>
  <linearGradient id="wood" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d4a46c"/><stop offset="1" stop-color="#b98551"/></linearGradient>
  <radialGradient id="apple" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#f06a4f"/><stop offset=".55" stop-color="#c8341f"/><stop offset="1" stop-color="#8e2213"/></radialGradient>
  <radialGradient id="orange" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#f6b54f"/><stop offset=".6" stop-color="#e08a26"/><stop offset="1" stop-color="#a95d14"/></radialGradient>
  <linearGradient id="phone" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3a8f84"/><stop offset="1" stop-color="#22655d"/></linearGradient>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93600f" opacity=".22"/></pattern>
</defs>
<rect width="1400" height="933" fill="url(#light)"/>
<rect width="1400" height="933" fill="#f3ebdd" filter="url(#paper)" opacity=".9"/>
<circle cx="700" cy="470" r="400" fill="#f6e7c9" opacity=".75"/>
<circle cx="700" cy="470" r="436" fill="none" stroke="#93600f" stroke-opacity=".2" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
<rect x="110" y="110" width="176" height="128" fill="url(#dots)"/>
<rect x="1120" y="700" width="176" height="128" fill="url(#dots)"/>
<path d="M1180 160l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#e3a843"/>
<path d="M200 700l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#7a4a8c" opacity=".7"/>
<ellipse cx="700" cy="842" rx="500" ry="24" fill="#2a1d10" opacity=".08"/>

<!-- open book -->
