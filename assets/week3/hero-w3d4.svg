<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Practice assessment day: an exam paper with a ticked checklist and a short plan, a round timer counting down, a sharpened pencil, and a small sticky note that says “plan first”.</title>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="13"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .36  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2a1d10" flood-opacity=".22"/></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".2"/></filter>
  <radialGradient id="light" cx="24%" cy="18%" r="90%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#f3ebdd"/><stop offset="1" stop-color="#e6d9c3"/></radialGradient>
  <linearGradient id="pencil" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f1c56b"/><stop offset=".5" stop-color="#e3a843"/><stop offset="1" stop-color="#c4892a"/></linearGradient>
  <linearGradient id="clock" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2f8378"/><stop offset="1" stop-color="#1f5f57"/></linearGradient>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93600f" opacity=".22"/></pattern>
</defs>
<rect width="1400" height="933" fill="url(#light)"/>
<rect width="1400" height="933" fill="#f3ebdd" filter="url(#paper)" opacity=".9"/>
<circle cx="700" cy="470" r="400" fill="#f6e7c9" opacity=".75"/>
<circle cx="700" cy="470" r="436" fill="none" stroke="#93600f" stroke-opacity=".2" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
<rect x="110" y="120" width="176" height="128" fill="url(#dots)"/>
<rect x="1110" y="700" width="176" height="128" fill="url(#dots)"/>
<path d="M1190 170l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#e3a843"/>
<path d="M200 720l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#b0512a" opacity=".7"/>
<ellipse cx="700" cy="846" rx="480" ry="24" fill="#2a1d10" opacity=".08"/>

<!-- exam paper -->
<g transform="rotate(-3 640 470)" filter="url(#soft)">
  <rect x="420" y="120" width="440" height="690" rx="10" fill="#fffdf7"/>
  <rect x="436" y="136" width="408" height="658" rx="5" fill="none" stroke="#93600f" stroke-opacity=".2" stroke-width="2"/>
  <text x="470" y="190" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.6" fill="#2b776e">PRACTICE ASSESSMENT</text>
  <path d="M470 208h250" stroke="#14293a" stroke-width="3" stroke-linecap="round"/>
  <rect x="470" y="232" width="340" height="72" rx="12" fill="#2b776e" fill-opacity=".1"/>
  <g stroke="#2b776e" stroke-opacity=".6" stroke-width="7" stroke-linecap="round"><path d="M490 258h290M490 280h200"/></g>
  <!-- checklist -->
  <g font-family="Manrope, 'Segoe UI', Arial, sans-serif">
    <g transform="translate(470 340)"><rect width="30" height="30" rx="8" fill="#2b776e"/><path d="M8 15l5 5 10-11" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 15h220" stroke="#14293a" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"/></g>
    <g transform="translate(470 392)"><rect width="30" height="30" rx="8" fill="#2b776e"/><path d="M8 15l5 5 10-11" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 15h180" stroke="#14293a" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"/></g>
    <g transform="translate(470 444)"><rect width="30" height="30" rx="8" fill="#2b776e"/><path d="M8 15l5 5 10-11" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 15h240" stroke="#14293a" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"/></g>
    <g transform="translate(470 496)"><rect width="30" height="30" rx="8" fill="none" stroke="#2b776e" stroke-width="3"/><path d="M48 15h200" stroke="#14293a" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"/></g>
  </g>
  <!-- plan boxes -->
  <g>
    <rect x="470" y="560" width="160" height="96" rx="10" fill="#ad6a12" fill-opacity=".12"/><rect x="650" y="560" width="160" height="96" rx="10" fill="#7a4a8c" fill-opacity=".1"/>
    <rect x="470" y="672" width="340" height="80" rx="10" fill="#3f7a3a" fill-opacity=".1"/>
    <g stroke="#14293a" stroke-opacity=".25" stroke-width="6" stroke-linecap="round"><path d="M490 590h110M490 612h80M490 634h100M670 590h110M670 612h90M670 634h70M490 700h290M490 724h200"/></g>
  </g>
</g>

<!-- timer -->
<g filter="url(#lift)">
  <rect x="1010" y="236" width="44" height="34" rx="8" fill="#14293a"/>
  <circle cx="1032" cy="420" r="150" fill="url(#clock)"/>
  <circle cx="1032" cy="420" r="124" fill="#fffdf7"/>
  <path d="M1032 296a124 124 0 1 1-107.4 186" fill="none" stroke="#e3a843" stroke-width="16" stroke-linecap="round" opacity=".9"/>
  <g stroke="#14293a" stroke-width="5" stroke-linecap="round" opacity=".5"><path d="M1032 316v18M1136 420h-18M1032 524v-18M928 420h18"/></g>
  <path d="M1032 420V346" stroke="#14293a" stroke-width="8" stroke-linecap="round"/>
  <path d="M1032 420l52 30" stroke="#b0512a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1032" cy="420" r="11" fill="#14293a"/>
  <text x="1032" y="486" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1" fill="#2b776e">90 MIN</text>
</g>

<!-- sticky -->
<g transform="rotate(-8 270 420)" filter="url(#lift)">
  <rect x="170" y="330" width="210" height="180" rx="6" fill="#f6d987"/>
  <path d="M170 336h210" stroke="#e8c15d" stroke-width="12"/>
  <text x="200" y="416" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="600" fill="#5a3d07">Plan</text>
  <text x="200" y="462" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="600" fill="#5a3d07">first!</text>
</g>

<!-- pencil -->
<g transform="rotate(-24 980 720)" filter="url(#lift)">
  <rect x="840" y="700" width="290" height="34" rx="6" fill="url(#pencil)"/>
  <rect x="1100" y="700" width="40" height="34" rx="6" fill="#e08f9a"/>
  <rect x="1088" y="700" width="16" height="34" fill="#c3c9cf"/>
  <path d="M840 700l-56 17 56 17z" fill="#e7cfa9"/>
  <path d="M800 712l-16 5 16 5z" fill="#14293a"/>
  <path d="M840 717h290" stroke="#b9821f" stroke-width="2" opacity=".6"/>
</g>
</svg>
