<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Discussion day: three speech bubbles in conversation — a question, a reason with “because”, and an idea that builds on another — beside a signed teamwork contract with a pen, and a laptop window showing an AI prompt built from four coloured parts.</title>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .36  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2a1d10" flood-opacity=".22"/></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".22"/></filter>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93600f" opacity=".22"/></pattern>
  <pattern id="lines" width="10" height="26" patternUnits="userSpaceOnUse"><path d="M0 25.5h10" stroke="#14293a" stroke-opacity=".07"/></pattern>
</defs>

<rect width="1400" height="933" fill="#f3ebdd"/>
<rect width="1400" height="933" fill="#f3ebdd" filter="url(#paper)" opacity=".9"/>
<circle cx="700" cy="470" r="400" fill="#f6e7c9" opacity=".75"/>
<circle cx="700" cy="470" r="436" fill="none" stroke="#93600f" stroke-opacity=".2" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
<rect x="96" y="96" width="176" height="128" fill="url(#dots)"/>
<rect x="1136" y="700" width="176" height="128" fill="url(#dots)"/>
<path d="M1190 150l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#e3a843"/>
<path d="M180 760l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#2b776e" opacity=".8"/>
<path d="M1260 400h34m-17-17v34" stroke="#b0512a" stroke-width="3" stroke-linecap="round" opacity=".6"/>

<!-- table shadow -->
<ellipse cx="700" cy="842" rx="520" ry="26" fill="#2a1d10" opacity=".08"/>

<!-- ===== teamwork contract (left) ===== -->
<g transform="rotate(-7 360 560)" filter="url(#soft)">
  <rect x="170" y="330" width="380" height="470" rx="8" fill="#fffdf7"/>
  <rect x="170" y="330" width="380" height="470" rx="8" fill="url(#lines)"/>
  <rect x="184" y="344" width="352" height="442" rx="4" fill="none" stroke="#93600f" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="226" cy="392" r="22" fill="#2b776e"/>
  <path d="M219 402v-22m0 1h13l-3 5 3 5h-13" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="260" y="386" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.5" fill="#2b776e">OUR AGREEMENT</text>
  <text x="260" y="412" font-family="Fraunces, Georgia, serif" font-size="25" font-weight="600" fill="#14293a">Teamwork contract</text>
  <path d="M200 434h320" stroke="#14293a" stroke-width="3"/>
  <g font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#3d505e">
    <text x="200" y="470">01  PURPOSE</text><text x="200" y="526">02  ROLES</text><text x="200" y="582">03  COMMUNICATION</text><text x="200" y="638">04  DEADLINES</text>
  </g>
  <g stroke="#14293a" stroke-opacity=".28" stroke-width="2" stroke-linecap="round">
    <path d="M200 488h300M200 504h240"/><path d="M200 544h280M200 560h300"/><path d="M200 600h260M200 616h200"/><path d="M200 656h290"/>
  </g>
  <!-- signatures -->
  <g fill="none" stroke="#1f3f8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M204 724c10-22 18-24 20-8s8 10 14-4 10-2 14 6 10-2 18-10"/>
    <path d="M316 726c6-18 14-26 18-12s-6 18 4 10 16-16 20-6 6 8 16-2"/>
    <path d="M428 722c12-6 14-24 22-14s0 22 10 12 14-4 18 2"/>
  </g>
  <path d="M200 740h92M312 740h92M424 740h92" stroke="#14293a" stroke-width="1.8"/>
  <!-- stamp -->
  <g transform="translate(0 150) rotate(-16 470 470)" opacity=".85">
    <circle cx="470" cy="470" r="46" fill="none" stroke="#b0312a" stroke-width="4"/>
    <circle cx="470" cy="470" r="38" fill="none" stroke="#b0312a" stroke-width="1.6"/>
    <text x="470" y="476" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2.4" fill="#b0312a">AGREED</text>
  </g>
</g>
<!-- pen -->
<g transform="translate(40 24) rotate(32 600 760)" filter="url(#lift)">
  <rect x="460" y="748" width="230" height="22" rx="11" fill="#ce9531"/>
  <path d="M690 748l40 11-40 11z" fill="#14293a"/>
  <rect x="470" y="748" width="10" height="22" fill="#14293a" opacity=".85"/>
  <rect x="560" y="744" width="70" height="7" rx="3.5" fill="#c6ccd1"/>
</g>

<!-- ===== laptop with prompt (right) ===== -->
<g filter="url(#soft)" transform="translate(64 56)">
  <path d="M800 690h470l46 58H754z" fill="#c6ccd1"/>
  <rect x="754" y="744" width="562" height="16" rx="8" fill="#a3abb3"/>
  <path d="M990 704h90l8 10h-106z" fill="#9aa2aa"/>
  <rect x="812" y="380" width="446" height="312" rx="16" fill="#26323d"/>
  <rect x="828" y="396" width="414" height="280" rx="8" fill="#182e41"/>
  <circle cx="850" cy="416" r="5.5" fill="#e76f51"/><circle cx="868" cy="416" r="5.5" fill="#e3a843"/><circle cx="886" cy="416" r="5.5" fill="#6fbf8b"/>
  <text x="908" y="421" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2.2" fill="#9fb1bd">YOUR PROMPT</text>
  <g font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#fff">
    <rect x="848" y="444" width="150" height="26" rx="6" fill="#ad6a12" fill-opacity=".85"/><text x="858" y="462">Act as an expert…</text>
    <rect x="1006" y="444" width="214" height="26" rx="6" fill="#2b776e" fill-opacity=".9"/><text x="1016" y="462">Provide five solutions…</text>
    <rect x="848" y="478" width="228" height="26" rx="6" fill="#3a58a0" fill-opacity=".95"/><text x="858" y="496">Focus on restaurants…</text>
    <rect x="1084" y="478" width="136" height="26" rx="6" fill="#7a4a8c" fill-opacity=".95"/><text x="1094" y="496">Include steps.</text>
  </g>
  <!-- AI reply -->
  <circle cx="862" cy="548" r="15" fill="#4b6bb7"/>
  <text x="862" y="553" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" fill="#fff">AI</text>
  <rect x="886" y="530" width="330" height="118" rx="12" fill="#22394d"/>
  <g stroke="#9fb1bd" stroke-width="7" stroke-linecap="round" opacity=".7"><path d="M906 556h220"/><path d="M906 578h282"/><path d="M906 600h190"/><path d="M906 622h250"/></g>
  <!-- meter -->
  <rect x="848" y="660" width="0" height="0"/>
</g>

<!-- ===== speech bubbles (centre, overlapping) ===== -->
<g filter="url(#soft)">
  <!-- clarify (teal) -->
  <path d="M520 130h250a46 46 0 0 1 46 46v96a46 46 0 0 1-46 46H612l-54 46 10-46h-48a46 46 0 0 1-46-46v-96a46 46 0 0 1 46-46z" fill="#2e7a70"/>
  <text x="645" y="226" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="40" font-weight="600" fill="#fff">So, you mean…?</text>
  <text x="645" y="268" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.6" fill="#cfe9e4">CLARIFY</text>
</g>
<g filter="url(#soft)">
  <!-- justify (clay) -->
  <path d="M642 300h232a46 46 0 0 1 46 46v96a46 46 0 0 1-46 46h-40l12 50-58-50H642a46 46 0 0 1-46-46v-96a46 46 0 0 1 46-46z" fill="#ba5830"/>
  <text x="758" y="394" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="600" fill="#fff">For me… because…</text>
  <text x="758" y="436" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.6" fill="#fadccd">JUSTIFY</text>
</g>
<g filter="url(#soft)">
  <!-- build on (blue) -->
  <path d="M590 512h232a46 46 0 0 1 46 46v86a46 46 0 0 1-46 46H682l-58 44 14-44h-48a46 46 0 0 1-46-46v-86a46 46 0 0 1 46-46z" fill="#3d5aa2"/>
  <text x="706" y="600" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#fff">Like you said…</text>
  <text x="706" y="640" text-anchor="middle" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.6" fill="#d6def3">BUILD ON IT</text>
</g>
<!-- connector dots between ideas -->
<g fill="#93600f" opacity=".5"><circle cx="1000" cy="252" r="5"/><circle cx="1024" cy="236" r="4"/><circle cx="1044" cy="224" r="3"/></g>
<path d="M454 300c-30 30-36 66-20 104" fill="none" stroke="#93600f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 9" opacity=".6"/>
</svg>
