<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="nt">
<title id="nt">Four negotiation skills in an academic discussion: 1 asking for clarification (So, you’re saying that…?), 2 asking for opinions and justification (Why are you so firm with that choice?), 3 giving and justifying opinions (For me, … because…), 4 building on others’ contributions (Like you said before about…). Together they build shared understanding.</title>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".14"/></filter></defs>
<rect width="960" height="330" rx="22" fill="#fffdf8"/>
<path d="M120 262C260 300 700 300 840 262" fill="none" stroke="#93600f" stroke-opacity=".35" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>
<g filter="url(#sh)">
<path d="M28 40h192a20 20 0 0 1 20 20v128a20 20 0 0 1-20 20H96l-26 26 4-26H48a20 20 0 0 1-20-20V60a20 20 0 0 1 20-20z" fill="#fff" stroke="#cfe3df"/>
<path d="M260 40h192a20 20 0 0 1 20 20v128a20 20 0 0 1-20 20H330l-26 26 4-26h-28a20 20 0 0 1-20-20V60a20 20 0 0 1 20-20z" fill="#fff" stroke="#e3daf3"/>
<path d="M492 40h192a20 20 0 0 1 20 20v128a20 20 0 0 1-20 20H562l-26 26 4-26h-28a20 20 0 0 1-20-20V60a20 20 0 0 1 20-20z" fill="#fff" stroke="#f1d6c8"/>
<path d="M724 40h192a20 20 0 0 1 20 20v128a20 20 0 0 1-20 20H794l-26 26 4-26h-28a20 20 0 0 1-20-20V60a20 20 0 0 1 20-20z" fill="#fff" stroke="#d6def3"/>
</g>
<rect x="28" y="40" width="212" height="8" rx="4" fill="#2b776e"/><rect x="260" y="40" width="212" height="8" rx="4" fill="#7a4a8c"/><rect x="492" y="40" width="212" height="8" rx="4" fill="#b0512a"/><rect x="724" y="40" width="212" height="8" rx="4" fill="#3a58a0"/>
<g font-size="15" font-weight="800" fill="#fff" text-anchor="middle"><circle cx="60" cy="80" r="17" fill="#2b776e"/><text x="60" y="85">1</text><circle cx="292" cy="80" r="17" fill="#7a4a8c"/><text x="292" y="85">2</text><circle cx="524" cy="80" r="17" fill="#b0512a"/><text x="524" y="85">3</text><circle cx="756" cy="80" r="17" fill="#3a58a0"/><text x="756" y="85">4</text></g>
<g font-size="16.5" font-weight="800" fill="#14293a"><text x="86" y="78">Ask for</text><text x="86" y="97">clarification</text><text x="318" y="78">Ask for opinions</text><text x="318" y="97">+ justification</text><text x="550" y="78">Give + justify</text><text x="550" y="97">opinions</text><text x="782" y="78">Build on others’</text><text x="782" y="97">contributions</text></g>
<g font-family="Fraunces, Georgia, serif" font-style="italic" font-size="17" fill="#3d505e">
<text x="48" y="140">“So, you’re saying</text><text x="48" y="162">that…?”</text>
<text x="280" y="140">“Why are you so firm</text><text x="280" y="162">with that choice?”</text>
<text x="512" y="140">“For me, …</text><text x="512" y="162">because…”</text>
<text x="744" y="140">“Like you said</text><text x="744" y="162">before about…”</text></g>
<g font-size="12" font-weight="700" fill="#6b7882"><text x="48" y="192">Check you understand</text><text x="280" y="192">Invite ideas and reasons</text><text x="512" y="192">Opinion + reason + example</text><text x="744" y="192">Link, agree, oppose, sum up</text></g>
<rect x="330" y="282" width="300" height="34" rx="17" fill="#14293a"/>
<text x="480" y="304" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="2" fill="#e3a843">= SHARED UNDERSTANDING</text>
</svg>
