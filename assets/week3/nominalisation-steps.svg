<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="nt">
<title id="nt">How to nominalise in four steps. Step 1: find the verb or adjective — The council established new centres. Step 2: make it a noun — establish becomes establishment. Step 3: build the noun phrase — The establishment of new centres. Step 4: add new information — The establishment of new centres was welcomed by the community. Common noun endings: -tion, -sion, -ment, -ance, -ence, -ity, -ness, -al.</title>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".12"/></filter>
  </defs>
<rect width="1040" height="470" rx="24" fill="#fffdf8"/>
<text x="40" y="52" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600" fill="#14293a">How to nominalise — 4 steps</text>
<text x="40" y="78" font-size="14" fill="#6b7882">From a verb sentence to an academic noun phrase</text>

<!-- connectors -->
<g fill="none" stroke="#c9bfae" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"><path d="M268 200h18"/><path d="M516 200h18"/><path d="M764 200h18"/></g>
<g fill="#c9bfae"><path d="M290 194l10 6-10 6z"/><path d="M538 194l10 6-10 6z"/><path d="M786 194l10 6-10 6z"/></g>

<!-- cards -->
<g filter="url(#sh)">
  <rect x="40" y="104" width="226" height="210" rx="18" fill="#fff"/>
  <rect x="290" y="104" width="226" height="210" rx="18" fill="#fff" transform="translate(-2 0)"/>
  <rect x="538" y="104" width="226" height="210" rx="18" fill="#fff"/>
  <rect x="786" y="104" width="214" height="210" rx="18" fill="#fff"/>
</g>
<g>
  <rect x="40" y="104" width="226" height="8" rx="4" fill="#ba781b"/><rect x="288" y="104" width="226" height="8" rx="4" fill="#328379"/>
  <rect x="538" y="104" width="226" height="8" rx="4" fill="#4262ac"/><rect x="786" y="104" width="214" height="8" rx="4" fill="#845496"/>
</g>
<g font-size="15" font-weight="800" fill="#fff" text-anchor="middle">
  <circle cx="72" cy="146" r="17" fill="#ba781b"/><text x="72" y="151">1</text>
  <circle cx="320" cy="146" r="17" fill="#328379"/><text x="320" y="151">2</text>
  <circle cx="570" cy="146" r="17" fill="#4262ac"/><text x="570" y="151">3</text>
  <circle cx="818" cy="146" r="17" fill="#845496"/><text x="818" y="151">4</text>
</g>
<g font-size="16" font-weight="800" fill="#14293a">
  <text x="98" y="142">Find the verb</text><text x="98" y="161">or adjective</text>
  <text x="346" y="142">Make it</text><text x="346" y="161">a noun</text>
  <text x="596" y="142">Build the</text><text x="596" y="161">noun phrase</text>
  <text x="844" y="142">Add new</text><text x="844" y="161">information</text>
</g>
<!-- examples -->
<g font-family="Fraunces, Georgia, serif" font-size="17" fill="#3d505e">
  <text x="60" y="214">The council</text>
  <rect x="58" y="226" width="104" height="28" rx="7" fill="#ad6a12" fill-opacity=".14"/>
  <text x="64" y="246" fill="#8a520b" font-weight="600">established</text>
  <text x="60" y="280">new centres.</text>

  <text x="308" y="226" font-weight="600" fill="#2b776e">establish</text>
  <path d="M330 240v22" stroke="#2b776e" stroke-width="2.4" stroke-linecap="round"/><path d="M324 256l6 8 6-8" fill="none" stroke="#2b776e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="308" y="292" font-weight="600" fill="#14293a">establish<tspan fill="#2b776e" font-weight="700">ment</tspan></text>

  <text x="558" y="214" fill="#6b7882">the + noun + of …</text>
  <rect x="556" y="232" width="190" height="62" rx="9" fill="#3a58a0" fill-opacity=".1"/>
  <text x="566" y="256" fill="#2f4a8c">The <tspan font-weight="600">establishment</tspan></text>
  <text x="566" y="282" fill="#2f4a8c">of new centres</text>

  <text x="806" y="210" fill="#2f4a8c" font-size="15">The establishment of</text>
  <text x="806" y="230" fill="#2f4a8c" font-size="15">new centres</text>
  <rect x="804" y="244" width="182" height="54" rx="9" fill="#7a4a8c" fill-opacity=".12"/>
  <text x="814" y="266" fill="#5e3570" font-size="15" font-weight="600">was welcomed by</text>
  <text x="814" y="288" fill="#5e3570" font-size="15" font-weight="600">the community.</text>
</g>

<!-- endings -->
<text x="40" y="364" font-size="12" font-weight="800" letter-spacing="2.4" fill="#6b7882">COMMON NOUN ENDINGS</text>
<g font-size="15" font-weight="700">
  <g transform="translate(40 380)"><rect width="74" height="34" rx="17" fill="#2b776e" fill-opacity=".12"/><text x="37" y="22" text-anchor="middle" fill="#22655d">-tion</text></g>
  <g transform="translate(124 380)"><rect width="74" height="34" rx="17" fill="#2b776e" fill-opacity=".12"/><text x="37" y="22" text-anchor="middle" fill="#22655d">-sion</text></g>
  <g transform="translate(208 380)"><rect width="80" height="34" rx="17" fill="#2b776e" fill-opacity=".12"/><text x="40" y="22" text-anchor="middle" fill="#22655d">-ment</text></g>
  <g transform="translate(298 380)"><rect width="122" height="34" rx="17" fill="#2b776e" fill-opacity=".12"/><text x="61" y="22" text-anchor="middle" fill="#22655d">-ance / -ence</text></g>
  <g transform="translate(430 380)"><rect width="60" height="34" rx="17" fill="#2b776e" fill-opacity=".12"/><text x="30" y="22" text-anchor="middle" fill="#22655d">-ity</text></g>
  <g transform="translate(500 380)"><rect width="76" height="34" rx="17" fill="#2b776e" fill-opacity=".12"/><text x="38" y="22" text-anchor="middle" fill="#22655d">-ness</text></g>
  <g transform="translate(586 380)"><rect width="56" height="34" rx="17" fill="#2b776e" fill-opacity=".12"/><text x="28" y="22" text-anchor="middle" fill="#22655d">-al</text></g>
  <g transform="translate(652 380)"><rect width="56" height="34" rx="17" fill="#2b776e" fill-opacity=".12"/><text x="28" y="22" text-anchor="middle" fill="#22655d">-y</text></g>
</g>
<g font-size="13" fill="#6b7882"><text x="730" y="394">decide → decision · react → reaction</text><text x="730" y="414">feasible → feasibility · aware → awareness</text></g>
<text x="40" y="450" font-size="13" fill="#3d505e"><tspan font-weight="800" fill="#7a4a8c">Tip:</tspan> a verb after the noun becomes <tspan font-weight="800">-ing</tspan> — the importance <tspan font-weight="800">of educating</tspan> · the effectiveness of composting <tspan font-weight="800">in reducing</tspan> waste</text>
</svg>
