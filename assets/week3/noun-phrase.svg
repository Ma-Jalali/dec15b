<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="npt">
<title id="npt">Anatomy of a noun phrase. Food waste contributes significantly to food insecurity becomes: the significant (pre-modifier: article and adjective) contribution (head noun, often a nominalisation) of food waste to food insecurity (post-modifier: prepositional phrase). The whole phrase is now the subject: The significant contribution of food waste to food insecurity is a serious concern.</title>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".14"/></filter>
  <linearGradient id="head" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e7b24f"/><stop offset="1" stop-color="#d39a33"/></linearGradient>
</defs>
<rect width="1040" height="360" rx="24" fill="#fffdf8"/>
<text x="40" y="52" font-size="12" font-weight="800" letter-spacing="2.4" fill="#6b7882">VERB SENTENCE</text>
<text x="40" y="80" font-family="Fraunces, Georgia, serif" font-size="21" fill="#3d505e">Food waste <tspan fill="#b0512a" font-weight="600">contributes</tspan> significantly to food insecurity.</text>
<g fill="none" stroke="#b0512a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M200 92c10 18 20 28 40 34"/><path d="M232 118l9 8-11 4"/></g>
<text x="258" y="130" font-size="13" font-weight="700" fill="#b0512a">nominalise: contribute → contribution</text>

<!-- phrase -->
<g filter="url(#sh)">
  <rect x="40" y="156" width="230" height="74" rx="16" fill="#eef1fa"/>
  <rect x="282" y="148" width="250" height="90" rx="18" fill="url(#head)"/>
  <rect x="544" y="156" width="456" height="74" rx="16" fill="#e9f4f2"/>
</g>
<g font-family="Fraunces, Georgia, serif" font-size="26" text-anchor="middle">
  <text x="155" y="202" fill="#2f4a8c">the significant</text>
  <text x="407" y="201" fill="#14293a" font-weight="600">contribution</text>
  <text x="772" y="202" fill="#22655d">of food waste to food insecurity</text>
</g>
<!-- brackets -->
<g fill="none" stroke-width="2.2" stroke-linecap="round">
  <path d="M48 246v10h214v-10" stroke="#3a58a0"/><path d="M290 254v10h234v-10" stroke="#ad6a12"/><path d="M552 246v10h440v-10" stroke="#2b776e"/>
</g>
<g font-size="12" font-weight="800" letter-spacing="2.2" text-anchor="middle">
  <text x="155" y="282" fill="#3a58a0">PRE-MODIFIER</text><text x="407" y="290" fill="#ad6a12">HEAD NOUN</text><text x="772" y="282" fill="#2b776e">POST-MODIFIER</text>
</g>
<g font-size="13" fill="#6b7882" text-anchor="middle">
  <text x="155" y="302">article · adjective · noun</text>
  <text x="407" y="310">ONE main noun — often a nominalisation</text>
  <text x="772" y="302">prepositional phrase (of…, in…, to…) · relative / participle clause</text>
</g>
<text x="40" y="340" font-size="14" fill="#3d505e"><tspan font-weight="800" fill="#14293a">Now it is the subject:</tspan> the significant contribution of food waste to food insecurity <tspan font-weight="800" fill="#7a4a8c">is a serious concern.</tspan></text>
</svg>
