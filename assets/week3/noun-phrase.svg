<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Manrope, 'Segoe UI', Arial, sans-serif">
<rect width="760" height="300" fill="#fffdf8"/>
<g font-size="14" fill="#3d505e">
<text x="30" y="34">Food waste <tspan font-weight="800" fill="#b0512a">contributes</tspan> significantly to food insecurity.</text>

<path d="M330 46c0 18 0 18 0 30" stroke="#c9bfae" stroke-width="2" fill="none"/><path d="m324 70 6 9 6-9" fill="none" stroke="#c9bfae" stroke-width="2"/>
<text x="350" y="68" fill="#6b7882" font-size="12.5">nominalisation: contribute → contribution</text>
</g>
<g>
<rect x="30" y="92" width="190" height="78" rx="12" fill="#eef1f6" stroke="#cfd7e6"/>
<rect x="232" y="92" width="196" height="78" rx="12" fill="#e3a843"/>
<rect x="440" y="92" width="290" height="78" rx="12" fill="#e9f4f2" stroke="#c4e0da"/>
</g>
<g text-anchor="middle">
<text x="125" y="124" font-size="20" fill="#14293a" font-family="Fraunces, Georgia, 'Times New Roman', serif">The significant</text>
<text x="330" y="124" font-size="21" font-weight="700" fill="#14293a" font-family="Fraunces, Georgia, 'Times New Roman', serif">contribution</text>
<text x="585" y="124" font-size="19" fill="#14293a" font-family="Fraunces, Georgia, 'Times New Roman', serif">of food waste to food insecurity</text>
<text x="125" y="154" font-size="10.5" font-weight="800" letter-spacing="1.4" fill="#3a58a0">PRE-MODIFIER</text>
<text x="330" y="154" font-size="10.5" font-weight="800" letter-spacing="1.4" fill="#14293a">HEAD NOUN</text>
<text x="585" y="154" font-size="10.5" font-weight="800" letter-spacing="1.4" fill="#2b776e">POST-MODIFIER</text>
</g>
<g font-size="12.5" fill="#3d505e" text-anchor="middle">
<text x="125" y="196">article · adjective · noun</text><text x="125" y="214">(the, a, this, significant)</text>
<text x="330" y="196">one main noun —</text><text x="330" y="214">often a nominalisation</text>
<text x="585" y="196">prepositional phrase (of…, in…, to…)</text><text x="585" y="214">or relative / participle clause</text>
</g>
<path d="M30 236h700" stroke="#e7dfcf"/>
<text x="30" y="266" font-size="14" fill="#3d505e"><tspan font-weight="800" fill="#14293a">The significant contribution of food waste to food insecurity</tspan> is a serious concern.</text>
<text x="30" y="288" font-size="12" fill="#6b7882">The whole first sentence is now the subject — so you can add new information at the end.</text>
</svg>
