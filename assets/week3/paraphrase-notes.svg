<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="pnt">
<title id="pnt">Paraphrase from your notes, not from the text. Step 1: read and take short notes of key words. Step 2: close the reading and look only at your notes; this stops you copying. Step 3: write with new words and a new structure, for example occur becomes happen, reduce becomes cut, active becomes passive, verb becomes noun. Step 4: add the citation: Nicastro and Carillo (2021) or (Nicastro and Carillo, 2021).</title>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
</defs>
<rect width="1040" height="400" rx="24" fill="#fffdf8"/>
<rect x="912" y="22" width="100" height="56" fill="url(#dots)"/>
<text x="40" y="54" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600" fill="#14293a">Paraphrase from your notes</text>
<path d="M40 64c70-5 180-5 290-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="90" font-size="14" fill="#6b7882">Not from the text. Four moves, every time.</text>

<g fill="none" stroke="#c9bfae" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"><path d="M268 230h20M516 230h20M764 230h20"/></g>
<g fill="#c9bfae"><path d="M290 224l10 6-10 6z"/><path d="M538 224l10 6-10 6z"/><path d="M786 224l10 6-10 6z"/></g>

<g filter="url(#sh)"><rect x="40" y="114" width="226" height="246" rx="18" fill="#fff"/><rect x="288" y="114" width="226" height="246" rx="18" fill="#fff"/><rect x="538" y="114" width="226" height="246" rx="18" fill="#fff"/><rect x="786" y="114" width="214" height="246" rx="18" fill="#fff"/></g>
<g><rect x="40" y="114" width="226" height="7" rx="3.5" fill="#ad6a12"/><rect x="288" y="114" width="226" height="7" rx="3.5" fill="#b0512a"/><rect x="538" y="114" width="226" height="7" rx="3.5" fill="#2b776e"/><rect x="786" y="114" width="214" height="7" rx="3.5" fill="#3a58a0"/></g>
<g font-size="15" font-weight="800" fill="#fff" text-anchor="middle">
  <circle cx="70" cy="152" r="16" fill="#ad6a12"/><text x="70" y="157">1</text><circle cx="318" cy="152" r="16" fill="#b0512a"/><text x="318" y="157">2</text>
  <circle cx="568" cy="152" r="16" fill="#2b776e"/><text x="568" y="157">3</text><circle cx="812" cy="152" r="16" fill="#3a58a0"/><text x="812" y="157">4</text>
</g>
<g font-size="15.5" font-weight="800" fill="#14293a"><text x="96" y="158">Take short notes</text><text x="344" y="158">Close the text</text><text x="594" y="158">New words + structure</text><text x="842" y="158">Add the citation</text></g>

<!-- 1 notes card -->
<g transform="rotate(-3 150 250)"><rect x="70" y="182" width="164" height="132" rx="8" fill="#fff6dc" stroke="#f0e2b6"/>
<g stroke="#e8cf8c" stroke-width="1.2"><path d="M80 208h144M80 232h144M80 256h144M80 280h144"/></g>
<g font-size="13" font-weight="700" fill="#8a520b"><text x="84" y="204">food loss</text><text x="84" y="228">→ production stage</text><text x="84" y="252">low-income countries</text><text x="84" y="276">waste → consumers</text></g></g>
<text x="153" y="342" text-anchor="middle" font-size="12" fill="#6b7882">key words only</text>

<!-- 2 closed book -->
<g transform="translate(401 236)">
  <ellipse cx="0" cy="62" rx="72" ry="8" fill="#14293a" opacity=".07"/>
  <rect x="-62" y="-34" width="124" height="86" rx="8" fill="#b0512a"/><rect x="-54" y="-26" width="108" height="70" rx="5" fill="#c86a42"/>
  <rect x="-30" y="-6" width="60" height="18" rx="4" fill="#fbefe8"/><path d="M-20 3h40" stroke="#b0512a" stroke-width="2" stroke-linecap="round"/>
  <path d="M28 -34v26l9-6 9 6v-26" fill="#e3a843"/>
</g>
<text x="401" y="330" text-anchor="middle" font-size="12.5" fill="#3d505e">Look only at your notes.</text>
<text x="401" y="347" text-anchor="middle" font-size="12" fill="#6b7882">This stops you copying.</text>

<!-- 3 changes -->
<g font-size="13.5">
  <g transform="translate(560 186)"><rect width="182" height="30" rx="15" fill="#e9f4f2"/><text x="14" y="20" fill="#3d505e">occur <tspan fill="#2b776e" font-weight="800">→ happen</tspan></text></g>
  <g transform="translate(560 224)"><rect width="182" height="30" rx="15" fill="#e9f4f2"/><text x="14" y="20" fill="#3d505e">reduce <tspan fill="#2b776e" font-weight="800">→ cut</tspan></text></g>
  <g transform="translate(560 262)"><rect width="182" height="30" rx="15" fill="#eef1fa"/><text x="14" y="20" fill="#3d505e">active <tspan fill="#3a58a0" font-weight="800">→ passive</tspan></text></g>
  <g transform="translate(560 300)"><rect width="182" height="30" rx="15" fill="#eef1fa"/><text x="14" y="20" fill="#3d505e">verb <tspan fill="#3a58a0" font-weight="800">→ noun</tspan></text></g>
</g>


<!-- 4 citation -->
<g font-family="Fraunces, Georgia, serif" font-size="13.5">
  <rect x="800" y="190" width="186" height="56" rx="10" fill="#eef1fa"/><text x="812" y="213" fill="#6b7882" font-family="Manrope, sans-serif" font-size="11" font-weight="800" letter-spacing="1.3">NARRATIVE</text><text x="812" y="235" fill="#2f4a8c">Nicastro and Carillo (2021)</text>
  <rect x="800" y="256" width="186" height="56" rx="10" fill="#eef1fa"/><text x="812" y="279" fill="#6b7882" font-family="Manrope, sans-serif" font-size="11" font-weight="800" letter-spacing="1.3">IN BRACKETS</text><text x="812" y="301" fill="#2f4a8c">(Nicastro &amp; Carillo, 2021)</text>
</g>
<text x="893" y="340" text-anchor="middle" font-size="12" fill="#6b7882">“and” outside · “&amp;” inside</text>
<path d="M990 44l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e3a843"/>
</svg>
