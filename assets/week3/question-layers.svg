<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="qlt">
<title id="qlt">Read the question in three layers. Worked example, the Week 3 Day 1 question: How critical is addressing food waste as a strategy to combat global food insecurity? Layer 1, topic words: food waste, food insecurity. Layer 2, limiting words: critical, meaning how important; food waste, this one cause is the focus, not every cause of food insecurity. Layer 3, rhetorical function: explain the causal relationships between food waste and food insecurity, evaluate how important reducing food waste is, and take a position.</title>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
</defs>
<rect width="1040" height="430" rx="24" fill="#fffdf8"/>
<rect x="910" y="22" width="100" height="56" fill="url(#dots)"/>
<text x="40" y="54" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600" fill="#14293a">Read the question in three layers</text>
<path d="M40 64c90-5 240-5 390-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="90" font-size="14" fill="#6b7882">Worked example: the Week 3, Day 1 essay question.</text>

<!-- question card -->
<g filter="url(#sh)"><rect x="40" y="108" width="960" height="92" rx="18" fill="#14293a"/></g>
<text x="66" y="134" font-size="11" font-weight="800" letter-spacing="2" fill="#e3a843">ESSAY QUESTION</text>
<text x="66" y="178" font-family="Fraunces, Georgia, serif" font-size="24" fill="#dfe6eb"><tspan fill="#d9b8e6" font-weight="600">How</tspan> <tspan fill="#8fd6c9" font-weight="600">critical</tspan> is addressing <tspan fill="#f1c675" font-weight="600">food waste</tspan> as a strategy to combat global <tspan fill="#f1c675" font-weight="600">food insecurity</tspan>?</text>
<g font-size="11.5" font-weight="700" fill="#c7d3db"><circle cx="694" cy="130" r="5" fill="#f1c675"/><text x="704" y="134">topic</text><circle cx="760" cy="130" r="5" fill="#8fd6c9"/><text x="770" y="134">limiting</text><circle cx="842" cy="130" r="5" fill="#d9b8e6"/><text x="852" y="134">function (the task)</text></g>
<!-- three layer cards -->
<g filter="url(#sh)"><rect x="40" y="250" width="300" height="160" rx="16" fill="#fff"/><rect x="370" y="250" width="300" height="160" rx="16" fill="#fff"/><rect x="700" y="250" width="300" height="160" rx="16" fill="#fff"/></g>
<g><rect x="40" y="250" width="300" height="6" rx="3" fill="#ad6a12"/><rect x="370" y="250" width="300" height="6" rx="3" fill="#2b776e"/><rect x="700" y="250" width="300" height="6" rx="3" fill="#7a4a8c"/></g>
<g font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><circle cx="70" cy="286" r="15" fill="#ad6a12"/><text x="70" y="291">1</text><circle cx="400" cy="286" r="15" fill="#2b776e"/><text x="400" y="291">2</text><circle cx="730" cy="286" r="15" fill="#7a4a8c"/><text x="730" y="291">3</text></g>
<g font-size="15.5" font-weight="800" fill="#14293a"><text x="94" y="283">Topic words</text><text x="424" y="283">Limiting words</text><text x="754" y="283">Rhetorical function</text></g>
<g font-size="12" fill="#6b7882"><text x="94" y="300">what you write about</text><text x="424" y="300">the narrow focus</text><text x="754" y="300">what you must do</text></g>
<g font-size="13.5" fill="#3d505e">
  <rect x="60" y="318" width="102" height="28" rx="6" fill="#e3a843" opacity=".3"/><text x="70" y="337" fill="#8a520b" font-weight="700">food waste</text>
  <rect x="170" y="318" width="132" height="28" rx="6" fill="#e3a843" opacity=".3"/><text x="180" y="337" fill="#8a520b" font-weight="700">food insecurity</text>
  <text x="60" y="376">the two ideas your essay</text><text x="60" y="394">connects</text>
  <text x="390" y="336"><tspan font-weight="800" fill="#22655d">critical</tspan> = how important</text>
  <text x="390" y="360"><tspan font-weight="800" fill="#22655d">food waste</tspan> = this one cause</text>
  <text x="390" y="378">is the focus, not every cause</text><text x="390" y="396">of food insecurity</text>
  <text x="720" y="336"><tspan font-weight="800" fill="#5e3570">Explain</tspan> the causal links</text>
  <text x="720" y="360"><tspan font-weight="800" fill="#5e3570">Evaluate</tspan> how important</text>
  <text x="720" y="378">reducing food waste is</text>
  <text x="720" y="400" font-weight="800" fill="#5e3570">Take a position</text>
</g>
<path d="M992 44l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e3a843"/>
</svg>
