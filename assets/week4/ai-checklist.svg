<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="act">
<title id="act">Checklist for evaluating AI-generated text, in four parts. Accuracy and reliability: are the facts correct? Balance and bias: whose views are missing? Objectivity and language: neutral or emotional words? Citations and evidence: can you check the sources?</title>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
  <g id="box"><rect x="-13" y="-13" width="26" height="26" rx="7" fill="#fff" stroke-width="2.5"/></g>
</defs>
<rect width="1040" height="520" rx="24" fill="#fffdf8"/>
<rect x="910" y="22" width="100" height="56" fill="url(#dots)"/>
<text x="40" y="56" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600" fill="#14293a">Checklist for evaluating AI-generated text</text>
<path d="M40 68c160-5 360-5 540-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="96" font-size="16" fill="#5d6a74">Ask four questions before you trust or use an AI answer.</text>

<g filter="url(#sh)">
  <rect x="40" y="124" width="470" height="170" rx="20" fill="#fff"/><rect x="530" y="124" width="470" height="170" rx="20" fill="#fff"/>
  <rect x="40" y="314" width="470" height="170" rx="20" fill="#fff"/><rect x="530" y="314" width="470" height="170" rx="20" fill="#fff"/>
</g>
<rect x="40" y="124" width="8" height="170" rx="4" fill="#2b776e"/><rect x="530" y="124" width="8" height="170" rx="4" fill="#7a4a8c"/>
<rect x="40" y="314" width="8" height="170" rx="4" fill="#3a58a0"/><rect x="530" y="314" width="8" height="170" rx="4" fill="#b0512a"/>

<!-- icons -->
<g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(110 209)"><circle r="38" fill="#e9f4f2" stroke="none"/><circle cx="-3" cy="-3" r="13" stroke="#2b776e"/><path d="M7 7l11 11M-9-3l4 4 8-8" stroke="#2b776e"/></g>
  <g transform="translate(600 209)"><circle r="38" fill="#f6eff8" stroke="none"/><path d="M0-18v34M-12 16h24M-18-12h36" stroke="#7a4a8c"/><path d="M-18-12l-8 16a8 4 0 0 0 16 0zM18-12l-8 16a8 4 0 0 0 16 0z" stroke="#7a4a8c"/></g>
  <g transform="translate(110 399)"><circle r="38" fill="#edf1fa" stroke="none"/><path d="M-18-12h28v18H-6l-8 7v-7h-4z" stroke="#3a58a0"/><path d="M14-4h6v18h-4v6l-7-6H0" stroke="#3a58a0"/><path d="M-12-4h16M-12 2h10" stroke="#3a58a0" stroke-width="2.2"/></g>
  <g transform="translate(600 399)"><circle r="38" fill="#fbefe8" stroke="none"/><path d="M-14-18h18l8 8v28h-26z" stroke="#b0512a"/><path d="M4-18v8h8M-8-2h14M-8 6h14" stroke="#b0512a"/><path d="M-20 12c4-6 8-6 10 0" stroke="#b0512a"/></g>
</g>
<g font-family="Fraunces, Georgia, serif" font-size="23" font-weight="600" fill="#14293a">
  <text x="168" y="198">Accuracy &amp; reliability</text><text x="658" y="198">Balance &amp; bias</text>
  <text x="168" y="388">Objectivity &amp; language</text><text x="658" y="388">Citations &amp; evidence</text>
</g>
<g font-size="18" fill="#3d505e" font-style="italic">
  <text x="168" y="232">Are the facts correct?</text><text x="658" y="232">Whose views are missing?</text>
  <text x="168" y="422">Neutral or emotional words?</text><text x="658" y="422">Can you check the sources?</text>
</g>
<use href="#box" x="472" y="160" stroke="#2b776e"/><use href="#box" x="962" y="160" stroke="#7a4a8c"/><use href="#box" x="472" y="350" stroke="#3a58a0"/><use href="#box" x="962" y="350" stroke="#b0512a"/>

