<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 804" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="apt">
<title id="apt">Four app functions, adapted from Castro et al. (2023). 1, Smart inventory: create grocery lists from past use and current stock; scan barcodes; how to store food; when food should really be thrown away; an overview of food in stock; statistics on past waste, including money and environment. 2, Smart recipes: recipes from your inventory and soon-to-expire food; track leftovers for creative reuse; adjust recipes to ideal portions. 3, Food-sharing hub: manage a shared inventory in your flat; a digital marketplace to share leftovers with the community; see and rate profiles of other sharers. 4, Portion-ready food delivery: ingredients for specific meals delivered to your door; how to store items; when items should be thrown away.</title>
