<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="cvt">
<title id="cvt">Explaining results: how certain is the writer? A certainty meter runs from less certain on the left to more certain on the right. Most cautious, on the left: the results might indicate; the results may suggest; the results could indicate. In the middle, cautious: the results suggest; the results indicate. On the right, certain: the results show; the results mean. Note: add may, might or could to lower certainty.</title>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
</defs>
<rect width="1040" height="500" rx="24" fill="#fffdf8"/>
<rect x="910" y="22" width="100" height="56" fill="url(#dots)"/>
<text x="40" y="56" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600" fill="#14293a">Explaining results: how certain is the writer?</text>
<path d="M40 68c160-5 400-5 600-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="96" font-size="16" fill="#5d6a74">The same result can be reported with more or less certainty.</text>

<!-- cards -->
<g filter="url(#sh)">
  <rect x="40" y="124" width="310" height="176" rx="18" fill="#fff"/>
  <rect x="372" y="124" width="296" height="176" rx="18" fill="#fff"/>
  <rect x="690" y="124" width="310" height="176" rx="18" fill="#fff"/>
</g>
<rect x="40" y="124" width="310" height="8" rx="4" fill="#9fb0dc"/><rect x="372" y="124" width="296" height="8" rx="4" fill="#6a82c4"/><rect x="690" y="124" width="310" height="8" rx="4" fill="#3a58a0"/>
<g font-size="15" font-weight="800" letter-spacing="2" fill="#3a58a0"><text x="62" y="162">MOST CAUTIOUS</text><text x="394" y="162">CAUTIOUS</text><text x="712" y="162">CERTAIN</text></g>
<g font-family="Fraunces, Georgia, serif" font-size="19.5" fill="#14293a">
  <text x="62" y="200">The results <tspan font-weight="600" fill="#3a58a0">might</tspan> indicate…</text>
  <text x="62" y="236">The results <tspan font-weight="600" fill="#3a58a0">may</tspan> suggest…</text>
  <text x="62" y="272">The results <tspan font-weight="600" fill="#3a58a0">could</tspan> indicate…</text>
  <text x="394" y="214">The results <tspan font-weight="600" fill="#3a58a0">suggest</tspan>…</text>
  <text x="394" y="250">The results <tspan font-weight="600" fill="#3a58a0">indicate</tspan>…</text>
  <text x="712" y="214">The results <tspan font-weight="600" fill="#3a58a0">show</tspan>…</text>
  <text x="712" y="250">The results <tspan font-weight="600" fill="#3a58a0">mean</tspan>…</text>
</g>

<!-- meter -->
<g stroke-width="3" fill="none" stroke="#c9bfae" stroke-dasharray="2 6" stroke-linecap="round"><path d="M195 304v24M520 304v24M845 304v24"/></g>
<rect x="40" y="334" width="960" height="26" rx="13" fill="#edf1fa"/>
<rect x="40" y="334" width="320" height="26" rx="13" fill="#c9d4ee"/>
<rect x="352" y="334" width="336" height="26" fill="#8ca0d6"/>
<path d="M680 334h307a13 13 0 0 1 0 26H680z" fill="#3a58a0"/>
<path d="M40 347a13 13 0 0 1 13-13h307v26H53a13 13 0 0 1-13-13z" fill="#c9d4ee"/>
<g filter="url(#sh)"><circle cx="195" cy="347" r="16" fill="#fff" stroke="#9fb0dc" stroke-width="4"/><circle cx="520" cy="347" r="16" fill="#fff" stroke="#6a82c4" stroke-width="4"/><circle cx="845" cy="347" r="16" fill="#fff" stroke="#3a58a0" stroke-width="4"/></g>
<g fill="#3a58a0"><circle cx="195" cy="347" r="4"/><circle cx="520" cy="347" r="7"/><circle cx="845" cy="347" r="10"/></g>
<g font-size="16" font-weight="700" fill="#3d505e">
  <text x="40" y="392">← less certain</text>
  <text x="1000" y="392" text-anchor="end">more certain →</text>
</g>

<!-- note -->
<rect x="40" y="414" width="960" height="58" rx="16" fill="#fbf3e4"/>
<circle cx="76" cy="443" r="16" fill="#e3a843"/><path d="M76 434v12M76 452v1" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<text x="104" y="449" font-size="17" fill="#14293a">Add <tspan font-weight="800" fill="#985c0e">may</tspan>, <tspan font-weight="800" fill="#985c0e">might</tspan> or <tspan font-weight="800" fill="#985c0e">could</tspan> to lower certainty: <tspan font-style="italic" fill="#5d6a74">The results suggest… → The results may suggest…</tspan></text>
<path d="M992 44l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e3a843"/>
</svg>
