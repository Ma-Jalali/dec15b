<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="fbt">
<title id="fbt">The fishbowl. An inner circle is the discussion group: 3 to 4 students, with no laptops and handwritten notes only. An outer ring is the peer-feedback group: they watch and fill in the peer-feedback form on their device. The teacher sits outside the ring taking notes. Other students do self-study. The cycle: watch, give feedback, then swap roles. Timeline: 5 minutes to prepare, 15 minutes to discuss, 5 minutes of self-evaluation, then swap.</title>
