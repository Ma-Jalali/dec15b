  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#985c0e"/></marker>
  <g id="dev"><rect x="-8" y="-6" width="16" height="12" rx="2" fill="#fff"/><path d="M-4-2h8M-4 2h5" stroke="#3a58a0" stroke-width="1.6" stroke-linecap="round"/></g>
  <g id="pad"><rect x="-6" y="-8" width="12" height="16" rx="2" fill="#fff"/><path d="M-3-3h6M-3 1h6M-3 5h4" stroke="#2b776e" stroke-width="1.4" stroke-linecap="round"/></g>
</defs>
