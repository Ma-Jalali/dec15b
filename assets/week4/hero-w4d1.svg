<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Listen, read and speak: a talk stage with a spotlight shining on a round red rug where three stages of household food stand in a row — a shopping cart of groceries, a cooking pan on the hob, and a green compost bin — joined by dotted arrows; a pair of headphones with sound waves on the left, and on the right a smartphone with a food app and a speech bubble.</title>
