<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Mediation and discussion: three source documents in amber, teal and blue joined by coloured threads that merge into one new summary page; an upcycling chain from a bowl of brewer's spent grain to a bag of flour to a plate of biscuits; and two overlapping speech bubbles in a friendly negotiation.</title>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="41"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .36  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2a1d10" flood-opacity=".22"/></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".2"/></filter>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93600f" opacity=".22"/></pattern>
  <pattern id="grain" width="14" height="12" patternUnits="userSpaceOnUse"><ellipse cx="4" cy="4" rx="3.2" ry="1.8" fill="#985c0e" opacity=".55" transform="rotate(-25 4 4)"/><ellipse cx="11" cy="9" rx="3.2" ry="1.8" fill="#7a4a24" opacity=".45" transform="rotate(30 11 9)"/></pattern>
  <g id="doc"><rect width="170" height="132" rx="12" fill="#fffdf7"/><g stroke="#14293a" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"><path d="M24 54h120M24 76h100M24 98h112"/></g></g>
  <g id="ck"><circle r="13" fill="#d9a35c"/><circle r="13" fill="none" stroke="#b47a35" stroke-width="2.5"/><g fill="#7a4a24"><circle cx="-5" cy="-3" r="2.2"/><circle cx="4" cy="-5" r="1.8"/><circle cx="2" cy="5" r="2"/><circle cx="-4" cy="6" r="1.4"/></g></g>
</defs>
<rect width="1400" height="933" fill="#f3ebdd"/>
<rect width="1400" height="933" fill="#f3ebdd" filter="url(#paper)" opacity=".9"/>
<circle cx="700" cy="470" r="400" fill="#f6e7c9" opacity=".75"/>
