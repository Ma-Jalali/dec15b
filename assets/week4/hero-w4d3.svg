<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Negotiation, flexibility and stance: a balance scale weighing fresh produce against a stack of coins, held level above a round town-hall meeting table with six coloured chairs for a community role-play; on the left a slice of toast with dark-brown yeast spread beside a jar with a yellow lid; on the right a notepad with a pen writing.</title>
