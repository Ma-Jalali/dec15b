<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Feedback, planning and AI: an essay draft with feedback marks in the margin — circled words, underlines, ticks and small comment notes — a magnifying glass looking closely at the text, a checklist card with ticked boxes, and a laptop showing an AI chat with a sparkle icon.</title>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="71"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .36  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2a1d10" flood-opacity=".22"/></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".2"/></filter>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93600f" opacity=".22"/></pattern>
  <path id="spk" d="M0-22l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/>
</defs>
<rect width="1400" height="933" fill="#f3ebdd"/>
<rect width="1400" height="933" fill="#f3ebdd" filter="url(#paper)" opacity=".9"/>
<circle cx="700" cy="470" r="400" fill="#f6e7c9" opacity=".75"/>
<circle cx="700" cy="470" r="436" fill="none" stroke="#93600f" stroke-opacity=".2" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
<rect x="96" y="96" width="176" height="128" fill="url(#dots)"/>
<rect x="1136" y="96" width="176" height="128" fill="url(#dots)"/>
<path d="M140 520l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#e3a843"/>
<path d="M1270 790l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#7a4a8c" opacity=".7"/>
<path d="M880 140h34m-17-17v34" stroke="#2b776e" stroke-width="3" stroke-linecap="round" opacity=".6"/>
<ellipse cx="700" cy="842" rx="520" ry="26" fill="#2a1d10" opacity=".08"/>

<!-- essay -->
