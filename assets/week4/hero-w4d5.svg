  <path d="M262 452c50 6 120 4 176-2" fill="none" stroke="#b0512a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M510 296l8 9 16-18" fill="none" stroke="#3f7a3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
