  <g transform="translate(50 12) scale(3)"><use href="#ck"/></g>
  <g transform="translate(0 -24) scale(3.3) rotate(40)"><use href="#ck"/></g>
</g>
<g fill="none" stroke="#985c0e" stroke-width="4" stroke-linecap="round">
