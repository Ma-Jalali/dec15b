</g>
<path d="M1046 530h60" stroke="#2b776e" stroke-width="3" opacity=".5"/><circle cx="1060" cy="518" r="10" fill="#c2402b"/><circle cx="1084" cy="519" r="9" fill="#e3a843"/><rect x="1050" y="540" width="16" height="24" rx="4" fill="#3a58a0"/><path d="M1080 560c0-12 6-18 10-24 4 6 10 12 10 24 0 4-4 6-10 6s-10-2-10-6z" fill="#6f9a5a"/>
<path d="M920 420v-40M1090 420v-86" stroke="#5d6a74" stroke-width="7" stroke-linecap="round"/>
