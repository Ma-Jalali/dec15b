</g>
<g fill="#e3a843">
  <ellipse cx="184" cy="540" rx="9" ry="18" transform="rotate(-30 184 540)"/><ellipse cx="208" cy="526" rx="9" ry="18" transform="rotate(35 208 526)"/>
  <ellipse cx="178" cy="580" rx="9" ry="18" transform="rotate(-30 178 580)"/><ellipse cx="200" cy="566" rx="9" ry="18" transform="rotate(35 200 566)"/>
  <ellipse cx="172" cy="620" rx="9" ry="18" transform="rotate(-28 172 620)"/><ellipse cx="194" cy="606" rx="9" ry="18" transform="rotate(35 194 606)"/>
  <ellipse cx="204" cy="490" rx="8" ry="17" transform="rotate(20 204 490)"/>
</g>
<g fill="#c99032"><circle cx="420" cy="770" r="4"/><circle cx="436" cy="778" r="3.5"/><circle cx="452" cy="768" r="4"/><circle cx="408" cy="784" r="3"/></g>

<!-- shopping list -->
