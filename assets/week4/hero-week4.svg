<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Solutions to food waste: a smartphone showing a fridge-inventory app with a list of foods and freshness bars, a small cold room powered by a solar panel under the sun, a plate of upcycled biscuits beside a sprig of grain, and a tidy shopping list with ticked items.</title>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="21"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .36  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2a1d10" flood-opacity=".22"/></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".2"/></filter>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93600f" opacity=".22"/></pattern>
  <pattern id="cells" width="34" height="30" patternUnits="userSpaceOnUse"><path d="M0 0h34v30" fill="none" stroke="#9fb6d8" stroke-width="2"/></pattern>
  <g id="ck"><circle r="13" fill="#d9a35c"/><circle r="13" fill="none" stroke="#b47a35" stroke-width="2.5"/><g fill="#7a4a24"><circle cx="-5" cy="-3" r="2.2"/><circle cx="4" cy="-5" r="1.8"/><circle cx="2" cy="5" r="2"/><circle cx="-4" cy="6" r="1.4"/></g></g>
</defs>
<rect width="1400" height="933" fill="#f3ebdd"/>
<rect width="1400" height="933" fill="#f3ebdd" filter="url(#paper)" opacity=".9"/>
<circle cx="700" cy="470" r="400" fill="#f6e7c9" opacity=".75"/>
<circle cx="700" cy="470" r="436" fill="none" stroke="#93600f" stroke-opacity=".2" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
<rect x="104" y="112" width="176" height="128" fill="url(#dots)"/>
<rect x="1130" y="96" width="176" height="128" fill="url(#dots)"/>
<path d="M240 330l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#e3a843"/>
<path d="M1250 690l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#2b776e" opacity=".8"/>
<path d="M128 560h34m-17-17v34" stroke="#b0512a" stroke-width="3" stroke-linecap="round" opacity=".6"/>
<ellipse cx="700" cy="842" rx="520" ry="26" fill="#2a1d10" opacity=".08"/>

<!-- sun -->
<g transform="translate(1100 218)">
  <circle r="46" fill="#e3a843"/><circle r="64" fill="none" stroke="#e3a843" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/>
</g>
<!-- solar cold room -->
