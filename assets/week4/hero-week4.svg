  <circle cx="530" cy="612" r="16" fill="#e3a843"/><path d="M530 602v12M530 620v1" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#985c0e" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"><path d="M560 602h106M560 622h74"/></g>
</g>

<!-- biscuits + grain -->
