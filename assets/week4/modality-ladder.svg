<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 630" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="mlt">
<title id="mlt">Modality: how strongly do you claim? A staircase with three steps. Low modality, a tentative claim: perhaps, somewhat, occasionally. Medium modality, a moderate claim: should, often, it is possible. High modality, a strong claim: it is evident, highly likely, unquestionably.</title>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
</defs>
