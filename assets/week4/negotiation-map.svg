<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 486" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="nmt">
<title id="nmt">Negotiation moves: four connected stations on a route. Station 1, present a convincing argument: use evidence, assert your position, invite agreement. Station 2, respond: disagree politely, challenge, paraphrase and counter. Station 3, evaluate: is it a strong point? Is it overgeneralised? Is it too narrow? Station 4, be flexible: revise your view.</title>
