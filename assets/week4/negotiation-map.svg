<rect x="546" y="362" width="193" height="30" rx="10" fill="#edf1fa"/><circle cx="560" cy="377" r="4" fill="#3a58a0"/><text x="572" y="383" font-size="16.5" fill="#14293a">Overgeneralised?</text>
