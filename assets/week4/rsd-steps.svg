<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="rst">
<title id="rst">Research Summary Discussion in five steps. Step 1, find a source: individual research. Step 2, summarise your source to your group: a 2-minute verbal summary. Step 3, prepare a group presentation: 5 minutes, using three sources. Steps 2 and 3 happen this week, on Days 1 and 2. Step 4, present to a new group: 5 minutes each. Step 5, discuss: 15 minutes, respond to a quote and then negotiate the best of three options. Steps 4 and 5 happen on Thursday.</title>
