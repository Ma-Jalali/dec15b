<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 566" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="stt">
<title id="stt">Showing stance in academic writing. Two kinds of stance: thinking stance, which asks how certain or confident the writer is; and attitude stance, which asks whether something is good or bad, an evaluation. Five tools: 1, evaluative vocabulary, such as crucial, flawed, effectively. 2, modal language, such as could, likely, possibility. 3, hedging, such as tend to, some, often. 4, reporting verbs, such as asserts, refutes, emphasises. 5, signalling and attitude markers, such as however, surprisingly, undoubtedly.</title>
<defs>
