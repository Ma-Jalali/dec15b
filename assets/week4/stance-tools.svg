<rect x="910" y="22" width="100" height="56" fill="url(#dots)"/>
<text x="40" y="56" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600" fill="#14293a">Showing stance in academic writing</text>
<path d="M40 68c140-5 320-5 470-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="96" font-size="16" fill="#5d6a74">Stance is your position: how sure you are, and what you think of it.</text>
<text x="40" y="136" font-size="15" font-weight="800" letter-spacing="2" fill="#5d6a74">TWO KINDS OF STANCE</text>
