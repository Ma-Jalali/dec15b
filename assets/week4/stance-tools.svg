<g font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#fff"><text x="134" y="192">Thinking stance</text><text x="624" y="192">Attitude stance</text></g>
<g font-size="16.5" fill="#d9e3ea"><text x="134" y="220">How certain or confident is the writer?</text><text x="624" y="220">Good or bad? The writer’s evaluation.</text></g>
<text x="40" y="290" font-size="15" font-weight="800" letter-spacing="2" fill="#5d6a74">FIVE TOOLS</text>
