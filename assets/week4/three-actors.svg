<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="tat">
<title id="tat">Who can reduce food waste? Three actors are linked to a central plate labelled the food system: businesses, shown as a shop and a factory; governments, shown as a parliament building; and consumers, shown as a household.</title>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
</defs>
<rect width="1040" height="600" rx="24" fill="#fffdf8"/>
<rect x="910" y="22" width="100" height="56" fill="url(#dots)"/>
<text x="40" y="56" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600" fill="#14293a">Who can reduce food waste?</text>
<path d="M40 68c120-5 240-5 370-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="96" font-size="16" fill="#5d6a74">Three actors in the food system.</text>

<!-- links -->
<g fill="none" stroke="#c9bfae" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round">
  <path d="M520 276v68"/><path d="M296 418c60 0 80 0 126 0"/><path d="M744 418c-60 0-80 0-126 0"/>
</g>
<circle cx="520" cy="418" r="140" fill="none" stroke="#e3a843" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>

<!-- plate -->
<g filter="url(#sh)"><circle cx="520" cy="418" r="84" fill="#fff"/></g>
<circle cx="520" cy="418" r="62" fill="none" stroke="#efe6d4" stroke-width="3"/>
<circle cx="500" cy="404" r="20" fill="#c2402b"/><path d="M500 384c3-7 9-10 15-10" stroke="#3f7a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M528 432c-4-20 8-38 30-44 4 22-8 38-30 44z" fill="#6f9a5a"/><path d="M530 430c6-12 14-22 26-38" stroke="#3f7a3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<g fill="#e3a843"><ellipse cx="498" cy="442" rx="5" ry="9" transform="rotate(-30 498 442)"/><ellipse cx="510" cy="452" rx="5" ry="9" transform="rotate(40 510 452)"/><ellipse cx="490" cy="456" rx="5" ry="9" transform="rotate(-20 490 456)"/></g>
<g stroke="#5d6a74" stroke-width="5" stroke-linecap="round"><path d="M414 370v96"/><path d="M626 370v96"/></g>
<path d="M406 370v22a8 8 0 0 0 16 0v-22" fill="none" stroke="#5d6a74" stroke-width="3" stroke-linecap="round"/>
<path d="M626 370c10 6 12 28 0 36" fill="#5d6a74"/>
<rect x="452" y="514" width="136" height="36" rx="18" fill="#14293a"/>
<text x="520" y="538" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Food system</text>

<!-- governments (top) -->
<g filter="url(#sh)"><circle cx="520" cy="196" r="78" fill="#edf1fa"/></g>
<g fill="#3a58a0">
  <path d="M470 186l50-34 50 34z"/>
  <rect x="468" y="188" width="104" height="8" rx="2"/>
  <rect x="476" y="202" width="12" height="40" rx="2"/><rect x="498" y="202" width="12" height="40" rx="2"/><rect x="530" y="202" width="12" height="40" rx="2"/><rect x="552" y="202" width="12" height="40" rx="2"/>
  <rect x="464" y="244" width="112" height="8" rx="2"/><rect x="456" y="254" width="128" height="8" rx="2"/>
  <path d="M520 152v-26" stroke="#3a58a0" stroke-width="3"/>
</g>
<path d="M521 126h22l-6 6 6 6h-22z" fill="#b0512a"/>
<circle cx="520" cy="172" r="7" fill="#edf1fa"/>
<text x="640" y="190" font-family="Fraunces, Georgia, serif" font-size="25" font-weight="600" fill="#2c4581">Governments</text>
<text x="640" y="214" font-size="16" fill="#5d6a74">Parliament and policy</text>

