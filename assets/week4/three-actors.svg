<path d="M156 394h108" stroke="#985c0e" stroke-width="3"/>
<rect x="168" y="406" width="40" height="28" rx="3" fill="#e9dcc4"/><rect x="220" y="406" width="32" height="50" rx="3" fill="#985c0e"/>
<circle cx="184" cy="420" r="6" fill="#c2402b"/><circle cx="196" cy="422" r="5" fill="#6f9a5a"/>
<rect x="150" y="456" width="120" height="6" rx="3" fill="#985c0e"/>
<text x="210" y="540" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="25" font-weight="600" fill="#7a4a0b">Businesses</text>
<text x="210" y="564" text-anchor="middle" font-size="16" fill="#5d6a74">Shops and factories</text>

<!-- consumers (right) -->
<g filter="url(#sh)"><circle cx="830" cy="418" r="84" fill="#eef6ea"/></g>
<rect x="852" y="352" width="14" height="30" rx="2" fill="#2f5f2b"/>
<path d="M776 410l54-48 54 48z" fill="#3f7a3a"/>
<rect x="786" y="408" width="88" height="56" rx="4" fill="#fffdf7"/>
<rect x="818" y="426" width="24" height="38" rx="3" fill="#3f7a3a"/>
<rect x="796" y="420" width="16" height="16" rx="3" fill="#cfe2c8"/><rect x="848" y="420" width="16" height="16" rx="3" fill="#cfe2c8"/>
<path d="M830 400c-8-5-12-9-8-13 3-3 6-1 8 1 2-2 5-4 8-1 4 4 0 8-8 13z" fill="#e3a843"/>
<rect x="776" y="464" width="108" height="6" rx="3" fill="#3f7a3a"/>
<text x="830" y="540" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="25" font-weight="600" fill="#2f5f2b">Consumers</text>
<text x="830" y="564" text-anchor="middle" font-size="16" fill="#5d6a74">Households</text>
<g transform="translate(70 170)">
  <path d="M0 40c10-30 30-56 60-70" fill="none" stroke="#3f7a3a" stroke-width="3" stroke-linecap="round"/>
  <path d="M24 2c12-14 30-14 38-6-12 12-28 12-38 6z" fill="#6f9a5a"/><path d="M40-18c4-18 18-26 30-22-4 16-18 24-30 22z" fill="#3f7a3a"/>
</g>
<path d="M992 44l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e3a843"/>
</svg>
