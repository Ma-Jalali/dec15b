<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Academic writing workshop: three hands with pencils write together on one essay page whose thesis line is highlighted in amber, while colourful sticky notes with ticks, arrows and margin ideas sit around the page.</title>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="31"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .36  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2a1d10" flood-opacity=".22"/></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".2"/></filter>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93600f" opacity=".22"/></pattern>
  <pattern id="lines" width="10" height="34" patternUnits="userSpaceOnUse"><path d="M0 33.5h10" stroke="#3a58a0" stroke-opacity=".08"/></pattern>
  <g id="hand">
    <path d="M120-46l600-100 22 120-600 100z" fill="currentColor"/>
    <path d="M131 14l600-100 11 60-600 100z" fill="#14293a" opacity=".12"/><path d="M126-47l30-5 22 120-30 5z" fill="#fff" opacity=".3"/><ellipse cx="128" cy="10" rx="14" ry="58" transform="rotate(-10 128 10)" fill="currentColor"/>
    <ellipse cx="96" cy="-6" rx="56" ry="40" transform="rotate(-18 96 -6)"/>
    <g transform="rotate(-40)">
      <path d="M0 0l30-10v20z" fill="#e8d3ac"/><path d="M0 0l10-3.4v6.8z" fill="#14293a"/>
      <rect x="30" y="-10" width="150" height="20" fill="#e3a843"/><rect x="30" y="-10" width="150" height="6" fill="#fff" opacity=".3"/>
      <rect x="180" y="-10" width="14" height="20" fill="#c6ccd1"/><rect x="194" y="-10" width="18" height="20" rx="5" fill="#e48b8b"/>
    </g>
    <ellipse cx="66" cy="-60" rx="24" ry="13" transform="rotate(-40 66 -60)"/>
    <ellipse cx="40" cy="-22" rx="26" ry="13" transform="rotate(-20 40 -22)"/>
    <ellipse cx="52" cy="2" rx="22" ry="12" transform="rotate(-8 52 2)" opacity=".85"/>
  </g>
</defs>
<rect width="1400" height="933" fill="#f3ebdd"/>
<rect width="1400" height="933" fill="#f3ebdd" filter="url(#paper)" opacity=".9"/>
<circle cx="700" cy="470" r="400" fill="#f6e7c9" opacity=".75"/>
<circle cx="700" cy="470" r="436" fill="none" stroke="#93600f" stroke-opacity=".2" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
<rect x="1130" y="96" width="176" height="128" fill="url(#dots)"/>
<rect x="96" y="720" width="176" height="128" fill="url(#dots)"/>
<path d="M1300 480l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#e3a843"/>
<path d="M330 110l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#3a58a0" opacity=".7"/>
<ellipse cx="700" cy="846" rx="500" ry="24" fill="#2a1d10" opacity=".08"/>

<!-- essay page -->
<g transform="rotate(-3 700 470)" filter="url(#soft)">
  <rect x="440" y="120" width="520" height="680" rx="10" fill="#fffdf7"/>
  <rect x="440" y="196" width="520" height="604" fill="url(#lines)"/>
  <path d="M500 120v680" stroke="#c8341f" stroke-opacity=".25" stroke-width="2"/>
  <rect x="530" y="160" width="250" height="16" rx="8" fill="#14293a" opacity=".75"/>
  <g stroke="#14293a" stroke-opacity=".26" stroke-width="8" stroke-linecap="round">
    <path d="M530 230h380M530 264h360M530 298h380"/>
    <path d="M530 400h380M530 434h330M530 468h370M530 502h300"/>
    <path d="M530 570h380M530 604h350M530 638h370M530 672h260"/>
    <path d="M530 740h240"/>
  </g>
  <rect x="520" y="318" width="400" height="28" rx="6" fill="#e3a843" opacity=".7"/>
  <path d="M530 332h370" stroke="#14293a" stroke-opacity=".5" stroke-width="8" stroke-linecap="round"/>
  <path d="M530 352c80 6 230 6 372-2" fill="none" stroke="#b0512a" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="474" cy="332" r="18" fill="#2b776e"/>
  <path d="M466 326h16m-8 0v16" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="none" stroke="#3a58a0" stroke-width="3" stroke-linecap="round" opacity=".75"><path d="M920 392c14 30 14 84 0 116"/><path d="M920 562c14 30 14 84 0 116"/></g>
</g>

<!-- sticky notes -->
<g filter="url(#lift)">
  <g transform="rotate(-8 260 260)"><rect x="170" y="170" width="180" height="180" rx="6" fill="#f3cf6e"/><path d="M170 170h180v26H170z" fill="#e3a843" opacity=".55"/>
    <g fill="none" stroke="#985c0e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M196 236l12 12 22-24"/><path d="M246 236h78M196 284l12 12 22-24"/><path d="M246 284h62"/><path d="M198 326h110"/></g></g>
  <g transform="rotate(7 1150 300)"><rect x="1060" y="216" width="176" height="176" rx="6" fill="#a9d8cf"/><path d="M1060 216h176v26h-176z" fill="#2b776e" opacity=".25"/>
    <g fill="none" stroke="#1f5c55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M1090 290c40-30 80-30 116 0"/><path d="M1192 278l14 12-16 8"/><path d="M1090 344h110"/></g></g>
  <g transform="rotate(5 270 560)"><rect x="180" y="470" width="172" height="172" rx="6" fill="#f2b8a2"/><path d="M180 470h172v26H180z" fill="#b0512a" opacity=".22"/>
    <g fill="none" stroke="#8e3b1c" stroke-width="5" stroke-linecap="round"><circle cx="230" cy="556" r="22"/><path d="M226 548c0-8 10-8 10-2 0 6-6 6-6 12"/><circle cx="230" cy="568" r="1.6" fill="#8e3b1c"/><path d="M268 540h56M268 566h44M206 610h110"/></g></g>
  <g transform="rotate(-6 1150 640)"><rect x="1080" y="570" width="150" height="150" rx="6" fill="#d8cdea"/>
    <g fill="#7a4a8c"><circle cx="1120" cy="620" r="9"/><circle cx="1120" cy="660" r="9"/></g><path d="M1144 620h56M1144 660h44" stroke="#7a4a8c" stroke-width="5" stroke-linecap="round"/></g>
</g>

<!-- three hands writing together -->
<g filter="url(#lift)">
  <use href="#hand" transform="translate(830 470) rotate(8)" fill="#c98b5e" color="#2b776e"/>
  <use href="#hand" transform="translate(560 650) scale(-1 1) rotate(10)" fill="#8a5a3c" color="#7a4a8c"/>
  <use href="#hand" transform="translate(760 712) rotate(60)" fill="#e3b38a" color="#3a58a0"/>
</g>
<g fill="none" stroke="#14293a" stroke-width="3" stroke-linecap="round" opacity=".55">
  <path d="M736 470c20-10 40 10 60-2s30-6 30 0"/><path d="M640 652c-20 4-30-12-50-4"/>
</g>
</svg>
