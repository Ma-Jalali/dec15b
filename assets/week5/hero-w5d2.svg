<path d="M1220 150l7 18 18 7-18 7-7 18-7-18-18-7 18-7z" fill="#e3a843"/>
<path d="M180 420l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#2b776e" opacity=".7"/>

<!-- window -->
