<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Mediation and applying the framework: three women farmers from a self-help group in saris stand behind a market stall with a striped awning and baskets of fresh tomatoes, aubergines, mangoes, greens and cauliflower; beside them a solar-powered cold-storage box sits under a solar panel and the sun, and a clipboard with a ticked checklist lies in the foreground.</title>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="67"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .36  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2a1d10" flood-opacity=".22"/></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".2"/></filter>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93600f" opacity=".22"/></pattern>
  <pattern id="weave" width="14" height="10" patternUnits="userSpaceOnUse"><rect width="14" height="10" fill="#b8844c"/><path d="M0 5h7M7 0v10" stroke="#8f6232" stroke-width="2.4"/></pattern>
  <path id="seg" d="M0 0h50v44a25 25 0 0 1-50 0z"/>
  <g id="woman">
    <circle cx="0" cy="-4" r="37" fill="#2a1d14"/><circle cx="-30" cy="-18" r="16" fill="#2a1d14"/>
    <rect x="-11" y="22" width="22" height="26" fill="#8c5536"/>
    <circle r="32" fill="#a86b44"/>
