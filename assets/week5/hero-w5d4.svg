    <path d="M50 86q22 50 2 120" fill="none" stroke="#a86b44" stroke-width="20" stroke-linecap="round"/><path d="M34 76q26 0 34 26l-10 10q-12-18-30-20z" fill="currentColor"/>
    <path d="M-58 72Q-46 60-26 58L72 178V220H44z" fill="currentColor"/>
    <path d="M-58 72L44 220" stroke="#e3a843" stroke-width="7"/>
    <path d="M-50 76L50 218" stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 6"/>
  </g>
  <g id="tom"><circle r="17" fill="#c8341f"/><path d="M-6-14l6 5 6-5-6-3z" fill="#3f7a3a"/><circle cx="-6" cy="-5" r="4" fill="#fff" opacity=".3"/></g>
</defs>
