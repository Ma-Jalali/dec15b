<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Presentations, AI reflection and celebration day: a small stage with a lectern and microphone beneath three colourful speech bubbles, a laptop showing an AI sparkle and chat lines, a gold star badge with ribbons, and festive bunting and confetti across the scene.</title>
