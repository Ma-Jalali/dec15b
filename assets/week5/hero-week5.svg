<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Assessment and frameworks week: six coloured pillars stand on a field of ripe grain beneath a red ribbon with a gold rosette, a chequered finishing flag flies beside them, and an open notebook with a ticked checklist and a pen lies in the foreground.</title>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="21"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .47  0 0 0 0 .36  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2a1d10" flood-opacity=".22"/></filter>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".2"/></filter>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93600f" opacity=".22"/></pattern>
  <pattern id="chk" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#fffaf0"/><path d="M0 0h20v20H0zM20 20h20v20H20z" fill="#14293a"/></pattern>
  <g id="stalk" fill="#d59a35"><path d="M0 0c2-34 4-66 10-96" fill="none" stroke="#b9802a" stroke-width="3" stroke-linecap="round"/><ellipse cx="4" cy="-74" rx="5" ry="10" transform="rotate(-24 4 -74)"/><ellipse cx="14" cy="-80" rx="5" ry="10" transform="rotate(30 14 -80)"/><ellipse cx="6" cy="-92" rx="5" ry="10" transform="rotate(-22 6 -92)"/><ellipse cx="16" cy="-98" rx="5" ry="10" transform="rotate(30 16 -98)"/><ellipse cx="11" cy="-110" rx="4.5" ry="10"/></g>
  <g id="col"><rect x="-40" y="0" width="80" height="18" rx="4"/><rect x="-28" y="18" width="56" height="10" fill="#14293a" opacity=".12"/><rect x="-34" y="-14" width="68" height="14" rx="3"/></g>
</defs>
<rect width="1400" height="933" fill="#f3ebdd"/>
<rect width="1400" height="933" fill="#f3ebdd" filter="url(#paper)" opacity=".9"/>
<circle cx="700" cy="470" r="400" fill="#f6e7c9" opacity=".75"/>
