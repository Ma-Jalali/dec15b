<text x="40" y="376" font-size="15" font-weight="800" letter-spacing="1.6" fill="#5d6a74">LOW- AND MIDDLE-INCOME COUNTRIES</text>
<g filter="url(#sh)"><rect x="40" y="390" width="308.1" height="48" rx="12" fill="#3f7a3a"/></g>
