<text x="437.0" y="226" font-size="21" font-weight="800" fill="#5a3708">$14 bn</text>
<text x="40" y="280" font-size="16.5" font-weight="800" fill="#8e3b1c">Extreme hunger</text>
<text x="40" y="303" font-size="15.5" fill="#3d505e">needed this year: cash and</text>
<text x="40" y="324" font-size="15.5" fill="#3d505e">food assistance</text>
<text x="437.0" y="280" font-size="16.5" font-weight="800" fill="#8a520b">Chronic hunger</text>
<text x="437.0" y="303" font-size="15.5" fill="#3d505e">additional foreign</text>
<text x="437.0" y="324" font-size="15.5" fill="#3d505e">aid every year</text>

