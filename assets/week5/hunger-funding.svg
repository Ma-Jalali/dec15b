<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="hft">
<title id="hft">What would it cost to end hunger? (Oxfam, 2022). Donor governments would need to give about 37 billion US dollars a year until 2030 to tackle extreme and chronic hunger. This is made up of 23 billion dollars needed this year for extreme hunger, as cash and food assistance, and an additional 14 billion dollars a year in foreign aid for chronic hunger. In 2021, world leaders funded only 46% of humanitarian needs. The extra 14 billion dollars a year would roughly double aid and is about 1% of world military spending. Low- and middle-income countries would contribute about 19 billion dollars a year.</title>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
  <g id="coin"><ellipse cy="5" rx="17" ry="6" fill="#b8801f"/><rect x="-17" y="0" width="34" height="5" fill="#b8801f"/><ellipse rx="17" ry="6" fill="#e3a843"/></g>
</defs>
<rect width="1040" height="520" rx="24" fill="#fffdf8"/>
<rect x="910" y="22" width="100" height="56" fill="url(#dots)"/>
<text x="40" y="54" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600" fill="#14293a">What would it cost to end hunger?</text>
<path d="M40 66c120-5 290-5 450-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="96" font-size="16" fill="#5d6a74">Oxfam (2022) estimates, in US dollars.</text>

<!-- scale -->
<g stroke="#e6dccb" stroke-width="1.5" stroke-dasharray="3 5"><path d="M202.2 184V254M202.2 384V452"/><path d="M364.3 184V254M364.3 384V452"/><path d="M526.5 184V254M526.5 384V452"/></g>
<g font-size="15" fill="#8b969e"><text x="40.0" y="474" text-anchor="middle">$0bn</text><text x="202.2" y="474" text-anchor="middle">$10bn</text><text x="364.3" y="474" text-anchor="middle">$20bn</text><text x="526.5" y="474" text-anchor="middle">$30bn</text></g>

<!-- donors -->
<text x="40" y="132" font-size="15" font-weight="800" letter-spacing="1.6" fill="#5d6a74">DONOR GOVERNMENTS · EVERY YEAR UNTIL 2030</text>
<text x="40" y="172" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="600" fill="#14293a">~$37 billion <tspan font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#3d505e">a year to tackle extreme + chronic hunger</tspan></text>
