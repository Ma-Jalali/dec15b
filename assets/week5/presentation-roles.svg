<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="prt">
<title id="prt">A 5 to 6 minute group presentation with three speakers, followed by a 3 to 4 minute follow-up. Student 1 introduces the solution and why, names the pillar or pillars, and answers question 1. Student 2 answers two questions, supported with evidence. Student 3 answers one question and gives the group’s overall evaluation. In the follow-up, listeners ask clarification questions, for example: You said “apps help users make more informed decisions.” Can you specify what kind of decisions?</title>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".13"/></filter>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".14"/></pattern>
</defs>
<rect width="1040" height="500" rx="24" fill="#fffdf8"/>
<rect x="910" y="22" width="100" height="56" fill="url(#dots)"/>
<text x="40" y="54" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600" fill="#14293a">A 5–6 minute group presentation</text>
<path d="M40 66c110-5 280-5 440-1" stroke="#e3a843" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
<text x="40" y="96" font-size="16" fill="#5d6a74">Three speakers, then 3–4 minutes of clarification questions.</text>
<g font-size="15" font-weight="800" letter-spacing="1.5"><text x="40" y="132" fill="#14293a">PRESENTATION · 5–6 MIN</text><text x="712" y="132" fill="#985c0e">FOLLOW-UP · 3–4 MIN</text></g>
<g transform="translate(0 0)">
<rect x="40" y="144" width="216" height="40" rx="20" fill="#2b776e"/>
<text x="148.0" y="169.5" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Student 1</text>
<g filter="url(#sh)"><rect x="40" y="208" width="216" height="262" rx="18" fill="#fff"/></g><rect x="40" y="208" width="216" height="6" rx="3" fill="#2b776e"/>
<circle cx="80" cy="254" r="24" fill="#e9f4f2"/><g transform="translate(80 256)" fill="#2b776e"><circle cy="-8" r="7"/><path d="M-13 14c0-10 6-14 13-14s13 4 13 14z"/></g>
<text x="116" y="262" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#22655d">Student 1</text>
<circle cx="66" cy="307" r="4" fill="#2b776e"/>
<text x="80" y="312" font-size="16" fill="#3d505e">Introduce the solution</text>
<text x="80" y="334" font-size="16" fill="#3d505e">and why</text>
<circle cx="66" cy="365" r="4" fill="#2b776e"/>
<text x="80" y="370" font-size="16" fill="#3d505e">Name the pillar(s)</text>
<circle cx="66" cy="401" r="4" fill="#2b776e"/>
<text x="80" y="406" font-size="16" fill="#3d505e">Answer question 1</text>
<rect x="264" y="144" width="216" height="40" rx="6" fill="#3a58a0"/>
<text x="372.0" y="169.5" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Student 2</text>
<g filter="url(#sh)"><rect x="264" y="208" width="216" height="262" rx="18" fill="#fff"/></g><rect x="264" y="208" width="216" height="6" rx="3" fill="#3a58a0"/>
<circle cx="304" cy="254" r="24" fill="#edf1fa"/><g transform="translate(304 256)" fill="#3a58a0"><circle cy="-8" r="7"/><path d="M-13 14c0-10 6-14 13-14s13 4 13 14z"/></g>
<text x="340" y="262" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#2c467f">Student 2</text>
<circle cx="290" cy="307" r="4" fill="#3a58a0"/>
<text x="304" y="312" font-size="16" fill="#3d505e">Answer two questions</text>
<circle cx="290" cy="343" r="4" fill="#3a58a0"/>
<text x="304" y="348" font-size="16" fill="#3d505e">Support them with</text>
<text x="304" y="370" font-size="16" fill="#3d505e">evidence</text>
<rect x="488" y="144" width="216" height="40" rx="6" fill="#7a4a8c"/>
<text x="596.0" y="169.5" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Student 3</text>
<g filter="url(#sh)"><rect x="488" y="208" width="216" height="262" rx="18" fill="#fff"/></g><rect x="488" y="208" width="216" height="6" rx="3" fill="#7a4a8c"/>
<circle cx="528" cy="254" r="24" fill="#f6eff8"/><g transform="translate(528 256)" fill="#7a4a8c"><circle cy="-8" r="7"/><path d="M-13 14c0-10 6-14 13-14s13 4 13 14z"/></g>
<text x="564" y="262" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#5b3569">Student 3</text>
<circle cx="514" cy="307" r="4" fill="#7a4a8c"/>
<text x="528" y="312" font-size="16" fill="#3d505e">Answer one question</text>
<circle cx="514" cy="343" r="4" fill="#7a4a8c"/>
<text x="528" y="348" font-size="16" fill="#3d505e">Give the group’s</text>
<text x="528" y="370" font-size="16" fill="#3d505e">overall evaluation</text>
</g>
<rect x="712" y="144" width="288" height="40" rx="20" fill="#e3a843"/>
<text x="856" y="169.5" text-anchor="middle" font-size="16" font-weight="800" fill="#5a3708">Questions from listeners</text>
<!-- follow-up card -->
<g filter="url(#sh)"><rect x="712" y="208" width="288" height="262" rx="18" fill="#fff"/></g><rect x="712" y="208" width="288" height="6" rx="3" fill="#e3a843"/>
<text x="736" y="248" font-family="Fraunces, Georgia, serif" font-size="21" font-weight="600" fill="#8a520b">Clarification questions</text>
<text x="736" y="274" font-size="14.5" font-weight="800" letter-spacing="1.6" fill="#8b969e">EXAMPLE</text>
<path d="M736 288h236a12 12 0 0 1 12 12v58a12 12 0 0 1-12 12H776l-16 14 2-14h-26a12 12 0 0 1-12-12v-58a12 12 0 0 1 12-12z" fill="#edf1fa"/>
<g font-size="15.5" fill="#14293a"><text x="738" y="310">You said “apps help users</text><text x="738" y="331">make more informed</text><text x="738" y="352">decisions.”</text></g>
<path d="M736 396h236a12 12 0 0 1 12 12v40a12 12 0 0 1-12 12H736a12 12 0 0 1-12-12v-40a12 12 0 0 1 12-12z" fill="#fbf3e4" stroke="#e3a843" stroke-width="1.5"/>
<path d="M940 382v10m-5-4l5 6 5-6" fill="none" stroke="#b9ad98" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g font-size="15.5" font-weight="700" fill="#5a3708"><text x="738" y="422">Can you specify what kind</text><text x="738" y="444">of decisions?</text></g>
<path d="M1012 44l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e3a843"/>
</svg>
