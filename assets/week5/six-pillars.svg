<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 740" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="spt">
<title id="spt">Six dimensions of food security, adapted from Clapp et al. (2022). A wheel with “Food security” at the centre and six segments. Four established dimensions: Availability – is food physically there? Access – can people afford and reach it? Utilisation – is it safe and nutritious? Stability – is it reliable over time? Two new dimensions, marked with a “new dimensions” ribbon: Agency – can people make their own food choices? Sustainability – can we keep producing without harming the future?</title>
