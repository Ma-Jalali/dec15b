<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1170" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="tmt">
<title id="tmt">Text map of Sample 5.1. Thesis: Governments need to considerably increase their involvement. Body 1, action needed to prevent food waste in the consumption stage: consumers could take action on their own; but (however) not enough consumers do; because they lack appreciation for the resources needed to produce food; so (this is where…) public awareness campaigns are crucial. Also: there are innovations such as waste-tracking apps; but progress is too slow; so greater government investment is needed to support innovation and increase impact; so government efforts would support consumer and business efforts. Body 2, need to manage waste more responsibly: so (that would require…) government involvement; because (this is because…) governments are responsible for regulation and financing. Financing: one solution is to redistribute food through food banks; but (however…) this is difficult to scale with limited resources. Regulation: encourage businesses to donate food to reduce landfill; some countries do this well, but all countries should; so (this suggests that…) there is potential for governments to do more. Conclusion: The issue of food waste demands greater government intervention. Connectors are colour-coded: but in clay, because in blue, so in teal.</title>
