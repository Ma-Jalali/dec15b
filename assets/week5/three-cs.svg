<g filter="url(#sh)"><circle cx="194" cy="164" r="52" fill="#fbf3e4"/><circle cx="520" cy="164" r="52" fill="#e9f4f2"/><circle cx="846" cy="164" r="52" fill="#fbefe8"/></g>

