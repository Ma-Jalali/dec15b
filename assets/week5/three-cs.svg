<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="tct">
<title id="tct">The 3Cs framework. Cost: Is it affordable? Is it worth it? Convenience: Is it easy to use? Does it save time? Consequences: What are the short- and long-term effects? Are they positive or negative?</title>
