<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="A class whiteboard with a mind map, sticky notes and a marker">
<style>
.ink { stroke-dasharray: 160; stroke-dashoffset: 160; animation: ink 3.2s ease-out .4s forwards; }
@keyframes ink { to { stroke-dashoffset: 0; } }
.mk { animation: mk 3.2s ease-out .4s forwards; transform-box: fill-box; }
@keyframes mk { 0% { transform: translate(0, 0); } 50% { transform: translate(19px, 9px); } 100% { transform: translate(38px, 26px); } }
.live { animation: live 1.6s ease-in-out infinite; } @keyframes live { 50% { opacity: .25; } }
.st { transform-box: fill-box; transform-origin: 50% 0; animation: st 4s ease-in-out infinite; } @keyframes st { 50% { transform: rotate(2deg); } }
.av { animation: av .6s cubic-bezier(.2,.7,.2,1) both; } @keyframes av { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ink { stroke-dashoffset: 0; } }
</style>
<defs>
<linearGradient id="fr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2f5"/><stop offset="1" stop-color="#c7d0d8"/></linearGradient>
<linearGradient id="pa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f4f1ea"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
<pattern id="gr" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0v14" fill="none" stroke="#14293a" stroke-opacity=".035"/></pattern>
</defs>
<ellipse cx="180" cy="226" rx="140" ry="8" fill="#14293a" opacity=".07"/>
<!-- plant -->
<g transform="translate(316 186)"><path d="M-12 0h24l-3 30h-18z" fill="#d4583a"/><path d="M-12 0h24v5h-24z" fill="#b8452b"/><path d="M0 0c-2-14-14-20-20-30 10 2 18 10 20 22M0 0c2-16 10-26 18-34-2 12-8 24-16 34M0 0c0-14 0-26-2-36" fill="none" stroke="#5f9a72" stroke-width="5" stroke-linecap="round"/></g>
<!-- easel legs -->
<path d="M96 214 118 170M264 214 242 170M180 170v52" stroke="#9aa6b0" stroke-width="5" stroke-linecap="round"/>
<path d="M118 196h124" stroke="#b6c0c8" stroke-width="3" stroke-linecap="round"/>
<!-- board -->
<rect x="44" y="16" width="272" height="160" rx="12" fill="url(#fr)" filter="url(#sh)"/>
<rect x="52" y="24" width="256" height="140" rx="7" fill="url(#pa)"/><rect x="52" y="24" width="256" height="140" rx="7" fill="url(#gr)"/>
<path d="M52 24h120L96 164H52z" fill="url(#gl)" opacity=".7"/>
<circle cx="52" cy="24" r="2" fill="#aab4bd"/><circle cx="308" cy="24" r="2" fill="#aab4bd"/>
<!-- title + live -->
<path d="M66 44c18-3 44-3 66 0" stroke="#14293a" stroke-width="4" fill="none" stroke-linecap="round"/>
<g transform="translate(262 38)"><rect x="-26" y="-9" width="52" height="18" rx="9" fill="#fdecea"/><circle class="live" cx="-15" cy="0" r="3.5" fill="#e64626"/><text x="5" y="3.6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9" letter-spacing="1" fill="#e64626">LIVE</text></g>
<!-- mind map -->
<path d="M150 104 104 78M150 104 104 134M210 104 252 82M210 104 254 132" stroke="#8b97a1" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<rect x="142" y="90" width="76" height="28" rx="14" fill="#2f6db5"/><path d="M156 104h48" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
<rect x="70" y="68" width="44" height="20" rx="10" fill="#e8f5f2" stroke="#13887a" stroke-width="1.6"/><path d="M80 78h24" stroke="#13887a" stroke-width="2.4" stroke-linecap="round"/>
<rect x="70" y="124" width="44" height="20" rx="10" fill="#f3edf7" stroke="#7a4a8c" stroke-width="1.6"/><path d="M80 134h20" stroke="#7a4a8c" stroke-width="2.4" stroke-linecap="round"/>
<rect x="246" y="72" width="44" height="20" rx="10" fill="#fbf3e2" stroke="#b07d12" stroke-width="1.6"/><path d="M256 82h24" stroke="#b07d12" stroke-width="2.4" stroke-linecap="round"/>
<!-- the line the teacher is drawing -->
<path class="ink" d="M210 104c14 6 26 14 38 26" stroke="#e64626" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<rect x="248" y="122" width="44" height="20" rx="10" fill="#fff" stroke="#e64626" stroke-width="1.6" stroke-dasharray="3 3"/>
<!-- sticky notes -->
<g class="st" transform="rotate(-6 136 142)"><rect x="122" y="126" width="30" height="26" rx="2" fill="#ffe08a" filter="url(#sh)"/><path d="M127 135h18M127 141h12" stroke="#a6801e" stroke-width="1.8" stroke-linecap="round"/><rect x="132" y="123" width="10" height="6" rx="1" fill="#fff" opacity=".6"/></g>
<g class="st" style="animation-delay:1.2s" transform="rotate(5 196 140)"><rect x="182" y="126" width="28" height="24" rx="2" fill="#ffc9d6" filter="url(#sh)"/><path d="M187 135h16M187 141h10" stroke="#b8566f" stroke-width="1.8" stroke-linecap="round"/></g>
<!-- tick -->
<path d="M270 52l5 5 10-11" stroke="#13887a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- marker tray + markers -->
<rect x="96" y="172" width="168" height="8" rx="4" fill="#b6c0c8"/>
<rect x="112" y="166" width="34" height="7" rx="3.5" fill="#2f6db5"/><rect x="112" y="166" width="10" height="7" rx="3" fill="#14293a"/>
<rect x="152" y="166" width="34" height="7" rx="3.5" fill="#13887a"/><rect x="152" y="166" width="10" height="7" rx="3" fill="#14293a"/>
<rect x="200" y="165" width="28" height="9" rx="2" fill="#5d6a74"/><rect x="200" y="171" width="28" height="3" rx="1.5" fill="#d9dee3"/>
<!-- moving marker -->
<g class="mk"><g transform="translate(210 104) rotate(-35)"><rect x="0" y="0" width="40" height="9" rx="4.5" fill="#e64626"/><rect x="28" y="0" width="12" height="9" rx="3" fill="#14293a"/><path d="M0 2-6 4.5 0 7z" fill="#e64626"/><rect x="6" y="1.5" width="18" height="2" rx="1" fill="#fff" opacity=".45"/></g></g>
<!-- watching classmates -->
<g class="av" style="animation-delay:.8s"><circle cx="34" cy="206" r="13" fill="#f6dccb"/><path d="M21 203a13 13 0 0 1 26 0c-4-6-22-6-26 0z" fill="#3a2a22"/><circle cx="34" cy="232" r="16" fill="#2f6db5"/></g>
<g class="av" style="animation-delay:1s"><circle cx="64" cy="210" r="11" fill="#d9a77f"/><path d="M53 207a11 11 0 0 1 22 0c-2-8-20-8-22 0z" fill="#14293a"/><circle cx="64" cy="234" r="14" fill="#13887a"/></g>
</svg>
