<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" role="img" aria-label="A feedback form passed from one classmate to another, private to the two of them">
<style>
.fly { animation: fly 4.5s ease-in-out infinite; } @keyframes fly { 0%, 15% { transform: translate(0, 0); opacity: 0; } 25% { opacity: 1; } 60% { transform: translate(96px, -18px); opacity: 1; } 72%, 100% { transform: translate(110px, -6px); opacity: 0; } }
.dot { animation: dot 1.2s ease-in-out infinite; } @keyframes dot { 50% { opacity: .2; } }
.pop { transform-box: fill-box; transform-origin: center; animation: pop 4.5s ease-in-out infinite; } @keyframes pop { 0%, 62% { transform: scale(0); } 70% { transform: scale(1.2); } 76%, 100% { transform: scale(1); } }
.flt { animation: flt 5s ease-in-out infinite; } @keyframes flt { 50% { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fly { opacity: 0; } }
</style>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".14"/></filter>
<linearGradient id="pp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f7efe0"/></linearGradient>
</defs>
<ellipse cx="140" cy="178" rx="112" ry="7" fill="#14293a" opacity=".07"/>
<!-- dotted path between the two classmates -->
<path d="M58 118C96 60 184 60 222 118" stroke="#2f6db5" stroke-opacity=".35" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" fill="none"/>
<!-- sender -->
<g><circle cx="44" cy="134" r="17" fill="#f6dccb"/><path d="M27 130a17 17 0 0 1 34 0c-5-9-29-9-34 0z" fill="#3a2a22"/><path d="M18 178a26 26 0 0 1 52 0z" fill="#13887a"/><circle cx="38" cy="135" r="1.6" fill="#14293a"/><circle cx="50" cy="135" r="1.6" fill="#14293a"/><path d="M40 142q4 3 8 0" stroke="#14293a" stroke-width="1.5" fill="none" stroke-linecap="round"/></g>
<!-- receiver -->
<g><circle cx="236" cy="134" r="17" fill="#d9a77f"/><path d="M219 131a17 17 0 0 1 34 0c-3-11-31-11-34 0z" fill="#14293a"/><path d="M210 178a26 26 0 0 1 52 0z" fill="#7a4a8c"/><circle cx="230" cy="135" r="1.6" fill="#14293a"/><circle cx="242" cy="135" r="1.6" fill="#14293a"/><path d="M232 142q4 3 8 0" stroke="#14293a" stroke-width="1.5" fill="none" stroke-linecap="round"/></g>
<!-- the form, centre -->
<g class="flt" filter="url(#sh)">
  <rect x="96" y="30" width="88" height="112" rx="10" fill="#fff" transform="rotate(-6 140 86)"/>
  <rect x="100" y="24" width="88" height="112" rx="10" fill="url(#pp)" stroke="#14293a" stroke-opacity=".12"/>
</g>
<g class="flt">
  <rect x="100" y="24" width="88" height="20" rx="10" fill="#14293a"/><rect x="100" y="34" width="88" height="10" fill="#14293a"/>
  <text x="112" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="8" letter-spacing="1" fill="#fff">FEEDBACK</text>
  <circle cx="176" cy="34" r="3" fill="#e3a843"/>
  <path d="M112 56h40M112 74h34M112 92h40" stroke="#c9d0d6" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#2f6db5" stroke-width="1.6"><circle cx="164" cy="56" r="4"/><circle cx="176" cy="56" r="4"/><circle cx="164" cy="74" r="4"/><circle cx="176" cy="74" r="4"/><circle cx="164" cy="92" r="4"/><circle cx="176" cy="92" r="4"/></g>
  <circle cx="176" cy="56" r="2.4" fill="#2f6db5"/><circle cx="164" cy="74" r="2.4" fill="#2f6db5"/><circle cx="176" cy="92" r="2.4" fill="#2f6db5"/>
  <rect x="110" y="104" width="68" height="22" rx="5" fill="#fff" stroke="#e3a843" stroke-width="1.4"/><path d="M116 112h40M116 119h28" stroke="#e3a843" stroke-width="2" stroke-linecap="round"/>
</g>
<!-- a small copy flying to the receiver -->
<g class="fly"><g transform="translate(92 108) rotate(-10)"><rect width="20" height="26" rx="3" fill="#fff" stroke="#2f6db5" stroke-width="1.5"/><path d="M4 8h12M4 13h12M4 18h8" stroke="#2f6db5" stroke-width="1.5" stroke-linecap="round"/></g></g>
<!-- arrived badge -->
<g class="pop"><circle cx="256" cy="112" r="10" fill="#13887a"/><path d="M251 112l3.5 3.5 6.5-7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- private: lock -->
<g transform="translate(140 160)"><rect x="-34" y="-10" width="68" height="20" rx="10" fill="#fff" filter="url(#sh)"/><rect x="-24" y="-3" width="9" height="8" rx="1.5" fill="#14293a"/><path d="M-22.5 -3v-2a3 3 0 0 1 6 0v2" stroke="#14293a" stroke-width="1.6" fill="none"/><text x="-10" y="3.6" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="8.5" letter-spacing=".6" fill="#14293a">PRIVATE</text></g>
<!-- sparkles -->
<path class="dot" d="M214 40l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#e3a843"/><circle class="dot" style="animation-delay:.6s" cx="70" cy="54" r="3" fill="#2f6db5"/><circle class="dot" style="animation-delay:.3s" cx="226" cy="70" r="2.4" fill="#e64626"/>
</svg>
