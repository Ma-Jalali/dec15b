<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img" aria-label="A laptop and a phone joined through a secure cloud">
<style>
.pk { stroke-dasharray: 3 7; animation: pk 1.2s linear infinite; } @keyframes pk { to { stroke-dashoffset: -20; } }
.bob { animation: bob 4s ease-in-out infinite; } @keyframes bob { 50% { transform: translateY(-4px); } }
.tw { animation: tw 1.8s ease-in-out infinite; } @keyframes tw { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
<linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e8f0f8"/></linearGradient></defs>
<ellipse cx="130" cy="150" rx="104" ry="6" fill="#14293a" opacity=".07"/>
<!-- links -->
<path class="pk" d="M78 96C84 70 104 58 116 56" stroke="#2f6db5" stroke-width="2" fill="none" stroke-linecap="round"/>
<path class="pk" d="M196 100C190 72 164 58 148 56" stroke="#13887a" stroke-width="2" fill="none" stroke-linecap="round"/>
<!-- cloud with lock -->
<g class="bob"><path d="M104 64h56a16 16 0 0 0-4-31 22 22 0 0 0-42-4 15 15 0 0 0-10 35z" fill="url(#cl)" stroke="#14293a" stroke-opacity=".15" filter="url(#sh)"/>
<rect x="124" y="38" width="16" height="13" rx="3" fill="#14293a"/><path d="M127 38v-4a5 5 0 0 1 10 0v4" stroke="#14293a" stroke-width="2.4" fill="none"/><circle cx="132" cy="44" r="2" fill="#e3a843"/></g>
<!-- laptop -->
<g filter="url(#sh)"><rect x="26" y="96" width="92" height="44" rx="5" fill="#14293a"/><rect x="31" y="101" width="82" height="34" rx="2" fill="#f8fafc"/><path d="M16 140h112l-6 6H22z" fill="#c7d0d8"/></g>
<rect x="37" y="107" width="34" height="4" rx="2" fill="#2f6db5"/><path d="M37 117h60M37 124h44" stroke="#c9d0d6" stroke-width="3" stroke-linecap="round"/><circle cx="104" cy="109" r="4" fill="#13887a"/><path d="M102 109l1.5 1.5 3-3" stroke="#fff" stroke-width="1.4" fill="none"/>
<!-- phone -->
<g filter="url(#sh)"><rect x="180" y="96" width="36" height="52" rx="7" fill="#14293a"/><rect x="183.5" y="101" width="29" height="42" rx="3" fill="#f8fafc"/></g>
<rect x="188" y="107" width="18" height="4" rx="2" fill="#13887a"/><path d="M188 116h20M188 122h14M188 128h18" stroke="#c9d0d6" stroke-width="2.6" stroke-linecap="round"/><rect x="194" y="98" width="8" height="1.8" rx=".9" fill="#5d6a74"/>
<!-- sparkles -->
<path class="tw" d="M206 30l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#e3a843"/><circle class="tw" style="animation-delay:.6s" cx="52" cy="42" r="3" fill="#2f6db5"/><circle class="tw" style="animation-delay:1s" cx="226" cy="62" r="2.2" fill="#e64626"/>
</svg>
