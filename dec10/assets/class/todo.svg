<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" role="img" aria-label="A tidy desk: a week planner, a checklist with two items ticked, a pencil, a cup of tea and a small plant">
<style>
.st { animation: st 3.2s ease-in-out infinite; } .st2 { animation-delay: 1.1s; } @keyframes st { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: .55; } 100% { opacity: 0; transform: translateY(-10px); } }
.tk { stroke-dasharray: 14; stroke-dashoffset: 14; animation: tk .6s ease-out 1s forwards; } @keyframes tk { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tk { stroke-dashoffset: 0; } }
</style>
<defs>
<filter id="td-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".14"/></filter>
<linearGradient id="td-pa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient>
<linearGradient id="td-cup" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4583a"/><stop offset=".55" stop-color="#e8795c"/><stop offset="1" stop-color="#b8452b"/></linearGradient>
<linearGradient id="td-pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8dccb"/><stop offset=".5" stop-color="#f6efe1"/><stop offset="1" stop-color="#d9cbb6"/></linearGradient>
</defs>
<ellipse cx="120" cy="112" rx="104" ry="5" fill="#14293a" opacity=".07"/>
<!-- week planner -->
<g filter="url(#td-sh)" transform="rotate(-5 58 62)">
  <rect x="22" y="22" width="72" height="82" rx="8" fill="url(#td-pa)"/>
  <path d="M22 30a8 8 0 0 1 8-8h56a8 8 0 0 1 8 8v12H22z" fill="#2f6db5"/>
  <text x="58" y="37" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="8" letter-spacing="1.2" fill="#fff">WEEK</text>
  <g fill="#14293a" opacity=".5"><circle cx="36" cy="22" r="2.4"/><circle cx="58" cy="22" r="2.4"/><circle cx="80" cy="22" r="2.4"/></g>
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="6" fill="#8b969e" text-anchor="middle"><text x="31" y="53">M</text><text x="43" y="53">T</text><text x="55" y="53">W</text><text x="67" y="53">T</text><text x="79" y="53">F</text></g>
  <g fill="#eef1f4"><rect x="26" y="57" width="10" height="9" rx="2"/><rect x="38" y="57" width="10" height="9" rx="2"/><rect x="62" y="57" width="10" height="9" rx="2"/><rect x="74" y="57" width="10" height="9" rx="2"/>
  <rect x="26" y="69" width="10" height="9" rx="2"/><rect x="38" y="69" width="10" height="9" rx="2"/><rect x="50" y="69" width="10" height="9" rx="2"/><rect x="62" y="69" width="10" height="9" rx="2"/><rect x="74" y="69" width="10" height="9" rx="2"/></g>
  <rect x="50" y="57" width="10" height="9" rx="2" fill="#e64626"/>
  <rect x="27" y="83" width="40" height="5" rx="2.5" fill="#e3a843" opacity=".55"/><rect x="27" y="91" width="28" height="5" rx="2.5" fill="#13887a" opacity=".4"/>
</g>
<!-- checklist -->
<g filter="url(#td-sh)">
  <rect x="96" y="14" width="78" height="92" rx="9" fill="url(#td-pa)"/>
  <rect x="122" y="9" width="26" height="10" rx="4" fill="#14293a"/><circle cx="135" cy="14" r="2" fill="#e3a843"/>
  <g fill="none" stroke-width="1.6"><rect x="105" y="30" width="11" height="11" rx="3" stroke="#13887a"/><rect x="105" y="52" width="11" height="11" rx="3" stroke="#13887a"/><rect x="105" y="74" width="11" height="11" rx="3" stroke="#c9d0d6"/></g>
  <rect x="105" y="30" width="11" height="11" rx="3" fill="#13887a"/><rect x="105" y="52" width="11" height="11" rx="3" fill="#13887a"/>
  <path d="M107.6 35.6l2.2 2.2 4-4.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="tk" d="M107.6 57.6l2.2 2.2 4-4.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke-linecap="round"><path d="M122 35.5h38" stroke="#c9d0d6" stroke-width="3"/><path d="M122 35.5h38" stroke="#8b969e" stroke-width="1" opacity=".7"/>
  <path d="M122 57.5h30" stroke="#c9d0d6" stroke-width="3"/><path d="M122 57.5h30" stroke="#8b969e" stroke-width="1" opacity=".7"/>
  <path d="M122 79.5h42" stroke="#dfe4e8" stroke-width="3"/></g>
  <rect x="150" y="89" width="18" height="9" rx="4.5" fill="#fbf3e2"/><text x="159" y="95.6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="5.5" fill="#b07d12">TODAY</text>
</g>
<!-- pencil -->
<g transform="rotate(-58 166 96)"><rect x="136" y="92" width="48" height="7" rx="3.5" fill="#e3a843"/><rect x="136" y="92" width="48" height="2.3" rx="1.2" fill="#fff" opacity=".35"/><rect x="176" y="92" width="6" height="7" fill="#b8c2ca"/><rect x="181" y="92" width="5" height="7" rx="2" fill="#e8798c"/><path d="M136 92l-8 3.5 8 3.5z" fill="#efd9b5"/><path d="M131 94l-3 1.5 3 1.5z" fill="#14293a"/></g>
<!-- tea -->
<g class="st"><path d="M196 54c-3-4 3-6 0-11" stroke="#8b969e" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".6"/></g>
<g class="st st2"><path d="M203 56c-3-4 3-6 0-11" stroke="#8b969e" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".6"/></g>
<g filter="url(#td-sh)"><path d="M186 62h26l-3 30a5 5 0 0 1-5 4.5h-10a5 5 0 0 1-5-4.5z" fill="url(#td-cup)"/><path d="M211 68h3.5a6 6 0 0 1 0 12H209" fill="none" stroke="#b8452b" stroke-width="3"/>
<ellipse cx="199" cy="62" rx="13" ry="2.6" fill="#7a3a22"/><ellipse cx="197" cy="61.6" rx="7" ry="1" fill="#fff" opacity=".25"/><path d="M190 72h18" stroke="#fff" stroke-opacity=".35" stroke-width="2"/></g>
<ellipse cx="199" cy="99" rx="17" ry="3" fill="#14293a" opacity=".08"/>
<!-- plant -->
<g transform="translate(220 74)"><path d="M0 0c-4-10-1-20 6-26M0 0c2-9 10-15 16-15M0 0c-6-6-14-6-18-3" fill="none" stroke="#5f9a72" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="6" cy="-26" rx="4" ry="6.5" transform="rotate(30 6 -26)" fill="#6fae84"/><ellipse cx="15" cy="-15" rx="6" ry="3.5" transform="rotate(-15 15 -15)" fill="#5f9a72"/><ellipse cx="-16" cy="-3.5" rx="5.5" ry="3" transform="rotate(20 -16 -3.5)" fill="#7dbb91"/>
<path d="M-9 0h18l-2.5 18a4 4 0 0 1-4 3.5h-5a4 4 0 0 1-4-3.5z" fill="url(#td-pot)"/><path d="M-9.5 0h19v3.5h-19z" fill="#d9cbb6"/></g>
<!-- sparkles -->
<path d="M180 22l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#e3a843"/><circle cx="14" cy="40" r="2" fill="#2f6db5" opacity=".5"/>
</svg>
