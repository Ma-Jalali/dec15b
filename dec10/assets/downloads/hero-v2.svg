<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" fill="none" role="img" aria-label="A laptop shows a feedback form being filled in; a finished PDF drops into a folder, and a chat bubble sends it to classmates">
<style>
  .fl { animation: fl 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .f2 { animation-delay: -2s; } .f3 { animation-delay: -4s; }
  .tk { animation: tk 6s ease-in-out infinite; opacity: 0; } .k2 { animation-delay: .5s; } .k3 { animation-delay: 1s; } .k4 { animation-delay: 1.5s; }
  .cu { animation: cu 1.1s steps(2) infinite; }
  .dr { animation: dr 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .ar { animation: ar 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .pb { animation: pb 3s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
  .tw { animation: tw 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .t2 { animation-delay: -1.5s; } .t3 { animation-delay: -.8s; }
  .ty rect { animation: ty 1.2s ease-in-out infinite; } .ty rect:nth-child(2) { animation-delay: .2s; } .ty rect:nth-child(3) { animation-delay: .4s; }
  @keyframes fl { 50% { transform: translateY(-6px); } }
  @keyframes tk { 0%, 10% { opacity: 0; } 18%, 90% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes cu { 50% { opacity: 0; } }
  @keyframes dr { 0% { transform: translate(0, -18px) rotate(-8deg); opacity: 0; } 25% { opacity: 1; } 70% { transform: translate(0, 4px) rotate(0); opacity: 1; } 100% { transform: translate(0, 10px); opacity: 0; } }
  @keyframes ar { 50% { transform: translateY(3px); } }
  @keyframes pb { 0% { transform: scaleX(.05); } 70%, 100% { transform: scaleX(1); } }
  @keyframes tw { 0%, 100% { opacity: .25; transform: scale(.55) rotate(0); } 50% { opacity: 1; transform: scale(1.05) rotate(45deg); } }
  @keyframes ty { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tk { opacity: 1; } }
</style>
<defs>
  <radialGradient id="d-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e6f0fb"/><stop offset=".6" stop-color="#eef4fc" stop-opacity=".5"/><stop offset="1" stop-color="#eef4fc" stop-opacity="0"/></radialGradient>
  <radialGradient id="d-glow2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fdf0dc"/><stop offset="1" stop-color="#fdf0dc" stop-opacity="0"/></radialGradient>
  <linearGradient id="d-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
  <linearGradient id="d-base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe5ea"/><stop offset="1" stop-color="#b9c3cb"/></linearGradient>
  <linearGradient id="d-fold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4bd55"/><stop offset="1" stop-color="#d9902a"/></linearGradient>
  <linearGradient id="d-foldb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3a843"/><stop offset="1" stop-color="#c47f1f"/></linearGradient>
  <linearGradient id="d-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="d-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#14293a" flood-opacity=".1"/></filter>
  <filter id="d-blur"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<ellipse cx="250" cy="150" rx="250" ry="150" fill="url(#d-glow)"/>
<ellipse cx="460" cy="230" rx="110" ry="80" fill="url(#d-glow2)"/>
<circle cx="250" cy="150" r="130" stroke="#2f6db5" stroke-opacity=".18" stroke-dasharray="2 7"/>
<ellipse cx="240" cy="276" rx="170" ry="10" fill="#14293a" opacity=".12" filter="url(#d-blur)"/>

<!-- the laptop -->
<g filter="url(#d-sh)">
  <rect x="110" y="62" width="250" height="168" rx="12" fill="url(#d-body)"/>
  <rect x="120" y="72" width="230" height="148" rx="6" fill="#f4f7fa"/>
  <circle cx="235" cy="67" r="1.6" fill="#5c7890"/>
</g>
<!-- the form on screen -->
<rect x="120" y="72" width="230" height="18" rx="6" fill="#1f3f5c"/><rect x="120" y="84" width="230" height="6" fill="#1f3f5c"/>
<circle cx="130" cy="81" r="2.4" fill="#e64626"/><circle cx="138" cy="81" r="2.4" fill="#e3a843"/><circle cx="146" cy="81" r="2.4" fill="#2f9a63"/>
<rect x="160" y="77" width="120" height="8" rx="4" fill="#2c4c68"/><text x="166" y="83.4" font-family="Manrope, sans-serif" font-size="5.6" font-weight="700" fill="#9fb8d6">Feedback-Tool.pdf</text>
<rect x="138" y="98" width="194" height="114" rx="3" fill="#fff" stroke="#dde5ec"/>
<rect x="138" y="98" width="194" height="14" rx="3" fill="#2f6db5"/><rect x="138" y="106" width="194" height="6" fill="#2f6db5"/>
<text x="146" y="108" font-family="Manrope, sans-serif" font-size="6.4" font-weight="800" fill="#fff" letter-spacing=".05em">PEER &amp; TEACHER FEEDBACK</text>
<!-- rows with circles that get ticked -->
<g font-family="Manrope, sans-serif" font-size="5.4" font-weight="700" fill="#8b969e">
  <text x="146" y="128">Clear structure</text><text x="146" y="143">Good pronunciation</text><text x="146" y="158">Accurate language</text><text x="146" y="173">Strong answers</text>
</g>
<g stroke="#b9c6d2" stroke-width="1">
  <circle cx="262" cy="126" r="3.6"/><circle cx="276" cy="126" r="3.6"/><circle cx="290" cy="126" r="3.6"/><circle cx="304" cy="126" r="3.6"/><circle cx="318" cy="126" r="3.6"/>
  <circle cx="262" cy="141" r="3.6"/><circle cx="276" cy="141" r="3.6"/><circle cx="290" cy="141" r="3.6"/><circle cx="304" cy="141" r="3.6"/><circle cx="318" cy="141" r="3.6"/>
  <circle cx="262" cy="156" r="3.6"/><circle cx="276" cy="156" r="3.6"/><circle cx="290" cy="156" r="3.6"/><circle cx="304" cy="156" r="3.6"/><circle cx="318" cy="156" r="3.6"/>
  <circle cx="262" cy="171" r="3.6"/><circle cx="276" cy="171" r="3.6"/><circle cx="290" cy="171" r="3.6"/><circle cx="304" cy="171" r="3.6"/><circle cx="318" cy="171" r="3.6"/>
</g>
<circle class="tk" cx="304" cy="126" r="2.4" fill="#2f6db5"/><circle class="tk k2" cx="290" cy="141" r="2.4" fill="#2f6db5"/><circle class="tk k3" cx="318" cy="156" r="2.4" fill="#2f6db5"/><circle class="tk k4" cx="304" cy="171" r="2.4" fill="#2f6db5"/>
<!-- a text field being typed in -->
<rect x="146" y="182" width="176" height="20" rx="3" fill="#f6f9fc" stroke="#cfdbe6"/>
<text x="151" y="194.5" font-family="Manrope, sans-serif" font-size="6" font-weight="600" fill="#14293a">Action: slow down at the key points</text>
<rect class="cu" x="272" y="187" width="1.4" height="10" fill="#2f6db5"/>
<!-- the base -->
<path d="M84 230h302l-14 14H98z" fill="url(#d-base)"/><path d="M84 230h302" stroke="#fff" stroke-width="1.5"/><rect x="214" y="231" width="42" height="4" rx="2" fill="#a9b4bd"/>

<!-- the folder with the PDF dropping in -->
<g>
  <path d="M396 196h34l8 8h56a7 7 0 0 1 7 7v54a7 7 0 0 1-7 7h-98a7 7 0 0 1-7-7v-62a7 7 0 0 1 7-7z" fill="url(#d-foldb)"/>
  <g class="dr">
    <rect x="420" y="180" width="46" height="58" rx="5" fill="#fff" stroke="#d9e1ea"/>
    <rect x="426" y="188" width="22" height="9" rx="2.5" fill="#e64626"/><text x="437" y="194.6" text-anchor="middle" font-family="Manrope, sans-serif" font-size="5.8" font-weight="900" fill="#fff">PDF</text>
    <path d="M426 204h34M426 211h28M426 218h32" stroke="#c9d3da" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="456" cy="229" r="5.5" fill="#2f9a63"/><path d="m453.4 229 1.8 1.8 3.4-3.6" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M389 222a7 7 0 0 1 7-7h104a7 7 0 0 1 6.8 8.6l-9 42A7 7 0 0 1 491 271h-95a7 7 0 0 1-7-7z" fill="url(#d-fold)"/>
  <path d="M396 224h104" stroke="#fff" stroke-opacity=".4"/>
  <rect x="420" y="234" width="50" height="14" rx="7" fill="#fff" opacity=".9"/><text x="445" y="244" text-anchor="middle" font-family="Manrope, sans-serif" font-size="7" font-weight="800" letter-spacing=".1em" fill="#a5651a">SAVED</text>
  <rect x="412" y="255" width="66" height="5" rx="2.5" fill="#fff" opacity=".4"/><rect class="pb" x="412" y="255" width="66" height="5" rx="2.5" fill="#fff"/>
</g>

<!-- the download badge -->
<g class="fl">
  <g filter="url(#d-sh)"><circle cx="404" cy="70" r="28" fill="#2f6db5"/></g>
  <circle cx="404" cy="70" r="28" fill="url(#d-shine)" opacity=".6"/>
  <g class="ar"><path d="M404 56v20m-8-8 8 8 8-8" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M393 84h22" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
</g>

<!-- a chat bubble that sends the PDF -->
<g class="fl f2">
  <g filter="url(#d-sh)"><path d="M28 136h76a12 12 0 0 1 12 12v30a12 12 0 0 1-12 12H48l-12 10v-10h-8a12 12 0 0 1-12-12v-30a12 12 0 0 1 12-12z" fill="#fff"/></g>
  <rect x="26" y="146" width="80" height="22" rx="7" fill="#fde9e1"/><rect x="30" y="150" width="12" height="14" rx="2" fill="#fff" stroke="#e6a593"/><rect x="31" y="157" width="10" height="5" rx="1" fill="#e64626"/>
  <path d="M47 154h40M47 160h28" stroke="#d99a86" stroke-width="2.2" stroke-linecap="round"/>
  <g class="ty" fill="#1f8a7a"><rect x="30" y="176" width="5" height="5" rx="2.5"/><rect x="39" y="176" width="5" height="5" rx="2.5"/><rect x="48" y="176" width="5" height="5" rx="2.5"/></g>
  <text x="104" y="181" text-anchor="end" font-family="Manrope, sans-serif" font-size="6" font-weight="800" fill="#1f8a7a">Sent to 4 ✓✓</text>
</g>
<!-- two classmates -->
<g class="fl f3">
  <circle cx="44" cy="96" r="13" fill="#e8f0fb" stroke="#fff" stroke-width="2.5"/><circle cx="44" cy="92" r="4.4" fill="#2f6db5"/><path d="M36 104a8 8 0 0 1 16 0" fill="#2f6db5"/>
  <circle cx="68" cy="102" r="13" fill="#e3f4ef" stroke="#fff" stroke-width="2.5"/><circle cx="68" cy="98" r="4.4" fill="#1f8a7a"/><path d="M60 110a8 8 0 0 1 16 0" fill="#1f8a7a"/>
  <circle cx="80" cy="90" r="5" fill="#2f9a63" stroke="#fff" stroke-width="2"/>
</g>
<!-- a pen -->
<g transform="rotate(-28 470 140)" class="fl f3"><rect x="438" y="134" width="64" height="9" rx="4.5" fill="#14293a"/><rect x="438" y="134" width="64" height="3" rx="1.5" fill="#fff" opacity=".25"/><rect x="486" y="133" width="6" height="11" rx="1.5" fill="#e3a843"/><path d="M438 134l-9 4.5 9 4.5z" fill="#c9b48e"/><path d="M432 137.2l-3 1.3 3 1.3z" fill="#14293a"/></g>
<!-- sparkles -->
<path class="tw" d="M160 30l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#e3a843"/>
<path class="tw t2" d="M506 120l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#2f6db5"/>
<path class="tw t3" d="M84 250l1.4 3.4 3.4 1.4-3.4 1.4-1.4 3.4-1.4-3.4-3.4-1.4 3.4-1.4z" fill="#1f8a7a"/>
<circle class="tw t2" cx="330" cy="30" r="2.4" fill="#e64626"/>
</svg>
