<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" fill="none" role="img" aria-label="A clipboard with three ticked lines beside a ring chart split into listening, reading, writing and speaking, with a stopwatch and a laptop">
<style>
  .fl { animation: fl 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .f2 { animation-delay: -2s; } .f3 { animation-delay: -4s; }
  .tk { stroke-dasharray: 26; animation: tk 6s ease-in-out infinite; } .k2 { animation-delay: .5s; } .k3 { animation-delay: 1s; }
  .sw { animation: sw 8s linear infinite; transform-box: view-box; transform-origin: 292px 72px; }
  .tw { animation: tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .t2 { animation-delay: -1.6s; }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes tk { 0%, 8% { stroke-dashoffset: 26; } 30%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 26; } }
  @keyframes sw { to { transform: rotate(360deg); } }
  @keyframes tw { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tk { stroke-dashoffset: 0; } }
</style>
<defs>
  <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1fa"/><stop offset="1" stop-color="#fbf1e8"/></linearGradient>
  <filter id="ash" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#14293a" flood-opacity=".14"/></filter>
</defs>
<ellipse cx="180" cy="122" rx="160" ry="108" fill="url(#abg)"/>
<circle cx="180" cy="122" r="104" stroke="#d9dfee" stroke-dasharray="2 7"/>
<ellipse cx="176" cy="214" rx="124" ry="9" fill="#14293a" opacity=".07"/>
<!-- laptop -->
<g class="fl f3">
  <rect x="34" y="132" width="78" height="52" rx="6" fill="#1f3b54"/><rect x="39" y="137" width="68" height="42" rx="3" fill="#e9f0f8"/>
  <rect x="44" y="143" width="34" height="4" rx="2" fill="#4f68b8"/><rect x="44" y="151" width="56" height="3" rx="1.5" fill="#c4cfe2"/><rect x="44" y="157" width="48" height="3" rx="1.5" fill="#c4cfe2"/><rect x="44" y="165" width="22" height="8" rx="4" fill="#2f9a63"/>
  <path d="M26 186h94l-6 7H32z" fill="#14293a"/>
</g>
<!-- clipboard -->
<g filter="url(#ash)" transform="rotate(-4 168 124)">
  <rect x="118" y="44" width="112" height="152" rx="14" fill="#fff"/>
  <rect x="148" y="34" width="52" height="20" rx="8" fill="#4f68b8"/><rect x="164" y="30" width="20" height="8" rx="4" fill="#3a4f95"/>
</g>
<g transform="rotate(-4 168 124)" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="138" cy="84" r="9" fill="#e8f5ee"/><path class="tk" d="M133 84l4 4 7-8" stroke="#2f9a63" stroke-width="3"/>
  <circle cx="138" cy="114" r="9" fill="#e8f5ee"/><path class="tk k2" d="M133 114l4 4 7-8" stroke="#2f9a63" stroke-width="3"/>
  <circle cx="138" cy="144" r="9" fill="#e8f5ee"/><path class="tk k3" d="M133 144l4 4 7-8" stroke="#2f9a63" stroke-width="3"/>
  <g stroke="#dfe3ec" stroke-width="5"><path d="M156 82h54M156 112h42M156 142h50"/></g>
  <g stroke="#eef0f5" stroke-width="4"><path d="M156 92h34M156 122h28M156 152h36"/></g>
  <rect x="128" y="168" width="44" height="12" rx="6" fill="#fdeee9"/><rect x="134" y="172" width="30" height="4" rx="2" fill="#e64626"/>
</g>
<!-- score ring: 20 / 20 / 30 / 30 -->
<g transform="translate(268 150)"><g class="fl">
  <circle r="34" fill="#fff" filter="url(#ash)"/>
  <g fill="none" stroke-width="10" transform="rotate(-90)">
    <circle r="24" stroke="#4f68b8" stroke-dasharray="30.16 150.8"/>
    <circle r="24" stroke="#2f9a63" stroke-dasharray="30.16 150.8" stroke-dashoffset="-30.16"/>
    <circle r="24" stroke="#d9902a" stroke-dasharray="45.24 150.8" stroke-dashoffset="-60.32"/>
    <circle r="24" stroke="#e64626" stroke-dasharray="45.24 150.8" stroke-dashoffset="-105.56"/>
  </g>
  <text y="4" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#14293a">100%</text>
</g></g>
<!-- stopwatch -->
<g class="fl f2">
  <rect x="286" y="38" width="12" height="8" rx="2" fill="#14293a"/>
  <circle cx="292" cy="72" r="22" fill="#fff" stroke="#14293a" stroke-width="3"/>
  <path d="M292 72V58" stroke="#e5e9ee" stroke-width="3" stroke-linecap="round"/>
  <path class="sw" d="M292 72V57" stroke="#e64626" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="292" cy="72" r="2.6" fill="#14293a"/>
</g>
<path class="tw" d="M70 76l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e3a843"/>
<path class="tw t2" d="M330 118l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#8a4f9e"/>
<circle class="tw" cx="96" cy="48" r="3" fill="#2f9a63"/><circle class="tw t2" cx="232" cy="212" r="2.6" fill="#4f68b8"/>
</svg>
