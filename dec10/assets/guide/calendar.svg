<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" fill="none" role="img" aria-label="A desk calendar with a week of coloured days, today circled, a pencil, a small clock and a sprout in a pot">
<style>
  .fl { animation: fl 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .f2 { animation-delay: -2s; } .f3 { animation-delay: -4s; }
  .pu { animation: pu 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .hd { animation: hd 12s linear infinite; transform-box: view-box; transform-origin: 300px 76px; }
  .tw { animation: tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .t2 { animation-delay: -1.6s; }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @keyframes hd { to { transform: rotate(360deg); } }
  @keyframes tw { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf1ea"/><stop offset="1" stop-color="#eef2f9"/></linearGradient>
  <linearGradient id="chd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef5a37"/><stop offset="1" stop-color="#d63c1e"/></linearGradient>
  <filter id="csh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#14293a" flood-opacity=".14"/></filter>
</defs>
<ellipse cx="180" cy="122" rx="160" ry="108" fill="url(#cbg)"/>
<circle cx="180" cy="122" r="104" stroke="#e7dccd" stroke-dasharray="2 7"/>
<ellipse cx="172" cy="214" rx="120" ry="9" fill="#14293a" opacity=".07"/>
<!-- calendar -->
<g filter="url(#csh)">
  <rect x="70" y="52" width="196" height="154" rx="16" fill="#fff"/>
  <path d="M70 68a16 16 0 0 1 16-16h164a16 16 0 0 1 16 16v20H70z" fill="url(#chd)"/>
</g>
<g fill="#fff" opacity=".9"><rect x="86" y="64" width="54" height="7" rx="3.5"/><rect x="86" y="75" width="32" height="5" rx="2.5" opacity=".7"/></g>
<g fill="#14293a"><rect x="106" y="40" width="9" height="24" rx="4.5"/><rect x="222" y="40" width="9" height="24" rx="4.5"/></g>
<g fill="#cdb8a8"><circle cx="110.5" cy="62" r="2"/><circle cx="226.5" cy="62" r="2"/></g>
<!-- weekday labels -->
<g font-family="Manrope, Arial, sans-serif" font-size="8" font-weight="800" fill="#9aa6b0" text-anchor="middle" letter-spacing=".6">
  <text x="98" y="104">MON</text><text x="133" y="104">TUE</text><text x="168" y="104">WED</text><text x="203" y="104">THU</text><text x="238" y="104">FRI</text>
</g>
<!-- day cells -->
<g>
  <rect x="84" y="110" width="28" height="40" rx="7" fill="#eef6f2"/><rect x="88" y="116" width="20" height="4" rx="2" fill="#2f9a63"/><rect x="88" y="124" width="14" height="3" rx="1.5" fill="#bfe0cf"/><rect x="88" y="131" width="17" height="3" rx="1.5" fill="#bfe0cf"/>
  <rect x="119" y="110" width="28" height="40" rx="7" fill="#eef1fa"/><rect x="123" y="116" width="20" height="4" rx="2" fill="#4f68b8"/><rect x="123" y="124" width="16" height="3" rx="1.5" fill="#c8d1ee"/>
  <rect x="154" y="110" width="28" height="40" rx="7" fill="#fff4ef" stroke="#e64626" stroke-width="1.6"/><rect x="158" y="116" width="20" height="4" rx="2" fill="#e64626"/><rect x="158" y="124" width="15" height="3" rx="1.5" fill="#f6c3b4"/><rect x="158" y="131" width="18" height="3" rx="1.5" fill="#f6c3b4"/>
  <rect x="189" y="110" width="28" height="40" rx="7" fill="#f6f0fa"/><rect x="193" y="116" width="20" height="4" rx="2" fill="#8a4f9e"/><rect x="193" y="124" width="12" height="3" rx="1.5" fill="#dcc8e6"/>
  <rect x="224" y="110" width="28" height="40" rx="7" fill="#fdf6e6"/><rect x="228" y="116" width="20" height="4" rx="2" fill="#d9902a"/><rect x="228" y="124" width="17" height="3" rx="1.5" fill="#f0d9ad"/>
  <g fill="#f4efe8"><rect x="84" y="156" width="28" height="38" rx="7"/><rect x="119" y="156" width="28" height="38" rx="7"/><rect x="154" y="156" width="28" height="38" rx="7"/><rect x="189" y="156" width="28" height="38" rx="7"/><rect x="224" y="156" width="28" height="38" rx="7"/></g>
  <circle cx="203" cy="175" r="6" fill="#e64626" opacity=".85"/><path d="M200.5 175l1.8 1.8 3.4-3.6" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- today ring -->
<circle class="pu" cx="168" cy="130" r="20" stroke="#e64626" stroke-width="2" stroke-dasharray="4 4" opacity=".55"/>
<!-- pencil -->
<g class="fl f2"><g transform="rotate(-32 286 168)">
  <rect x="270" y="150" width="58" height="12" rx="3" fill="#f2c14e"/><rect x="270" y="150" width="58" height="4" rx="2" fill="#f7d77e"/>
  <rect x="320" y="150" width="10" height="12" rx="2" fill="#f19a9a"/><rect x="316" y="150" width="5" height="12" fill="#c9c9c9"/>
  <path d="M270 150l-12 6 12 6z" fill="#f3dcc0"/><path d="M262 154l-4 2 4 2z" fill="#14293a"/>
</g></g>
<!-- clock -->
<g class="fl">
  <circle cx="300" cy="76" r="24" fill="#fff" stroke="#14293a" stroke-width="3"/>
  <g stroke="#c9d1d8" stroke-width="2" stroke-linecap="round"><path d="M300 56v4M300 92v4M280 76h4M316 76h4"/></g>
  <path d="M300 76v-11" stroke="#14293a" stroke-width="3" stroke-linecap="round"/>
  <path class="hd" d="M300 76h10" stroke="#e64626" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="300" cy="76" r="2.6" fill="#14293a"/>
</g>
<!-- sprout pot (break weeks) -->
<g class="fl f3">
  <path d="M38 176h30l-4 24H42z" fill="#d07a4a"/><rect x="35" y="171" width="36" height="8" rx="3" fill="#e08b58"/>
  <path d="M53 171c0-14 0-20 0-26" stroke="#2f9a63" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M53 156c-10-2-15-9-15-15 8 0 14 5 15 15zM53 150c8-3 13-10 13-16-8 1-13 7-13 16z" fill="#4dbb7d"/>
</g>
<path class="tw" d="M60 66l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#e3a843"/>
<path class="tw t2" d="M330 196l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#4f68b8"/>
<circle class="tw" cx="40" cy="112" r="3" fill="#8a4f9e"/><circle class="tw t2" cx="250" cy="34" r="2.6" fill="#2f9a63"/>
</svg>
