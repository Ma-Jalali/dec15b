ith, 2017)</tspan><tspan>.</tspan></text><rect x="64" y="344" width="181" height="30" rx="15" fill="#b0512a" opacity=".1"/><text x="78" y="364" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#b0512a">&amp; inside brackets</text><rect x="255.00000000000003" y="344" width="217" height="30" rx="15" fill="#b0512a" opacity=".1"/><text x="269.0" y="364" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#b0512a">comma before the year</text><rect x="482.00000000000006" y="344" width="271" height="30" rx="15" fill="#b0512a" opacity=".1"/><text x="496.00000000000006" y="364" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#b0512a">full stop after the bracket</text><rect x="763.0" y="344" width="136" height="30" rx="15" fill="#b0512a" opacity=".1"/><text x="777.0" y="364" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#b0512a">about 70–80%</text><g font-family="'Helvetica Neue', Arial, sans-serif"><text x="40" y="452" font-weight="800" font-size="15" letter-spacing="2" fill="#5d6a74">ALSO REMEMBER</text><rect x="40" y="470" width="300" height="66" rx="14" fill="#fff" stroke="#e1ddd6" stroke-width="2"/><text x="56" y="496" font-weight="800" font-size="13" letter-spacing="1.5" fill="#3a58a0">3+ AUTHORS</text><text x="56" y="522" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#14293a">Harris et al. (2011) · (Harris et al., 2011)</text><rect x="358" y="470" width="300" height="66" rx="14" fill="#fff" stroke="#e1ddd6" stroke-width="2"/><text x="374" y="496" font-weight="800" font-size="13" letter-spacing="1.5" fill="#3a58a0">2 SOURCES</text><text x="374" y="522" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#14293a">(Harris, 2017; Smith, 2019)</text><rect x="676" y="470" width="300" height="66" rx="14" fill="#fff" stroke="#e1ddd6" stroke-width="2"/><text x="692" y="496" font-weight="800" font-size="13" letter-spacing="1.5" fill="#3a58a0">A QUOTE</text><text x="692" y="522" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#14293a">(Weinstein &amp; Selman, 2014, p. 13)</text></g></svg>