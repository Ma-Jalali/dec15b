<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t"><title id="t">Integral: Harris and Smith (2017) point out that … uses and, and the year in brackets. Non-integral: … (Harris &amp; Smith, 2017). uses an ampersand, a comma before the year and a full stop after the bracket. Three or more authors: Harris et al. (2011) or (Harris et al., 2011). Two sources: (Harris, 2017; Smith, 2019).</title>
<style>.fl { animation: fl 6s ease-in-out infinite; transform-box: fill-box; } .f2 { animation-delay: -2s; } .f3 { animation-delay: -4s; }
