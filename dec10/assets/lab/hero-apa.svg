  <text x="54" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="33" fill="#14293a"><tspan font-weight="700" fill="#13887a">Harris and Smith (2017)</tspan> point</text>
  <text x="54" y="154" font-family="Georgia, 'Times New Roman', serif" font-size="33" fill="#14293a">out that green jobs …</text>
  <path d="M54 120h334" stroke="#13887a" stroke-width="3" stroke-opacity=".5" stroke-linecap="round"/>
