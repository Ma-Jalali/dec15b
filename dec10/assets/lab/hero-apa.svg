  <text x="54" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6b7a82"><tspan font-weight="800" letter-spacing="3" fill="#c23d22">NON-INTEGRAL</tspan> · name in brackets</text>
  <text x="54" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="33" fill="#14293a">… green jobs are rising</text>
  <text x="54" y="154" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="33" fill="#c23d22">(Harris &amp; Smith, 2017).</text>
  <g transform="translate(540 36)" filter="url(#ha-ls)"><circle r="26" fill="url(#ha-coral)"/><text y="9" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" fill="#fff">( )</text></g>
</g></g>

