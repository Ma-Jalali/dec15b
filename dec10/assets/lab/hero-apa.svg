</g></g>

<!-- non-integral card -->
<g class="ha-fl ha-d2"><g transform="translate(712 470)">
  <rect x="10" y="12" width="580" height="190" rx="24" fill="#cdb7a8"/>
  <rect width="580" height="190" rx="24" fill="url(#ha-card)" filter="url(#ha-s)"/>
