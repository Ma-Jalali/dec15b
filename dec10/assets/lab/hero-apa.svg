<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="ha-t">
<title id="ha-t">A thick journal issue, Green jobs in a changing economy by Harris and Smith (2017), with one sentence being highlighted. Dashed arrows carry it to two citation cards: integral, Harris and Smith (2017) point out that green jobs …, and non-integral, … green jobs are rising (Harris &amp; Smith, 2017). Chips float nearby: et al., argue, found and p. 13.</title>
<style>
  .ha-fl { animation: ha-fl 6s ease-in-out infinite; } .ha-d2 { animation-delay: -2s; } .ha-d3 { animation-delay: -4s; }
  .ha-tw { animation: ha-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .ha-k2 { animation-delay: -1.1s; } .ha-k3 { animation-delay: -2.2s; }
  .ha-hl { animation: ha-hl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
  .ha-pen { animation: ha-pen 5s ease-in-out infinite; }
  .ha-fw { stroke-dasharray: 10 12; animation: ha-fw 1.8s linear infinite; }
  .ha-lf { animation: ha-lf 5s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; } .ha-l2 { animation-delay: -2.5s; }
  @keyframes ha-fl { 50% { transform: translateY(-11px); } }
  @keyframes ha-tw { 0%, 100% { opacity: .3; transform: scale(.65) rotate(0); } 50% { opacity: 1; transform: scale(1.05) rotate(45deg); } }
  @keyframes ha-hl { 0% { transform: scaleX(0); } 65%, 100% { transform: scaleX(1); } }
  @keyframes ha-pen { 0% { transform: translateX(-240px); } 65%, 100% { transform: translateX(0); } }
  @keyframes ha-fw { to { stroke-dashoffset: -44; } }
  @keyframes ha-lf { 50% { transform: rotate(4deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="ha-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8f3"/><stop offset="1" stop-color="#f6e6da"/></linearGradient>
  <radialGradient id="ha-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f8dccd"/><stop offset="1" stop-color="#f8dccd" stop-opacity="0"/></radialGradient>
  <linearGradient id="ha-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4e2d4"/><stop offset="1" stop-color="#e6cbb6"/></linearGradient>
  <linearGradient id="ha-band" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec6a4a"/><stop offset="1" stop-color="#b8432a"/></linearGradient>
  <linearGradient id="ha-page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fbf6f1"/></linearGradient>
  <linearGradient id="ha-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fbf7f2"/></linearGradient>
  <linearGradient id="ha-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22a492"/><stop offset="1" stop-color="#0f7266"/></linearGradient>
  <linearGradient id="ha-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef6a4b"/><stop offset="1" stop-color="#c23d22"/></linearGradient>
  <linearGradient id="ha-mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c062"/><stop offset="1" stop-color="#c98a24"/></linearGradient>
  <linearGradient id="ha-pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e57656"/><stop offset=".45" stop-color="#d4583a"/><stop offset="1" stop-color="#9f3c24"/></linearGradient>
  <linearGradient id="ha-leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3aa58f"/><stop offset="1" stop-color="#1b6e60"/></linearGradient>
  <filter id="ha-s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#4a2416" flood-opacity=".17"/><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4a2416" flood-opacity=".14"/></filter>
  <filter id="ha-ls" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#4a2416" flood-opacity=".18"/></filter>
  <filter id="ha-bl" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="10"/></filter>
  <pattern id="ha-dt" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#b0452b" opacity=".2"/></pattern>
</defs>

