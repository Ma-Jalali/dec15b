<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t"><title id="t">A journal article with one sentence highlighted, and two citation cards: integral, Harris and Smith (2017) point out that, and non-integral, (Harris and Smith, 2017). Chips: et al., ampersand, p. 13, semicolon.</title>
