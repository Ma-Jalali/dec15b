<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="hg-t">
<title id="hg-t">Grammar building blocks. Top row of 3D word blocks: The results, of the experiment lifted out of the sentence as a dashed ghost block, were, published. An AGREE arc joins results to were. Below, bricks on a platform: Costa Rica protects a quarter of its land, which attracts tourists, with the which block dropping into place and a bracket marking the relative clause. Chips float around: However, rely on, is / are, and, who, and a semicolon.</title>
<style>
  .hg-fl { animation: hg-fl 6s ease-in-out infinite; } .hg-d2 { animation-delay: -2s; } .hg-d3 { animation-delay: -4s; }
  .hg-gh { animation: hg-gh 5s ease-in-out infinite; }
  .hg-wh { animation: hg-wh 4s ease-in-out infinite; }
  .hg-arc { stroke-dasharray: 14 12; animation: hg-da 2.4s linear infinite; }
  .hg-pu { animation: hg-pu 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .hg-tw { animation: hg-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .hg-k2 { animation-delay: -1.1s; } .hg-k3 { animation-delay: -2.2s; }
  @keyframes hg-fl { 50% { transform: translateY(-10px); } }
  @keyframes hg-gh { 50% { transform: translateY(-14px); } }
  @keyframes hg-wh { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-26px); } 55% { transform: translateY(0); } 62% { transform: translateY(-5px); } 70% { transform: translateY(0); } }
  @keyframes hg-da { to { stroke-dashoffset: -52; } }
  @keyframes hg-pu { 50% { transform: scale(1.06); } }
  @keyframes hg-tw { 0%, 100% { opacity: .3; transform: scale(.65) rotate(0); } 50% { opacity: 1; transform: scale(1.05) rotate(45deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
