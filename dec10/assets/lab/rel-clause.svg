<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t"><title id="t">Two sentences, I have a book. I bought it on Saturday, become one: I have a book which I bought on Saturday. The word it is crossed out: which already stands for the book.</title>
<style>.fl { animation: fl 6s ease-in-out infinite; transform-box: fill-box; } .f2 { animation-delay: -2s; } .f3 { animation-delay: -4s; }
@keyframes fl { 50% { transform: translateY(-10px); } } .tw { animation: tw 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .t2 { animation-delay: -1.5s; }
@keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } } .x { stroke-dasharray: 60; animation: xx 4s ease-in-out infinite; } @keyframes xx { 0%, 20% { stroke-dashoffset: 60; } 45%, 100% { stroke-dashoffset: 0; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style>
<defs><filter id="sh" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#14293a" flood-opacity=".13"/></filter>
<pattern id="dt" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#14293a" opacity=".12"/></pattern></defs><rect width="1000" height="380" rx="24" fill="#fbfaf7"/><g font-family="Georgia, 'Times New Roman', serif" font-size="30"><text x="60" y="80" fill="#14293a">I have <tspan font-weight="700" fill="#2b776e">a book</tspan>.</text><text x="330" y="80" fill="#14293a">I bought <tspan font-weight="700" fill="#2b776e">it</tspan> on Saturday.</text></g><path d="M500 108v54" stroke="#9aa5ad" stroke-width="4" stroke-linecap="round"/><path d="M488 150l12 14 12-14" stroke="#9aa5ad" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="186" width="920" height="96" rx="20" fill="#fff" filter="url(#sh)"/><g font-family="Georgia, 'Times New Roman', serif" font-size="32"><text x="70" y="246" fill="#14293a">I have <tspan font-weight="700" fill="#2b776e">a book</tspan></text><text x="292" y="246" font-weight="700" fill="#3a58a0">which</text><text x="398" y="246" fill="#14293a">I bought</text><text x="532" y="246" font-weight="700" fill="#c4562f">it</text><text x="566" y="246" fill="#14293a">on Saturday.</text></g><path class="x" d="M526 214l34 40M560 214l-34 40" stroke="#e64626" stroke-width="5" stroke-linecap="round"/><rect x="286" y="212" width="94" height="46" rx="10" fill="none" stroke="#3a58a0" stroke-width="2.5"/><path d="M332 258c0 40 210 40 210 6" fill="none" stroke="#3a58a0" stroke-width="2.5" stroke-dasharray="6 6"/><g font-family="'Helvetica Neue', Arial, sans-serif"><rect x="200" y="306" width="600" height="46" rx="23" fill="#3a58a0"/><text x="500" y="336" text-anchor="middle" font-weight="800" font-size="17" fill="#fff">which = the book, so delete “it”. One noun, one pronoun.</text></g></svg>