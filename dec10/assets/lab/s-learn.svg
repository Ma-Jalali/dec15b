<text x="226" y="192" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2" fill="#3a58a0">PLURAL → PLURAL</text>
<g class="fl"><circle cx="118" cy="250" r="30" fill="#fff" fill-opacity=".7" stroke="#14293a" stroke-width="7"/><path d="M96 272l-26 28" stroke="#14293a" stroke-width="10" stroke-linecap="round"/><path d="M104 234a18 18 0 0 1 12-5" stroke="#3a58a0" stroke-width="4" stroke-linecap="round"/></g>
