.lu-ln { stroke-dasharray: 130; animation: lu-ln 7s ease-in-out infinite; } .lu-l2 { animation-delay: .8s; } .lu-l3 { animation-delay: 1.6s; }
@keyframes lu-ln { 0%, 6% { stroke-dashoffset: 130; } 40%, 100% { stroke-dashoffset: 0; } }
.lu-pen { animation: lu-pen 7s ease-in-out infinite; } @keyframes lu-pen { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-30px, -36px); } 35% { transform: translate(-6px, -18px); } 55% { transform: translate(-28px, -2px); } 75% { transform: translate(-4px, 4px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
