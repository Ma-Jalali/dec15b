<path class="tw tw2" d="M372 236h20m-10-10v20" stroke="#a3416a" stroke-width="2.4" stroke-linecap="round"/>

<g filter="url(#s)"><path d="M72 112c40-12 96-12 148 4 52-16 108-16 148-4v152c-40-12-96-12-148 4-52-16-108-16-148-4z" fill="#fff"/></g>
<path d="M220 116v152" stroke="#e6dfe3" stroke-width="2"/>
