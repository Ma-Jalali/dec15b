<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t"><title id="t">Two sentences. The weather in the southern states is very hot: ignore in the southern states, weather goes with is. One of the countries I would like to visit is Italy: ignore of the countries I would like to visit, one goes with is.</title>
<style>.arc { animation: da 2.4s linear infinite; } @keyframes da { to { stroke-dashoffset: -30; } } .fl { animation: fl 6s ease-in-out infinite; transform-box: fill-box; } .f2 { animation-delay: -2s; } .f3 { animation-delay: -4s; }
@keyframes fl { 50% { transform: translateY(-10px); } } .tw { animation: tw 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .t2 { animation-delay: -1.5s; }
@keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style>
