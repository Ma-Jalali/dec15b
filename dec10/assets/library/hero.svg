<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" fill="none" role="img" aria-label="A study corner: a bookshelf of readings, an open book with a highlighted line, headphones beside a listening transcript, and a mug of tea">
<style>
  .fl { animation: fl 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .f2 { animation-delay: -2s; } .f3 { animation-delay: -4s; }
  .wv rect { animation: wv 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .wv rect:nth-child(2) { animation-delay: -.2s; } .wv rect:nth-child(3) { animation-delay: -.4s; } .wv rect:nth-child(4) { animation-delay: -.6s; } .wv rect:nth-child(5) { animation-delay: -.8s; } .wv rect:nth-child(6) { animation-delay: -1s; } .wv rect:nth-child(7) { animation-delay: -.3s; }
  .st { animation: st 4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; } .st2 { animation-delay: -2s; }
  .hl { stroke-dasharray: 80; stroke-dashoffset: 80; animation: hl 7s ease-in-out infinite; }
  .tw { animation: tw 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .t2 { animation-delay: -1.5s; } .t3 { animation-delay: -.8s; }
  .lf { animation: lf 7s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  .sw { animation: sw 2.4s ease-out infinite; transform-box: fill-box; transform-origin: left center; } .sw2 { animation-delay: -1.2s; }
  @keyframes fl { 50% { transform: translateY(-6px); } }
  @keyframes wv { 50% { transform: scaleY(.4); } }
  @keyframes st { 0% { opacity: 0; transform: translateY(6px) scaleY(.8); } 30% { opacity: .7; } 100% { opacity: 0; transform: translateY(-14px) scaleY(1.1); } }
  @keyframes hl { 0%, 12% { stroke-dashoffset: 80; } 40%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes tw { 0%, 100% { opacity: .25; transform: scale(.55) rotate(0); } 50% { opacity: 1; transform: scale(1.05) rotate(45deg); } }
  @keyframes lf { 50% { transform: rotate(-3deg); } }
  @keyframes sw { 0% { opacity: .8; transform: scale(.85); } 100% { opacity: 0; transform: scale(1.25); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .hl { stroke-dashoffset: 0; } }
</style>
<defs>
  <radialGradient id="h-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3d9"/><stop offset=".6" stop-color="#fdeedb" stop-opacity=".5"/><stop offset="1" stop-color="#fdeedb" stop-opacity="0"/></radialGradient>
  <radialGradient id="h-glow2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e3f2ee"/><stop offset="1" stop-color="#e3f2ee" stop-opacity="0"/></radialGradient>
  <linearGradient id="h-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8a86a"/><stop offset=".5" stop-color="#c48d4f"/><stop offset="1" stop-color="#a8733c"/></linearGradient>
  <linearGradient id="h-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ead9bd"/><stop offset="1" stop-color="#dcc5a0"/></linearGradient>
  <linearGradient id="h-pageL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3ead6"/><stop offset=".15" stop-color="#fffbf2"/><stop offset=".85" stop-color="#fbf4e5"/><stop offset="1" stop-color="#e2d3b4"/></linearGradient>
  <linearGradient id="h-pageR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#efe5cf"/><stop offset=".15" stop-color="#fffbf2"/><stop offset=".85" stop-color="#f9f1e1"/><stop offset="1" stop-color="#ddcdab"/></linearGradient>
  <linearGradient id="h-cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c5571"/><stop offset="1" stop-color="#14293a"/></linearGradient>
  <linearGradient id="h-mug" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e86a4c"/><stop offset=".55" stop-color="#d64e30"/><stop offset="1" stop-color="#b23d24"/></linearGradient>
  <linearGradient id="h-phone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fa08f"/><stop offset="1" stop-color="#16695e"/></linearGradient>
  <linearGradient id="h-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="h-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/></filter>
  <filter id="h-sh2" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#14293a" flood-opacity=".1"/></filter>
  <filter id="h-blur"><feGaussianBlur stdDeviation="6"/></filter>
</defs>

<!-- soft light behind -->
<ellipse cx="300" cy="150" rx="250" ry="150" fill="url(#h-glow)"/>
<ellipse cx="100" cy="230" rx="120" ry="80" fill="url(#h-glow2)"/>
<circle cx="270" cy="150" r="128" stroke="#e3a843" stroke-opacity=".28" stroke-dasharray="2 7"/>

<!-- the shelf, with its books -->
<g>
  <path d="M168 40v108M478 40v108" stroke="#c9b48e" stroke-opacity=".35" stroke-width="1.5"/>
  <g filter="url(#h-sh)">
    <!-- books, left to right -->
    <rect x="186" y="74" width="20" height="74" rx="2.5" fill="#2a8a7d"/><rect x="186" y="74" width="20" height="74" rx="2.5" fill="url(#h-shine)" opacity=".5"/><path d="M186 86h20M186 136h20" stroke="#e3c06a" stroke-width="2"/><rect x="191" y="96" width="10" height="28" rx="1.5" fill="#fff" opacity=".22"/>
    <rect x="208" y="62" width="17" height="86" rx="2.5" fill="#d0602a"/><path d="M208 72h17M208 140h17" stroke="#fbe0b5" stroke-width="1.6"/><path d="M216.5 84v40" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
    <rect x="227" y="80" width="22" height="68" rx="2.5" fill="#1f3f5c"/><path d="M227 90h22M227 138h22" stroke="#e3a843" stroke-width="2"/><circle cx="238" cy="112" r="5" stroke="#e3a843" stroke-width="1.5"/>
    <rect x="251" y="68" width="15" height="80" rx="2.5" fill="#e3a843"/><path d="M251 78h15M251 140h15" stroke="#8a5a12" stroke-opacity=".5" stroke-width="1.5"/><path d="M258.5 88v34" stroke="#fff" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>
    <g transform="rotate(12 290 148)"><rect x="270" y="76" width="19" height="72" rx="2.5" fill="#7a4a8c"/><path d="M270 86h19M270 138h19" stroke="#e7c9f0" stroke-width="1.6"/><path d="M279.5 96v28" stroke="#fff" stroke-opacity=".45" stroke-width="1.8" stroke-linecap="round"/></g>
    <rect x="300" y="88" width="34" height="60" rx="3" fill="#f6efe1" stroke="#d9c9a8"/><path d="M306 98h22M306 104h16M306 132h22" stroke="#b9a37c" stroke-width="1.6" stroke-linecap="round"/><rect x="306" y="110" width="22" height="16" rx="2" fill="#2f6db5" opacity=".85"/>
    <rect x="336" y="70" width="18" height="78" rx="2.5" fill="#3a6fb6"/><path d="M336 80h18M336 140h18" stroke="#cfe0f7" stroke-width="1.6"/>
    <rect x="356" y="84" width="14" height="64" rx="2.5" fill="#c2563a"/><path d="M356 94h14" stroke="#fbd7c8" stroke-width="1.5"/>
  </g>
  <!-- a little plant at the end of the shelf -->
  <g class="lf">
    <path d="M428 120c-10-12-8-26 2-30 2 10 2 20-2 30zM434 120c4-16 16-22 24-18-4 10-12 16-24 18zM431 120c-12-6-20-2-24 6 10 2 18 0 24-6z" fill="#5aa36a"/>
    <path d="M431 121c0-10 1-18 4-26" stroke="#3d7a4a" stroke-width="1.4"/>
  </g>
  <path d="M418 122h28l-3 24h-22z" fill="#e7d7bd"/><path d="M418 122h28l-1 6h-26z" fill="#d7c2a0"/>
  <!-- a small globe -->
  <g transform="translate(395 128)"><circle r="13" fill="#bfe1ec" stroke="#2f6db5" stroke-width="1.4"/><path d="M-13 0h26M0-13c6 6 6 20 0 26M0-13c-6 6-6 20 0 26" stroke="#2f6db5" stroke-width="1" opacity=".6"/><path d="M-6-6c4 2 6 0 8 4s-2 6 1 9" stroke="#5aa36a" stroke-width="2.5" stroke-linecap="round"/><path d="M-4 15h8M0 13v4" stroke="#8a6f4e" stroke-width="2"/></g>
  <!-- the plank -->
  <rect x="172" y="146" width="302" height="10" rx="3" fill="url(#h-wood)"/><rect x="172" y="146" width="302" height="2.5" rx="1.25" fill="#f0c890" opacity=".7"/>
  <path d="M190 156l-6 14M458 156l6 14" stroke="#a8733c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="322" cy="162" rx="150" ry="5" fill="#14293a" opacity=".06" filter="url(#h-blur)"/>
</g>

<!-- the desk -->
<path d="M30 262c80-8 400-8 490 0v20H30z" fill="url(#h-desk)"/>
<path d="M30 262c80-8 400-8 490 0" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>
<ellipse cx="236" cy="270" rx="150" ry="9" fill="#14293a" opacity=".12" filter="url(#h-blur)"/>

<!-- the open book -->
<g filter="url(#h-sh2)">
  <path d="M236 206c-24-12-66-16-104-8l-4 66c38-8 80-4 108 10 28-14 70-18 108-10l-4-66c-38-8-80-4-104 8z" fill="url(#h-cover)"/>
  <path d="M236 202c-22-12-62-15-98-8l-2 64c36-6 76-2 100 10z" fill="url(#h-pageL)"/>
  <path d="M236 202c22-12 62-15 98-8l2 64c-36-6-76-2-100 10z" fill="url(#h-pageR)"/>
  <path d="M236 202v66" stroke="#8a7656" stroke-opacity=".35"/>
  <!-- lines on the left page, one highlighted -->
  <path class="hl" d="M150 222c22-4 42-3 72 4" stroke="#ffd96a" stroke-width="8" stroke-linecap="round" opacity=".85"/>
  <g stroke="#8b7a5c" stroke-opacity=".45" stroke-width="2.2" stroke-linecap="round">
    <path d="M150 210c24-4 46-3 74 4M150 222c22-4 42-3 72 4M150 234c24-4 46-3 74 4M150 246c18-3 34-2 52 2"/>
    <path d="M250 214c28-7 48-8 74-4M250 226c26-7 46-8 70-4M250 238c28-7 48-8 74-4M250 250c20-5 36-6 54-3"/>
  </g>
  <text x="152" y="203" font-family="Fraunces, Georgia, serif" font-size="9" font-weight="600" fill="#14293a" transform="rotate(-3 152 203)">A.</text>
  <!-- ribbon -->
  <path d="M240 266c1 8 2 14 4 22l-4-3-4 4c-1-8-1-15 0-23z" fill="#e64626"/>
</g>

<!-- headphones and the listening transcript -->
<g class="fl f2">
  <g filter="url(#h-sh2)">
    <rect x="372" y="188" width="92" height="68" rx="10" fill="#fff"/>
    <rect x="372" y="188" width="92" height="68" rx="10" fill="none" stroke="#14293a" stroke-opacity=".06"/>
    <text x="384" y="204" font-family="Manrope, sans-serif" font-size="7" font-weight="800" fill="#2a8a7d" letter-spacing=".08em">TRANSCRIPT</text>
    <g font-family="Manrope, sans-serif" font-size="6" font-weight="700" fill="#8b969e"><text x="384" y="218">00:12</text><text x="384" y="231">00:48</text><text x="384" y="244">01:24</text></g>
    <g stroke="#c9d3da" stroke-width="2.4" stroke-linecap="round"><path d="M406 216h44M406 229h36M406 242h40"/></g>
    <path d="M406 229h22" stroke="#2a8a7d" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <!-- the headphones resting over the card -->
  <path d="M362 216c0-34 22-54 56-54s56 20 56 54" stroke="#14293a" stroke-width="7" stroke-linecap="round"/>
  <path d="M362 216c0-34 22-54 56-54s56 20 56 54" stroke="#3b5872" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <rect x="352" y="206" width="20" height="34" rx="9" fill="url(#h-phone)"/><rect x="355" y="210" width="6" height="22" rx="3" fill="#fff" opacity=".3"/>
  <rect x="464" y="206" width="20" height="34" rx="9" fill="url(#h-phone)"/><rect x="467" y="210" width="6" height="22" rx="3" fill="#fff" opacity=".3"/>
  <!-- sound -->
  <path class="sw" d="M490 214c5 4 5 12 0 16" stroke="#2a8a7d" stroke-width="2.2" stroke-linecap="round"/>
  <path class="sw sw2" d="M496 208c9 8 9 20 0 28" stroke="#2a8a7d" stroke-width="2.2" stroke-linecap="round"/>
</g>

<!-- an audio chip -->
<g class="fl">
  <g filter="url(#h-sh2)"><rect x="372" y="20" width="120" height="38" rx="19" fill="#14293a"/></g>
  <circle cx="391" cy="39" r="11" fill="#e3a843"/><path d="M388 34v10l8-5z" fill="#14293a"/>
  <g class="wv" fill="#fff" opacity=".9"><rect x="410" y="33" width="3" height="12" rx="1.5"/><rect x="416" y="30" width="3" height="18" rx="1.5"/><rect x="422" y="35" width="3" height="8" rx="1.5"/><rect x="428" y="31" width="3" height="16" rx="1.5"/><rect x="434" y="34" width="3" height="10" rx="1.5"/><rect x="440" y="30" width="3" height="18" rx="1.5"/><rect x="446" y="35" width="3" height="8" rx="1.5"/></g>
  <text x="478" y="42" text-anchor="middle" font-family="Manrope, sans-serif" font-size="8" font-weight="700" fill="#cfd8df">3:24</text>
</g>

<!-- an "Aa" card and a quote bubble -->
<g class="fl f3"><g filter="url(#h-sh2)"><rect x="70" y="92" width="58" height="48" rx="12" fill="#fff"/></g><text x="99" y="124" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="600" fill="#14293a">Aa</text><circle cx="120" cy="100" r="3.5" fill="#2f9a63"/></g>
<g class="fl f2"><g filter="url(#h-sh2)"><path d="M84 30h62a10 10 0 0 1 10 10v22a10 10 0 0 1-10 10h-40l-10 9v-9h-12a10 10 0 0 1-10-10V40a10 10 0 0 1 10-10z" fill="#fff"/></g>
  <text x="95" y="56" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#e3a843">“</text><path d="M110 46h34M110 54h26" stroke="#c9d3da" stroke-width="2.4" stroke-linecap="round"/></g>

<!-- the mug of tea -->
<g>
  <path class="st" d="M76 196c-4-6 4-10 0-16" stroke="#c9b48e" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <path class="st st2" d="M86 194c-4-6 4-10 0-16" stroke="#c9b48e" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <g filter="url(#h-sh)"><path d="M62 202h38v42a10 10 0 0 1-10 10H72a10 10 0 0 1-10-10z" fill="url(#h-mug)"/></g>
  <path d="M100 212h6a8 8 0 0 1 0 16h-6" stroke="#b23d24" stroke-width="4"/>
  <ellipse cx="81" cy="202" rx="19" ry="4" fill="#8a3a22"/><ellipse cx="81" cy="203" rx="15" ry="2.6" fill="#a9653a"/>
  <path d="M68 210v26" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <text x="81" y="236" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="10" font-weight="600" fill="#fff" opacity=".85">A+</text>
</g>

<!-- a highlighter on the desk -->
<g transform="rotate(-14 330 270)"><rect x="296" y="264" width="62" height="11" rx="5" fill="#ffd24d"/><rect x="296" y="264" width="62" height="4" rx="2" fill="#fff" opacity=".35"/><rect x="340" y="264" width="18" height="11" rx="3" fill="#14293a"/><path d="M358 266l8 3.5-8 3.5z" fill="#e3a843"/></g>

<!-- sparkles -->
<path class="tw" d="M160 22l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#e3a843"/>
<path class="tw t2" d="M512 120l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#2f6db5"/>
<path class="tw t3" d="M40 160l1.4 3.4 3.4 1.4-3.4 1.4-1.4 3.4-1.4-3.4-3.4-1.4 3.4-1.4z" fill="#2a8a7d"/>
<circle class="tw t2" cx="352" cy="16" r="2.4" fill="#e64626"/>
</svg>
