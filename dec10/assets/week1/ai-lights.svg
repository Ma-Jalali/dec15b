<svg preserveAspectRatio="none" width="960" height="390" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="The AI traffic light. Green, go: learning activities — brainstorm ideas, practise vocabulary, check grammar on your draft, make practice questions. Amber, check: open assessments — only where the task allows, acknowledge every use, be ready to explain your work, your final work is yours. Red, stop: secure assessments — no AI in LRW tests or supervised tasks, no AI to write the answer, no translating a full answer."><title>The AI traffic light. Green, go: learning activities — brainstorm ideas, practise vocabulary, check grammar on your draft, make practice questions. Amber, check: open assessments — only where the task allows, acknowledge every use, be ready to explain your work, your final work is yours. Red, stop: secure assessments — no AI in LRW tests or supervised tasks, no AI to write the answer, no translating a full answer.</title><style>.rv{animation:rv .7s cubic-bezier(.2,.7,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(12px)}}
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tw{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.1s}.t3{animation-delay:-2.2s}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1.05)}}
.pu{animation:pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}26%{transform:scale(1)}}
.ring{animation:ring 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{opacity:.55;transform:scale(.85)}100%{opacity:0;transform:scale(1.45)}}
.bl{animation:bl 5s infinite;transform-box:fill-box;transform-origin:center}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.gl{animation:gl 3s ease-in-out infinite}.gl2{animation-delay:-1s}.gl3{animation-delay:-2s}@keyframes gl{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="al-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#14293a" flood-opacity=".11"/></filter><filter id="al-sh2" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".22"/><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#14293a" flood-opacity=".16"/></filter><filter id="al-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter><linearGradient id="al-bg" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#fdf9f1"/><stop offset="1" stop-color="#f2e9d8"/></linearGradient><radialGradient id="al-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><linearGradient id="al-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf8f2"/></linearGradient><linearGradient id="al-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><pattern id="al-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#14293a" opacity=".09"/></pattern><linearGradient id="al-house" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a4459"/><stop offset="0.5" stop-color="#1a3043"/><stop offset="1" stop-color="#0f1f2c"/></linearGradient><linearGradient id="al-hood" x1="0" y1="0