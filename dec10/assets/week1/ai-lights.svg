<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="The AI traffic light. Green, go: learning activities — brainstorm ideas, practise vocabulary, check grammar on your draft, make practice questions. Amber, check: open assessments — only where the task allows, acknowledge every use, be ready to explain your work, your final work is yours. Red, stop: secure assessments — no AI in LRW tests or supervised tasks, no AI to write the answer, no translating a full answer.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes pu { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } }
.gl { animation: gl 3s ease-in-out infinite; } .gl2 { animation-delay: -1s; } .gl3 { animation-delay: -2s; } @keyframes gl { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs><rect width="960" height="390" rx="28" fill="#fbf6ec"/><rect x="60" y="40" width="130" height="310" rx="30" fill="#14293a" filter="url(#sh)"/><circle class="gl gl" cx="125" cy="95" r="36" fill="#2f9a63"/><circle cx="125" cy="95" r="36" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="3"/><g class="rv" style="animation-delay:0.0s"><rect x="230" y="55" width="690" height="82" rx="18" fill="#fff" filter="url(#sh)"/><rect x="230" y="55" width="8" height="82" rx="4" fill="#2f9a63"/><text x="256" y="83" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#2f9a63" text-anchor="start" letter-spacing="2">GO</text><text x="256" y="109" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="20" fill="#14293a" text-anchor="start">Learning activities</text><text x="500" y="81" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• brainstorm ideas</text><text x="500" y="101" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• practise vocabulary</text><text x="720" y="81" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• check grammar on YOUR draft</text><text x="720" y="101" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• make practice questions</text></g><circle class="gl gl2" cx="125" cy="195" r="36" fill="#d99a1e"/><circle cx="125" cy="195" r="36" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="3"/><g class="rv" style="animation-delay:0.2s"><rect x="230" y="155" width="690" height="82" rx="18" fill="#fff" filter="url(#sh)"/><rect x="230" y="155" width="8" height="82" rx="4" fill="#d99a1e"/><text x="256" y="183" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#d99a1e" text-anchor="start" letter-spacing="2">CHECK</text><text x="256" y="209" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="20" fill="#14293a" text-anchor="start">Open assessments</text><text x="500" y="181" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• only where the task allows</text><text x="500" y="201" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• acknowledge every use</text><text x="720" y="181" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• be ready to explain your work</text><text x="720" y="201" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• your final work is yours</text></g><circle class="gl gl3" cx="125" cy="295" r="36" fill="#d4583a"/><circle cx="125" cy="295" r="36" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="3"/><g class="rv" style="animation-delay:0.4s"><rect x="230" y="255" width="690" height="82" rx="18" fill="#fff" filter="url(#sh)"/><rect x="230" y="255" width="8" height="82" rx="4" fill="#d4583a"/><text x="256" y="283" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#d4583a" text-anchor="start" letter-spacing="2">STOP</text><text x="256" y="309" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="20" fill="#14293a" text-anchor="start">Secure assessments</text><text x="500" y="281" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• no AI in LRW tests</text><text x="500" y="301" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• no AI in supervised tasks</text><text x="720" y="281" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• no AI to write the answer</text><text x="720" y="301" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">• no translating a full answer</text></g></svg>