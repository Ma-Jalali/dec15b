<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="The Academic Success Toolkit: six skills in a ring around the centre — feedback literacy, self-regulation and monitoring, group work skills, research skills, digital literacy and AI, and criticality.">
<style>.rv { animation: rv .6s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: scale(.9); } } .ring { animation: ring 4s linear infinite; } @keyframes ring { to { stroke-dashoffset: -140; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs>
<rect width="960" height="540" rx="28" fill="#f4f8f2"/>
<ellipse class="ring" cx="480" cy="270" rx="300" ry="185" fill="none" stroke="#14293a" stroke-opacity=".15" stroke-width="3" stroke-dasharray="4 10"/>
<circle cx="480" cy="270" r="78" fill="#fff" filter="url(#sh)"/><text x="480" y="264" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#14293a">AST</text><text x="480" y="290" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11.5" letter-spacing="1" fill="#5d6a74">ACADEMIC SUCCESS</text><text x="480" y="306" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11.5" letter-spacing="1" fill="#5d6a74">TOOLKIT</text>
<g class="rv" style="animation-delay:0.00s"><rect x="370" y="43" width="220" height="84" rx="20" fill="#a3416a" filter="url(#sh)"/>
<text x="480" y="83" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff">Feedback literacy</text>
<text x="480" y="107" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#fff" opacity=".9">understand, judge, act</text></g><g class="rv" style="animation-delay:0.12s"><rect x="630" y="136" width="220" height="84" rx="20" fill="#6a4fb0" filter="url(#sh)"/>
<text x="740" y="168" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff">Self-regulation</text><text x="740" y="188" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff">and monitoring</text>
<text x="740" y="208" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#fff" opacity=".9">goals, time, progress</text></g><g class="rv" style="animation-delay:0.24s"><rect x="630" y="320" width="220" height="84" rx="20" fill="#3a58a0" filter="url(#sh)"/>
<text x="740" y="360" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff">Group work skills</text>
<text x="740" y="384" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#fff" opacity=".9">fair work, clear talk</text></g><g class="rv" style="animation-delay:0.36s"><rect x="370" y="413" width="220" height="84" rx="20" fill="#2d8a9a" filter="url(#sh)"/>
<text x="480" y="453" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff">Research skills</text>
<text x="480" y="477" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#fff" opacity=".9">credible sources</text></g><g class="rv" style="animation-delay:0.48s"><rect x="110" y="321" width="220" height="84" rx="20" fill="#2f9a63" filter="url(#sh)"/>
<text x="220" y="353" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff">Digital literacy</text><text x="220" y="373" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff">and AI</text>
<text x="220" y="393" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#fff" opacity=".9">use tools honestly</text></g><g class="rv" style="animation-delay:0.60s"><rect x="110" y="136" width="220" height="84" rx="20" fill="#5f9a2a" filter="url(#sh)"/>
<text x="220" y="176" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff">Criticality</text>
<text x="220" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#fff" opacity=".9">question, compare, decide</text></g></svg>