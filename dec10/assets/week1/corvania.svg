<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-label="Case file: Corvania, a fictional country. Question: should we approve Kestrel Mining’s new lithium mine on the Tavi River? Population: 6 million in 1980, 12 million in 2000, 19 million in 2024; births per woman 6.4 to 2.9; deaths per 1,000 people 18 to 7. Economy and emissions: GDP per person three times higher since 2000; cars per 1,000 people 40 in 2000 and 210 in 2024; 68% of electricity from coal; total CO2 2.6 times higher since 2000; CO2 per dollar of GDP down 20%. Kestrel Mining: the largest company, lithium; record profit 2.1 billion dollars; 4,000 workers; 9% of the government’s tax income; dead fish on the Tavi River below the old mine in 2023; 30 villages on the river; the new mine would add 1,200 jobs, upstream, 2 km from the river.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.q { animation: q 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes q { 50% { transform: rotate(8deg) scale(1.08); } }
.puff { animation: puff 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center bottom; } .p2 { animation-delay: -1.2s; } .p3 { animation-delay: -2.4s; }
@keyframes puff { 0% { opacity: 0; transform: translateY(10px) scale(.6); } 30% { opacity: .85; } 100% { opacity: 0; transform: translateY(-12px) scale(1.2); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } } .river { stroke-dasharray: 10 22; animation: riv 3s linear infinite; } @keyframes riv { to { stroke-dashoffset: -56; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs>
