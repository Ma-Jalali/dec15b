<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="The CRAAP test. Currency: when was it published? Relevance: on your topic, at the right level? Authority: who wrote it, an expert? Accuracy: references, methods, data? Purpose: to inform or to sell, any bias?">
<style>.rv { animation: rv .6s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs>
<rect width="960" height="320" rx="28" fill="#f4f8f2"/><g class="rv" style="animation-delay:0.00s"><rect x="40" y="40" width="160" height="240" rx="22" fill="#fff" filter="url(#sh)"/><circle cx="120" cy="104" r="44" fill="#3a58a0"/>
<text x="120" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#fff">C</text>
<text x="120" y="182" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#3a58a0">Currency</text>
<text x="120" y="216" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#14293a">When was it</text><text x="120" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#14293a">published?</text></g><g class="rv" style="animation-delay:0.15s"><rect x="220" y="40" width="160" height="240" rx="22" fill="#fff" filter="url(#sh)"/><circle cx="300" cy="104" r="44" fill="#2d8a9a"/>
<text x="300" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#fff">R</text>
<text x="300" y="182" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#2d8a9a">Relevance</text>
<text x="300" y="216" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#14293a">On your topic?</text><text x="300" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#14293a">Right level?</text></g><g class="rv" style="animation-delay:0.30s"><rect x="400" y="40" width="160" height="240" rx="22" fill="#fff" filter="url(#sh)"/><circle cx="480" cy="104" r="44" fill="#2f9a63"/>
<text x="480" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#fff">A</text>
<text x="480" y="182" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#2f9a63">Authority</text>
<text x="480" y="216" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#14293a">Who wrote it?</text><text x="480" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#14293a">An expert?</text></g><g class="rv" style="animation-delay:0.45s"><rect x="580" y="40" width="160" height="240" rx="22" fill="#fff" filter="url(#sh)"/><circle cx="660" cy="104" r="44" fill="#5f9a2a"/>
<text x="660" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#fff">A</text>
<text x="660" y="182" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#5f9a2a">Accuracy</text>
<text x="660" y="216" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#14293a">References,</text><text x="660" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#14293a">methods, data?</text></g><g class="rv" style="animation-delay:0.60s"><rect x="760" y="40" width="160" height="240" rx="22" fill="#fff" filter="url(#sh)"/><circle cx="840" cy="104" r="44" fill="#d99a1e"/>
<text x="840" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#fff">P</text>
<text x="840" y="182" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#d99a1e">Purpose</text>
<text x="840" y="216" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#14293a">Inform or sell?</text><text x="840" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#14293a">Any bias?</text></g></svg>