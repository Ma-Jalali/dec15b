<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="DTM note organiser: four stages. Preindustrial — high births, high deaths, minimal growth. Early expanding — high births, falling deaths, rapid growth. Late expanding — births falling fast, low deaths, growth still high. Postindustrial — low births, low deaths, stable or zero growth. Criticism: Western focus; ignores population decline (a possible fifth stage).">
