<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="A see-saw for evaluating a point of view. 1 Report the point of view: Smith and Anderson (2024) assert that. 2 Accept the good part, on the light side: While it is true that, Of course. 3 Show the weakness, on the heavy side: However, the authors have overlooked, these claims disregard. This is your argument. Light side first, heavy side last.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.pop { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; transform-box: fill-box; transform-origin: center; } @keyframes pop { from { opacity: 0; transform: scale(.6); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; } .fl4 { animation-delay: -2.4s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.dr { stroke-dasharray: 6 8; animation: dr 1.4s linear infinite; } @keyframes dr { to { stroke-dashoffset: -28; } }
.st { animation: st 3.2s ease-in-out infinite; opacity: 0; } .st2 { animation-delay: -1.1s; } .st3 { animation-delay: -2.2s; }
@keyframes st { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .55; } 100% { opacity: 0; transform: translateY(-22px); } }
.bl { animation: bl 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes bl { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }.saw { transform-box: view-box; transform-origin: 480px 300px; animation: saw 5s ease-in-out infinite; } @keyframes saw { 0%, 100% { transform: rotate(7deg); } 50% { transform: rotate(10deg); } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs><rect width="960" height="400" rx="28" fill="#f6f2ea"/><rect x="60" y="340" width="840" height="10" rx="5" fill="#d9ccb6"/><path d="M434 342L480 304L526 342z" fill="#8a6d4e"/><circle cx="480" cy="304" r="8" fill="#5e4632"/><g class="saw"><rect x="120" y="290" width="720" height="16" rx="8" fill="#b28a5e"/><rect x="120" y="290" width="720" height="5" rx="2.5" fill="#cfa877"/><g><rect x="140" y="204" width="250" height="86" rx="14" fill="#2f9a63" filter="url(#sh)"/><text x="158" y="230" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10.5" fill="#d8f3e4" text-anchor="start" letter-spacing="1.2">2 · ACCEPT THE GOOD PART</text>
<foreignObject x="158" y="238" width="220" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font:italic 700 15px/1.35 Georgia,serif;color:#fff">While it is true that …,<br/>Of course, …</div></foreignObject></g>
<g><rect x="550" y="150" width="290" height="140" rx="16" fill="#c4562f" filter="url(#sh)"/><text x="570" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10.5" fill="#fde3d8" text-anchor="start" letter-spacing="1.2">3 · SHOW THE WEAKNESS</text>
<foreignObject x="570" y="188" width="256" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:italic 700 14.5px/1.45 Georgia,serif;color:#fff">However, … have overlooked …<br/>However, these claims disregard …</div></foreignObject>
<rect x="570" y="256" width="138" height="24" rx="12" fill="#fff" fill-opacity=".22"/><text x="639" y="273" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10.5" fill="#fff" text-anchor="middle" letter-spacing="1.2">YOUR ARGUMENT</text></g></g><g class="rv"><g class="fl"><rect x="250" y="28" width="460" height="74" rx="37" fill="#fff" filter="url(#sh)"/><rect x="250" y="28" width="460" height="74" rx="37" fill="none" stroke="#3a58a0" stroke-width="2.4"/>
<text x="480" y="56" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10.5" fill="#3a58a0" text-anchor="middle" letter-spacing="1.2">1 · REPORT THE POINT OF VIEW</text><text x="480" y="84" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="17" fill="#14293a" text-anchor="middle">Smith and Anderson (2024) assert that …</text></g></g>
