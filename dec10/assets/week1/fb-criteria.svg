<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="A presenter on a stage under four spotlights: content (what you say), coherence (how it flows), pronunciation (how you sound) and language (your grammar and words).">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes pu { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } }
.dr { stroke-dasharray: 8 10; animation: dr 1.6s linear infinite; } @keyframes dr { to { stroke-dashoffset: -36; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs><rect width="960" height="360" rx="28" fill="#f6f2ea"/><rect x="60" y="300" width="840" height="40" rx="8" fill="#e8e0d2"/><rect x="330" y="230" width="300" height="80" rx="10" fill="#d9ccb6"/><g transform="translate(480 230) scale(1.6)"><circle cy="-16" r="13" fill="#f2c14e"/><path d="M-22 34c0-22 10-32 22-32s22 10 22 32z" fill="#f2c14e" opacity=".85"/></g><g class="rv" style="animation-delay:0.0s"><path d="M150 70L420 300H540z" fill="#3a58a0" opacity=".10"/><g class="pu"><circle cx="150" cy="60" r="34" fill="#3a58a0" filter="url(#sh)"/><circle cx="150" cy="60" r="12" fill="#fff" opacity=".9"/></g>
    <text x="150" y="122" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" fill="#3a58a0" text-anchor="middle">Content</text><text x="150" y="142" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="middle">what you say</text></g><g class="rv" style="animation-delay:0.2s"><path d="M370 70L420 300H540z" fill="#2b776e" opacity=".10"/><g class="pu"><circle cx="370" cy="60" r="34" fill="#2b776e" filter="url(#sh)"/><circle cx="370" cy="60" r="12" fill="#fff" opacity=".9"/></g>
    <text x="370" y="122" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" fill="#2b776e" text-anchor="middle">Coherence</text><text x="370" y="142" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="middle">how it flows</text></g><g class="rv" style="animation-delay:0.4s"><path d="M590 70L420 300H540z" fill="#b0512a" opacity=".10"/><g class="pu"><circle cx="590" cy="60" r="34" fill="#b0512a" filter="url(#sh)"/><circle cx="590" cy="60" r="12" fill="#fff" opacity=".9"/></g>
    <text x="590" y="122" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" fill="#b0512a" text-anchor="middle">Pronunciation</text><text x="590" y="142" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="middle">how you sound</text></g><g class="rv" style="animation-delay:0.6000000000000001s"><path d="M810 70L420 300H540z" fill="#7a4a8c" opacity=".10"/><g class="pu"><circle cx="810" cy="60" r="34" fill="#7a4a8c" filter="url(#sh)"/><circle cx="810" cy="60" r="12" fill="#fff" opacity=".9"/></g>
    <text x="810" y="122" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" fill="#7a4a8c" text-anchor="middle">Language</text><text x="810" y="142" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="middle">your grammar and words</text></g></svg>