<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-label="Four students react to the same feedback. Ali: 7 out of 10 is fine, closes the email. Bella: my teacher hates me, upset all evening. Chen: what is a key word? writes a to-do list. Dana: thanks! changes nothing.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes pu { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } }
.dr { stroke-dasharray: 8 10; animation: dr 1.6s linear infinite; } @keyframes dr { to { stroke-dashoffset: -36; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs><rect width="960" height="310" rx="28" fill="#f3f7f6"/><g class="rv fl " style="animation-delay:0.0s"><rect x="30" y="40" width="200" height="60" rx="14" fill="#fff" filter="url(#sh)"/><path d="M118 100l6 12 12-12z" fill="#fff"/><text x="130" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="middle">“7/10 is fine.”</text></g>
    <g class="rv" style="animation-delay:0.2s"><g transform="translate(130 190) scale(1.3)"><circle cy="-16" r="13" fill="#98a2a9"/><path d="M-22 34c0-22 10-32 22-32s22 10 22 32z" fill="#98a2a9" opacity=".85"/></g><text x="130" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#14293a" text-anchor="middle">Ali</text><text x="130" y="284" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="middle">closes the email</text></g><g class="rv fl fl2" style="animation-delay:0.15s"><rect x="265" y="40" width="200" height="60" rx="14" fill="#fff" filter="url(#sh)"/><path d="M353 100l6 12 12-12z" fill="#fff"/><text x="365" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="middle">“My teacher hates me.”</text></g>
    <g class="rv" style="animation-delay:0.35s"><g transform="translate(365 190) scale(1.3)"><circle cy="-16" r="13" fill="#d4583a"/><path d="M-22 34c0-22 10-32 22-32s22 10 22 32z" fill="#d4583a" opacity=".85"/></g><text x="365" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#14293a" text-anchor="middle">Bella</text><text x="365" y="284" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="middle">upset all evening</text></g><g class="rv fl fl3" style="animation-delay:0.3s"><rect x="500" y="40" width="200" height="60" rx="14" fill="#fff" filter="url(#sh)"/><path d="M588 100l6 12 12-12z" fill="#fff"/><text x="600" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="middle">“What is a key word?”</text></g>
    <g class="rv" style="animation-delay:0.5s"><g transform="translate(600 190) scale(1.3)"><circle cy="-16" r="13" fill="#2f9a63"/><path d="M-22 34c0-22 10-32 22-32s22 10 22 32z" fill="#2f9a63" opacity=".85"/></g><text x="600" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#14293a" text-anchor="middle">Chen</text><text x="600" y="284" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="middle">writes a to-do list</text></g><g class="rv fl fl2" style="animation-delay:0.44999999999999996s"><rect x="735" y="40" width="200" height="60" rx="14" fill="#fff" filter="url(#sh)"/><path d="M823 100l6 12 12-12z" fill="#fff"/><text x="835" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="middle">“Thanks!”</text></g>
    <g class="rv" style="animation-delay:0.6499999999999999s"><g transform="translate(835 190) scale(1.3)"><circle cy="-16" r="13" fill="#d99a1e"/><path d="M-22 34c0-22 10-32 22-32s22 10 22 32z" fill="#d99a1e" opacity=".85"/></g><text x="835" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#14293a" text-anchor="middle">Dana</text><text x="835" y="284" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="middle">changes nothing</text></g></svg>