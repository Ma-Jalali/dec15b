<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="The feedback loop: three steps on a circle, clockwise — value it (read it all, say thanks), understand it (check the criteria, ask), use it (make a plan, do it next time) — and around again."><title>The feedback loop: three steps on a circle, clockwise — value it (read it all, say thanks), understand it (check the criteria, ask), use it (make a plan, do it next time) — and around again.</title><style>.rv{animation:rv .7s cubic-bezier(.2,.7,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(12px)}}
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tw{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.1s}.t3{animation-delay:-2.2s}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1.05)}}
.pu{animation:pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}26%{transform:scale(1)}}
.ring{animation:ring 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{opacity:.55;transform:scale(.85)}100%{opacity:0;transform:scale(1.45)}}
.bl{animation:bl 5s infinite;transform-box:fill-box;transform-origin:center}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
