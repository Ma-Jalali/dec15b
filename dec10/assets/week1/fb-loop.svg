<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="The feedback loop: value it (read it all, say thanks), understand it (check the criteria, ask), use it (make a plan, do it next time), and around again.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes pu { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } }
.dr { stroke-dasharray: 8 10; animation: dr 1.6s linear infinite; } @keyframes dr { to { stroke-dashoffset: -36; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs><rect width="960" height="400" rx="28" fill="#f3f7f6"/><circle cx="480" cy="200" r="120" fill="none" stroke="#14293a" stroke-opacity=".18" stroke-width="4" class="dr"/><g class="rv" style="animation-delay:0.0s"><g class="pu"><circle cx="480" cy="80" r="42" fill="#d4583a" filter="url(#sh)"/><text x="480" y="92" font-size="34" text-anchor="middle">♥</text></g><text x="480.0" y="18.0" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" fill="#14293a" text-anchor="middle">Value it</text><text x="480.0" y="42.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="middle">read it all · say thanks</text></g><g class="rv" style="animation-delay:0.25s"><g class="pu"><circle cx="584" cy="260" r="42" fill="#d99a1e" filter="url(#sh)"/><text x="584" y="272" font-size="34" text-anchor="middle">💡</text></g><text x="645.9230484541326" y="266.0" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" fill="#14293a" text-anchor="start">Understand it</text><text x="645.9230484541326" y="290.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="start">check the criteria · ask</text></g><g class="rv" style="animation-delay:0.5s"><g class="pu"><circle cx="376" cy="260" r="42" fill="#2f9a63" filter="url(#sh)"/><text x="376" y="272" font-size="34" text-anchor="middle">★</text></g><text x="314.07695154586736" y="266.0" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" fill="#14293a" text-anchor="end">Use it</text><text x="314.07695154586736" y="290.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="end">make a plan · do it next time</text></g><path d="M521 87l10 -4 -2 12z" fill="#14293a" opacity=".5"/></svg>