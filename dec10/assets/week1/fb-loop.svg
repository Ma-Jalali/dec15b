alGradient id="fl-n0" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#e18a75"/><stop offset="0.7" stop-color="#d4583a"/><stop offset="1" stop-color="#b04c36"/></radialGradient><radialGradient id="fl-n1" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#e4b862"/><stop offset="0.7" stop-color="#d99a1e"/><stop offset="1" stop-color="#b4831f"/></radialGradient><radialGradient id="fl-n2" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#6db892"/><stop offset="0.7" stop-color="#2f9a63"/><stop offset="1" stop-color="#298358"/></radialGradient><linearGradient id="fl-trk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4583a"/><stop offset="0.5" stop-color="#d99a1e"/><stop offset="1" stop-color="#2f9a63"/></linearGradient></defs><rect width="960" height="400" rx="28" fill="url(#fl-bg)"/><rect width="960" height="400" rx="28" fill="url(#fl-dots)"/><ellipse cx="211.2" cy="48.0" rx="326.40000000000003" ry="168.0" fill="url(#fl-glow)" opacity=".75"/><rect x=".75" y=".75" width="958.5" height="398.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="1.5"/><rect x=".5" y=".5" width="959" height="399" rx="27.5" fill="none" stroke="#14293a" stroke-opacity=".07"/><ellipse cx="480" cy="372" rx="170" ry="8" fill="#14293a" opacity=".04" filter="url(#fl-blur)"/><circle cx="480" cy="200" r="120" fill="none" stroke="#fff" stroke-width="22" opacity=".7"/><circle cx="480" cy="200" r="120" fill="none" stroke="url(#fl-trk)" stroke-opacity=".22" stroke-width="14"/><circle cx="480" cy="200" r="120" fill="none" stroke="#14293a" stroke-opacity=".25" stroke-width="3" class="dr"/><g transform="translate(583.9 140.0) rotate(60)"><circle r="13" fill="#fff" filter="url(#fl-sh2)"/><path d="M-3-6.5l6.5 6.5-6.5 6.5" stroke="#2f7d6b" stroke-opacity=".9" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(480.0 320.0) rotate(180)"><circle r="13" fill="#fff" filter="url(#fl-sh2)"/><path d="M