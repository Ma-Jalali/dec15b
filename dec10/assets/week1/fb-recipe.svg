<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-label="The feedback recipe in four parts: 1 something good, 2 one thing to change, 3 why it matters, 4 what to do next time.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes pu { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } }
.dr { stroke-dasharray: 8 10; animation: dr 1.6s linear infinite; } @keyframes dr { to { stroke-dashoffset: -36; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs><rect width="960" height="230" rx="28" fill="#f3f7f6"/><g class="rv" style="animation-delay:0.0s"><rect x="40" y="40" width="210" height="150" rx="18" fill="#2f9a63" filter="url(#sh)"/><text x="56" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#fff" text-anchor="start">1 · Something good</text><foreignObject x="54" y="86" width="182" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="font:italic 15px/1.35 Georgia,serif;color:#fff">“Your graph was clear …”</div></foreignObject></g><path d="M252 115h14" stroke="#14293a" stroke-opacity=".4" stroke-width="3"/><g class="rv" style="animation-delay:0.2s"><rect x="270" y="40" width="210" height="150" rx="18" fill="#d99a1e" filter="url(#sh)"/><text x="286" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#fff" text-anchor="start">2 · One thing to change</text><foreignObject x="284" y="86" width="182" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="font:italic 15px/1.35 Georgia,serif;color:#fff">“… but slide 1 had too much text,”</div></foreignObject></g><path d="M482 115h14" stroke="#14293a" stroke-opacity=".4" stroke-width="3"/><g class="rv" style="animation-delay:0.4s"><rect x="500" y="40" width="210" height="150" rx="18" fill="#b0512a" filter="url(#sh)"/><text x="516" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#fff" text-anchor="start">3 · Why it matters</text><foreignObject x="514" y="86" width="182" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="font:italic 15px/1.35 Georgia,serif;color:#fff">“so the audience read instead of listening.”</div></foreignObject></g><path d="M712 115h14" stroke="#14293a" stroke-opacity=".4" stroke-width="3"/><g class="rv" style="animation-delay:0.6000000000000001s"><rect x="730" y="40" width="210" height="150" rx="18" fill="#3a58a0" filter="url(#sh)"/><text x="746" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#fff" text-anchor="start">4 · What to do next time</text><foreignObject x="744" y="86" width="182" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="font:italic 15px/1.35 Georgia,serif;color:#fff">“Next time, use 3–4 key words and a picture.”</div></foreignObject></g></svg>