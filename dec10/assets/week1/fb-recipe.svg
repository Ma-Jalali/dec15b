<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-label="The feedback recipe in four parts: 1 something good — “Your graph was clear …”; 2 one thing to change — “… but slide 1 had too much text,”; 3 why it matters — “so the audience read instead of listening.”; 4 what to do next time — “Next time, use 3–4 key words and a picture.”"><title>The feedback recipe in four parts: 1 something good — “Your graph was clear …”; 2 one thing to change — “… but slide 1 had too much text,”; 3 why it matters — “so the audience read instead of listening.”; 4 what to do next time — “Next time, use 3–4 key words and a picture.”</title><style>.rv{animation:rv .7s cubic-bezier(.2,.7,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(12px)}}
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
