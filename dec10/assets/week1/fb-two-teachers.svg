<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="Two teachers’ notes. Teacher A: Good presentation, 7 out of 10. Teacher B: your examples were clear, well done; your slides had too much text so the audience read instead of listening; next time use 3 to 4 key words per slide and a picture, and pause after each main point.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes pu { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } }
.dr { stroke-dasharray: 8 10; animation: dr 1.6s linear infinite; } @keyframes dr { to { stroke-dashoffset: -36; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs><rect width="960" height="340" rx="28" fill="#f3f7f6"/><g class="rv" transform="rotate(-2 225.0 145.0)"><rect x="60" y="60" width="330" height="170" rx="16" fill="#fff" filter="url(#sh)"/><rect x="60" y="60" width="8" height="170" rx="4" fill="#98a2a9"/><text x="82" y="92" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#98a2a9" text-anchor="start" letter-spacing="2">TEACHER A</text><text x="82" y="118" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a" text-anchor="start">“Good presentation.</text><text x="82" y="140" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a" text-anchor="start">7/10.”</text></g><g class="rv" transform="rotate(1.5 675.0 165.0)"><rect x="440" y="40" width="470" height="250" rx="16" fill="#fff" filter="url(#sh)"/><rect x="440" y="40" width="8" height="250" rx="4" fill="#2b776e"/><text x="462" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#2b776e" text-anchor="start" letter-spacing="2">TEACHER B</text><text x="462" y="98" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a" text-anchor="start">“Your examples were clear — well done.</text><text x="462" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a" text-anchor="start">Your slides had too much text, so the</text><text x="462" y="142" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a" text-anchor="start">audience read instead of listening.</text><text x="462" y="164" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a" text-anchor="start">Next time: 3–4 key words per slide</text><text x="462" y="186" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a" text-anchor="start">and a picture. And pause after each</text><text x="462" y="208" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a" text-anchor="start">main point.”</text></g><g transform="translate(220 290) scale(0.9)"><circle cy="-16" r="13" fill="#98a2a9"/><path d="M-22 34c0-22 10-32 22-32s22 10 22 32z" fill="#98a2a9" opacity=".85"/></g><g transform="translate(690 310) scale(0.9)"><circle cy="-16" r="13" fill="#2b776e"/><path d="M-22 34c0-22 10-32 22-32s22 10 22 32z" fill="#2b776e" opacity=".85"/></g></svg>