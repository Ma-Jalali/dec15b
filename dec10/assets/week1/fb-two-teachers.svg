<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="Two teachers’ notes. Teacher A: Good presentation, 7 out of 10. Teacher B: your examples were clear, well done; your slides had too much text so the audience read instead of listening; next time use 3 to 4 key words per slide and a picture, and pause after each main point. Each teacher stands below their note."><title>Two teachers’ notes. Teacher A: Good presentation, 7 out of 10. Teacher B: your examples were clear, well done; your slides had too much text so the audience read instead of listening; next time use 3 to 4 key words per slide and a picture, and pause after each main point. Each teacher stands below their note.</title><style>.rv{animation:rv .7s cubic-bezier(.2,.7,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(12px)}}
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tw{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.1s}.t3{animation-delay:-2.2s}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1.05)}}
.pu{animation:pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}26%{transform:scale(1)}}
.ring{animation:ring 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{opacity:.55;transform:scale(.85)}100%{opacity:0;transform:scale(1.45)}}
.bl{animation:bl 5s infinite;transform-box:fill-box;transform-origin:center}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.pen{animation:pen 3s ease-in-out infinite}@keyframes pen{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,2px)}}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="tt-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#14293a" flood-opacity=".11"/></filter><filter id="tt-sh2" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".22"/><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#14293a" flood-opacity=".16"/></filter><filter id="tt-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter><linearGradient id="tt-bg" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#f6faf9"/><stop offset="1" stop-color="#e4efec"/></linearGradient><radialGradient id="tt-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><linearGradient id="tt-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf8f2"/></linearGradient><linearGradient id="tt-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><pattern id="tt-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#14293a" opacity=".09"/></pattern><linearGradient id="tt-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8f5ee"/></linearGradient><linearGradient id="tt-tape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e6b8" stop-opacity="0.9"/><stop offset="1" stop-color="#ecd38f" stop-opacity="0.9"/></linearGradient></defs><rect width="960" height="340" rx="28" fill="url(#tt-bg)"/><rect width="960" height="340" rx="28" fill="url(#tt-dots)"/><ellipse cx="211.2" cy="40.8" rx="326.40000000000003" ry="142.79999999999998" fill="url(#tt-glow)" opacity=".75"/><rect x=".75" y=".75" width="958.5" height="338.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="1.5"/><rect x=".5" y=".5" width="959" height="339" rx="27.5" fill="none" stroke="#14293a" stroke-opacity=".07"/><g class="rv" style="animation-delay:0s"><g transform="rotate(-2 225.0 145.0)"><rect x="60" y="60" width="330" height="170" rx="16" fill="url(#tt-paper)" filter="url(#tt-sh)"/><rect x="60.5" y="60.5" width="329" height="169" rx="15.5" fill="none" stroke="#14293a" stroke-opacity=".08"/><path d="M82 104H370" stroke="#2f6db5" stroke-opacity=".08"/><path d="M82 126H370" stroke="#2f6db5" stroke-opacity=".08"/><path d="M82 148H370" stroke="#2f6db5" stroke-opacity=".08"/><path d="M64 60H64A4 4 0 0 1 68 64V226A4 4 0 0 1 64 230H64A4 4 0 0 1 60 226V64A4 4 0 0 1 64 60Z" fill="#98a2a9"/><rect x="190" y="50" width="70" height="20" rx="3" fill="url(#tt-tape)" transform="rotate(-4 225 60)"/><text x="82" y="92" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#98a2a9" letter-spacing="2">TEACHER A</text><text x="82" y="118" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a">“Good presentation.</text><text x="82" y="140" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a">7/10.”</text></g></g><g class="rv" style="animation-delay:0.25s"><g transform="rotate(1.5 675.0 141.0)"><rect x="440" y="30" width="470" height="222" rx="16" fill="url(#tt-paper)" filter="url(#tt-sh)"/><rect x="440.5" y="30.5" width="469" height="221" rx="15.5" fill="none" stroke="#14293a" stroke-opacity=".08"/><path d="M462 74H890" stroke="#2f6db5" stroke-opacity=".08"/><path d="M462 96H890" stroke="#2f6db5" stroke-opacity=".08"/><path d="M462 118H890" stroke="#2f6db5" stroke-opacity=".08"/><path d="M462 140H890" stroke="#2f6db5" stroke-opacity=".08"/><path d="M462 162H890" stroke="#2f6db5" stroke-opacity=".08"/><path d="M462 184H890" stroke="#2f6db5" stroke-opacity=".08"/><path d="M462 206H890" stroke="#2f6db5" stroke-opacity=".08"/><path d="M444 30H444A4 4 0 0 1 448 34V248A4 4 0 0 1 444 252H444A4 4 0 0 1 440 248V34A4 4 0 0 1 444 30Z" fill="#2b776e"/><rect x="640" y="20" width="70" height="20" rx="3" fill="url(#tt-tape)" transform="rotate(-4 675 30)"/><text x="462" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#2b776e" letter-spacing="2">TEACHER B</text><text x="462" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a">“Your examples were clear — well done.</text><text x="462" y="110" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a">Your slides had too much text, so the</text><text x="462" y="132" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a">audience read instead of listening.</text><text x="462" y="154" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a">Next time: 3–4 key words per slide</text><text x="462" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a">and a picture. And pause after each</text><text x="462" y="198" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#14293a">main point.”</text></g></g><g class="pen"><g transform="translate(866 232) rotate(35)"><rect x="-4" y="-40" width="8" height="40" rx="3" fill="#2b776e"/><rect x="-4" y="-40" width="3" height="40" rx="1.5" fill="#fff" opacity=".3"/><path d="M-4 0h8l-4 9z" fill="#f2d7a8"/>