<text x="170" y="276" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24" fill="#14293a">Appreciating feedback</text><text x="170" y="304" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#d4583a">You VALUE it</text></g><path d="M262 150h126" stroke="#14293a" stroke-opacity=".3" stroke-width="3" stroke-dasharray="6 8" class="ar"/><path d="M382 142l10 8-10 8" stroke="#14293a" stroke-opacity=".3" stroke-width="3" fill="none"/><g class="rv" style="animation-delay:0.25s"><circle cx="480" cy="150" r="78" fill="#d99a1e" filter="url(#sh)"/><g transform="translate(480 152)"><g class="ic"><circle cy="-10" r="30" fill="#fff"/><rect x="-13" y="20" width="26" height="18" rx="5" fill="#fff" opacity=".85"/></g></g>
<text x="480" y="276" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24" fill="#14293a">Making judgements</text><text x="480" y="304" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#d99a1e">You UNDERSTAND it</text></g><path d="M572 150h126" stroke="#14293a" stroke-opacity=".3" stroke-width="3" stroke-dasharray="6 8" class="ar"/><path d="M692 142l10 8-10 8" stroke="#14293a" stroke-opacity=".3" stroke-width="3" fill="none"/><g class="rv" style="animation-delay:0.5s"><circle cx="790" cy="150" r="78" fill="#2f9a63" filter="url(#sh)"/><g transform="translate(790 152)"><g class="ic"><path d="M0-40l12 25 28 4-20 19 5 27-25-13-25 13 5-27-20-19 28-4z" fill="#fff"/></g></g>
<text x="790" y="276" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24" fill="#14293a">Taking action</text><text x="790" y="304" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#2f9a63">You get it RIGHT next time</text></g></svg>