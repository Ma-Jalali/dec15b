<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="Feedback literacy in three parts: appreciating feedback — you value it (a heart); making judgements — you understand it (a lightbulb); taking action — you get it right next time (a star).">
<style>.rv { animation: rv .6s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(12px); } } .ar { animation: ar 1.4s linear infinite; } @keyframes ar { to { stroke-dashoffset: -28; } } .ic { animation: ic 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes ic { 50% { transform: scale(1.08); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs>
