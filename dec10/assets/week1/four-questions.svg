<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="A first draft says only: Sydney is the best city for international students. A lecturer reads it and asks four questions. 1 How do you know? Tool 1, providing support. 2 Who else says so? Tool 2, using previous research. 3 Is that view right? Tool 3, evaluating points of view. 4 Whose idea is this? Tool 4, working with different voices.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.pop { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; transform-box: fill-box; transform-origin: center; } @keyframes pop { from { opacity: 0; transform: scale(.6); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; } .fl4 { animation-delay: -2.4s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.dr { stroke-dasharray: 6 8; animation: dr 1.4s linear infinite; } @keyframes dr { to { stroke-dashoffset: -28; } }
.st { animation: st 3.2s ease-in-out infinite; opacity: 0; } .st2 { animation-delay: -1.1s; } .st3 { animation-delay: -2.2s; }
@keyframes st { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .55; } 100% { opacity: 0; transform: translateY(-22px); } }
.bl { animation: bl 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes bl { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
