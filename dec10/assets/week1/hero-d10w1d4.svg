<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="h4-t">
<title id="h4-t">Day 4: on a desk, a tablet on a stand shows one paragraph built from four coloured voices, the writer and three authors, while a stylus writes the last line. Beside it a phone on a tripod records a group of four for the Portfolio video, and a magnifying glass slides over five 3D cards spelling CRAAP.</title>
<style>
  .h4-fl { animation: h4-fl 6s ease-in-out infinite; } .h4-d2 { animation-delay: -2.5s; }
  .h4-tw { animation: h4-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .h4-k2 { animation-delay: -1.1s; } .h4-k3 { animation-delay: -2.2s; }
  .h4-rec { animation: h4-rec 1.4s steps(2, jump-none) infinite; }
  .h4-pb { animation: h4-pb 8s linear infinite; transform-box: fill-box; transform-origin: left center; }
  .h4-wv { animation: h4-wv 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .h4-w2 { animation-delay: -.3s; } .h4-w3 { animation-delay: -.6s; } .h4-w4 { animation-delay: -.9s; }
  .h4-wr { animation: h4-wr 5s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
  .h4-pen { animation: h4-pen 5s ease-in-out infinite; }
  .h4-mag { animation: h4-mag 10s ease-in-out infinite; }
  .h4-st { animation: h4-st 4s ease-in-out infinite; } .h4-s2 { animation-delay: -2s; }
  @keyframes h4-fl { 50% { transform: translateY(-12px); } }
  @keyframes h4-tw { 0%, 100% { opacity: .3; transform: scale(.65) rotate(0); } 50% { opacity: 1; transform: scale(1.05) rotate(45deg); } }
  @keyframes h4-rec { 50% { opacity: .2; } }
  @keyframes h4-pb { 0% { transform: scaleX(.04); } 100% { transform: scaleX(1); } }
  @keyframes h4-wv { 50% { transform: scaleY(.35); } }
  @keyframes h4-wr { 0% { transform: scaleX(0); } 70%, 100% { transform: scaleX(1); } }
  @keyframes h4-pen { 0% { transform: translateX(-180px); } 70%, 100% { transform: translateX(0); } }
  @keyframes h4-mag { 0%, 100% { transform: translateX(-190px); } 50% { transform: translateX(200px); } }
  @keyframes h4-st { 0% { transform: translateY(8px); opacity: 0; } 40% { opacity: .7; } 100% { transform: translateY(-34px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .h4-st { opacity: .6; } }
</style>
