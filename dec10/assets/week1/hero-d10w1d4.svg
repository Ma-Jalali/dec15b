<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Day 4: a paragraph built from coloured speech bubbles — the writer’s voice and three authors — beside a video frame recording a group of four, and a magnifying glass sweeping over five cards that spell CRAAP.</title>
<style>
  .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .f2 { animation-duration: 7.4s; animation-delay: -2s; } .f3 { animation-duration: 8.2s; animation-delay: -4s; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .k2 { animation-delay: -1s; } .k3 { animation-delay: -2s; }
  .flow { stroke-dasharray: 10 14; animation: flow 1.6s linear infinite; }
  .rec { animation: rec 1.2s steps(2, jump-none) infinite; }
  .mag { animation: mag 9s ease-in-out infinite; }
  .bar { animation: bar 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; } .b2 { animation-delay: -.6s; } .b3 { animation-delay: -1.2s; } .b4 { animation-delay: -1.8s; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(1.2deg); } }
  @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }
  @keyframes flow { to { stroke-dashoffset: -48; } }
  @keyframes rec { 50% { opacity: .2; } }
  @keyframes mag { 0%, 100% { transform: translate(930px, 690px); } 50% { transform: translate(1190px, 690px); } }
  @keyframes bar { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="44"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .43  0 0 0 0 .32  0 0 0 .06 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#14293a" flood-opacity=".2"/></filter>
  <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#14293a" flood-opacity=".2"/></filter>
  <radialGradient id="glow" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#f6eef8"/><stop offset="1" stop-color="#e7d9ec"/></radialGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#7a4a8c" opacity=".25"/></pattern>
</defs>
<rect width="1400" height="933" fill="#f2ecf3"/><rect width="1400" height="933" fill="#f2ecf3" filter="url(#paper)"/>
<circle cx="700" cy="470" r="420" fill="url(#glow)"/>
<circle cx="700" cy="470" r="458" fill="none" stroke="#7a4a8c" stroke-opacity=".2" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round"/>
<rect x="90" y="90" width="150" height="110" fill="url(#dots)"/><rect x="1190" y="760" width="140" height="110" fill="url(#dots)"/>

<!-- paragraph of voices -->
<g class="float"><g transform="translate(110 250) rotate(-3)" filter="url(#soft)">
  <rect width="560" height="380" rx="26" fill="#fff"/>
  <text x="34" y="52" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="3" fill="#98a2a9">ONE PARAGRAPH · FOUR VOICES</text>
  <rect x="34" y="80" width="300" height="34" rx="10" fill="#7a4a8c"/><text x="48" y="103" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#fff">It has many benefits for…</text>
  <rect x="344" y="80" width="180" height="34" rx="10" fill="#7a4a8c" opacity=".35"/>
  <rect x="34" y="128" width="200" height="34" rx="10" fill="#2f7d6b"/><text x="48" y="151" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#fff">…claim that…</text>
  <rect x="244" y="128" width="280" height="34" rx="10" fill="#2f7d6b" opacity=".3"/>
  <rect x="34" y="176" width="290" height="34" rx="10" fill="#b0512a"/><text x="48" y="199" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#fff">However, Jones asserts…</text>
  <rect x="334" y="176" width="190" height="34" rx="10" fill="#b0512a" opacity=".3"/>
  <rect x="34" y="224" width="250" height="34" rx="10" fill="#3a58a0"/><text x="48" y="247" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#fff">…research found that…</text>
  <rect x="294" y="224" width="230" height="34" rx="10" fill="#3a58a0" opacity=".3"/>
  <rect x="34" y="272" width="330" height="34" rx="10" fill="#7a4a8c"/><text x="48" y="295" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#fff">However, these claims disregard…</text>
  <g transform="translate(34 330)"><circle r="7" cx="7" fill="#7a4a8c"/><text x="22" y="5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#5d6a74">writer</text>
  <circle r="7" cx="97" fill="#2f7d6b"/><text x="112" y="5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#5d6a74">Smith &amp; Anderson</text>
  <circle r="7" cx="267" fill="#b0512a"/><text x="282" y="5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#5d6a74">Jones</text>
  <circle r="7" cx="357" fill="#3a58a0"/><text x="372" y="5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#5d6a74">Thompson</text></g>
</g></g>

<path class="flow" d="M690 420C740 380 770 300 820 270" stroke="#7a4a8c" stroke-opacity=".45" stroke-width="5" fill="none" stroke-linecap="round"/>

<!-- video frame -->
<g class="float f2"><g transform="translate(820 130) rotate(3)" filter="url(#soft)">
  <rect width="440" height="300" rx="24" fill="#14293a"/><rect x="18" y="56" width="404" height="226" rx="14" fill="#e3f0ec"/>
  <circle class="rec" cx="40" cy="30" r="10" fill="#e04b3a"/><text x="60" y="37" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" letter-spacing="2" fill="#fff">REC · 08:00 · ONE VIDEO</text>
  <g transform="translate(90 170)"><circle cy="-24" r="26" fill="#2b776e"/><path d="M-40 92c0-44 18-66 40-66s40 22 40 66z" fill="#2b776e" opacity=".85"/></g>
  <g transform="translate(176 170)"><circle cy="-24" r="26" fill="#d99a1e"/><path d="M-40 92c0-44 18-66 40-66s40 22 40 66z" fill="#d99a1e" opacity=".85"/></g>
  <g transform="translate(262 170)"><circle cy="-24" r="26" fill="#b0512a"/><path d="M-40 92c0-44 18-66 40-66s40 22 40 66z" fill="#b0512a" opacity=".85"/></g>
  <g transform="translate(348 170)"><circle cy="-24" r="26" fill="#3a58a0"/><path d="M-40 92c0-44 18-66 40-66s40 22 40 66z" fill="#3a58a0" opacity=".85"/></g>
  <g transform="translate(360 70)"><rect class="bar" x="0" y="0" width="8" height="30" rx="3" fill="#2b776e"/><rect class="bar b2" x="12" y="0" width="8" height="30" rx="3" fill="#2b776e"/><rect class="bar b3" x="24" y="0" width="8" height="30" rx="3" fill="#2b776e"/><rect class="bar b4" x="36" y="0" width="8" height="30" rx="3" fill="#2b776e"/></g>
</g></g>

<!-- CRAAP cards -->
<g transform="translate(870 600)">
  <g class="float "><g transform="translate(0 0)" filter="url(#lift)"><rect width="84" height="118" rx="14" fill="#3a58a0"/><text x="42" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#fff">C</text><text x="42" y="98" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" opacity=".9">CURRENCY</text></g></g>
  <g class="float f2"><g transform="translate(96 24)" filter="url(#lift)"><rect width="84" height="118" rx="14" fill="#2d8a9a"/><text x="42" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#fff">R</text><text x="42" y="98" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" opacity=".9">RELEVANCE</text></g></g>
  <g class="float f3"><g transform="translate(192 0)" filter="url(#lift)"><rect width="84" height="118" rx="14" fill="#2f9a63"/><text x="42" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#fff">A</text><text x="42" y="98" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" opacity=".9">AUTHORITY</text></g></g>
  <g class="float "><g transform="translate(288 24)" filter="url(#lift)"><rect width="84" height="118" rx="14" fill="#5f9a2a"/><text x="42" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#fff">A</text><text x="42" y="98" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" opacity=".9">ACCURACY</text></g></g>
  <g class="float f2"><g transform="translate(384 0)" filter="url(#lift)"><rect width="84" height="118" rx="14" fill="#d99a1e"/><text x="42" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#fff">P</text><text x="42" y="98" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" opacity=".9">PURPOSE</text></g></g>
</g>
<g class="mag"><g filter="url(#soft)"><circle r="64" fill="#fff" fill-opacity=".3" stroke="#14293a" stroke-width="14"/><path d="M46 46l52 52" stroke="#14293a" stroke-width="22" stroke-linecap="round"/><path d="M-32-22a40 40 0 0 1 28-20" stroke="#fff" stroke-width="8" stroke-linecap="round"/></g></g>

<g class="twinkle"><path d="M760 120l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#e3a843"/></g>
<g class="twinkle k2"><path d="M180 760l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#7a4a8c"/></g>
<g class="twinkle k3"><path d="M1320 480l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#2b776e"/></g>
</svg>
