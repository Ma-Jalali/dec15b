<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="t">
<title id="t">Day 5: a long article falls into a golden funnel and comes out as a short three-sentence summary card. On the left a chequered start flag with listening, reading and writing badges for the diagnostic; on the right two speech bubbles and a small robot for the AI follow-up.</title>
<style>
  .float { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .f2 { animation-duration: 7.4s; animation-delay: -2s; } .f3 { animation-duration: 8.2s; animation-delay: -4s; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .k2 { animation-delay: -1s; } .k3 { animation-delay: -2s; }
  .flag { animation: flag 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
  .word { animation: word 3s ease-in infinite; } .w2 { animation-delay: -1s; } .w3 { animation-delay: -2s; }
  .shine { animation: shine 3.2s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(1.2deg); } }
  @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }
  @keyframes flag { 50% { transform: skewY(-4deg) scaleX(.96); } }
  @keyframes word { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(150px); opacity: 0; } }
  @keyframes shine { 0%, 100% { opacity: .3; } 50% { opacity: .8; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .word { opacity: 1; } }
</style>
<defs>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="55"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .43  0 0 0 0 .32  0 0 0 .06 0"/><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#14293a" flood-opacity=".2"/></filter>
  <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#14293a" flood-opacity=".2"/></filter>
  <radialGradient id="glow" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#fbf3e2"/><stop offset="1" stop-color="#f0dfbd"/></radialGradient>
  <linearGradient id="fun" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e3a843"/><stop offset="1" stop-color="#b9781a"/></linearGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#985c0e" opacity=".25"/></pattern>
</defs>
<rect width="1400" height="933" fill="#f3ecdf"/><rect width="1400" height="933" fill="#f3ecdf" filter="url(#paper)"/>
<circle cx="700" cy="470" r="420" fill="url(#glow)"/>
<circle cx="700" cy="470" r="458" fill="none" stroke="#985c0e" stroke-opacity=".2" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round"/>
<rect x="1180" y="80" width="140" height="110" fill="url(#dots)"/><rect x="80" y="740" width="150" height="110" fill="url(#dots)"/>

<!-- article -->
<g class="float"><g transform="translate(540 70) rotate(-2)" filter="url(#soft)">
  <rect width="320" height="250" rx="20" fill="#fff"/>
  <text x="28" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" letter-spacing="2.5" fill="#98a2a9">CHERTOW (2001)</text>
  <text x="28" y="76" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="20" fill="#14293a">The IPAT equation</text><text x="28" y="100" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="20" fill="#14293a">and its variants</text>
  <g stroke="#14293a" stroke-opacity=".16" stroke-width="8" stroke-linecap="round"><path d="M28 132h260M28 152h236M28 172h260M28 192h200M28 212h248"/></g>
  <path d="M28 132h150" stroke="#e3a843" stroke-opacity=".7" stroke-width="10" stroke-linecap="round"/><path d="M28 192h120" stroke="#e3a843" stroke-opacity=".7" stroke-width="10" stroke-linecap="round"/>
</g></g>

<!-- funnel -->
<g filter="url(#lift)"><path d="M520 360h360l-120 130v70h-120v-70z" fill="url(#fun)"/></g>
<path class="shine" d="M546 374h308" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
<g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#14293a">
  <g class="word"><rect x="600" y="300" width="96" height="30" rx="15" fill="#fff"/><text x="648" y="321" text-anchor="middle">main idea</text></g>
  <g class="word w2"><rect x="716" y="300" width="72" height="30" rx="15" fill="#fff"/><text x="752" y="321" text-anchor="middle">IPAT</text></g>
  <g class="word w3"><rect x="640" y="300" width="120" height="30" rx="15" fill="#fff"/><text x="700" y="321" text-anchor="middle">own words</text></g>
</g>

<!-- summary card -->
<g class="float f2"><g transform="translate(560 590) rotate(2)" filter="url(#soft)">
  <rect width="280" height="190" rx="20" fill="#fff"/><rect width="280" height="190" rx="20" fill="none" stroke="#985c0e" stroke-width="4"/>
  <text x="26" y="42" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" letter-spacing="2.5" fill="#985c0e">SUMMARY</text>
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#fff"><circle cx="38" cy="78" r="12" fill="#985c0e"/><text x="38" y="83" text-anchor="middle">1</text><circle cx="38" cy="118" r="12" fill="#985c0e"/><text x="38" y="123" text-anchor="middle">2</text><circle cx="38" cy="158" r="12" fill="#985c0e"/><text x="38" y="163" text-anchor="middle">3</text></g>
  <g stroke="#14293a" stroke-opacity=".2" stroke-width="8" stroke-linecap="round"><path d="M62 78h190M62 118h160M62 158h176"/></g>
  <g transform="translate(250 -10)"><circle r="24" fill="#2f9a63"/><path d="M-11 0l7 8 15-15" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
</g></g>

<!-- diagnostic flag -->
<g transform="translate(150 260)">
  <path d="M0 400h300" stroke="#14293a" stroke-width="8" stroke-linecap="round"/>
  <g fill="#14293a"><rect x="10" y="388" width="15" height="12"/><rect x="70" y="388" width="15" height="12"/><rect x="130" y="388" width="15" height="12"/><rect x="190" y="388" width="15" height="12"/><rect x="250" y="388" width="15" height="12"/></g>
  <path d="M80 400V60" stroke="#14293a" stroke-width="10" stroke-linecap="round"/>
  <g class="flag"><path d="M85 66c46-18 88 18 140 0v110c-52 18-94-18-140 0z" fill="#3a58a0"/>
  <g fill="#fff" opacity=".9"><rect x="100" y="84" width="20" height="20"/><rect x="140" y="98" width="20" height="20"/><rect x="180" y="88" width="20" height="20"/><rect x="120" y="126" width="20" height="20"/><rect x="160" y="136" width="20" height="20"/></g></g>
  <g class="float"><g filter="url(#lift)"><circle cx="220" cy="230" r="34" fill="#2d8a9a"/><text x="220" y="241" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#fff">L</text></g></g>
  <g class="float f2"><g filter="url(#lift)"><circle cx="270" cy="300" r="34" fill="#d99a1e"/><text x="270" y="311" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#fff">R</text></g></g>
  <g class="float f3"><g filter="url(#lift)"><circle cx="180" cy="320" r="34" fill="#b0512a"/><text x="180" y="331" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#fff">W</text></g></g>
</g>

<!-- AI talk -->
<g class="float f3"><g transform="translate(980 330)" filter="url(#soft)">
  <path d="M0 18a18 18 0 0 1 18-18h230a18 18 0 0 1 18 18v84a18 18 0 0 1-18 18h-150l-34 30 6-30h-52a18 18 0 0 1-18-18z" fill="#2b776e"/>
  <text x="24" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" letter-spacing="2" fill="#fff" opacity=".85">MY MAIN IDEA</text>
  <g stroke="#fff" stroke-opacity=".6" stroke-width="8" stroke-linecap="round"><path d="M24 70h200M24 92h140"/></g>
</g></g>
<g class="float f2"><g transform="translate(1040 520)" filter="url(#soft)">
  <path d="M0 18a18 18 0 0 1 18-18h220a18 18 0 0 1 18 18v84a18 18 0 0 1-18 18h-52l6 30-34-30h-140a18 18 0 0 1-18-18z" fill="#fff"/>
  <text x="24" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" letter-spacing="2" fill="#2b776e">SAME? DIFFERENT?</text>
  <g stroke="#14293a" stroke-opacity=".18" stroke-width="8" stroke-linecap="round"><path d="M24 70h190M24 92h120"/></g>
</g></g>
<g class="float"><g transform="translate(990 700)" filter="url(#lift)"><rect width="110" height="92" rx="24" fill="#fff"/><circle cx="34" cy="42" r="10" fill="#14293a"/><circle cx="76" cy="42" r="10" fill="#14293a"/><path d="M34 66c12 8 30 8 42 0" stroke="#14293a" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M55 0v-18" stroke="#14293a" stroke-width="5"/><circle cx="55" cy="-24" r="9" fill="#e3a843"/></g></g>

<g class="twinkle"><path d="M480 160l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#e3a843"/></g>
<g class="twinkle k2"><path d="M940 820l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#2b776e"/></g>
<g class="twinkle k3"><path d="M1290 260l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#3a58a0"/></g>
</svg>
