  <linearGradient id="h5-glare" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="h5-shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14293a" stop-opacity=".25"/><stop offset=".5" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#14293a" stop-opacity=".3"/></linearGradient>
