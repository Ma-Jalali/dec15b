  <radialGradient id="h5-cW" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#e57656"/><stop offset="1" stop-color="#b0452b"/></radialGradient>
  <pattern id="h5-chk" width="56" height="56" patternUnits="userSpaceOnUse" x="250" y="150"><rect width="56" height="56" fill="#fff"/><rect width="28" height="28" fill="#14293a"/><rect x="28" y="28" width="28" height="28" fill="#14293a"/></pattern>
  <clipPath id="h5-fc"><path d="M0 0H1400V400H910A210 46 0 0 1 490 400H0z"/></clipPath>
  <clipPath id="h5-sc"><rect x="980" y="420" width="324" height="222" rx="10"/></clipPath>
  <filter id="h5-s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#4a3410" flood-opacity=".18"/><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4a3410" flood-opacity=".14"/></filter>
  <filter id="h5-ls" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#4a3410" flood-opacity=".2"/></filter>
  <filter id="h5-bl" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="10"/></filter>
  <pattern id="h5-dt" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#985c0e" opacity=".22"/></pattern>
