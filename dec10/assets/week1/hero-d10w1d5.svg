<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" role="img" aria-labelledby="h5-t">
<title id="h5-t">Day 5: on a warm desk, a chequered flag flies over a START podium with L, R and W coins for the diagnostic. In the centre the Chertow article on the IPAT equation drops its main ideas into a golden funnel, which pours out a short three-point summary card. On the right a laptop shows an AI chat: my main idea, and same or different?</title>
<style>
  .h5-fl { animation: h5-fl 6s ease-in-out infinite; } .h5-d2 { animation-delay: -2s; } .h5-d3 { animation-delay: -4s; }
  .h5-tw { animation: h5-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .h5-k2 { animation-delay: -1.1s; } .h5-k3 { animation-delay: -2.2s; }
  .h5-flag { animation: h5-flag 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
  .h5-wd { animation: h5-wd 4.5s ease-in infinite; } .h5-e2 { animation-delay: -1.5s; } .h5-e3 { animation-delay: -3s; }
  .h5-ln { animation: h5-ln 6s ease-out infinite; transform-box: fill-box; transform-origin: left center; } .h5-l2 { animation-delay: .5s; } .h5-l3 { animation-delay: 1s; }
  .h5-dot { animation: h5-dot 1.2s ease-in-out infinite; } .h5-o2 { animation-delay: .2s; } .h5-o3 { animation-delay: .4s; }
  .h5-sh { animation: h5-sh 3.6s ease-in-out infinite; }
  .h5-drip { animation: h5-drip 2.4s ease-in infinite; }
  @keyframes h5-fl { 50% { transform: translateY(-12px); } }
  @keyframes h5-tw { 0%, 100% { opacity: .3; transform: scale(.65) rotate(0); } 50% { opacity: 1; transform: scale(1.05) rotate(45deg); } }
  @keyframes h5-flag { 50% { transform: skewY(-3deg) scaleX(.95); } }
  @keyframes h5-wd { 0% { transform: translateY(-24px); opacity: 0; } 20%, 60% { opacity: 1; } 100% { transform: translateY(76px); opacity: 0; } }
  @keyframes h5-ln { 0% { transform: scaleX(0); } 40%, 100% { transform: scaleX(1); } }
  @keyframes h5-dot { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  @keyframes h5-sh { 0%, 100% { opacity: .25; } 50% { opacity: .85; } }
  @keyframes h5-drip { 0% { transform: translateY(-6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .h5-drip { opacity: 1; } }
</style>
<defs>
