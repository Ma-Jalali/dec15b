<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-label="IPAT note organiser: Impact equals Population times Affluence times Technology; below, three boxes: History, Application, Criticism.">
<style>.rv { animation: rv .6s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(10px); } } .op { animation: op 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes op { 50% { transform: scale(1.25); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs>
<rect width="960" height="430" rx="28" fill="#fbf7ef"/>
<g class="rv"><rect x="30" y="50" width="180" height="150" rx="18" fill="#fff" filter="url(#sh)"/><rect x="30" y="50" width="180" height="150" rx="18" fill="none" stroke="#3a58a0" stroke-width="3"/>
<rect x="46" y="36" width="88" height="28" rx="14" fill="#3a58a0"/><text x="60" y="55" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" fill="#fff">IMPACT</text>
<text x="48" y="90" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#98a2a9">on the environment</text></g><g class="rv"><rect x="270" y="50" width="180" height="150" rx="18" fill="#fff" filter="url(#sh)"/><rect x="270" y="50" width="180" height="150" rx="18" fill="none" stroke="#2f7d6b" stroke-width="3"/>
<rect x="286" y="36" width="128" height="28" rx="14" fill="#2f7d6b"/><text x="300" y="55" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" fill="#fff">POPULATION</text>
<text x="288" y="90" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#98a2a9">how many people</text></g><g class="rv"><rect x="510" y="50" width="180" height="150" rx="18" fill="#fff" filter="url(#sh)"/><rect x="510" y="50" width="180" height="150" rx="18" fill="none" stroke="#d99a1e" stroke-width="3"/>
<rect x="526" y="36" width="118" height="28" rx="14" fill="#d99a1e"/><text x="540" y="55" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" fill="#fff">AFFLUENCE</text>
<text x="528" y="90" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#98a2a9">consumption: GDP/person</text></g><g class="rv"><rect x="750" y="50" width="180" height="150" rx="18" fill="#fff" filter="url(#sh)"/><rect x="750" y="50" width="180" height="150" rx="18" fill="none" stroke="#d4583a" stroke-width="3"/>
<rect x="766" y="36" width="128" height="28" rx="14" fill="#d4583a"/><text x="780" y="55" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" fill="#fff">TECHNOLOGY</text>
<text x="768" y="90" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#98a2a9">impact per unit of GDP</text></g>
<g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="54" text-anchor="middle"><text x="240" y="144" fill="#14293a">=</text><text class="op" x="480" y="144" fill="#d4583a">×</text><text class="op" x="720" y="144" fill="#d4583a" style="animation-delay:-1.5s">×</text></g>
<g class="rv"><rect x="30" y="258" width="280" height="130" rx="18" fill="#fff" filter="url(#sh)"/><rect x="30" y="258" width="280" height="130" rx="18" fill="none" stroke="#5d6a74" stroke-width="3"/>
<rect x="46" y="244" width="98" height="28" rx="14" fill="#5d6a74"/><text x="60" y="263" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" fill="#fff">HISTORY</text>
<text x="48" y="298" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#98a2a9">Ehrlich &amp; Holdren vs Commoner…</text></g><g class="rv"><rect x="340" y="258" width="280" height="130" rx="18" fill="#fff" filter="url(#sh)"/><rect x="340" y="258" width="280" height="130" rx="18" fill="none" stroke="#5d6a74" stroke-width="3"/>
<rect x="356" y="244" width="138" height="28" rx="14" fill="#5d6a74"/><text x="370" y="263" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" fill="#fff">APPLICATION</text>
<text x="358" y="298" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#98a2a9">industrial ecology…</text></g><g class="rv"><rect x="650" y="258" width="280" height="130" rx="18" fill="#fff" filter="url(#sh)"/><rect x="650" y="258" width="280" height="130" rx="18" fill="none" stroke="#5d6a74" stroke-width="3"/>
<rect x="666" y="244" width="118" height="28" rx="14" fill="#5d6a74"/><text x="680" y="263" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" fill="#fff">CRITICISM</text>
<text x="668" y="298" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#98a2a9">hard to measure…</text></g>
<text x="480" y="418" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#98a2a9">The factors are MULTIPLIED: if one factor doubles, the impact doubles.</text>
</svg>