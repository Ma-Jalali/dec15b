<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="The outline method: main ideas start on the left and are numbered; supporting details move one step right (a, b); extra details move one more step right (bullets). Example: 1. The second component: people — a. societal impact — b. stakeholders, not only shareholders — e.g. customers, employees, communities — 2. The third component: planet.">
<style>.rv { animation: rv .6s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateX(-18px); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style>
<defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/></filter>
<pattern id="dt" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#14293a" opacity=".12"/></pattern></defs>
<rect width="1000" height="440" rx="28" fill="#f6f9f8"/>
<g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11.5" letter-spacing="1.8">
  <rect x="120" y="22" width="104" height="26" rx="13" fill="#d4583a"/><text x="172" y="40" text-anchor="middle" fill="#fff">MAIN IDEA</text>
  <rect x="236" y="22" width="112" height="26" rx="13" fill="#e3a843"/><text x="292" y="40" text-anchor="middle" fill="#14293a">→ DETAIL</text>
  <rect x="360" y="22" width="140" height="26" rx="13" fill="#2f7d6b"/><text x="430" y="40" text-anchor="middle" fill="#fff">→ → MORE DETAIL</text>
</g>
<g class="rv" style="animation-delay:0.30s">
  
  <rect x="106" y="64" width="560" height="44" rx="12" fill="#fff" filter="url(#sh)"/>
  <rect x="106" y="64" width="6" height="44" rx="3" fill="#d4583a"/>
  <text x="126" y="92" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="19" fill="#d4583a">1.</text>
  <text x="154" y="92" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="19" fill="#14293a">The second component: people</text>
</g><g class="rv" style="animation-delay:0.75s">
  <path d="M144 110V144h30" stroke="#e3a843" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
  <rect x="176" y="122" width="490" height="44" rx="12" fill="#fff" filter="url(#sh)"/>
  <rect x="176" y="122" width="6" height="44" rx="3" fill="#e3a843"/>
  <text x="196" y="150" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="17" fill="#e3a843">a.</text>
  <text x="224" y="150" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#3d505e">societal impact</text>
</g><g class="rv" style="animation-delay:1.20s">
  <path d="M144 168V202h30" stroke="#e3a843" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
  <rect x="176" y="180" width="490" height="44" rx="12" fill="#fff" filter="url(#sh)"/>
  <rect x="176" y="180" width="6" height="44" rx="3" fill="#e3a843"/>
  <text x="196" y="208" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="17" fill="#e3a843">b.</text>
  <text x="224" y="208" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#3d505e">stakeholders, not only shareholders</text>
</g><g class="rv" style="animation-delay:1.65s">
  <path d="M214 226V260h30" stroke="#2f7d6b" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
  <rect x="246" y="238" width="420" height="44" rx="12" fill="#fff" filter="url(#sh)"/>
  <rect x="246" y="238" width="6" height="44" rx="3" fill="#2f7d6b"/>
  <text x="266" y="266" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="17" fill="#2f7d6b">•</text>
  <text x="294" y="266" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#5d6a74">e.g. customers, employees, communities</text>
</g><g class="rv" style="animation-delay:2.10s">
  <path d="M214 284V318h30" stroke="#2f7d6b" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
  <rect x="246" y="296" width="420" height="44" rx="12" fill="#fff" filter="url(#sh)"/>
  <rect x="246" y="296" width="6" height="44" rx="3" fill="#2f7d6b"/>
  <text x="266" y="324" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="17" fill="#2f7d6b">•</text>
  <text x="294" y="324" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#5d6a74">e.g. fair hiring, volunteering</text>
</g><g class="rv" style="animation-delay:2.55s">
  
  <rect x="106" y="354" width="560" height="44" rx="12" fill="#fff" filter="url(#sh)"/>
  <rect x="106" y="354" width="6" height="44" rx="3" fill="#d4583a"/>
  <text x="126" y="382" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="19" fill="#d4583a">2.</text>
  <text x="154" y="382" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="19" fill="#14293a">The third component: planet</text>
</g>
<g transform="translate(770 120)">
  <rect width="190" height="230" rx="20" fill="#14293a"/>
  <text x="95" y="40" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="2" fill="#f2c14e">WHY IT WORKS</text>
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#e8eef2" font-weight="600">
    <text x="22" y="80">✓ order of ideas</text><text x="22" y="112">✓ links at a glance</text><text x="22" y="144">✓ no set-up needed</text><text x="22" y="176">✓ fast to review</text>
  </g>
  <text x="95" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#9fb1bd">best for lectures</text>
</g>
</svg>