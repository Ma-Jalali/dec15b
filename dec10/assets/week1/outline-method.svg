<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="The outline method: main ideas start on the left and are numbered; supporting details move one step right (a, b); extra details move one more step right (bullets). Example: 1. The second component: people — a. societal impact — b. stakeholders, not only shareholders — e.g. customers, employees, communities — 2. The third component: planet. A side panel lists why it works: order of ideas, links at a glance, no set-up needed, fast to review — best for lectures."><title>The outline method: main ideas start on the left and are numbered; supporting details move one step right (a, b); extra details move one more step right (bullets). Example: 1. The second component: people — a. societal impact — b. stakeholders, not only shareholders — e.g. customers, employees, communities — 2. The third component: planet. A side panel lists why it works: order of ideas, links at a glance, no set-up needed, fast to review — best for lectures.</title><style>.rv{animation:rv .7s cubic-bezier(.2,.7,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(12px)}}
