<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="Seminar + Portfolio timeline in three stages, with the presenting group on the top row and the audience on the bottom row. The week before: the presenting group gives Opening Remarks and submits Portfolio 1; the audience posts reactions and questions to the Discussion Board. The seminar day: the presenting group delivers the seminar and gets teacher feedback; the audience takes part and uploads peer feedback. After: the presenting group submits Portfolio 2 and Portfolio 3, the video; the audience makes an additional submission of peer feedback.">
<style>.rv { animation: rv .6s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(12px); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs>
