<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="Your research desk: five source cards. Smith and Anderson 2024, a survey: Sydney is in the top 5% of study cities; it is safe with a good climate and culture; Melbourne has 140 rainy days a year. Jones 2024, an opinion: the cost of living is too high for international students; study in a rural town instead. Thompson 2023, research: many students cannot find accommodation within their budget. Schwartz 2022, an article: Melbourne’s beaches are polluted with poor conditions for surfers. Phelps 2023, a report: Melbourne suits people who like cooler weather and has more cultural activities.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
