<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Three search operators on three cards. AND: two overlapping circles, only the overlap is filled; both words must be there, for example causes AND pollution; fewer results. OR: both circles are filled; either word can be there, for example impacts OR consequences; more results. Quotation marks: a search box with “soil erosion”; these words in this order; the exact phrase.">
<style>.rv{animation:rv .7s cubic-bezier(.2,.7,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(14px)}}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}@keyframes pop{from{opacity:0;transform:scale(.6)}}
.fl{animation:fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.fl2{animation-delay:-1.8s}.fl3{animation-delay:-3.4s}.fl4{animation-delay:-2.5s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tw{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.tw2{animation-delay:-1.1s}.tw3{animation-delay:-2.2s}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1.05)}}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}@keyframes dr{to{stroke-dashoffset:-28}}
.gl{animation:gl 3s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.4}50%{opacity:1}}
.pu{animation:pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.bl{animation:bk 1.1s steps(1) infinite}@keyframes bk{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.rv,.pop{opacity:1 !important}}</style>
<defs><filter id="ra-sh" x="-25%" y="-25%" width="150%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feOffset dy="10" result="a"/><feFlood flood-color="#14293a" flood-opacity=".13"/><feComposite in2="a" operator="in" result="A"/><feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/><feOffset dy="2" result="b"/><feFlood flood-color="#14293a" flood-opacity=".16"/><feComposite in2="b" operator="in" result="B"/><feMerge><feMergeNode in="A"/><feMergeNode in="B"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="ra-ss" x="-25%" y="-25%" width="150%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="4" result="a"/><feFlood flood-color="#14293a" flood-opacity=".14"/><feComposite in2="a" operator="in" result="A"/><feGaussianBlur in="SourceAlpha" stdDeviation=".8"/><feOffset dy="1.2" result="b"/><feFlood flood-color="#14293a" flood-opacity=".18"/><feComposite in2="b" operator="in" result="B"/><feMerge><feMergeNode in="A"/><feMergeNode in="B"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
