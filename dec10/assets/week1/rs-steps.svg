<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Four search steps: 1 identify keywords, highlight the big words; 2 expand them, add synonyms; 3 run a search with AND, OR and quotation marks; 4 refine by date, English and peer-reviewed.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.pop { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; transform-box: fill-box; transform-origin: center; } @keyframes pop { from { opacity: 0; transform: scale(.6); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.gl { animation: gl 2.4s ease-in-out infinite; } @keyframes gl { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.dr { stroke-dasharray: 6 8; animation: dr 1.4s linear infinite; } @keyframes dr { to { stroke-dashoffset: -28; } }
.pu { animation: pu 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.bl { animation: bl 1.1s steps(1) infinite; } @keyframes bl { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs><rect width="1000" height="300" rx="28" fill="#f1f6f5"/><path d="M120 150H880" stroke="#c9d6df" stroke-width="6" stroke-linecap="round" class="dr"/><g class="pop" style="animation-delay:0.0s"><circle cx="140" cy="150" r="58" fill="#3a58a0" filter="url(#sh)"/><circle cx="140" cy="150" r="66" fill="none" stroke="#3a58a0" stroke-opacity=".3" stroke-width="4" class="gl"/><g transform="translate(140 150)"><rect x="-26" y="-6" width="52" height="14" rx="3" fill="#ffe27a"/><path d="M-22 1h44" stroke="#14293a" stroke-width="3"/><path d="M14 -24l14 14-20 20-14-14z" fill="#fff"/><path d="M0 -10l14 14" stroke="#fff" stroke-width="2"/></g><circle cx="184" cy="106" r="17" fill="#fff" stroke="#3a58a0" stroke-width="3"/><text x="184" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#3a58a0" text-anchor="middle">1</text><text x="140" y="246" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="19" fill="#14293a" text-anchor="middle">Identify keywords</text><text x="140" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#5d6a74" text-anchor="middle">highlight the big words</text></g><g class="pop" style="animation-delay:0.3s"><circle cx="380" cy="150" r="58" fill="#2d8a9a" filter="url(#sh)"/><circle cx="380" cy="150" r="66" fill="none" stroke="#2d8a9a" stroke-opacity=".3" stroke-width="4" class="gl"/><g transform="translate(380 150)"><circle cx="-18" cy="0" r="8" fill="#fff"/><circle cx="16" cy="-18" r="7" fill="#fff"/><circle cx="16" cy="0" r="7" fill="#fff"/><circle cx="16" cy="18" r="7" fill="#fff"/><path d="M-10 0L9 -18M-10 0H9M-10 0L9 18" stroke="#fff" stroke-width="3"/></g><circle cx="424" cy="106" r="17" fill="#fff" stroke="#2d8a9a" stroke-width="3"/><text x="424" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#2d8a9a" text-anchor="middle">2</text><text x="380" y="246" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="19" fill="#14293a" text-anchor="middle">Expand them</text><text x="380" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#5d6a74" text-anchor="middle">add synonyms</text></g><g class="pop" style="animation-delay:0.6s"><circle cx="620" cy="150" r="58" fill="#2f9a63" filter="url(#sh)"/><circle cx="620" cy="150" r="66" fill="none" stroke="#2f9a63" stroke-opacity=".3" stroke-width="4" class="gl"/><g transform="translate(620 150)"><circle cx="-4" cy="-4" r="16" fill="none" stroke="#fff" stroke-width="5"/><path d="M8 8l14 14" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g><circle cx="664" cy="106" r="17" fill="#fff" stroke="#2f9a63" stroke-width="3"/><text x="664" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#2f9a63" text-anchor="middle">3</text><text x="620" y="246" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="19" fill="#14293a" text-anchor="middle">Run a search</text><text x="620" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#5d6a74" text-anchor="middle">AND · OR · “ ”</text></g><g class="pop" style="animation-delay:0.9s"><circle cx="860" cy="150" r="58" fill="#d48a12" filter="url(#sh)"/><circle cx="860" cy="150" r="66" fill="none" stroke="#d48a12" stroke-opacity=".3" stroke-width="4" class="gl"/><g transform="translate(860 150)"><path d="M-24 -20h48l-18 22v20l-12 -6v-14z" fill="#fff"/></g><circle cx="904" cy="106" r="17" fill="#fff" stroke="#d48a12" stroke-width="3"/><text x="904" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#d48a12" text-anchor="middle">4</text><text x="860" y="246" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="19" fill="#14293a" text-anchor="middle">Refine</text><text x="860" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#5d6a74" text-anchor="middle">date · English · peer-reviewed</text></g></svg>