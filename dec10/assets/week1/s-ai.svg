<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-labelledby="ai-t"><title id="ai-t">A friendly robot assistant waves between two cards: AI can help (new vocabulary, brainstorm ideas, check my writing) and not OK (write my essay, answer my test, crossed out); a note says AI acknowledged and a stack of books sits nearby</title>
<style>
.ai-tw{animation:ai-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
