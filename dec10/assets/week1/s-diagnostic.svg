<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-labelledby="dg-t"><title id="dg-t">A running track with a white START line; three medallions stand ready in the lanes for listening (headphones), reading (book) and writing (pen), a blue flag waves, and a Diagnostic card with a Start button and a stopwatch float above</title>
<style>
.dg-tw{animation:dg-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dg-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dg-fl{animation:dg-fl 6s ease-in-out infinite}
.dg-fb{animation:dg-fl 7s ease-in-out -3.5s infinite}
.dg-fc{animation:dg-fl 8s ease-in-out -1.8s infinite}
@keyframes dg-fl{50%{transform:translateY(-4px)}}
.dg-bl{animation:dg-bl 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes dg-bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.dg-tk{animation:dg-tk .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes dg-tk{to{transform:scaleY(.35)}}
.dg-wf{animation:dg-wf 3s ease-in-out infinite;transform-origin:0 0}@keyframes dg-wf{50%{transform:skewY(5deg) scaleX(.95)}}.dg-pb{animation:dg-pb 5s ease-in-out infinite;transform-box:fill-box;transform-origin:left}@keyframes dg-pb{0%{transform:scaleX(.15)}70%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
