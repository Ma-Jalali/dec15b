  @keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
  .tk { stroke-dasharray: 30; animation: tk 4s ease-in-out infinite; } @keyframes tk { 0%, 20% { stroke-dashoffset: 30; } 45%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 30; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }
