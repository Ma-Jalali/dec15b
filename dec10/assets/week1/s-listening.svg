<title id="sl-t">A laptop plays a lecture video on the triple bottom line with overlapping People, Planet and Profit circles, beside headphones, a sound meter and a notebook of outline notes being written</title>
<style>
.sl-tw { animation: sl-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sl-tw { 0%, 100% { opacity: .35; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
.sl-fa { animation: sl-fl 7s ease-in-out infinite; } .sl-fb { animation: sl-fl 7s ease-in-out -3.5s infinite; } .sl-fc { animation: sl-fl 6s ease-in-out -1.8s infinite; }
