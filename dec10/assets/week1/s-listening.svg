@keyframes sl-pg { 0% { transform: scaleX(.15); } 100% { transform: scaleX(1); } }
.sl-eq { animation: sl-eq 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sl-eq { 50% { transform: scaleY(.35); } }
.sl-wr { stroke-dasharray: 40; animation: sl-wr 4.5s ease-in-out infinite; }
@keyframes sl-wr { 0% { stroke-dashoffset: 40; } 55%, 100% { stroke-dashoffset: 0; } }
.sl-pen { animation: sl-pen 4.5s ease-in-out infinite; }
@keyframes sl-pen { 0% { transform: translateX(-34px); } 55%, 100% { transform: translateX(0); } }
.sl-ring { animation: sl-ring 2.4s ease-out infinite; transform-box: fill-box; transform-origin: left center; }
@keyframes sl-ring { 0% { opacity: .9; transform: scale(.8); } 100% { opacity: .2; transform: scale(1.1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
