<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A winding road through ten weeks with flags at Week 1, Week 5 and Week 7">
<style>
  .fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
  .tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .tw2 { animation-delay: -1.4s; }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
  .dash { animation: dash 2.4s linear infinite; } @keyframes dash { to { stroke-dashoffset: -44; } } .flag { animation: wave 3s ease-in-out infinite; transform-box: fill-box; transform-origin: left bottom; } .f2 { animation-delay: -1s; } .f3 { animation-delay: -2s; } @keyframes wave { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/></filter>
  <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
  <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".16"/></pattern>
</defs>
<ellipse cx="222" cy="300" rx="150" ry="12" fill="#14293a" opacity=".07"/>
<circle cx="220" cy="165" r="138" fill="#e4eef0"/>
<circle cx="220" cy="165" r="152" stroke="#2d7a9a" stroke-opacity=".25" stroke-dasharray="2 6" stroke-linecap="round"/>
<rect x="326" y="30" width="72" height="60" fill="url(#d)"/><rect x="36" y="238" width="60" height="48" fill="url(#d)"/>
<path class="tw" d="M50 106h22m-11-11v22" stroke="#2d7a9a" stroke-width="2.4" stroke-linecap="round"/>
<path class="tw tw2" d="M372 236h20m-10-10v20" stroke="#2d7a9a" stroke-width="2.4" stroke-linecap="round"/>

<path d="M70 296C120 250 60 214 150 196S290 214 296 152 236 86 330 64" stroke="#14293a" stroke-width="30" stroke-linecap="round" filter="url(#s)"/>
<path d="M70 296C120 250 60 214 150 196S290 214 296 152 236 86 330 64" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="10 12" class="dash"/>
<g class="flag"><path d="M86 262v-54" stroke="#14293a" stroke-width="4" stroke-linecap="round"/><path d="M88 208h36l-8 11 8 11H88z" fill="#d4583a"/><text x="102" y="224" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#fff" text-anchor="middle">W1</text></g>
<g class="flag f2"><path d="M220 192v-56" stroke="#14293a" stroke-width="4" stroke-linecap="round"/><path d="M222 136h36l-8 11 8 11h-36z" fill="#e3a843"/><text x="236" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#14293a" text-anchor="middle">W5</text></g>
<g class="flag f3"><path d="M332 70V12" stroke="#14293a" stroke-width="4" stroke-linecap="round"/><path d="M334 12h36l-8 11 8 11h-36z" fill="#2f7d6b"/><text x="348" y="28" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#fff" text-anchor="middle">W7</text></g>
<g class="fl" filter="url(#s2)"><circle cx="330" cy="232" r="30" fill="#fff"/><path d="M330 212l7 20-7 20-7-20z" fill="#d4583a"/><path d="M330 232l7 0-7 20z" fill="#14293a" opacity=".25"/><circle cx="330" cy="232" r="3" fill="#14293a"/></g>

</svg>
