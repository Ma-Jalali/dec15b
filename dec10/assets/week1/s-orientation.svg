.so-dash { stroke-dasharray: 7 9; animation: so-dash 2.4s linear infinite; }
@keyframes so-dash { to { stroke-dashoffset: -32; } }
.so-bob { animation: so-bob 2.6s ease-in-out infinite; }
@keyframes so-bob { 50% { transform: translateY(-6px); } }
.so-ndl { animation: so-ndl 6s ease-in-out infinite; transform-origin: 368px 248px; }
@keyframes so-ndl { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
.so-cl { animation: so-cl 12s ease-in-out infinite; }
@keyframes so-cl { 50% { transform: translateX(14px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
