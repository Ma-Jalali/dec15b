<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-labelledby="so-t">
<title id="so-t">A winding road over soft hills runs from Week 1, marked Today with a map pin, past flags at Week 5 and Week 7 to Week 10, with a ten-weeks card and a compass</title>
<style>
.so-tw { animation: so-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
