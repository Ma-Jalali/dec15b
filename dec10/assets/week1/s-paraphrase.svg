<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-labelledby="pp-t"><title id="pp-t">An original sentence card with highlighted words passes through turning gears and comes out as a new card in your own words, a pencil writing the last line; chips for synonyms and word order and a copy meter pointing to low</title>
