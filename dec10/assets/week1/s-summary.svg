<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-labelledby="sm-t"><title id="sm-t">A long article with highlighted main ideas slides into a golden funnel; unimportant words fly away crossed out, and a short numbered summary card of three sentences comes out at the bottom, next to a highlighter and a three-sentences-maximum tag</title>
<style>
.sm-tw{animation:sm-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sm-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.sm-fl{animation:sm-fl 6s ease-in-out infinite}
.sm-fb{animation:sm-fl 7s ease-in-out -3.5s infinite}
.sm-fc{animation:sm-fl 8s ease-in-out -1.8s infinite}
@keyframes sm-fl{50%{transform:translateY(-4px)}}
.sm-bl{animation:sm-bl 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes sm-bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.sm-tk{animation:sm-tk .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes sm-tk{to{transform:scaleY(.35)}}
.sm-drop{animation:sm-drop 2.4s ease-in infinite}@keyframes sm-drop{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}.sm-off{animation:sm-off 5s ease-in-out infinite}@keyframes sm-off{50%{transform:translate(-6px,-4px) rotate(-6deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style><defs><linearGradient id="sm-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe9c4"/><stop offset=".55" stop-color="#fbf5ea"/><stop offset="1" stop-color="#f2ece0"/></linearGradient><pattern id="sm-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern><clipPath id="sm-clip"><rect x="14" y="16" width="412" height="308" rx="38"/></clipPath><radialGradient id="sm-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><filter id="sm-sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#14293a" flood-opacity=".1"/></filter><filter id="sm-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/></filter><filter id="sm-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="6"/></filter><linearGradient id="sm-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient><linearGradient id="sm-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="sm-cone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6cf7a"/><stop offset="1" stop-color="#c9862a"/></linearGradient><linearGradient id="sm-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe2a4"/><stop offset="1" stop-color="#e3a843"/></linearGradient><linearGradient id="sm-in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a86d18"/><stop offset="1" stop-color="#d9962e"/></linearGradient><linearGradient id="sm-tl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop