<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A video frame showing four group members together, with a red recording dot and an 8-minute timer">
<style>
  .fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
  .tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .tw2 { animation-delay: -1.4s; }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
  .rec { animation: rec 1.2s steps(2, jump-none) infinite; } @keyframes rec { 50% { opacity: .2; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }
</style>
<defs>
  <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/></filter>
  <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
  <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".16"/></pattern>
</defs>
<ellipse cx="222" cy="300" rx="150" ry="12" fill="#14293a" opacity=".07"/>
<circle cx="220" cy="165" r="138" fill="#dfeee8"/>
<circle cx="220" cy="165" r="152" stroke="#2b776e" stroke-opacity=".25" stroke-dasharray="2 6" stroke-linecap="round"/>
<rect x="326" y="30" width="72" height="60" fill="url(#d)"/><rect x="36" y="238" width="60" height="48" fill="url(#d)"/>
<path class="tw" d="M50 106h22m-11-11v22" stroke="#2b776e" stroke-width="2.4" stroke-linecap="round"/>
<path class="tw tw2" d="M372 236h20m-10-10v20" stroke="#2b776e" stroke-width="2.4" stroke-linecap="round"/>

<g filter="url(#s)"><rect x="104" y="118" width="232" height="160" rx="16" fill="#fff"/></g>
<rect x="116" y="130" width="208" height="136" rx="10" fill="#eef6f3"/><g class="fl "><circle cx="150" cy="196" r="17" fill="#2b776e"/><path d="M124 262c0-26 12-40 26-40s26 14 26 40z" fill="#2b776e" opacity=".85"/></g><g class="fl fl2"><circle cx="200" cy="196" r="17" fill="#d99a1e"/><path d="M174 262c0-26 12-40 26-40s26 14 26 40z" fill="#d99a1e" opacity=".85"/></g><g class="fl fl3"><circle cx="250" cy="196" r="17" fill="#b0512a"/><path d="M224 262c0-26 12-40 26-40s26 14 26 40z" fill="#b0512a" opacity=".85"/></g><g class="fl fl2"><circle cx="300" cy="196" r="17" fill="#3a58a0"/><path d="M274 262c0-26 12-40 26-40s26 14 26 40z" fill="#3a58a0" opacity=".85"/></g>
<g filter="url(#s2)"><rect x="150" y="56" width="140" height="44" rx="22" fill="#14293a"/></g><circle class="rec" cx="176" cy="78" r="8" fill="#e04b3a"/>
<text x="192" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" letter-spacing="1" fill="#fff">REC 8:00</text>
