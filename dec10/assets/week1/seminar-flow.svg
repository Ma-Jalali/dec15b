<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="Seminar flow. The week before: your group gives Opening Remarks (5–7 minutes) on your country and the causes and effects; the teacher gives feedback; the class posts reactions and questions; you choose one question to research. The day of your seminar: class reactions and your focus (2–3 minutes), your research (8–10 minutes), two questions for group discussions (10 minutes), a one-minute summary of each discussion, teacher feedback. After: two summaries and reflections, a video response of up to 8 minutes using feedback literacy and one more AST skill; other groups upload feedback for you.">
