<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="What happens in the room. Opening Remarks, 5 to 7 minutes: presenters say which country and why, then its sustainability problems, causes and effects, with no solutions yet. The audience listens, fills in the Feedback Tool, then posts 1 to 2 questions on the board and uploads 150 to 200 words. The Seminar, one week later: Part 1a, 2 to 3 minutes, class reactions and the one focus question; Part 1b, 8 to 10 minutes, the research; Part 2, 10 minutes, the presenters give two questions and the audience discusses them in groups while presenters take notes; Part 3, one minute each, presenters summarise one group’s discussion. The audience then uploads 150 to 200 words. At the end the teacher gives feedback.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.pop { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; transform-box: fill-box; transform-origin: center; } @keyframes pop { from { opacity: 0; transform: scale(.6); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.dr { stroke-dasharray: 6 8; animation: dr 1.4s linear infinite; } @keyframes dr { to { stroke-dashoffset: -28; } }
.grow { stroke-dasharray: 600; stroke-dashoffset: 600; animation: grow 1.4s ease-out forwards; } @keyframes grow { to { stroke-dashoffset: 0; } }
.talk { animation: talk 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; } @keyframes talk { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.06); } }
.gl { animation: gl 2.4s ease-in-out infinite; } @keyframes gl { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs><rect width="1000" height="520" rx="28" fill="#f6f3ee"/><text x="32" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#d4583a" text-anchor="start" letter-spacing="1.6">OPENING REMARKS</text><text x="210" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#5d6a74" text-anchor="start">5–7 minutes · the week before the Seminar</text><rect x="32" y="62" width="110" height="64" rx="12" fill="#d4583a" fill-opacity=".12"/><text x="98" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#d4583a" text-anchor="middle">Presenters</text><rect x="32" y="134" width="110" height="64" rx="12" fill="#3a58a0" fill-opacity=".12"/><text x="98" y="171" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#3a58a0" text-anchor="middle">Audience</text><text x="32" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#14293a" text-anchor="start" letter-spacing="1.6"></text><g class="pop" style="animation-delay:0.00s"><rect x="153" y="62" width="309.38461538461536" height="64" rx="12" fill="#d4583a"/><foreignObject x="160" y="68" width="295.38461538461536" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 12.5px/1.3 Helvetica,Arial,sans-serif;color:#fff">Our country and why we chose it</div></foreignObject></g><g class="pop" style="animation-delay:0.15s"><rect x="468.38461538461536" y="62" width="498.6153846153846" height="64" rx="12" fill="#d4583a"/><foreignObject x="475.38461538461536" y="68" width="484.6153846153846" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style=