erif" font-weight="800" font-size="13" fill="#14293a" text-anchor="start" letter-spacing="1.6"></text><g class="pop" style="animation-delay:0.00s"><rect x="153" y="262" width="135.3793103448276" height="64" rx="12" fill="#d4583a"/><foreignObject x="160" y="268" width="121.37931034482759" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 12.5px/1.3 Helvetica,Arial,sans-serif;color:#fff">Part 1a · 2–3 min: reactions + our ONE focus</div></foreignObject></g><g class="pop" style="animation-delay:0.15s"><rect x="294.37931034482756" y="262" width="248.48275862068965" height="64" rx="12" fill="#c04a2e"/><foreignObject x="301.37931034482756" y="268" width="234.48275862068965" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 12.5px/1.3 Helvetica,Arial,sans-serif;color:#fff">Part 1b · 8–10 min: our research</div></foreignObject></g><g class="pop" style="animation-delay:0.30s"><rect x="548.8620689655172" y="262" width="276.7586206896552" height="64" rx="12" fill="#e07a55"/><foreignObject x="555.8620689655172" y="268" width="262.7586206896552" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 12.5px/1.3 Helvetica,Arial,sans-serif;color:#fff">Part 2 · 10 min: give 2 questions, then listen and take notes</div></foreignObject></g><g class="pop" style="animation-delay:0.45s"><rect x="831.6206896551723" y="262" width="135.3793103448276" height="64" rx="12" fill="#d4583a"/><foreignObject x="838.6206896551723" y="268" width="121.37931034482759" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 12.5px/1.3 Helvetica,Arial,sans-serif;color:#fff">Part 3 · 1 min each: summarise one group’s talk</div></foreignObject></g><text x="32" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#14293a" text-anchor="start" letter-spacing="1.6"></text><g class="pop" style="animation-delay:0.00s"><rect x="153" y="334" width="389.86206896551727" height="64" rx="12" fill="#3a58a0"/><foreignObject x="160" y="340" width="375.86206896551727" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 12.5px/1.3 Helvetica,Arial,sans-serif;color:#fff">Listen + Feedback Tool</div></foreignObject></g><g class="pop" style="animation-delay:0.15s"><rect x="548.8620689655172" y="334" width="276.7586206896552" height="64" rx="12" fill="#2f7d6b"/><foreignObject x="555.8620689655172" y="340" width="262.7586206896552" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 12.5px/1.3 Helvetica,Arial,sans-serif;color:#fff">Discuss the 2 questions in your group</div></foreignObject></g><g class="pop" style="animation-delay:0.30s"><rect x="831.6206896551723" y="334" width="135.3793103448276" height="64" rx="12" fill="#5a74b8"/><foreignObject x="838.6206896551723" y="340" width="121.37931034482759" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 12.5px/1.3 Helvetica,Arial,sans-serif;color:#fff">Listen · then upload 150–200 words</div></foreignObject></g><path d="M150 404v8" stroke="#5d6a74" stroke-width="2"/><text x="150" y="428" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#5d6a74" text-anchor="middle">0</text><path d="M291 404v8" stroke="#5d6a74" stroke-width="2"/><text x="291" y="428" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#5d6a74" text-anchor="middle">3</text><path d="M546 404v8" stroke="#5d6a74" stroke-width="2"/><text x="546" y="428" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#5d6a74" text-anchor="middle">12</text><path d="M829 404v8" stroke="#5d6a74" stroke-width="2"/><text x="829" y="428" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#5d6a74" text-anchor="middle">22</text><path d="M970 404v8" stroke="#5d6a74" stroke-width="2"/><text x="970" y="428" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#5d6a74" text-anchor="end">26+ min</text><g class="fl"><rect x="150" y="446" width="820" height="46" rx="14" fill="#14293a"/><g transform="translate(178 469) scale(0.9)"><circle r="12" fill="#ffd479"/><text y="5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#fff" text-anchor="middle">?</text></g><text x="200" y="475" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#fff" text-anchor="start">At the end: your teacher gives your group feedback. Write it down: you need it for your uploads.</text></g></svg>