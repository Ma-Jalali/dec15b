<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="Six steps to summarise, as a funnel that gets narrower: 1 scan the abstract and headings; 2 read the introduction and conclusion together; 3 find the main ideas in topic sentences; 4 keep only the support the reader needs; 5 select and organise ideas in an outline; 6 write in your own words.">
<style>.rv { animation: rv .6s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(-10px); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs>
