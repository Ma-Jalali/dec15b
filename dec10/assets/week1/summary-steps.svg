<text x="480" y="104" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#fff">Intro + conclusion <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" opacity=".9">· read them together</tspan></text></g><g class="rv" style="animation-delay:0.24s"><rect x="134" y="126" width="692" height="40" rx="20" fill="#2f9a63" filter="url(#sh)"/>
<circle cx="156" cy="146" r="13" fill="#fff"/><text x="156" y="151" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#2f9a63">3</text>
<text x="480" y="152" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#fff">Main ideas <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" opacity=".9">· topic sentences</tspan></text></g><g class="rv" style="animation-delay:0.36s"><rect x="176" y="174" width="608" height="40" rx="20" fill="#5f9a2a" filter="url(#sh)"/>
<circle cx="198" cy="194" r="13" fill="#fff"/><text x="198" y="199" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#5f9a2a">4</text>
<text x="480" y="200" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#fff">Key support <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" opacity=".9">· only what the reader needs</tspan></text></g><g class="rv" style="animation-delay:0.48s"><rect x="218" y="222" width="524" height="40" rx="20" fill="#d99a1e" filter="url(#sh)"/>
