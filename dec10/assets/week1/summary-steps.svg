<text x="480" y="248" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#fff">Outline <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" opacity=".9">· select + organise notes</tspan></text></g><g class="rv" style="animation-delay:0.60s"><rect x="260" y="270" width="440" height="40" rx="20" fill="#b0512a" filter="url(#sh)"/>
<circle cx="282" cy="290" r="13" fill="#fff"/><text x="282" y="295" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#b0512a">6</text>
<text x="480" y="296" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#fff">Write <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" opacity=".9">· your own words</tspan></text></g></svg>