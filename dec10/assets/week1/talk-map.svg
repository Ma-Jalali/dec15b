<text x="40" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3d505e">Each signpost tells you: <tspan font-weight="700" fill="#14293a">a new section starts here — start a new main idea in your notes.</tspan></text>
