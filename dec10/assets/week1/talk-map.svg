<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" role="img" aria-label="Map of the talk. Paragraph A: introduction — challenges and the need for change. Paragraph B: the triple bottom line, signposted by “One way to understand”. Paragraphs C and D: profit — “The first component”, “Historically”. Paragraphs E and F: people — “the second component”. Paragraphs G and H: planet — “the third and final component”. Paragraph I: the advertisement — “Are you interested?”">
<style>.rv { animation: rv .6s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(-16px); } } .walk { stroke-dasharray: 8 14; animation: walk 1.6s linear infinite; } @keyframes walk { to { stroke-dashoffset: -44; } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style>
