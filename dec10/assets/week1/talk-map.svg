<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" role="img" aria-label="Map of the talk drawn as a road with six signposts. Paragraph A: introduction — challenges and the need for change. Paragraph B: the triple bottom line, signposted by “One way to understand”. Paragraphs C and D: profit — “The first component”, “Historically”. Paragraphs E and F: people — “the second component”. Paragraphs G and H: planet — “the third and final component”. Paragraph I: the advertisement — “Are you interested?”"><title>Map of the talk drawn as a road with six signposts. Paragraph A: introduction — challenges and the need for change. Paragraph B: the triple bottom line, signposted by “One way to understand”. Paragraphs C and D: profit — “The first component”, “Historically”. Paragraphs E and F: people — “the second component”. Paragraphs G and H: planet — “the third and final component”. Paragraph I: the advertisement — “Are you interested?”</title><style>.rv{animation:rv .7s cubic-bezier(.2,.7,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(12px)}}
