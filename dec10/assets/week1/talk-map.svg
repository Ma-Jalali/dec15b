<path d="M20 222C170 198 300 214 460 202S760 190 1020 208V226H20Z" fill="#e2d5bb" opacity=".5"/><text x="40" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#d4583a" letter-spacing="2.4">THE ROUTE THROUGH THE TALK</text><path d="M40 58h56" stroke="#d4583a" stroke-width="2" stroke-linecap="round" opacity=".5"/><text x="40" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#3d505e">Each signpost tells you: <tspan font-weight="700" fill="#14293a">a new section starts here — start a new main idea in your notes.</tspan></text><ellipse cx="520" cy="262" rx="520" ry="9" fill="#14293a" opacity=".12" filter="url(#tm-blur)"/><rect x="20" y="232" width="1000" height="30" rx="15" fill="url(#tm-roadside)"/><rect x="20" y="226" width="1000" height="30" rx="15" fill="url(#tm-road)"/><path d="M36 228.5H1004" stroke="#fff" stroke-opacity=".18" stroke-width="1.2" stroke-linecap="round"/><path class="walk" d="M40 241H1000" stroke="#f2c14e" stroke-width="3" stroke-linecap="round" fill="none"/><g class="trav"><circle cx="40" cy="241" r="9" fill="#f2c14e" opacity=".25"/><circle cx="40" cy="241" r="4.5" fill="#fff4d2"/></g><g class="rv" style="animation-delay:0.30s"><ellipse cx="100" cy="238" rx="16" ry="3.5" fill="#0a1620" opacity=".5"/><rect x="94" y="146" width="12" height="94" rx="4" fill="url(#tm-post)"/><path d="M97 150v86" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/><g class="sw" style="animation-delay:-0.0s"><path d="M30 101h132l18 26-18 26H30z" fill="#67727a"/><path d="M30 96h132l18 26-18 26H30z" fill="url(#tm-s0)" filter="url(#tm-sh2)"/><path d="M34 98.5h130.5" stroke="#fff" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/><path d="M35 104h124l13 18-13 18H35z" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.2"/><circle cx="42" cy="106" r="2.2" fill="#fff" opacity=".55"/><circle cx="42" cy="138" r="2.2" fill="#fff" opacity=".55"/><text x="96" y="130" font-family="'He