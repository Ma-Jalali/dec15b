<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="The triple bottom line: three overlapping circles. Profit — financial performance, earnings for shareholders, maximise profit, cut costs and risk; the standard line. People — societal impact, all stakeholders: customers, employees, communities; fair hiring, volunteering, partnering with nonprofits. Planet — environmental impact; 100 fossil fuel producers caused 71% of industrial greenhouse gases since 1988; ethical materials, less energy, streamlined shipping. In the centre: do well by doing good. Remember: shareholders are not stakeholders — they own shares, stakeholders are affected by the business."><title>The triple bottom line: three overlapping circles. Profit — financial performance, earnings for shareholders, maximise profit, cut costs and risk; the standard line. People — societal impact, all stakeholders: customers, employees, communities; fair hiring, volunteering, partnering with nonprofits. Planet — environmental impact; 100 fossil fuel producers caused 71% of industrial greenhouse gases since 1988; ethical materials, less energy, streamlined shipping. In the centre: do well by doing good. Remember: shareholders are not stakeholders — they own shares, stakeholders are affected by the business.</title><style>.rv{animation:rv .7s cubic-bezier(.2,.7,.2,1) both}@keyframes rv{from{opacity:0;transform:translateY(12px)}}
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
