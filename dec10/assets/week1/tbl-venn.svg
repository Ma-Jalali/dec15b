<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="The triple bottom line: three overlapping circles. Profit — financial performance, earnings for shareholders, maximise profit, cut costs and risk. People — societal impact, all stakeholders: customers, employees, communities; fair hiring, volunteering, partnering with nonprofits. Planet — environmental impact; 100 fossil fuel producers caused 71% of industrial greenhouse gases since 1988; ethical materials, less energy, streamlined shipping. In the centre: do well by doing good.">
<style>.br { animation: br 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .b2 { animation-delay: -2s; } .b3 { animation-delay: -4s; }
@keyframes br { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(10px); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style>
<defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/></filter>
<pattern id="dt" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#14293a" opacity=".12"/></pattern></defs>
<rect width="1000" height="620" rx="28" fill="#fbf7ef"/>
<g style="mix-blend-mode:multiply">
  <circle class="br" cx="420" cy="250" r="165" fill="#f2c14e" opacity=".85"/>
  <circle class="br b2" cx="580" cy="250" r="165" fill="#ef8a6d" opacity=".8"/>
  <circle class="br b3" cx="500" cy="388" r="165" fill="#5fb393" opacity=".8"/>
</g>
<g font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" letter-spacing="3" font-size="22" text-anchor="middle">
  <text x="372" y="200" fill="#6e4a06">PROFIT</text><text x="628" y="200" fill="#82280f">PEOPLE</text><text x="500" y="478" fill="#0f4d3c">PLANET</text>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" text-anchor="middle">
  <text x="372" y="226" fill="#6e4a06">financial performance</text><text x="628" y="226" fill="#82280f">societal impact</text><text x="500" y="502" fill="#0f4d3c">environmental impact</text>
</g>
<g class="rv" style="animation-delay:.5s"><circle cx="500" cy="296" r="58" fill="#14293a"/><text x="500" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="15" fill="#fff">do well by</text><text x="500" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="15" fill="#f2c14e">doing good</text></g>
<g class="rv" style="animation-delay:.8s" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#3d505e">
  <rect x="24" y="84" width="196" height="176" rx="16" fill="#fff" filter="url(#sh)"/><rect x="24" y="84" width="196" height="6" rx="3" fill="#e3a843"/>
  <text x="42" y="120" font-weight="800" fill="#14293a">Profit</text><text x="42" y="148">earnings for</text><text x="42" y="168">shareholders</text><text x="42" y="196">maximise profit,</text><text x="42" y="216">cut costs and risk</text><text x="42" y="244" font-weight="700" fill="#b07d12">the “standard” line</text>
</g>
<g class="rv" style="animation-delay:1.1s" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#3d505e">
  <rect x="780" y="84" width="196" height="196" rx="16" fill="#fff" filter="url(#sh)"/><rect x="780" y="84" width="196" height="6" rx="3" fill="#d4583a"/>
  <text x="798" y="120" font-weight="800" fill="#14293a">People</text><text x="798" y="148">all stakeholders:</text><text x="798" y="168">customers, employees,</text><text x="798" y="188">communities</text><text x="798" y="216">fair hiring ·</text><text x="798" y="236">volunteering ·</text><text x="798" y="256">nonprofit partners</text>
</g>
<g class="rv" style="animation-delay:1.4s" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#3d505e">
  <rect x="24" y="400" width="250" height="196" rx="16" fill="#fff" filter="url(#sh)"/><rect x="24" y="400" width="250" height="6" rx="3" fill="#2f7d6b"/>
  <text x="42" y="436" font-weight="800" fill="#14293a">Planet</text><text x="42" y="464">100 fossil fuel producers</text><text x="42" y="484">→ 71% of industrial GHG</text><text x="42" y="504">since 1988</text><text x="42" y="532">ethically sourced materials ·</text><text x="42" y="552">↓ energy · streamlined</text><text x="42" y="572">shipping</text>
</g>
<g class="rv" style="animation-delay:1.7s"><rect x="726" y="470" width="250" height="126" rx="16" fill="#14293a"/>
  <text x="746" y="504" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="2" fill="#f2c14e">REMEMBER</text>
  <text x="746" y="532" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#fff">shareholders ≠ stakeholders</text>
  <text x="746" y="558" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d6de">own shares  vs  affected by</text>
  <text x="746" y="578" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#c9d6de">the business</text></g>
</svg>