.ring{animation:ring 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{opacity:.55;transform:scale(.85)}100%{opacity:0;transform:scale(1.45)}}
.bl{animation:bl 5s infinite;transform-box:fill-box;transform-origin:center}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.br{animation:br 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.b2{animation-delay:-2.3s}.b3{animation-delay:-4.6s}@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="tv-sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#14293a" flood-opacity=".11"/></filter><filter id="tv-sh2" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".22"/><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#14293a" flood-opacity=".16"/></filter><filter id="tv-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter><linearGradient id="tv-bg" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#fdfaf3"/><stop offset="1" stop-color="#f4ecdc"/></linearGradient><radialGradient id="tv-glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient><linearGradient id="tv-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf8f2"/></linearGradient><linearGradient id="tv-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><pattern id="tv-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#14293a" opacity=".09"/></pattern><radialGradient id="tv-c1" cx="0.42" cy="0.38" r="0.62"><stop offset="0" stop-color="#fbd982"/><stop offset="0.75" stop-color="#f2c14e"/><stop offset="1" stop-color="