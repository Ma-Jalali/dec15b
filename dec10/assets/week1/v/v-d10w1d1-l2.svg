<path class="tw" d="M28 30h12m-6-6v12" stroke="#3a58a0" stroke-width="2.4" stroke-linecap="round"/><path class="tw t2" d="M204 150h12m-6-6v12" stroke="#e3a843" stroke-width="2.4" stroke-linecap="round"/>
<circle class="tw t2" cx="208" cy="40" r="3" fill="#e3a843"/><circle class="tw" cx="34" cy="146" r="3" fill="#3a58a0"/>
<g transform="rotate(0 79.0 64.0)" filter="url(#s)"><rect x="44" y="46" width="70" height="36" rx="10" fill="#fff"/><path d="M58 68h42" stroke="#3a58a0" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(0 79.0 116.0)" filter="url(#s)"><rect x="44" y="98" width="70" height="36" rx="10" fill="#fff"/><path d="M58 120h42" stroke="#3a58a0" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(0 161.0 64.0)" filter="url(#s)"><rect x="126" y="46" width="70" height="36" rx="10" fill="#fff"/><path d="M140 68h42" stroke="#e3a843" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/></g><g transform="rotate(0 161.0 116.0)" filter="url(#s)"><rect x="126" y="98" width="70" height="36" rx="10" fill="#fff"/><path d="M140 120h42" stroke="#e3a843" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/></g><path class="dr" d="M114 64c20 0 20 52 40 52M114 116c20 0 20-52 40-52" stroke="#14293a" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/></svg>