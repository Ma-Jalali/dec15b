<circle class="tw t2" cx="208" cy="40" r="3" fill="#e3a843"/><circle class="tw" cx="34" cy="146" r="3" fill="#b0512a"/>
<g class="fl" filter="url(#s)"><rect x="52" y="52" width="112" height="76" rx="12" fill="#14293a"/><rect x="62" y="62" width="92" height="56" rx="6" fill="#b0512a"/><path d="M164 78l28-14v52l-28-14z" fill="#14293a"/></g><circle class="bl" cx="74" cy="72" r="5" fill="#e04b3a"/><g transform="translate(108 100) scale(0.6)"><circle cy="-16" r="13" fill="#e3a843"/><path d="M-22 34c0-22 10-32 22-32s22 10 22 32z" fill="#e3a843" opacity=".85"/></g></svg>