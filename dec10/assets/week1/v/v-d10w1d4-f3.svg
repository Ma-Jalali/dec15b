<circle class="tw t2" cx="208" cy="40" r="3" fill="#f2c14e"/><circle class="tw" cx="34" cy="146" r="3" fill="#2b776e"/>
<g class="fl" filter="url(#s)"><rect x="54" y="48" width="132" height="90" rx="12" fill="#14293a"/><rect x="64" y="58" width="112" height="70" rx="6" fill="#e3f0ec"/></g><g transform="translate(96 106) scale(0.55)"><circle cy="-16" r="13" fill="#2b776e"/><path d="M-22 34c0-22 10-32 22-32s22 10 22 32z" fill="#2b776e" opacity=".85"/></g><g transform="translate(122 104) scale(0.55)"><circle cy="-16" r="13" fill="#f2c14e"/><path d="M-22 34c0-22 10-32 22-32s22 10 22 32z" fill="#f2c14e" opacity=".85"/></g><g transform="translate(148 106) scale(0.55)"><circle cy="-16" r="13" fill="#2b776e"/><path d="M-22 34c0-22 10-32 22-32s22 10 22 32z" fill="#2b776e" opacity=".85"/></g><circle class="bl" cx="74" cy="66" r="5" fill="#e04b3a"/><text x="118" y="54" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="start">REC</text></svg>