<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-labelledby="d4f3-t"><title id="d4f3-t">Week by week: six calendar cards from Week 2 to Week 7 climbing like stairs, each with coloured dots for the groups presenting, and a pin moving one week at a time</title>
<style>
.d4f3-fl{animation:d4f3-fl 6s ease-in-out infinite}.d4f3-f2{animation-delay:-2s}.d4f3-f3{animation-delay:-4s}
.d4f3-tw{animation:d4f3-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d4f3-t2{animation-delay:-1.1s}.d4f3-t3{animation-delay:-2.2s}
.d4f3-bl{animation:d4f3-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.d4f3-pu{animation:d4f3-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.d4f3-dr{stroke-dasharray:3 4;animation:d4f3-dr 1.6s linear infinite}
@keyframes d4f3-fl{50%{transform:translateY(-3px)}}
@keyframes d4f3-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d4f3-bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes d4f3-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes d4f3-dr{to{stroke-dashoffset:-14}}
.d4f3-pin{animation:d4f3-pin 8s ease-in-out infinite}@keyframes d4f3-pin{0%,15%{transform:translateX(0)}25%,40%{transform:translateX(30px)}50%,65%{transform:translateX(60px)}75%,90%{transform:translateX(90px)}100%{transform:translateX(0)}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
