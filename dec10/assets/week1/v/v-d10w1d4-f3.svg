ght="800" fill="#14293a">W7</text><path d="M197 83l3 3 5-5" stroke="#2f9a63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><g class="d4f3-pin"><g class="d4f3-fl"><path d="M40 90a9 9 0 0 1 18 0c0 7-9 14-9 14s-9-7-9-14z" fill="url(#d4f3-pin)" filter="url(#d4f3-s2)"/><circle cx="49" cy="90" r="3.4" fill="#fff"/></g></g><g class="d4f3-fl d4f3-f2"><rect class="" x="18" y="22" width="66" height="34" rx="8" fill="url(#d4f3-paper)" filter="url(#d4f3-sh)"/><path d="M26 22.8h50" stroke="#fff" stroke-width="1" opacity=".9"/><circle cx="30" cy="35" r="4.2" fill="#d4583a"/><circle cx="44" cy="35" r="4.2" fill="#3a58a0"/><circle cx="58" cy="35" r="4.2" fill="#e3a843"/><circle cx="72" cy="35" r="4.2" fill="#2f9a63"/><text x="51" y="50" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.4" font-weight="700" fill="#14293a">Groups 1–4</text></g><path class="d4f3-tw " d="M214 23Q214 28 219 28Q214 28 214 33Q214 28 209 28Q214 28 214 23z" fill="#e3a843"/><circle class="d4f3-tw d4f3-t2" cx="120" cy="30" r="2.4" fill="#13887a"/>
