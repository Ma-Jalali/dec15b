<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-labelledby="d4v3-t"><title id="d4v3-t">A green slab labelled CLAIM held up by three columns: details, example and evidence, with the question How do you know?</title>
<style>
