<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-labelledby="d4v5-t"><title id="d4v5-t">A see-saw for evaluating a view: a small green tick for accepting the good part, a heavier coral block for the weakness, and the words Yes, but…</title>
