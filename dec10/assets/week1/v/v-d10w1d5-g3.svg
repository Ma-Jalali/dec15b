<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="How did it go?">
<style>.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}
.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}.bl{animation:bl 4s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes sw{50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/></filter></defs>
<path d="M44 38c22-30 78-34 118-14 34 17 50 54 36 88-14 34-56 50-98 44C54 150 18 118 22 82c2-18 10-32 22-44z" fill="#e4ebf7"/>
<path class="tw" d="M28 30h12m-6-6v12" stroke="#3a58a0" stroke-width="2.4" stroke-linecap="round"/><path class="tw t2" d="M204 150h12m-6-6v12" stroke="#e3a843" stroke-width="2.4" stroke-linecap="round"/>
<circle class="tw t2" cx="208" cy="40" r="3" fill="#e3a843"/><circle class="tw" cx="34" cy="146" r="3" fill="#3a58a0"/>
<g filter="url(#s)"><rect x="104" y="30" width="32" height="104" rx="16" fill="#fff"/><circle cx="120" cy="138" r="22" fill="#fff"/></g><rect class="pu" x="114" y="70" width="12" height="62" rx="6" fill="#d4583a"/><circle cx="120" cy="138" r="14" fill="#d4583a"/><text x="156" y="60" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#2f9a63" text-anchor="start">calm</text><text x="156" y="120" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#d4583a" text-anchor="start">angry</text><path d="M146 56h6M146 116h6" stroke="#14293a" stroke-opacity=".4" stroke-width="3"/></svg>