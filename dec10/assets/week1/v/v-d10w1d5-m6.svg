<circle class="tw t2" cx="208" cy="40" r="3" fill="#2d8a9a"/><circle class="tw" cx="34" cy="146" r="3" fill="#985c0e"/>
<g class="fl" filter="url(#s)"><path d="M86 44h68v30c0 20-15 34-34 34S86 94 86 74z" fill="#2d8a9a"/><path d="M86 52H66c0 22 10 32 24 34M154 52h20c0 22-10 32-24 34" stroke="#2d8a9a" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="108" y="108" width="24" height="18" fill="#2d8a9a"/><rect x="92" y="126" width="56" height="12" rx="4" fill="#14293a"/></g><g transform="translate(170 48)" filter="url(#s)"><g class="pu"><circle r="20" fill="#2f9a63"/><path d="M0-13l4 8 9 1-6 6 1 9-8-4-8 4 1-9-6-6 9-1z" fill="#fff"/></g></g></svg>