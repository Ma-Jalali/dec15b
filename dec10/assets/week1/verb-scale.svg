<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="A strength meter for reporting verbs. Keep a distance: suggests, believes, claims. Just reporting: found, states, reports, according to. The author is sure: argues, asserts, maintains. How strongly does the author say it? Choose the reporting verb on purpose.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.pop { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; transform-box: fill-box; transform-origin: center; } @keyframes pop { from { opacity: 0; transform: scale(.6); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; } .fl4 { animation-delay: -2.4s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.dr { stroke-dasharray: 6 8; animation: dr 1.4s linear infinite; } @keyframes dr { to { stroke-dashoffset: -28; } }
.st { animation: st 3.2s ease-in-out infinite; opacity: 0; } .st2 { animation-delay: -1.1s; } .st3 { animation-delay: -2.2s; }
@keyframes st { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .55; } 100% { opacity: 0; transform: translateY(-22px); } }
.bl { animation: bl 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes bl { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }.needle { transform-box: view-box; transform-origin: 480px 352px; animation: sw 7s ease-in-out infinite; } @keyframes sw { 0%, 100% { transform: rotate(-62deg); } 33% { transform: rotate(0deg); } 66% { transform: rotate(62deg); } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs><rect width="960" height="440" rx="28" fill="#f1f4f8"/><g class="rv" style="animation-delay:0.0s"><path d="M270.0 352.0A210 210 0 0 1 371.8 172.0" stroke="#d99a1e" stroke-width="42" fill="none"/><text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11.5" fill="#fff" letter-spacing="1.4"><textPath href="#zp0" startOffset="50%" text-anchor="middle">KEEP A DISTANCE</textPath></text><path id="zp0" d="M275.0 352.0A205 205 0 0 1 374.4 176.3" fill="none"/><g class="pop" style="animation-delay:0.5s"><rect x="168" y="270" width="85" height="30" rx="15" fill="#fff" stroke="#d99a1e" stroke-width="2" filter="url(#sh)"/><text x="210" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#d99a1e" text-anchor="middle">suggests</text></g><g class="pop" style="animation-delay:0.5s"><rect x="202" y="190" width="85" height="30" rx="15" fill="#fff" stroke="#d99a1e" stroke-width="2" filter="url(#sh)"/><text x="244" y="210" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#d99a1e" text-anchor="middle">believes</text></g><g class="pop" style="animation-delay:0.5s"><rect x="268" y="124" width="68" height="30" rx="15" fill="#fff" stroke="#d99a1e" stroke-width="2" filter="url(#sh)"/><text x="301" y="144" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#d99a1e" text-anchor="middle">claims</text></g></g><g class="rv" style="animation-delay:0.2s"><path d="M378.2 168.3A210 210 0 0 1 581.8 168.3" stroke="#3a58a0" stroke-width="42" fill="none"/><text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11.5" fill="#fff" letter-spacing="1.4"><textPath href="#zp1" startOffset="50%" text-anchor="middle">JUST REPORTING</textPath></text><path id="zp1" d="M380.6 172.7A205 205 0 0 1 579.4 172.7" fill="none"/><g class="pop" style="animation-delay:0.7s"><rect x="339" y="87" width="59" height="30" rx="15" fill="#fff" stroke="#3a58a0" stroke-width="2" filter="url(#sh)"/><text x="369" y="107" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#3a58a0" text-anchor="middle">found</text></g><g class="pop" style="animation-delay:0.7s"><rect x="402" y="26" width="68" height="30" rx="15" fill="#fff" stroke="#3a58a0" stroke-width="2" filter="url(#sh)"/><text x="436" y="46" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#3a58a0" text-anchor="middle">states</text></g><g class="pop" style="animation-delay:0.7s"><rect x="480" y="66" width="76" height="30" rx="15" fill="#fff" stroke="#3a58a0" stroke-width="2" filter="url(#sh)"/><text x="518" y="86" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#3a58a0" text-anchor="middle">reports</text></g><g class="pop" style="animation-delay:0.7s"><rect x="568" y="60" width="119" height="30" rx="15" fill="#fff" stroke="#3a58a0" stroke-width="2" filter="url(#sh)"/><text x="627" y="80" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#3a58a0" text-anchor="middle">according to</text></g></g><g class="rv" style="animation-delay:0.4s"><path d="M588.2 172.0A210 210 0 0 1 690.0 352.0" stroke="#c4562f" stroke-width="42" fill="none"/><text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11.5" fill="#fff" letter-spacing="1.4"><textPath href="#zp2" startOffset="50%" text-anchor="middle">THE AUTHOR IS SURE</textPath></text><path id="zp2" d="M585.6 176.3A205 205 0 0 1 685.0 352.0" fill="none"/><g class="pop" style="animation-delay:0.9s"><rect x="625" y="124" width="68" height="30" rx="15" fill="#fff" stroke="#c4562f" stroke-width="2" filter="url(#sh)"/><text x="659" y="144" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#c4562f" text-anchor="middle">argues</text></g><g class="pop" style="animation-delay:0.9s"><rect x="678" y="190" width="76" height="30" rx="15" fill="#fff" stroke="#c4562f" stroke-width="2" filter="url(#sh)"/><text x="716" y="210" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#c4562f" text-anchor="middle">asserts</text></g><g class="pop" style="animation-delay:0.9s"><rect x="703" y="270" width="93" height="30" rx="15" fill="#fff" stroke="#c4562f" stroke-width="2" filter="url(#sh)"/><text x="750" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#c4562f" text-anchor="middle">maintains</text></g></g><path d="M664.0 352.0L654.0 352.0" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M657.7 304.4L648.1 307.0" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M639.3 260.0L630.7 265.0" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M610.1 221.9L603.0 229.0" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M572.0 192.7L567.0 201.3" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M527.6 174.3L525.0 183.9" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M480.0 168.0L480.0 178.0" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M432.4 174.3L435.0 183.9" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M388.0 192.7L393.0 201.3" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M349.9 221.9L357.0 229.0" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M320.7 260.0L329.3 265.0" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M302.3 304.4L311.9 307.0" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><path d="M296.0 352.0L306.0 352.0" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><g class="needle"><path d="M473 352L480 182L487 352z" fill="#14293a"/></g><circle cx="480" cy="352" r="20" fill="#14293a"/><circle cx="480" cy="352" r="7" fill="#fff"/>
<text x="480" y="400" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#14293a" text-anchor="middle">How strongly does the author say it?</text><text x="480" y="420" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5d6a74" text-anchor="middle">Choose the reporting verb on purpose.</text></svg>