<rect width="960" height="470" rx="28" fill="url(#vm-g0)"/><rect width="960" height="470" rx="28" fill="url(#vm-g1)"/><rect width="960" height="470" rx="28" fill="url(#vm-dots)"/><rect x=".75" y=".75" width="958.5" height="468.5" rx="27.25" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/><g clip-path="url(#vm-clip)"><circle cx="910" cy="40" r="90" fill="#eee7f0" opacity=".55"/><circle cx="40" cy="440" r="80" fill="#e4eeec" opacity=".55"/></g><ellipse cx="480" cy="452" rx="420" ry="10" fill="#2a2340" opacity=".12" filter="url(#vm-bl)"/><rect x="46" y="38" width="868" height="418" rx="20" fill="#efe9f4"/><rect x="40" y="30" width="880" height="420" rx="20" fill="url(#vm-paper)" filter="url(#vm-sh)"/><path d="M60 31.5h840" stroke="#fff" stroke-width="2" stroke-linecap="round"/><g transform="translate(906 54)" opacity=".5"><text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#7a4a8c" text-anchor="end" y="20">”</text></g><text x="64" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#98a2a9" text-anchor="start" letter-spacing="2.5">ONE PARAGRAPH · FOUR VOICES</text><g class="rv" style="animation-delay:0.00s"><rect x="64" y="84" width="832" height="44" rx="12" fill="url(#vm-g2)"/><rect x="64" y="84" width="832" height="44" rx="12" fill="none" stroke="#7a4a8c" stroke-opacity=".14"/><path d="M76 85h808" stroke="#fff" stroke-opacity=".8" stroke-width="1.2" stroke-linecap="round"/><rect class="hl hl1" x="64" y="84" width="7" height="44" rx="3.5" fill="url(#vm-g3)"/><text font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#14293a"><tspan x="84" y="112">Sydney is a popular destination for international students.</tspan></text></g><g class="rv" style="animation-delay:0.18s"><rect x="64" y="138" width="832" height="56" rx="12" fill="url(#vm-g2)"/><rect x="64" y="138" width="832" height="56" rx="12" fill="none" stroke="#7a4a8c" stroke-opacity=".14"/><path d="M76 139h808" stroke="#fff" stroke-opacity=".8" stroke-width="1.2" stroke-linecap="round"/><rect class="hl hl2" x="64" y="138" width="7" height="56" rx="3.5" fill="url(#vm-g3)"/><text font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#14293a"><tspan x="84" y="161">It has many benefits for young people which make it easier for them to focus on their studies without the urban stress</tspan><tspan x="84" y="184">that many other cities can cause.</tspan></text></g><g class="rv" style="animation-delay:0.36s"><rect x="64" y="204" width="832" height="56" rx="12" fill="url(#vm-g4)"/><rect x="64" y="204" width="832" height="56" rx="12" fill="none" stroke="#2f7d6b" stroke-opacity=".14"/><path d="M76 205h808" stroke="#fff" stroke-opacity=".8" stroke-width="1.2" stroke-linecap="round"/><rect class="hl hl3" x="64" y="204" width="7" height="56" rx="3.5" fill="url(#vm-g5)"/><text font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#14293a"><tspan x="84" y="238">Smith and Anderson (2024) <tspan font-weight="700">claim that</tspan> Sydney’s safety and climate make it an ideal study location.</tspan></text></g><g class="rv" style="animation-delay:0.54s"><rect x="64" y="270" width="832" height="56" rx="12" fill="url(#vm-g6)"/><rect x="64" y="270" width="832" height="56" rx="12" fill="none" stroke="#b0512a" stroke-opacity=".14"/><path d="M76 271h808" stroke="#fff" stroke-opacity=".8" stroke-width="1.2" stroke-linecap="round"/><rect class="hl hl4" x="64" y="270" width="7" height="56" rx="3.5" fill="url(#vm-g7)"/><text font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#14293a"><tspan x="84" y="304"><tspan font-weight="700">However,</tspan> Jones (2024) <tspan font-weight="700">asserts that</tspan> the high cost of living makes it difficult for international students to manage.</tspan></text></g><g class="rv" style="animation-delay:0.72s"><rect x="64" y="336" width="832" height="56" rx="12" fill="url(#vm-g8)"/><rect x="64" y="336" width="832" height="56" rx="12" fill="none" stroke="#3a58a0" stroke-opacity=".14"/><path d="M76 337h808" stroke="#fff" stroke-opacity=".8" stroke-width="1.2" stroke-linecap="round"/><rect class="hl hl1" x="64" y="336" width="7" height="56" rx="3.5" fill="url(#vm-g9)"/><text font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#14293a"><tspan x="84" y="359"><tspan font-weight="700">For instance, research from</tspan> Thompson (2023) <tspan font-weight="700">found that</tspan> many international students have difficulty finding</tspan><tspan x="84" y="382">accommodation within their budget.</tspan></text></g><g><circle cx="70" cy="419" r="11" fill="#593a6c" opacity=".2"/><circle cx="70" cy="418" r="10" fill="url(#vm-g10)"/><circle cx="70" cy="415" r="3.2" fill="#fff" opacity=".9"/><path d="M64.5 424a5.5 5 0 0 1 11 0z" fill="#fff" opacity=".9"/></g><text x="86" y="423" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#5d6a74" text-anchor="start">The writer</text><g><circle cx="285" cy="419" r="11" fill="#245e54" opacity=".2"/><circle cx="285" cy="418" r="10" fill="url(#vm-g11)"/><circle cx="285" cy="415" r="3.2" fill="#fff" opacity=".9"/><path d="M279.5 424a5.5 5 0 0 1 11 0z" fill="#fff" opacity=".9"/></g><text x="301" y="423" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#5d6a74" text-anchor="start">Smith and Anderson</text><g><circle cx="500" cy="419" r="11" fill="#7e3f27" opacity=".2"/><circle cx="500" cy="418" r="10" fill="url(#vm-g12)"/><circle cx="500" cy="415" r="3.2" fill="#fff" opacity=".9"/><path d="M494.5 424a5.5 5 0 0 1 11 0z" fill="#fff" opacity=".9"/></g><text x="516" y="423" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#5d6a74" text-anchor="start">Jones</text><g><circle cx="715" cy="419" r="11" fill="#2c447a" opacity=".2"/><circle cx="715" cy="418" r="10" fill="url(#vm-g13)"/><circle cx="715" cy="415" r="3.2" fill="#fff" opacity=".9"/><path d="M709.5 424a5.5 5 0 0 1 11 0z" fill="#fff" opacity=".9"/></g><text x="731" y="423" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#5d6a74" text-anchor="start">Thompson</text><path class="tw" d="M930 244Q931.08 248.92 936 250Q931.08 251.08 930 256Q928.92 251.08 924 250Q928.92 248.92 930 244z" fill="#e3a843"/><path class="tw tw2" d="M24 114Q25.08 118.92 30 120Q25.08 121.08 24 126Q22.92 121.08 18 120Q22.92 118.92 24 114z" fill="#7a4a8c"/></svg>
