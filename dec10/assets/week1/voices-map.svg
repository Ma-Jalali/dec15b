<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="One paragraph, four voices. The writer: Sydney is a popular destination for international students; it has many benefits for young people. Smith and Anderson (2024) claim that Sydney’s safety and climate make it an ideal study location. However, Jones (2024) asserts that the high cost of living makes it difficult for international students to manage. For instance, research from Thompson (2023) found that many international students have difficulty finding accommodation within their budget.">
<style>.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; } @keyframes rv { from { opacity: 0; transform: translateY(14px); } }
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes pu { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } }
.gl { animation: gl 3s ease-in-out infinite; } .gl2 { animation-delay: -1s; } .gl3 { animation-delay: -2s; } @keyframes gl { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv { opacity: 1 !important; } }</style><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".14"/></filter></defs><rect width="960" height="470" rx="28" fill="#f4f0f7"/><rect x="40" y="30" width="880" height="420" rx="20" fill="#fff" filter="url(#sh)"/><text x="64" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#98a2a9" text-anchor="start" letter-spacing="2.5">ONE PARAGRAPH · FOUR VOICES</text><g class="rv" style="animation-delay:0.00s"><rect x="64" y="84" width="832" height="44" rx="12" fill="#7a4a8c" fill-opacity=".09"/><rect x="64" y="84" width="7" height="44" rx="3.5" fill="#7a4a8c"/>
    <foreignObject x="84" y="90" width="800" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px/1.4 Georgia,serif;color:#14293a">Sydney is a popular destination for international students.</div></foreignObject></g><g class="rv" style="animation-delay:0.18s"><rect x="64" y="138" width="832" height="56" rx="12" fill="#7a4a8c" fill-opacity=".09"/><rect x="64" y="138" width="7" height="56" rx="3.5" fill="#7a4a8c"/>
    <foreignObject x="84" y="144" width="800" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px/1.4 Georgia,serif;color:#14293a">It has many benefits for young people which make it easier for them to focus on their studies without the urban stress that many other cities can cause.</div></foreignObject></g><g class="rv" style="animation-delay:0.36s"><rect x="64" y="204" width="832" height="56" rx="12" fill="#2f7d6b" fill-opacity=".09"/><rect x="64" y="204" width="7" height="56" rx="3.5" fill="#2f7d6b"/>
    <foreignObject x="84" y="210" width="800" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px/1.4 Georgia,serif;color:#14293a">Smith and Anderson (2024) <b>claim that</b> Sydney’s safety and climate make it an ideal study location.</div></foreignObject></g><g class="rv" style="animation-delay:0.54s"><rect x="64" y="270" width="832" height="56" rx="12" fill="#b0512a" fill-opacity=".09"/><rect x="64" y="270" width="7" height="56" rx="3.5" fill="#b0512a"/>
    <foreignObject x="84" y="276" width="800" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px/1.4 Georgia,serif;color:#14293a"><b>However,</b> Jones (2024) <b>asserts that</b> the high cost of living makes it difficult for international students to manage.</div></foreignObject></g><g class="rv" style="animation-delay:0.72s"><rect x="64" y="336" width="832" height="56" rx="12" fill="#3a58a0" fill-opacity=".09"/><rect x="64" y="336" width="7" height="56" rx="3.5" fill="#3a58a0"/>
    <foreignObject x="84" y="342" width="800" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="font:17px/1.4 Georgia,serif;color:#14293a"><b>For instance, research from</b> Thompson (2023) <b>found that</b> many international students have difficulty finding accommodation within their budget.</div></foreignObject></g><circle cx="70" cy="418" r="8" fill="#7a4a8c"/><text x="86" y="423" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#5d6a74" text-anchor="start">The writer</text><circle cx="285" cy="418" r="8" fill="#2f7d6b"/><text x="301" y="423" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#5d6a74" text-anchor="start">Smith and Anderson</text><circle cx="500" cy="418" r="8" fill="#b0512a"/><text x="516" y="423" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#5d6a74" text-anchor="start">Jones</text><circle cx="715" cy="418" r="8" fill="#3a58a0"/><text x="731" y="423" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#5d6a74" text-anchor="start">Thompson</text></svg>