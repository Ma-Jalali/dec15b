<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 670" fill="none" role="img" aria-labelledby="t">
<title id="t">Paragraph B of Griffiths (2020) annotated: 53.6% and “responsible for 414kg” highlighted, “each of us” circled, “gadgets” underlined, with dotted arrows to margin notes: “!!! Cause: more than half the world is online”, “→ Our gadgets + systems = 3.7% of emissions”, “? Who is ‘each of us’? Every user — even me?”, “!!! Effect: 414 kg CO₂ per person, per year”. A legend explains: highlight = the key fact, circle = a word to think about, ? = I don’t understand, !!! = this is important.</title>
<style>
  .fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
  .tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .tw2 { animation-delay: -1.4s; }
  .bl { animation: bl 1.6s steps(2) infinite; } .bl2 { animation-delay: -.5s; } .bl3 { animation-delay: -1.1s; }
  .flow { stroke-dasharray: 2 14; animation: flow 1.4s linear infinite; } .flow2 { animation-duration: 2.1s; }
  .rise { animation: rise 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .r2 { animation-delay: -2.3s; } .r3 { animation-delay: -4.6s; }
  .pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .pu2 { animation-delay: -1.2s; }
  .sp { animation: sp 14s linear infinite; transform-box: fill-box; transform-origin: center; }
  .dash { animation: dash 2.4s linear infinite; }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes bl { 0% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  @keyframes rise { 0% { transform: translateY(12px) scale(.9); opacity: 0; } 30% { opacity: .95; } 100% { transform: translateY(-40px) scale(1.08); opacity: 0; } }
  @keyframes pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes sp { to { transform: rotate(360deg); } }
  @keyframes dash { to { stroke-dashoffset: -44; } }
  .hl { stroke-dasharray: 220; animation: hl 6s ease-in-out infinite; } .h2 { animation-delay: -2s; } .h3 { animation-delay: -4s; } @keyframes hl { 0% { stroke-dashoffset: 220; } 35%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 220; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/></filter>
  <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".16"/></pattern>
</defs>
<rect width="1300" height="670" rx="28" fill="#fbf7ef"/>
<g filter="url(#s)"><rect x="40" y="70" width="640" height="480" rx="20" fill="#fff"/></g><text x="70" y="112" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#2b776e" text-anchor="start" letter-spacing="2">GRIFFITHS (2020) · PARAGRAPH B</text><path class="hl" d="M190 198h42" stroke="#f2c14e" stroke-width="22" opacity=".55" stroke-linecap="round"/><path class="hl h2" d="M418 286h34" stroke="#9ed3bd" stroke-width="22" opacity=".7" stroke-linecap="round"/><path class="hl h3" d="M70 506h164" stroke="#f2c14e" stroke-width="22" opacity=".55" stroke-linecap="round"/><text x="70" y="160" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="19" fill="#14293a" text-anchor="start">B. Although the energy needed for a single internet search or</text><text x="70" y="204" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="19" fill="#14293a" text-anchor="start">email is small, 53.6% of the global population now use the</text><text x="70" y="248" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="19" fill="#14293a" text-anchor="start">internet. The carbon footprint of our gadgets, the internet, and</text><text x="70" y="292" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="19" fill="#14293a" text-anchor="start">the systems supporting them account for about 3.7% of global</text><text x="70" y="336" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="19" fill="#14293a" text-anchor="start">greenhouse emissions. If we were to divide the 1.7 billion tonnes</text><text x="70" y="380" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="19" fill="#14293a" text-anchor="start">of greenhouse gas emissions estimated to be produced in the</text><text x="70" y="424" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="19" fill="#14293a" text-anchor="start">manufacture and running of digital technologies between all</text><text x="70" y="468" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="19" fill="#14293a" text-anchor="start">internet users around the world, it means each of us is</text><text x="70" y="512" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="19" fill="#14293a" text-anchor="start">responsible for 414kg of carbon dioxide a year.</text><ellipse cx="427" cy="462" rx="48" ry="20" stroke="#d4583a" stroke-width="3.5"/><path d="M359 252h53" stroke="#3a58a0" stroke-width="3.5" stroke-linecap="round"/><path d="M700 70v440" stroke="#d4583a" stroke-opacity=".3" stroke-width="2"/><text x="1020" y="112" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#b0512a" text-anchor="middle" letter-spacing="2">COMMENTS / QUESTIONS / THOUGHTS</text><path class="dash" d="M230 190C350 190 700 150 760 150" stroke="#f2c14e" stroke-width="3" stroke-dasharray="6 6"/><g class="fl" filter="url(#s2)"><rect x="760" y="114" width="500" height="72" rx="16" fill="#fff"/><rect x="760" y="114" width="72" height="72" rx="16" fill="#f2c14e"/><text x="796" y="160" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#14293a" text-anchor="middle">!!!</text><text x="850" y="144" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="19" fill="#14293a" text-anchor="start">Cause: more than half</text><text x="850" y="170" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="19" fill="#3d505e" text-anchor="start">the world is online</text></g><path class="dash" d="M454 284C574 284 700 250 760 250" stroke="#3a58a0" stroke-width="3" stroke-dasharray="6 6"/><g class="fl" filter="url(#s2)"><rect x="760" y="214" width="500" height="72" rx="16" fill="#fff"/><rect x="760" y="214" width="72" height="72" rx="16" fill="#3a58a0"/><text x="796" y="260" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#fff" text-anchor="middle">→</text><text x="850" y="244" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="19" fill="#14293a" text-anchor="start">Our gadgets + systems</text><text x="850" y="270" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="19" fill="#3d505e" text-anchor="start">= 3.7% of emissions</text></g><path class="dash" d="M477 460C597 460 700 350 760 350" stroke="#d4583a" stroke-width="3" stroke-dasharray="6 6"/><g class="fl" filter="url(#s2)"><rect x="760" y="314" width="500" height="72" rx="16" fill="#fff"/><rect x="760" y="314" width="72" height="72" rx="16" fill="#d4583a"/><text x="796" y="360" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#fff" text-anchor="middle">?</text><text x="850" y="344" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="19" fill="#14293a" text-anchor="start">Who is “each of us”?</text><text x="850" y="370" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="19" fill="#3d505e" text-anchor="start">Every user — even me?</text></g><path class="dash" d="M236 512C356 512 700 450 760 450" stroke="#2f9a63" stroke-width="3" stroke-dasharray="6 6"/><g class="fl" filter="url(#s2)"><rect x="760" y="414" width="500" height="72" rx="16" fill="#fff"/><rect x="760" y="414" width="72" height="72" rx="16" fill="#2f9a63"/><text x="796" y="460" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#fff" text-anchor="middle">!!!</text><text x="850" y="444" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="19" fill="#14293a" text-anchor="start">Effect: 414 kg CO₂</text><text x="850" y="470" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="19" fill="#3d505e" text-anchor="start">per person, per year</text></g><rect x="70" y="578" width="270" height="56" rx="28" fill="#fff" filter="url(#s2)"/><rect x="88" y="596" width="54" height="20" rx="6" fill="#f2c14e" opacity=".7"/><text x="154" y="612" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="16" fill="#14293a" text-anchor="start">the key fact</text><rect x="370" y="578" width="270" height="56" rx="28" fill="#fff" filter="url(#s2)"/><ellipse cx="415" cy="606" rx="26" ry="12" stroke="#d4583a" stroke-width="3"/><text x="454" y="612" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="16" fill="#14293a" text-anchor="start">a word to think about</text><rect x="670" y="578" width="270" height="56" rx="28" fill="#fff" filter="url(#s2)"/><text x="715" y="616" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#d4583a" text-anchor="middle">?</text><text x="754" y="612" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="16" fill="#14293a" text-anchor="start">I don’t understand</text><rect x="970" y="578" width="270" height="56" rx="28" fill="#fff" filter="url(#s2)"/><text x="1015" y="616" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#2f9a63" text-anchor="middle">!!!</text><text x="1054" y="612" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="16" fill="#14293a" text-anchor="start">this is important</text>
</svg>
