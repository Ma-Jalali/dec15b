@keyframes an-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.an-pu { animation: an-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes an-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.an-ring { animation: an-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes an-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.an-flow { animation: an-flow 1.8s linear infinite; }
@keyframes an-flow { to { stroke-dashoffset: -28; } }
.an-hl { animation: an-hl 9s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; } .an-h2 { animation-delay: -3s; } .an-h3 { animation-delay: -6s; }
@keyframes an-hl { 0% { transform: scaleX(.05); } 14%, 100% { transform: scaleX(1); } }
.an-pen { animation: an-pen 7s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 80%; }
@keyframes an-pen { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-5deg) translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
