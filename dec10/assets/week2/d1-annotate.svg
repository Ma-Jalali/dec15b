<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 670" fill="none" role="img" aria-labelledby="an-t">
<title id="an-t">Paragraph B of Griffiths (2020) on a sheet of paper, annotated: 53.6% and “responsible for 414kg” highlighted in yellow, 3.7% highlighted in green, “gadgets” underlined and “each of us” circled, with dotted lines to four margin notes: “!!! Cause: more than half the world is online”, “→ Our gadgets + systems = 3.7% of emissions”, “? Who is ‘each of us’? Every user — even me?”, “!!! Effect: 414 kg CO₂ per person, per year”. A legend explains: highlight = the key fact, circle = a word to think about, ? = I don’t understand, !!! = this is important.</title>
<style>
