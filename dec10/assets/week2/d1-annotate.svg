<text x="70" y="160" font-family="Georgia, serif" font-weight="500" font-size="19" fill="#14293a" textLength="508.6" lengthAdjust="spacing">B. Although the energy needed for a single internet search or</text>
<text x="70" y="204" font-family="Georgia, serif" font-weight="500" font-size="19" fill="#14293a" textLength="491.0" lengthAdjust="spacing">email is small, 53.6% of the global population now use the</text>
<text x="70" y="248" font-family="Georgia, serif" font-weight="500" font-size="19" fill="#14293a" textLength="517.3" lengthAdjust="spacing">internet. The carbon footprint of our gadgets, the internet, and</text>
<text x="70" y="292" font-family="Georgia, serif" font-weight="500" font-size="19" fill="#14293a" textLength="519.0" lengthAdjust="spacing">the systems supporting them account for about 3.7% of global</text>
<text x="70" y="336" font-family="Georgia, serif" font-weight="500" font-size="19" fill="#14293a" textLength="543.3" lengthAdjust="spacing">greenhouse emissions. If we were to divide the 1.7 billion tonnes</text>
<text x="70" y="380" font-family="Georgia, serif" font-weight="500" font-size="19" fill="#14293a" textLength="505.6" lengthAdjust="spacing">of greenhouse gas emissions estimated to be produced in the</text>
<text x="70" y="424" font-family="Georgia, serif" font-weight="500" font-size="19" fill="#14293a" textLength="503.1" lengthAdjust="spacing">manufacture and running of digital technologies between all</text>
<text x="70" y="468" font-family="Georgia, serif" font-weight="500" font-size="19" fill="#14293a" textLength="449.8" lengthAdjust="spacing">internet users around the world, it means each of us is</text>
<text x="70" y="512" font-family="Georgia, serif" font-weight="500" font-size="19" fill="#14293a" textLength="394.7" lengthAdjust="spacing">responsible for 414kg of carbon dioxide a year.</text>
