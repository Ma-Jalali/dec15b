<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none" role="img" aria-labelledby="t">
<title id="t">An argument drawn as a house: the roof is the KEY ARGUMENT (the main idea); three pillars are CLAIMS (the points that support it); the foundation is EVIDENCE FROM SOURCES; underground, drawn with a dotted line, are the hidden ASSUMPTIONS (what the author thinks you already know); a label points to the LANGUAGE (the words the author chooses, such as “because…” and “also disputed”). A note says: no evidence = a house with no foundation!</title>
<style>
  .fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
  .tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .tw2 { animation-delay: -1.4s; }
  .bl { animation: bl 1.6s steps(2) infinite; } .bl2 { animation-delay: -.5s; } .bl3 { animation-delay: -1.1s; }
  .flow { stroke-dasharray: 2 14; animation: flow 1.4s linear infinite; } .flow2 { animation-duration: 2.1s; }
  .rise { animation: rise 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .r2 { animation-delay: -2.3s; } .r3 { animation-delay: -4.6s; }
  .pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .pu2 { animation-delay: -1.2s; }
  .sp { animation: sp 14s linear infinite; transform-box: fill-box; transform-origin: center; }
  .dash { animation: dash 2.4s linear infinite; }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes bl { 0% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  @keyframes rise { 0% { transform: translateY(12px) scale(.9); opacity: 0; } 30% { opacity: .95; } 100% { transform: translateY(-40px) scale(1.08); opacity: 0; } }
  @keyframes pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes sp { to { transform: rotate(360deg); } }
  @keyframes dash { to { stroke-dashoffset: -44; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/></filter>
  <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".16"/></pattern>
</defs>
<rect width="1200" height="760" rx="28" fill="#eef6f8"/>
<rect x="0" y="560" width="1200" height="200" fill="#e9e2d2"/><rect x="0" y="560" width="1200" height="8" fill="#c9b99a"/><g class="fl" filter="url(#s)"><path d="M300 250L600 70l300 180z" fill="#2b776e"/></g><text x="600" y="200" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#fff" text-anchor="middle" letter-spacing="2">KEY ARGUMENT</text><text x="600" y="232" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#dff0ee" text-anchor="middle">the main idea</text><g filter="url(#s2)"><rect x="360" y="262" width="120" height="230" rx="10" fill="#3a58a0"/></g><text x="420" y="360" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#fff" text-anchor="middle" letter-spacing="2">CLAIM</text><text x="420" y="388" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#dfe6f7" text-anchor="middle">point 1</text><g filter="url(#s2)"><rect x="540" y="262" width="120" height="230" rx="10" fill="#3a58a0"/></g><text x="600" y="360" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#fff" text-anchor="middle" letter-spacing="2">CLAIM</text><text x="600" y="388" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#dfe6f7" text-anchor="middle">point 2</text><g filter="url(#s2)"><rect x="720" y="262" width="120" height="230" rx="10" fill="#3a58a0"/></g><text x="780" y="360" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#fff" text-anchor="middle" letter-spacing="2">CLAIM</text><text x="780" y="388" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="15" fill="#dfe6f7" text-anchor="middle">point 3</text><g filter="url(#s2)"><rect x="300" y="492" width="600" height="68" rx="10" fill="#b07d12"/></g><text x="600" y="534" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#fff" text-anchor="middle" letter-spacing="2">EVIDENCE FROM SOURCES</text><g class="tw"><rect x="320" y="600" width="560" height="110" rx="16" fill="#fff" fill-opacity=".55" stroke="#7a4a8c" stroke-width="3" stroke-dasharray="10 8"/></g><text x="600" y="648" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#7a4a8c" text-anchor="middle" letter-spacing="2">ASSUMPTIONS</text><text x="600" y="678" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#5d6a74" text-anchor="middle">hidden: what the author thinks you already know</text><g class="fl fl2" filter="url(#s2)"><rect x="940" y="250" width="220" height="140" rx="18" fill="#fff"/><text x="1050" y="290" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#d4583a" text-anchor="middle" letter-spacing="2">LANGUAGE</text><text x="1050" y="322" font-family="Georgia, 'Times New Roman', serif" font-weight="600" font-size="18" fill="#14293a" text-anchor="middle">“because …”</text><text x="1050" y="350" font-family="Georgia, 'Times New Roman', serif" font-weight="600" font-size="18" fill="#14293a" text-anchor="middle">“also disputed”</text><text x="1050" y="376" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#5d6a74" text-anchor="middle">the words chosen</text></g><path class="dash" d="M940 320C900 320 880 360 860 380" stroke="#d4583a" stroke-width="3" stroke-dasharray="6 6"/><g class="fl fl3" filter="url(#s2)"><rect x="40" y="300" width="220" height="150" rx="18" fill="#fff"/><text x="150" y="340" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#2b776e" text-anchor="middle" letter-spacing="2">STRONG?</text><text x="150" y="372" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="17" fill="#14293a" text-anchor="middle">No evidence =</text><text x="150" y="398" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="17" fill="#14293a" text-anchor="middle">a house with no</text><text x="150" y="424" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#d4583a" text-anchor="middle">foundation!</text></g>
</svg>
