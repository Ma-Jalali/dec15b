<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="1200" height="760" viewBox="0 0 1200 760" fill="none" role="img" aria-labelledby="ar-t">
<title id="ar-t">An argument drawn as a house: the roof is the KEY ARGUMENT (the main idea); three columns are CLAIMS (point 1, point 2, point 3) that support it; the stone foundation is EVIDENCE FROM SOURCES; underground, inside a dotted box among the roots, are the hidden ASSUMPTIONS (what the author thinks you already know); a card points to the LANGUAGE (the words chosen, such as “because …” and “also disputed”). A note asks “Strong?”: no evidence = a house with no foundation!</title>
<style>
.ar-fl { animation: ar-fl 6s ease-in-out infinite; } .ar-d1 { animation-delay: -2s; } .ar-d2 { animation-delay: -4s; } .ar-d3 { animation-delay: -1s; }
@keyframes ar-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.ar-tw { animation: ar-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ar-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.ar-pu { animation: ar-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ar-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.ar-ring { animation: ar-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ar-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.ar-flow { animation: ar-flow 1.8s linear infinite; }
@keyframes ar-flow { to { stroke-dashoffset: -28; } }
.ar-cl { animation: ar-cl 40s linear infinite; } @keyframes ar-cl { 0% { transform: translateX(-30px); } 50% { transform: translateX(30px); } 100% { transform: translateX(-30px); } }
.ar-dsh { animation: ar-dsh 3s linear infinite; } @keyframes ar-dsh { to { stroke-dashoffset: -36; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
