<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" width="1000" height="660" viewBox="0 0 1000 660" fill="none" role="img" aria-labelledby="i1-t">
<title id="i1-t">Infographic “Sizing up the internet’s carbon emissions — carbon footprint”, with a desktop monitor showing a wifi signal. 4 BILLION+: over 4 billion people are active internet users. 3.7%: the carbon footprint of our gadgets, the internet and the systems supporting them accounts for 3.7% of global greenhouse emissions, similar to the airline industry; these emissions are predicted to double by 2025. NO.3: global IT sector electricity demand ranks behind only two countries in the world – China and the US. Sources: 1 BBC Future, 2 Greenpeace Click Clean report 2017, p16. Original source: climateimpact.com.</title>
<style>
.i1-fl { animation: i1-fl 6s ease-in-out infinite; } .i1-d1 { animation-delay: -2s; } .i1-d2 { animation-delay: -4s; } .i1-d3 { animation-delay: -1s; }
@keyframes i1-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.i1-tw { animation: i1-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes i1-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.i1-pu { animation: i1-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes i1-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.i1-ring { animation: i1-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes i1-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.i1-flow { animation: i1-flow 1.8s linear infinite; }
@keyframes i1-flow { to { stroke-dashoffset: -28; } }
.i1-wf { animation: i1-wf 3s ease-in-out infinite; } .i1-w2 { animation-delay: .3s; } .i1-w3 { animation-delay: .6s; } @keyframes i1-wf { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
