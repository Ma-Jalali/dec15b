<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" fill="none" role="img" aria-labelledby="t">
<title id="t">Infographic “Sizing up the internet’s carbon emissions — carbon footprint”. 4 BILLION+: over 4 billion people are active internet users. 3.7%: the carbon footprint of our gadgets, the internet and the systems supporting them accounts for 3.7% of global greenhouse emissions, similar to the airline industry; these emissions are predicted to double by 2025. NO.3: global IT sector electricity demand ranks behind only two countries in the world — China and the US. Original source: climateimpact.com.</title>
<style>
  .fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
  .tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .tw2 { animation-delay: -1.4s; }
  .bl { animation: bl 1.6s steps(2) infinite; } .bl2 { animation-delay: -.5s; } .bl3 { animation-delay: -1.1s; }
  .flow { stroke-dasharray: 2 14; animation: flow 1.4s linear infinite; } .flow2 { animation-duration: 2.1s; }
  .rise { animation: rise 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .r2 { animation-delay: -2.3s; } .r3 { animation-delay: -4.6s; }
  .pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .pu2 { animation-delay: -1.2s; }
  .sp { animation: sp 14s linear infinite; transform-box: fill-box; transform-origin: center; }
  .dash { animation: dash 2.4s linear infinite; }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes bl { 0% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  @keyframes rise { 0% { transform: translateY(12px) scale(.9); opacity: 0; } 30% { opacity: .95; } 100% { transform: translateY(-40px) scale(1.08); opacity: 0; } }
  @keyframes pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes sp { to { transform: rotate(360deg); } }
  @keyframes dash { to { stroke-dashoffset: -44; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/></filter>
  <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".16"/></pattern>
</defs>
<rect width="1000" height="660" rx="28" fill="#5bc6ec"/>
<rect x="0" y="0" width="1000" height="660" rx="28" fill="#5bc6ec"/><text x="70" y="110" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="40" fill="#253038" text-anchor="start" letter-spacing="1">SIZING UP THE INTERNET’S</text><text x="70" y="160" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="40" fill="#253038" text-anchor="start" letter-spacing="1">CARBON EMISSIONS</text><path d="M70 200h400l-24 40H70z" fill="#4a8cc0"/><text x="92" y="230" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#fff" text-anchor="start">CARBON FOOTPRINT</text><g transform="translate(120 20) scale(.86)"><g class="fl" filter="url(#s)"><rect x="600" y="60" width="330" height="240" rx="18" fill="#4a8cc0"/><rect x="600" y="248" width="330" height="52" fill="#fff"/><circle cx="765" cy="274" r="10" fill="#4a8cc0"/><path d="M740 300h50l12 40h-74z" fill="#4a8cc0"/><circle cx="765" cy="74" r="4" fill="#fff"/><g fill="none" stroke="#5bc6ec" stroke-width="16" stroke-linecap="round"><path class="tw" d="M735 200a42 42 0 0 1 60 0"/><path class="tw tw2" d="M705 178a84 84 0 0 1 120 0"/><path class="tw" d="M675 156a126 126 0 0 1 180 0"/></g><circle cx="765" cy="214" r="12" fill="#5bc6ec"/></g></g><g class="pu"><text x="70" y="410" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46" fill="#fff" text-anchor="start">4 BILLION+</text></g><text x="70" y="450" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#253038" text-anchor="start">Over 4 billion people are active</text><text x="70" y="474" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#253038" text-anchor="start">internet users.</text><g class="pu pu2"><text x="390" y="410" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46" fill="#fff" text-anchor="start">3.7%</text></g><text x="390" y="450" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#253038" text-anchor="start">The carbon footprint of our gadgets,</text><text x="390" y="474" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#253038" text-anchor="start">the internet and the systems</text><text x="390" y="498" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#253038" text-anchor="start">supporting them accounts for 3.7% of</text><text x="390" y="522" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#253038" text-anchor="start">global greenhouse emissions, similar</text><text x="390" y="546" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#253038" text-anchor="start">to the airline industry. These emissions</text><text x="390" y="570" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#253038" text-anchor="start">are predicted to double by 2025.¹</text><g class="pu"><text x="710" y="410" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="46" fill="#fff" text-anchor="start">NO.3</text></g><text x="710" y="450" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#253038" text-anchor="start">Global IT sector electricity demand</text><text x="710" y="474" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#253038" text-anchor="start">ranks behind only two countries</text><text x="710" y="498" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#253038" text-anchor="start">in the world – China and the US.²</text><path d="M70 610h860" stroke="#253038" stroke-opacity=".4"/><text x="70" y="632" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="11" fill="#253038" text-anchor="start">1: https://www.bbc.com/future/article/20200305-why-your-internet-habits-are-not-as-clean-as-you-think</text><text x="70" y="648" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="11" fill="#253038" text-anchor="start">2: Green Peace Click Clean report 2017, p16</text>
</svg>
