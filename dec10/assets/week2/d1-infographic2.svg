<rect width="1000" height="1240" rx="28" fill="#3a6fa8"/><text x="60" y="90" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="40" fill="#fff" text-anchor="start">THE INTERNET USES A HUGE AMOUNT OF</text><text x="60" y="140" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="40" fill="#fff" text-anchor="start">ENERGY. THIS IS DUE TO TWO KEY FACTORS:</text><path d="M60 190h400l-20 40H60z" fill="#5bc6ec"/><text x="78" y="220" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#253038" text-anchor="start">MANUFACTURING AND SHIPPING</text><path d="M520 190h420l-20 40H520z" fill="#5bc6ec"/><text x="538" y="220" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#253038" text-anchor="start">POWERING AND COOLING</text><path d="M500 180v440" stroke="#fff" stroke-opacity=".4" stroke-width="2"/><g fill="#9fd9f3"><path d="M70 300c30-30 80-30 110-10s20 50-10 60-60 20-80 0-40-30-20-50z"/><path d="M190 280c30-10 70 0 100 20s10 40-30 50-80-10-80-40z"/><path d="M200 380c20 0 40 20 30 50s-30 30-40 10z"/><path d="M290 390c20-6 40 4 40 20s-30 20-40 0z"/></g><g class="plane"><path d="M150 290l40-6 14-14 6 2-8 14 22 2 6-6 4 2-4 8 4 8-4 2-6-6-22 2 8 14-6 2-14-14-40-6z" fill="#fff"/></g><text x="330" y="290" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff" text-anchor="start">Technology</text><text x="330" y="314" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff" text-anchor="start">companies must</text><text x="330" y="338" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff" text-anchor="start">manufacture and</text><text x="330" y="362" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff" text-anchor="start">ship the internet’s</text><text x="330" y="386" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff" text-anchor="start">hardware including:</text><g stroke="#9fd9f3" stroke-width="5" fill="none" stroke-linejoin="round"><path d="M600 460l40-200 40 200M612 400h56M622 340h36M630 300h20M580 300h120M592 340h96M612 400l56 60M668 400l-56 60"/></g><path class="tw" d="M720 280l-10 18h12l-10 18" stroke="#fff" stroke-width="4" fill="none"/><path class="tw tw2" d="M570 350l-8 14h10l-8 14" stroke="#fff" stroke-width="4" fill="none"/><text x="750" y="290" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff" text-anchor="start">Computers and</text><text x="750" y="314" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff" text-anchor="start">smartphones must be</text><text x="750" y="338" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff" text-anchor="start">powered and cooled,</text><text x="750" y="362" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff" text-anchor="start">drawing electricity</text><text x="750" y="386" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#fff" text-anchor="start">from local grids.</text><text x="750" y="420" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">This power is generated</text><text x="750" y="442" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">in different ways with</text><text x="750" y="464" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">varying emissions.¹</text><g transform="translate(110 560)"><rect x="-46" y="-36" width="92" height="64" rx="6" fill="#5bc6ec"/><rect x="-10" y="28" width="20" height="14" fill="#5bc6ec"/></g><text x="110" y="630" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#fff" text-anchor="middle">COMPUTERS</text><g transform="translate(250 560)"><rect x="-24" y="-44" width="48" height="86" rx="8" fill="#5bc6ec"/></g><text x="250" y="630" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#fff" text-anchor="middle">SMARTPHONES</text><g transform="translate(390 560)"><rect x="-44" y="-40" width="88" height="18" rx="4" fill="#fff"/><circle cx="-32" cy="-31" r="3" class="bl" fill="#5bc6ec"/><rect x="-44" y="-18" width="88" height="18" rx="4" fill="#fff"/><circle cx="-32" cy="-9" r="3" class="bl" fill="#5bc6ec"/><rect x="-44" y="4" width="88" height="18" rx="4" fill="#fff"/><circle cx="-32" cy="13" r="3" class="bl" fill="#5bc6ec"/><rect x="-44" y="26" width="88" height="18" rx="4" fill="#fff"/><circle cx="-32" cy="35" r="3" class="bl" fill="#5bc6ec"/></g><text x="390" y="630" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#fff" text-anchor="middle">SERVERS</text><g transform="translate(580 560)"><path d="M-40 10h80l-10 30h-60z" fill="#5bc6ec"/><circle cx="-14" cy="0" r="16" fill="#5bc6ec"/><circle cx="12" cy="-4" r="18" fill="#5bc6ec"/></g><text x="580" y="630" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#fff" text-anchor="middle">COAL</text><g transform="translate(700 560)"><path d="M-24 40l8-80h32l8 80z" fill="#5bc6ec"/></g><text x="700" y="630" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#fff" text-anchor="middle">NATURAL GAS</text><g transform="translate(820 560)"><path d="M-30 40l6-70h48l6 70z" fill="#5bc6ec"/><circle cy="10" r="12" fill="#3a6fa8"/></g><text x="820" y="630" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#fff" text-anchor="middle">NUCLEAR</text><g transform="translate(930 560)"><path d="M0 40V-10" stroke="#fff" stroke-width="4"/><g class="sp"><path d="M0-10l-4-32h8zM0-10l28 16-4 6zM0-10l-26 18-4-6z" fill="#fff"/></g></g><text x="930" y="630" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#fff" text-anchor="middle">RENEWABLES</text><path d="M60 680h880" stroke="#fff" stroke-opacity=".4" stroke-width="2"/><g class="fl"><rect x="60" y="740" width="130" height="34" rx="6" fill="#fff"/><circle cx="190" cy="757" r="20" stroke="#5bc6ec" stroke-width="8" fill="none"/><path d="M204 772l18 18" stroke="#5bc6ec" stroke-width="9" stroke-linecap="round"/></g><text x="230" y="744" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="24" fill="#fff" text-anchor="start">SEARCH ENGINE</text><text x="230" y="774" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">And every time we use a search</text><text x="230" y="796" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">engine, there’s an output of GHG</text><text x="230" y="818" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">gases because every unique</text><text x="230" y="840" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">search requires multiple servers.</text><g class="fl"><rect x="520" y="730" width="130" height="20" rx="4" fill="#fff"/><circle class="bl" cx="534" cy="740" r="4" fill="#5bc6ec"/><rect x="520" y="754" width="130" height="20" rx="4" fill="#fff"/><circle class="bl bl2" cx="534" cy="764" r="4" fill="#5bc6ec"/><rect x="520" y="778" width="130" height="20" rx="4" fill="#fff"/><circle class="bl bl2" cx="534" cy="788" r="4" fill="#5bc6ec"/></g><text x="690" y="744" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="24" fill="#fff" text-anchor="start">SERVER</text><text x="690" y="774" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">Production of servers requires</text><text x="690" y="796" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">more GHG-producing energy.</text><g class="fl"><rect x="60" y="944" width="140" height="80" rx="6" fill="#fff"/><rect x="60" y="944" width="140" height="16" rx="6" fill="#5bc6ec"/><path d="M150 982l26 12-12 4-4 12z" fill="#5bc6ec"/></g><text x="230" y="964" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="24" fill="#fff" text-anchor="start">WEB BROWSER</text><text x="230" y="994" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">The average website produces</text><text x="230" y="1016" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">1.76 grams CO₂ per page view.²</text><g class="fl"><rect x="520" y="946" width="130" height="86" rx="6" fill="#fff"/><path d="M520 950l65 46 65-46" stroke="#3a6fa8" stroke-width="5" fill="none"/></g><text x="690" y="964" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="24" fill="#fff" text-anchor="start">EMAIL</text><text x="690" y="994" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">An email has an estimated carbon</text><text x="690" y="1016" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">footprint of 4 grams of CO₂, and a</text><text x="690" y="1038" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">large attachment could have a</text><text x="690" y="1060" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">footprint of 50 grams. A typical year</text><text x="690" y="1082" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">of incoming mail for a business user</text><text x="690" y="1104" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">– including sending, filtering and</text><text x="690" y="1126" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">reading – creates a carbon footprint</text><text x="690" y="1148" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#e4f3fb" text-anchor="start">of around 135kg.³</text><path d="M60 1180h880" stroke="#fff" stroke-opacity=".4"/><text x="60" y="1200" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="10" fill="#e4f3fb" text-anchor="start">1: https://www.iea.org/data-and-statistics/charts/oecd-gross-electricity-production-by-source-1974-2018-provisional</text><text x="60" y="1214" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="10" fill="#e4f3fb" text-anchor="start">2: https://www.websitecarbon.com/how-does-it-work/</text><text x="60" y="1228" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="10" fill="#e4f3fb" text-anchor="start">3: https://carbonliteracy.com/the-carbon-cost-of-an-email/ – “How Bad are Bananas” book</text>
</svg>
