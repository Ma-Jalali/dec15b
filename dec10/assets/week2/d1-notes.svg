<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" fill="none" role="img" aria-labelledby="nt-t">
<title id="nt-t">A student’s handwritten note-taking table on lined paper, “Urbanisation in Slovakia”. Cause/s: Communist era centrally controlled econ. &amp; urban planning ⟶ market econ 1989 →; Trend ↑ households. Effects: Pressure from market invest. to construct: house/transport/shopping infrastructure; res. complexes/recreation areas; arrow down to: Agr land &amp; animal habitats converted to make space; arrow down to: Ecosystem damage – neg. imp. climate. ** Solution: econ int’s ⟷ env int’s ⟶ ↓ neg impact of urbanisation. A yellow sticky note reads: *Triple Bottom Line.</title>
<style>
.nt-fl { animation: nt-fl 6s ease-in-out infinite; } .nt-d1 { animation-delay: -2s; } .nt-d2 { animation-delay: -4s; } .nt-d3 { animation-delay: -1s; }
@keyframes nt-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.nt-tw { animation: nt-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes nt-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.nt-pu { animation: nt-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes nt-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.nt-ring { animation: nt-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes nt-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.nt-flow { animation: nt-flow 1.8s linear infinite; }
@keyframes nt-flow { to { stroke-dashoffset: -28; } }
.nt-dn { animation: nt-dn 2.4s ease-in-out infinite; } @keyframes nt-dn { 50% { transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
