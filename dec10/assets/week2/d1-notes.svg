<text x="320" y="166" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="30" fill="#14293a" text-anchor="middle">Cause/s</text><text x="880" y="166" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="30" fill="#14293a" text-anchor="middle">Effects</text>
<text x="70" y="240" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">Communist era centrally controlled</text>
<text x="70" y="282" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">econ. &amp; urban planning ⟶ market</text>
<text x="70" y="324" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">econ 1989 →</text>
<text x="70" y="400" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">Trend ↑ households</text>
<text x="630" y="240" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">Pressure from market invest. To</text>
<text x="630" y="282" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">construct:</text>
<text x="660" y="324" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">-  House/transport/shopping</text>
<text x="690" y="360" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">infrastructure</text>
<text x="660" y="400" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">-  Res. Complexes/recreation areas</text>
<text x="630" y="486" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">Agr land &amp; animal habitats ⟶</text>
<text x="630" y="526" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">converted to make space</text>
<text x="630" y="610" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">Ecosystem damage – neg. imp.</text>
<text x="630" y="648" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">climate</text>
<text x="630" y="720" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">** Solution: econ int’s ⟷ env int’s</text>
<text x="630" y="760" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="500" font-size="26" fill="#24384a">⟶ ↓ Neg impact of urbanisatⁿ</text>
