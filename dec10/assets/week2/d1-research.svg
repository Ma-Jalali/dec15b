<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740" fill="none" role="img" aria-labelledby="rs-t">
<title id="rs-t">The Research skills element of the Academic Success Toolkit: an orange sphere “Research: online multimedia” (with a play-screen icon) plus a green sphere “Research: traditional sources” (with a stack of books) lead, via a big arrow, to a large blue sphere: “applying criteria to evaluate the validity, credibility and reliability of both traditional library resources and online multimedia resources”, circled by a small orbiting tick.</title>
<style>
.rs-fl { animation: rs-fl 6s ease-in-out infinite; } .rs-d1 { animation-delay: -2s; } .rs-d2 { animation-delay: -4s; } .rs-d3 { animation-delay: -1s; }
@keyframes rs-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.rs-tw { animation: rs-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes rs-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.rs-pu { animation: rs-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes rs-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.rs-ring { animation: rs-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes rs-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.rs-flow { animation: rs-flow 1.8s linear infinite; }
@keyframes rs-flow { to { stroke-dashoffset: -28; } }
.rs-orb { animation: rs-orb 14s linear infinite; transform-box: view-box; transform-origin: 880px 365px; } @keyframes rs-orb { to { transform: rotate(360deg); } }
.rs-orb2 { animation: rs-orb 14s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
.rs-ar { animation: rs-ar 2.8s ease-in-out infinite; } @keyframes rs-ar { 50% { transform: translateX(10px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
