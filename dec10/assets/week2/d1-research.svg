<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740" fill="none" role="img" aria-labelledby="t">
<title id="t">The Research skills element of the Academic Success Toolkit: research with online multimedia plus research with traditional sources leads to applying criteria to evaluate the validity, credibility and reliability of both traditional library resources and online multimedia resources.</title>
<style>
  .fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
  .tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .tw2 { animation-delay: -1.4s; }
  .bl { animation: bl 1.6s steps(2) infinite; } .bl2 { animation-delay: -.5s; } .bl3 { animation-delay: -1.1s; }
  .flow { stroke-dasharray: 2 14; animation: flow 1.4s linear infinite; } .flow2 { animation-duration: 2.1s; }
  .rise { animation: rise 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .r2 { animation-delay: -2.3s; } .r3 { animation-delay: -4.6s; }
  .pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .pu2 { animation-delay: -1.2s; }
  .sp { animation: sp 14s linear infinite; transform-box: fill-box; transform-origin: center; }
  .dash { animation: dash 2.4s linear infinite; }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes bl { 0% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  @keyframes rise { 0% { transform: translateY(12px) scale(.9); opacity: 0; } 30% { opacity: .95; } 100% { transform: translateY(-40px) scale(1.08); opacity: 0; } }
  @keyframes pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes sp { to { transform: rotate(360deg); } }
  @keyframes dash { to { stroke-dashoffset: -44; } }
  .orb { animation: orb 12s linear infinite; transform-box: view-box; transform-origin: 880px 365px; } @keyframes orb { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/></filter>
  <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".16"/></pattern>
</defs>
<rect width="1180" height="740" rx="28" fill="#fbf7ef"/>
<g class="fl" filter="url(#s)"><circle cx="220" cy="170" r="120" fill="#e9763a"/></g><text x="220" y="150" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#fff" text-anchor="middle">Research:</text><text x="220" y="186" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff" text-anchor="middle">Online</text><text x="220" y="220" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff" text-anchor="middle">multimedia</text><g class="tw"><path d="M220 330v70M185 365h70" stroke="#e9763a" stroke-width="26" stroke-linecap="round"/></g><g class="fl fl2" filter="url(#s)"><circle cx="220" cy="560" r="120" fill="#2f7a3a"/></g><text x="220" y="540" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#fff" text-anchor="middle">Research:</text><text x="220" y="576" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff" text-anchor="middle">Traditional</text><text x="220" y="610" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#fff" text-anchor="middle">sources</text><g class="pu"><path d="M420 330h80v-40l80 70-80 70v-40h-80z" fill="#2f7a3a"/></g><g filter="url(#s)"><circle cx="880" cy="365" r="250" fill="#139bd4"/></g><text x="880" y="255" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="30" fill="#fff" text-anchor="middle">applying criteria to</text><text x="880" y="295" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="30" fill="#fff" text-anchor="middle">evaluate the validity,</text><text x="880" y="335" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="30" fill="#fff" text-anchor="middle">credibility and</text><text x="880" y="375" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="30" fill="#fff" text-anchor="middle">reliability of both</text><text x="880" y="415" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="30" fill="#fff" text-anchor="middle">traditional library</text><text x="880" y="455" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="30" fill="#fff" text-anchor="middle">resources and online</text><text x="880" y="495" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="30" fill="#fff" text-anchor="middle">multimedia resources</text><g filter="url(#s2)"><rect x="700" y="40" width="300" height="64" rx="12" fill="#fff" stroke="#139bd4" stroke-width="3"/></g><text x="850" y="82" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#14293a" text-anchor="middle">Research skills</text><g class="orb"><g transform="translate(880 365)"><circle cx="0" cy="-270" r="22" fill="#fff" filter="url(#s2)"/><text x="0" y="-262" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#2f7a3a" text-anchor="middle">✓</text></g></g>
</svg>
