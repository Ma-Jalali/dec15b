th d="M-14 14l4-14 18-18 10 10-18 18z" fill="#fff"/></g><text x="471" y="542" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#fff" text-anchor="middle">4</text></g><g filter="url(#s2)"><rect x="151" y="466" width="240" height="84" rx="16" fill="#fff"/></g><text x="271" y="496" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#d4583a" text-anchor="middle" letter-spacing="2">RECITE</text><text x="271" y="520" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#14293a" text-anchor="middle">Make notes in</text><text x="271" y="540" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#14293a" text-anchor="middle">your own words</text><g class="fl" filter="url(#s2)"><circle cx="391" cy="262" r="52" fill="#b07d12"/><g transform="translate(391 256)"><path d="M-14 4a14 14 0 1 0 4-12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-14-16v10h10" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g><text x="391" y="296" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#fff" text-anchor="middle">5</text></g><g filter="url(#s2)"><rect x="71" y="220" width="240" height="84" rx="16" fill="#fff"/></g><text x="191" y="250" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#b07d12" text-anchor="middle" letter-spacing="2">REVIEW</text><text x="191" y="274" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#14293a" text-anchor="middle">Use the notes to</text><text x="191" y="294" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#14293a" text-anchor="middle">summarise</text>
