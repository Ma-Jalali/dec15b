<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" fill="none" role="img" aria-labelledby="sq-t">
<title id="sq-t">The SQ3R cycle drawn as a ring of five steps around a central disc labelled “SQ3R – a note-taking method for reading to speak”: 1 Survey (eye) — skim: what is it mainly about? 2 Question (question mark) — write cause and effect questions. 3 Read (open book) — read and look for your answers. 4 Recite (pencil) — make notes in your own words. 5 Review (circular arrow) — use the notes to summarise. Arrows on the ring show the steps go round clockwise.</title>
<style>
.sq-fl { animation: sq-fl 6s ease-in-out infinite; } .sq-d1 { animation-delay: -2s; } .sq-d2 { animation-delay: -4s; } .sq-d3 { animation-delay: -1s; }
@keyframes sq-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.sq-tw { animation: sq-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sq-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.sq-pu { animation: sq-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sq-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.sq-ring { animation: sq-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sq-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.sq-flow { animation: sq-flow 1.8s linear infinite; }
@keyframes sq-flow { to { stroke-dashoffset: -28; } }
.sq-ring { animation: sq-rot 12s linear infinite; transform-box: view-box; transform-origin: 600px 330px; } @keyframes sq-rot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
