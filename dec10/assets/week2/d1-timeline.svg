<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" fill="none" role="img" aria-labelledby="tl-t">
<title id="tl-t">The Research Summary timeline as a winding road with four numbered stops: 1 Day 1 (today) — research one source; prepare your summary (notes!). 2 Day 2, session 1 — share your 2-minute summary in your group. 3 Day 2 homework — your group prepares a 5–7 minute presentation. 4 Days 4–5 (present!) — groups deliver their Research Summary presentation.</title>
<style>
.tl-fl { animation: tl-fl 6s ease-in-out infinite; } .tl-d1 { animation-delay: -2s; } .tl-d2 { animation-delay: -4s; } .tl-d3 { animation-delay: -1s; }
@keyframes tl-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.tl-tw { animation: tl-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes tl-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.tl-pu { animation: tl-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes tl-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.tl-ring { animation: tl-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes tl-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.tl-flow { animation: tl-flow 1.8s linear infinite; }
@keyframes tl-flow { to { stroke-dashoffset: -28; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
