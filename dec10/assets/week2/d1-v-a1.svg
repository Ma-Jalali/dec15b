<rect x="34.5" y="103.5" width="47" height="29" rx="1.5" fill="#f4f8f6"/>
<rect x="34.5" y="103.5" width="47" height="5.5" fill="#13887a"/>
<circle cx="37.5" cy="106.2" r="1" fill="#fff"/><circle cx="40.8" cy="106.2" r="1" fill="#fff" opacity=".7"/>
