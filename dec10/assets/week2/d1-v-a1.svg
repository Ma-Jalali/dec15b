<path d="M61 113h17M61 117h13M61 121h16M61 125h10" stroke="#a9bcc6" stroke-width="1.4" stroke-linecap="round"/>
<path d="M25 136h66l-3.5 4.8H28.5z" fill="#c7d3da"/><path d="M52 136h12l-1 1.6H53z" fill="#9fb0bb"/>
</g>
