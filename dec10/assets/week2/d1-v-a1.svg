<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="My digital day: a phone at 07:00 full of colourful apps with a red badge counting 12, a laptop playing a video and a game controller, under a dotted arc from sunrise to night, and a CO₂ cloud with a question mark">
<title>Warmer: my digital day — count your devices and apps, then guess their carbon cost</title>
<style>
.wa1-fl{animation:wa1-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa1-f2{animation-delay:-2s}.wa1-f3{animation-delay:-4s}
.wa1-tw{animation:wa1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa1-t2{animation-delay:-1s}.wa1-t3{animation-delay:-2s}.wa1-t4{animation-delay:-.5s}
@keyframes wa1-fl{50%{transform:translateY(-4px)}}
@keyframes wa1-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.wa1-arc{stroke-dasharray:2 5;animation:wa1-arc 2s linear infinite}
@keyframes wa1-arc{to{stroke-dashoffset:-14}}
.wa1-dat{stroke-dasharray:1.5 5;animation:wa1-arc 1.2s linear infinite}
.wa1-bd{animation:wa1-bd 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wa1-bd{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.2)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="wa1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f5f0"/><stop offset="1" stop-color="#d2e9e0"/></linearGradient>
<pattern id="wa1-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#2f7d6b" opacity=".16"/></pattern>
<radialGradient id="wa1-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="wa1-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="wa1-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/><feDropShadow dx="0" dy=".8" stdDeviation=".5" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="wa1-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#14293a" flood-opacity=".16"/></filter>
<linearGradient id="wa1-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<path id="wa1-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>

<linearGradient id="wa1-ph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a4458"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="wa1-scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f9a8a"/><stop offset="1" stop-color="#0f6b61"/></linearGradient>
<radialGradient id="wa1-sun" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff1c4"/><stop offset=".6" stop-color="#f2c45e"/><stop offset="1" stop-color="#e3a843"/></radialGradient>
<linearGradient id="wa1-lap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b5a72"/><stop offset="1" stop-color="#1d3547"/></linearGradient>
<linearGradient id="wa1-cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e2e8"/></linearGradient>
<linearGradient id="wa1-pad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a68ad"/><stop offset="1" stop-color="#6a3d7c"/></linearGradient>

</defs>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" fill="url(#wa1-bg)"/>
<clipPath id="wa1-clip"><path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z"/></clipPath>
<g clip-path="url(#wa1-clip)"><rect width="240" height="180" fill="url(#wa1-dots)"/><ellipse cx="116" cy="74" rx="110" ry="70" fill="url(#wa1-glow)"/></g>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/>
<ellipse cx="118" cy="158" rx="80" ry="7" fill="url(#wa1-gs)"/>

<!-- the day: sunrise to night -->
<path class="wa1-arc" d="M50 62Q120-12 190 62" stroke="#2f7d6b" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>
