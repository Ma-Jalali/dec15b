<path d="M170 132v7M166.5 135.5h7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<circle cx="190" cy="133" r="1.8" fill="#e3a843"/><circle cx="194.5" cy="136.5" r="1.8" fill="#e64626"/><circle cx="186" cy="137" r="1.8" fill="#4fc3a8"/>
</g>
<!-- CO2 cloud with a question -->
<path class="wa1-dat" d="M146 80C152 82 156 86 160 90" stroke="#13887a" stroke-width="1.8" stroke-linecap="round"/>
<g class="wa1-fl">
<g filter="url(#wa1-sh2)"><path d="M166 104h34a9 9 0 0 0 1-18 12 12 0 0 0-22-5 9 9 0 0 0-13 7 8 8 0 0 0 0 16z" fill="url(#wa1-cl)" transform="translate(-6 2)"/></g>
<text x="179" y="99" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" fill="#14293a">CO<tspan font-size="6.5" dy="2">2</tspan></text>
<circle cx="205" cy="90" r="6.5" fill="#e3a843" stroke="#fff" stroke-width="1.4"/><text x="205" y="93.2" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="800" fill="#fff">?</text>
</g>
<!-- phone (focal) -->
<g filter="url(#wa1-sh)">
<rect x="96" y="38" width="48" height="108" rx="10" fill="url(#wa1-ph)"/>
<rect x="99.5" y="45" width="41" height="94" rx="6.5" fill="url(#wa1-scr)"/>
</g>
<rect x="114" y="40.5" width="12" height="2.4" rx="1.2" fill="#0b1824"/>
<text x="120" y="63" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#fff" letter-spacing=".3">07:00</text>
<path d="M110 68.5h20" stroke="#fff" stroke-opacity=".45" stroke-width="1.2" stroke-linecap="round"/>
