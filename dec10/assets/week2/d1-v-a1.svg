<g transform="translate(198 66)"><circle r="14" fill="#7a4a8c" opacity=".1"/><path d="M3-9a9.5 9.5 0 1 0 6 15A8 8 0 0 1 3-9z" fill="#4a3a74"/><path d="M-4-4a6 6 0 0 0 0 7" stroke="#fff" stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/></g>
<g transform="translate(212 52)"><use href="#wa1-st" class="wa1-tw wa1-t2" fill="#7a4a8c" transform="scale(.45)"/></g>
<!-- laptop -->
<g class="wa1-fl wa1-f2" filter="url(#wa1-sh)">
