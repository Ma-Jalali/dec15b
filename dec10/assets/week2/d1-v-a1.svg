<rect x="104" y="109" width="32" height="4" rx="2" fill="#fff" fill-opacity=".2"/><rect x="104" y="109" width="23" height="4" rx="2" fill="#e3a843"/><rect x="104" y="109" width="12" height="4" rx="2" fill="#f07a55"/>
<rect x="104" y="122" width="32" height="11" rx="5.5" fill="#fff" fill-opacity=".22"/>
<circle cx="111" cy="127.5" r="2.3" fill="#fff"/><circle cx="120" cy="127.5" r="2.3" fill="#fff" opacity=".8"/><circle cx="129" cy="127.5" r="2.3" fill="#fff" opacity=".6"/>
<path d="M101.5 50c4-3 10-4 16-3" stroke="#fff" stroke-opacity=".22" stroke-width="2" stroke-linecap="round"/>
<g class="wa1-bd"><circle cx="143" cy="41" r="7.5" fill="#e64626" stroke="#fff" stroke-width="1.6"/><text x="143" y="44.2" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="800" fill="#fff">12</text></g>
<g transform="translate(32 38) scale(0.7)"><use href="#wa1-st" class="wa1-tw wa1-t3" fill="#13887a"/></g>
<g transform="translate(212 112) scale(0.75)"><use href="#wa1-st" class="wa1-tw wa1-t4" fill="#e3a843"/></g>
<circle class="wa1-tw" cx="26" cy="124" r="2" fill="#2f6db5"/>

</svg>
