<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Find your partner: a student in a purple hijab holds a word slip saying offset, a student with curly hair holds the meaning slip showing a plane and a tree, and a green tick links the two slips">
<title>Vocabulary: find your partner — match each word slip to its definition</title>
<style>
.wa2-fl{animation:wa2-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa2-f2{animation-delay:-2s}.wa2-f3{animation-delay:-4s}
.wa2-tw{animation:wa2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa2-t2{animation-delay:-1s}.wa2-t3{animation-delay:-2s}.wa2-t4{animation-delay:-.5s}
@keyframes wa2-fl{50%{transform:translateY(-4px)}}
@keyframes wa2-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.wa2-ln{stroke-dasharray:3 4;animation:wa2-ln 1.2s linear infinite}
@keyframes wa2-ln{to{stroke-dashoffset:-14}}
.wa2-pop{animation:wa2-pop 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wa2-pop{0%,60%,100%{transform:scale(1)}70%{transform:scale(1.18)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
