<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Annotated reading: paragraph B with 53.6% highlighted in yellow, a word circled in red and a word underlined in blue, arrows to a Notes margin with !!!, a question mark and handwritten comments, and a yellow highlighter pen">
