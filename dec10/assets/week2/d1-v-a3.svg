<style>
.wa3-fl{animation:wa3-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa3-f2{animation-delay:-2s}.wa3-f3{animation-delay:-4s}
.wa3-tw{animation:wa3-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa3-t2{animation-delay:-1s}.wa3-t3{animation-delay:-2s}.wa3-t4{animation-delay:-.5s}
