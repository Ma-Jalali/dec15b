<g transform="translate(120.0 33.0)"><circle r="15.5" fill="url(#wa4-node)" filter="url(#wa4-sh)"/><circle r="15.5" stroke="#13887a" stroke-width="1.8"/><circle r="11.5" fill="#13887a"/><circle r="11.5" fill="url(#wa4-shine)" opacity=".5"/>
<text y="4.6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="900" fill="#fff">S</text>
<g transform="translate(11.5 -11.5)"><circle r="6" fill="#14293a" stroke="#fff" stroke-width="1.3"/><circle r="2.2" fill="#fff"/><path d="M-4 0c2-3 6-3 8 0-2 3-6 3-8 0z" stroke="#fff" stroke-width="1"/></g></g><g transform="translate(175.2 73.1)"><circle r="15.5" fill="url(#wa4-node)" filter="url(#wa4-sh)"/><circle r="15.5" stroke="#2f6db5" stroke-width="1.8"/><circle r="11.5" fill="#2f6db5"/><circle r="11.5" fill="url(#wa4-shine)" opacity=".5"/>
