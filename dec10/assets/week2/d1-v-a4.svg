<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="The SQ3R cycle: five badges S, Q, R, R, R with small icons for survey, question, read, recite and review, linked by arrows in a circle around a notebook with a Notes column of arrow symbols and a pencil">
<title>Reading for note taking: SQ3R — Survey, Question, Read, Recite, Review</title>
<style>
.wa4-fl{animation:wa4-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa4-f2{animation-delay:-2s}.wa4-f3{animation-delay:-4s}
.wa4-tw{animation:wa4-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa4-t2{animation-delay:-1s}.wa4-t3{animation-delay:-2s}.wa4-t4{animation-delay:-.5s}
@keyframes wa4-fl{50%{transform:translateY(-4px)}}
@keyframes wa4-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.wa4-run{stroke-dasharray:3 4;animation:wa4-run 1.4s linear infinite}
@keyframes wa4-run{to{stroke-dashoffset:-14}}
.wa4-pn{animation:wa4-pn 2.4s ease-in-out infinite}
@keyframes wa4-pn{50%{transform:translateX(3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="wa4-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f5f0"/><stop offset="1" stop-color="#d2e9e0"/></linearGradient>
<pattern id="wa4-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#2f7d6b" opacity=".16"/></pattern>
<radialGradient id="wa4-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="wa4-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="wa4-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/><feDropShadow dx="0" dy=".8" stdDeviation=".5" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="wa4-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#14293a" flood-opacity=".16"/></filter>
<linearGradient id="wa4-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<path id="wa4-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>

<radialGradient id="wa4-node" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f3f0e8"/></radialGradient>
<linearGradient id="wa4-nb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6efe1"/></linearGradient>
<linearGradient id="wa4-cov" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a9a89"/><stop offset="1" stop-color="#0f6f63"/></linearGradient>
<marker id="wa4-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#13887a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>

</defs>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" fill="url(#wa4-bg)"/>
