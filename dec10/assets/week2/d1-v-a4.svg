<g clip-path="url(#wa4-clip)"><rect width="240" height="180" fill="url(#wa4-dots)"/><ellipse cx="116" cy="74" rx="110" ry="70" fill="url(#wa4-glow)"/></g>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/>
<ellipse cx="120" cy="160" rx="74" ry="7" fill="url(#wa4-gs)"/>

<circle cx="120" cy="91" r="58" stroke="#13887a" stroke-opacity=".12" stroke-width="9"/>
<path d="M138.9 36.2A58 58 0 0 1 166.3 56.1" stroke="#13887a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#wa4-ah)"/><path d="M178.0 92.0A58 58 0 0 1 167.5 124.3" stroke="#13887a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#wa4-ah)"/><path d="M137.0 146.5A58 58 0 0 1 103.0 146.5" stroke="#13887a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#wa4-ah)"/><path d="M72.5 124.3A58 58 0 0 1 62.0 92.0" stroke="#13887a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#wa4-ah)"/><path class="wa4-run" d="M73.7 56.1A58 58 0 0 1 101.1 36.2" stroke="#13887a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#wa4-ah)"/>
