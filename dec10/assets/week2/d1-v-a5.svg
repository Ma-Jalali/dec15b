<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="From notes to a spoken summary: a notes card with symbols, an arrow to a student who is speaking, a speech bubble with three numbered parts (introduce, describe, conclude) and a one-minute timer">
<title>Summarise and review: turn your notes into a three-part summary and say it in one minute</title>
<style>
.wa5-fl{animation:wa5-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa5-f2{animation-delay:-2s}.wa5-f3{animation-delay:-4s}
.wa5-tw{animation:wa5-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa5-t2{animation-delay:-1s}.wa5-t3{animation-delay:-2s}.wa5-t4{animation-delay:-.5s}
@keyframes wa5-fl{50%{transform:translateY(-4px)}}
@keyframes wa5-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.wa5-hand{animation:wa5-hand 60s linear infinite;transform-box:view-box;transform-origin:44px 52px}
@keyframes wa5-hand{to{transform:rotate(360deg)}}
.wa5-run{stroke-dasharray:3 4;animation:wa5-run 1.4s linear infinite}
@keyframes wa5-run{to{stroke-dashoffset:-14}}
.wa5-wv{animation:wa5-wv 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes wa5-wv{50%{transform:scaleX(.82)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="wa5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f5f0"/><stop offset="1" stop-color="#d2e9e0"/></linearGradient>
<pattern id="wa5-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#2f7d6b" opacity=".16"/></pattern>
<radialGradient id="wa5-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="wa5-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="wa5-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/><feDropShadow dx="0" dy=".8" stdDeviation=".5" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="wa5-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#14293a" flood-opacity=".16"/></filter>
<linearGradient id="wa5-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<path id="wa5-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>

<linearGradient id="wa5-nb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6efe1"/></linearGradient>
<radialGradient id="wa5-face" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3f1"/></radialGradient>
<marker id="wa5-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#13887a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>

</defs>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" fill="url(#wa5-bg)"/>
<clipPath id="wa5-clip"><path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z"/></clipPath>
<g clip-path="url(#wa5-clip)"><rect width="240" height="180" fill="url(#wa5-dots)"/><ellipse cx="116" cy="74" rx="110" ry="70" fill="url(#wa5-glow)"/></g>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/>
<ellipse cx="118" cy="160" rx="80" ry="7" fill="url(#wa5-gs)"/>

<!-- notes card -->
<g transform="rotate(-8 50 104)">
<rect x="22" y="76" width="58" height="62" rx="4" fill="url(#wa5-nb)" filter="url(#wa5-sh)"/>
<rect x="22" y="76" width="58" height="9" rx="4" fill="#13887a"/><rect x="22" y="81" width="58" height="4" fill="#13887a"/>
<text x="51" y="83" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5.5" font-weight="800" fill="#fff" letter-spacing="1">NOTES</text>
<g font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" font-weight="800"><text x="27" y="97" fill="#e64626">↑</text><text x="27" y="109" fill="#13887a">→</text><text x="27" y="121" fill="#2f6db5">∴</text><text x="27" y="133" fill="#7a4a8c">✓</text></g>
<g stroke="#b7c6cd" stroke-width="2" stroke-linecap="round"><path d="M36 95h30M36 107h24M36 119h34M36 131h20"/></g>
<path d="M60 107h12" stroke="#14293a" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>
</g>
<path class="wa5-run" d="M84 100C92 92 98 92 104 98" stroke="#13887a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#wa5-ah)"/>
<g transform="translate(124 121) scale(1.0 1.0)"><path d="M-23 42C-23 25-15 16 0 16S23 25 23 42z" fill="#e3a843"/><path d="M-23 42C-23 25-15 16 0 16S23 25 23 42z" fill="url(#wa5-shine)" opacity=".35"/><path d="M-12.5-1C-13.5-12-7-15.5 0-15.5S13.5-12 12.5-1L13.5 19C8 22-8 22-13.5 19z" fill="#3a2418"/><rect x="-4.2" y="7" width="8.4" height="11" rx="3" fill="#a06a46"/><path d="M-6 16.5L0 23 6 16.5" stroke="#fff" stroke-opacity=".75" stroke-width="1.4" stroke-linejoin="round"/><circle cx="-10.8" cy="1.5" r="2.5" fill="#a06a46"/><circle cx="10.8" cy="1.5" r="2.5" fill="#a06a46"/><circle r="11" fill="#b9805a"/><path d="M-11.2-2C-10.5-11-4.5-13.8 1-13.8 6.5-13.8 11-11 11.4-3 8-8.5 2-9.5-3.5-8.6-7-8-9.5-6-11.2-2z" fill="#3a2418"/><circle cx="-3.8" cy="1.2" r="1.35" fill="#14293a"/><circle cx="3.8" cy="1.2" r="1.35" fill="#14293a"/><path d="M-5.6-2.6l3-.6M5.6-2.6l-3-.6" stroke="#14293a" stroke-opacity=".55" stroke-width="1" stroke-linecap="round"/><circle cx="-6.6" cy="4.6" r="1.9" fill="#e64626" opacity=".18"/><circle cx="6.6" cy="4.6" r="1.9" fill="#e64626" opacity=".18"/><path d="M-2.8 5.4Q0 9.6 2.8 5.4z" fill="#8e2f1f"/></g>
<!-- spoken summary -->
<g class="wa5-fl">
<g filter="url(#wa5-sh)"><path d="M126 26h80a8 8 0 0 1 8 8v40a8 8 0 0 1-8 8h-60l-8 10-1-10h-11a8 8 0 0 1-8-8V34a8 8 0 0 1 8-8z" fill="#fff"/></g>
<circle cx="131" cy="40" r="5.4" fill="#13887a"/><text x="131" y="42.9" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="900" fill="#fff">1</text><g transform="translate(144 40)"><path d="M-3.4-2.2c1.2-.5 2.4-.5 3.4.3.9-.8 2.2-.8 3.4-.3v4.6c-1.2-.5-2.5-.5-3.4.3-1-.8-2.2-.8-3.4-.3z" fill="#13887a"/></g><path d="M151 40h52" stroke="#13887a" stroke-opacity=".35" stroke-width="3.2" stroke-linecap="round"/><circle cx="131" cy="54" r="5.4" fill="#2f6db5"/><text x="131" y="56.9" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="900" fill="#fff">2</text><g transform="translate(144 54)"><circle cx="-2.6" r="1.6" fill="#2f6db5"/><path d="M-.6 0h3.2M1.6-1.6L3.2 0 1.6 1.6" stroke="#2f6db5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M151 54h44" stroke="#2f6db5" stroke-opacity=".35" stroke-width="3.2" stroke-linecap="round"/><circle cx="131" cy="68" r="5.4" fill="#7a4a8c"/><text x="131" y="70.9" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="900" fill="#fff">3</text><g transform="translate(144 68)"><path d="M0-3.4l1 2.2 2.4.3-1.8 1.6.5 2.4L0 1.9-2.1 3.1l.5-2.4-1.8-1.6 2.4-.3z" fill="#7a4a8c"/></g><path d="M151 68h36" stroke="#7a4a8c" stroke-opacity=".35" stroke-width="3.2" stroke-linecap="round"/>
<g class="wa5-wv"><path d="M200 31c2 2 2 5 0 7M204 29c3 3 3 8 0 11" stroke="#13887a" stroke-opacity=".5" stroke-width="1.2" stroke-linecap="round"/></g>
</g>
<!-- one-minute timer -->
<g filter="url(#wa5-sh)"><circle cx="44" cy="52" r="16" fill="url(#wa5-face)"/></g>
<rect x="40.5" y="31" width="7" height="4" rx="1.5" fill="#14293a"/><path d="M56 38l3-3" stroke="#14293a" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="44" cy="52" r="16" stroke="#14293a" stroke-width="2.2"/>
<path d="M44 52V40.5A11.5 11.5 0 0 1 55.5 52z" fill="#13887a" opacity=".22"/>
<g stroke="#14293a" stroke-opacity=".5" stroke-width="1" stroke-linecap="round"><path d="M44 39v2M57 52h-2M44 65v-2M31 52h2"/></g>
<text x="44" y="61" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" font-weight="800" fill="#14293a">1:00</text>
<path class="wa5-hand" d="M44 52l0-10" stroke="#e64626" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="44" cy="52" r="1.8" fill="#14293a"/>
<g transform="translate(92 34) scale(0.75)"><use href="#wa5-st" class="wa5-tw" fill="#e3a843"/></g>
<g transform="translate(214 118) scale(0.7)"><use href="#wa5-st" class="wa5-tw wa5-t2" fill="#13887a"/></g>
<circle class="wa5-tw wa5-t3" cx="190" cy="124" r="2" fill="#7a4a8c"/>
<circle class="wa5-tw wa5-t4" cx="22" cy="74" r="1.8" fill="#2f6db5"/>

</svg>
