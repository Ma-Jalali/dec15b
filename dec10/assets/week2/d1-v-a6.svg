<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Reading for understanding: an answer sheet for questions 1 to 8 with A to E answer bubbles and gap-fill answers, a notes card used first, a magnifying glass checking paragraph E of the text, and a green tick">
<title>Reading for understanding: answer from your notes first, then check the text</title>
<style>
.wa6-fl{animation:wa6-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa6-f2{animation-delay:-2s}.wa6-f3{animation-delay:-4s}
.wa6-tw{animation:wa6-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa6-t2{animation-delay:-1s}.wa6-t3{animation-delay:-2s}.wa6-t4{animation-delay:-.5s}
@keyframes wa6-fl{50%{transform:translateY(-4px)}}
@keyframes wa6-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.wa6-mg{animation:wa6-mg 5s ease-in-out infinite}
@keyframes wa6-mg{50%{transform:translate(-3px,2px)}}
.wa6-fill{animation:wa6-fill 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wa6-fill{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="wa6-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f5f0"/><stop offset="1" stop-color="#d2e9e0"/></linearGradient>
<pattern id="wa6-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#2f7d6b" opacity=".16"/></pattern>
<radialGradient id="wa6-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="wa6-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="wa6-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/><feDropShadow dx="0" dy=".8" stdDeviation=".5" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="wa6-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#14293a" flood-opacity=".16"/></filter>
<linearGradient id="wa6-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<path id="wa6-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>

<linearGradient id="wa6-pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient>
<linearGradient id="wa6-hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f3a50"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<radialGradient id="wa6-lens" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcefe9"/></radialGradient>
<linearGradient id="wa6-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34597a"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<radialGradient id="wa6-ok" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#3fbf8a"/><stop offset="1" stop-color="#1f8a5c"/></radialGradient>
<clipPath id="wa6-lc"><circle cx="182" cy="110" r="15"/></clipPath>

</defs>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" fill="url(#wa6-bg)"/>
<clipPath id="wa6-clip"><path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z"/></clipPath>
<g clip-path="url(#wa6-clip)"><rect width="240" height="180" fill="url(#wa6-dots)"/><ellipse cx="116" cy="74" rx="110" ry="70" fill="url(#wa6-glow)"/></g>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/>
<ellipse cx="120" cy="158" rx="76" ry="7" fill="url(#wa6-gs)"/>

<!-- notes, used first -->
<g transform="rotate(-9 50 92)">
<rect x="22" y="56" width="56" height="70" rx="4" fill="url(#wa6-pg)" filter="url(#wa6-sh)"/>
<rect x="22" y="56" width="56" height="9" rx="4" fill="#13887a"/><rect x="22" y="61" width="56" height="4" fill="#13887a"/>
<text x="50" y="63" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5.5" font-weight="800" fill="#fff" letter-spacing="1">NOTES</text>
<g stroke="#b7c6cd" stroke-width="2" stroke-linecap="round"><path d="M34 76h30M34 86h24M34 96h32M34 106h20M34 116h26"/></g>
<g font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" font-weight="800"><text x="26" y="78.5" fill="#e64626">↑</text><text x="26" y="88.5" fill="#13887a">→</text><text x="26" y="108.5" fill="#2f6db5">∴</text></g>
</g>
<!-- answer sheet -->
<g filter="url(#wa6-sh)"><rect x="72" y="28" width="94" height="124" rx="5" fill="url(#wa6-pg)"/></g>
<path d="M77 28h84a5 5 0 0 1 5 5v9H72v-9a5 5 0 0 1 5-5z" fill="url(#wa6-hd)"/>
<text x="80" y="38.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" font-weight="800" fill="#fff" letter-spacing=".6">QUESTIONS</text>
<rect x="138" y="31.5" width="24" height="8" rx="4" fill="#e3a843"/><text x="150" y="37.8" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="800" fill="#14293a">1–8</text>
<text x="104" y="55" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="800" fill="#8a9aa5">A</text><text x="114" y="55" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="800" fill="#8a9aa5">B</text><text x="124" y="55" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="800" fill="#8a9aa5">C</text><text x="134" y="55" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="800" fill="#8a9aa5">D</text><text x="144" y="55" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="800" fill="#8a9aa5">E</text>
<text x="86" y="69" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="800" fill="#14293a">1</text><circle cx="104" cy="66" r="4" stroke="#b7c6cd" stroke-width="1.2"/><circle cx="114" cy="66" r="4" stroke="#b7c6cd" stroke-width="1.2"/><circle class="wa6-fill" cx="124" cy="66" r="4.2" fill="#13887a"/><circle cx="134" cy="66" r="4" stroke="#b7c6cd" stroke-width="1.2"/><circle cx="144" cy="66" r="4" stroke="#b7c6cd" stroke-width="1.2"/><text x="86" y="81" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="800" fill="#14293a">2</text><circle cx="104" cy="78" r="4.2" fill="#13887a"/><circle cx="114" cy="78" r="4" stroke="#b7c6cd" stroke-width="1.2"/><circle cx="124" cy="78" r="4" stroke="#b7c6cd" stroke-width="1.2"/><circle cx="134" cy="78" r="4" stroke="#b7c6cd" stroke-width="1.2"/><circle cx="144" cy="78" r="4" stroke="#b7c6cd" stroke-width="1.2"/><text x="86" y="93" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="800" fill="#14293a">3</text><circle cx="104" cy="90" r="4" stroke="#b7c6cd" stroke-width="1.2"/><circle cx="114" cy="90" r="4" stroke="#b7c6cd" stroke-width="1.2"/><circle cx="124" cy="90" r="4" stroke="#b7c6cd" stroke-width="1.2"/><circle cx="134" cy="90" r="4" stroke="#b7c6cd" stroke-width="1.2"/><circle cx="144" cy="90" r="4.2" fill="#13887a"/>
<path d="M80 102h80" stroke="#13887a" stroke-opacity=".3" stroke-width="1" stroke-dasharray="2 2.5"/>
<text x="86" y="116" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="800" fill="#14293a">4</text><path d="M97 113h28" stroke="#c3d0d6" stroke-width="2.4" stroke-linecap="round"/><rect x="128" y="109" width="22" height="8" rx="4" fill="#e3a843" fill-opacity=".2" stroke="#e3a843" stroke-width="1"/><text x="86" y="127" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="800" fill="#14293a">5</text><path d="M97 124h32" stroke="#c3d0d6" stroke-width="2.4" stroke-linecap="round"/><rect x="132" y="120" width="18" height="8" rx="4" fill="#2f6db5" fill-opacity=".2" stroke="#2f6db5" stroke-width="1"/><text x="86" y="138" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="800" fill="#14293a">6</text><path d="M97 135h26" stroke="#c3d0d6" stroke-width="2.4" stroke-linecap="round"/><rect x="126" y="131" width="24" height="8" rx="4" fill="#e64626" fill-opacity=".2" stroke="#e64626" stroke-width="1"/>
<g stroke="#c3d0d6" stroke-width="2.4" stroke-linecap="round"><path d="M80 146h28"/></g>
<!-- magnifier: check the text -->
<g class="wa6-mg">
<path d="M193 122l15 17" stroke="#14293a" stroke-width="7" stroke-linecap="round"/><path d="M196 125.5l9 10" stroke="#e3a843" stroke-width="3" stroke-linecap="round"/>
<circle cx="182" cy="110" r="15" fill="url(#wa6-lens)"/>
<g clip-path="url(#wa6-lc)"><rect x="168" y="97" width="11" height="11" rx="2.5" fill="#13887a"/><text x="173.5" y="105.6" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="700" fill="#fff">E</text>
<path d="M182 100h14M182 106h10M170 114h26M170 120h20" stroke="#9fb3bf" stroke-width="2.2" stroke-linecap="round"/></g>
<circle cx="182" cy="110" r="15" stroke="url(#wa6-rim)" stroke-width="3.6"/>
<path d="M172 102a12 12 0 0 1 8-5" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8"/>
</g>
<g transform="translate(166 30)"><circle r="8.5" fill="url(#wa6-ok)" stroke="#fff" stroke-width="1.8" filter="url(#wa6-sh2)"/><path d="M-4 .2l2.8 2.8 5-5.6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(34 40) scale(0.75)"><use href="#wa6-st" class="wa6-tw" fill="#e3a843"/></g>
<g transform="translate(210 66) scale(0.7)"><use href="#wa6-st" class="wa6-tw wa6-t2" fill="#13887a"/></g>
<circle class="wa6-tw wa6-t3" cx="204" cy="44" r="2" fill="#e64626"/>
<circle class="wa6-tw wa6-t4" cx="30" cy="140" r="1.8" fill="#2f6db5"/>

</svg>
