<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Noticing cause and effect: a magnifying glass over the word causing in a sentence strip, with dotted links down to a cause card showing a data-centre server and an effect card showing a CO₂ cloud, joined by an arrow">
<title>Language focus: notice the cause-and-effect language in a sentence</title>
<style>
.wa7-fl{animation:wa7-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa7-f2{animation-delay:-2s}.wa7-f3{animation-delay:-4s}
.wa7-tw{animation:wa7-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa7-t2{animation-delay:-1s}.wa7-t3{animation-delay:-2s}.wa7-t4{animation-delay:-.5s}
@keyframes wa7-fl{50%{transform:translateY(-4px)}}
@keyframes wa7-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.wa7-run{stroke-dasharray:4 4;animation:wa7-run 1.2s linear infinite}
@keyframes wa7-run{to{stroke-dashoffset:-16}}
.wa7-mg{animation:wa7-mg 5s ease-in-out infinite}
@keyframes wa7-mg{50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="wa7-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f5f0"/><stop offset="1" stop-color="#d2e9e0"/></linearGradient>
<pattern id="wa7-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#2f7d6b" opacity=".16"/></pattern>
<radialGradient id="wa7-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="wa7-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="wa7-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/><feDropShadow dx="0" dy=".8" stdDeviation=".5" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="wa7-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#14293a" flood-opacity=".16"/></filter>
<linearGradient id="wa7-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<path id="wa7-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>

<linearGradient id="wa7-pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient>
<radialGradient id="wa7-lens" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#e3f2ee" stop-opacity=".9"/></radialGradient>
<linearGradient id="wa7-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34597a"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="wa7-c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a9a89"/><stop offset="1" stop-color="#0f6f63"/></linearGradient>
<linearGradient id="wa7-e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f06a4a"/><stop offset="1" stop-color="#c8401f"/></linearGradient>
<linearGradient id="wa7-cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6ecef"/></linearGradient>
<marker id="wa7-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#14293a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>

</defs>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" fill="url(#wa7-bg)"/>
<clipPath id="wa7-clip"><path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z"/></clipPath>
<g clip-path="url(#wa7-clip)"><rect width="240" height="180" fill="url(#wa7-dots)"/><ellipse cx="116" cy="74" rx="110" ry="70" fill="url(#wa7-glow)"/></g>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/>
<ellipse cx="120" cy="160" rx="80" ry="7" fill="url(#wa7-gs)"/>

<!-- sentence strip -->
<g filter="url(#wa7-sh)"><rect x="24" y="44" width="192" height="30" rx="8" fill="url(#wa7-pg)"/></g>
<g stroke="#c3d0d6" stroke-width="3" stroke-linecap="round"><path d="M34 59h18M58 59h28"/><path d="M164 59h16M186 59h20"/></g>
<!-- cause/effect pointers from the word -->
<path d="M104 76C90 88 76 92 66 98" stroke="#13887a" stroke-width="1.4" stroke-dasharray="2 3" stroke-linecap="round"/>
<path d="M140 76C152 88 164 92 174 98" stroke="#e64626" stroke-width="1.4" stroke-dasharray="2 3" stroke-linecap="round"/>
<!-- magnifier over "causing" -->
<g class="wa7-mg">
<path d="M141 40l15-16" stroke="#14293a" stroke-width="6.5" stroke-linecap="round"/><path d="M145.5 35.2l8-8.6" stroke="#e3a843" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="122" cy="59" r="26" fill="url(#wa7-lens)" filter="url(#wa7-sh2)"/>
<rect x="97" y="50" width="50" height="17" rx="8.5" fill="#e64626" fill-opacity=".14"/>
<text x="122" y="62.6" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#c8401f">causing</text>
<path d="M100 69h44" stroke="#e64626" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="122" cy="59" r="26" stroke="url(#wa7-rim)" stroke-width="3.8"/>
<path d="M104 46a22 22 0 0 1 12-8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
</g>
<!-- cause card -->
<g filter="url(#wa7-sh)"><rect x="32" y="98" width="66" height="44" rx="8" fill="#fff"/></g>
<path d="M40 98h50a8 8 0 0 1 8 8v2H32v-2a8 8 0 0 1 8-8z" fill="url(#wa7-c)"/>
<text x="65" y="106" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" font-weight="800" fill="#fff" letter-spacing="1">CAUSE</text>
<g transform="translate(65 125)">
<rect x="-13" y="-11" width="26" height="22" rx="3" fill="#14293a"/>
<rect x="-10" y="-8" width="20" height="4.5" rx="1" fill="#2a4458"/><rect x="-10" y="-2.2" width="20" height="4.5" rx="1" fill="#2a4458"/><rect x="-10" y="3.6" width="20" height="4.5" rx="1" fill="#2a4458"/>
<circle cx="-7" cy="-5.7" r="1" fill="#4fe0b8"/><circle cx="-7" cy=".1" r="1" fill="#4fe0b8"/><circle cx="-7" cy="5.9" r="1" fill="#e3a843"/>
<path d="M-2-5.7h9M-2 .1h9M-2 5.9h9" stroke="#5f7d93" stroke-width="1" stroke-linecap="round"/>
</g>
<!-- arrow -->
<path class="wa7-run" d="M104 120h30" stroke="#14293a" stroke-width="2" stroke-linecap="round" marker-end="url(#wa7-ah)"/>
<!-- effect card -->
<g filter="url(#wa7-sh)"><rect x="142" y="98" width="66" height="44" rx="8" fill="#fff"/></g>
<path d="M150 98h50a8 8 0 0 1 8 8v2h-66v-2a8 8 0 0 1 8-8z" fill="url(#wa7-e)"/>
<text x="175" y="106" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" font-weight="800" fill="#fff" letter-spacing="1">EFFECT</text>
<g transform="translate(175 126)">
<path d="M-15 8h28a7 7 0 0 0 1-14 10 10 0 0 0-18-4 7.5 7.5 0 0 0-11 6 6 6 0 0 0 0 12z" fill="url(#wa7-cl)" stroke="#c9d3da" stroke-width="1"/>
<text x="-1" y="4.5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="800" fill="#14293a">CO<tspan font-size="5.5" dy="1.8">2</tspan></text>
</g>
<g transform="translate(30 32) scale(0.75)"><use href="#wa7-st" class="wa7-tw" fill="#e3a843"/></g>
<g transform="translate(212 30) scale(0.65)"><use href="#wa7-st" class="wa7-tw wa7-t2" fill="#13887a"/></g>
<circle class="wa7-tw wa7-t3" cx="214" cy="88" r="2" fill="#7a4a8c"/>
<circle class="wa7-tw wa7-t4" cx="24" cy="92" r="1.8" fill="#2f6db5"/>

</svg>
