<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Explaining an infographic: a poster about the internet's CO₂ with three numbers — 4B+ users, 3.7% of emissions and No.3 for electricity — linked by arrows, while a student explains it with a speech bubble saying so…">
<title>Language in use: explain the infographic with cause-and-effect language</title>
<style>
.wa9-fl{animation:wa9-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa9-f2{animation-delay:-2s}.wa9-f3{animation-delay:-4s}
.wa9-tw{animation:wa9-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wa9-t2{animation-delay:-1s}.wa9-t3{animation-delay:-2s}.wa9-t4{animation-delay:-.5s}
@keyframes wa9-fl{50%{transform:translateY(-4px)}}
@keyframes wa9-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.wa9-run{stroke-dasharray:3 3.5;animation:wa9-run 1.2s linear infinite}
@keyframes wa9-run{to{stroke-dashoffset:-13}}
.wa9-bub{animation:wa9-bub 4s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 100%}
@keyframes wa9-bub{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
