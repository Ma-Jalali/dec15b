<rect x="-14" y="-6" width="9" height="12" rx="1" fill="#c3d0d6"/><rect x="-4.5" y="-12" width="9" height="18" rx="1" fill="#c3d0d6"/><rect x="5" y="-2" width="9" height="8" rx="1" fill="url(#wa9-pod)"/>
<text x="9.5" y="4.4" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" font-weight="900" fill="#fff">3</text>
<path d="M9.5-11l1.3 2.6 2.9.4-2.1 2 .5 2.9-2.6-1.4-2.6 1.4.5-2.9-2.1-2 2.9-.4z" fill="#e3a843"/>
<text y="21" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="900" fill="#b07d12">No.3</text></g>

