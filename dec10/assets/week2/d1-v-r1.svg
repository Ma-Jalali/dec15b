<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="The Research Summary on one road: 1 Day 1 research one source (marked TODAY), 2 Day 2 share your summary, 3 prepare a group presentation, 4 Day 4–5 present, ending at a finish flag">
<title>What is a Research Summary? The whole task — and where you are today</title>
<style>
.wr1-fl{animation:wr1-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wr1-f2{animation-delay:-2s}.wr1-f3{animation-delay:-4s}
.wr1-tw{animation:wr1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wr1-t2{animation-delay:-1s}.wr1-t3{animation-delay:-2s}.wr1-t4{animation-delay:-.5s}
@keyframes wr1-fl{50%{transform:translateY(-4px)}}
@keyframes wr1-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.wr1-run{stroke-dasharray:2 6;animation:wr1-run 1.4s linear infinite}
@keyframes wr1-run{to{stroke-dashoffset:-16}}
.wr1-bob{animation:wr1-bob 2.4s ease-in-out infinite}
@keyframes wr1-bob{50%{transform:translateY(-3px)}}
.wr1-wv{animation:wr1-wv 3s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes wr1-wv{0%{opacity:0;transform:scale(.8)}30%{opacity:.7}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
