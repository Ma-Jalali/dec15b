<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Why summarise? A long source is squeezed by an arrow into a short summary card with three badges — focused, accurate, in your own words — while a group of three students discusses it">
