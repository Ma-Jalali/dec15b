<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Task details: a search box typing data centres, a fan of seven guiding-question cards with card 4 picked and ticked, and a one-hour clock split into 30 minutes to find a source and 30 minutes to read and prepare">
<title>Task description and details: choose a guiding question and plan your hour of research</title>
<style>
.wr4-fl{animation:wr4-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wr4-f2{animation-delay:-2s}.wr4-f3{animation-delay:-4s}
.wr4-tw{animation:wr4-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wr4-t2{animation-delay:-1s}.wr4-t3{animation-delay:-2s}.wr4-t4{animation-delay:-.5s}
@keyframes wr4-fl{50%{transform:translateY(-4px)}}
@keyframes wr4-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.wr4-cur{animation:wr4-cur 1s steps(2) infinite}
@keyframes wr4-cur{50%{opacity:0}}
.wr4-up{animation:wr4-up 4s ease-in-out infinite}
@keyframes wr4-up{50%{transform:translateY(-3px)}}
.wr4-hand{animation:wr4-hand 8s linear infinite;transform-box:view-box;transform-origin:186px 74px}
@keyframes wr4-hand{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="wr4-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6eef9"/><stop offset="1" stop-color="#e6d7ee"/></linearGradient>
<pattern id="wr4-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#7a4a8c" opacity=".16"/></pattern>
<radialGradient id="wr4-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="wr4-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="wr4-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/><feDropShadow dx="0" dy=".8" stdDeviation=".5" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="wr4-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#14293a" flood-opacity=".16"/></filter>
<linearGradient id="wr4-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<path id="wr4-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>

<linearGradient id="wr4-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6efe1"/></linearGradient>
<linearGradient id="wr4-pick" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a68ad"/><stop offset="1" stop-color="#6a3d7c"/></linearGradient>
<radialGradient id="wr4-face" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3eef6"/></radialGradient>
<radialGradient id="wr4-ok" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#3fbf8a"/><stop offset="1" stop-color="#1f8a5c"/></radialGradient>

</defs>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" fill="url(#wr4-bg)"/>
