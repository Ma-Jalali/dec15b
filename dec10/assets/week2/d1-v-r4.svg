<path d="M91 112h18M91 118h13" stroke="#c3d0d6" stroke-width="1.8" stroke-linecap="round"/></g><g transform="rotate(27 100 178)"><rect x="85" y="88" width="30" height="42" rx="4" fill="url(#wr4-card)" stroke="#e6d7ee" stroke-width="1" filter="url(#wr4-sh2)"/>
<circle cx="100" cy="99" r="6" fill="#2f6db5"/><text x="100" y="102.2" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#fff">7</text>
<path d="M91 112h18M91 118h13" stroke="#c3d0d6" stroke-width="1.8" stroke-linecap="round"/></g>
<g class="wr4-up"><g transform="translate(0 -26)"><rect x="85" y="88" width="30" height="42" rx="4" fill="url(#wr4-pick)" filter="url(#wr4-sh)"/>
<circle cx="100" cy="99" r="6" fill="#fff"/><text x="100" y="102.2" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#7a4a8c">4</text>
<path d="M91 112h18M91 118h13" stroke="#fff" stroke-opacity=".6" stroke-width="1.8" stroke-linecap="round"/>
