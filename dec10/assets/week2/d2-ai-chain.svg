<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" fill="none" role="img" aria-label="A causal chain of dominoes from the UNCTAD report.">
<style>.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}.t3{animation-delay:-.7s}
.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}.bl{animation:bl 1.8s steps(1) infinite}.b2{animation-delay:-.6s}.b3{animation-delay:-1.2s}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wv{animation:wv 2.7s ease-out infinite;opacity:.8;transform-box:fill-box;transform-origin:left center}.w2{animation-delay:.9s}.w3{animation-delay:1.8s}
.ri{animation:ri 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.r2{animation-delay:-2s}.r3{animation-delay:-4s}
.eq{animation:eq 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.e2{animation-delay:-.3s}.e3{animation-delay:-.6s}.e4{animation-delay:-.9s}
.pb{animation:pb 8s linear infinite;transform-box:fill-box;transform-origin:left}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes sw{50%{transform:rotate(6deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
@keyframes ri{0%{opacity:0;transform:translateY(8px)}20%,70%{opacity:.85}100%{opacity:0;transform:translateY(-22px)}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes pb{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/></filter></defs>
<rect width="1000" height="340" rx="24" fill="#f2f5fb"/><g class="fl"><g transform="translate(130 110) scale(1.4)"><g transform="rotate(0)"><rect x="-14" y="-28" width="28" height="56" rx="6" fill="#fff" stroke="#14293a" stroke-width="3" filter="url(#s)"/><path d="M-10 0h20" stroke="#14293a" stroke-width="2"/><circle cx="-5" cy="-20" r="3" fill="#3a58a0"/><circle cx="5" cy="-20" r="3" fill="#3a58a0"/><circle cx="-5" cy="8" r="3" fill="#3a58a0"/></g></g></g><text x="130" y="210" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="900" fill="#3a58a0" text-anchor="middle">CAUSE</text><text x="130" y="240" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">Bigger AI models</text><text x="130" y="262" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">+ more energy needs</text><path class="dr" d="M180.0 110.0L320.0 110.0" stroke="#3a58a0" stroke-width="4" stroke-linecap="round"/><path d="M311.2 114.8L320.0 110.0L311.2 105.2" stroke="#3a58a0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="fl f2"><g transform="translate(377 110) scale(1.4)"><g transform="rotate(8)"><rect x="-14" y="-28" width="28" height="56" rx="6" fill="#fff" stroke="#14293a" stroke-width="3" filter="url(#s)"/><path d="M-10 0h20" stroke="#14293a" stroke-width="2"/><circle cx="-5" cy="-20" r="3" fill="#2f7d6b"/><circle cx="5" cy="-20" r="3" fill="#2f7d6b"/><circle cx="-5" cy="-12" r="3" fill="#2f7d6b"/><circle cx="-5" cy="8" r="3" fill="#2f7d6b"/><circle cx="5" cy="8" r="3" fill="#2f7d6b"/></g></g></g><text x="377" y="210" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="900" fill="#2f7d6b" text-anchor="middle">EFFECT 1</text><text x="377" y="240" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">Energy use outpaces</text><text x="377" y="262" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">efficiency gains</text><path class="dr" d="M427.0 110.0L567.0 110.0" stroke="#2f7d6b" stroke-width="4" stroke-linecap="round"/><path d="M558.2 114.8L567.0 110.0L558.2 105.2" stroke="#2f7d6b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="fl f3"><g transform="translate(624 110) scale(1.4)"><g transform="rotate(16)"><rect x="-14" y="-28" width="28" height="56" rx="6" fill="#fff" stroke="#14293a" stroke-width="3" filter="url(#s)"/><path d="M-10 0h20" stroke="#14293a" stroke-width="2"/><circle cx="-5" cy="-20" r="3" fill="#c4562f"/><circle cx="5" cy="-20" r="3" fill="#c4562f"/><circle cx="-5" cy="-12" r="3" fill="#c4562f"/><circle cx="5" cy="-12" r="3" fill="#c4562f"/><circle cx="-5" cy="8" r="3" fill="#c4562f"/></g></g></g><text x="624" y="210" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="900" fill="#c4562f" text-anchor="middle">EFFECT 2</text><text x="624" y="240" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">Big net growth in</text><text x="624" y="262" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">AI energy use</text><path class="dr" d="M674.0 110.0L814.0 110.0" stroke="#c4562f" stroke-width="4" stroke-linecap="round"/><path d="M805.2 114.8L814.0 110.0L805.2 105.2" stroke="#c4562f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="fl"><g transform="translate(871 110) scale(1.4)"><g transform="rotate(24)"><rect x="-14" y="-28" width="28" height="56" rx="6" fill="#fff" stroke="#14293a" stroke-width="3" filter="url(#s)"/><path d="M-10 0h20" stroke="#14293a" stroke-width="2"/><circle cx="-5" cy="-20" r="3" fill="#8a4f9e"/><circle cx="5" cy="-20" r="3" fill="#8a4f9e"/><circle cx="-5" cy="8" r="3" fill="#8a4f9e"/><circle cx="5" cy="8" r="3" fill="#8a4f9e"/></g></g></g><text x="871" y="210" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="900" fill="#8a4f9e" text-anchor="middle">EFFECT 3</text><text x="871" y="240" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">Measuring the footprint</text><text x="871" y="262" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">becomes more critical</text><text x="500" y="320" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#3b5266" text-anchor="middle">are expected to outpace → is likely to result in → will make</text></svg>
