<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" fill="none" role="img" aria-labelledby="ac-t">
<title id="ac-t">A causal chain from the UNCTAD report drawn as four dominoes, each leaning further as it falls: Cause — bigger AI models + more energy needs; Effect 1 — energy use outpaces efficiency gains; Effect 2 — big net growth in AI energy use; Effect 3 — measuring the footprint becomes more critical. Linking phrases underneath: are expected to outpace → is likely to result in → will make.</title>
<style>
.ac-fl { animation: ac-fl 6s ease-in-out infinite; } .ac-d1 { animation-delay: -2s; } .ac-d2 { animation-delay: -4s; } .ac-d3 { animation-delay: -1s; }
@keyframes ac-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.ac-tw { animation: ac-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ac-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.ac-pu { animation: ac-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ac-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.ac-ring { animation: ac-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ac-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.ac-flow { animation: ac-flow 1.8s linear infinite; }
@keyframes ac-flow { to { stroke-dashoffset: -28; } }
.ac-tip { animation: ac-tip 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; } @keyframes ac-tip { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(3deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
