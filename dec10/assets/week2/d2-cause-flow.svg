3" stroke-width="3" filter="url(#s)"/><text x="0" y="7.56" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#14293a" text-anchor="middle">The environmental footprint is growing</text></g><path class="dr" d="M420.0 124.0L290.0 180.0" stroke="#d4322c" stroke-width="5" stroke-linecap="round"/><path d="M296.2 172.1L290.0 180.0L300.0 180.9" stroke="#d4322c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="dr" d="M540.0 124.0L670.0 180.0" stroke="#d4322c" stroke-width="5" stroke-linecap="round"/><path d="M660.0 180.9L670.0 180.0L663.8 172.1" stroke="#d4322c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="dr" d="M250.0 278.0L380.0 326.0" stroke="#d4322c" stroke-width="5" stroke-linecap="round"/><path d="M370.1 327.5L380.0 326.0L373.4 318.5" stroke="#d4322c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="dr" d="M710.0 278.0L580.0 326.0" stroke="#d4322c" stroke-width="5" stroke-linecap="round"/><path d="M586.6 318.5L580.0 326.0L589.9 327.5" stroke="#d4322c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="fl"><g transform="translate(50 210) scale(0.55)"><path d="M-14 20l-8-20 10-22h24l10 22-8 20z" fill="#8a4f9e" filter="url(#s)"/><path d="M-12-22l12 42 12-42M-22 0h44" stroke="#fff" stroke-width="2" opacity=".55" fill="none"/></g></g><g class="fl f2"><g transform="translate(50 270) scale(0.5)"><path d="M0-24c10 14 18 22 18 32a18 18 0 0 1-36 0c0-10 8-18 18-32z" fill="#2d7a9a" filter="url(#s)"/><path d="M-8 10a9 9 0 0 0 6 8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/></g></g><g class="fl f3"><g transform="translate(860 160) scale(0.5)"><path d="M-40 14c-14 0-20-18-6-26 0-14 18-22 30-12 6-14 30-16 38 0 16-2 26 14 18 26 8 12-4 22-16 20z" fill="#6b7c8c" opacity=".85" filter="url(#s)"/><text x="2" y="10" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">CO₂</text></g></g><g class="fl"><g transform="translate(170 360) scale(0.7)"><path d="M-10 10c-6-18 4-30 10-30s10 12 4 30zM12 14c-6-18 4-30 10-30s10 12 4 30z" fill="none" stroke="#2f9a63" stroke-width="3"/></g></g></svg>
