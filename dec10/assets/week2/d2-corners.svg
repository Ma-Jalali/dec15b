<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none" role="img" aria-labelledby="cn-t">
<title id="cn-t">A classroom seen from above, with the whiteboard at the front, and four labelled corners: A front, B left, C back, D right. Three students stand in the middle with arrows showing them walking to the corners.</title>
<style>
.cn-fl { animation: cn-fl 6s ease-in-out infinite; } .cn-d1 { animation-delay: -2s; } .cn-d2 { animation-delay: -4s; } .cn-d3 { animation-delay: -1s; }
@keyframes cn-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.cn-tw { animation: cn-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes cn-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.cn-pu { animation: cn-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes cn-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.cn-ring { animation: cn-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes cn-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.cn-flow { animation: cn-flow 1.8s linear infinite; }
@keyframes cn-flow { to { stroke-dashoffset: -28; } }
.cn-bk { animation: cn-bk 5s infinite; transform-box: fill-box; transform-origin: center; } @keyframes cn-bk { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
