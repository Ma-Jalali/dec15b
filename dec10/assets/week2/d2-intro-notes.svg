<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" fill="none" role="img" aria-labelledby="in-t">
<title id="in-t">Sample outline notes on the podcast introduction, handwritten on lined paper under the heading “Introduction:”: ↑Tech = changing life/work BUT influencing humanity’s future &amp; planet; ↑Tech = ↑demand for minerals, water &amp; energy = ↑pollution; Dev-ing count’s = ↓benefits BUT ↑environ. impact; New bus. models, policies &amp; strat’s needed; Digitₙ = key ➔ sust. devel.? A pencil rests on the page.</title>
<style>
.in-fl { animation: in-fl 6s ease-in-out infinite; } .in-d1 { animation-delay: -2s; } .in-d2 { animation-delay: -4s; } .in-d3 { animation-delay: -1s; }
@keyframes in-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.in-tw { animation: in-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes in-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.in-pu { animation: in-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes in-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.in-ring { animation: in-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes in-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.in-flow { animation: in-flow 1.8s linear infinite; }
@keyframes in-flow { to { stroke-dashoffset: -28; } }
.in-pen { animation: in-pen 3.2s ease-in-out infinite; } @keyframes in-pen { 0%, 100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(-6px,3px) rotate(-3deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
