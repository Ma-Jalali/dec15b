<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" fill="none" role="img" aria-labelledby="md-t">
<title id="md-t">Mediation: three sources — Griffiths (2020), reading, Day 1; UN Trade &amp; Dev. (2024), podcast, today; UNCTAD (2024), report, today — are linked by compare and contrast words (“similarly · both · also”, “whereas · however · while”) and a green tick, and arrows carry them into a student’s notebook labelled “my notes”.</title>
