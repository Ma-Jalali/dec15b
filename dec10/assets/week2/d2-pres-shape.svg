<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="The shape of a presentation: introduction, body and conclusion, with the stages of each.">
<style>.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}.t3{animation-delay:-.7s}
.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}.bl{animation:bl 1.8s steps(1) infinite}.b2{animation-delay:-.6s}.b3{animation-delay:-1.2s}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wv{animation:wv 2.7s ease-out infinite;opacity:.8;transform-box:fill-box;transform-origin:left center}.w2{animation-delay:.9s}.w3{animation-delay:1.8s}
.ri{animation:ri 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.r2{animation-delay:-2s}.r3{animation-delay:-4s}
.eq{animation:eq 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.e2{animation-delay:-.3s}.e3{animation-delay:-.6s}.e4{animation-delay:-.9s}
.pb{animation:pb 8s linear infinite;transform-box:fill-box;transform-origin:left}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes sw{50%{transform:rotate(6deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
@keyframes ri{0%{opacity:0;transform:translateY(8px)}20%,70%{opacity:.85}100%{opacity:0;transform:translateY(-22px)}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes pb{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/></filter></defs>
<rect width="1000" height="420" rx="24" fill="#fbf3ef"/><rect x="40" y="40" width="280" height="340" rx="18" fill="#fff" stroke="#c4562f" stroke-width="4" filter="url(#s)"/><rect x="40" y="40" width="280" height="54" rx="18" fill="#c4562f"/><rect x="40" y="74" width="280" height="20" fill="#c4562f"/><text x="180" y="75" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">INTRODUCTION</text><circle cx="68" cy="132" r="11" fill="#c4562f" opacity=".2"/><text x="68" y="137" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#c4562f" text-anchor="middle">1</text><text x="88" y="138" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Greet + introduce yourself</text><circle cx="68" cy="184" r="11" fill="#c4562f" opacity=".2"/><text x="68" y="189" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#c4562f" text-anchor="middle">2</text><text x="88" y="190" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Introduce the topic</text><circle cx="68" cy="236" r="11" fill="#c4562f" opacity=".2"/><text x="68" y="241" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#c4562f" text-anchor="middle">3</text><text x="88" y="242" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Why it matters</text><circle cx="68" cy="288" r="11" fill="#c4562f" opacity=".2"/><text x="68" y="293" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#c4562f" text-anchor="middle">4</text><text x="88" y="294" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">The structure</text><circle cx="68" cy="340" r="11" fill="#c4562f" opacity=".2"/><text x="68" y="345" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#c4562f" text-anchor="middle">5</text><text x="88" y="346" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">A question for the audience</text><rect x="360" y="40" width="280" height="340" rx="18" fill="#fff" stroke="#3a58a0" stroke-width="4" filter="url(#s)"/><rect x="360" y="40" width="280" height="54" rx="18" fill="#3a58a0"/><rect x="360" y="74" width="280" height="20" fill="#3a58a0"/><text x="500" y="75" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">BODY</text><circle cx="388" cy="132" r="11" fill="#3a58a0" opacity=".2"/><text x="388" y="137" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#3a58a0" text-anchor="middle">1</text><text x="408" y="138" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Let’s begin with …</text><circle cx="388" cy="184" r="11" fill="#3a58a0" opacity=".2"/><text x="388" y="189" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#3a58a0" text-anchor="middle">2</text><text x="408" y="190" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Now, moving on to …</text><circle cx="388" cy="236" r="11" fill="#3a58a0" opacity=".2"/><text x="388" y="241" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#3a58a0" text-anchor="middle">3</text><text x="408" y="242" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Next, let’s take a look at …</text><circle cx="388" cy="288" r="11" fill="#3a58a0" opacity=".2"/><text x="388" y="293" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#3a58a0" text-anchor="middle">4</text><text x="408" y="294" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">And finally, …</text><circle cx="388" cy="340" r="11" fill="#3a58a0" opacity=".2"/><text x="388" y="345" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#3a58a0" text-anchor="middle"></text><text x="408" y="346" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">To give you a concrete example, …</text><rect x="680" y="40" width="280" height="340" rx="18" fill="#fff" stroke="#2f7d6b" stroke-width="4" filter="url(#s)"/><rect x="680" y="40" width="280" height="54" rx="18" fill="#2f7d6b"/><rect x="680" y="74" width="280" height="20" fill="#2f7d6b"/><text x="820" y="75" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">CONCLUSION</text><circle cx="708" cy="132" r="11" fill="#2f7d6b" opacity=".2"/><text x="708" y="137" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#2f7d6b" text-anchor="middle">1</text><text x="728" y="138" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Signal the end</text><circle cx="708" cy="184" r="11" fill="#2f7d6b" opacity=".2"/><text x="708" y="189" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#2f7d6b" text-anchor="middle">2</text><text x="728" y="190" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Summarise the main points</text><circle cx="708" cy="236" r="11" fill="#2f7d6b" opacity=".2"/><text x="708" y="241" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#2f7d6b" text-anchor="middle">3</text><text x="728" y="242" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Important final message</text><circle cx="708" cy="288" r="11" fill="#2f7d6b" opacity=".2"/><text x="708" y="293" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#2f7d6b" text-anchor="middle">4</text><text x="728" y="294" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Thank the audience</text><circle cx="708" cy="340" r="11" fill="#2f7d6b" opacity=".2"/><text x="708" y="345" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900" fill="#2f7d6b" text-anchor="middle">5</text><text x="728" y="346" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Ask for questions</text><path class="dr" d="M322.0 210.0L356.0 210.0" stroke="#c4562f" stroke-width="5" stroke-linecap="round"/><path d="M347.2 214.8L356.0 210.0L347.2 205.2" stroke="#c4562f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="dr" d="M642.0 210.0L676.0 210.0" stroke="#3a58a0" stroke-width="5" stroke-linecap="round"/><path d="M667.2 214.8L676.0 210.0L667.2 205.2" stroke="#3a58a0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
