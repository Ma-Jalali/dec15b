<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-labelledby="p2-t">
<title id="p2-t">The shape of a presentation in three linked cards. Introduction: 1 greet + introduce yourself, 2 introduce the topic, 3 why it matters, 4 the structure, 5 a question for the audience. Body: 1 Let’s begin with …, 2 Now, moving on to …, 3 Next, let’s take a look at …, 4 And finally, …, and To give you a concrete example, … Conclusion: 1 signal the end, 2 summarise the main points, 3 important final message, 4 thank the audience, 5 ask for questions.</title>
<style>
.p2-fl { animation: p2-fl 6s ease-in-out infinite; } .p2-d1 { animation-delay: -2s; } .p2-d2 { animation-delay: -4s; } .p2-d3 { animation-delay: -1s; }
@keyframes p2-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.p2-tw { animation: p2-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes p2-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.p2-pu { animation: p2-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes p2-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.p2-ring { animation: p2-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes p2-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.p2-flow { animation: p2-flow 1.8s linear infinite; }
@keyframes p2-flow { to { stroke-dashoffset: -28; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
