<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" fill="none" role="img" aria-labelledby="rt-t">
<title id="rt-t">Timeline of the research summary task on a progress track: Day 1 — research alone: find sources and write a 2-minute summary. Day 2 · today (marked “You are here”) — share, then plan: share in your group; plan one group talk. Days 4–5 — present together: groups give an 8–10 minute talk.</title>
<style>
.rt-fl { animation: rt-fl 6s ease-in-out infinite; } .rt-d1 { animation-delay: -2s; } .rt-d2 { animation-delay: -4s; } .rt-d3 { animation-delay: -1s; }
@keyframes rt-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.rt-tw { animation: rt-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes rt-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.rt-pu { animation: rt-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes rt-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.rt-ring { animation: rt-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes rt-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.rt-flow { animation: rt-flow 1.8s linear infinite; }
@keyframes rt-flow { to { stroke-dashoffset: -28; } }
.rt-pb { animation: rt-pb 8s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; } @keyframes rt-pb { 0% { transform: scaleX(.1); } 60%, 100% { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
