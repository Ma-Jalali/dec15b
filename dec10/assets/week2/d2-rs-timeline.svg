<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" fill="none" role="img" aria-label="Timeline of the research summary task: Day 1 research alone, Day 2 (today) share and plan, Days 3 and 4 present together.">
<style>.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}.t3{animation-delay:-.7s}
.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}.bl{animation:bl 1.8s steps(1) infinite}.b2{animation-delay:-.6s}.b3{animation-delay:-1.2s}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wv{animation:wv 2.7s ease-out infinite;opacity:.8;transform-box:fill-box;transform-origin:left center}.w2{animation-delay:.9s}.w3{animation-delay:1.8s}
.ri{animation:ri 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.r2{animation-delay:-2s}.r3{animation-delay:-4s}
.eq{animation:eq 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.e2{animation-delay:-.3s}.e3{animation-delay:-.6s}.e4{animation-delay:-.9s}
.pb{animation:pb 8s linear infinite;transform-box:fill-box;transform-origin:left}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes sw{50%{transform:rotate(6deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
@keyframes ri{0%{opacity:0;transform:translateY(8px)}20%,70%{opacity:.85}100%{opacity:0;transform:translateY(-22px)}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes pb{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/></filter></defs>
<rect width="960" height="300" rx="24" fill="#faf7fc"/><path d="M90 160H870" stroke="#d9c6e2" stroke-width="10" stroke-linecap="round"/><path class="pb" d="M90 160H480" stroke="#8a4f9e" stroke-width="10" stroke-linecap="round"/><g transform="translate(150 160) scale(1)"><circle r="24" fill="#3a58a0" filter="url(#s)"/><text x="0" y="6" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">1</text></g><text x="150" y="70" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900" fill="#3a58a0" text-anchor="middle">Day 1</text><text x="150" y="98" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">Research alone</text><text x="150" y="222" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#3b5266" text-anchor="middle">Find sources and write</text><text x="150" y="244" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#3b5266" text-anchor="middle">a 2-minute summary</text><g class="pu"><g transform="translate(480 160) scale(1)"><circle r="30" fill="#8a4f9e" filter="url(#s)"/><text x="0" y="6" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">2</text></g></g><text x="480" y="70" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900" fill="#8a4f9e" text-anchor="middle">Day 2 · TODAY</text><text x="480" y="98" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">Share, then plan</text><text x="480" y="222" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#3b5266" text-anchor="middle">Share in your group;</text><text x="480" y="244" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#3b5266" text-anchor="middle">plan one group talk</text><g transform="translate(810 160) scale(1)"><circle r="24" fill="#c4562f" filter="url(#s)"/><text x="0" y="6" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">3–4</text></g><text x="810" y="70" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900" fill="#c4562f" text-anchor="middle">Days 3–4</text><text x="810" y="98" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">Present together</text><text x="810" y="222" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#3b5266" text-anchor="middle">Groups give an</text><text x="810" y="244" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#3b5266" text-anchor="middle">8–10 minute talk</text><g class="fl"><g transform="translate(480 40) scale(1)"><rect x="-46" y="-14" width="92" height="26" rx="13" fill="#8a4f9e"/><text x="0" y="4" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">YOU ARE HERE</text></g></g></svg>
