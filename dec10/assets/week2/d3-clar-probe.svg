<text x="320" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#e3a843" letter-spacing="1.6">THE STATEMENT</text>
<text x="318" y="84" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="15" fill="#fff" font-style="italic">“People do not believe that they have a digital</text>
<text x="318" y="104" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="15" fill="#fff" font-style="italic">carbon footprint. They believe that only</text>
<text x="318" y="124" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="15" fill="#fff" font-style="italic">companies do.”</text>
