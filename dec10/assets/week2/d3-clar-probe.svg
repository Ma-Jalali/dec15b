<text x="160" y="222" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#2b776e" letter-spacing="1.4">CLARIFICATION</text>
<text x="160" y="244" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#14293a">Make it CLEAR: what exactly?</text>
<text x="160" y="272" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="15" fill="#2b776e" font-style="italic">“Can you explain who you refer to by</text>
<text x="160" y="292" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="15" fill="#2b776e" font-style="italic">‘people’?”</text>
