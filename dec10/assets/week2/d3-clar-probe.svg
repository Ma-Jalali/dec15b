<g class="rv" style="animation-delay:.25s"><rect x="40" y="186" width="420" height="134" rx="20" fill="#fff" filter="url(#s2)"/><g class="fl"><circle cx="96" cy="250" r="30" stroke="#2b776e" stroke-width="8"/><path d="M118 272l22 22" stroke="#2b776e" stroke-width="10" stroke-linecap="round"/></g><text x="160" y="222" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#2b776e" text-anchor="start" letter-spacing="1.4">CLARIFICATION</text><text x="160" y="244" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#14293a" text-anchor="start" >Make it CLEAR: what exactly?</text>
<foreignObject x="160" y="254" width="290" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:italic 15px/1.35 Georgia,serif;color:#2b776e">“Can you explain who you refer to by ‘people’?”</div></foreignObject></g>
<g class="rv" style="animation-delay:.45s"><rect x="500" y="186" width="420" height="134" rx="20" fill="#fff" filter="url(#s2)"/><g transform="translate(556 236)"><path d="M-26 40h52" stroke="#b0512a" stroke-width="4"/><path d="M-20 40c0-20 8-30 20-30s20 10 20 30" fill="#e3a843" opacity=".5"/><g class="sw"><path d="M0-30v52" stroke="#d4583a" stroke-width="7" stroke-linecap="round"/><path d="M-12 22h24l-12 18z" fill="#d4583a"/><path d="M-14-30h28" stroke="#d4583a" stroke-width="7" stroke-linecap="round"/></g></g><text x="620" y="222" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#d4583a" text-anchor="start" letter-spacing="1.4">PROBING</text><text x="620" y="244" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#14293a" text-anchor="start" >Go DEEPER: why? how? what effect?</text>
<foreignObject x="620" y="254" width="290" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="font:italic 14px/1.3 Georgia,serif;color:#b0512a">“What effect does not believing that an individual has a digital carbon footprint have on the environment?”</div></foreignObject></g>
</svg>
