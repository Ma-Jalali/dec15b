</g>
<text x="620" y="222" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#d4583a" letter-spacing="1.4">PROBING</text>
<text x="620" y="244" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#14293a">Go DEEPER: why? how? what effect?</text>
<text x="620" y="270" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="14" fill="#b0512a" font-style="italic">“What effect does not believing that an</text>
<text x="620" y="288" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="14" fill="#b0512a" font-style="italic">individual has a digital carbon footprint</text>
<text x="620" y="306" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="14" fill="#b0512a" font-style="italic">have on the environment?”</text>
