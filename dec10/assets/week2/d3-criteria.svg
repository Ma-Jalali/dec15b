<svg preserveAspectRatio="none" width="960" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" fill="none" role="img" aria-label="The four criteria of the feedback tool: 1 Content Delivery (problem, causes, effects, evidence, solution, structure and engagement); 2 Fluency and Pronunciation (clear sounds, chunking, pausing, stress, intonation); 3 Language Use (accurate grammar and vocabulary, functional language); 4 Question and Answer (spontaneous, relevant, clear answers).">
<title>The four criteria of the feedback tool: 1 Content Delivery (problem, causes, effects, evidence, solution, structure and engagement); 2 Fluency and Pronunciation (clear sounds, chunking, pausing, stress, intonation); 3 Language Use (accurate grammar and vocabulary, functional language); 4 Question and Answer (spontaneous, relevant, clear answers).</title>
<style>
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; } .fl4 { animation-delay: -2.4s; animation-duration: 6.2s; }
.tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .tw2 { animation-delay: -1.4s; } .tw3 { animation-delay: -.7s; }
.pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.dr { stroke-dasharray: 8 10; animation: dr 1.6s linear infinite; }
.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; }
.wv { animation: wv 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; } .wv2 { animation-delay: .85s; } .wv3 { animation-delay: 1.7s; }
.sw { animation: sw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.sp { animation: sp 12s linear infinite; transform-box: fill-box; transform-origin: center; }
.vb { animation: vb .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.bl { animation: bl 1.6s steps(1) infinite; }
.gr { animation: gr 4s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
@keyframes pu { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } }
@keyframes dr { to { stroke-dashoffset: -36; } }
@keyframes rv { from { opacity: 0; transform: translateY(14px); } }
@keyframes wv { 0% { opacity: 0; transform: scale(.6); } 25% { opacity: .9; } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes sw { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes sp { to { transform: rotate(360deg); } }
@keyframes vb { from { transform: scaleY(.55); } to { transform: scaleY(1.15); } }
@keyframes bl { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes gr { 0%, 100% { transform: scaleX(.35); } 50% { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv, .wv { opacity: 1 !important; } }
</style>
<defs>
  <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/></filter>
  <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
  <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".16"/></pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5f3"/><stop offset="1" stop-color="#f8f4ec"/></linearGradient>
  <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3a52"/><stop offset="1" stop-color="#14293a"/></linearGradient>
</defs>
<rect width="960" height="300" rx="28" fill="#f3f7f6"/>
<g class="rv" style="animation-delay:0.0s"><rect x="36" y="30" width="210" height="240" rx="20" fill="#fff" filter="url(#s2)"/><g class="pu" style="animation-delay:0.0s"><circle cx="141" cy="80" r="30" fill="#2b776e"/><text x="141" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#fff" text-anchor="middle" >1</text></g>
<foreignObject x="48" y="118" width="186" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font:800 17px/1.2 Helvetica Neue,Arial,sans-serif;color:#2b776e;text-align:center">Content Delivery</div></foreignObject>
<circle cx="62" cy="190" r="4" fill="#2b776e"/><text x="74" y="195" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >problem → causes → effects</text>
<circle cx="62" cy="216" r="4" fill="#2b776e"/><text x="74" y="221" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >evidence + solution</text>
<circle cx="62" cy="242" r="4" fill="#2b776e"/><text x="74" y="247" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >structure &amp; engagement</text>
</g>
<g class="rv" style="animation-delay:0.2s"><rect x="261" y="30" width="210" height="240" rx="20" fill="#fff" filter="url(#s2)"/><g class="pu" style="animation-delay:0.5s"><circle cx="366" cy="80" r="30" fill="#b0512a"/><text x="366" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#fff" text-anchor="middle" >2</text></g>
<foreignObject x="273" y="118" width="186" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font:800 17px/1.2 Helvetica Neue,Arial,sans-serif;color:#b0512a;text-align:center">Fluency &amp; Pronunciation</div></foreignObject>
<circle cx="287" cy="190" r="4" fill="#b0512a"/><text x="299" y="195" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >clear sounds</text>
<circle cx="287" cy="216" r="4" fill="#b0512a"/><text x="299" y="221" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >chunking, pausing, stress</text>
<circle cx="287" cy="242" r="4" fill="#b0512a"/><text x="299" y="247" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >intonation (not flat)</text>
</g>
<g class="rv" style="animation-delay:0.4s"><rect x="486" y="30" width="210" height="240" rx="20" fill="#fff" filter="url(#s2)"/><g class="pu" style="animation-delay:1.0s"><circle cx="591" cy="80" r="30" fill="#7a4a8c"/><text x="591" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#fff" text-anchor="middle" >3</text></g>
<foreignObject x="498" y="118" width="186" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font:800 17px/1.2 Helvetica Neue,Arial,sans-serif;color:#7a4a8c;text-align:center">Language Use</div></foreignObject>
<circle cx="512" cy="190" r="4" fill="#7a4a8c"/><text x="524" y="195" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >accurate grammar</text>
<circle cx="512" cy="216" r="4" fill="#7a4a8c"/><text x="524" y="221" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >accurate vocabulary</text>
<circle cx="512" cy="242" r="4" fill="#7a4a8c"/><text x="524" y="247" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >functional language</text>
</g>
<g class="rv" style="animation-delay:0.6000000000000001s"><rect x="711" y="30" width="210" height="240" rx="20" fill="#fff" filter="url(#s2)"/><g class="pu" style="animation-delay:1.5s"><circle cx="816" cy="80" r="30" fill="#3a58a0"/><text x="816" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#fff" text-anchor="middle" >4</text></g>
<foreignObject x="723" y="118" width="186" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="font:800 17px/1.2 Helvetica Neue,Arial,sans-serif;color:#3a58a0;text-align:center">Question &amp; Answer</div></foreignObject>
<circle cx="737" cy="190" r="4" fill="#3a58a0"/><text x="749" y="195" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >spontaneous</text>
<circle cx="737" cy="216" r="4" fill="#3a58a0"/><text x="749" y="221" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >relevant</text>
<circle cx="737" cy="242" r="4" fill="#3a58a0"/><text x="749" y="247" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="13.5" fill="#14293a" text-anchor="start" >clear</text>
</g>
</svg>
