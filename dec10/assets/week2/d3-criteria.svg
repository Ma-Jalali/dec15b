<filter id="cr-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#14293a" flood-opacity=".17"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".14"/></filter>
<filter id="cr-bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="cr-bs" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="2.4"/></filter>
<linearGradient id="cr-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf8f2"/></linearGradient>
<radialGradient id="cr-glo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
