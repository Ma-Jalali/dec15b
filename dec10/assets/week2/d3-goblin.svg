<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" fill="none" role="img" aria-label="A browser showing goblin.tools Magic ToDo: the task is typed in the box, the spiciness is set to two chillies, and the magic wand turns the task into a list of subtasks with estimated times.">
