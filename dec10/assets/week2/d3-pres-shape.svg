<rect x="340" y="36" width="270" height="250" rx="20" fill="url(#p3-paper)" filter="url(#p3-sh)"/><rect x="340.75" y="36.75" width="268.5" height="248.5" rx="19.25" stroke="url(#p3-rim)" stroke-width="1.5"/><rect x="340" y="36" width="270" height="250" rx="20" stroke="#14293a" stroke-opacity=".07"/>
<path d="M340 56a20 20 0 0 1 20-20h230a20 20 0 0 1 20 20v32H340z" fill="url(#p3-g4)"/><path d="M340 56a20 20 0 0 1 20-20h230a20 20 0 0 1 20 20v8H340z" fill="url(#p3-gloss)"/>
<text x="360" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" fill="#fff">2 · Body</text>
<circle cx="586" cy="62" r="11" fill="#fff" fill-opacity=".2"/><circle cx="586" cy="62" r="4" fill="#fff"/>
<circle cx="368" cy="112" r="5.5" fill="url(#p3-g5)"/><text x="382" y="117" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">Main point A</text>
<circle cx="368" cy="148" r="5.5" fill="url(#p3-g5)"/><text x="382" y="153" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">Main point B</text>
<circle cx="368" cy="184" r="5.5" fill="url(#p3-g5)"/><text x="382" y="189" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">Main point C</text>
<circle cx="368" cy="220" r="5.5" fill="url(#p3-g5)"/><text x="382" y="225" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">(2–4 main points)</text>
<rect x="356" y="240" width="238" height="32" rx="10" fill="#f6eae5"/>
<circle cx="368" cy="256" r="5.5" fill="url(#p3-g5)"/><text x="382" y="261" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#b0512a">same order as the outline</text>
</g>
