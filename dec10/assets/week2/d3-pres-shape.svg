<circle cx="886" cy="62" r="11" fill="#fff" fill-opacity=".2"/><circle cx="886" cy="62" r="4" fill="#fff"/>
<circle cx="668" cy="112" r="5.5" fill="url(#p3-g7)"/><text x="682" y="117" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">Signal the end</text>
<circle cx="668" cy="148" r="5.5" fill="url(#p3-g7)"/><text x="682" y="153" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">Repeat the topic</text>
<circle cx="668" cy="184" r="5.5" fill="url(#p3-g7)"/><text x="682" y="189" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">Rephrase A, B, C</text>
<circle cx="668" cy="220" r="5.5" fill="url(#p3-g7)"/><text x="682" y="225" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">Thank the audience</text>
<rect x="656" y="240" width="238" height="32" rx="10" fill="#e7ebf4"/>
<circle cx="668" cy="256" r="5.5" fill="url(#p3-g7)"/><text x="682" y="261" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#3a58a0">Ask for questions</text>
</g>
