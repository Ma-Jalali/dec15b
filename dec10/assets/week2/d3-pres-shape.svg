<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" fill="none" role="img" aria-labelledby="p3-t">
<title id="p3-t">The shape of a presentation in three cards. 1 Introduction: greet the audience, introduce yourself, introduce the topic, why it matters, outline: A → B → C. 2 Body: main point A, main point B, main point C (2–4 main points), in the same order as the outline. 3 Conclusion: signal the end, repeat the topic, rephrase A, B, C, thank the audience, ask for questions. Curved arrows underneath link the outline to the body (“same order”) and the body to the conclusion (“rephrased”).</title>
<style>
.p3-fl { animation: p3-fl 6s ease-in-out infinite; } .p3-d1 { animation-delay: -2s; } .p3-d2 { animation-delay: -4s; } .p3-d3 { animation-delay: -1s; }
@keyframes p3-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.p3-tw { animation: p3-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes p3-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.p3-pu { animation: p3-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes p3-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.p3-ring { animation: p3-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes p3-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.p3-flow { animation: p3-flow 1.8s linear infinite; }
@keyframes p3-flow { to { stroke-dashoffset: -28; } }
.p3-rv { animation: p3-rv .8s cubic-bezier(.2,.7,.2,1) both; } @keyframes p3-rv { from { opacity: 0; transform: translateY(14px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><filter id="p3-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#14293a" flood-opacity=".13"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter><filter id="p3-sh2" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy=".8" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter><filter id="p3-shl" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#14293a" flood-opacity=".15"/><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".1"/></filter><filter id="p3-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter><filter id="p3-bl3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter><linearGradient id="p3-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf8f1"/></linearGradient><linearGradient id="p3-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="p3-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".55" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="p3-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><radialGradient id="p3-ao" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient><pattern id="p3-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#14293a" fill-opacity=".07"/></pattern><linearGradient id="p3-g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f7f6"/><stop offset="0.55" stop-color="#eef4f2"/><stop offset="1" stop-color="#f5f1ea"/></linearGradient><linearGradient id="p3-g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#44877f"/><stop offset="1" stop-color="#276c65"/></linearGradient><radialGradient id="p3-g3" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#6ba09a"/><stop offset=".6" stop-color="#2b776e"/><stop offset="1" stop-color="#286e67"/></radialGradient><linearGradient id="p3-g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b96644"/><stop offset="1" stop-color="#9c4a29"/></linearGradient><radialGradient id="p3-g5" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#c8856a"/><stop offset=".6" stop-color="#b0512a"/><stop offset="1" stop-color="#a04b29"/></radialGradient><linearGradient id="p3-g6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#526cab"/><stop offset="1" stop-color="#345091"/></linearGradient><radialGradient id="p3-g7" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#758abc"/><stop offset=".6" stop-color="#3a58a0"/><stop offset="1" stop-color="#355294"/></radialGradient></defs>
