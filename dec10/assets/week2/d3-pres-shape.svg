<path d="M40 56a20 20 0 0 1 20-20h230a20 20 0 0 1 20 20v32H40z" fill="url(#p3-g2)"/><path d="M40 56a20 20 0 0 1 20-20h230a20 20 0 0 1 20 20v8H40z" fill="url(#p3-gloss)"/>
<text x="60" y="70" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" fill="#fff">1 · Introduction</text>
<circle cx="286" cy="62" r="11" fill="#fff" fill-opacity=".2"/><circle cx="286" cy="62" r="4" fill="#fff"/>
<circle cx="68" cy="112" r="5.5" fill="url(#p3-g3)"/><text x="82" y="117" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">Greet the audience</text>
<circle cx="68" cy="148" r="5.5" fill="url(#p3-g3)"/><text x="82" y="153" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">Introduce yourself</text>
<circle cx="68" cy="184" r="5.5" fill="url(#p3-g3)"/><text x="82" y="189" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">Introduce the topic</text>
<circle cx="68" cy="220" r="5.5" fill="url(#p3-g3)"/><text x="82" y="225" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="15" fill="#14293a">Why it matters</text>
<rect x="56" y="240" width="238" height="32" rx="10" fill="#e6efee"/>
<circle cx="68" cy="256" r="5.5" fill="url(#p3-g3)"/><text x="82" y="261" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#2b776e">Outline: A → B → C</text>
</g>
