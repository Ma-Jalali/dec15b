<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" fill="none" role="img" aria-label="Each group presentation in four steps, about 30 minutes. 1 (8–10 min): the group presents and the audience fills in the feedback tool. 2 (10 min): questions — the audience asks clarification or probing questions. 3 (5–7 min): groups prepare their feedback with at least one action point. 4 (5–7 min): groups give feedback to their presenter and send the form.">
<title>Each group presentation in four steps, about 30 minutes. 1 (8–10 min): the group presents and the audience fills in the feedback tool. 2 (10 min): questions — the audience asks clarification or probing questions. 3 (5–7 min): groups prepare their feedback with at least one action point. 4 (5–7 min): groups give feedback to their presenter and send the form.</title>
<style>
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; } .fl4 { animation-delay: -2.4s; animation-duration: 6.2s; }
.tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .tw2 { animation-delay: -1.4s; } .tw3 { animation-delay: -.7s; }
.pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.dr { stroke-dasharray: 8 10; animation: dr 1.6s linear infinite; }
.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; }
.wv { animation: wv 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; } .wv2 { animation-delay: .85s; } .wv3 { animation-delay: 1.7s; }
.sw { animation: sw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.sp { animation: sp 12s linear infinite; transform-box: fill-box; transform-origin: center; }
.vb { animation: vb .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.bl { animation: bl 1.6s steps(1) infinite; }
.gr { animation: gr 4s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
@keyframes pu { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } }
@keyframes dr { to { stroke-dashoffset: -36; } }
@keyframes rv { from { opacity: 0; transform: translateY(14px); } }
@keyframes wv { 0% { opacity: 0; transform: scale(.6); } 25% { opacity: .9; } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes sw { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes sp { to { transform: rotate(360deg); } }
@keyframes vb { from { transform: scaleY(.55); } to { transform: scaleY(1.15); } }
@keyframes bl { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes gr { 0%, 100% { transform: scaleX(.35); } 50% { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv, .wv { opacity: 1 !important; } }
</style>
<defs>
  <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/></filter>
  <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
  <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".16"/></pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5f3"/><stop offset="1" stop-color="#f8f4ec"/></linearGradient>
  <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3a52"/><stop offset="1" stop-color="#14293a"/></linearGradient>
</defs>
<rect width="960" height="300" rx="28" fill="#f3f7f6"/>
<g class="rv" style="animation-delay:0.0s"><rect x="30" y="40" width="210" height="190" rx="20" fill="#fff" filter="url(#s2)"/><rect x="30" y="40" width="210" height="10" rx="5" fill="#2b776e"/>
<g class="pu" style="animation-delay:0.0s"><circle cx="70" cy="92" r="24" fill="#2b776e"/><text x="70" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#fff" text-anchor="middle" >1</text></g><text x="106" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#2b776e" text-anchor="start" >8–10 min</text><text x="106" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#14293a" text-anchor="start" >Group presents</text>
<foreignObject x="48" y="132" width="176" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="font:500 14px/1.35 Helvetica Neue,Arial,sans-serif;color:#14293a">Audience fills in the feedback tool</div></foreignObject></g>
<path d="M242 135h14" stroke="#14293a" stroke-opacity=".35" stroke-width="3"/>
<g class="rv" style="animation-delay:0.2s"><rect x="260" y="40" width="210" height="190" rx="20" fill="#fff" filter="url(#s2)"/><rect x="260" y="40" width="210" height="10" rx="5" fill="#3a58a0"/>
<g class="pu" style="animation-delay:0.5s"><circle cx="300" cy="92" r="24" fill="#3a58a0"/><text x="300" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#fff" text-anchor="middle" >2</text></g><text x="336" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#3a58a0" text-anchor="start" >10 min</text><text x="336" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#14293a" text-anchor="start" >Questions</text>
<foreignObject x="278" y="132" width="176" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="font:500 14px/1.35 Helvetica Neue,Arial,sans-serif;color:#14293a">Audience asks clarification / probing questions</div></foreignObject></g>
<path d="M472 135h14" stroke="#14293a" stroke-opacity=".35" stroke-width="3"/>
<g class="rv" style="animation-delay:0.4s"><rect x="490" y="40" width="210" height="190" rx="20" fill="#fff" filter="url(#s2)"/><rect x="490" y="40" width="210" height="10" rx="5" fill="#e3a843"/>
<g class="pu" style="animation-delay:1.0s"><circle cx="530" cy="92" r="24" fill="#e3a843"/><text x="530" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#fff" text-anchor="middle" >3</text></g><text x="566" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#e3a843" text-anchor="start" >5–7 min</text><text x="566" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#14293a" text-anchor="start" >Prepare feedback</text>
<foreignObject x="508" y="132" width="176" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="font:500 14px/1.35 Helvetica Neue,Arial,sans-serif;color:#14293a">Groups agree on at least ONE action point</div></foreignObject></g>
<path d="M702 135h14" stroke="#14293a" stroke-opacity=".35" stroke-width="3"/>
<g class="rv" style="animation-delay:0.6000000000000001s"><rect x="720" y="40" width="210" height="190" rx="20" fill="#fff" filter="url(#s2)"/><rect x="720" y="40" width="210" height="10" rx="5" fill="#d4583a"/>
<g class="pu" style="animation-delay:1.5s"><circle cx="760" cy="92" r="24" fill="#d4583a"/><text x="760" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#fff" text-anchor="middle" >4</text></g><text x="796" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#d4583a" text-anchor="start" >5–7 min</text><text x="796" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#14293a" text-anchor="start" >Give feedback</text>
<foreignObject x="738" y="132" width="176" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="font:500 14px/1.35 Helvetica Neue,Arial,sans-serif;color:#14293a">Sit with your presenter. Send the form!</div></foreignObject></g>
<rect x="300" y="250" width="360" height="34" rx="17" fill="#14293a"/><text x="480" y="273" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#fff" text-anchor="middle" >About 30 minutes per group</text>
</svg>
