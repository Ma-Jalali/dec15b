@keyframes ri{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes st{0%{opacity:0;transform:translateY(3px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
