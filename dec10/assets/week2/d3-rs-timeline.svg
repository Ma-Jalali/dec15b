<title>Research summary presentations over four days. Day 1: research alone and write your summary. Day 2: share summaries and prepare as a group. Day 4, today (Thursday): presentations 1 and 2. Day 5 (Friday): presentations 3, 4 and 5. Topic: Exploring Our Digital Carbon Footprint. Rhetorical function: cause and effect.</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
