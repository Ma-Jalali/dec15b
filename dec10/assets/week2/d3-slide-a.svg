<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img" aria-label="Slide A: “Impacts of Digital Devices”. A photo of a young person lying down holding a phone, and two long paragraphs of text (about 170 words) that copy the whole presentation script.">
<title>Slide A: “Impacts of Digital Devices”. A photo of a young person lying down holding a phone, and two long paragraphs of text (about 170 words) that copy the whole presentation script.</title>
<style>
.fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; } .fl4 { animation-delay: -2.4s; animation-duration: 6.2s; }
.tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .tw2 { animation-delay: -1.4s; } .tw3 { animation-delay: -.7s; }
.pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.dr { stroke-dasharray: 8 10; animation: dr 1.6s linear infinite; }
.rv { animation: rv .7s cubic-bezier(.2,.7,.2,1) both; }
.wv { animation: wv 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; } .wv2 { animation-delay: .85s; } .wv3 { animation-delay: 1.7s; }
.sw { animation: sw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.sp { animation: sp 12s linear infinite; transform-box: fill-box; transform-origin: center; }
.vb { animation: vb .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.bl { animation: bl 1.6s steps(1) infinite; }
.gr { animation: gr 4s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
@keyframes pu { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.1); } 30% { transform: scale(1); } }
@keyframes dr { to { stroke-dashoffset: -36; } }
@keyframes rv { from { opacity: 0; transform: translateY(14px); } }
@keyframes wv { 0% { opacity: 0; transform: scale(.6); } 25% { opacity: .9; } 100% { opacity: 0; transform: scale(1.5); } }
@keyframes sw { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes sp { to { transform: rotate(360deg); } }
@keyframes vb { from { transform: scaleY(.55); } to { transform: scaleY(1.15); } }
@keyframes bl { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes gr { 0%, 100% { transform: scaleX(.35); } 50% { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rv, .wv { opacity: 1 !important; } }
</style>
<defs>
  <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/></filter>
  <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
  <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".16"/></pattern>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5f3"/><stop offset="1" stop-color="#f8f4ec"/></linearGradient>
  <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3a52"/><stop offset="1" stop-color="#14293a"/></linearGradient>
</defs>
<rect width="960" height="540" fill="#fff"/>
<rect x="0.5" y="0.5" width="959" height="539" stroke="#14293a" stroke-opacity=".15"/>
<g transform="translate(928 34)"><circle r="24" fill="#14293a"/><text x="0" y="8" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#fff" text-anchor="middle" >A</text></g>
<rect x="0" y="0" width="330" height="540" fill="#f4ead8"/><circle cx="160" cy="250" r="190" fill="#f7e2b8" opacity=".8"/>
<g class="sw" style="animation-duration:5s"><path d="M150 540c0-90 40-150 120-170" stroke="#f1df93" stroke-width="64" stroke-linecap="round"/><path d="M262 370c-20-80-40-160-60-220" stroke="#8a5a33" stroke-width="22" stroke-linecap="round"/><rect x="170" y="70" width="58" height="104" rx="10" fill="#3a2a1a" transform="rotate(-8 199 122)"/><path d="M212 70c20-40 40 10 10 80s40 130 0 200-50 100-20 140" stroke="#4aa3b8" stroke-width="4" fill="none"/></g>
<path d="M40 540c20-50 70-80 120-80s90 40 110 80z" fill="#3a2a1a"/>
<text x="645" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="44" fill="#333" text-anchor="middle" >Impacts of Digital Devices</text>
<path d="M370 150h560" stroke="#333" stroke-opacity=".3"/>
<foreignObject x="360" y="165" width="580" height="360"><div xmlns="http://www.w3.org/1999/xhtml" style="font:18.5px/1.28 Calibri,Helvetica Neue,Arial,sans-serif;color:#333"><p style="margin:0 0 12px">Digital devices has had various benefits for our lives and our world. Recent research from the UN Trade and Development proposed that the efficiency that digital technology brings can minimise energy use, for instance emissions created by car use can be reduced by working from home or shopping online.</p><p style="margin:0">However, with these benefits there have also been various disadvantages. Many people don’t think about the negative impact that their time spent using a phone or other digital device is having on the environment. A 2020 study by Griffiths estimated that every year, global production and use of digital technology emits 1.7 billion tonnes of greenhouse gases, which means that on average, individual internet users are responsible for 414kg of carbon dioxide emissions. These harmful gases can cause irreparable damage to our environment.</p></div></foreignObject>
</svg>
