</g>
<text x="360" y="230" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="36" fill="#3a58a0" text-anchor="middle" >/θ/</text><text x="360" y="256" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="17" fill="#14293a" text-anchor="middle" >voiceless</text>
