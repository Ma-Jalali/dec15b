<text x="600" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#14293a" text-anchor="middle">ba<tspan font-weight="800" fill="#d4583a" text-decoration="underline">th</tspan>e</text><text x="600" y="294" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="13" fill="#5a6b78" text-anchor="middle" >(verb)</text>
