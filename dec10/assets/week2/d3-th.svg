<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" fill="none" role="img" aria-labelledby="th-t" >
<title id="th-t">Two “th” sounds. Bath (noun) has /θ/, a voiceless sound: no sound from the throat, just air. Bathe (verb) has /ð/, a voiced sound: put your fingers on your throat and feel it vibrate.</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s;animation-duration:7s}.f3{animation-delay:-4s}
.tw{animation:tw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.1s}.t3{animation-delay:-2.2s}
.pu{animation:pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ha{animation:ha 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.h2{animation-delay:-1.8s}
.dr{stroke-dasharray:7 9;animation:dr 2.4s linear infinite}
.rv{animation:rv .8s cubic-bezier(.2,.7,.2,1) both}
.wv{animation:wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.wv2{animation-delay:.9s}.wv3{animation-delay:1.8s}
.vb{animation:vb .4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.bl{animation:bl 5s infinite;transform-box:fill-box;transform-origin:center}.b2{animation-delay:-2s}
.sw{animation:sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
.gl{animation:gl 18s linear infinite}
.sh{animation:sh 4.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes pu{0%,100%{transform:scale(1)}18%{transform:scale(1.07)}36%{transform:scale(1)}}
@keyframes ha{0%{opacity:.5;transform:scale(.85)}100%{opacity:0;transform:scale(1.5)}}
@keyframes dr{to{stroke-dashoffset:-32}}
@keyframes rv{from{opacity:0;transform:translateY(12px)}}
@keyframes wv{0%{opacity:0;transform:translateX(-6px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes vb{from{transform:scaleY(.55)}to{transform:scaleY(1.15)}}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sw{0%,100%{transform:skewY(-4deg)}50%{transform:skewY(5deg)}}
@keyframes gl{to{transform:translateX(-92px)}}
@keyframes sh{0%,100%{opacity:0}50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.wv{opacity:.85 !important}.sh{opacity:.3}}
</style>
