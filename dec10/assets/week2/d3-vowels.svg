<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" fill="none" role="img" aria-labelledby="vw-t">
<title id="vw-t">Four vowel sounds on four cards, each with a face showing the mouth shape. /iː/ as in seat, cheap, feel: long, with a smile. /ɪ/ as in sit, chip, fill: short and relaxed. /e/ as in men, beg, bet: short, mouth half open. /æ/ as in man, bag, bat: short, mouth wide open. A length bar on each card shows that /iː/ is the longest.</title>
<style>
.vw-fl { animation: vw-fl 6s ease-in-out infinite; } .vw-d1 { animation-delay: -2s; } .vw-d2 { animation-delay: -4s; } .vw-d3 { animation-delay: -1s; }
@keyframes vw-fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.vw-tw { animation: vw-tw 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes vw-tw { 0%, 100% { opacity: .35; transform: scale(.65); } 50% { opacity: 1; transform: scale(1); } }
.vw-pu { animation: vw-pu 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes vw-pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.vw-ring { animation: vw-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes vw-ring { 0% { opacity: .55; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.35); } }
.vw-flow { animation: vw-flow 1.8s linear infinite; }
@keyframes vw-flow { to { stroke-dashoffset: -28; } }
.vw-rv { animation: vw-rv .8s cubic-bezier(.2,.7,.2,1) both; } @keyframes vw-rv { from { opacity: 0; transform: translateY(14px); } }
.vw-bar { animation: vw-bar 4s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; } @keyframes vw-bar { 0% { transform: scaleX(.05); } 45%, 100% { transform: scaleX(1); } }
.vw-bk { animation: vw-bk 5s infinite; transform-box: fill-box; transform-origin: center; } @keyframes vw-bk { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
