 14 12" stroke="#c4562f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 28l15 18-14 12" stroke="#c4562f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-18" cy="58" r="5" fill="#a8714f"/><circle cx="18" cy="58" r="5" fill="#a8714f"/><rect x="-5" y="10" width="10" height="10" rx="3" fill="#a8714f"/><circle r="16" fill="#a8714f"/><path d="M-16 -4c0-12 8-18 16-18s16 6 16 18c-6-4-10-9-12-12-6 6-12 10-20 12z" fill="#1d1d24"/><g class="bl"><circle cx="-6" cy="-1" r="2" fill="#14293a"/><circle cx="6" cy="-1" r="2" fill="#14293a"/></g><path d="M-5 8h10" stroke="#14293a" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="-11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/><circle cx="11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/></g><rect x="250" y="110" width="180" height="44" rx="22.0" fill="#2f7d6b"/><text x="340.0" y="139.92" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle" letter-spacing="1.2">DO</text><rect x="720" y="110" width="180" height="44" rx="22.0" fill="#c4562f"/><text x="810.0" y="139.92" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="22" fill="#fff" text-anchor="middle" letter-spacing="1.2">DON’T</text><text x="250" y="196.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" fill="#14293a" text-anchor="start">Hands on your head:</text><text x="250" y="219.4" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" fill="#14293a" text-anchor="start">you SHOULD do this</text><text x="720" y="196.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" fill="#14293a" text-anchor="start">Hands on your hips:</text><text x="720" y="219.4" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="18" fill="#14293a" text-anchor="start">you should NOT do this</text><g transform="translate(400 290)" filter="url(#s)"><g class="pu"><circle r="26" fill="#2f7d6b"/><path d="M-11.7 0l7.8 9.1 16.9-18.2" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(870 290)" filter="url(#s)"><g class="pu p2"><circle r="24" fill="#c4562f"/><path d="M-9.6 -9.6l19.2 19.2M9.6 -9.6l-19.2 19.2" stroke="#fff" stroke-width="5.3" stroke-linecap="round"/></g></g><path class="tw" d="M52 60h16m-8-8v16" stroke="#2f7d6b" stroke-width="3" stroke-linecap="round"/><path class="tw t2" d="M422 60h16m-8-8v16" stroke="#e3a843" stroke-width="3" stroke-linecap="round"/><path class="tw" d="M522 60h16m-8-8v16" stroke="#c4562f" stroke-width="3" stroke-linecap="round"/><path class="tw t2" d="M902 60h16m-8-8v16" stroke="#e3a843" stroke-width="3" stroke-linecap="round"/></svg>
