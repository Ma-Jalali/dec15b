680" y="37" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="18" fill="#8a4f9e" text-anchor="start">/  //</text><text x="726" y="37" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#14293a" text-anchor="start">= chunks (short / long pause)</text></g></svg>
