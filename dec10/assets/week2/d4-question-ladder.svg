<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" fill="none" role="img" aria-label="A ladder from yes/no questions to thought-provoking questions"><style>
.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}
.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:-1.2s}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}
.bl{animation:bl 4.2s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wv{animation:wv 2.7s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.9s}.w3{animation-delay:1.8s}
.rv{animation:rv .8s ease-out both}
.pb{animation:pb 7s linear infinite;transform-box:fill-box;transform-origin:left}
.ring{animation:ring .5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.85}100%{opacity:0;transform:scale(1.5)}}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pb{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes ring{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rv,.wv{opacity:1!important}}
</style><defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/></filter></defs><rect width="960" height="460" rx="28" fill="#fbf7ef"/><path d="M120 430V40M250 430V40" stroke="#14293a" stroke-width="10" stroke-linecap="round"/><path d="M120 390h130" stroke="#14293a" stroke-width="8" stroke-linecap="round"/><path d="M120 300h130" stroke="#14293a" stroke-width="8" stroke-linecap="round"/><path d="M120 210h130" stroke="#14293a" stroke-width="8" stroke-linecap="round"/><path d="M120 120h130" stroke="#14293a" stroke-width="8" stroke-linecap="round"/><g class="fl"><g transform="translate(185 236) scale(1.2)"><path d="M-19 30c0-8 6-12 19-12s19 4 19 12v40h-38z" fill="#2f7d6b"/><path d="M-6 18l6 8 6-8" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity=".7"/><path d="M-17 26l-12-24-2-16" stroke="#2f7d6b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 26l12-24 2-16" stroke="#2f7d6b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-31" cy="-14" r="5" fill="#f2c7a5"/><circle cx="31" cy="-14" r="5" fill="#f2c7a5"/><rect x="-5" y="10" width="10" height="10" rx="3" fill="#f2c7a5"/><circle r="16" fill="#f2c7a5"/><path d="M-16 -2c-2-14 8-20 16-20s18 5 16 20c-4-7-10-10-16-10s-12 3-16 10z" fill="#2b2433"/><g class="bl"><circle cx="-6" cy="-1" r="2" fill="#14293a"/><circle cx="6" cy="-1" r="2" fill="#14293a"/></g><path d="M-7 6c2 7 12 7 14 0z" stroke="#14293a" stroke-width="2" stroke-linecap="round" fill="#fff"/><circle cx="-11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/><circle cx="11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/></g></g><g><rect x="300" y="295" width="630" height="112" rx="18" fill="#fff" filter="url(#s)"/><rect x="300" y="295" width="14" height="112" rx="7" fill="#9aa7b2"/><text x="332" y="327" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#9aa7b2" text-anchor="start" letter-spacing="1.3">YES / NO</text><text x="332" y="353" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">Closed: one-word answer. Discussion stops.</text><text x="332" y="383" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="15" fill="#14293a" text-anchor="start" font-style="italic">“Should we bother recycling?”</text></g><g><rect x="300" y="175" width="630" height="112" rx="18" fill="#fff" filter="url(#s)"/><rect x="300" y="175" width="14" height="112" rx="7" fill="#3a58a0"/><text x="332" y="207" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#3a58a0" text-anchor="start" letter-spacing="1.3">WHAT / WHY</text><text x="332" y="233" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">Better: asks for facts or reasons.</text><text x="332" y="263" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="15" fill="#14293a" text-anchor="start" font-style="italic">“Why do data centres use so much energy?”</text></g><g><rect x="300" y="45" width="630" height="112" rx="18" fill="#fff" filter="url(#s)"/><rect x="300" y="45" width="14" height="112" rx="7" fill="#2f7d6b"/><text x="332" y="77" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#2f7d6b" text-anchor="start" letter-spacing="1.3">OPEN · COMPARE · CONNECT · CHALLENGE</text><text x="332" y="103" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">Thought-provoking: many views, real discussion.</text><text x="332" y="133" font-family="Georgia, 'Times New Roman', serif" font-weight="500" font-size="15" fill="#14293a" text-anchor="start" font-style="italic">“To what extent should tech companies, not users, pay for their emissions?”</text></g><g class="fl f2"><path d="M60 330V90" stroke="#e3a843" stroke-width="8" stroke-linecap="round"/><path d="M40 112l20-24 20 24" stroke="#e3a843" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
