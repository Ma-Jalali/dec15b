<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" fill="none" role="img" aria-label="A wooden ladder of questions with a student climbing it. Bottom rung, grey: yes/no questions, closed, one-word answer, discussion stops, for example Should we bother recycling? Middle rung, blue: what/why questions, better, asking for facts or reasons, for example Why do data centres use so much energy? Top rung, green: open, compare, connect, challenge questions, thought-provoking, many views, real discussion, for example To what extent should tech companies, not users, pay for their emissions? A gold arrow points upwards.">
<style>
.ql-fl{animation:ql-fl 5s ease-in-out infinite}
.ql-bl{animation:ql-bl 4.2s infinite;transform-box:fill-box;transform-origin:center}
.ql-tw{animation:ql-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ql-t2{animation-delay:-1.5s}
.ql-up{animation:ql-up 2.4s ease-in-out infinite}
.ql-pu{animation:ql-pu 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ql-dash{stroke-dasharray:5 7;animation:ql-dash 1.4s linear infinite}
@keyframes ql-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ql-bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes ql-tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes ql-up{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ql-pu{0%{opacity:.55;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
@keyframes ql-dash{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="ql-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfaf3"/><stop offset="1" stop-color="#f3ece0"/></linearGradient>
<pattern id="ql-dot" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#14293a" opacity=".08"/></pattern>
<linearGradient id="ql-rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5a2b"/><stop offset=".45" stop-color="#c58a4a"/><stop offset="1" stop-color="#7a4c22"/></linearGradient>
<linearGradient id="ql-rung" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a466"/><stop offset="1" stop-color="#9c6a35"/></linearGradient>
<linearGradient id="ql-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf8f2"/></linearGradient>
<linearGradient id="ql-g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3bec7"/><stop offset="1" stop-color="#8794a0"/></linearGradient>
<linearGradient id="ql-g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a78c0"/><stop offset="1" stop-color="#2f4d92"/></linearGradient>
<linearGradient id="ql-g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa58b"/><stop offset="1" stop-color="#226b59"/></linearGradient>
<linearGradient id="ql-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf6f"/><stop offset="1" stop-color="#d8962a"/></linearGradient>
<linearGradient id="ql-shirt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b9a82"/><stop offset="1" stop-color="#22695a"/></linearGradient>
<radialGradient id="ql-floor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="ql-sh" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#14293a" flood-opacity=".1"/><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="ql-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".22"/></filter>
</defs>
<rect width="960" height="460" rx="28" fill="url(#ql-bg)"/>
<rect width="960" height="460" rx="28" fill="url(#ql-dot)"/>
<ellipse cx="185" cy="438" rx="120" ry="12" fill="url(#ql-floor)"/>

<!-- gold arrow: climb -->
<g class="ql-up"><path d="M62 332V102" stroke="#14293a" stroke-opacity=".12" stroke-width="9" stroke-linecap="round"/><path d="M60 330V100" stroke="#e0a23a" stroke-width="9" stroke-linecap="round"/><path d="M38 120l22-28 22 28" stroke="#e0a23a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M57 300V130" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/></g>
<text x="60" y="362" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#b07d12" text-anchor="middle" letter-spacing="1.5">CLIMB</text>

<!-- wooden ladder with depth -->
<g filter="url(#ql-sh2)">
<rect x="112" y="36" width="16" height="398" rx="7" fill="url(#ql-rail)"/>
<rect x="242" y="36" width="16" height="398" rx="7" fill="url(#ql-rail)"/>
<g fill="url(#ql-rung)"><rect x="124" y="385" width="122" height="11" rx="5"/><rect x="124" y="295" width="122" height="11" rx="5"/><rect x="124" y="205" width="122" height="11" rx="5"/><rect x="124" y="115" width="122" height="11" rx="5"/></g>
</g>
<g stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round"><path d="M117 44V426M247 44V426"/><path d="M130 387h110M130 297h110M130 207h110M130 117h110"/></g>
<g stroke="#6b411b" stroke-opacity=".3" stroke-width="1"><path d="M121 70c2 30-2 60 0 90M121 230c2 30-2 60 0 90M251 120c2 30-2 60 0 90M251 300c2 30-2 60 0 90"/></g>

<!-- student climbing -->
<g class="ql-fl"><g transform="translate(185 236) scale(1.2)">
<path d="M-19 30c0-8 6-12 19-12s19 4 19 12v40h-38z" fill="url(#ql-shirt)"/>
<path d="M-6 18l6 8 6-8" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity=".7"/>
<path d="M-17 26l-12-24-2-16" stroke="#2f7d6b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M17 26l12-24 2-16" stroke="#2f7d6b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M-10 70v14M10 70v8" stroke="#14293a" stroke-width="9" stroke-linecap="round"/>
<circle cx="-31" cy="-14" r="5" fill="#e9b892"/><circle cx="31" cy="-14" r="5" fill="#e9b892"/>
<rect x="-5" y="10" width="10" height="10" rx="3" fill="#e9b892"/>
<circle r="16" fill="#f2c7a5"/><path d="M-16 0a16 16 0 0 0 32 0" fill="#e9b892" opacity=".4"/>
<path d="M-16 -2c-2-14 8-20 16-20s18 5 16 20c-4-7-10-10-16-10s-12 3-16 10z" fill="#2b2433"/>
<g class="ql-bl"><circle cx="-6" cy="-1" r="2" fill="#14293a"/><circle cx="6" cy="-1" r="2" fill="#14293a"/></g>
<path d="M-7 6c2 7 12 7 14 0z" stroke="#14293a" stroke-width="2" stroke-linecap="round" fill="#fff"/>
<circle cx="-11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/><circle cx="11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/>
</g></g>

<!-- connectors from rungs to cards -->
<g stroke-width="2" stroke-linecap="round"><path class="ql-dash" d="M262 390H300" stroke="#9aa7b2"/><path class="ql-dash" d="M262 300H300" stroke="#3a58a0"/><path class="ql-dash" d="M262 210C280 180 280 120 300 100" stroke="#2f7d6b"/></g>

<!-- card 1: yes / no -->
<g filter="url(#ql-sh)"><rect x="300" y="295" width="630" height="112" rx="18" fill="url(#ql-card)"/></g>
<rect x="300.5" y="295.5" width="629" height="111" rx="17.5" stroke="#14293a" stroke-opacity=".07"/>
<path d="M300 313a18 18 0 0 1 18-18h-4v112h4a18 18 0 0 1-18-18z" fill="url(#ql-g0)"/><rect x="300" y="295" width="14" height="112" rx="7" fill="url(#ql-g0)"/>
<g transform="translate(888 328)"><circle r="17" fill="#eef1f4"/><circle r="17" stroke="#9aa7b2" stroke-opacity=".5"/><path d="M-7-7l14 14M7-7l-14 14" stroke="#8794a0" stroke-width="3" stroke-linecap="round"/></g>
<text x="332" y="327" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#8794a0" letter-spacing="1.3">YES / NO</text>
<text x="332" y="353" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a">Closed: one-word answer. Discussion stops.</text>
<rect x="326" y="365" width="236" height="28" rx="14" fill="#f2f4f6"/>
<text x="340" y="383" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#14293a" font-style="italic">“Should we bother recycling?”</text>

<!-- card 2: what / why -->
<g filter="url(#ql-sh)"><rect x="300" y="175" width="630" height="112" rx="18" fill="url(#ql-card)"/></g>
<rect x="300.5" y="175.5" width="629" height="111" rx="17.5" stroke="#3a58a0" stroke-opacity=".12"/>
<rect x="300" y="175" width="14" height="112" rx="7" fill="url(#ql-g1)"/>
<g transform="translate(888 208)"><circle r="17" fill="#eaf0fb"/><circle r="17" stroke="#3a58a0" stroke-opacity=".35"/><circle cx="-2" cy="-2" r="6.5" stroke="#3a58a0" stroke-width="2.6"/><path d="M3 3l6 6" stroke="#3a58a0" stroke-width="3" stroke-linecap="round"/></g>
<text x="332" y="207" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#3a58a0" letter-spacing="1.3">WHAT / WHY</text>
<text x="332" y="233" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a">Better: asks for facts or reasons.</text>
<rect x="326" y="245" width="340" height="28" rx="14" fill="#eef3fc"/>
<text x="340" y="263" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#14293a" font-style="italic">“Why do data centres use so much energy?”</text>

<!-- card 3: open (the goal) -->
<g filter="url(#ql-sh)"><rect x="300" y="45" width="630" height="112" rx="18" fill="url(#ql-card)"/></g>
<rect x="301" y="46" width="628" height="110" rx="17" stroke="#2f7d6b" stroke-opacity=".35" stroke-width="2"/>
<rect x="300" y="45" width="14" height="112" rx="7" fill="url(#ql-g2)"/>
<g transform="translate(888 78)"><circle class="ql-pu" r="17" stroke="#2f7d6b" stroke-width="2"/><circle r="17" fill="url(#ql-g2)"/><path d="M0-9l2.6 5.4 5.9.8-4.3 4.1 1 5.9L0 4.4l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="#fff"/></g>
<text x="332" y="77" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#2f7d6b" letter-spacing="1.3">OPEN · COMPARE · CONNECT · CHALLENGE</text>
<text x="332" y="103" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a">Thought-provoking: many views, real discussion.</text>
<rect x="326" y="115" width="548" height="28" rx="14" fill="#e8f5f1"/>
<text x="340" y="133" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#14293a" font-style="italic">“To what extent should tech companies, not users, pay for their emissions?”</text>

<!-- sparkles -->
<path class="ql-tw" d="M280 30l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#e3a843"/>
<path class="ql-tw ql-t2" d="M940 170l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#2f7d6b"/>
</svg>
