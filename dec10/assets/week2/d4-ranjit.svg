<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img" aria-label="Ranjit before and after feedback"><title>Before: Ranjit reads from paper, looks down, his slide is full of small text and his phone rings while the audience laughs or gets bored. After: he opens with “Today, I’d like to talk about the causes and effects of stress”, tells a personal story, smiles and makes eye contact; his phone is off and the audience leans in.</title><style>
.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
