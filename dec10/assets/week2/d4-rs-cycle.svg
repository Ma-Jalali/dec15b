<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none" role="img" aria-label="Four steps for each group presentation, about 30 minutes"><style>
.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}
.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:-1.2s}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}
.bl{animation:bl 4.2s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wv{animation:wv 2.7s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.9s}.w3{animation-delay:1.8s}
.rv{animation:rv .8s ease-out both}
.pb{animation:pb 7s linear infinite;transform-box:fill-box;transform-origin:left}
.ring{animation:ring .5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.85}100%{opacity:0;transform:scale(1.5)}}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pb{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes ring{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rv,.wv{opacity:1!important}}
</style><defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/></filter></defs><rect width="960" height="440" rx="28" fill="#fbf7ef"/><text x="40" y="52" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="15" fill="#8a4f9e" text-anchor="start" letter-spacing="1.4">ONE GROUP PRESENTATION · ABOUT 30 MINUTES</text><rect x="40" y="66" width="880" height="10" rx="5" fill="#ece3f1"/><rect class="pb" x="40" y="66" width="880" height="10" rx="5" fill="#8a4f9e"/><text x="40" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="13" fill="#14293a" text-anchor="start">Presenting group</text><text x="40" y="292" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="13" fill="#14293a" text-anchor="start">Audience (other groups)</text><g><rect x="40" y="124" width="200" height="132" rx="16" fill="#fff" filter="url(#s)"/><rect x="40" y="124" width="200" height="38" rx="16" fill="#8a4f9e"/><rect x="40" y="146" width="200" height="16" fill="#8a4f9e"/><text x="54" y="149" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="13" fill="#fff" text-anchor="start" letter-spacing="1.2">STEP 1</text><text x="226" y="149" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#fff" text-anchor="end">8–10 min</text><text x="54" y="190.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">The group</text><text x="54" y="209.5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">presents.</text><rect x="40" y="302" width="200" height="104" rx="16" fill="#fff" stroke="#8a4f9e" stroke-width="2" filter="url(#s)"/><text x="54" y="340.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">Listen + fill in</text><text x="54" y="359.5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">the feedback tool.</text><path class="dr" d="M140 258v40" stroke="#8a4f9e" stroke-width="2.4"/></g><path d="M242 190L260 190" stroke="#14293a" stroke-width="3" stroke-linecap="round"/><path d="M251.2 194.8L260 190L251.2 185.2" stroke="#14293a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="264" y="124" width="200" height="132" rx="16" fill="#fff" filter="url(#s)"/><rect x="264" y="124" width="200" height="38" rx="16" fill="#3a58a0"/><rect x="264" y="146" width="200" height="16" fill="#3a58a0"/><text x="278" y="149" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="13" fill="#fff" text-anchor="start" letter-spacing="1.2">STEP 2</text><text x="450" y="149" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#fff" text-anchor="end">10 min</text><text x="278" y="190.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">Reflect, then answer</text><text x="278" y="209.5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">individual questions.</text><rect x="264" y="302" width="200" height="104" rx="16" fill="#fff" stroke="#3a58a0" stroke-width="2" filter="url(#s)"/><text x="278" y="340.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">Write a question.</text><text x="278" y="359.5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">A few students ask.</text><path class="dr" d="M364 258v40" stroke="#3a58a0" stroke-width="2.4"/></g><path d="M466 190L484 190" stroke="#14293a" stroke-width="3" stroke-linecap="round"/><path d="M475.2 194.8L484 190L475.2 185.2" stroke="#14293a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="488" y="124" width="200" height="132" rx="16" fill="#fff" filter="url(#s)"/><rect x="488" y="124" width="200" height="38" rx="16" fill="#2f7d6b"/><rect x="488" y="146" width="200" height="16" fill="#2f7d6b"/><text x="502" y="149" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="13" fill="#fff" text-anchor="start" letter-spacing="1.2">STEP 3</text><text x="674" y="149" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#fff" text-anchor="end">5–7 min</text><text x="502" y="190.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">The teacher gives</text><text x="502" y="209.5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">the group feedback.</text><rect x="488" y="302" width="200" height="104" rx="16" fill="#fff" stroke="#2f7d6b" stroke-width="2" filter="url(#s)"/><text x="502" y="340.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">Agree on feedback +</text><text x="502" y="359.5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">one action point.</text><path class="dr" d="M588 258v40" stroke="#2f7d6b" stroke-width="2.4"/></g><path d="M690 190L708 190" stroke="#14293a" stroke-width="3" stroke-linecap="round"/><path d="M699.2 194.8L708 190L699.2 185.2" stroke="#14293a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="712" y="124" width="200" height="132" rx="16" fill="#fff" filter="url(#s)"/><rect x="712" y="124" width="200" height="38" rx="16" fill="#c4562f"/><rect x="712" y="146" width="200" height="16" fill="#c4562f"/><text x="726" y="149" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="13" fill="#fff" text-anchor="start" letter-spacing="1.2">STEP 4</text><text x="898" y="149" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#fff" text-anchor="end">5–7 min</text><text x="726" y="190.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">Each presenter hears</text><text x="726" y="209.5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">their feedback.</text><rect x="712" y="302" width="200" height="104" rx="16" fill="#fff" stroke="#c4562f" stroke-width="2" filter="url(#s)"/><text x="726" y="340.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">Share feedback + send</text><text x="726" y="359.5" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="15" fill="#14293a" text-anchor="start">the forms by email.</text><path class="dr" d="M812 258v40" stroke="#c4562f" stroke-width="2.4"/></g></svg>
