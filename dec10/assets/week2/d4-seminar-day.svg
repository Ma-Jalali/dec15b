<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" fill="none" role="img" aria-label="The procedure on the day of the Seminar"><style>
.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}
.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:-1.2s}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}
.bl{animation:bl 4.2s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wv{animation:wv 2.7s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.9s}.w3{animation-delay:1.8s}
.rv{animation:rv .8s ease-out both}
.pb{animation:pb 7s linear infinite;transform-box:fill-box;transform-origin:left}
.ring{animation:ring .5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.85}100%{opacity:0;transform:scale(1.5)}}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pb{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes ring{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rv,.wv{opacity:1!important}}
</style><defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/></filter></defs><rect width="960" height="450" rx="28" fill="#fbf7ef"/><text x="40" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="15" fill="#2f7d6b" text-anchor="start" letter-spacing="1.4">THE DAY OF THE SEMINAR · ABOUT 40 MINUTES</text><text x="40" y="104" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#14293a" text-anchor="start">Group 1</text><text x="40" y="314" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#14293a" text-anchor="start">Rest of class</text><g><rect x="140" y="70" width="240" height="170" rx="16" fill="#fff" filter="url(#s)"/><rect x="140" y="70" width="240" height="38" rx="16" fill="#2f7d6b"/><rect x="140" y="92" width="240" height="16" fill="#2f7d6b"/><text x="152" y="95" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#fff" text-anchor="start" letter-spacing="1.1">PRESENTATION</text><text x="368" y="95" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#fff" text-anchor="end">10–12 min</text><text x="152" y="134" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">Outline: reactions + focus (2–3)</text><text x="152" y="154" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">Summary of research (8–10)</text><text x="152" y="174" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">Two thought-provoking questions</text><rect x="140" y="276" width="240" height="110" rx="16" fill="#fff" stroke="#2f7d6b" stroke-width="2" filter="url(#s)"/><text x="152" y="312" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">Sit in seminar groups</text><text x="152" y="332" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">and listen.</text></g><g><rect x="392" y="70" width="190" height="170" rx="16" fill="#fff" filter="url(#s)"/><rect x="392" y="70" width="190" height="38" rx="16" fill="#3a58a0"/><rect x="392" y="92" width="190" height="16" fill="#3a58a0"/><text x="404" y="95" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#fff" text-anchor="start" letter-spacing="1.1">DISCUSSION</text><text x="570" y="95" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#fff" text-anchor="end">10 min</text><text x="404" y="134" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">Listen and take notes.</text><text x="404" y="154" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">Don’t join in!</text><rect x="392" y="276" width="190" height="110" rx="16" fill="#fff" stroke="#3a58a0" stroke-width="2" filter="url(#s)"/><text x="404" y="312" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">Discuss the two</text><text x="404" y="332" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">questions in groups.</text></g><g><rect x="594" y="70" width="150" height="170" rx="16" fill="#fff" filter="url(#s)"/><rect x="594" y="70" width="150" height="38" rx="16" fill="#8a4f9e"/><rect x="594" y="92" width="150" height="16" fill="#8a4f9e"/><text x="606" y="95" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#fff" text-anchor="start" letter-spacing="1.1">SUMMARY</text><text x="732" y="95" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#fff" text-anchor="end">1–2</text><text x="606" y="134" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#14293a" text-anchor="start">Summarise each</text><text x="606" y="154" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#14293a" text-anchor="start">group’s discussion.</text><rect x="594" y="276" width="150" height="110" rx="16" fill="#fff" stroke="#8a4f9e" stroke-width="2" filter="url(#s)"/><text x="606" y="312" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#14293a" text-anchor="start">Listen to the</text><text x="606" y="332" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#14293a" text-anchor="start">summary.</text></g><g><rect x="756" y="70" width="176" height="170" rx="16" fill="#fff" filter="url(#s)"/><rect x="756" y="70" width="176" height="38" rx="16" fill="#c4562f"/><rect x="756" y="92" width="176" height="16" fill="#c4562f"/><text x="768" y="95" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#fff" text-anchor="start" letter-spacing="1.1">FEEDBACK</text><text x="920" y="95" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#fff" text-anchor="end">after</text><text x="768" y="134" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">Teacher feedback:</text><text x="768" y="154" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">take notes, ask.</text><rect x="756" y="276" width="176" height="110" rx="16" fill="#fff" stroke="#c4562f" stroke-width="2" filter="url(#s)"/><text x="768" y="312" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">Prepare peer feedback</text><text x="768" y="332" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#14293a" text-anchor="start">(video/audio/text).</text></g><g transform="translate(540 214)"><circle r="16" fill="#e3eaf8"/><path d="M-6 6c-4-14 4-20 10-18 8 2 8 10 2 14-4 2-4 6-2 8" stroke="#3a58a0" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(570 214)"><circle r="14" fill="#c4562f"/><path d="M-6-6l12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><rect x="40" y="406" width="880" height="10" rx="5" fill="#d7ebe4"/><rect class="pb" x="40" y="406" width="880" height="10" rx="5" fill="#2f7d6b"/></svg>
