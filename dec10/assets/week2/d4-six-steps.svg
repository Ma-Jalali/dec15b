family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10" fill="#4b5d6b" text-anchor="middle">reliable sources · records</text><circle cx="380" cy="280" r="22" fill="#2f7d6b" filter="url(#s)"/><text x="380" y="287" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="19" fill="#fff" text-anchor="middle">3</text></g><g><rect x="464" y="122" width="140" height="64" rx="14" fill="#fff" filter="url(#s)"/><text x="534" y="148" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#14293a" text-anchor="middle">Outline + draft</text><text x="534" y="169" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10" fill="#4b5d6b" text-anchor="middle">structure · first draft</text><circle cx="528" cy="222" r="22" fill="#4c8a3e" filter="url(#s)"/><text x="528" y="229" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="19" fill="#fff" text-anchor="middle">4</text></g><g><rect x="612" y="66" width="140" height="64" rx="14" fill="#fff" filter="url(#s)"/><text x="682" y="92" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#14293a" text-anchor="middle">Revise + improve</text><text x="682" y="113" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10" fill="#4b5d6b" text-anchor="middle">clarity · peer feedback</text><circle cx="676" cy="166" r="22" fill="#4c8a3e" filter="url(#s)"/><text x="676" y="173" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="19" fill="#fff" text-anchor="middle">5</text></g><g><rect x="760" y="12" width="140" height="64" rx="14" fill="#fff" filter="url(#s)"/><text x="830" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#14293a" text-anchor="middle">Reflect + evaluate</text><text x="830" y="59" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10" fill="#4b5d6b" text-anchor="middle">compare · mistake log</text><circle cx="824" cy="112" r="22" fill="#4c8a3e" filter="url(#s)"/><text x="824" y="119" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="19" fill="#fff" text-anchor="middle">6</text></g><path d="M920 120V60" stroke="#14293a" stroke-width="4" stroke-linecap="round"/><g class="sw"><path d="M920 62l30 11-30 11z" fill="#e3a843"/></g><rect x="60" y="30" width="260" height="32" rx="16.0" fill="#2f7d6b"/><text x="190.0" y="50.68" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="1.2">STEPS 1–3 · HOMEWORK</text><rect x="360" y="30" width="210" height="32" rx="16.0" fill="#4c8a3e"/><text x="465.0" y="50.68" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="13" fill="#fff" text-anchor="middle" letter-spacing="1.2">STEPS 4–6 · TODAY</text><path class="dr" d="M880 120C940 260 700 440 140 430" stroke="#8a4f9e" stroke-width="3"/><text x="520" y="446" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#8a4f9e" text-anchor="middle">→ Step 6 feeds your next task</text></svg>
