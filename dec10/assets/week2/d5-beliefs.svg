nchor="middle">TERRA AUSTRALIS</text></g><g class="fl f3"><circle cx="441" cy="226" r="46" fill="#7fb36a"/><circle cx="441" cy="226" r="46" fill="none" stroke="#3f7a3a" stroke-width="4"/><path d="M441 180a46 46 0 0 1 0 92" fill="#5aa0d6"/><circle cx="441" cy="226" r="26" fill="#14293a"/><text x="441" y="232" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">?</text></g><g class="fl"><g filter="url(#s)"><rect x="526" y="70" width="100" height="100" rx="8" fill="#e8f3fb"/></g><path d="M556 84c10 10 12 30 22 50s4 24-4 26c-10-12-20-40-26-60s0-18 8-16z" fill="#c9b07a"/><path d="M600 84v80" stroke="#c9b07a" stroke-width="16"/><text x="576" y="162" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="800" fill="#d4583a" text-anchor="middle">ISLAND?</text></g><g transform="translate(702 190) scale(1)"><g class="fl f2">
