<circle class="wv" cx="852" cy="92" r="8" fill="#e5eaef"/><circle class="wv w2" cx="862" cy="78" r="10" fill="#e5eaef"/></g><text x="117" y="330" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#14293a" text-anchor="middle">A flat Earth</text><text x="288" y="330" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#14293a" text-anchor="middle">Terra Australis</text><text x="441" y="330" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#14293a" text-anchor="middle">A hollow Earth</text><text x="576" y="330" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#14293a" text-anchor="middle">California island</text><text x="702" y="330" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#14293a" text-anchor="middle">No hand washing</text><text x="819" y="330" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#14293a" text-anchor="middle">Melting on trains</text>
</svg>
