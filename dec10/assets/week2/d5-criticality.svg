<svg preserveAspectRatio="none" width="640" height="460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" fill="none" role="img" aria-label="Criticality: engagement with sources. Four tiles: identifying positions and perspectives in sources; selecting relevant ideas or information; evaluating ideas from sources and connecting them to your own voice; showing flexibility.">
<title>Criticality: engagement with sources. Four tiles: identifying positions and perspectives in sources; selecting relevant ideas or information; evaluating ideas from sources and connecting them to your own voice; showing flexibility.</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
.tw{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.1s}.t3{animation-delay:-2.2s}
