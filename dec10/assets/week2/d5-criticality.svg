" y="396" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">and connecting them to your own voice</text><g class="fl " filter="url(#s)"><rect x="340" y="270" width="260" height="150" rx="14" fill="#1f8cc4"/></g><path class="sp" d="M464 292a18 18 0 1 1-16 10" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M444 296l4 8 8-4" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/><text x="470" y="374" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Showing</text><text x="470" y="396" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">flexibility</text>
