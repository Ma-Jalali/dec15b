<text x="425" y="256" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#14293a" text-anchor="middle">“Well…”</text>
<g class="fl ">
<rect x="515" y="20" width="150" height="260" rx="16" fill="url(#in4-pap)" stroke="#14293a" stroke-opacity=".07" stroke-width="1" filter="url(#in4-sh)"/><path d="M531 21.6H649" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".95"/>
<path d="M531 20h118" stroke="#3a58a0" stroke-width="4" stroke-linecap="round" opacity=".6"/>
</g>
<text x="590" y="56" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#3a58a0" text-anchor="middle">Big range</text>
<rect x="531" y="96" width="118" height="110" rx="10" fill="#f1f3f8"/>
<g transform="translate(535 80)"><path d="M0 40h110M0 65h110M0 90h110" stroke="#3a58a0" stroke-opacity=".1"/><path d="M0 120h110" stroke="#e3dcd2" stroke-width="2"/><path d="M20 80c10-60 25-60 35 0s20 10 35-40" stroke="#3a58a0" stroke-width="6" stroke-linecap="round" opacity=".2"/><path class="wr" style="animation-delay:-2.4s" d="M20 80c10-60 25-60 35 0s20 10 35-40" stroke="#3a58a0" stroke-width="6" stroke-linecap="round"/><circle cx="90" cy="40" r="5" fill="#3a58a0"/><circle cx="90" cy="40" r="9" stroke="#3a58a0" stroke-opacity=".35" stroke-width="2" class="pu"/></g>
<text x="590" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11" fill="#14293a" text-anchor="middle">strong feeling</text>
