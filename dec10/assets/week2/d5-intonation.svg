<g transform="translate(40 80)"><path d="M0 40h110M0 65h110M0 90h110" stroke="#2b776e" stroke-opacity=".1"/><path d="M0 120h110" stroke="#e3dcd2" stroke-width="2"/><path d="M20 40c30 0 50 10 70 50" stroke="#2b776e" stroke-width="6" stroke-linecap="round" opacity=".2"/><path class="wr" style="animation-delay:-0.0s" d="M20 40c30 0 50 10 70 50" stroke="#2b776e" stroke-width="6" stroke-linecap="round"/><circle cx="90" cy="90" r="5" fill="#2b776e"/><circle cx="90" cy="90" r="9" stroke="#2b776e" stroke-opacity=".35" stroke-width="2" class="pu"/></g>
<text x="95" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11" fill="#14293a" text-anchor="middle">sure · finished</text>
