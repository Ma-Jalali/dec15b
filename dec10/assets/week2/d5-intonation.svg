<rect x="185" y="20" width="150" height="260" rx="16" fill="url(#in4-pap)" stroke="#14293a" stroke-opacity=".07" stroke-width="1" filter="url(#in4-sh)"/><path d="M201 21.6H319" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".95"/>
<path d="M201 20h118" stroke="#d4583a" stroke-width="4" stroke-linecap="round" opacity=".6"/>
</g>
<text x="260" y="56" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#d4583a" text-anchor="middle">Rising ↗</text>
