<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" fill="none" role="img" aria-label="Four voice lines: falling (sure, finished), rising (question, surprise), fall-rise (not sure, polite disagreement) and a wide line for strong feeling">
<title>Four voice lines: falling (sure, finished), rising (question, surprise), fall-rise (not sure, polite disagreement) and a wide line for strong feeling</title>
<style>.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}.t3{animation-delay:-.7s}
.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}.bl{animation:bl 4s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}.wv{animation:wv 2.6s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.85s}.w3{animation-delay:1.7s}
.bar{animation:bar 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.b2{animation-delay:-.4s}.b3{animation-delay:-.8s}.b4{animation-delay:-1.1s}
.pb{animation:pb 6s ease-in-out infinite;transform-box:fill-box;transform-origin:left}.wr{stroke-dasharray:240;animation:wr 5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes sw{50%{transform:rotate(5deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}@keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes pb{0%{transform:scaleX(.08)}60%,100%{transform:scaleX(1)}}@keyframes wr{0%{stroke-dashoffset:240}50%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.wv{opacity:.6}}</style>
<defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/></filter>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect width="680" height="300" rx="22" fill="#fbe3d6"/><g class="fl " filter="url(#s)"><rect x="20" y="20" width="150" height="260" rx="16" fill="#fff"/></g><g transform="translate(40 80)"><path d="M0 120h110" stroke="#eee" stroke-width="2"/><path d="M20 40c30 0 50 10 70 50" stroke="#2b776e" stroke-width="6" stroke-linecap="round" opacity=".22"/><path class="wr" d="M20 40c30 0 50 10 70 50" stroke="#2b776e" stroke-width="6" stroke-linecap="round" style="animation-delay:-0.0s"/></g><text x="95" y="56" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#2b776e" text-anchor="middle">Falling ↘</text><text x="95" y="220" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#14293a" text-anchor="middle">sure · finished</text><text x="95" y="256" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#14293a" text-anchor="middle">“Really.”</text><g class="fl f2" filter="url(#s)"><rect x="185" y="20" width="150" height="260" rx="16" fill="#fff"/></g><g transform="translate(205 80)"><path d="M0 120h110" stroke="#eee" stroke-width="2"/><path d="M20 90c30 0 50-10 70-50" stroke="#d4583a" stroke-width="6" stroke-linecap="round" opacity=".22"/><path class="wr" d="M20 90c30 0 50-10 70-50" stroke="#d4583a" stroke-width="6" stroke-linecap="round" style="animation-delay:-0.8s"/></g><text x="260" y="56" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#d4583a" text-anchor="middle">Rising ↗</text><text x="260" y="220" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#14293a" text-anchor="middle">question · surprise</text><text x="260" y="256" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#14293a" text-anchor="middle">“Really?”</text><g class="fl f3" filter="url(#s)"><rect x="350" y="20" width="150" height="260" rx="16" fill="#fff"/></g><g transform="translate(370 80)"><path d="M0 120h110" stroke="#eee" stroke-width="2"/><path d="M20 40c20 0 30 50 45 50s20-20 25-40" stroke="#7a4a8c" stroke-width="6" stroke-linecap="round" opacity=".22"/><path class="wr" d="M20 40c20 0 30 50 45 50s20-20 25-40" stroke="#7a4a8c" stroke-width="6" stroke-linecap="round" style="animation-delay:-1.6s"/></g><text x="425" y="56" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#7a4a8c" text-anchor="middle">Fall-rise ↘↗</text><text x="425" y="220" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#14293a" text-anchor="middle">not sure · polite disagreement</text><text x="425" y="256" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#14293a" text-anchor="middle">“Well…”</text><g class="fl " filter="url(#s)"><rect x="515" y="20" width="150" height="260" rx="16" fill="#fff"/></g><g transform="translate(535 80)"><path d="M0 120h110" stroke="#eee" stroke-width="2"/><path d="M20 80c10-60 25-60 35 0s20 10 35-40" stroke="#3a58a0" stroke-width="6" stroke-linecap="round" opacity=".22"/><path class="wr" d="M20 80c10-60 25-60 35 0s20 10 35-40" stroke="#3a58a0" stroke-width="6" stroke-linecap="round" style="animation-delay:-2.4000000000000004s"/></g><text x="590" y="56" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#3a58a0" text-anchor="middle">Big range</text><text x="590" y="220" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#14293a" text-anchor="middle">strong feeling</text><text x="590" y="256" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#14293a" text-anchor="middle">“Really!”</text>
</svg>
