<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" fill="none" role="img" aria-label="Four voice lines: falling (sure, finished: “Really.”), rising (question, surprise: “Really?”), fall-rise (not sure, polite disagreement: “Well…”) and a big range for strong feeling (“Really!”)">
<title>Four voice lines: falling (sure, finished: “Really.”), rising (question, surprise: “Really?”), fall-rise (not sure, polite disagreement: “Well…”) and a big range for strong feeling (“Really!”)</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
.tw{animation:tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.1s}.t3{animation-delay:-2.2s}
.pu{animation:pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:-1s}.p3{animation-delay:-2s}
.ha{animation:ha 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.h2{animation-delay:-1.5s}
.dr{stroke-dasharray:7 9;animation:dr 2.2s linear infinite}
.bl{animation:bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.b2{animation-delay:-1.7s}.b3{animation-delay:-3.1s}
.sw{animation:sw 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 50%}
.rk{animation:rk 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sh{animation:sh 6s ease-in-out infinite}
.sp{animation:sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.ri{animation:ri 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.st{animation:st 3.4s ease-in-out infinite}.s2{animation-delay:-1.7s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ha{0%{opacity:.55;transform:scale(.85)}100%{opacity:0;transform:scale(1.45)}}
@keyframes dr{to{stroke-dashoffset:-32}}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes rk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sh{0%,100%{opacity:0}45%,55%{opacity:.5}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes ri{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes st{0%{opacity:0;transform:translateY(3px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .ha{opacity:0} .st{opacity:.6} }
.wr{stroke-dasharray:400;animation:wr 5s ease-in-out infinite}@keyframes wr{0%{stroke-dashoffset:400}45%,100%{stroke-dashoffset:0}}</style>
<defs><filter id="in4-sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#14293a" flood-opacity=".11"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.3" flood-color="#14293a" flood-opacity=".13"/></filter><filter id="in4-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#14293a" flood-opacity=".17"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".14"/></filter><filter id="in4-bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter><linearGradient id="in4-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf8f2"/></linearGradient><radialGradient id="in4-glo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><linearGradient id="in4-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="in4-bg" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#fdeee5"/><stop offset="1" stop-color="#f8dccd"/></linearGradient><pattern id="in4-dt" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#d4583a" opacity="0.09"/></pattern><clipPath id="in4-cl"><rect width="680" height="300" rx="22"/></clipPath></defs>
<g clip-path="url(#in4-cl)"><rect width="680" height="300" fill="url(#in4-bg)"/><rect width="680" height="300" fill="url(#in4-dt)"/><ellipse cx="150" cy="36" rx="286" ry="150" fill="url(#in4-glo)" opacity=".75"/><circle cx="639" cy="288" r="126" fill="#d4583a" opacity=".035"/><rect x=".75" y=".75" width="678.5" height="298.5" rx="21.25" stroke="#14293a" stroke-opacity=".06" stroke-width="1.5"/></g>
<g class="fl ">
<rect x="20" y="20" width="150" height="260" rx="16" fill="url(#in4-pap)" stroke="#14293a" stroke-opacity=".07" stroke-width="1" filter="url(#in4-sh)"/><path d="M36 21.6H154" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".95"/>
<path d="M36 20h118" stroke="#2b776e" stroke-width="4" stroke-linecap="round" opacity=".6"/>
</g>
<text x="95" y="56" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#2b776e" text-anchor="middle">Falling ↘</text>
