<g transform="translate(205 80)"><path d="M0 40h110M0 65h110M0 90h110" stroke="#d4583a" stroke-opacity=".1"/><path d="M0 120h110" stroke="#e3dcd2" stroke-width="2"/><path d="M20 90c30 0 50-10 70-50" stroke="#d4583a" stroke-width="6" stroke-linecap="round" opacity=".2"/><path class="wr" style="animation-delay:-0.8s" d="M20 90c30 0 50-10 70-50" stroke="#d4583a" stroke-width="6" stroke-linecap="round"/><circle cx="90" cy="40" r="5" fill="#d4583a"/><circle cx="90" cy="40" r="9" stroke="#d4583a" stroke-opacity=".35" stroke-width="2" class="pu"/></g>
<text x="260" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11" fill="#14293a" text-anchor="middle">question · surprise</text>
<rect x="213" y="238" width="94" height="28" rx="14" fill="#d4583a" opacity=".1"/>
<text x="260" y="256" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#14293a" text-anchor="middle">“Really?”</text>
<g class="fl f3">
<rect x="350" y="20" width="150" height="260" rx="16" fill="url(#in4-pap)" stroke="#14293a" stroke-opacity=".07" stroke-width="1" filter="url(#in4-sh)"/><path d="M366 21.6H484" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".95"/>
<path d="M366 20h118" stroke="#7a4a8c" stroke-width="4" stroke-linecap="round" opacity=".6"/>
</g>
<text x="425" y="56" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#7a4a8c" text-anchor="middle">Fall-rise ↘↗</text>
<rect x="366" y="96" width="118" height="110" rx="10" fill="#f6f2f7"/>
<g transform="translate(370 80)"><path d="M0 40h110M0 65h110M0 90h110" stroke="#7a4a8c" stroke-opacity=".1"/><path d="M0 120h110" stroke="#e3dcd2" stroke-width="2"/><path d="M20 40c20 0 30 50 45 50s20-20 25-40" stroke="#7a4a8c" stroke-width="6" stroke-linecap="round" opacity=".2"/><path class="wr" style="animation-delay:-1.6s" d="M20 40c20 0 30 50 45 50s20-20 25-40" stroke="#7a4a8c" stroke-width="6" stroke-linecap="round"/><circle cx="90" cy="50" r="5" fill="#7a4a8c"/><circle cx="90" cy="50" r="9" stroke="#7a4a8c" stroke-opacity=".35" stroke-width="2" class="pu"/></g>
<text x="425" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11" fill="#14293a" text-anchor="middle">not sure · polite disagreement</text>
