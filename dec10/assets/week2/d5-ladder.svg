<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-label="A staircase with four steps from simple to most complex questions, from telling knowledge to using knowledge">
<title>A staircase with four steps from simple to most complex questions, from telling knowledge to using knowledge</title>
<style>.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}.t3{animation-delay:-.7s}
.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}.bl{animation:bl 4s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}.wv{animation:wv 2.6s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.85s}.w3{animation-delay:1.7s}
.bar{animation:bar 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.b2{animation-delay:-.4s}.b3{animation-delay:-.8s}.b4{animation-delay:-1.1s}
.pb{animation:pb 6s ease-in-out infinite;transform-box:fill-box;transform-origin:left}.wr{stroke-dasharray:240;animation:wr 5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes sw{50%{transform:rotate(5deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}@keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes pb{0%{transform:scaleX(.08)}60%,100%{transform:scaleX(1)}}@keyframes wr{0%{stroke-dashoffset:240}50%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.wv{opacity:.6}}</style>
<defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/></filter>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect width="640" height="360" rx="22" fill="#e4ecf8"/><g class="fl " filter="url(#s)"><rect x="70" y="236" width="124" height="54" rx="10" fill="#8fb6e8"/></g><text x="132" y="260" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Simple</text><text x="132" y="278" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">basic knowledge</text><g class="fl " filter="url(#s)"><rect x="74" y="186" width="116" height="34" rx="8" fill="#fff"/><text x="132" y="208" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#14293a" text-anchor="middle">a. What group?</text></g><g class="fl f2" filter="url(#s)"><rect x="200" y="182" width="124" height="108" rx="10" fill="#5f8fd0"/></g><text x="262" y="206" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Less simple</text><text x="262" y="224" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">a little logic</text><g class="fl f2" filter="url(#s)"><rect x="204" y="132" width="116" height="34" rx="8" fill="#fff"/><text x="262" y="154" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#14293a" text-anchor="middle">b. Which is different?</text></g><g class="fl f3" filter="url(#s)"><rect x="330" y="128" width="124" height="162" rx="10" fill="#3a68b8"/></g><text x="392" y="152" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">More complex</text><text x="392" y="170" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">justify your answer</text><g class="fl f3" filter="url(#s)"><rect x="334" y="78" width="116" height="34" rx="8" fill="#fff"/><text x="392" y="100" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#14293a" text-anchor="middle">c. Why?</text></g><g class="fl " filter="url(#s)"><rect x="460" y="74" width="124" height="216" rx="10" fill="#23488f"/></g><text x="522" y="98" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Most complex</text><text x="522" y="116" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">build an argument</text><g class="fl " filter="url(#s)"><rect x="464" y="24" width="116" height="34" rx="8" fill="#fff"/><text x="522" y="46" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#14293a" text-anchor="middle">d. How does it help?</text></g><path d="M40 300h580" stroke="#14293a" stroke-width="3"/><path d="M50 326h540" stroke="#d4583a" stroke-width="4" stroke-linecap="round" class="dr"/><path d="M584 318l12 8-12 8" stroke="#d4583a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="350" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#d4583a" text-anchor="start">Telling knowledge</text><text x="600" y="350" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#d4583a" text-anchor="end">Using knowledge</text><g transform="translate(90 70) scale(0.7)"><g class="fl">
<path d="M-20 70c0-26 8-44 20-44s20 18 20 44z" fill="#d4583a"/><path class="sw" d="M14 24q16-10 18-30" stroke="#d4583a" stroke-width="7" stroke-linecap="round"/><circle cx="32" cy="-8" r="5" fill="#f1c7a5"/>
<circle r="15" fill="#f1c7a5"/><path d="M-15-2c0-14 7-19 15-19s15 6 15 17c-5-6-12-8-19-6-5 1-8 4-11 8z" fill="#14293a"/>
<g class="bl"><circle cx="-5" cy="2" r="1.8" fill="#14293a"/><circle cx="5" cy="2" r="1.8" fill="#14293a"/></g><path d="M-4 8q4 3 8 0" stroke="#14293a" stroke-width="1.6" stroke-linecap="round"/></g></g>
</svg>
