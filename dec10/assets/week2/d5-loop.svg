<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" fill="none" role="img" aria-label="The feedback loop: get feedback, reflect, plan specific actions, act in your next presentation, get feedback again">
<title>The feedback loop: get feedback, reflect, plan specific actions, act in your next presentation, get feedback again</title>
<style>.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}.t3{animation-delay:-.7s}
.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}.bl{animation:bl 4s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}.wv{animation:wv 2.6s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.85s}.w3{animation-delay:1.7s}
.bar{animation:bar 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.b2{animation-delay:-.4s}.b3{animation-delay:-.8s}.b4{animation-delay:-1.1s}
.pb{animation:pb 6s ease-in-out infinite;transform-box:fill-box;transform-origin:left}.wr{stroke-dasharray:240;animation:wr 5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes sw{50%{transform:rotate(5deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}@keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes pb{0%{transform:scaleX(.08)}60%,100%{transform:scaleX(1)}}@keyframes wr{0%{stroke-dashoffset:240}50%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.wv{opacity:.6}}</style>
<defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/></filter>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect width="560" height="420" rx="22" fill="#dfeee8"/><g class="sp" style="animation-duration:40s;transform-origin:280px 210px"><circle cx="280" cy="210" r="140" stroke="#2b776e" stroke-width="6" stroke-dasharray="20 14" opacity=".5"/></g><g class="fl " filter="url(#s)"><rect x="202" y="30" width="156" height="60" rx="30" fill="#3a58a0"/></g><text x="280.0" y="56.0" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Get feedback</text><text x="280.0" y="75.0" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">teachers + peers</text><circle cx="368" cy="89" r="7" fill="#2b776e" class="pu"/><g class="fl f2" filter="url(#s)"><rect x="345" y="134" width="156" height="60" rx="30" fill="#7a4a8c"/></g><text x="422.658477444273" y="159.6474508437579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Reflect</text><text x="422.658477444273" y="178.6474508437579" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">what does it mean?</text><circle cx="423" cy="256" r="7" fill="#2b776e" class="pu"/><g class="fl f3" filter="url(#s)"><rect x="290" y="301" width="156" height="60" rx="30" fill="#2b776e"/></g><text x="368.167787843871" y="327.3525491562421" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Plan actions</text><text x="368.167787843871" y="346.3525491562421" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">specific: what, how, when</text><circle cx="280" cy="360" r="7" fill="#2b776e" class="pu"/><g class="fl " filter="url(#s)"><rect x="114" y="301" width="156" height="60" rx="30" fill="#d4583a"/></g><text x="191.83221215612906" y="327.3525491562421" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Act</text><text x="191.83221215612906" y="346.3525491562421" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">next presentation</text><circle cx="137" cy="256" r="7" fill="#2b776e" class="pu"/><g class="fl " filter="url(#s)"><rect x="59" y="134" width="156" height="60" rx="30" fill="#e3a843"/></g><text x="137.34152255572695" y="159.6474508437579" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Feedback again</text><text x="137.34152255572695" y="178.6474508437579" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">close the loop</text><circle cx="192" cy="89" r="7" fill="#2b776e" class="pu"/><g class="pu"><path d="M280 236c-18-14-30-24-30-38a16 16 0 0 1 30-6 16 16 0 0 1 30 6c0 14-12 24-30 38z" fill="#d4583a"/></g><text x="280" y="260" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#14293a" text-anchor="middle">Action Plan (1)</text>
</svg>
