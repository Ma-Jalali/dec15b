<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" fill="none" role="img" aria-label="The Content Delivery part of the feedback tool with two Needs work boxes marked">
<title>The Content Delivery part of the feedback tool with two Needs work boxes marked</title>
<style>.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}.t3{animation-delay:-.7s}
.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}.bl{animation:bl 4s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}.wv{animation:wv 2.6s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.85s}.w3{animation-delay:1.7s}
.bar{animation:bar 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.b2{animation-delay:-.4s}.b3{animation-delay:-.8s}.b4{animation-delay:-1.1s}
.pb{animation:pb 6s ease-in-out infinite;transform-box:fill-box;transform-origin:left}.wr{stroke-dasharray:240;animation:wr 5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes sw{50%{transform:rotate(5deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}@keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes pb{0%{transform:scaleX(.08)}60%,100%{transform:scaleX(1)}}@keyframes wr{0%{stroke-dashoffset:240}50%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.wv{opacity:.6}}</style>
<defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/></filter>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect width="720" height="330" rx="22" fill="#f1f6f4"/><g filter="url(#s)"><rect x="24" y="20" width="672" height="290" rx="12" fill="#fff"/></g><rect x="24" y="20" width="672" height="50" rx="12" fill="#dbe7f5"/><text x="44" y="54" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#1f4a6b" text-anchor="start">CONTENT DELIVERY</text><text x="456" y="52" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#1f4a6b" text-anchor="middle">N/A</text><text x="522" y="52" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#1f4a6b" text-anchor="middle">Yes</text><text x="588" y="52" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#1f4a6b" text-anchor="middle">Mostly</text><text x="654" y="52" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#1f4a6b" text-anchor="middle">Needs work</text><path d="M24 70h672" stroke="#c9d3dc"/><text x="40" y="93" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1f4a6b" text-anchor="start">The problem was clearly stated.</text><path d="M24 104h672" stroke="#c9d3dc"/><text x="40" y="127" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1f4a6b" text-anchor="start">The cause/s were clearly stated.</text><path d="M24 138h672" stroke="#c9d3dc"/><text x="40" y="161" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1f4a6b" text-anchor="start">Evidence for the cause/s was given.</text><rect class="pu" x="624" y="142" width="60" height="26" rx="5" fill="#d4583a" opacity=".85"/><path transform="translate(654 155) scale(1.2)" d="M-5 0l4 4 7-8" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 172h672" stroke="#c9d3dc"/><text x="40" y="195" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1f4a6b" text-anchor="start">The effect/s were clearly stated.</text><path d="M24 206h672" stroke="#c9d3dc"/><text x="40" y="229" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1f4a6b" text-anchor="start">Evidence for the effect/s was given.</text><rect class="pu" x="624" y="210" width="60" height="26" rx="5" fill="#d4583a" opacity=".85"/><path transform="translate(654 223) scale(1.2)" d="M-5 0l4 4 7-8" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 240h672" stroke="#c9d3dc"/><text x="40" y="263" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1f4a6b" text-anchor="start">A solution was clearly stated.</text><path d="M24 274h672" stroke="#c9d3dc"/><text x="40" y="297" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#1f4a6b" text-anchor="start">Solution was evaluated.</text><path d="M424 20v290" stroke="#c9d3dc"/><path d="M490 20v290" stroke="#c9d3dc"/><path d="M556 20v290" stroke="#c9d3dc"/><path d="M622 20v290" stroke="#c9d3dc"/><path d="M688 20v290" stroke="#c9d3dc"/>
</svg>
