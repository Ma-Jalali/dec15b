<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" fill="none" role="img" aria-label="Three tools for a clear voice: chunking, stress and intonation">
<title>Three tools for a clear voice: chunking, stress and intonation</title>
<style>.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}.t3{animation-delay:-.7s}
.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}.bl{animation:bl 4s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}.wv{animation:wv 2.6s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.85s}.w3{animation-delay:1.7s}
.bar{animation:bar 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.b2{animation-delay:-.4s}.b3{animation-delay:-.8s}.b4{animation-delay:-1.1s}
.pb{animation:pb 6s ease-in-out infinite;transform-box:fill-box;transform-origin:left}.wr{stroke-dasharray:240;animation:wr 5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes sw{50%{transform:rotate(5deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}@keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes pb{0%{transform:scaleX(.08)}60%,100%{transform:scaleX(1)}}@keyframes wr{0%{stroke-dashoffset:240}50%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.wv{opacity:.6}}</style>
<defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/></filter>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect width="660" height="240" rx="22" fill="#fbe3d6"/><g class="fl " filter="url(#s)"><rect x="20" y="20" width="200" height="200" rx="16" fill="#fff"/></g><rect x="20" y="20" width="200" height="40" rx="16" fill="#2b776e"/><text x="120" y="46" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Chunking</text><g class="fl f2" filter="url(#s)"><rect x="234" y="20" width="200" height="200" rx="16" fill="#fff"/></g><rect x="234" y="20" width="200" height="40" rx="16" fill="#d4583a"/><text x="334" y="46" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Stress</text><g class="fl f3" filter="url(#s)"><rect x="448" y="20" width="200" height="200" rx="16" fill="#fff"/></g><rect x="448" y="20" width="200" height="40" rx="16" fill="#3a58a0"/><text x="548" y="46" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Intonation</text><rect x="34" y="96" width="38" height="28" rx="6" fill="#dff0ea"/><rect x="80" y="96" width="38" height="28" rx="6" fill="#dff0ea"/><rect x="126" y="96" width="38" height="28" rx="6" fill="#dff0ea"/><rect x="172" y="96" width="38" height="28" rx="6" fill="#dff0ea"/><path d="M76 90v40" stroke="#2b776e" stroke-width="3" class="tw"/><path d="M122 90v40" stroke="#2b776e" stroke-width="3" class="tw"/><path d="M168 90v40" stroke="#2b776e" stroke-width="3" class="tw"/><text x="120" y="160" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#14293a" text-anchor="middle">group words · pause</text><circle class="pu" cx="252" cy="110" r="6" fill="#e9b9a3" style="animation-delay:-0.0s"/><circle class="pu" cx="280" cy="110" r="12" fill="#d4583a" style="animation-delay:-0.3s"/><circle class="pu" cx="308" cy="110" r="6" fill="#e9b9a3" style="animation-delay:-0.6s"/><circle class="pu" cx="336" cy="110" r="12" fill="#d4583a" style="animation-delay:-0.8999999999999999s"/><circle class="pu" cx="364" cy="110" r="6" fill="#e9b9a3" style="animation-delay:-1.2s"/><circle class="pu" cx="392" cy="110" r="12" fill="#d4583a" style="animation-delay:-1.5s"/><text x="334" y="160" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#14293a" text-anchor="middle">key words: longer, louder</text><path d="M452 130c20-40 40-40 56-6s34 24 50-20 26-10 40 6" stroke="#3a58a0" stroke-width="5" stroke-linecap="round" opacity=".22"/><path class="wr" d="M452 130c20-40 40-40 56-6s34 24 50-20 26-10 40 6" stroke="#3a58a0" stroke-width="5" stroke-linecap="round"/><text x="548" y="160" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#14293a" text-anchor="middle">voice goes up and down</text><text x="120" y="196" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#2b776e" text-anchor="middle">Watching videos / uses data</text><text x="334" y="196" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#d4583a" text-anchor="middle">We MUST REDUCE WASTE</text><text x="548" y="196" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#3a58a0" text-anchor="middle">Really? ↗   Really. ↘</text>
</svg>
