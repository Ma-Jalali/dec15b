<title>A road from Week 1 to Week 7 with a pin saying You are here at Week 2 and a flag at Week 7 for the Interactive Presentation assessment. Week 1: set up, groups, strategies. Weeks 2 to 6: research, plan, prepare. Week 7: practise; assessment on Days 4–5.</title>
