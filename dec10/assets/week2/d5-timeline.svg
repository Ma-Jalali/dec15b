nt-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">W5</text><text x="576" y="259" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#14293a" text-anchor="middle">Research · plan · prepare</text><g filter="url(#s)"><circle cx="693" cy="136" r="24" fill="#3a58a0"/></g><text x="693" y="142" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">W6</text><text x="693" y="100" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#14293a" text-anchor="middle">Research · plan · prepare</text><g filter="url(#s)"><circle cx="810" cy="197" r="24" fill="#2b776e"/></g><text x="810" y="203" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">W7</text><text x="810" y="245" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#14293a" text-anchor="middle">Practise</text><text x="810" y="261" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#2b776e" text-anchor="middle">ASSESSMENT · Days 4–5</text><g class="fl"><path d="M182 80c0-22 32-22 32 0 0 14-16 30-16 30s-16-16-16-30z" fill="#d4583a"/><circle cx="198" cy="80" r="6" fill="#fff"/></g><text x="198" y="56" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#d4583a" text-anchor="middle">You are here</text><g class="sw"><path d="M860 180v-90" stroke="#14293a" stroke-width="4"/><path d="M860 90h30l-8 12 8 12h-30z" fill="#2b776e"/></g>
</svg>
