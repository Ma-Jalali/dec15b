<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="The feedback loop: five steps in a circle - get feedback, reflect, turn it into actions, use them in the next presentation, get feedback again - around a gift box">
<title>The feedback loop: five steps in a circle - get feedback, reflect, turn it into actions, use them in the next presentation, get feedback again - around a gift box</title>
<style>
