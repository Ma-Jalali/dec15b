.a1-flow { stroke-dasharray: 3 4; animation: a1-flow 1.4s linear infinite; }
@keyframes a1-flow { to { stroke-dashoffset: -14; } }
.a1-gift { animation: a1-gift 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes a1-gift { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-4deg); } 84% { transform: rotate(4deg); } 90% { transform: rotate(0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
