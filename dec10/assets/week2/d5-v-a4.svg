<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A vague grey cloud saying more, crossed out, turns into a dart hitting the bullseye of a target, with the questions What, How and When">
<title>A vague grey cloud saying more, crossed out, turns into a dart hitting the bullseye of a target, with the questions What, How and When</title>
<style>
.a4-tw { animation: a4-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes a4-tw { 0%, 100% { opacity: .35; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
.a4-fl { animation: a4-fl 6s ease-in-out infinite; }
@keyframes a4-fl { 50% { transform: translateY(-3px); } }
.a4-dart { animation: a4-dart 3.6s cubic-bezier(.3,.7,.3,1) infinite; }
@keyframes a4-dart { 0% { transform: translate(9px, -9px); opacity: 0; } 15% { opacity: 1; } 40%, 100% { transform: translate(0, 0); opacity: 1; } }
.a4-ring { animation: a4-ring 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
@keyframes a4-ring { 0%, 38% { opacity: 0; transform: scale(.7); } 45% { opacity: .8; } 75%, 100% { opacity: 0; transform: scale(1.25); } }
.a4-mv { animation: a4-mv 1.8s ease-in-out infinite; }
