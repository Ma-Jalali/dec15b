<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="An old flat-Earth map: the Earth as a disc with oceans falling off the edge and a small ship, a magnifying glass checking it, and a card with a tick and a cross for sorting real past beliefs">
<title>An old flat-Earth belief checked with a magnifying glass, and a tick-or-cross sorting card</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.wf{stroke-dasharray:4 5;animation:wf 1.2s linear infinite}
.sh{animation:sh 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes wf{to{stroke-dashoffset:-18}}
@keyframes sh{50%{transform:rotate(-6deg) translateY(-1px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="c1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#d9e5f4"/></linearGradient>
<pattern id="c1-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#2f6db5" opacity=".13"/></pattern>
<radialGradient id="c1-sea" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#8cc8f0"/><stop offset=".6" stop-color="#4f92d2"/><stop offset="1" stop-color="#2f6db5"/></radialGradient>
<linearGradient id="c1-rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98a5a"/><stop offset="1" stop-color="#6e4c33"/></linearGradient>
<linearGradient id="c1-land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd07e"/><stop offset="1" stop-color="#5d9e52"/></linearGradient>
<linearGradient id="c1-fall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cc8f0"/><stop offset="1" stop-color="#8cc8f0" stop-opacity="0"/></linearGradient>
<radialGradient id="c1-lens" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#cfe4f6" stop-opacity=".75"/></radialGradient>
<linearGradient id="c1-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<radialGradient id="c1-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="c1-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".18"/></filter>
<path id="c1-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>
</defs>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c1-bg)"/>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c1-dots)"/>
<g transform="translate(26 132)"><use href="#c1-st" class="tw" fill="#e3a843"/></g>
<g transform="translate(214 128)"><use href="#c1-st" class="tw t2" fill="#13887a" transform="scale(.8)"/></g>
<g transform="translate(130 22)"><use href="#c1-st" class="tw t3" fill="#7a4a8c" transform="scale(.6)"/></g>
<circle cx="200" cy="100" r="2" fill="#e64626" opacity=".7"/>
<ellipse cx="112" cy="158" rx="76" ry="7" fill="url(#c1-gs)"/>
<g class="fl">
<!-- waterfalls off the edge -->
<path d="M44 118c18 12 42 17 68 17s50-5 68-17l-2 12c-16 12-40 18-66 18s-50-6-66-18z" fill="url(#c1-fall)" opacity=".8"/>
<g stroke-linecap="round" fill="none" stroke="#5aa3dc" opacity=".75">
<path d="M56 126v16" stroke-width="2"/>
<path class="wf" d="M74 131v20" stroke-width="2.2"/>
<path d="M96 134v18" stroke-width="2"/>
<path class="wf" d="M128 134v20" stroke-width="2.2"/>
<path d="M150 131v18" stroke-width="2"/>
<path class="wf" d="M168 126v18" stroke-width="2.2"/>
</g>
<!-- disc body -->
<ellipse cx="112" cy="112" rx="74" ry="22" fill="url(#c1-rock)"/>
<path d="M40 106c10 14 40 22 72 22s62-8 72-22" stroke="#4f3624" stroke-width="1" opacity=".45"/>
<path d="M44 112c12 10 38 16 68 16" stroke="#e0b98a" stroke-width="1" opacity=".5" stroke-dasharray="6 4"/>
<ellipse cx="112" cy="100" rx="74" ry="22" fill="url(#c1-sea)"/>
<ellipse cx="112" cy="100" rx="72" ry="20.6" stroke="#ffffff" stroke-width="2" opacity=".85"/>
<ellipse cx="112" cy="100" rx="48" ry="13" stroke="#ffffff" stroke-width=".8" opacity=".35" stroke-dasharray="3 3"/>
<ellipse cx="112" cy="100" rx="24" ry="6.5" stroke="#ffffff" stroke-width=".8" opacity=".35" stroke-dasharray="3 3"/>
<!-- continents -->
<path d="M72 96c6-7 17-8 24-3 6 4 13 3 17-1 6 1 8 7 2 11-7 5-16 3-22 6-8 3-19 1-21-13z" fill="url(#c1-land)"/>
<path d="M120 90c6-4 16-4 22 0 3 3 0 6-5 6-5 0-9 2-12 1-4-1-7-4-5-7z" fill="url(#c1-land)"/>
<path d="M134 106c5-2 12-1 14 3-3 3-9 4-14 1z" fill="url(#c1-land)"/>
<path d="M78 95c4-3 9-3 12 0" stroke="#d6efc4" stroke-width="1" stroke-linecap="round"/>
<!-- small ship sailing to the edge -->
<g transform="translate(160 100)"><g class="sh"><path d="M-8 0h16l-3 4h-10z" fill="#7a4a35"/><path d="M0-1v-13" stroke="#14293a" stroke-width="1.2"/><path d="M1-13c6 3 7 8 6 11h-6z" fill="#fbf7ef"/><path d="M-1-11c-4 2-5 6-5 9h5z" fill="#f6efe1"/><path d="M0-14l4 1.5-4 1.5z" fill="#e64626"/></g></g>
<path d="M150 104c4 1 8 1 12 0" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity=".7"/>
<!-- sea highlight -->
<path d="M58 92c10-8 28-12 44-12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".5"/>
</g>
<!-- magnifying glass -->
<g class="fl f3">
<path d="M76 63l14 14" stroke="#14293a" stroke-width="7" stroke-linecap="round"/>
<path d="M78.5 65.5l9 9" stroke="#e3a843" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="62" cy="49" r="18" fill="url(#c1-lens)" stroke="url(#c1-rim)" stroke-width="5" filter="url(#c1-sh)"/>
<path d="M52 42a12 12 0 0 1 9-6" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text x="63" y="56" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#e64626" text-anchor="middle">?</text>
</g>
<!-- sorting card: believed or not -->
<g class="fl f2">
<g filter="url(#c1-sh)"><rect x="158" y="24" width="58" height="46" rx="10" fill="#fbf7ef"/></g>
<rect x="158" y="24" width="58" height="12" rx="6" fill="#f6efe1"/>
<rect x="166" y="28.5" width="30" height="3" rx="1.5" fill="#c9b892"/>
<circle cx="173" cy="52" r="9" fill="#13887a"/>
<path d="M168.5 52l3 3 5.5-6" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="201" cy="52" r="9" fill="#e64626"/>
<path d="M197.5 48.5l7 7m0-7l-7 7" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
<path d="M187 46v12" stroke="#d8cdb6" stroke-width="1"/>
</g>
</svg>
