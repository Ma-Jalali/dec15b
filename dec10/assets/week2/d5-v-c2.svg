<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A spiral notebook where a pencil writes 'Critical thinking is…', a thought cloud with a lightbulb for your own idea, and a crossed-out search icon: no looking it up">
<title>Writing your own definition of critical thinking</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.wr{stroke-dasharray:90;animation:wr 5s ease-in-out infinite}
.pn{animation:pn 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.gl{animation:gl 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes wr{0%{stroke-dashoffset:90}55%,100%{stroke-dashoffset:0}}
@keyframes pn{0%{transform:translate(-24px,0)}55%,100%{transform:translate(0,0)}}
@keyframes gl{50%{opacity:.35;transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="c2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf6e8"/><stop offset="1" stop-color="#f3e6cc"/></linearGradient>
<pattern id="c2-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#b07a1e" opacity=".14"/></pattern>
<linearGradient id="c2-page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient>
<linearGradient id="c2-cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f7fc4"/><stop offset="1" stop-color="#244f86"/></linearGradient>
<linearGradient id="c2-pen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c766"/><stop offset=".5" stop-color="#e3a843"/><stop offset="1" stop-color="#c88a2a"/></linearGradient>
<linearGradient id="c2-ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a97a3"/><stop offset=".5" stop-color="#e6ebef"/><stop offset="1" stop-color="#8a97a3"/></linearGradient>
<radialGradient id="c2-bulb" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff4cf"/><stop offset=".6" stop-color="#f4c95e"/><stop offset="1" stop-color="#e3a843"/></radialGradient>
<radialGradient id="c2-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f6c766" stop-opacity=".55"/><stop offset="1" stop-color="#f6c766" stop-opacity="0"/></radialGradient>
<radialGradient id="c2-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="c2-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".18"/></filter>
<path id="c2-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>
</defs>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c2-bg)"/>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c2-dots)"/>
<g transform="translate(26 58)"><use href="#c2-st" class="tw" fill="#13887a"/></g>
<g transform="translate(222 108)"><use href="#c2-st" class="tw t2" fill="#e3a843" transform="scale(.8)"/></g>
<g transform="translate(30 150)"><use href="#c2-st" class="tw t3" fill="#7a4a8c" transform="scale(.6)"/></g>
<ellipse cx="108" cy="162" rx="70" ry="7" fill="url(#c2-gs)"/>
<!-- notebook -->
<g transform="rotate(-4 106 96)">
<rect x="44" y="34" width="128" height="122" rx="9" fill="url(#c2-cover)" filter="url(#c2-sh)"/>
<rect x="48" y="38" width="122" height="116" rx="6" fill="#e9e1d1"/>
<rect x="46" y="36" width="122" height="116" rx="6" fill="url(#c2-page)"/>
<path d="M62 36v116" stroke="#e64626" stroke-width="1" opacity=".45"/>
<g stroke="#bcd3ea" stroke-width="1">
<path d="M52 72h110M52 86h110M52 100h110M52 114h110M52 128h110M52 142h110"/>
</g>
<!-- tab -->
<rect x="70" y="44" width="78" height="16" rx="8" fill="#14293a"/>
<text x="109" y="55.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing=".3">My definition</text>
<!-- handwriting -->
<text x="68" y="82" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#14293a">Critical thinking</text>
<text x="68" y="96" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#14293a">is …</text>
<path class="wr" d="M68 110c5-4 9-4 13 0s8 4 12 0 8-4 12 0 8 4 12 0 8-4 12 0" stroke="#2f6db5" stroke-width="1.8" stroke-linecap="round"/>
<path d="M68 124c5-3 9-3 13 0s8 3 12 0 8-3 12 0" stroke="#2f6db5" stroke-width="1.6" stroke-linecap="round" opacity=".35"/>
<!-- spiral rings -->
<g stroke="url(#c2-ring)" stroke-width="2.6" stroke-linecap="round">
<path d="M60 31v9M76 31v9M92 31v9M108 31v9M124 31v9M140 31v9M156 31v9"/>
</g>
<g fill="#14293a" opacity=".55"><circle cx="60" cy="41" r="1.6"/><circle cx="76" cy="41" r="1.6"/><circle cx="92" cy="41" r="1.6"/><circle cx="108" cy="41" r="1.6"/><circle cx="124" cy="41" r="1.6"/><circle cx="140" cy="41" r="1.6"/><circle cx="156" cy="41" r="1.6"/></g>
</g>
<!-- pencil -->
<g class="pn"><g transform="translate(130 108) rotate(-26)">
<rect x="0" y="-5" width="52" height="10" fill="url(#c2-pen)"/>
<path d="M0 -1.6h52" stroke="#fff4cf" stroke-width="1" opacity=".7"/>
<rect x="52" y="-5" width="7" height="10" fill="#c9d3dc"/>
<path d="M54-5v10M56.5-5v10" stroke="#8a97a3" stroke-width=".8"/>
<rect x="59" y="-5" width="8" height="10" rx="3" fill="#e64626"/>
<path d="M0-5L-11 0 0 5z" fill="#f1d3a8"/>
<path d="M-7-1.8L-11 0-7 1.8z" fill="#14293a"/>
</g></g>
<!-- thought cloud with bulb -->
<g class="fl f2">
<circle cx="174" cy="66" r="3" fill="#ffffff" filter="url(#c2-sh)"/>
<circle cx="182" cy="58" r="4.5" fill="#ffffff" filter="url(#c2-sh)"/>
<path d="M186 48c-8 0-11-9-5-13-1-8 8-12 13-7 3-7 14-7 16 1 8-1 11 9 5 13 3 7-5 12-11 9-4 5-13 4-15-1-1 0-2-1-3-2z" fill="#ffffff" filter="url(#c2-sh)"/>
<circle class="gl" cx="198" cy="36" r="12" fill="url(#c2-glow)"/>
<circle cx="198" cy="34" r="7.5" fill="url(#c2-bulb)"/>
<path d="M195 40.5h6v3.5h-6z" fill="#8a97a3"/>
<path d="M195.5 42h5" stroke="#e6ebef" stroke-width=".8"/>
<path d="M195.5 40v-3.5l1.3-2 1.2 2 1.2-2 1.3 2v3.5" stroke="#b07a1e" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M195 31a3.5 3.5 0 0 1 2.5-2" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
</g>
<!-- no searching badge -->
<g class="fl f3">
<circle cx="200" cy="138" r="14" fill="#ffffff" filter="url(#c2-sh)"/>
<circle cx="197.5" cy="135.5" r="4" stroke="#14293a" stroke-width="2"/>
<path d="M200.5 138.5l4.5 4.5" stroke="#14293a" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="200" cy="138" r="10" stroke="#e64626" stroke-width="2"/>
<path d="M193 131l14 14" stroke="#e64626" stroke-width="2" stroke-linecap="round"/>
</g>
</svg>
