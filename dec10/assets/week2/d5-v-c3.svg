<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Running dictation: Student A reads a text pinned on the wall, runs back and says the words; Student B listens and writes at a desk. One wrong word in the text is circled.">
<title>Running dictation: Student A reads and speaks, Student B listens and writes</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.wv{animation:wv 1.8s ease-out infinite;opacity:0}.w2{animation-delay:.3s}.w3{animation-delay:.6s}
.rn{stroke-dasharray:4 4;animation:rn 1.4s linear infinite}
.wr{stroke-dasharray:60;animation:wr 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes wv{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes rn{to{stroke-dashoffset:-16}}
@keyframes wr{0%{stroke-dashoffset:60}60%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.wv{opacity:1}}
</style>
<defs>
<linearGradient id="c3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ebf6f3"/><stop offset="1" stop-color="#d6ebe6"/></linearGradient>
<pattern id="c3-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#13887a" opacity=".15"/></pattern>
<linearGradient id="c3-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9564a8"/><stop offset="1" stop-color="#6a3d7c"/></linearGradient>
<linearGradient id="c3-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fa08f"/><stop offset="1" stop-color="#11705f"/></linearGradient>
<linearGradient id="c3-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a66a"/><stop offset="1" stop-color="#b07f48"/></linearGradient>
<linearGradient id="c3-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6efe1"/></linearGradient>
<radialGradient id="c3-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="c3-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".18"/></filter>
<path id="c3-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>
</defs>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c3-bg)"/>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c3-dots)"/>
<g transform="translate(112 24)"><use href="#c3-st" class="tw" fill="#e3a843"/></g>
<g transform="translate(222 70)"><use href="#c3-st" class="tw t2" fill="#7a4a8c" transform="scale(.7)"/></g>
<g transform="translate(22 132)"><use href="#c3-st" class="tw t3" fill="#13887a" transform="scale(.7)"/></g>
<ellipse cx="104" cy="152" rx="26" ry="5" fill="url(#c3-gs)"/>
<ellipse cx="188" cy="152" rx="40" ry="6" fill="url(#c3-gs)"/>
<!-- text pinned on the wall -->
<g class="fl">
<g transform="translate(5 4) rotate(-4 48 74)">
<rect x="24" y="36" width="50" height="70" rx="5" fill="url(#c3-paper)" filter="url(#c3-sh)"/>
<rect x="30" y="44" width="30" height="4" rx="2" fill="#14293a"/>
<g stroke="#9fb3c4" stroke-width="2.4" stroke-linecap="round">
<path d="M30 56h38M30 63h26M30 77h12M30 84h34M30 91h28M30 98h20"/>
</g>
<path d="M60 63h8" stroke="#9fb3c4" stroke-width="2.4" stroke-linecap="round"/>
<rect x="44" y="72.5" width="24" height="9" rx="4.5" fill="#fde6df"/>
<path d="M47 77h18" stroke="#e64626" stroke-width="2.4" stroke-linecap="round"/>
<ellipse cx="56" cy="77" rx="16" ry="7.5" stroke="#e64626" stroke-width="1.4" transform="rotate(-6 56 77)"/>
<circle cx="49" cy="38" r="4" fill="#e64626"/><circle cx="48" cy="37" r="1.4" fill="#ffffff" opacity=".7"/>
</g>
</g>
<!-- run path -->
<path class="rn" d="M50 132c10 10 26 14 40 10" stroke="#13887a" stroke-width="1.8" stroke-linecap="round"/>
<path d="M86 138l5 4-6 2" stroke="#13887a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M54 128l-4 4 6 1" stroke="#13887a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<!-- Student A -->
<g>
<path d="M84 150c0-30 8-50 20-50s20 20 20 50z" fill="url(#c3-a)"/>
<path d="M96 104l8 8 8-8" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
<path d="M120 114c6 2 10 6 12 12" stroke="#7a4a8c" stroke-width="6" stroke-linecap="round"/>
<circle cx="133" cy="127" r="3.6" fill="#f1c7a5"/>
<circle cx="104" cy="130" r="8" fill="#ffffff"/>
<text x="104" y="134" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#7a4a8c" text-anchor="middle">A</text>
<rect x="100" y="90" width="8" height="10" rx="3" fill="#e2b08d"/>
<circle cx="104" cy="80" r="12" fill="#f1c7a5"/>
<path d="M92 79c-1-11 6-17 13-17 8 0 14 5 13 14-4-5-10-7-16-6-4 1-8 4-10 9z" fill="#3b2a24"/>
<path d="M92 79c-2-1-3-5-1-8" stroke="#3b2a24" stroke-width="3" stroke-linecap="round"/>
<circle cx="108" cy="80" r="1.5" fill="#14293a"/><circle cx="114" cy="80" r="1.5" fill="#14293a"/>
<ellipse cx="112" cy="87" rx="2.6" ry="2" fill="#a94a3a"/>
<circle cx="101" cy="85" r="2" fill="#e8998a" opacity=".5"/>
</g>
<!-- speech bubble -->
<g class="fl f2">
<path d="M130 36h44a8 8 0 0 1 8 8v14a8 8 0 0 1-8 8h-32l-10 8 2-8h-4a8 8 0 0 1-8-8V44a8 8 0 0 1 8-8z" fill="#ffffff" filter="url(#c3-sh)"/>
<g stroke-linecap="round" stroke-width="3">
<path d="M132 47h14" stroke="#14293a"/><path d="M150 47h22" stroke="#2f6db5"/>
<path d="M132 56h22" stroke="#2f6db5"/><path d="M158 56h10" stroke="#14293a"/>
</g>
</g>
<g stroke="#13887a" stroke-width="1.8" stroke-linecap="round">
<path class="wv" d="M122 84a6 6 0 0 1 0 8"/>
<path class="wv w2" d="M127 81a10 10 0 0 1 0 14"/>
<path class="wv w3" d="M132 78a14 14 0 0 1 0 20"/>
</g>
<!-- Student B at desk -->
<g>
<path d="M170 134c0-22 8-36 20-36s20 14 20 36z" fill="url(#c3-b)"/>
<path d="M182 102l8 7 8-7" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
<rect x="186" y="88" width="8" height="10" rx="3" fill="#e2b08d"/>
<circle cx="190" cy="80" r="12" fill="#f1c7a5"/>
<path d="M178 82c-3-13 4-20 13-20s15 6 13 18c-2-6-6-9-10-9-6 0-12 4-16 11z" fill="#14293a"/>
<path d="M203 80c2 6 2 12-2 16" stroke="#14293a" stroke-width="4" stroke-linecap="round"/>
<circle cx="185" cy="83" r="1.5" fill="#14293a"/><circle cx="191" cy="83" r="1.5" fill="#14293a"/>
<path d="M186 88.5q2 1.5 4 0" stroke="#a94a3a" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="181" cy="87" r="2" fill="#e8998a" opacity=".5"/>
</g>
<!-- desk -->
<rect x="150" y="130" width="76" height="7" rx="3" fill="url(#c3-desk)"/>
<path d="M158 137v14M218 137v14" stroke="#9a6d3c" stroke-width="3" stroke-linecap="round"/>
<!-- notebook and writing hand -->
<path d="M160 130l4-10h36l-4 10z" fill="#ffffff" stroke="#c9d3dc" stroke-width="1"/>
<path d="M180 120l-4 10" stroke="#c9d3dc" stroke-width="1"/>
<path class="wr" d="M166 126c2-2 4-2 5 0s3 2 5 0" stroke="#14293a" stroke-width="1.2" stroke-linecap="round"/>
<path d="M184 126h10M186 123h9" stroke="#9fb3c4" stroke-width="1.2" stroke-linecap="round"/>
<path d="M205 108c-1 8-6 14-13 17" stroke="#13887a" stroke-width="6" stroke-linecap="round"/>
<circle cx="189" cy="125" r="3.6" fill="#f1c7a5"/>
<path d="M186 128l6-12" stroke="#2f6db5" stroke-width="2" stroke-linecap="round"/>
<circle cx="180" cy="113" r="8" fill="#ffffff"/>
<text x="180" y="117" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#13887a" text-anchor="middle">B</text>
</svg>
