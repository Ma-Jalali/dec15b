<g transform="translate(110 60) scale(0.8)"><g class="fl">
<path d="M-20 70c0-26 8-44 20-44s20 18 20 44z" fill="#3a58a0"/><path d="M-14 26q-14 8-16 22" stroke="#3a58a0" stroke-width="7" stroke-linecap="round"/>
<circle r="15" fill="#f1c7a5"/><path d="M-15-2c0-14 7-19 15-19s15 6 15 17c-5-6-12-8-19-6-5 1-8 4-11 8z" fill="#14293a"/>
<g class="bl"><circle cx="-5" cy="2" r="1.8" fill="#14293a"/><circle cx="5" cy="2" r="1.8" fill="#14293a"/></g><path d="M-4 8q4 3 8 0" stroke="#14293a" stroke-width="1.6" stroke-linecap="round"/></g></g><path class="dr" d="M86 120h-30" stroke="#3a58a0" stroke-width="3" stroke-linecap="round"/><path d="M92 112l-14 8 14 8" stroke="#3a58a0" stroke-width="3" fill="none" stroke-linecap="round"/>
<g class="fl f2" filter="url(#s)"><rect x="30" y="120" width="62" height="40" rx="8" fill="#fff"/><path d="M38 134h44" stroke="#d5dde5" stroke-width="4" stroke-linecap="round"/><path d="M38 143h33" stroke="#d5dde5" stroke-width="4" stroke-linecap="round"/><path d="M38 152h44" stroke="#d5dde5" stroke-width="4" stroke-linecap="round"/></g><g class="fl f3" filter="url(#s)"><rect x="122" y="118" width="46" height="28" rx="12" fill="#fff"/><path d="M140 146l-6 12 14-12z" fill="#fff"/><text x="145" y="137" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#d4583a" text-anchor="middle">say</text></g>
</svg>
