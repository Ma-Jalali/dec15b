<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A card with a car, a bus, a bicycle and a motorbike, with the bicycle picked out as different; a big bicycle with a green leaf; and a staircase of four questions a, b, c and d climbing from simple to complex">
<title>Car, bus, bicycle, motorbike: four questions from simple to complex</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.wh{animation:wh 6s linear infinite;transform-box:fill-box;transform-origin:center}
.up{stroke-dasharray:5 5;animation:up 1.4s linear infinite}
.pk{animation:pk 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes wh{to{transform:rotate(360deg)}}
@keyframes up{to{stroke-dashoffset:-20}}
@keyframes pk{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="c4-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf6ef"/><stop offset="1" stop-color="#d8eadf"/></linearGradient>
<pattern id="c4-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#2f7d6b" opacity=".15"/></pattern>
<linearGradient id="c4-sa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb3a6"/><stop offset="1" stop-color="#3f978a"/></linearGradient>
<linearGradient id="c4-sb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a9a89"/><stop offset="1" stop-color="#0f6f63"/></linearGradient>
<linearGradient id="c4-sc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f80c6"/><stop offset="1" stop-color="#25588f"/></linearGradient>
<linearGradient id="c4-sd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f5ea3"/><stop offset="1" stop-color="#633a74"/></linearGradient>
<linearGradient id="c4-frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f06a4a"/><stop offset="1" stop-color="#c8401f"/></linearGradient>
<linearGradient id="c4-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd07e"/><stop offset="1" stop-color="#3f8f4a"/></linearGradient>
<radialGradient id="c4-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="c4-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".18"/></filter>
<path id="c4-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>
<g id="c4-wheel"><circle r="17" fill="none" stroke="#14293a" stroke-width="4.5"/><circle r="14.2" fill="none" stroke="#5b6b78" stroke-width="1"/><g stroke="#9fb3c4" stroke-width=".8"><path d="M0-14V14M-14 0H14M-10-10L10 10M10-10L-10 10"/></g><circle r="2.4" fill="#14293a"/></g>
</defs>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c4-bg)"/>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c4-dots)"/>
<g transform="translate(140 30)"><use href="#c4-st" class="tw" fill="#e3a843"/></g>
<g transform="translate(20 96)"><use href="#c4-st" class="tw t2" fill="#13887a" transform="scale(.7)"/></g>
<g transform="translate(118 166)"><use href="#c4-st" class="tw t3" fill="#7a4a8c" transform="scale(.6)"/></g>
<ellipse cx="70" cy="153" rx="50" ry="5" fill="url(#c4-gs)"/>
<ellipse cx="172" cy="153" rx="56" ry="5" fill="url(#c4-gs)"/>
<!-- set card: car, bus, bicycle, motorbike -->
<g class="fl f2">
<rect x="22" y="22" width="104" height="38" rx="10" fill="#ffffff" filter="url(#c4-sh)"/>
<!-- car -->
<g transform="translate(36 42)" opacity=".75"><path d="M-9 3v-5l3-1 3-5h8l4 5 3 1v5z" fill="#9fb3c4"/><path d="M-2-7h3v4h-6zM3-7h2l3 4h-5z" fill="#ffffff"/><circle cx="-5" cy="3.5" r="2.6" fill="#14293a"/><circle cx="6" cy="3.5" r="2.6" fill="#14293a"/></g>
<!-- bus -->
<g transform="translate(60 42)" opacity=".75"><rect x="-10" y="-9" width="20" height="12" rx="2.5" fill="#9fb3c4"/><path d="M-8-7h4v4h-4zM-2-7h4v4h-4zM4-7h4v4h-4z" fill="#ffffff"/><circle cx="-5" cy="3.5" r="2.4" fill="#14293a"/><circle cx="5" cy="3.5" r="2.4" fill="#14293a"/></g>
<!-- bicycle (the odd one out) -->
<circle class="pk" cx="84" cy="40" r="12" fill="#fdf0d6" stroke="#e3a843" stroke-width="1.6"/>
<g transform="translate(84 41)" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5.5" cy="2" r="4" stroke="#14293a" stroke-width="1.5"/><circle cx="5.5" cy="2" r="4" stroke="#14293a" stroke-width="1.5"/><path d="M-5.5 2L-1 2 3-3H-3L-1 2M3-3L5.5 2M-3-3l-1-1.5M2-4.5h2.5" stroke="#e64626" stroke-width="1.4"/></g>
<!-- motorbike -->
<g transform="translate(110 42)" opacity=".75"><path d="M-7 1l3-5h6l3-3h2l-1 4 3 4z" fill="#9fb3c4"/><circle cx="-6" cy="3" r="3.2" fill="none" stroke="#14293a" stroke-width="2"/><circle cx="7" cy="3" r="3.2" fill="none" stroke="#14293a" stroke-width="2"/></g>
</g>
<!-- leaf badge -->
<g class="fl f3">
<circle cx="116" cy="90" r="11" fill="#ffffff" filter="url(#c4-sh)"/>
<path d="M110 95c0-8 5-12 12-12 0 8-4 12-12 12z" fill="url(#c4-leaf)"/>
<path d="M110 95c3-4 6-7 9-9" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
</g>
<!-- big bicycle -->
<g transform="translate(44 134)"><use href="#c4-wheel" class="wh"/></g>
<g transform="translate(98 134)"><use href="#c4-wheel" class="wh"/></g>
<g stroke-linecap="round" stroke-linejoin="round">
<path d="M44 134L68 136 62 110 44 134" stroke="url(#c4-frame)" stroke-width="4"/>
<path d="M62 110H90L68 136" stroke="url(#c4-frame)" stroke-width="4"/>
<path d="M90 104l8 30" stroke="#c8401f" stroke-width="3.5"/>
<path d="M60 110l-2-6" stroke="#14293a" stroke-width="2.4"/>
<path d="M53 103c3-2 9-2 12 0" stroke="#14293a" stroke-width="4"/>
<path d="M90 104l-2-6 9-1" stroke="#14293a" stroke-width="2.6"/>
<path d="M63 112h24" stroke="#ffffff" stroke-width="1" opacity=".5"/>
</g>
<circle cx="68" cy="136" r="5.5" fill="#ffffff" stroke="#14293a" stroke-width="2"/>
<circle cx="68" cy="136" r="1.6" fill="#14293a"/>
<path d="M44 134L68 141" stroke="#5b6b78" stroke-width="1.2"/>
<path d="M68 136l4 5" stroke="#14293a" stroke-width="2" stroke-linecap="round"/>
<!-- staircase a-d -->
<g>
<path d="M126 150v-18h24v18z" fill="url(#c4-sa)"/><path d="M126 132l4-4h24l-4 4z" fill="#8fd0c4"/>
<path d="M150 150v-36h24v36z" fill="url(#c4-sb)"/><path d="M150 114l4-4h24l-4 4z" fill="#5fc0b0"/>
<path d="M174 150v-54h24v54z" fill="url(#c4-sc)"/><path d="M174 96l4-4h24l-4 4z" fill="#7fb0e3"/>
<path d="M198 150v-72h24v72z" fill="url(#c4-sd)"/><path d="M198 78l4-4h24l-4 4z" fill="#b48cc4"/>
<path d="M150 132v18M174 114v36M198 96v54" stroke="#14293a" stroke-opacity=".18" stroke-width="1"/>
<g font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">
<circle cx="138" cy="142" r="7" fill="#ffffff"/><text x="138" y="145.6" fill="#2f7d6b">a</text>
<circle cx="162" cy="124" r="7" fill="#ffffff"/><text x="162" y="127.6" fill="#13887a">b</text>
<circle cx="186" cy="106" r="7" fill="#ffffff"/><text x="186" y="109.6" fill="#2f6db5">c</text>
<circle cx="210" cy="88" r="7" fill="#ffffff"/><text x="210" y="91.6" fill="#7a4a8c">d</text>
</g>
</g>
<path class="up" d="M128 116L196 64" stroke="#14293a" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
<path d="M188 63.5l9-.5-3 8.5" stroke="#14293a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
<g transform="translate(212 60) scale(1.3)"><use href="#c4-st" class="pk" fill="#e3a843"/></g>
</svg>
