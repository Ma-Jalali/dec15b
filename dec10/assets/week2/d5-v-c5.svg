<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A phone shows a viral post claiming one email makes 50g of CO2; a magnifying glass checks the figure, and two question tags ask 'Who says?' and 'How old?'">
<title>Think before you share: checking a viral claim</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.hb{animation:hb 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.lz{animation:lz 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}}
@keyframes lz{50%{transform:translate(-3px,2px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="c5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf1ec"/><stop offset="1" stop-color="#f6ddd3"/></linearGradient>
<pattern id="c5-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#d4583a" opacity=".14"/></pattern>
<linearGradient id="c5-body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="c5-scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/></linearGradient>
<linearGradient id="c5-img" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbe9f7"/><stop offset="1" stop-color="#b9d3ee"/></linearGradient>
<linearGradient id="c5-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<radialGradient id="c5-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="c5-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".2"/></filter>
<clipPath id="c5-lc"><circle cx="64" cy="64" r="16"/></clipPath>
<path id="c5-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>
</defs>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c5-bg)"/>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c5-dots)"/>
<g transform="translate(24 60)"><use href="#c5-st" class="tw" fill="#e3a843"/></g>
<g transform="translate(200 36)"><use href="#c5-st" class="tw t2" fill="#2f6db5" transform="scale(.8)"/></g>
<g transform="translate(26 140)"><use href="#c5-st" class="tw t3" fill="#13887a" transform="scale(.6)"/></g>
<ellipse cx="78" cy="164" rx="44" ry="5" fill="url(#c5-gs)"/>
<!-- phone -->
<rect x="42" y="18" width="72" height="144" rx="13" fill="url(#c5-body)" filter="url(#c5-sh)"/>
<rect x="47" y="23" width="62" height="134" rx="9" fill="url(#c5-scr)"/>
<rect x="68" y="26" width="20" height="5" rx="2.5" fill="#14293a"/>
<path d="M44 36v18" stroke="#ffffff" stroke-width="1" opacity=".25" stroke-linecap="round"/>
<!-- post -->
<circle cx="56" cy="42" r="5" fill="#e3a843"/><path d="M53 44.5c1-2 5-2 6 0" stroke="#ffffff" stroke-width="1.2"/><circle cx="56" cy="40.5" r="1.6" fill="#ffffff"/>
<rect x="64" y="38.5" width="26" height="3" rx="1.5" fill="#14293a"/>
<rect x="64" y="44" width="16" height="2.4" rx="1.2" fill="#9fb3c4"/>
<g id="c5-claim">
<text x="79" y="69" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#e64626" text-anchor="middle">50g CO₂!</text>
</g>
<rect x="52" y="78" width="52" height="34" rx="6" fill="url(#c5-img)"/>
<rect x="62" y="88" width="26" height="18" rx="2.5" fill="#ffffff"/>
<path d="M62.5 89l12.5 9 12.5-9" stroke="#2f6db5" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M84 84c0-3 3-5 6-4 1-3 6-3 7 0 3 0 4 4 1 5h-13c-2 0-2-1-1-1z" fill="#9fb3c4"/>
<rect x="54" y="80" width="10" height="7" rx="1.5" fill="#e3a843"/><path d="M55 86l3-3 2 2 1.5-1.5 2 2.5" stroke="#ffffff" stroke-width=".8"/>
<g class="hb"><path d="M58 123c-3-2.5-5-4.4-5-6.5 0-1.6 1.2-2.8 2.7-2.8.9 0 1.8.5 2.3 1.2.5-.7 1.4-1.2 2.3-1.2 1.5 0 2.7 1.2 2.7 2.8 0 2.1-2 4-5 6.5z" fill="#e64626"/></g>
<text x="66" y="122.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" fill="#14293a">12.4k</text>
<path d="M100 121l6-4-6-4v2.5c-4 0-6 2-6.5 5.5 1.5-2 3.5-2.6 6.5-2.6z" fill="#2f6db5"/>
<path d="M53 130h50" stroke="#e1e8ef" stroke-width="1"/>
<rect x="53" y="136" width="44" height="3" rx="1.5" fill="#c9d3dc"/>
<rect x="53" y="143" width="30" height="3" rx="1.5" fill="#c9d3dc"/>
<!-- magnifier -->
<g class="lz">
<path d="M52 77l-12 12" stroke="#14293a" stroke-width="7" stroke-linecap="round"/>
<path d="M49 80l-7 7" stroke="#e3a843" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="64" cy="64" r="16" fill="#ffffff"/>
<g clip-path="url(#c5-lc)">
<rect x="44" y="44" width="40" height="40" fill="#fffaf0"/>
<g transform="translate(64 64) scale(1.3) translate(-64 -64)"><text x="79" y="69" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#e64626" text-anchor="middle">50g CO₂!</text></g>
<path d="M53 52a16 16 0 0 1 11-4" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</g>
<circle cx="64" cy="64" r="16" stroke="url(#c5-rim)" stroke-width="4.5" filter="url(#c5-sh)"/>
</g>
<!-- question tags -->
<g class="fl f2">
<g filter="url(#c5-sh)"><rect x="146" y="98" width="76" height="22" rx="11" fill="#ffffff"/></g>
<circle cx="157" cy="109" r="7" fill="#2f6db5"/>
<path d="M157 105.4a2 2 0 1 1 0 4m0 0v.6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/><circle cx="157" cy="112.6" r=".9" fill="#ffffff"/>
<text x="167" y="112.6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#14293a">Who says?</text>
</g>
<g class="fl f3">
<g filter="url(#c5-sh)"><rect x="152" y="128" width="72" height="22" rx="11" fill="#ffffff"/></g>
<circle cx="163" cy="139" r="7" fill="#7a4a8c"/>
<circle cx="163" cy="139" r="4" stroke="#ffffff" stroke-width="1.3"/><path d="M163 136.8v2.4l1.6 1" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
<text x="173" y="142.6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#14293a">How old?</text>
</g>
<!-- paused share -->
<g class="fl">
<circle cx="168" cy="56" r="15" fill="#ffffff" filter="url(#c5-sh)"/>
<circle cx="168" cy="56" r="11" fill="#fde6df"/>
<path d="M164.5 51v10M171.5 51v10" stroke="#e64626" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
