<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A graduation cap on a list of graduate qualities with ticks; the row 'Critical thinking' is highlighted in gold, next to a rolled diploma with a ribbon">
<title>Graduate qualities: critical thinking is on the list</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.ts{animation:ts 3s ease-in-out infinite;transform-box:view-box;transform-origin:62px 31px}
.hl{animation:hl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes ts{50%{transform:rotate(6deg)}}
@keyframes hl{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="c6-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2eef8"/><stop offset="1" stop-color="#e2dbef"/></linearGradient>
<pattern id="c6-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#7a4a8c" opacity=".14"/></pattern>
<linearGradient id="c6-card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient>
<linearGradient id="c6-head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f3a52"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="c6-cap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="c6-gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbe3a8"/><stop offset="1" stop-color="#f6cf74"/></linearGradient>
<linearGradient id="c6-roll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf7ef"/><stop offset=".5" stop-color="#f6efe1"/><stop offset="1" stop-color="#ddd0b4"/></linearGradient>
<radialGradient id="c6-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="c6-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".18"/></filter>
<path id="c6-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>
<path id="c6-tick" d="M-3 0l2 2.2L3.2-2.2" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</defs>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c6-bg)"/>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c6-dots)"/>
<g transform="translate(206 44)"><use href="#c6-st" class="tw" fill="#e3a843"/></g>
<g transform="translate(30 92)"><use href="#c6-st" class="tw t2" fill="#13887a" transform="scale(.8)"/></g>
<g transform="translate(212 160)"><use href="#c6-st" class="tw t3" fill="#7a4a8c" transform="scale(.6)"/></g>
<ellipse cx="124" cy="164" rx="74" ry="6" fill="url(#c6-gs)"/>
<!-- rolled diploma behind -->
<g transform="rotate(-18 190 132)">
<rect x="150" y="124" width="74" height="16" rx="8" fill="url(#c6-roll)" filter="url(#c6-sh)"/>
<ellipse cx="220" cy="132" rx="4" ry="8" fill="#e7dcc4"/>
<ellipse cx="220" cy="132" rx="1.8" ry="4" fill="#cbb991"/>
<rect x="182" y="123" width="8" height="18" fill="#e64626"/>
<path d="M186 141l-5 12 4-2 2 4 2-13z" fill="#c8401f"/>
</g>
<!-- list card -->
<rect x="56" y="46" width="128" height="112" rx="12" fill="url(#c6-card)" filter="url(#c6-sh)"/>
<path d="M56 58a12 12 0 0 1 12-12h104a12 12 0 0 1 12 12v6H56z" fill="url(#c6-head)"/>
<text x="131" y="59.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing=".3">GRADUATE QUALITIES</text>
<!-- rows -->
<g>
<circle cx="70" cy="76" r="5.5" fill="#2f6db5"/><use href="#c6-tick" x="70" y="76"/>
<rect x="81" y="74.5" width="68" height="3.4" rx="1.7" fill="#c9d3dc"/>
</g>
<rect class="hl" x="61" y="85" width="118" height="20" rx="7" fill="url(#c6-gold)"/>
<rect x="61" y="85" width="118" height="20" rx="7" stroke="#e3a843" stroke-width="1.2"/>
<circle cx="71" cy="95" r="6.5" fill="#e64626"/><use href="#c6-tick" x="71" y="95"/>
<text x="82" y="98.8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="800" fill="#14293a">Critical thinking</text>
<g>
<circle cx="70" cy="114" r="5.5" fill="#13887a"/><use href="#c6-tick" x="70" y="114"/>
<rect x="81" y="112.5" width="58" height="3.4" rx="1.7" fill="#c9d3dc"/>
</g>
<g>
<circle cx="70" cy="129" r="5.5" fill="#7a4a8c"/><use href="#c6-tick" x="70" y="129"/>
<rect x="81" y="127.5" width="72" height="3.4" rx="1.7" fill="#c9d3dc"/>
</g>
<g>
<circle cx="70" cy="144" r="5.5" fill="#2f7d6b"/><use href="#c6-tick" x="70" y="144"/>
<rect x="81" y="142.5" width="50" height="3.4" rx="1.7" fill="#c9d3dc"/>
</g>
<!-- graduation cap -->
<g class="fl">
<ellipse cx="62" cy="54" rx="22" ry="3" fill="#14293a" opacity=".18"/>
<path d="M46 38v9c0 4 7 7 16 7s16-3 16-7v-9z" fill="url(#c6-cap)"/>
<path d="M48 46c4 3 24 3 28 0" stroke="#ffffff" stroke-width="1" opacity=".2"/>
<path d="M62 18l32 13-32 13-32-13z" fill="#1f3a52"/>
<path d="M62 18l32 13-32 13-32-13z" fill="url(#c6-cap)" opacity=".85"/>
<path d="M34 30l28-11" stroke="#ffffff" stroke-width="1" opacity=".35"/>
<circle cx="62" cy="31" r="2.4" fill="#e3a843"/>
<g class="ts"><path d="M62 31l-21 8v14" stroke="#e3a843" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M38.5 52h5l1 9h-7z" fill="#e3a843"/><path d="M39 55v6M41 55v6M43 55v6" stroke="#b07a1e" stroke-width=".6"/></g>
</g>
</svg>
