<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Four coloured tiles for four critical thinking skills: 1 two speech bubbles for positions and perspectives, 2 a funnel for selecting relevant ideas, 3 a balance scale for evaluating ideas, 4 turning arrows for flexibility, joined by a gold lightbulb in the centre">
<title>Four critical thinking skills: identify, select, evaluate, be flexible</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.5s}.f3{animation-delay:-3s}.f4{animation-delay:-4.5s}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.rt{animation:rt 14s linear infinite;transform-box:fill-box;transform-origin:center}
.gl{animation:gl 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sc{animation:sc 4s ease-in-out infinite;transform-box:view-box;transform-origin:62px 120px}
@keyframes fl{50%{transform:translateY(-3px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes rt{to{transform:rotate(360deg)}}
@keyframes gl{50%{opacity:.4;transform:scale(1.2)}}
@keyframes sc{25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
<linearGradient id="c7-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf5f6"/><stop offset="1" stop-color="#d5e9ee"/></linearGradient>
<pattern id="c7-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#1f8cc4" opacity=".15"/></pattern>
<linearGradient id="c7-g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8a52"/><stop offset="1" stop-color="#1a5a31"/></linearGradient>
<linearGradient id="c7-g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3aa572"/><stop offset="1" stop-color="#22764d"/></linearGradient>
<linearGradient id="c7-g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2bb5a3"/><stop offset="1" stop-color="#178376"/></linearGradient>
<linearGradient id="c7-g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3aa3d8"/><stop offset="1" stop-color="#1872a3"/></linearGradient>
<linearGradient id="c7-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".28"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<radialGradient id="c7-bulb" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff4cf"/><stop offset=".6" stop-color="#f4c95e"/><stop offset="1" stop-color="#e3a843"/></radialGradient>
<radialGradient id="c7-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f6c766" stop-opacity=".6"/><stop offset="1" stop-color="#f6c766" stop-opacity="0"/></radialGradient>
<radialGradient id="c7-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="c7-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".2"/></filter>
<path id="c7-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>
</defs>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c7-bg)"/>
<path d="M40 30C70 6 160 4 200 24c30 16 32 58 24 92-8 34-46 52-104 50C64 164 20 148 15 110 10 72 14 48 40 30z" fill="url(#c7-dots)"/>
<g transform="translate(26 50)"><use href="#c7-st" class="tw" fill="#e3a843"/></g>
<g transform="translate(214 124)"><use href="#c7-st" class="tw t2" fill="#7a4a8c" transform="scale(.8)"/></g>
<g transform="translate(212 34)"><use href="#c7-st" class="tw t3" fill="#13887a" transform="scale(.6)"/></g>
<ellipse cx="120" cy="164" rx="76" ry="6" fill="url(#c7-gs)"/>
<!-- tile 1: positions and perspectives -->
<g>
<rect x="48" y="22" width="68" height="62" rx="13" fill="url(#c7-g1)" filter="url(#c7-sh)"/>
<rect x="48" y="22" width="68" height="30" rx="13" fill="url(#c7-gloss)"/>
<circle cx="60" cy="34" r="7" fill="#ffffff"/><text x="60" y="37.8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" fill="#1f6b3a" text-anchor="middle">1</text>
<path d="M70 44h18a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5h-10l-6 5v-5h-2a5 5 0 0 1-5-5v-8a5 5 0 0 1 5-5z" fill="#ffffff"/>
<path d="M90 52h14a5 5 0 0 1 5 5v8a5 5 0 0 1-5 5h-1v5l-6-5h-7a5 5 0 0 1-5-5v-8a5 5 0 0 1 5-5z" fill="#bfe6cc" stroke="#1f6b3a" stroke-width="1.5"/>
<path d="M71 51h12M71 55.5h8" stroke="#1f6b3a" stroke-width="1.8" stroke-linecap="round"/>
<path d="M92 59h11M92 63.5h7" stroke="#1f6b3a" stroke-width="1.8" stroke-linecap="round"/>
</g>
<!-- tile 2: selecting relevant ideas -->
<g>
<rect x="124" y="22" width="68" height="62" rx="13" fill="url(#c7-g2)" filter="url(#c7-sh)"/>
<rect x="124" y="22" width="68" height="30" rx="13" fill="url(#c7-gloss)"/>
<circle cx="136" cy="34" r="7" fill="#ffffff"/><text x="136" y="37.8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" fill="#2b8a5c" text-anchor="middle">2</text>
<circle cx="154" cy="35" r="3" fill="#ffffff" opacity=".6"/><circle cx="163" cy="31" r="3" fill="#e3a843"/><circle cx="172" cy="36" r="3" fill="#ffffff" opacity=".6"/><circle cx="180" cy="31" r="3" fill="#ffffff" opacity=".6"/>
<path d="M146 42h40l-14 16v12l-12 5V58z" fill="#ffffff"/>
<path d="M150 46h32" stroke="#2b8a5c" stroke-width="1.2" opacity=".5"/>
<circle cx="166" cy="78" r="3.4" fill="#e3a843" stroke="#ffffff" stroke-width="1.2"/>
</g>
<!-- tile 3: evaluating + own voice -->
<g>
<rect x="48" y="92" width="68" height="62" rx="13" fill="url(#c7-g3)" filter="url(#c7-sh)"/>
<rect x="48" y="92" width="68" height="30" rx="13" fill="url(#c7-gloss)"/>
<circle cx="60" cy="104" r="7" fill="#ffffff"/><text x="60" y="107.8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" fill="#1f9c8c" text-anchor="middle">3</text>
<path d="M82 112v30M74 143h16" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="82" cy="111" r="2.6" fill="#ffffff"/>
<g class="sc" style="transform-origin:82px 114px">
<path d="M66 116h32" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
<path d="M68 116l-5 12M68 116l5 12M96 116l-5 12M96 116l5 12" stroke="#ffffff" stroke-width="1" opacity=".8"/>
<path d="M61 128h14a7 4 0 0 1-14 0z" fill="#ffffff"/>
<path d="M89 128h14a7 4 0 0 1-14 0z" fill="#ffffff"/>
</g>
<path d="M98 101h10a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-6l-4 3v-3a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3z" fill="#e3a843"/>
<circle cx="100" cy="106" r=".9" fill="#14293a"/><circle cx="103" cy="106" r=".9" fill="#14293a"/><circle cx="106" cy="106" r=".9" fill="#14293a"/>
</g>
<!-- tile 4: showing flexibility -->
<g>
<rect x="124" y="92" width="68" height="62" rx="13" fill="url(#c7-g4)" filter="url(#c7-sh)"/>
<rect x="124" y="92" width="68" height="30" rx="13" fill="url(#c7-gloss)"/>
<circle cx="136" cy="104" r="7" fill="#ffffff"/><text x="136" y="107.8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" fill="#1f8cc4" text-anchor="middle">4</text>
<g class="rt">
<path d="M148 123a14 14 0 0 1 24-9" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
<path d="M174 107l-1 8-8-1" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M176 127a14 14 0 0 1-24 9" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
<path d="M150 143l1-8 8 1" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>
<!-- centre hub -->
<circle class="gl" cx="120" cy="88" r="17" fill="url(#c7-glow)"/>
<circle cx="120" cy="88" r="11" fill="#ffffff" filter="url(#c7-sh)"/>
<circle cx="120" cy="86" r="5.6" fill="url(#c7-bulb)"/>
<path d="M117.8 91h4.4v3h-4.4z" fill="#8a97a3"/>
<path d="M118.4 90.5v-2.6l.8-1.4.8 1.4.8-1.4.8 1.4v2.6" stroke="#b07a1e" stroke-width=".7" stroke-linejoin="round"/>
</svg>
