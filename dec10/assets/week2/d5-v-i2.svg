<style>
.fl{animation:fl 5.5s ease-in-out infinite}.f2{animation-delay:-1.8s}.f3{animation-delay:-3.6s}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.bl{animation:bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.b2{animation-delay:-1.9s}.b3{animation-delay:-3.1s}
.sw{animation:sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wv{animation:wv 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 90%}
.pu{animation:pu 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.st{animation:st 3s ease-in-out infinite}.s2{animation-delay:-1.5s}
.dr{stroke-dasharray:5 7;animation:dr 1.8s linear infinite}@keyframes dr{to{stroke-dashoffset:-24}}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
