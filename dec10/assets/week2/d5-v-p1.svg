.vp1-flip { animation: vp1-flip 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes vp1-flip { 0%, 70%, 100% { transform: scaleX(1); } 80% { transform: scaleX(.12); } 90% { transform: scaleX(1); } }
.vp1-flow { stroke-dasharray: 3 4; animation: vp1-flow 1.4s linear infinite; }
