.vp2-rip { animation: vp2-rip 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes vp2-rip { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
.vp2-tap { animation: vp2-tap 2.2s ease-in-out infinite; }
@keyframes vp2-tap { 0%, 100% { transform: translate(0, 0); } 12% { transform: translate(-1px, -3px); } 24% { transform: translate(0, 0); } }
.vp2-pop { animation: vp2-pop 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes vp2-pop { 0%, 100% { transform: scale(1); } 18% { transform: scale(1.25); } 32% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .vp2-rip { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
