<style>
.vp2-tw { animation: vp2-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes vp2-tw { 0%, 100% { opacity: .35; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
.vp2-fl { animation: vp2-fl 6s ease-in-out infinite; } .vp2-fl2 { animation: vp2-fl 7s ease-in-out -3s infinite; }
