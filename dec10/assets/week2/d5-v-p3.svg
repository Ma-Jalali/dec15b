<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A Stress Walk: a row of big and small rhythm dots matches a trail of footprints below — big coral footprints for firm steps on stressed words, small pale ones for soft steps on unstressed words">
<title>A Stress Walk: a row of big and small rhythm dots matches a trail of footprints below — big coral footprints for firm steps on stressed words, small pale ones for soft steps on unstressed words</title>
<style>
.vp3-tw { animation: vp3-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes vp3-tw { 0%, 100% { opacity: .35; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
.vp3-fl { animation: vp3-fl 6s ease-in-out infinite; } .vp3-fl2 { animation: vp3-fl 7s ease-in-out -3s infinite; }
@keyframes vp3-fl { 50% { transform: translateY(-3px); } }
.vp3-bl { animation: vp3-bl 4.6s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes vp3-bl { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.vp3-step { animation: vp3-step 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes vp3-step { 0%, 100% { transform: scale(1); } 8% { transform: scale(1.18); } 18% { transform: scale(1); } }
.vp3-hit { animation: vp3-hit 3.6s ease-out infinite; }
@keyframes vp3-hit { 0%, 100% { opacity: .35; } 8% { opacity: 1; } 30% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
