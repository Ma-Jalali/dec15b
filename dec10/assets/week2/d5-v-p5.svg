<g transform="translate(174 72) scale(0.9)"><g class="fl f2">
<path d="M-20 70c0-26 8-44 20-44s20 18 20 44z" fill="#d4583a"/><path d="M-14 26q-14 8-16 22" stroke="#d4583a" stroke-width="7" stroke-linecap="round"/>
<circle r="15" fill="#f1c7a5"/><path d="M-15-2c0-14 7-19 15-19s15 6 15 17c-5-6-12-8-19-6-5 1-8 4-11 8z" fill="#14293a"/>
<g class="bl"><circle cx="-5" cy="2" r="1.8" fill="#14293a"/><circle cx="5" cy="2" r="1.8" fill="#14293a"/></g><path d="M-4 8q4 3 8 0" stroke="#14293a" stroke-width="1.6" stroke-linecap="round"/></g></g><circle class="wv" cx="110" cy="80" r="8" stroke="#d4583a" stroke-width="2.2"/><circle class="wv w2" cx="110" cy="80" r="16" stroke="#d4583a" stroke-width="2.2"/><circle class="wv w3" cx="110" cy="80" r="24" stroke="#d4583a" stroke-width="2.2"/>
<g class="fl f3" filter="url(#s)"><rect x="94" y="24" width="52" height="26" rx="12" fill="#fff"/><path d="M112 50l-6 12 14-12z" fill="#fff"/><text x="120" y="42" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#d4583a" text-anchor="middle">a / b</text></g>
</svg>
