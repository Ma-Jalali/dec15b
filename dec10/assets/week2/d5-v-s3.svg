<path d="M-20 70c0-26 8-44 20-44s20 18 20 44z" fill="#d4583a"/><path class="sw" d="M14 24q16-10 18-30" stroke="#d4583a" stroke-width="7" stroke-linecap="round"/><circle cx="32" cy="-8" r="5" fill="#f1c7a5"/>
<circle r="15" fill="#f1c7a5"/><path d="M-15-2c0-14 7-19 15-19s15 6 15 17c-5-6-12-8-19-6-5 1-8 4-11 8z" fill="#14293a"/>
<g class="bl"><circle cx="-5" cy="2" r="1.8" fill="#14293a"/><circle cx="5" cy="2" r="1.8" fill="#14293a"/></g><path d="M-4 8q4 3 8 0" stroke="#14293a" stroke-width="1.6" stroke-linecap="round"/></g></g><g class="fl f2" filter="url(#s)"><rect x="130" y="26" width="70" height="54" rx="12" fill="#fff"/><path d="M148 80l-6 12 14-12z" fill="#fff"/><text x="165" y="62" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#e3a843" text-anchor="middle">?</text></g><circle class="wv" cx="165" cy="53" r="30" stroke="#e3a843" stroke-width="2.2"/><circle class="wv w2" cx="165" cy="53" r="38" stroke="#e3a843" stroke-width="2.2"/>
</svg>
