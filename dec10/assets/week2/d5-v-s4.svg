<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A Week 2 review game board: five coloured categories with 100 to 400 point boxes, some already played, one 300 box picked; a 25-second timer and a team buzzer">
<title>A Week 2 review game board: five coloured categories with 100 to 400 point boxes, some already played, one 300 box picked; a 25-second timer and a team buzzer</title>
<style>
.s4x-tw { animation: s4x-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes s4x-tw { 0%, 100% { opacity: .35; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
.s4x-fl { animation: s4x-fl 6s ease-in-out infinite; } .s4x-fb { animation: s4x-fl 6.5s ease-in-out -3s infinite; }
@keyframes s4x-fl { 50% { transform: translateY(-3px); } }
.s4x-bl { animation: s4x-bl 4.6s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes s4x-bl { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.s4x-pick { animation: s4x-pick 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes s4x-pick { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.s4x-hand { animation: s4x-hn 5s linear infinite; transform-origin: 204px 46px; }
@keyframes s4x-hn { to { transform: rotate(360deg); } }
.s4x-press { animation: s4x-pr 2.4s ease-in-out infinite; }
@keyframes s4x-pr { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(2px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
