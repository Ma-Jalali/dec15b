<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" fill="none" role="img" aria-label="Day 2 illustration"><title>Day 2: a podcast microphone sends sound waves across the picture. Around it float a phone, a laptop, a data centre, a game controller and a cloud of CO2. Two source cards — Griffiths (2020) and UNCTAD (2024) — and speech bubbles reading cause, effect, similarly and whereas connect everything with dotted lines.</title>
<style>.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
