<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" fill="none" role="img" aria-label="Day 3: a student presents a slide called “Impacts of Digital Devices”, with positive and negative impacts and sources. The audience asks a clarification question (“What do you mean by people?”) and a probing question (“Why is that important?”). Around them: a 2-minute stopwatch, a peer feedback form with ticks, and a SMART plan card.">
<title>Day 3: a student presents a slide called “Impacts of Digital Devices”, with positive and negative impacts and sources. The audience asks a clarification question (“What do you mean by people?”) and a probing question (“Why is that important?”). Around them: a 2-minute stopwatch, a peer feedback form with ticks, and a SMART plan card.</title>
