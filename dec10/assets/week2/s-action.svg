ill="#e5eaef"/><path d="M64 248h70" stroke="#d5dde5" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="248" r="5" fill="#e5eaef"/><circle cx="164" cy="248" r="5" fill="#e3a843"/><circle cx="178" cy="248" r="5" fill="#e5eaef"/></g><g class="sp" style="animation-duration:16s"><path d="M210 120a60 60 0 0 1 40-26" stroke="#2b776e" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/></g>
<path d="M210 170h30" stroke="#2b776e" stroke-width="6" stroke-linecap="round" class="dr"/><path d="M236 160l12 10-12 10" stroke="#2b776e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
