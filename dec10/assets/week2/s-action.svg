.sa-pen { animation: sa-pen 4.5s ease-in-out infinite; }
@keyframes sa-pen { 0% { transform: translate(-40px, 0); } 55%, 100% { transform: translate(0, 0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
