<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A Feedback Tool form with two rows marked Needs work turns, through a lightbulb of reflection, into an Action Plan 1 clipboard with specific actions ticked off and a pencil writing the next one; a Week 3 calendar card and looping arrows show the plan is used and feedback comes again">
<title>A Feedback Tool form with two rows marked Needs work turns, through a lightbulb of reflection, into an Action Plan 1 clipboard with specific actions ticked off and a pencil writing the next one; a Week 3 calendar card and looping arrows show the plan is used and feedback comes again</title>
