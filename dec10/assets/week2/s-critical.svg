<path d="M86 150c-6 10-4 18 2 24M196 150c6 10 4 18-2 24" stroke="#5aa0d6" stroke-width="3" stroke-dasharray="3 5" class="dr"/><text x="141" y="98" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a6d3b" text-anchor="middle">MAP · 1500</text></g>
<g transform="translate(170 150)"><g class="fl f3"><circle r="44" fill="#e8f3fb" stroke="#14293a" stroke-width="5"/><path d="M13.2 -24.200000000000003a26.4 26.4 0 0 1 17.6 19.8" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M31.68 31.68l30.799999999999997 30.799999999999997" stroke="#14293a" stroke-width="7" stroke-linecap="round"/></g></g>
<g class="fl f2"><circle cx="320" cy="120" r="38" fill="#f2c14e" filter="url(#s)"/><path d="M306 158h28v14h-28z" fill="#c9d3dc"/><path d="M308 176h24" stroke="#14293a" stroke-width="4" stroke-linecap="round"/><text x="320" y="134" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">?</text><circle class="wv" cx="320" cy="120" r="40" stroke="#f2c14e" stroke-width="2.2"/><circle class="wv w2" cx="320" cy="120" r="48" stroke="#f2c14e" stroke-width="2.2"/><circle class="wv w3" cx="320" cy="120" r="56" stroke="#f2c14e" stroke-width="2.2"/></g>
