<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<rect x="20" y="30" width="400" height="290" rx="34" fill="#e4ecf8"/><circle cx="360" cy="70" r="46" fill="#3a58a0" opacity=".12"/><circle cx="70" cy="280" r="34" fill="#3a58a0" opacity=".1"/><ellipse cx="220" cy="300" rx="150" ry="12" fill="#14293a" opacity=".08"/><path class="tw" d="M54 70h12m-6-6v12" stroke="#3a58a0" stroke-width="2.4" stroke-linecap="round"/><circle class="tw t2" cx="390" cy="250" r="3" fill="#f2c14e"/><path class="tw t3" d="M324 40h12m-6-6v12" stroke="#f2c14e" stroke-width="2.4" stroke-linecap="round"/><circle class="tw" cx="120" cy="300" r="3" fill="#d4583a"/><g class="fl"><g filter="url(#s)"><rect x="56" y="70" width="170" height="120" rx="10" fill="#f6ead2"/></g><path d="M66 80h150v100H66z" fill="#efe0bf"/>
