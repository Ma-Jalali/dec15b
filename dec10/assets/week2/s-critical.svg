<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A student holds a big magnifying glass over an old flat-Earth map; through the lens the Earth is round. A lightbulb with a question mark glows above, the student asks 'Why?', and three tags read Question it, Check it, Use it.">
<title>Introduction to critical thinking: question it, check it, use it</title>
<style>
.fl{animation:fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1s}.t3{animation-delay:-2s}.t4{animation-delay:-.5s}
.wv{animation:wv 3s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:1s}.w3{animation-delay:2s}
.gs{animation:gs 14s linear infinite}
.bl{animation:bl 5s infinite;transform-box:fill-box;transform-origin:center}
.lz{animation:lz 7s ease-in-out infinite;transform-box:view-box;transform-origin:300px 260px}
.wf{stroke-dasharray:4 5;animation:wf 1.2s linear infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes wv{0%{opacity:0;transform:scale(.8)}30%{opacity:.8}100%{opacity:0;transform:scale(1.35)}}
@keyframes gs{to{transform:translateX(-36px)}}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes lz{50%{transform:rotate(-2deg)}}
@keyframes wf{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.wv{opacity:.5}}
</style>
<defs>
<linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#d6e3f3"/></linearGradient>
<pattern id="sc-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#2f6db5" opacity=".12"/></pattern>
<linearGradient id="sc-parch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcf5e3"/><stop offset="1" stop-color="#ecdcb6"/></linearGradient>
<radialGradient id="sc-sea" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#8cc8f0"/><stop offset=".6" stop-color="#4f92d2"/><stop offset="1" stop-color="#2f6db5"/></radialGradient>
<linearGradient id="sc-rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98a5a"/><stop offset="1" stop-color="#6e4c33"/></linearGradient>
<linearGradient id="sc-land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd07e"/><stop offset="1" stop-color="#5d9e52"/></linearGradient>
<radialGradient id="sc-globe" cx=".36" cy=".32" r=".75"><stop offset="0" stop-color="#9fd3f5"/><stop offset=".55" stop-color="#4a8fd0"/><stop offset="1" stop-color="#1f4f8f"/></radialGradient>
<radialGradient id="sc-lensbg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f4f9ff"/><stop offset="1" stop-color="#d6e7f7"/></radialGradient>
<linearGradient id="sc-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34597a"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<radialGradient id="sc-bulb" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff4cf"/><stop offset=".55" stop-color="#f4c95e"/><stop offset="1" stop-color="#e3a843"/></radialGradient>
<radialGradient id="sc-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f6c766" stop-opacity=".5"/><stop offset="1" stop-color="#f6c766" stop-opacity="0"/></radialGradient>
<linearGradient id="sc-sweat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f80c6"/><stop offset="1" stop-color="#244f86"/></linearGradient>
<linearGradient id="sc-skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5d0b0"/><stop offset="1" stop-color="#eab896"/></linearGradient>
<radialGradient id="sc-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".2"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<filter id="sc-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="sc-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#14293a" flood-opacity=".16"/></filter>
<clipPath id="sc-lc"><circle cx="214" cy="168" r="46"/></clipPath>
<clipPath id="sc-gc"><circle cx="214" cy="168" r="34"/></clipPath>
<clipPath id="sc-panel"><rect x="16" y="20" width="408" height="304" rx="34"/></clipPath>
<path id="sc-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>
