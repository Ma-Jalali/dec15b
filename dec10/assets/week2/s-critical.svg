<circle cx="333" cy="195" r=".9" fill="#ffffff"/><circle cx="351" cy="195" r=".9" fill="#ffffff"/>
<path d="M343 200l-3 6h4" stroke="#c9906c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
