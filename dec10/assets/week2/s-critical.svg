<g class="bl"><circle cx="-5" cy="2" r="1.8" fill="#14293a"/><circle cx="5" cy="2" r="1.8" fill="#14293a"/></g><path d="M-4 8q4 3 8 0" stroke="#14293a" stroke-width="1.6" stroke-linecap="round"/></g></g>
