.sfb-sel { animation: sfb-sel 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sfb-sel { 50% { transform: scale(1.2); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
