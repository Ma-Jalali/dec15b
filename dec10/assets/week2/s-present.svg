<text x="118" y="90" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#d4583a" text-anchor="start" letter-spacing="1.6">MY TALK</text>
<g class="rv" style="animation-delay:0.0s"><rect x="118" y="106" width="64" height="86" rx="10" fill="#2b776e"/><text x="150" y="128" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#fff" text-anchor="middle" >Intro</text><path d="M128 146h44M128 160h34M128 174h40" stroke="#fff" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"/></g>
