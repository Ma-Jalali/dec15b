<g class="rv" style="animation-delay:0.5s"><rect x="266" y="106" width="64" height="86" rx="10" fill="#3a58a0"/><text x="298" y="128" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#fff" text-anchor="middle" >End</text><path d="M276 146h44M276 160h34M276 174h40" stroke="#fff" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"/></g>
