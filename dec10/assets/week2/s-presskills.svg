12-10-12h-20c-4 0-8 6-10 12z" fill="#8a5a2b"/><path d="M14-30c12 6 12 30 6 40" stroke="#8a5a2b" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="-6" cy="-12" r="2" fill="#14293a"/><circle cx="6" cy="-12" r="2" fill="#14293a"/><path d="M-5-3c3 3 7 3 10 0" stroke="#14293a" stroke-width="2" fill="none" stroke-linecap="round"/></g><g class="fl"><g transform="translate(60 80) scale(0.9)"><rect x="-55.0" y="-17.0" width="110" height="34" rx="14" fill="#3a58a0" filter="url(#s)"/><path d="M-41.0 16.0l-6 12 12-12z" fill="#3a58a0"/><text x="0" y="4.68" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Moving on…</text></g></g><g class="sp"><g transform="translate(390 250) scale(0.9)"><path d="M0-18l5 12 13 1-10 8 3 13-11-7-11 7 3-13-10-8 13-1z" fill="#e3a843"/></g></g><g class="sw"><g transform="translate(310 270) scale(0.8)"><rect x="-4" y="-40" width="8" height="70" rx="3" fill="#14293a"/><path d="M-4-36h56l12 10-12 10h-56z" fill="#3a58a0"/><text x="26" y="-22" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">NEXT</text></g></g></svg>
