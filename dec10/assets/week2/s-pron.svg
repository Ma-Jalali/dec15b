.pr-wv { animation: pr-wv 2.2s ease-in-out infinite; }
@keyframes pr-wv { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }
.pr-draw { stroke-dasharray: 400; animation: pr-draw 5s ease-in-out infinite; }
@keyframes pr-draw { 0% { stroke-dashoffset: 400; } 45%, 100% { stroke-dashoffset: 0; } }
.pr-bar { animation: pr-bar 1.3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pr-bar { 50% { transform: scaleY(.55); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
