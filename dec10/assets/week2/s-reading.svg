<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="An article page about internet habits with highlights, a question mark and three exclamation marks in the margin, and a phone sending CO₂">
<style>
  .fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
  .tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .tw2 { animation-delay: -1.4s; }
  .bl { animation: bl 1.6s steps(2) infinite; } .bl2 { animation-delay: -.5s; } .bl3 { animation-delay: -1.1s; }
  .flow { stroke-dasharray: 2 14; animation: flow 1.4s linear infinite; } .flow2 { animation-duration: 2.1s; }
  .rise { animation: rise 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .r2 { animation-delay: -2.3s; } .r3 { animation-delay: -4.6s; }
  .pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .pu2 { animation-delay: -1.2s; }
  .sp { animation: sp 14s linear infinite; transform-box: fill-box; transform-origin: center; }
  .dash { animation: dash 2.4s linear infinite; }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes bl { 0% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  @keyframes rise { 0% { transform: translateY(12px) scale(.9); opacity: 0; } 30% { opacity: .95; } 100% { transform: translateY(-40px) scale(1.08); opacity: 0; } }
  @keyframes pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes sp { to { transform: rotate(360deg); } }
  @keyframes dash { to { stroke-dashoffset: -44; } }
  .hl { stroke-dasharray: 150; animation: hl 5s ease-in-out infinite; } .h2 { animation-delay: -2.5s; } @keyframes hl { 0% { stroke-dashoffset: 150; } 40%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 150; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/></filter>
  <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".16"/></pattern>
</defs>
<ellipse cx="222" cy="300" rx="150" ry="12" fill="#14293a" opacity=".07"/>
<circle cx="220" cy="165" r="138" fill="#dfeee8"/>
<circle cx="220" cy="165" r="152" stroke="#2b776e" stroke-opacity=".25" stroke-dasharray="2 6" stroke-linecap="round"/>
<rect x="326" y="30" width="72" height="60" fill="url(#d)"/><rect x="36" y="238" width="60" height="48" fill="url(#d)"/>
<path class="tw" d="M50 106h22m-11-11v22" stroke="#2b776e" stroke-width="2.4" stroke-linecap="round"/>
<path class="tw tw2" d="M372 236h20m-10-10v20" stroke="#2b776e" stroke-width="2.4" stroke-linecap="round"/>

<g filter="url(#s)" transform="rotate(-3 200 180)"><rect x="92" y="54" width="200" height="246" rx="14" fill="#fff"/>
<text x="110" y="84" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#2b776e" text-anchor="start" letter-spacing="1.5">WHY YOUR INTERNET</text><text x="110" y="100" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#2b776e" text-anchor="start" letter-spacing="1.5">HABITS ARE NOT CLEAN</text>
<g stroke="#14293a" stroke-opacity=".2" stroke-width="5" stroke-linecap="round"><path d="M110 124h150"/><path d="M110 142h127"/><path d="M110 160h144"/><path d="M110 178h121"/><path d="M110 196h138"/><path d="M110 214h115"/><path d="M110 232h132"/><path d="M110 250h149"/><path d="M110 268h126"/></g>
<path class="hl" d="M110 142h140" stroke="#f2c14e" stroke-width="13" stroke-linecap="round" opacity=".6"/>
<path class="hl h2" d="M110 214h124" stroke="#9ed3bd" stroke-width="13" stroke-linecap="round" opacity=".75"/>
<ellipse cx="186" cy="178" rx="34" ry="12" stroke="#d4583a" stroke-width="3"/>
<path class="dash" d="M222 178c30 0 40-20 60-30" stroke="#d4583a" stroke-width="2.5" stroke-dasharray="5 5"/></g>
<g class="fl" filter="url(#s2)"><circle cx="316" cy="132" r="26" fill="#d4583a"/><text x="316" y="142" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#fff" text-anchor="middle">?</text></g>
<g class="fl fl2" filter="url(#s2)"><rect x="296" y="182" width="64" height="40" rx="12" fill="#e3a843"/><text x="328" y="210" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#14293a" text-anchor="middle">!!!</text></g>
<g class="fl fl3" filter="url(#s2)"><rect x="318" y="236" width="56" height="94" rx="12" fill="#14293a"/><rect x="324" y="248" width="44" height="66" rx="5" fill="#9ed3bd"/><circle cx="346" cy="322" r="4" fill="#fff"/></g>
<g class="rise"><g transform="translate(372 230) scale(0.7)"><path d="M-40 14a22 22 0 0 1 4-43 30 30 0 0 1 56-6 24 24 0 0 1 26 31 18 18 0 0 1-6 18z" fill="#c9d3da"/><text x="0" y="6" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#14293a" text-anchor="middle">CO₂</text></g></g>

</svg>
