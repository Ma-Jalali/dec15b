<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="Reading to speak: an article by Griffiths (2020), Why your internet habits are not clean, annotated with a yellow highlight on 53.6%, a red circle, a blue underline and margin notes !!! and ?; a phone sends CO₂ bubbles up to a big CO₂ cloud, and a student with glasses explains, because…">
<title>Reading to speak: the hidden carbon cost of the internet</title>
<style>
.sr-fl{animation:sr-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sr-f2{animation-delay:-2s}.sr-f3{animation-delay:-4s}
.sr-tw{animation:sr-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sr-t2{animation-delay:-1s}.sr-t3{animation-delay:-2s}.sr-t4{animation-delay:-.5s}
@keyframes sr-fl{50%{transform:translateY(-4px)}}
@keyframes sr-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.sr-dr{stroke-dasharray:90;animation:sr-dr 5s ease-in-out infinite}.sr-d2{animation-delay:.4s}.sr-d3{animation-delay:.8s}
@keyframes sr-dr{0%{stroke-dashoffset:90}35%,100%{stroke-dashoffset:0}}
.sr-rise{animation:sr-rise 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sr-r2{animation-delay:-1.7s}.sr-r3{animation-delay:-3.4s}
@keyframes sr-rise{0%{transform:translateY(14px) scale(.8);opacity:0}30%{opacity:1}100%{transform:translateY(-34px) scale(1.05);opacity:0}}
.sr-dat{stroke-dasharray:2 7;animation:sr-dat 1.4s linear infinite}
@keyframes sr-dat{to{stroke-dashoffset:-18}}
.sr-pn{animation:sr-pn 5s ease-in-out infinite}
@keyframes sr-pn{50%{transform:translate(-5px,-3px)}}
.sr-wv{animation:sr-wv 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes sr-wv{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>

<linearGradient id="sr-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecf7f2"/><stop offset="1" stop-color="#cfe6dc"/></linearGradient>
<pattern id="sr-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#2f7d6b" opacity=".13"/></pattern>
