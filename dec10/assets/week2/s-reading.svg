<linearGradient id="sr-pen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6cf62"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c98d2c"/></linearGradient>
<linearGradient id="sr-ph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a4458"/><stop offset="1" stop-color="#14293a"/></linearGradient>
