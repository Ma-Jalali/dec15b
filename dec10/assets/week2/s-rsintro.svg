<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="Research Summary starts today: a book, a video and a web page with a podcast flow into a magnifying glass that picks out one source with a gold star, then on to a Research Summary screen with a four-step timeline — Day 1 marked TODAY, Day 2, Day 2 and Day 4–5 — where two students stand ready to present">
<title>Introduction to research summary presentations: your first Research Summary starts today</title>
<style>
.si-fl{animation:si-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.si-f2{animation-delay:-2s}.si-f3{animation-delay:-4s}
.si-tw{animation:si-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.si-t2{animation-delay:-1s}.si-t3{animation-delay:-2s}.si-t4{animation-delay:-.5s}
@keyframes si-fl{50%{transform:translateY(-4px)}}
@keyframes si-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.si-flow{stroke-dasharray:2 7;animation:si-flow 1.4s linear infinite}
@keyframes si-flow{to{stroke-dashoffset:-18}}
.si-bob{animation:si-bob 2.4s ease-in-out infinite}
@keyframes si-bob{50%{transform:translateY(-3px)}}
.si-pu{animation:si-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes si-pu{50%{transform:scale(1.15)}}
.si-mg{animation:si-mg 6s ease-in-out infinite}
@keyframes si-mg{50%{transform:translate(-3px,3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>

<linearGradient id="si-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f1fa"/><stop offset="1" stop-color="#e3d3ec"/></linearGradient>
<pattern id="si-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#7a4a8c" opacity=".12"/></pattern>
<clipPath id="si-panel"><rect x="16" y="20" width="408" height="304" rx="34"/></clipPath>
<linearGradient id="si-pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient>
<linearGradient id="si-hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f5ea3"/><stop offset="1" stop-color="#6a3d7c"/></linearGradient>
<linearGradient id="si-scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a4458"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="si-bkl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7fc4"/><stop offset="1" stop-color="#2f5a9a"/></linearGradient>
<linearGradient id="si-bkr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a68ad"/><stop offset="1" stop-color="#6a3d7c"/></linearGradient>
<radialGradient id="si-lens" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efe4f4"/></radialGradient>
<linearGradient id="si-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34597a"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="si-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98a5a"/><stop offset="1" stop-color="#8a6240"/></linearGradient>
<radialGradient id="si-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".2"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<linearGradient id="si-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="si-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
