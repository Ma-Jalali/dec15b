<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A book, a video and a web page flow through a magnifying glass into a presentation screen with a four-day timeline">
<style>
  .fl { animation: fl 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .fl2 { animation-delay: -1.7s; } .fl3 { animation-delay: -3.3s; }
  .tw { animation: tw 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .tw2 { animation-delay: -1.4s; }
  .bl { animation: bl 1.6s steps(2) infinite; } .bl2 { animation-delay: -.5s; } .bl3 { animation-delay: -1.1s; }
  .flow { stroke-dasharray: 2 14; animation: flow 1.4s linear infinite; } .flow2 { animation-duration: 2.1s; }
  .rise { animation: rise 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .r2 { animation-delay: -2.3s; } .r3 { animation-delay: -4.6s; }
  .pu { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .pu2 { animation-delay: -1.2s; }
  .sp { animation: sp 14s linear infinite; transform-box: fill-box; transform-origin: center; }
  .dash { animation: dash 2.4s linear infinite; }
  @keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes tw { 0%, 100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes bl { 0% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes flow { to { stroke-dashoffset: -32; } }
  @keyframes rise { 0% { transform: translateY(12px) scale(.9); opacity: 0; } 30% { opacity: .95; } 100% { transform: translateY(-40px) scale(1.08); opacity: 0; } }
  @keyframes pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes sp { to { transform: rotate(360deg); } }
  @keyframes dash { to { stroke-dashoffset: -44; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="s" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/></filter>
  <filter id="s2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="d" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#14293a" opacity=".16"/></pattern>
</defs>
<ellipse cx="222" cy="300" rx="150" ry="12" fill="#14293a" opacity=".07"/>
<circle cx="220" cy="165" r="138" fill="#f1e8f5"/>
<circle cx="220" cy="165" r="152" stroke="#7a4a8c" stroke-opacity=".25" stroke-dasharray="2 6" stroke-linecap="round"/>
<rect x="326" y="30" width="72" height="60" fill="url(#d)"/><rect x="36" y="238" width="60" height="48" fill="url(#d)"/>
<path class="tw" d="M50 106h22m-11-11v22" stroke="#7a4a8c" stroke-width="2.4" stroke-linecap="round"/>
<path class="tw tw2" d="M372 236h20m-10-10v20" stroke="#7a4a8c" stroke-width="2.4" stroke-linecap="round"/>

<g class="fl" filter="url(#s2)"><rect x="56" y="70" width="70" height="52" rx="8" fill="#fff"/><rect x="62" y="76" width="58" height="34" rx="4" fill="#7a4a8c"/><path d="M84 84l14 9-14 9z" fill="#fff"/></g>
<g class="fl fl2" filter="url(#s2)"><path d="M56 150h28a10 10 0 0 1 10 10v44H66a10 10 0 0 1-10-10z" fill="#3a58a0"/><path d="M94 160a10 10 0 0 1 10-10h28v54h-28a10 10 0 0 0-10 10z" fill="#5a78c0"/></g>
<g class="fl fl3" filter="url(#s2)"><rect x="56" y="228" width="76" height="56" rx="8" fill="#fff"/><rect x="56" y="228" width="76" height="12" rx="6" fill="#2b776e"/><path d="M66 254h50M66 266h36" stroke="#14293a" stroke-opacity=".25" stroke-width="5" stroke-linecap="round"/></g>
<path class="flow" d="M132 96c40 0 40 70 60 70M140 178h52M136 256c40 0 40-80 56-80" stroke="#7a4a8c" stroke-width="4" stroke-linecap="round"/>
<g class="pu"><circle cx="208" cy="172" r="26" fill="#fff" fill-opacity=".5" stroke="#14293a" stroke-width="8"/><path d="M226 190l18 18" stroke="#14293a" stroke-width="10" stroke-linecap="round"/></g>
<g filter="url(#s)"><rect x="252" y="96" width="150" height="104" rx="10" fill="#14293a"/><rect x="260" y="104" width="134" height="86" rx="5" fill="#fbf6ec"/></g>
<path d="M326 200v52M300 252h52" stroke="#14293a" stroke-width="5" stroke-linecap="round"/>
<g class="pu"><circle cx="276" cy="150" r="11" fill="#7a4a8c"/><text x="276" y="155" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="middle">D1</text></g><g class="pu pu2"><circle cx="310" cy="150" r="11" fill="#3a58a0"/><text x="310" y="155" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="middle">D2</text></g><g class="pu"><circle cx="344" cy="150" r="11" fill="#2b776e"/><text x="344" y="155" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="middle">D3</text></g><g class="pu pu2"><circle cx="378" cy="150" r="11" fill="#e3a843"/><text x="378" y="155" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="middle">D4</text></g>
<path d="M287 150h12M321 150h12M355 150h12" stroke="#14293a" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
<text x="327" y="126" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#7a4a8c" text-anchor="middle" letter-spacing="1">RESEARCH SUMMARY</text>

</svg>
