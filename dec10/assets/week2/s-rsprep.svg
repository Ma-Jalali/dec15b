<path d="M150 136h24" stroke="#b07d12" stroke-width="3"/><path d="M170 131l7 5-7 5z" fill="#b07d12"/></g>
<g class="fl" filter="url(#s2)"><rect x="300" y="120" width="44" height="76" rx="22" fill="#14293a"/><path d="M290 170a32 32 0 0 0 64 0" stroke="#14293a" stroke-width="6" fill="none"/><path d="M322 202v32M302 236h40" stroke="#14293a" stroke-width="6" stroke-linecap="round"/>
<g stroke="#5d6a74" stroke-opacity=".5" stroke-width="3"><path d="M308 140h28M308 152h28M308 164h28"/></g></g>
