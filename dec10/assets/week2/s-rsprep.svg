<path d="M170 76v210" stroke="#d4583a" stroke-opacity=".35" stroke-width="2"/>
<text x="120" y="96" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="15" fill="#14293a" text-anchor="middle">Cause/s</text><text x="220" y="96" font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-weight="700" font-size="15" fill="#14293a" text-anchor="middle">Effects</text>
<g font-family="'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="12" fill="#3d505e"><text x="86" y="128">market econ</text><text x="86" y="150">↑ households</text><text x="180" y="128">invest. →</text><text x="180" y="150">construct.</text><text x="180" y="196">agr land ↓</text><text x="180" y="240">ecosyst. dmg</text></g>
