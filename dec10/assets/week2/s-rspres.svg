.rs-flow { stroke-dasharray: 4 5; animation: rs-flow 1.4s linear infinite; }
@keyframes rs-flow { to { stroke-dashoffset: -18; } }
.rs-hand { animation: rs-hand 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes rs-hand { 50% { transform: rotate(6deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
