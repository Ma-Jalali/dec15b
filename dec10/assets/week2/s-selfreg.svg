<title>A winding path of self-regulation with three stops leading to a goal flag, tonight’s homework (Steps 1–3): 1 Analyse the task (a magnifying glass over the content words and limiting words of a question), 2 Plan with subtasks, times and SMART goals, 3 Research one source and check it with CRAAP</title>
<style>
.ssr-tw { animation: ssr-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ssr-tw { 0%, 100% { opacity: .35; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
