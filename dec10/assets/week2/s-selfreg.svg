.ssr-bl { animation: ssr-bl 4.6s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ssr-bl { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.ssr-wave { animation: ssr-wave 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 50%; }
@keyframes ssr-wave { 0%, 100% { transform: skewY(0); } 50% { transform: skewY(-6deg) scaleX(.94); } }
.ssr-walk { stroke-dasharray: 2 9; animation: ssr-walk 2s linear infinite; }
@keyframes ssr-walk { to { stroke-dashoffset: -22; } }
.ssr-mag { animation: ssr-mag 4s ease-in-out infinite; }
@keyframes ssr-mag { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-18px, 0); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
