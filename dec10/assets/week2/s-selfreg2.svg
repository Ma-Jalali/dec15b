-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="middle">Research</text></g><g class="rv" style="animation-delay:0.36s"><circle cx="220.0" cy="290.0" r="30" fill="#4c8a3e" filter="url(#s)"/><text x="220.0" y="287.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="18" fill="#fff" text-anchor="middle">4</text><text x="220.0" y="303.0" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="middle">Draft</text></g><g class="rv" style="animation-delay:0.48s"><circle cx="117.8" cy="231.0" r="30" fill="#4c8a3e" filter="url(#s)"/><text x="117.80900235343626" y="228.00000000000006" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="18" fill="#fff" text-anchor="middle">5</text><text x="117.80900235343626" y="244.00000000000006" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="middle">Revise</text></g><g class="rv" style="animation-delay:0.60s"><circle cx="117.8" cy="113.0" r="30" fill="#4c8a3e" filter="url(#s)"/><text x="117.80900235343624" y="109.99999999999999" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="18" fill="#fff" text-anchor="middle">6</text><text x="117.80900235343624" y="125.99999999999999" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="middle">Reflect</text></g><g transform="translate(220 150) scale(1.0)"><path d="M-19 30c0-8 6-12 19-12s19 4 19 12v40h-38z" fill="#4c8a3e"/><path d="M-6 18l6 8 6-8" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity=".7"/><path d="M-17 26l-12-24-2-16" stroke="#4c8a3e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 26l12-24 2-16" stroke="#4c8a3e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-31" cy="-14" r="5" fill="#d9a07a"/><circle cx="31" cy="-14" r="5" fill="#d9a07a"/><rect x="-5" y="10" width="10" height="10" rx="3" fill="#d9a07a"/><circle r="16" fill="#d9a07a"/><path d="M-17 2c-3-16 7-23 17-23 11 0 21 8 17 23l-3 12c0-10-2-16-4-19-6 4-16 5-24 2-1 5-2 10-2 17z" fill="#1d1d24"/><g class="bl"><circle cx="-6" cy="-1" r="2" fill="#14293a"/><circle cx="6" cy="-1" r="2" fill="#14293a"/></g><path d="M-7 6c2 7 12 7 14 0z" stroke="#14293a" stroke-width="2" stroke-linecap="round" fill="#fff"/><circle cx="-11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/><circle cx="11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/></g><g class="fl"><rect x="190" y="220" width="60" height="40" rx="5" fill="#fff" filter="url(#s)"/><text x="220" y="236" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="8" fill="#c4562f" text-anchor="middle">MISTAKE</text><text x="220" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="8" fill="#c4562f" text-anchor="middle">LOG</text></g></svg>
