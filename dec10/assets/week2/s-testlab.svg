e cx="-11.0" cy="-19.1" r="1.8" fill="#8aa0b4"/><circle cx="0.0" cy="-22.0" r="1.8" fill="#8aa0b4"/><circle cx="11.0" cy="-19.1" r="1.8" fill="#8aa0b4"/><circle cx="19.1" cy="-11.0" r="1.8" fill="#8aa0b4"/><g class="sp"><path d="M0 0V-20" stroke="#c4562f" stroke-width="4" stroke-linecap="round"/><circle r="30" fill="none"/></g><circle r="4" fill="#14293a"/></g></g><g class="fl f2"><g transform="translate(80 110) scale(1)"><path d="M-34 6c0-26 14-40 34-40s34 14 34 40" stroke="#14293a" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="-42" y="0" width="16" height="30" rx="7" fill="#2f7d6b" filter="url(#s)"/><rect x="26" y="0" width="16" height="30" rx="7" fill="#2f7d6b" filter="url(#s)"/></g></g><g class="pu"><g transform="translate(370 250) scale(1)"><circle r="18" fill="#2f9a63" filter="url(#s)"/><path d="M-8 0l6 6 11-12" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="fl f3"><g transform="translate(80 260) scale(0.9)"><rect x="-40" y="-26" width="80" height="52" rx="8" fill="#fff" filter="url(#s)"/><text x="0" y="-6" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#b07d12" text-anchor="middle">Week 2</text><text x="0" y="16" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="900" fill="#14293a" text-anchor="middle">8 / 10</text></g></g></svg>
