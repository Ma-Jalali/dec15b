<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A spinner wheel with six coloured question icons (focus, sources, problems, library, surprise, try again) and a one-minute timer, beside a student who talks about their research in a speech bubble with a magnifying glass over a source">
<title>Spin the wheel and talk about your research for one minute</title>
<style>
.ra1-tw{animation:ra1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ra1-t2{animation-delay:-1s}.ra1-t3{animation-delay:-2s}
.ra1-fl{animation:ra1-fl 6s ease-in-out infinite}.ra1-f2{animation-delay:-2s}.ra1-f3{animation-delay:-4s}
.ra1-bl{animation:ra1-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.ra1-b2{animation-delay:-1.7s}.ra1-b3{animation-delay:-3.2s}.ra1-b4{animation-delay:-2.4s}
@keyframes ra1-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes ra1-fl{50%{transform:translateY(-3px)}}
@keyframes ra1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ra1-sp{animation:ra1-sp 8s cubic-bezier(.2,.7,.2,1) infinite;transform-box:view-box;transform-origin:84px 86px}
@keyframes ra1-sp{0%{transform:rotate(0)}40%,100%{transform:rotate(360deg)}}
.ra1-tk{animation:ra1-tk 8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes ra1-tk{0%,40%,100%{transform:rotate(0)}5%,15%,25%{transform:rotate(-14deg)}10%,20%,30%{transform:rotate(8deg)}}
.ra1-hd{animation:ra1-hd 8s linear infinite;transform-box:view-box;transform-origin:136px 141px}
@keyframes ra1-hd{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
