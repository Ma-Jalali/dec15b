<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A student in a hijab looks up from her notes and says her summary aloud, with a speech bubble saying Say it!; her note card has key words, a number and one hard word circled in red; a stopwatch shows 2 minutes">
