<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Group, don't list: findings on cards are sorted into two trays, CAUSE (a phone, a data centre, video streaming) and EFFECT (a CO2 cloud, e-waste, water); an AI card flies into the cause tray, and a small chip shows C leads to E">
<title>Group the findings: causes and effects</title>
<style>
.ra5-tw{animation:ra5-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.ra5-t2{animation-delay:-1s}.ra5-t3{animation-delay:-2s}
