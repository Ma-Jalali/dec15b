.ra5-fly{animation:ra5-fly 4.5s ease-in-out infinite}
@keyframes ra5-fly{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-3px,3px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
