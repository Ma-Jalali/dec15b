@keyframes ra5-fl{50%{transform:translateY(-3px)}}
@keyframes ra5-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ra5-dash{stroke-dasharray:3 4;animation:ra5-dash 1.2s linear infinite}
