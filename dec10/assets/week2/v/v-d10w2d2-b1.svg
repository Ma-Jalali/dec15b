e(140 96) scale(0.35)"><path d="M-30 46c0-24 12-36 30-36s30 12 30 36z" fill="#e3a843" filter="url(#s)"/><rect x="-6" y="2" width="12" height="12" fill="#a86f4c"/><circle cx="0" cy="-12" r="18" fill="#a86f4c"/><path d="M-18-18c4-12 30-14 36 0-8-4-28-6-36 0z" fill="#1d1d2b"/><circle cx="0" cy="-32" r="6" fill="#1d1d2b"/><circle cx="-6" cy="-12" r="2" fill="#14293a"/><circle cx="6" cy="-12" r="2" fill="#14293a"/><path d="M-5-3c3 3 7 3 10 0" stroke="#14293a" stroke-width="2" fill="none" stroke-linecap="round"/></g></g></svg>
