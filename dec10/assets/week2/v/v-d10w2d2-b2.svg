<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Word cards and a dictionary">
<style>.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}.t3{animation-delay:-.7s}
.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}.bl{animation:bl 1.8s steps(1) infinite}.b2{animation-delay:-.6s}.b3{animation-delay:-1.2s}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wv{animation:wv 2.7s ease-out infinite;opacity:.8;transform-box:fill-box;transform-origin:left center}.w2{animation-delay:.9s}.w3{animation-delay:1.8s}
.ri{animation:ri 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.r2{animation-delay:-2s}.r3{animation-delay:-4s}
.eq{animation:eq 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}.e2{animation-delay:-.3s}.e3{animation-delay:-.6s}.e4{animation-delay:-.9s}
.pb{animation:pb 8s linear infinite;transform-box:fill-box;transform-origin:left}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}@keyframes sw{50%{transform:rotate(6deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
@keyframes ri{0%{opacity:0;transform:translateY(8px)}20%,70%{opacity:.85}100%{opacity:0;transform:translateY(-22px)}}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes pb{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/></filter></defs>
<path transform="scale(1.0 1.0)" d="M44 38c22-30 78-34 118-14 34 17 50 54 36 88-14 34-56 50-98 44C54 150 18 118 22 82c2-18 10-32 22-44z" fill="#e3f1ec"/><path class="tw" d="M22 30h12m-6-6v12" stroke="#2f7d6b" stroke-width="2.4" stroke-linecap="round"/><circle class="tw t2" cx="210" cy="150" r="3" fill="#e3a843"/><circle class="tw" cx="208" cy="40" r="3" fill="#2f7d6b"/><path class="tw t2" d="M28 146h12m-6-6v12" stroke="#e3a843" stroke-width="2.4" stroke-linecap="round"/><g transform="translate(92 98) scale(1)"><rect x="-40" y="-46" width="80" height="92" rx="6" fill="#2f7d6b" filter="url(#s)"/><rect x="-34" y="-40" width="68" height="80" rx="3" fill="#fff"/><text x="0" y="-14" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="900" fill="#2f7d6b" text-anchor="middle">Aa</text><path d="M-22 6h44M-22 16h34M-22 26h40" stroke="#b9c6d3" stroke-width="3" stroke-linecap="round"/></g><g class="fl"><g transform="translate(170 62) scale(0.8)"><rect x="-41.0" y="-15.0" width="82" height="30" rx="14" fill="#c4562f" filter="url(#s)"/><path d="M-27.0 14.0l-6 12 12-12z" fill="#c4562f"/><text x="0" y="4.68" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">holistic</text></g></g><g class="fl f2"><g transform="translate(172 122) scale(0.8)"><rect x="-41.0" y="-15.0" width="82" height="30" rx="14" fill="#3a58a0" filter="url(#s)"/><path d="M27.0 14.0l6 12 -12-12z" fill="#3a58a0"/><text x="0" y="4.32" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">transition</text></g></g></svg>
