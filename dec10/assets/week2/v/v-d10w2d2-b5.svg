<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two partners' note cards side by side with swap arrows to compare notes, next to a test question paper (Q 4) with options A to D where C is chosen and ticked, and gold coins for betting on the answer">
