<title>Cause and effect: digital tech grows the environmental footprint</title>
<style>
.lb6-tw{animation:lb6-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.lb6-t2{animation-delay:-1s}.lb6-t3{animation-delay:-2s}
