></g><path class="dr" d="M104.0 70.0L122.0 84.0" stroke="#3a58a0" stroke-width="3.5" stroke-linecap="round"/><path d="M112.1 82.4L122.0 84.0L118.0 74.8" stroke="#3a58a0" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="dr" d="M104.0 124.0L122.0 110.0" stroke="#2f7d6b" stroke-width="3.5" stroke-linecap="round"/><path d="M118.0 119.2L122.0 110.0L112.1 111.6" stroke="#2f7d6b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
