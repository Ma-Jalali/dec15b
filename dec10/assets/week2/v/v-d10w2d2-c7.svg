"56" rx="6" fill="#fff" stroke="#14293a" stroke-width="3" filter="url(#s)"/><path d="M-10 0h20" stroke="#14293a" stroke-width="2"/><circle cx="-5" cy="-20" r="3" fill="#8a4f9e"/><circle cx="-5" cy="8" r="3" fill="#8a4f9e"/><circle cx="5" cy="8" r="3" fill="#8a4f9e"/><circle cx="-5" cy="16" r="3" fill="#8a4f9e"/></g></g></g><g class="fl f2"><g transform="translate(196 104) scale(0.9)"><g transform="rotate(48)"><rect x="-14" y="-28" width="28" height="56" rx="6" fill="#fff" stroke="#14293a" stroke-width="3" filter="url(#s)"/><path d="M-10 0h20" stroke="#14293a" stroke-width="2"/><circle cx="-5" cy="-20" r="3" fill="#b07d12"/><circle cx="5" cy="-20" r="3" fill="#b07d12"/><circle cx="-5" cy="8" r="3" fill="#b07d12"/><circle cx="5" cy="8" r="3" fill="#b07d12"/></g></g></g></svg>
