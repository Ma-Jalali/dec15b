<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A signpost with boards Begin, Next and Finally beside a road through the three body sections P, A and T of the IPAT talk, ending at a finish flag">
