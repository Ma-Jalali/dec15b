.pd2-fl { animation: pd2-fl 6s ease-in-out infinite; }
.pd2-fl2 { animation: pd2-fl 7s ease-in-out -3.5s infinite; }
@keyframes pd2-fl { 50% { transform: translateY(-3px); } }
.pd2-flow { stroke-dasharray: 3 4; animation: pd2-flow 1.4s linear infinite; }
@keyframes pd2-flow { to { stroke-dashoffset: -14; } }
.pd2-flag { animation: pd2-flag 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 50%; }
@keyframes pd2-flag { 50% { transform: skewY(-6deg) scaleX(.92); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
