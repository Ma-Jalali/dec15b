.oz-pop { animation: oz-pop 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes oz-pop { 0%, 40% { transform: scale(.85); } 55% { transform: scale(1.1); } 70%, 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
