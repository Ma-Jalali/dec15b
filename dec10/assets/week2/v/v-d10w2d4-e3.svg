 stroke-linecap="round" stroke-linejoin="round"/><path d="M17 28l6 32" stroke="#e3a843" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-23" cy="60" r="5" fill="#f5d6bd"/><circle cx="23" cy="60" r="5" fill="#f5d6bd"/><rect x="-5" y="10" width="10" height="10" rx="3" fill="#f5d6bd"/><circle r="16" fill="#f5d6bd"/><path d="M-16 -4c0-12 8-18 16-18s16 6 16 18c-6-4-10-9-12-12-6 6-12 10-20 12z" fill="#8a5a2b"/><g class="bl"><circle cx="-8" cy="-1" r="2" fill="#14293a"/><circle cx="4" cy="-1" r="2" fill="#14293a"/></g><path d="M-6 7c3 4 9 4 12 0" stroke="#14293a" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="-11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/><circle cx="11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/></g><g class="fl" filter="url(#s)"><path d="M30 18h60a12 12 0 0 1 12 12v4a12 12 0 0 1-12 12h-60a12 12 0 0 1-12-12v-4a12 12 0 0 1 12-12z" fill="#fff"/><path d="M30 45l-6 12 12-12z" fill="#fff"/></g><text x="60" y="36" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#c4562f" text-anchor="middle">Speak louder!</text><g class="fl f2" filter="url(#s)"><path d="M142 22h68a12 12 0 0 1 12 12v4a12 12 0 0 1-12 12h-68a12 12 0 0 1-12-12v-4a12 12 0 0 1 12-12z" fill="#fff"/><path d="M198 49l10 12 -2-12z" fill="#fff"/></g><text x="176" y="40" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#2f7d6b" text-anchor="middle">Look at us :)</text><g class="pu"><circle cx="120" cy="120" r="14" fill="#e3a843"/><path d="M114 118h0M126 118h0" stroke="#14293a" stroke-width="3" stroke-linecap="round"/><path d="M113 124c4 5 10 5 14 0" stroke="#14293a" stroke-width="2.2" stroke-linecap="round"/></g></svg>
