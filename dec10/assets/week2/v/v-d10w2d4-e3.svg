<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Classmates give feedback in speech bubbles: louder, eye contact, smile"><style>
.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}
.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:-1.2s}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}
.bl{animation:bl 4.2s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wv{animation:wv 2.7s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.9s}.w3{animation-delay:1.8s}
.rv{animation:rv .8s ease-out both}
.pb{animation:pb 7s linear infinite;transform-box:fill-box;transform-origin:left}
.ring{animation:ring .5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.85}100%{opacity:0;transform:scale(1.5)}}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pb{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes ring{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rv,.wv{opacity:1!important}}
