<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Hands on head means Do; hands on hips means Don’t"><style>
.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}
.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:-1.2s}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}
.bl{animation:bl 4.2s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wv{animation:wv 2.7s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.9s}.w3{animation-delay:1.8s}
.rv{animation:rv .8s ease-out both}
.pb{animation:pb 7s linear infinite;transform-box:fill-box;transform-origin:left}
.ring{animation:ring .5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.85}100%{opacity:0;transform:scale(1.5)}}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pb{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes ring{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rv,.wv{opacity:1!important}}
</style><defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/></filter></defs><g transform="translate(120 92) scale(1.0)"><path d="M-76-54c22-30 78-34 118-14 34 17 50 54 36 88-14 34-56 50-98 44-46-6-82-38-78-74 2-18 10-32 22-44z" fill="#fbe6dc"/></g><path class="tw" d="M22 30h12m-6-6v12" stroke="#c4562f" stroke-width="2.4" stroke-linecap="round"/><path class="tw t2" d="M204 150h12m-6-6v12" stroke="#e3a843" stroke-width="2.4" stroke-linecap="round"/><circle class="tw" cx="212" cy="36" r="3" fill="#c4562f"/><circle class="tw t2" cx="30" cy="148" r="3" fill="#e3a843"/><g transform="translate(72 82) scale(0.95)"><path d="M-19 30c0-8 6-12 19-12s19 4 19 12v40h-38z" fill="#2f7d6b"/><path d="M-6 18l6 8 6-8" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity=".7"/><path d="M-17 26l-14-16 14-18" stroke="#2f7d6b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 26l14-16-14-18" stroke="#2f7d6b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-17" cy="-8" r="5" fill="#f2c7a5"/><circle cx="17" cy="-8" r="5" fill="#f2c7a5"/><rect x="-5" y="10" width="10" height="10" rx="3" fill="#f2c7a5"/><circle r="16" fill="#f2c7a5"/><path d="M-16 -2c-2-14 8-20 16-20s18 5 16 20c-4-7-10-10-16-10s-12 3-16 10z" fill="#2b2433"/><g class="bl"><circle cx="-6" cy="-1" r="2" fill="#14293a"/><circle cx="6" cy="-1" r="2" fill="#14293a"/></g><path d="M-7 6c2 7 12 7 14 0z" stroke="#14293a" stroke-width="2" stroke-linecap="round" fill="#fff"/><circle cx="-11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/><circle cx="11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/></g><g transform="translate(170 82) scale(0.95)"><path d="M-19 30c0-8 6-12 19-12s19 4 19 12v40h-38z" fill="#c4562f"/><path d="M-6 18l6 8 6-8" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity=".7"/><path d="M-17 28l-15 18 14 12" stroke="#c4562f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 28l15 18-14 12" stroke="#c4562f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-18" cy="58" r="5" fill="#a8714f"/><circle cx="18" cy="58" r="5" fill="#a8714f"/><rect x="-5" y="10" width="10" height="10" rx="3" fill="#a8714f"/><circle r="16" fill="#a8714f"/><path d="M-16 -4c0-12 8-18 16-18s16 6 16 18c-6-4-10-9-12-12-6 6-12 10-20 12z" fill="#1d1d24"/><g class="bl"><circle cx="-6" cy="-1" r="2" fill="#14293a"/><circle cx="6" cy="-1" r="2" fill="#14293a"/></g><path d="M-5 8h10" stroke="#14293a" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="-11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/><circle cx="11" cy="5" r="2.6" fill="#e8907a" opacity=".45"/></g><g class="fl"><rect x="44" y="140" width="56" height="22" rx="11" fill="#2f7d6b"/><text x="72" y="155" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#fff" text-anchor="middle">DO</text></g><g class="fl f2"><rect x="138" y="140" width="64" height="22" rx="11" fill="#c4562f"/><text x="170" y="155" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" fill="#fff" text-anchor="middle">DON’T</text></g></svg>
