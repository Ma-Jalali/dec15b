 text-anchor="middle">3</text><circle cx="171" cy="100" r="13" fill="#8a4f9e"/><text x="171" y="104.68" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#fff" text-anchor="middle">4</text><circle cx="171" cy="132" r="13" fill="#8a4f9e"/><text x="171" y="136.68" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#fff" text-anchor="middle">5</text></g></svg>
