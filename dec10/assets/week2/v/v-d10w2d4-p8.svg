"M130 150h72" stroke="#8a4f9e" stroke-width="4" stroke-linecap="round"/><path d="M196 142l10 8-10 8" stroke="#8a4f9e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
