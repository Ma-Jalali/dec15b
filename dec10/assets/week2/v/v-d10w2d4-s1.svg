.s1-spin { animation: s1-spin 7s cubic-bezier(.3,.1,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
@keyframes s1-spin { 0% { transform: rotate(0); } 45%, 100% { transform: rotate(360deg); } }
.s1-tk { animation: s1-tk 7s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
@keyframes s1-tk { 0%, 40%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(-12deg); } 20% { transform: rotate(8deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
