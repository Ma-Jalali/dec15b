<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Six steps climb a hill to a flag"><style>
.fl{animation:fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation-delay:-1.7s}.f3{animation-delay:-3.3s}
.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.t2{animation-delay:-1.4s}
.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:-1.2s}
.dr{stroke-dasharray:6 8;animation:dr 1.6s linear infinite}
.bl{animation:bl 4.2s infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.wv{animation:wv 2.7s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}.w2{animation-delay:.9s}.w3{animation-delay:1.8s}
.rv{animation:rv .8s ease-out both}
.pb{animation:pb 7s linear infinite;transform-box:fill-box;transform-origin:left}
.ring{animation:ring .5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}}
@keyframes dr{to{stroke-dashoffset:-28}}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.85}100%{opacity:0;transform:scale(1.5)}}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pb{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes ring{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rv,.wv{opacity:1!important}}
</style><defs><filter id="s" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/></filter></defs><g transform="translate(120 92) scale(1.0)"><path d="M-76-54c22-30 78-34 118-14 34 17 50 54 36 88-14 34-56 50-98 44-46-6-82-38-78-74 2-18 10-32 22-44z" fill="#e4f1dc"/></g><path class="tw" d="M22 30h12m-6-6v12" stroke="#4c8a3e" stroke-width="2.4" stroke-linecap="round"/><path class="tw t2" d="M204 150h12m-6-6v12" stroke="#e3a843" stroke-width="2.4" stroke-linecap="round"/><circle class="tw" cx="212" cy="36" r="3" fill="#4c8a3e"/><circle class="tw t2" cx="30" cy="148" r="3" fill="#e3a843"/><path d="M14 160C70 150 110 110 150 80s50-40 76-46" stroke="#4c8a3e" stroke-width="5" stroke-linecap="round"/><circle cx="30" cy="156" r="11" fill="#2f7d6b"/><text x="30" y="159.96" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" text-anchor="middle">1</text><circle cx="68" cy="146" r="11" fill="#2f7d6b"/><text x="68" y="149.96" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" text-anchor="middle">2</text><circle cx="102" cy="124" r="11" fill="#2f7d6b"/><text x="102" y="127.96" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" text-anchor="middle">3</text><circle cx="138" cy="92" r="11" fill="#4c8a3e"/><text x="138" y="95.96" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" text-anchor="middle">4</text><circle cx="172" cy="68" r="11" fill="#4c8a3e"/><text x="172" y="71.96" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" text-anchor="middle">5</text><circle cx="204" cy="44" r="11" fill="#4c8a3e"/><text x="204" y="47.96" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" text-anchor="middle">6</text><path d="M220 40V6" stroke="#14293a" stroke-width="3" stroke-linecap="round"/><g class="sw"><path d="M220 8l20 7-20 7z" fill="#e3a843"/></g></svg>
