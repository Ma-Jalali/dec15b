><path class="sw" d="M168 92c-14-2-18-14-16-20 10 0 16 8 16 20zM168 84c12-2 18-12 16-20-10 0-16 8-16 20z" fill="#4c8a3e"/><path d="M150 116h36l-4 12h-28z" fill="#c4562f"/></g></svg>
