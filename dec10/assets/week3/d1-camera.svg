<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="Observation versus evaluation. Observation is like a camera: facts, numbers, times and places — I noticed that you looked at your phone five times during the meeting yesterday. Evaluation is like a judge: Omar is always on his phone during meetings. Words like always, never and every time are crossed out.">
<title>Observation or evaluation?</title>
<style>
.w3d1cm-fl{animation:w3d1cm-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1cm-f2{animation-delay:-2s}.w3d1cm-f3{animation-delay:-4s}
.w3d1cm-tw{animation:w3d1cm-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1cm-t2{animation-delay:-1s}.w3d1cm-t3{animation-delay:-2s}
.w3d1cm-sp{animation:w3d1cm-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1cm-slow{animation-duration:14s}
.w3d1cm-pu{animation:w3d1cm-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1cm-p2{animation-delay:-1.2s}
.w3d1cm-dr{stroke-dasharray:6 7;animation:w3d1cm-dr 1.5s linear infinite}
.w3d1cm-bl{animation:w3d1cm-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1cm-b2{animation-delay:-1.7s}.w3d1cm-b3{animation-delay:-3.1s}
.w3d1cm-sw{animation:w3d1cm-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1cm-ri{animation:w3d1cm-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1cm-r2{animation-delay:-1.7s}.w3d1cm-r3{animation-delay:-3.4s}
.w3d1cm-dw{stroke-dasharray:400;animation:w3d1cm-dw 6s ease-in-out infinite}
@keyframes w3d1cm-fl{50%{transform:translateY(-4px)}}
@keyframes w3d1cm-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1cm-sp{to{transform:rotate(360deg)}}
@keyframes w3d1cm-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1cm-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1cm-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1cm-sw{50%{transform:rotate(5deg)}}
@keyframes w3d1cm-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1cm-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="w3d1cm-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbefe8"/><stop offset="1" stop-color="#f2d6c6"/></linearGradient>
<pattern id="w3d1cm-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#b0512a" fill-opacity=".14"/></pattern>
<linearGradient id="w3d1cm-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d1cm-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e59a76"/><stop offset="1" stop-color="#b0512a"/></linearGradient>
<linearGradient id="w3d1cm-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfeaf2"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
<linearGradient id="w3d1cm-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd27f"/><stop offset="1" stop-color="#3f7a3a"/></linearGradient>
<linearGradient id="w3d1cm-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d77c9"/><stop offset="1" stop-color="#1f3a78"/></linearGradient>
<linearGradient id="w3d1cm-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf62"/><stop offset="1" stop-color="#d99a2b"/></linearGradient>
<radialGradient id="w3d1cm-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<radialGradient id="w3d1cm-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w3d1cm-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w3d1cm-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".16"/></filter>
<marker id="w3d1cm-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#b0512a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="w3d1cm-an" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#14293a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<path id="w3d1cm-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>

</defs>
<rect width="1000" height="440" rx="24" fill="#fbf6f2"/><rect width="1000" height="440" rx="24" fill="url(#w3d1cm-dots)" opacity=".7"/><g filter="url(#w3d1cm-sh)"><rect x="30" y="30" width="450" height="380" rx="22" fill="#e8f4ee"/><rect x="520" y="30" width="450" height="380" rx="22" fill="#fbefe8"/></g><text x="255" y="76" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f6b61" text-anchor="middle">OBSERVATION · a camera</text><text x="745" y="76" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#8a3c1d" text-anchor="middle">EVALUATION · a judge</text><g transform="translate(255 170)"><rect x="-70" y="-44" width="140" height="92" rx="14" fill="#2a4458"/><rect x="-36" y="-60" width="44" height="20" rx="6" fill="#2a4458"/><circle r="32" fill="#14293a"/><circle r="22" fill="#3a58a0"/><circle r="11" fill="#14293a"/><circle cx="-8" cy="-8" r="5" fill="#fff" opacity=".7"/><circle cx="52" cy="-30" r="6" fill="#e06d5a" class="w3d1cm-pu"/></g><g transform="translate(745 170)"><g class="w3d1cm-sw"><rect x="-14" y="-60" width="80" height="34" rx="8" fill="#8a5a2b" transform="rotate(-25)"/><rect x="-6" y="-30" width="14" height="80" rx="5" fill="#a5532c" transform="rotate(-25)"/></g><rect x="-60" y="52" width="120" height="16" rx="5" fill="#8a5a2b"/></g><g filter="url(#w3d1cm-sh2)"><rect x="60" y="270" width="390" height="110" rx="14" fill="#fff"/></g><text x="255" y="304" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">“I noticed that you looked at your</text><text x="255" y="330" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">phone five times during the</text><text x="255" y="356" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">meeting yesterday.”</text><g filter="url(#w3d1cm-sh2)"><rect x="550" y="270" width="390" height="110" rx="14" fill="#fff"/></g><text x="745" y="312" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">“Omar is always on his phone</text><text x="745" y="338" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">during meetings.”</text><text x="255" y="248" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#2c5a29" text-anchor="middle">facts · numbers · times · places</text><g class="w3d1cm-pu w3d1cm-p2"><rect x="554" y="220" width="92" height="30" rx="15.0" fill="#c4562f"/><text x="600.0" y="240.76" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">always</text><path d="M560 242l80-14" stroke="#fff" stroke-width="3"/></g><g class="w3d1cm-pu w3d1cm-p2"><rect x="664" y="220" width="92" height="30" rx="15.0" fill="#c4562f"/><text x="710.0" y="240.76" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">never</text><path d="M670 242l80-14" stroke="#fff" stroke-width="3"/></g><g class="w3d1cm-pu w3d1cm-p2"><rect x="774" y="220" width="92" height="30" rx="15.0" fill="#c4562f"/><text x="820.0" y="240.76" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">every time</text><path d="M780 242l80-14" stroke="#fff" stroke-width="3"/></g>
