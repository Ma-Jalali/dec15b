<rect width="1000" height="560" rx="24" fill="#f6faf7"/><rect width="1000" height="560" rx="24" fill="url(#w3d1cc-dots)" opacity=".7"/><rect x="70.0" y="23.0" width="860" height="74" rx="14" fill="#14293a" stroke="#14293a" stroke-width="3" filter="url(#w3d1cc-sh)"/><text x="500" y="54.965" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">The issue: the difficulty in defining and managing “green jobs”</text><text x="500" y="78.715" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">during the green growth transition</text><text x="250" y="140" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#0f6b61" text-anchor="middle">CAUSE</text><text x="750" y="140" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#8a3c1d" text-anchor="middle">EFFECT</text><rect x="50.0" y="159.0" width="400" height="74" rx="14" fill="#e8f4ee" stroke="#13887a" stroke-width="3" filter="url(#w3d1cc-sh)"/><text x="250" y="191.23" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">Lack of a clear definition</text><text x="250" y="213.73" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">for green jobs</text><rect x="550.0" y="159.0" width="400" height="74" rx="14" fill="#fbefe8" stroke="#b0512a" stroke-width="3" filter="url(#w3d1cc-sh)"/><text x="750" y="191.23" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">Difficulty for policymakers to assess</text><text x="750" y="213.73" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">the effects of environmental policies</text><path d="M454 196h80" stroke="#13887a" stroke-width="5" stroke-linecap="round" marker-end="url(#w3d1cc-mt)" class="w3d1cc-dr"/><g class="w3d1cc-pu w3d1cc-p2"><rect x="439" y="152" width="122" height="26" rx="13" fill="#e3a843"/><text x="500" y="170" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">Paragraph A</text></g><rect x="50.0" y="253.0" width="400" height="74" rx="14" fill="#e8f4ee" stroke="#13887a" stroke-width="3" filter="url(#w3d1cc-sh)"/><text x="250" y="285.23" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">Definition of green jobs</text><text x="250" y="307.73" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">influences policy decisions</text><rect x="550.0" y="253.0" width="400" height="74" rx="14" fill="#fbefe8" stroke="#b0512a" stroke-width="3" filter="url(#w3d1cc-sh)"/><text x="750" y="285.23" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">Green job classification</text><text x="750" y="307.73" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">becomes necessary</text><path d="M454 290h80" stroke="#13887a" stroke-width="5" stroke-linecap="round" marker-end="url(#w3d1cc-mt)" class="w3d1cc-dr"/><g class="w3d1cc-pu w3d1cc-p2"><rect x="469" y="246" width="62" height="26" rx="13" fill="#e3a843"/><text x="500" y="264" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">since</text></g><rect x="50.0" y="347.0" width="400" height="74" rx="14" fill="#e8f4ee" stroke="#13887a" stroke-width="3" filter="url(#w3d1cc-sh)"/><text x="250" y="379.23" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">Green and non-green jobs</text><text x="250" y="401.73" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">may use similar skills</text><rect x="550.0" y="347.0" width="400" height="74" rx="14" fill="#fbefe8" stroke="#b0512a" stroke-width="3" filter="url(#w3d1cc-sh)"/><text x="750" y="379.23" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">It influences the content</text><text x="750" y="401.73" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">of re-training programs</text><path d="M454 384h80" stroke="#13887a" stroke-width="5" stroke-linecap="round" marker-end="url(#w3d1cc-mt)" class="w3d1cc-dr"/><g class="w3d1cc-pu w3d1cc-p2"><rect x="424" y="340" width="152" height="26" rx="13" fill="#e3a843"/><text x="500" y="358" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">help determine</text></g><rect x="50.0" y="441.0" width="400" height="74" rx="14" fill="#e8f4ee" stroke="#13887a" stroke-width="3" filter="url(#w3d1cc-sh)"/><text x="250" y="473.23" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">Differences in skill sets between</text><text x="250" y="495.73" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">green and non-green jobs</text><rect x="550.0" y="441.0" width="400" height="74" rx="14" fill="#fbefe8" stroke="#b0512a" stroke-width="3" filter="url(#w3d1cc-sh)"/><text x="750" y="473.23" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">Workers in non-green jobs may</text><text x="750" y="495.73" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#14293a" text-anchor="middle">require extensive training</text><path d="M454 478h80" stroke="#13887a" stroke-width="5" stroke-linecap="round" marker-end="url(#w3d1cc-mt)" class="w3d1cc-dr"/><g class="w3d1cc-pu w3d1cc-p2"><rect x="449" y="434" width="102" h