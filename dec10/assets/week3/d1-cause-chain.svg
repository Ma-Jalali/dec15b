<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none" role="img" aria-label="The causal chain in Paragraphs A and B. Issue: the difficulty in defining and managing green jobs. Lack of a clear definition leads to difficulty for policymakers to assess the effects of environmental policies. Since the definition influences policy decisions, classification becomes necessary. Similar skills help determine the content of re-training programmes. If skill sets are different, then workers in non-green jobs may require extensive training.">
<title>The causal chain of an issue</title>
<style>
.w3d1cc-fl{animation:w3d1cc-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1cc-f2{animation-delay:-2s}.w3d1cc-f3{animation-delay:-4s}
.w3d1cc-tw{animation:w3d1cc-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1cc-t2{animation-delay:-1s}.w3d1cc-t3{animation-delay:-2s}
.w3d1cc-sp{animation:w3d1cc-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1cc-slow{animation-duration:14s}
.w3d1cc-pu{animation:w3d1cc-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1cc-p2{animation-delay:-1.2s}
.w3d1cc-dr{stroke-dasharray:6 7;animation:w3d1cc-dr 1.5s linear infinite}
.w3d1cc-bl{animation:w3d1cc-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1cc-b2{animation-delay:-1.7s}.w3d1cc-b3{animation-delay:-3.1s}
.w3d1cc-sw{animation:w3d1cc-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1cc-ri{animation:w3d1cc-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1cc-r2{animation-delay:-1.7s}.w3d1cc-r3{animation-delay:-3.4s}
.w3d1cc-dw{stroke-dasharray:400;animation:w3d1cc-dw 6s ease-in-out infinite}
@keyframes w3d1cc-fl{50%{transform:translateY(-4px)}}
@keyframes w3d1cc-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1cc-sp{to{transform:rotate(360deg)}}
@keyframes w3d1cc-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1cc-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1cc-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1cc-sw{50%{transform:rotate(5deg)}}
@keyframes w3d1cc-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1cc-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
