<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="Binary versus continuum. Binary: a switch with only two options, not green or green. Continuum: a colour bar from grey to deep green with jobs along it — office secretary (few green tasks), sales manager (indirectly green), energy adviser (many green tasks), solar installer (mostly green tasks).">
<title>Green is a continuum, not a binary characteristic</title>
<style>
.w3d1ct-fl{animation:w3d1ct-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1ct-f2{animation-delay:-2s}.w3d1ct-f3{animation-delay:-4s}
.w3d1ct-tw{animation:w3d1ct-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1ct-t2{animation-delay:-1s}.w3d1ct-t3{animation-delay:-2s}
.w3d1ct-sp{animation:w3d1ct-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1ct-slow{animation-duration:14s}
.w3d1ct-pu{animation:w3d1ct-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1ct-p2{animation-delay:-1.2s}
.w3d1ct-dr{stroke-dasharray:6 7;animation:w3d1ct-dr 1.5s linear infinite}
.w3d1ct-bl{animation:w3d1ct-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1ct-b2{animation-delay:-1.7s}.w3d1ct-b3{animation-delay:-3.1s}
.w3d1ct-sw{animation:w3d1ct-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1ct-ri{animation:w3d1ct-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1ct-r2{animation-delay:-1.7s}.w3d1ct-r3{animation-delay:-3.4s}
.w3d1ct-dw{stroke-dasharray:400;animation:w3d1ct-dw 6s ease-in-out infinite}
@keyframes w3d1ct-fl{50%{transform:translateY(-4px)}}
@keyframes w3d1ct-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1ct-sp{to{transform:rotate(360deg)}}
@keyframes w3d1ct-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1ct-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1ct-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1ct-sw{50%{transform:rotate(5deg)}}
@keyframes w3d1ct-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1ct-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
