<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" fill="none" role="img" aria-label="Two columns. Real feelings are adjectives, with faces: anxious, concerned, nervous, excited, upset, frustrated, worried, disappointed, overwhelmed, relieved. Thoughts in disguise, with a mask: I feel like…, I feel that…, I feel as if…, I feel you / he / they…, I feel attacked, I feel it is useless. Test: if you can say think, it is a thought.">
<title>Feelings or thoughts?</title>
<style>
.w3d1ft-fl{animation:w3d1ft-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1ft-f2{animation-delay:-2s}.w3d1ft-f3{animation-delay:-4s}
.w3d1ft-tw{animation:w3d1ft-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1ft-t2{animation-delay:-1s}.w3d1ft-t3{animation-delay:-2s}
.w3d1ft-sp{animation:w3d1ft-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1ft-slow{animation-duration:14s}
.w3d1ft-pu{animation:w3d1ft-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1ft-p2{animation-delay:-1.2s}
.w3d1ft-dr{stroke-dasharray:6 7;animation:w3d1ft-dr 1.5s linear infinite}
.w3d1ft-bl{animation:w3d1ft-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1ft-b2{animation-delay:-1.7s}.w3d1ft-b3{animation-delay:-3.1s}
.w3d1ft-sw{animation:w3d1ft-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1ft-ri{animation:w3d1ft-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1ft-r2{animation-delay:-1.7s}.w3d1ft-r3{animation-delay:-3.4s}
.w3d1ft-dw{stroke-dasharray:400;animation:w3d1ft-dw 6s ease-in-out infinite}
@keyframes w3d1ft-fl{50%{transform:translateY(-4px)}}
@keyframes w3d1ft-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1ft-sp{to{transform:rotate(360deg)}}
@keyframes w3d1ft-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1ft-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1ft-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1ft-sw{50%{transform:rotate(5deg)}}
@keyframes w3d1ft-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1ft-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
