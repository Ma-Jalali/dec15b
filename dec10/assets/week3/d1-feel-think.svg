<rect width="1000" height="480" rx="24" fill="#fbf6f2"/><rect width="1000" height="480" rx="24" fill="url(#w3d1ft-dots)" opacity=".7"/><g filter="url(#w3d1ft-sh)"><rect x="30" y="30" width="450" height="420" rx="22" fill="#fff"/><rect x="520" y="30" width="450" height="420" rx="22" fill="#fff"/></g><rect x="30" y="30" width="450" height="54" rx="22" fill="#3f7a3a"/><rect x="30" y="64" width="450" height="20" fill="#3f7a3a"/><rect x="520" y="30" width="450" height="54" rx="22" fill="#b0512a"/><rect x="520" y="64" width="450" height="20" fill="#b0512a"/><text x="255" y="66" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Real feelings (adjectives)</text><text x="745" y="66" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Thoughts in disguise</text><g transform="translate(70 126)"><circle r="20" fill="#3a58a0"/><circle cx="-6" cy="-5" r="2.5" fill="#14293a"/><circle cx="6" cy="-5" r="2.5" fill="#14293a"/><path d="M-6 6q6-6 12 0" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" fill="none"/></g><text x="102" y="133" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" fill="#14293a" text-anchor="start">anxious</text><g transform="translate(290 126)"><circle r="20" fill="#7a4a8c"/><circle cx="-6" cy="-5" r="2.5" fill="#14293a"/><circle cx="6" cy="-5" r="2.5" fill="#14293a"/><path d="M-6 6q6-6 12 0" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" fill="none"/></g><text x="322" y="133" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" fill="#14293a" text-anchor="start">concerned</text><g transform="translate(70 188)"><circle r="20" fill="#3a58a0"/><circle cx="-6" cy="-5" r="2.5" fill="#14293a"/><circle cx="6" cy="-5" r="2.5" fill="#14293a"/><path d="M-6 6q6-6 12 0" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" fill="none"/></g><text x="102" y="195" font-family="Manrope, Arial, sa