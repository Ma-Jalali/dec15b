nt-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" fill="#14293a" text-anchor="start">disappointed</text><g transform="translate(70 374)"><circle r="20" fill="#7a4a8c"/><circle cx="-6" cy="-5" r="2.5" fill="#14293a"/><circle cx="6" cy="-5" r="2.5" fill="#14293a"/><path d="M-6 6q6-6 12 0" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" fill="none"/></g><text x="102" y="381" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" fill="#14293a" text-anchor="start">overwhelmed</text><g transform="translate(290 374)"><circle r="20" fill="#3f7a3a"/><circle cx="-6" cy="-5" r="2.5" fill="#14293a"/><circle cx="6" cy="-5" r="2.5" fill="#14293a"/><path d="M-6 3q6 6 12 0" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" fill="none"/></g><text x="322" y="381" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" fill="#14293a" text-anchor="start">relieved</text><g class="w3d1ft-fl w3d1ft-f1"><rect x="560" y="104" width="300" height="40" rx="20" fill="#fbefe8"/><text x="578" y="131" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" fill="#8a3c1d" text-anchor="start">I feel like …</text></g><g class="w3d1ft-fl w3d1ft-f2"><rect x="560" y="156" width="300" height="40" rx="20" fill="#fbefe8"/><text x="578" y="183" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" fill="#8a3c1d" text-anchor="start">I feel that …</text></g><g class="w3d1ft-fl w3d1ft-f3"><rect x="560" y="208" width="300" height="40" rx="20" fill="#fbefe8"/><text x="578" y="235" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" fill="#8a3c1d" text-anchor="start">I feel as if …</text></g><g class="w3d1ft-fl w3d1ft-f1"><rect x="560" y="260" width="300" height="40" rx="20" fill="#fbefe8"/><text x="578" y="287" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" fill="#8a3c1d" text-anchor="start">I feel you / he / they …</text></g><g class="w3d1ft-fl w3