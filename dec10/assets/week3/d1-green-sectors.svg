<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" fill="none" role="img" aria-label="Green jobs can be in old and new sectors. Traditional sectors: agriculture, manufacturing, construction and administration. New and emerging green sectors: renewable energy, energy efficiency, recycling and waste, and research (R&amp;D). Shared goals: protect the environment, cut pollution and waste, use less energy and water, decent work.">
