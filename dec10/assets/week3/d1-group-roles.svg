<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="Four group role cards around a rotate arrow. Chair: starts, invites and keeps everyone talking — What do you think? Timekeeper: watches the clock — Two minutes left. Language monitor: ticks the phrases people use — You used 4 phrases! Reporter: tells the class the result — Our group found that … The roles change every activity.">
<title>Group roles</title>
<style>
.w3d1gr-fl{animation:w3d1gr-fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1gr-d1{animation-delay:-1.3s}.w3d1gr-d2{animation-delay:-2.6s}.w3d1gr-d3{animation-delay:-3.9s}
.w3d1gr-pu{animation:w3d1gr-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d1gr-dr{stroke-dasharray:8 8;animation:w3d1gr-dr 1.4s linear infinite}
.w3d1gr-sp{animation:w3d1gr-sp 12s linear infinite;transform-box:view-box;transform-origin:500px 238px}
.w3d1gr-tw{animation:w3d1gr-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d1gr-bl{animation:w3d1gr-bl 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w3d1gr-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d1gr-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w3d1gr-dr{to{stroke-dashoffset:-32}}
@keyframes w3d1gr-sp{to{transform:rotate(360deg)}}
@keyframes w3d1gr-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1gr-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="w3d1gr-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf1ea"/><stop offset="1" stop-color="#f1dccd"/></linearGradient>
<pattern id="w3d1gr-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#b0512a" fill-opacity=".16"/></pattern>
