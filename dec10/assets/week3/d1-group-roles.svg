r="start">ticks phrases people use</text><rect x="194" y="366" width="182" height="34" rx="17" fill="#13887a" fill-opacity=".1"/><text x="285" y="388" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#13887a" text-anchor="middle">“You used 4 phrases!”</text></g><g class="w3d1gr-fl w3d1gr-d3"><g filter="url(#w3d1gr-sh)"><rect x="610" y="270" width="300" height="150" rx="20" fill="#fff"/></g><rect x="610" y="270" width="300" height="10" rx="5" fill="#7a4a8c"/><circle cx="666" cy="340" r="38" fill="#7a4a8c" fill-opacity=".12"/><g transform="translate(666 338)"><path d="M-22 -8h10l22-14v40L-12 4h-10z" fill="#7a4a8c"/><path d="M18 -10q8 8 0 16M24 -16q14 14 0 28" stroke="#7a4a8c" stroke-width="3.5" stroke-linecap="round" fill="none" class="w3d1gr-tw"/></g><text x="718" y="322" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#7a4a8c" text-anchor="start">Reporter</text><text x="718" y="350" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#3b4a5c" text-anchor="start">tells the class the result</text><rect x="714" y="366" width="182" height="34" rx="17" fill="#7a4a8c" fill-opacity=".1"/><text x="805" y="388" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#7a4a8c" text-anchor="middle">“Our group found that …”</text></g>
