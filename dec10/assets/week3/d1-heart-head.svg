="800" fill="#3a58a0" text-anchor="middle">“I feel like you are</text><text x="830" y="262" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#3a58a0" text-anchor="middle">not listening to me.”</text><text x="830" y="330" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#3b4a5c" text-anchor="middle">feel + like / that / as if / you</text>
