<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="Two students. Left: hand on heart means feeling, for example I’m nervous about the presentation — a real feeling word, an adjective. Right: hand on head means thought, for example I feel like you are not listening to me — feel plus like, that, as if or you.">
<title>Feeling or thought</title>
<style>
.w3d1hh-fl{animation:w3d1hh-fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1hh-d1{animation-delay:-1.3s}.w3d1hh-d2{animation-delay:-2.6s}.w3d1hh-d3{animation-delay:-3.9s}
.w3d1hh-pu{animation:w3d1hh-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d1hh-dr{stroke-dasharray:8 8;animation:w3d1hh-dr 1.4s linear infinite}
.w3d1hh-sp{animation:w3d1hh-sp 12s linear infinite;transform-box:view-box;transform-origin:500px 230px}
.w3d1hh-tw{animation:w3d1hh-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d1hh-bl{animation:w3d1hh-bl 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w3d1hh-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d1hh-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w3d1hh-dr{to{stroke-dashoffset:-32}}
@keyframes w3d1hh-sp{to{transform:rotate(360deg)}}
@keyframes w3d1hh-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1hh-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="w3d1hh-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf1ea"/><stop offset="1" stop-color="#f3e1d3"/></linearGradient>
