<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="Jigsaw reading in two steps. Step 1, expert groups: Group 1 reads paragraphs 1–2, Group 2 reads paragraphs 3–4, Group 3 reads paragraphs 5–6. Step 2, new mixed groups: one student from each group sits together and teaches their part.">
<title>Jigsaw reading</title>
<style>
.w3d1jg-fl{animation:w3d1jg-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1jg-f2{animation-delay:-2s}.w3d1jg-f3{animation-delay:-4s}
.w3d1jg-tw{animation:w3d1jg-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1jg-t2{animation-delay:-1s}.w3d1jg-t3{animation-delay:-2s}
.w3d1jg-sp{animation:w3d1jg-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1jg-slow{animation-duration:14s}
.w3d1jg-pu{animation:w3d1jg-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1jg-p2{animation-delay:-1.2s}
.w3d1jg-dr{stroke-dasharray:6 7;animation:w3d1jg-dr 1.5s linear infinite}
.w3d1jg-bl{animation:w3d1jg-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1jg-b2{animation-delay:-1.7s}.w3d1jg-b3{animation-delay:-3.1s}
.w3d1jg-sw{animation:w3d1jg-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1jg-ri{animation:w3d1jg-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1jg-r2{animation-delay:-1.7s}.w3d1jg-r3{animation-delay:-3.4s}
.w3d1jg-dw{stroke-dasharray:400;animation:w3d1jg-dw 6s ease-in-out infinite}
@keyframes w3d1jg-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes w3d1jg-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1jg-sp{to{transform:rotate(360deg)}}
@keyframes w3d1jg-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1jg-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1jg-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1jg-sw{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes w3d1jg-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1jg-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
