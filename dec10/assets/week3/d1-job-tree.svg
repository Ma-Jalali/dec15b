<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" fill="none" role="img" aria-label="Tree diagram of O*NET-listed occupations. They split into Green and Non-green. Green splits into Increased Demand (ID), Enhanced Skills (ES) and New and Emerging (NE). Non-green splits into Green rival and Other. An arrow from Enhanced Skills points to an example: General and Operations Managers (Green ES), with tasks, skills, career starters and career changers.">
<title>Job types in O*NET (based on Bowen et al., 2018, Fig. 1)</title>
<style>
.w3d1jt-fl{animation:w3d1jt-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1jt-f2{animation-delay:-2s}.w3d1jt-f3{animation-delay:-4s}
.w3d1jt-tw{animation:w3d1jt-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1jt-t2{animation-delay:-1s}.w3d1jt-t3{animation-delay:-2s}
.w3d1jt-sp{animation:w3d1jt-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1jt-slow{animation-duration:14s}
.w3d1jt-pu{animation:w3d1jt-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1jt-p2{animation-delay:-1.2s}
.w3d1jt-dr{stroke-dasharray:6 7;animation:w3d1jt-dr 1.5s linear infinite}
.w3d1jt-bl{animation:w3d1jt-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1jt-b2{animation-delay:-1.7s}.w3d1jt-b3{animation-delay:-3.1s}
.w3d1jt-sw{animation:w3d1jt-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1jt-ri{animation:w3d1jt-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1jt-r2{animation-delay:-1.7s}.w3d1jt-r3{animation-delay:-3.4s}
.w3d1jt-dw{stroke-dasharray:400;animation:w3d1jt-dw 6s ease-in-out infinite}
@keyframes w3d1jt-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes w3d1jt-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1jt-sp{to{transform:rotate(360deg)}}
@keyframes w3d1jt-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1jt-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1jt-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1jt-sw{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes w3d1jt-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1jt-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
