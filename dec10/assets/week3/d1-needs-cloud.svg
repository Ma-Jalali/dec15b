tion</text></g><g class="w3d1nd-fl w3d1nd-f3"><rect x="614" y="242" width="148" height="34" rx="17" fill="#3a58a0" fill-opacity=".12"/><text x="688" y="265" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Acknowledgement</text></g><g class="w3d1nd-fl w3d1nd-f1"><rect x="614" y="290" width="148" height="34" rx="17" fill="#3a58a0" fill-opacity=".12"/><text x="688" y="313" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Appreciation</text></g><g class="w3d1nd-fl w3d1nd-f2"><rect x="614" y="338" width="148" height="34" rx="17" fill="#3a58a0" fill-opacity=".12"/><text x="688" y="361" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Achievement</text></g><g class="w3d1nd-fl w3d1nd-f3"><rect x="614" y="386" width="148" height="34" rx="17" fill="#3a58a0" fill-opacity=".12"/><text x="688" y="409" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Value</text></g><g class="w3d1nd-fl w3d1nd-f1"><rect x="614" y="434" width="148" height="34" rx="17" fill="#3a58a0" fill-opacity=".12"/><text x="688" y="457" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Consideration</text></g><g filter="url(#w3d1nd-sh)"><rect x="790" y="70" width="176" height="440" rx="18" fill="#fff"/></g><rect x="790" y="70" width="176" height="64" rx="18" fill="#7a4a8c"/><rect x="790" y="110" width="176" height="24" fill="#7a4a8c"/><text x="878" y="109" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Self-Actualisation</text><g class="w3d1nd-fl w3d1nd-f2"><rect x="804" y="146" width="148" height="34" rx="17" fill="#7a4a8c" fill-opacity=".12"/><text x="878" y="169" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Purpose</text></g><g class="w3d1nd-fl w3d1nd-f3"><rect x="804" y="194" width="148" height="34" rx="17" fill="#7a4a8c" fill-opacity=".12"/><text x="878" y="217" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Creativity</text></g><g class="w3d1nd-fl w3d1nd-f1"><rect x="804" y="242" width="148" height="34" rx="17" fill="#7a4a8c" fill-opacity=".12"/><text x="878" y="265" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Growth</text></g><g class="w3d1nd-fl w3d1nd-f2"><rect x="804" y="290" width="148" height="34" rx="17" fill="#7a4a8c" fill-opacity=".12"/><text x="878" y="313" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Meaning</text></g><g class="w3d1nd-fl w3d1nd-f3"><rect x="804" y="338" width="148" height="34" rx="17" fill="#7a4a8c" fill-opacity=".12"/><text x="878" y="361" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Autonomy</text></g><g class="w3d1nd-fl w3d1nd-f1"><rect x="804" y="386" width="148" height="34" rx="17" fill="#7a4a8c" fill-opacity=".12"/><text x="878" y="409" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Freedom</text></g><g class="w3d1nd-fl w3d1nd-f2"><rect x="804" y="434" width="148" height="34" rx="17" fill="#7a4a8c" fill-opacity=".12"/><text x="878" y="457" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Discovery</text></g><text x="500" y="46" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#14293a" text-anchor="middle">Needs are abstract nouns · headings based on Maslow’s Hierarchy of Needs</text>
