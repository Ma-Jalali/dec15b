anrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Exercise</text></g><g class="w3d1nd-fl w3d1nd-f1"><rect x="44" y="434" width="148" height="34" rx="17" fill="#b0512a" fill-opacity=".12"/><text x="118" y="457" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Warmth</text></g><g filter="url(#w3d1nd-sh)"><rect x="220" y="70" width="176" height="440" rx="18" fill="#fff"/></g><rect x="220" y="70" width="176" height="64" rx="18" fill="#c98d2c"/><rect x="220" y="110" width="176" height="24" fill="#c98d2c"/><text x="308" y="98" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Safety and</text><text x="308" y="119" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Security</text><g class="w3d1nd-fl w3d1nd-f2"><rect x="234" y="146" width="148" height="34" rx="17" fill="#c98d2c" fill-opacity=".12"/><text x="308" y="169" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Stability</text></g><g class="w3d1nd-fl w3d1nd-f3"><rect x="234" y="194" width="148" height="34" rx="17" fill="#c98d2c" fill-opacity=".12"/><text x="308" y="217" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Reliability</text></g><g class="w3d1nd-fl w3d1nd-f1"><rect x="234" y="242" width="148" height="34" rx="17" fill="#c98d2c" fill-opacity=".12"/><text x="308" y="265" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Order</text></g><g class="w3d1nd-fl w3d1nd-f2"><rect x="234" y="290" width="148" height="34" rx="17" fill="#c98d2c" fill-opacity=".12"/><text x="308" y="313" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">Consistency</text></g><g class="