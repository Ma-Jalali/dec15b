<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" fill="none" role="img" aria-label="Needs in five groups based on Maslow’s hierarchy. Physical: food, water, sleep/rest, shelter, air, exercise, warmth. Safety and security: stability, reliability, order, consistency, protection, structure, predictability. Connection: cooperation, inclusion, support, reassurance, understanding, belonging, trust. Self-esteem: respect, recognition, acknowledgement, appreciation, achievement, value, consideration. Self-actualisation: purpose, creativity, growth, meaning, autonomy, freedom, discovery.">
<title>Needs</title>
<style>
.w3d1nd-fl{animation:w3d1nd-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1nd-f2{animation-delay:-2s}.w3d1nd-f3{animation-delay:-4s}
.w3d1nd-tw{animation:w3d1nd-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1nd-t2{animation-delay:-1s}.w3d1nd-t3{animation-delay:-2s}
.w3d1nd-sp{animation:w3d1nd-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1nd-slow{animation-duration:14s}
.w3d1nd-pu{animation:w3d1nd-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1nd-p2{animation-delay:-1.2s}
.w3d1nd-dr{stroke-dasharray:6 7;animation:w3d1nd-dr 1.5s linear infinite}
.w3d1nd-bl{animation:w3d1nd-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1nd-b2{animation-delay:-1.7s}.w3d1nd-b3{animation-delay:-3.1s}
.w3d1nd-sw{animation:w3d1nd-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1nd-ri{animation:w3d1nd-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1nd-r2{animation-delay:-1.7s}.w3d1nd-r3{animation-delay:-3.4s}
.w3d1nd-dw{stroke-dasharray:400;animation:w3d1nd-dw 6s ease-in-out infinite}
@keyframes w3d1nd-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes w3d1nd-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1nd-sp{to{transform:rotate(360deg)}}
@keyframes w3d1nd-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1nd-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1nd-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1nd-sw{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes w3d1nd-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1nd-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
