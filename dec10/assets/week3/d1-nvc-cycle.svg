<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" fill="none" role="img" aria-label="Nonviolent Communication (NVC) as a cycle. Observation: the concrete actions we observe with our senses without judgement (When I see…). Feeling: how we feel in relation to what we observe (I feel…). Need: the needs or values behind our feelings (I need…). Request: the concrete action we would like taken to meet the needs expressed (Would you be willing…?).">
<title>Nonviolent Communication (NVC)</title>
<style>
.w3d1nv-fl{animation:w3d1nv-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1nv-f2{animation-delay:-2s}.w3d1nv-f3{animation-delay:-4s}
.w3d1nv-tw{animation:w3d1nv-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1nv-t2{animation-delay:-1s}.w3d1nv-t3{animation-delay:-2s}
.w3d1nv-sp{animation:w3d1nv-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1nv-slow{animation-duration:14s}
.w3d1nv-pu{animation:w3d1nv-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1nv-p2{animation-delay:-1.2s}
.w3d1nv-dr{stroke-dasharray:6 7;animation:w3d1nv-dr 1.5s linear infinite}
.w3d1nv-bl{animation:w3d1nv-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1nv-b2{animation-delay:-1.7s}.w3d1nv-b3{animation-delay:-3.1s}
.w3d1nv-sw{animation:w3d1nv-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1nv-ri{animation:w3d1nv-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1nv-r2{animation-delay:-1.7s}.w3d1nv-r3{animation-delay:-3.4s}
.w3d1nv-dw{stroke-dasharray:400;animation:w3d1nv-dw 6s ease-in-out infinite}
@keyframes w3d1nv-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes w3d1nv-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1nv-sp{to{transform:rotate(360deg)}}
@keyframes w3d1nv-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1nv-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1nv-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1nv-sw{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes w3d1nv-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1nv-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="w3d1nv-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbefe8"/><stop offset="1" stop-color="#f2d6c6"/></linearGradient>
<pattern id="w3d1nv-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#b0512a" fill-opacity=".14"/></pattern>
<linearGradient id="w3d1nv-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d1nv-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e59a76"/><stop offset="1" stop-color="#b0512a"/></linearGradient>
<linearGradient id="w3d1nv-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfeaf2"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
<linearGradient id="w3d1nv-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd27f"/><stop offset="1" stop-color="#3f7a3a"/></linearGradient>
<linearGradient id="w3d1nv-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d77c9"/><stop offset="1" stop-color="#1f3a78"/></linearGradient>
<linearGradient id="w3d1nv-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf62"/><stop offset="1" stop-color="#d99a2b"/></linearGradient>
<radialGradient id="w3d1nv-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<radialGradient id="w3d1nv-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w3d1nv-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w3d1nv-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".16"/></filter>
<marker id="w3d1nv-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#b0512a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="w3d1nv-an" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#14293a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<path id="w3d1nv-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>
<marker id="w3d1nv-mb" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#2a5a7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="900" height="640" rx="24" fill="#fbf6f2"/><rect width="900" height="640" rx="24" fill="url(#w3d1nv-dots)" opacity=".7"/><text x="450" y="50" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#14293a" text-anchor="middle">NONVIOLENT COMMUNICATION (NVC)</text><g class="w3d1nv-fl w3d1nv-f1"><g filter="url(#w3d1nv-sh)"><rect x="280" y="90" width="340" height="140" rx="20" fill="#fff"/></g><rect x="280" y="90" width="340" height="44" rx="20" fill="#13887a"/><rect x="280" y="120" width="340" height="14" fill="#13887a"/><text x="450" y="120" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">OBSERVATION</text><text x="450" y="162" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">The concrete actions we observe</text><text x="450" y="183" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">with our senses without judgement</text><text x="450" y="216" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#13887a" text-anchor="middle">When I see …</text></g><g class="w3d1nv-fl w3d1nv-f2"><g filter="url(#w3d1nv-sh)"><rect x="530" y="260" width="340" height="140" rx="20" fill="#fff"/></g><rect x="530" y="260" width="340" height="44" rx="20" fill="#b0512a"/><rect x="530" y="290" width="340" height="14" fill="#b0512a"/><text x="700" y="290" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">FEELING</text><text x="700" y="332" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">How we feel in relation</text><text x="700" y="353" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">to what we observe</text><text x="700" y="386" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#b0512a" text-anchor="middle">I feel …</text></g><g class="w3d1nv-fl w3d1nv-f3"><g filter="url(#w3d1nv-sh)"><rect x="280" y="430" width="340" height="140" rx="20" fill="#fff"/></g><rect x="280" y="430" width="340" height="44" rx="20" fill="#7a4a8c"/><rect x="280" y="460" width="340" height="14" fill="#7a4a8c"/><text x="450" y="460" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">NEED</text><text x="450" y="502" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">The needs or values</text><text x="450" y="523" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">behind our feelings</text><text x="450" y="556" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#7a4a8c" text-anchor="middle">I need …</text></g><g class="w3d1nv-fl w3d1nv-f1"><g filter="url(#w3d1nv-sh)"><rect x="30" y="260" width="340" height="140" rx="20" fill="#fff"/></g><rect x="30" y="260" width="340" height="44" rx="20" fill="#3a58a0"/><rect x="30" y="290" width="340" height="14" fill="#3a58a0"/><text x="200" y="290" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">REQUEST</text><text x="200" y="332" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">The concrete action we would like</text><text x="200" y="353" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">taken to meet the needs expressed</text><text x="200" y="386" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#3a58a0" text-anchor="middle">Would you be willing …?</text></g><path d="M630 120C720 130 760 190 760 240" stroke="#2a5a7a" stroke-width="9" stroke-linecap="round" fill="none" marker-end="url(#w3d1nv-mb)"/><path d="M770 420C770 480 720 520 640 520" stroke="#2a5a7a" stroke-width="9" stroke-linecap="round" fill="none" marker-end="url(#w3d1nv-mb)"/><path d="M260 520C180 520 140 480 140 420" stroke="#2a5a7a" stroke-width="9" stroke-linecap="round" fill="none" marker-end="url(#w3d1nv-mb)"/><path d="M140 240C140 170 190 130 270 120" stroke="#2a5a7a" stroke-width="9" stroke-linecap="round" fill="none" marker-end="url(#w3d1nv-mb)"/><g class="w3d1nv-pu"><circle cx="450" cy="330" r="54" fill="#fff" filter="url(#w3d1nv-sh)"/><path transform="translate(450 334) scale(2.4)" d="M0 7C-12-2-9-12-2-12 0-12 0-10 0-7 0-10 0-12 2-12 9-12 12-2 0 7z" fill="#e06d5a"/></g><text x="450" y="610" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#3d4f5e" text-anchor="middle">Developed by psychologist Dr Marshall Rosenberg</text>
</svg>
