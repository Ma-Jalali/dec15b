<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="Skill distance. From a marketing manager, a short green path leads to sales manager: small skill distance, a little re-training. A long dashed path leads to software developer: large skill distance, a lot of re-training.">
<title>Skill distance</title>
<style>
.w3d1sd-fl{animation:w3d1sd-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1sd-f2{animation-delay:-2s}.w3d1sd-f3{animation-delay:-4s}
.w3d1sd-tw{animation:w3d1sd-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1sd-t2{animation-delay:-1s}.w3d1sd-t3{animation-delay:-2s}
.w3d1sd-sp{animation:w3d1sd-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1sd-slow{animation-duration:14s}
.w3d1sd-pu{animation:w3d1sd-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1sd-p2{animation-delay:-1.2s}
.w3d1sd-dr{stroke-dasharray:6 7;animation:w3d1sd-dr 1.5s linear infinite}
.w3d1sd-bl{animation:w3d1sd-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1sd-b2{animation-delay:-1.7s}.w3d1sd-b3{animation-delay:-3.1s}
.w3d1sd-sw{animation:w3d1sd-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1sd-ri{animation:w3d1sd-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1sd-r2{animation-delay:-1.7s}.w3d1sd-r3{animation-delay:-3.4s}
.w3d1sd-dw{stroke-dasharray:400;animation:w3d1sd-dw 6s ease-in-out infinite}
@keyframes w3d1sd-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes w3d1sd-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1sd-sp{to{transform:rotate(360deg)}}
@keyframes w3d1sd-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1sd-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1sd-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1sd-sw{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes w3d1sd-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1sd-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="w3d1sd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecf7f2"/><stop offset="1" stop-color="#cfe6dc"/></linearGradient>
<pattern id="w3d1sd-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#13887a" fill-opacity=".14"/></pattern>
<linearGradient id="w3d1sd-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d1sd-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ccbb9"/><stop offset="1" stop-color="#13887a"/></linearGradient>
<linearGradient id="w3d1sd-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfeaf2"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
<linearGradient id="w3d1sd-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd27f"/><stop offset="1" stop-color="#3f7a3a"/></linearGradient>
<linearGradient id="w3d1sd-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d77c9"/><stop offset="1" stop-color="#1f3a78"/></linearGradient>
<linearGradient id="w3d1sd-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf62"/><stop offset="1" stop-color="#d99a2b"/></linearGradient>
<radialGradient id="w3d1sd-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<radialGradient id="w3d1sd-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w3d1sd-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w3d1sd-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".16"/></filter>
<marker id="w3d1sd-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#13887a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="w3d1sd-an" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#14293a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<path id="w3d1sd-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>

</defs>
<rect width="1000" height="440" rx="24" fill="#f6faf7"/><rect width="1000" height="440" rx="24" fill="url(#w3d1sd-dots)" opacity=".7"/><path d="M0 360h1000v80H0z" fill="#cfe6dc" opacity=".6"/><g transform="translate(160 230) scale(1.6 1.6)"><ellipse cx="0" cy="40" rx="26" ry="4" fill="url(#w3d1sd-gs)"/><path d="M-15-10c-4 14-4 28 2 34h26c6-6 6-20 2-34z" fill="#8a5a2b"/><path d="M-24 40C-24 18-14 8 0 8S24 18 24 40z" fill="#13887a"/><path d="M-24 40C-24 18-14 8 0 8S24 18 24 40z" fill="url(#w3d1sd-shine)" opacity=".35"/><path d="M-6 8l6 7 6-7" fill="#fff" opacity=".85"/><rect x="-4.5" y="1" width="9" height="8" rx="3" fill="#d9a07a"/><circle cx="0" cy="-9" r="13" fill="#d9a07a"/><circle cx="-13" cy="-8" r="3" fill="#d9a07a"/><circle cx="13" cy="-8" r="3" fill="#d9a07a"/><path d="M-14-6c-2-13 5-21 14-21s16 7 14 21c-2-6-6-11-14-12-7 1-12 5-14 12z" fill="#8a5a2b"/><g class="w3d1sd-bl"><ellipse cx="-4.6" cy="-8" rx="1.6" ry="2" fill="#14293a"/><ellipse cx="4.6" cy="-8" rx="1.6" ry="2" fill="#14293a"/></g><circle cx="-8" cy="-3" r="2.2" fill="#e88a7a" opacity=".35"/><circle cx="8" cy="-3" r="2.2" fill="#e88a7a" opacity=".35"/><path d="M-4-1.5q4 4 8 0" stroke="#14293a" stroke-width="1.5" stroke-linecap="round"/><path d="M18 24c8-2 16-6 24-12" stroke="#13887a" stroke-width="8" stroke-linecap="round"/><circle cx="43" cy="11" r="4.3" fill="#d9a07a"/></g><rect x="70" y="310" width="180" height="34" rx="17.0" fill="#13887a"/><text x="160.0" y="332.76" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Marketing manager</text><path d="M260 210Q370 150 480 150" stroke="#3f7a3a" stroke-width="10" stroke-linecap="round" fill="none"/><g transform="translate(560 140) scale(1.2 1.2)"><ellipse cx="0" cy="40" rx="26" ry="4" fill="url(#w3d1sd-gs)"/><path d="M-24 40C-24 18-14 8 0 8S24 18 24 40z" fill="#3f7a3a"/><path d="M-24 40C-24 18-14 8 0 8S24 18 24 40z" fill="url(#w3d1sd-shine)" opacity=".35"/><path d="M-6 8l6 7 6-7" fill="#fff" opacity=".85"/><rect x="-4.5" y="1" width="9" height="8" rx="3" fill="#7a4e33"/><circle cx="0" cy="-9" r="13" fill="#7a4e33"/><circle cx="-13" cy="-8" r="3" fill="#7a4e33"/><circle cx="13" cy="-8" r="3" fill="#7a4e33"/><path d="M-13.5-9c-1-11 6-17 14-17s14 6 13 15c-3-5-9-8-15-8s-9 4-12 10z" fill="#2b1d16"/><g class="w3d1sd-bl"><ellipse cx="-4.6" cy="-8" rx="1.6" ry="2" fill="#14293a"/><ellipse cx="4.6" cy="-8" rx="1.6" ry="2" fill="#14293a"/></g><circle cx="-8" cy="-3" r="2.2" fill="#e88a7a" opacity=".35"/><circle cx="8" cy="-3" r="2.2" fill="#e88a7a" opacity=".35"/><path d="M-4-1.5q4 4 8 0" stroke="#14293a" stroke-width="1.5" stroke-linecap="round"/></g><rect x="470" y="200" width="180" height="34" rx="17.0" fill="#3f7a3a"/><text x="560.0" y="222.76" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Sales manager</text><g filter="url(#w3d1sd-sh2)"><rect x="680" y="104" width="280" height="76" rx="16" fill="#e8f4ee"/></g><text x="820" y="134" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#2c5a29" text-anchor="middle">small skill distance</text><text x="820" y="160" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#2c5a29" text-anchor="middle">→ a little re-training</text><path d="M260 262C420 360 640 330 780 300" stroke="#b0512a" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="20 12" class="w3d1sd-dr"/><g transform="translate(850 300) scale(1.2)" filter="url(#w3d1sd-sh2)"><rect x="-40" y="-52" width="80" height="52" rx="5" fill="#2a4458"/><rect x="-35" y="-47" width="70" height="42" rx="2" fill="#fbefe8"/><path d="M-20-30l-8 8 8 8M8-30l8 8-8 8M-4-12l8-20" stroke="#b0512a" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M-50 0h100l-8 8h-84z" fill="#c9d3dd"/></g><rect x="760" y="320" width="180" height="34" rx="17.0" fill="#b0512a"/><text x="850.0" y="342.76" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Software developer</text><g filter="url(#w3d1sd-sh2)"><rect x="380" y="352" width="300" height="70" rx="16" fill="#fbefe8"/></g><text x="530" y="380" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#8a3c1d" text-anchor="middle">large skill distance</text><text x="530" y="406" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#8a3c1d" text-anchor="middle">→ a lot of re-training</text><text x="500" y="50" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#14293a" text-anchor="middle">Skill distance = the extent of re-training needed to move from one job to another</text>
</svg>
