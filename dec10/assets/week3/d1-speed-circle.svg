<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="Speed circle. Students sit in an inner and an outer circle facing each other. The outer student reads a demand, for example Don’t talk while I’m speaking! The inner student turns it into a request: Would you be willing to wait until I finish, please? After 30 seconds the outer circle moves one seat.">
<title>Speed circle</title>
<style>
.w3d1sc-fl{animation:w3d1sc-fl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1sc-d1{animation-delay:-1.3s}.w3d1sc-d2{animation-delay:-2.6s}.w3d1sc-d3{animation-delay:-3.9s}
.w3d1sc-pu{animation:w3d1sc-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d1sc-dr{stroke-dasharray:8 8;animation:w3d1sc-dr 1.4s linear infinite}
.w3d1sc-sp{animation:w3d1sc-sp 12s linear infinite;transform-box:view-box;transform-origin:330px 250px}
.w3d1sc-tw{animation:w3d1sc-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d1sc-bl{animation:w3d1sc-bl 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w3d1sc-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d1sc-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w3d1sc-dr{to{stroke-dashoffset:-32}}
@keyframes w3d1sc-sp{to{transform:rotate(360deg)}}
@keyframes w3d1sc-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1sc-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="w3d1sc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf1ea"/><stop offset="1" stop-color="#efdccb"/></linearGradient>
<pattern id="w3d1sc-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#b0512a" fill-opacity=".16"/></pattern>
<linearGradient id="w3d1sc-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="w3d1sc-sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".16"/></filter>
<filter id="w3d1sc-sh2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".14"/></filter>
<marker id="w3d1sc-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3a843"/></marker>
</defs><rect width="1000" height="460" fill="url(#w3d1sc-bg)"/><rect width="1000" height="460" fill="url(#w3d1sc-dots)"/><text x="500" y="40" font-family="Manrope, Arial, sans-serif" font-size="23" font-weight="800" fill="#14293a" text-anchor="middle">Speed circle: demand in, request out — then move one seat</text><circle cx="330" cy="250" r="170" fill="#fff" fill-opacity=".55" stroke="#e3c6ae" stroke-width="3"/><circle cx="330" cy="250" r="90" fill="#fff" fill-opacity=".7" stroke="#e3c6ae" stroke-width="3"/><g class="w3d1sc-sp"><circle cx="330" cy="250" r="146" stroke="#e3a843" stroke-width="5" class="w3d1sc-dr"/></g><g class="w3d1sc-fl w3d1sc-d0"><circle cx="330.0" cy="190.0" r="18" fill="#13887a"/><circle cx="330.0" cy="186.0" r="6.5" fill="#fff" opacity=".9"/><path d="M320.0 202.0c1-7 5-10 10-10s9 3 10 10" fill="#fff" opacity=".9"/></g><g><circle cx="330.0" cy="125.0" r="20" fill="#fff" stroke="#7a4a8c" stroke-width="5"/><circle cx="330.0" cy="121.0" r="7" fill="#7a4a8c"/><path d="M319.0 138.0c1-7 5-10 11-10s10 3 11 10" fill="#7a4a8c"/></g><g class="w3d1sc-fl w3d1sc-d1"><circle cx="382.0" cy="220.0" r="18" fill="#3a58a0"/><circle cx="382.0" cy="216.0" r="6.5" fill="#fff" opacity=".9"/><path d="M372.0 232.0c1-7 5-10 10-10s9 3 10 10" fill="#fff" opacity=".9"/></g><g><circle cx="438.3" cy="187.5" r="20" fill="#fff" stroke="#3f7a3a" stroke-width="5"/><circle cx="438.3" cy="183.5" r="7" fill="#3f7a3a"/><path d="M427.3 200.5c1-7 5-10 11-10s10 3 11 10" fill="#3f7a3a"/></g><g class="w3d1sc-fl w3d1sc-d2"><circle cx="382.0" cy="280.0" r="18" fill="#7a4a8c"/><circle cx="382.0" cy="276.0" r="6.5" fill="#fff" opacity=".9"/><path d="M372.0 292.0c1-7 5-10 10-10s9 3 10 10" fill="#fff" opacity=".9"/></g><g><circle cx="438.3" cy="312.5" r="20" fill="#fff" stroke="#c98d2c" stroke-width="5"/><circle cx="438.3" cy="308.5" r="7" fill="#c98d2c"/><path d="M427.3 325.5c1-7 5-10 11-10s10 3 11 10" fill="#c98d2c"/></g><g class="w3d1sc-fl w3d1sc-d3"><circle cx="330.0" cy="310.0" r="18" fill="#3f7a3a"/><circle cx="330.0" cy="306.0" r="6.5" fill="#fff" opacity=".9"/><path d="M320.0 322.0c1-7 5-10 10-10s9 3 10 10" fill="#fff" opacity=".9"/></g><g><circle cx="330.0" cy="375.0" r="20" fill="#fff" stroke="#b0512a" stroke-width="5"/><circle cx="330.0" cy="371.0" r="7" fill="#b0512a"/><path d="M319.0 388.0c1-7 5-10 11-10s10 3 11 10" fill="#b0512a"/></g><g class="w3d1sc-fl w3d1sc-d0"><circle cx="278.0" cy="280.0" r="18" fill="#c98d2c"/><circle cx="278.0" cy="276.0" r="6.5" fill="#fff" opacity=".9"/><path d="M268.0 292.0c1-7 5-10 10-10s9 3 10 10" fill="#fff" opacity=".9"/></g><g><circle cx="221.7" cy="312.5" r="20" fill="#fff" stroke="#13887a" stroke-width="5"/><circle cx="221.7" cy="308.5" r="7" fill="#13887a"/><path d="M210.7 325.5c1-7 5-10 11-10s10 3 11 10" fill="#13887a"/></g><g class="w3d1sc-fl w3d1sc-d1"><circle cx="278.0" cy="220.0" r="18" fill="#b0512a"/><circle cx="278.0" cy="216.0" r="6.5" fill="#fff" opacity=".9"/><path d="M268.0 232.0c1-7 5-10 10-10s9 3 10 10" fill="#fff" opacity=".9"/></g><g><circle cx="221.7" cy="187.5" r="20" fill="#fff" stroke="#3a58a0" stroke-width="5"/><circle cx="221.7" cy="183.5" r="7" fill="#3a58a0"/><path d="M210.7 200.5c1-7 5-10 11-10s10 3 11 10" fill="#3a58a0"/></g><text x="330" y="256" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#7a4a8c" text-anchor="middle">inner</text><path d="M470 140q30 40 18 80" stroke="#e3a843" stroke-width="6" stroke-linecap="round" marker-end="url(#w3d1sc-ah)"/><text x="540" y="130" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#985c0e" text-anchor="middle">move 1 seat</text><g filter="url(#w3d1sc-sh)"><rect x="600" y="150" width="360" height="82" rx="20" fill="#fff"/></g><rect x="600" y="150" width="10" height="82" rx="5" fill="#b0512a"/><text x="626" y="180" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#b0512a" text-anchor="start">Outer: reads a demand</text><text x="626" y="210" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="start">“Don’t talk while I’m speaking!”</text><path d="M780 240v30" stroke="#e3a843" stroke-width="6" stroke-linecap="round" marker-end="url(#w3d1sc-ah)" class="w3d1sc-dr"/><g filter="url(#w3d1sc-sh)"><rect x="600" y="282" width="360" height="100" rx="20" fill="#fff"/></g><rect x="600" y="282" width="10" height="100" rx="5" fill="#13887a"/><text x="626" y="312" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#13887a" text-anchor="start">Inner: makes it a request</text><text x="626" y="340" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#14293a" text-anchor="start">“Would you be willing to wait</text><text x="626" y="364" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#14293a" text-anchor="start">until I finish, please?”</text><g class="w3d1sc-pu"><circle cx="910" cy="96" r="30" fill="#fff" stroke="#b0512a" stroke-width="5" filter="url(#w3d1sc-sh2)"/></g><text x="910" y="103" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#b0512a" text-anchor="middle">30s</text>
</svg>
