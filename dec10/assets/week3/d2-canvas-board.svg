<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none" role="img" aria-label="A Canvas page with three numbered parts: 1 the Discussions tab in the left menu; 2 the topic title and body at the top of the page; 3 the discussion thread with an original post and replies under it.">
<title>The parts of a Canvas discussion board</title>
<style>
.w32canvasboard-fl{animation:w32canvasboard-fl 6s ease-in-out infinite}.w32canvasboard-f2{animation-delay:-2s}.w32canvasboard-f3{animation-delay:-4s}
.w32canvasboard-tw{animation:w32canvasboard-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32canvasboard-t2{animation-delay:-1s}.w32canvasboard-t3{animation-delay:-2s}
.w32canvasboard-bl{animation:w32canvasboard-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32canvasboard-b2{animation-delay:-1.7s}.w32canvasboard-b3{animation-delay:-3.2s}
.w32canvasboard-sp{animation:w32canvasboard-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32canvasboard-sr{animation-direction:reverse}
.w32canvasboard-pu{animation:w32canvasboard-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32canvasboard-p2{animation-delay:-1.3s}
.w32canvasboard-dr{stroke-dasharray:6 8;animation:w32canvasboard-dr 1.6s linear infinite}
.w32canvasboard-wv{animation:w32canvasboard-wv 2.4s ease-out infinite}.w32canvasboard-w2{animation-delay:-.8s}.w32canvasboard-w3{animation-delay:-1.6s}
.w32canvasboard-bob{animation:w32canvasboard-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32canvasboard-dw{stroke-dasharray:420;stroke-dashoffset:420;animation:w32canvasboard-dw 7s ease-in-out infinite}
.w32canvasboard-eq{animation:w32canvasboard-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32canvasboard-e2{animation-delay:-.3s}.w32canvasboard-e3{animation-delay:-.6s}.w32canvasboard-e4{animation-delay:-.85s}
@keyframes w32canvasboard-fl{50%{transform:translateY(-4px)}}
@keyframes w32canvasboard-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32canvasboard-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32canvasboard-sp{to{transform:rotate(360deg)}}
@keyframes w32canvasboard-pu{50%{transform:scale(1.07)}}
@keyframes w32canvasboard-dr{to{stroke-dashoffset:-28}}
@keyframes w32canvasboard-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32canvasboard-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32canvasboard-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32canvasboard-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="w32canvasboard-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f7ec"/><stop offset="1" stop-color="#dcebd3"/></linearGradient>
<pattern id="w32canvasboard-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#3f7a3a" fill-opacity=".14"/></pattern>
<radialGradient id="w32canvasboard-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w32canvasboard-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w32canvasboard-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w32canvasboard-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="w32canvasboard-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w32canvasboard-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w32canvasboard-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f7a3a" stop-opacity=".85"/><stop offset="1" stop-color="#2a5626"/></linearGradient>
<linearGradient id="w32canvasboard-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc576"/><stop offset="1" stop-color="#2f7d3a"/></linearGradient>
<linearGradient id="w32canvasboard-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d7fc4"/><stop offset=".5" stop-color="#23497e"/><stop offset="1" stop-color="#16325a"/></linearGradient>
<linearGradient id="w32canvasboard-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<linearGradient id="w32canvasboard-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfe6ea"/><stop offset="1" stop-color="#8d9ea9"/></linearGradient>
<linearGradient id="w32canvasboard-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9f4"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
</defs>
<rect x="6" y="6" width="988" height="508" rx="28" fill="url(#w32canvasboard-bg)"/><rect x="6" y="6" width="988" height="508" rx="28" fill="url(#w32canvasboard-dots)"/><rect x="6" y="6" width="988" height="508" rx="28" stroke="#fff" stroke-width="2"/><rect x="30" y="30" width="940" height="460" rx="14" fill="#fff" filter="url(#w32canvasboard-sh)"/><rect x="30" y="30" width="940" height="40" rx="14" fill="#e9eef1"/><circle cx="56" cy="50" r="7" fill="#e64626"/><circle cx="78" cy="50" r="7" fill="#e3a843"/><circle cx="100" cy="50" r="7" fill="#3f7a3a"/><rect x="30" y="70" width="140" height="420" fill="#f4f6f7"/><text x="56" y="102" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#556" text-anchor="start">Home</text><text x="56" y="148" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#556" text-anchor="start">Modules</text><rect x="36" y="168" width="128" height="40" rx="8" fill="#3f7a3a" opacity=".16"/><rect x="36" y="168" width="5" height="40" fill="#3f7a3a"/><text x="56" y="194" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#3f7a3a" text-anchor="start">Discussions</text><text x="56" y="240" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#556" text-anchor="start">Assignments</text><text x="56" y="286" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#556" text-anchor="start">Grades</text><text x="56" y="332" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#556" text-anchor="start">People</text><rect x="200" y="86" width="740" height="104" rx="10" fill="#f0f7ec" stroke="#3f7a3a" stroke-width="2"/><text x="222" y="122" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#3f7a3a" text-anchor="start">Week 3 · What is a green job?</text><text x="222" y="152" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="start">Read Vidican Auktor (2020). Do you agree with the ILO definition?</text><text x="222" y="176" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="start">Reply to one classmate. Be polite and cite your source.</text><rect x="210" y="214" width="720" height="74" rx="10" fill="#fff" stroke="#dfe5e8" stroke-width="2"/><circle cx="244" cy="251" r="20" fill="#2f6db5"/><text x="244" y="257" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">M</text><text x="276" y="244" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#14293a" text-anchor="start">Mina Park</text><text x="276" y="270" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#3d5466" text-anchor="start">Defining green jobs is complex due to their diverse nature …</text><rect x="270" y="302" width="660" height="74" rx="10" fill="#fff" stroke="#dfe5e8" stroke-width="2"/><circle cx="304" cy="339" r="20" fill="#13887a"/><text x="304" y="345" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">L</text><text x="336" y="332" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#14293a" text-anchor="start">Leo Chen</text><text x="336" y="358" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#3d5466" text-anchor="start">While I see your point, I believe the shift involves both …</text><path d="M240 288V339H266" stroke="#c5ced3" stroke-width="2.4" fill="none"/><rect x="270" y="390" width="660" height="74" rx="10" fill="#fff" stroke="#dfe5e8" stroke-width="2"/><circle cx="304" cy="427" r="20" fill="#7a4a8c"/><text x="304" y="433" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">S</text><text x="336" y="420" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#14293a" text-anchor="start">Sara Ali</text><text x="336" y="446" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#3d5466" text-anchor="start">I agree with Mina and Leo when they stated that …</text><path d="M240 376V427H266" stroke="#c5ced3" stroke-width="2.4" fill="none"/><rect x="870" y="460" width="80" height="22" rx="11" fill="#3f7a3a"/><text x="910" y="476" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Reply</text>
</svg>
