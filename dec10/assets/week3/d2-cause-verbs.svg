<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="A machine diagram: a cause goes in on the left, a causal verb in the middle works like a motor, and an effect comes out on the right. Example: The shift toward sustainability drives demand for green skills. Below are verb gears: promote, drive, fuel, boost, build, improve, lead to.">
<title>Cause, causal verb, effect</title>
<style>
.w32causeverbs-fl{animation:w32causeverbs-fl 6s ease-in-out infinite}.w32causeverbs-f2{animation-delay:-2s}.w32causeverbs-f3{animation-delay:-4s}
.w32causeverbs-tw{animation:w32causeverbs-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32causeverbs-t2{animation-delay:-1s}.w32causeverbs-t3{animation-delay:-2s}
