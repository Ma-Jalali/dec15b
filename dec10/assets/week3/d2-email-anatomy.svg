<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" fill="none" role="img" aria-label="A sample student email with eleven numbered parts. To: jane.smith@sydenty.edu.au (1). Subject: Student # 12345678, DEC 10.3 Extension request (2). Dear Ms Smith (3). I am writing to you in regards to an extension for Assessment 1 (4). I have been unwell the last week and have found it hard to catch up on the required classwork that would help me complete the assessment (5). I would only need two extra days beyond the due date (6). I have attached a medical certificate for your viewing (7). Thank you for your consideration (8). Kind Regards (9). Samuel Blank (10). #12345678 (11).">
<title>The parts of a university email</title>
<style>
.w32emailanatomy-fl{animation:w32emailanatomy-fl 6s ease-in-out infinite}.w32emailanatomy-f2{animation-delay:-2s}.w32emailanatomy-f3{animation-delay:-4s}
.w32emailanatomy-tw{animation:w32emailanatomy-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32emailanatomy-t2{animation-delay:-1s}.w32emailanatomy-t3{animation-delay:-2s}
.w32emailanatomy-bl{animation:w32emailanatomy-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32emailanatomy-b2{animation-delay:-1.7s}.w32emailanatomy-b3{animation-delay:-3.2s}
.w32emailanatomy-sp{animation:w32emailanatomy-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32emailanatomy-sr{animation-direction:reverse}
.w32emailanatomy-pu{animation:w32emailanatomy-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32emailanatomy-p2{animation-delay:-1.3s}
.w32emailanatomy-dr{stroke-dasharray:6 8;animation:w32emailanatomy-dr 1.6s linear infinite}
.w32emailanatomy-wv{animation:w32emailanatomy-wv 2.4s ease-out infinite}.w32emailanatomy-w2{animation-delay:-.8s}.w32emailanatomy-w3{animation-delay:-1.6s}
.w32emailanatomy-bob{animation:w32emailanatomy-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32emailanatomy-dw{stroke-dasharray:420;stroke-dashoffset:420;animation:w32emailanatomy-dw 7s ease-in-out infinite}
.w32emailanatomy-eq{animation:w32emailanatomy-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32emailanatomy-e2{animation-delay:-.3s}.w32emailanatomy-e3{animation-delay:-.6s}.w32emailanatomy-e4{animation-delay:-.85s}
@keyframes w32emailanatomy-fl{50%{transform:translateY(-4px)}}
@keyframes w32emailanatomy-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32emailanatomy-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32emailanatomy-sp{to{transform:rotate(360deg)}}
@keyframes w32emailanatomy-pu{50%{transform:scale(1.07)}}
@keyframes w32emailanatomy-dr{to{stroke-dashoffset:-28}}
@keyframes w32emailanatomy-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32emailanatomy-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32emailanatomy-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32emailanatomy-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
