>3</text><rect x="64" y="252" width="619" height="32" rx="10" fill="#fde3e3"/><text x="76" y="274" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">I am writing to you in regards to an extension for Assessment 1.</text><circle cx="705.2" cy="268" r="15" fill="#14293a"/><text x="705.2" y="273.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">4</text><rect x="64" y="292" width="712" height="32" rx="10" fill="#dff3e6"/><text x="76" y="314" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">I have been unwell the last week and have found it hard to catch up on the</text><circle cx="798.2" cy="308" r="15" fill="#14293a"/><text x="798.2" y="313.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">5</text><rect x="64" y="332" width="601" height="32" rx="10" fill="#dff3e6"/><text x="76" y="354" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">required classwork that would help me complete the assessment.</text><rect x="64" y="372" width="517" height="32" rx="10" fill="#dce9fb"/><text x="76" y="394" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">I would only need two extra days beyond the due date.</text><circle cx="602.9000000000001" cy="388" r="15" fill="#14293a"/><text x="602.9000000000001" y="393.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">6</text><rect x="64" y="412" width="536" height="32" rx="10" fill="#fde9d3"/><text x="76" y="434" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">I have attached a medical certificate for your viewing.</text><circle cx="621.5" cy="428" r="15" fill="#14293a"/><text x="621.5" y="433.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">7</text><rect x="64" y="452" width="331" height="32" rx="10" fill="#fff5c2"/><text x="76" y="474" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Thank you for your consideration.</text><circle cx="416.90000000000003" cy="468" r="15" fill="#14293a"/><text x="416.90000000000003" y="473.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">8</text><rect x="64" y="492" width="145" height="32" rx="10" fill="#ece3f7"/><text x="76" y="514" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Kind Regards,</text><circle cx="230.9" cy="508" r="15" fill="#14293a"/><text x="230.9" y="513.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">9</text><rect x="64" y="544" width="136" height="32" rx="10" fill="#dff5f2"/><text x="76" y="566" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Samuel Blank</text><circle cx="221.60000000000002" cy="560" r="15" fill="#14293a"/><text x="221.60000000000002" y="565.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">10</text><rect x="64" y="584" width="108" height="32" rx="10" fill="#fbe2ea"/><text x="76" y="606" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">#12345678</text><circle cx="193.7" cy="600" r="15" fill="#14293a"/><text x="193.7" y="605.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#fff" text-anchor="middle">11</text><g class="w32emailanatomy-fl"><g transform="translate(900 500) scale(1.4)" filter="url(#w32emailanatomy-sh)"><rect x="-22" y="-15" width="44" height