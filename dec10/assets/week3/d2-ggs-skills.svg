<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" fill="none" role="img" aria-label="Five skill badges from Vidican Auktor (2020): engineering and technical skills, science skills, operation management skills, monitoring skills, and soft skills such as design thinking, creativity, adaptability, resilience and empathy.">
