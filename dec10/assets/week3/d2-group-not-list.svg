.w32groupnotlist-dr{stroke-dasharray:6 8;animation:w32groupnotlist-dr 1.6s linear infinite}
.w32groupnotlist-wv{animation:w32groupnotlist-wv 2.4s ease-out infinite}.w32groupnotlist-w2{animation-delay:-.8s}.w32groupnotlist-w3{animation-delay:-1.6s}
.w32groupnotlist-bob{animation:w32groupnotlist-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32groupnotlist-dw{stroke-dasharray:420;stroke-dashoffset:0;animation:w32groupnotlist-dw 7s ease-in-out infinite}
.w32groupnotlist-eq{animation:w32groupnotlist-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32groupnotlist-e2{animation-delay:-.3s}.w32groupnotlist-e3{animation-delay:-.6s}.w32groupnotlist-e4{animation-delay:-.85s}
@keyframes w32groupnotlist-fl{50%{transform:translateY(-4px)}}
@keyframes w32groupnotlist-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32groupnotlist-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32groupnotlist-sp{to{transform:rotate(360deg)}}
@keyframes w32groupnotlist-pu{50%{transform:scale(1.07)}}
@keyframes w32groupnotlist-dr{to{stroke-dashoffset:-28}}
@keyframes w32groupnotlist-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32groupnotlist-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32groupnotlist-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32groupnotlist-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
