<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" fill="none" role="img" aria-label="Two ways to plan a group talk. Left, crossed out: four separate boxes, Student 1, 2, 3 and 4, one after another. Right, ticked: two big boxes, Causes with students 1, 3 and 4, and Effects with student 2, with similar ideas joined together.">
<title>Group the ideas — don’t just list them</title>
<style>
.w32groupnotlist-fl{animation:w32groupnotlist-fl 6s ease-in-out infinite}.w32groupnotlist-f2{animation-delay:-2s}.w32groupnotlist-f3{animation-delay:-4s}
