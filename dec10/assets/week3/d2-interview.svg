<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none" role="img" aria-label="A job interview room. On the left, the HR representative sits behind a desk with a laptop and a folder. On the right, the candidate sits with a CV. A window shows wind turbines and solar panels. Five numbered markers show the stages of the interview.">
<title>The job interview role play</title>
<style>
.w32interview-fl{animation:w32interview-fl 6s ease-in-out infinite}.w32interview-f2{animation-delay:-2s}.w32interview-f3{animation-delay:-4s}
.w32interview-tw{animation:w32interview-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32interview-t2{animation-delay:-1s}.w32interview-t3{animation-delay:-2s}
.w32interview-bl{animation:w32interview-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32interview-b2{animation-delay:-1.7s}.w32interview-b3{animation-delay:-3.2s}
.w32interview-sp{animation:w32interview-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32interview-sr{animation-direction:reverse}
.w32interview-pu{animation:w32interview-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32interview-p2{animation-delay:-1.3s}
.w32interview-dr{stroke-dasharray:6 8;animation:w32interview-dr 1.6s linear infinite}
.w32interview-wv{animation:w32interview-wv 2.4s ease-out infinite}.w32interview-w2{animation-delay:-.8s}.w32interview-w3{animation-delay:-1.6s}
.w32interview-bob{animation:w32interview-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32interview-dw{stroke-dasharray:420;stroke-dashoffset:420;animation:w32interview-dw 7s ease-in-out infinite}
.w32interview-eq{animation:w32interview-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32interview-e2{animation-delay:-.3s}.w32interview-e3{animation-delay:-.6s}.w32interview-e4{animation-delay:-.85s}
@keyframes w32interview-fl{50%{transform:translateY(-4px)}}
@keyframes w32interview-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32interview-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32interview-sp{to{transform:rotate(360deg)}}
@keyframes w32interview-pu{50%{transform:scale(1.07)}}
@keyframes w32interview-dr{to{stroke-dashoffset:-28}}
@keyframes w32interview-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32interview-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32interview-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32interview-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
