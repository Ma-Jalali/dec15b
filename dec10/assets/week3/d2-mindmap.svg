<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none" role="img" aria-label="An empty mind map to copy. In the centre: Green skills. One main branch: Definition, with small empty branches for what it is and examples. A second main branch: Impact on labour market, with small empty branches for numbers, the skills gap, greening roles and the future. A key shows arrow and symbols.">
<title>Mind map skeleton for the green skills interview</title>
<style>
.w32mindmap-fl{animation:w32mindmap-fl 6s ease-in-out infinite}.w32mindmap-f2{animation-delay:-2s}.w32mindmap-f3{animation-delay:-4s}
.w32mindmap-tw{animation:w32mindmap-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32mindmap-t2{animation-delay:-1s}.w32mindmap-t3{animation-delay:-2s}
.w32mindmap-bl{animation:w32mindmap-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32mindmap-b2{animation-delay:-1.7s}.w32mindmap-b3{animation-delay:-3.2s}
.w32mindmap-sp{animation:w32mindmap-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32mindmap-sr{animation-direction:reverse}
.w32mindmap-pu{animation:w32mindmap-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32mindmap-p2{animation-delay:-1.3s}
.w32mindmap-dr{stroke-dasharray:6 8;animation:w32mindmap-dr 1.6s linear infinite}
.w32mindmap-wv{animation:w32mindmap-wv 2.4s ease-out infinite}.w32mindmap-w2{animation-delay:-.8s}.w32mindmap-w3{animation-delay:-1.6s}
.w32mindmap-bob{animation:w32mindmap-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32mindmap-dw{stroke-dasharray:420;stroke-dashoffset:0;animation:w32mindmap-dw 7s ease-in-out infinite}
.w32mindmap-eq{animation:w32mindmap-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32mindmap-e2{animation-delay:-.3s}.w32mindmap-e3{animation-delay:-.6s}.w32mindmap-e4{animation-delay:-.85s}
@keyframes w32mindmap-fl{50%{transform:translateY(-4px)}}
@keyframes w32mindmap-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32mindmap-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32mindmap-sp{to{transform:rotate(360deg)}}
@keyframes w32mindmap-pu{50%{transform:scale(1.07)}}
@keyframes w32mindmap-dr{to{stroke-dashoffset:-28}}
@keyframes w32mindmap-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32mindmap-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32mindmap-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32mindmap-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="w32mindmap-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7f3"/><stop offset="1" stop-color="#d9ece5"/></linearGradient>
<pattern id="w32mindmap-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#13887a" fill-opacity=".14"/></pattern>
<radialGradient id="w32mindmap-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w32mindmap-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w32mindmap-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w32mindmap-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="w32mindmap-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w32mindmap-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w32mindmap-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13887a" stop-opacity=".85"/><stop offset="1" stop-color="#0b5a51"/></linearGradient>
<linearGradient id="w32mindmap-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc576"/><stop offset="1" stop-color="#2f7d3a"/></linearGradient>
<linearGradient id="w32mindmap-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d7fc4"/><stop offset=".5" stop-color="#23497e"/><stop offset="1" stop-color="#16325a"/></linearGradient>
<linearGradient id="w32mindmap-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<linearGradient id="w32mindmap-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfe6ea"/><stop offset="1" stop-color="#8d9ea9"/></linearGradient>
<linearGradient id="w32mindmap-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9f4"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
</defs>
<rect x="6" y="6" width="988" height="508" rx="28" fill="url(#w32mindmap-bg)"/><rect x="6" y="6" width="988" height="508" rx="28" fill="url(#w32mindmap-dots)"/><rect x="6" y="6" width="988" height="508" rx="28" stroke="#fff" stroke-width="2"/><rect x="40" y="36" width="920" height="400" rx="20" fill="url(#w32mindmap-paper)" filter="url(#w32mindmap-sh)"/><path class="w32mindmap-dw" d="M250 150Q200 150 150 80" stroke="#e64626" stroke-width="3" stroke-dasharray="420" fill="none"/><rect x="78" y="60" width="144" height="40" rx="20" fill="#fff" stroke="#e64626" stroke-width="2.5" stroke-dasharray="7 5"/><text x="150" y="86" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#e64626" text-anchor="middle">What is it?</text><path class="w32mindmap-dw" d="M250 150Q200 150 150 260" stroke="#e64626" stroke-width="3" stroke-dasharray="420" fill="none"/><rect x="78" y="240" width="144" height="40" rx="20" fill="#fff" stroke="#e64626" stroke-width="2.5" stroke-dasharray="7 5"/><text x="150" y="266" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#e64626" text-anchor="middle">Examples</text><path class="w32mindmap-dw" d="M750 150Q800 150 850 70" stroke="#2f6db5" stroke-width="3" stroke-dasharray="420" fill="none"/><rect x="778" y="50" width="144" height="40" rx="20" fill="#fff" stroke="#2f6db5" stroke-width="2.5" stroke-dasharray="7 5"/><text x="850" y="76" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6db5" text-anchor="middle">Numbers %</text><path class="w32mindmap-dw" d="M750 150Q805 150 860 250" stroke="#2f6db5" stroke-width="3" stroke-dasharray="420" fill="none"/><rect x="788" y="230" width="144" height="40" rx="20" fill="#fff" stroke="#2f6db5" stroke-width="2.5" stroke-dasharray="7 5"/><text x="860" y="256" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6db5" text-anchor="middle">Skills gap</text><path class="w32mindmap-dw" d="M750 150Q775 150 800 360" stroke="#2f6db5" stroke-width="3" stroke-dasharray="420" fill="none"/><rect x="728" y="340" width="144" height="40" rx="20" fill="#fff" stroke="#2f6db5" stroke-width="2.5" stroke-dasharray="7 5"/><text x="800" y="366" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6db5" text-anchor="middle">Greening roles</text><path class="w32mindmap-dw" d="M750 150Q655 150 560 380" stroke="#2f6db5" stroke-width="3" stroke-dasharray="420" fill="none"/><rect x="488" y="360" width="144" height="40" rx="20" fill="#fff" stroke="#2f6db5" stroke-width="2.5" stroke-dasharray="7 5"/><text x="560" y="386" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#2f6db5" text-anchor="middle">The future</text><path d="M500 230Q375 220 250 150" stroke="#e64626" stroke-width="7" stroke-linecap="round" fill="none"/><rect x="150" y="118" width="200" height="64" rx="32" fill="#e64626" filter="url(#w32mindmap-sh)"/><text x="250" y="157" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">Definition</text><path d="M500 230Q625 220 750 150" stroke="#2f6db5" stroke-width="7" stroke-linecap="round" fill="none"/><rect x="650" y="118" width="200" height="64" rx="32" fill="#2f6db5" filter="url(#w32mindmap-sh)"/><text x="750" y="146" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">Impact on</text><text x="750" y="168" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">labour market</text><g class="w32mindmap-pu"><circle cx="500" cy="230" r="78" fill="#13887a" filter="url(#w32mindmap-sh)"/></g><g transform="translate(500 196) rotate(0) scale(1.4)"><path d="M0 10C-10 2 -10 -12 0 -20C10 -12 10 2 0 10z" fill="url(#w32mindmap-leaf)"/><path d="M0 8V-16" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/></g><text x="500" y="240" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">Green</text><text x="500" y="268" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">skills</text><rect x="140" y="452" width="720" height="48" rx="24" fill="#fff" filter="url(#w32mindmap-sh)"/><text x="170" y="483" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#14293a" text-anchor="start">Key:</text><path d="M230 477L260.0 477.0" stroke="#e64626" stroke-width="3" stroke-linecap="round"/><path d="M270 477L260.0 482.5L260.0 471.5z" fill="#e64626"/><text x="282" y="483" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">leads to</text><text x="390" y="483" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#2f6db5" text-anchor="start">↑ ↓</text><text x="432" y="483" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">rise / fall</text><text x="540" y="483" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#e3a843" text-anchor="start">%</text><text x="566" y="483" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">numbers</text><text x="668" y="483" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#3f7a3a" text-anchor="start">e.g.</text><text x="712" y="483" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">example</text>
</svg>
