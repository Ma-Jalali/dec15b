<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="A classroom seen from above with four corners labelled 1, 2, 3 and 4. Students walk from the middle to the corner of the answer they chose. In one corner, a group points at a paragraph letter on a text and one student speaks to the class.">
<title>Four corners: walk to your answer</title>
<style>
