<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="A gallery walk. Mind maps lie on three desks. Students walk around the room in a loop with sticky notes. One student sticks a yellow note on a mind map that says Add the 30%; another sticks a green tick note.">
<title>Gallery walk with sticky notes</title>
<style>
.w32mvgallery-fl{animation:w32mvgallery-fl 5s ease-in-out infinite}.w32mvgallery-d2{animation-delay:-1.6s}.w32mvgallery-d3{animation-delay:-3.2s}
.w32mvgallery-pu{animation:w32mvgallery-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w32mvgallery-dr{stroke-dasharray:8 9;animation:w32mvgallery-dr 1.4s linear infinite}
.w32mvgallery-tw{animation:w32mvgallery-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w32mvgallery-bl{animation:w32mvgallery-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w32mvgallery-wk{animation:w32mvgallery-wk .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.w32mvgallery-sp{animation:w32mvgallery-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes w32mvgallery-fl{50%{transform:translateY(-5px)}}
@keyframes w32mvgallery-pu{50%{transform:scale(1.08)}}
@keyframes w32mvgallery-dr{to{stroke-dashoffset:-34}}
@keyframes w32mvgallery-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32mvgallery-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32mvgallery-wk{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes w32mvgallery-sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
