<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="Speed interviews seen from above. An inner circle of HR representatives with folders faces out. An outer circle of candidates with CVs faces in. Curved arrows show the candidates moving one seat to the left after each round.">
<title>Speed interviews: inner and outer circle</title>
<style>
.w32mvinterview-fl{animation:w32mvinterview-fl 5s ease-in-out infinite}.w32mvinterview-d2{animation-delay:-1.6s}.w32mvinterview-d3{animation-delay:-3.2s}
.w32mvinterview-pu{animation:w32mvinterview-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w32mvinterview-dr{stroke-dasharray:8 9;animation:w32mvinterview-dr 1.4s linear infinite}
.w32mvinterview-tw{animation:w32mvinterview-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w32mvinterview-bl{animation:w32mvinterview-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w32mvinterview-wk{animation:w32mvinterview-wk .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.w32mvinterview-sp{animation:w32mvinterview-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes w32mvinterview-fl{50%{transform:translateY(-5px)}}
@keyframes w32mvinterview-pu{50%{transform:scale(1.08)}}
@keyframes w32mvinterview-dr{to{stroke-dashoffset:-34}}
@keyframes w32mvinterview-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32mvinterview-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32mvinterview-wk{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes w32mvinterview-sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="w32mvinterview-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f0fa"/><stop offset="1" stop-color="#d6e3f3"/></linearGradient>
<pattern id="w32mvinterview-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#3a58a0" fill-opacity=".15"/></pattern>
