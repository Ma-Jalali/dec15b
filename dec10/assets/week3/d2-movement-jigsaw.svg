<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="A jigsaw in two steps. Left: three expert groups, A in orange for Bowen et al. 2018, B in teal for Hyman and Smith 2023, and C in blue for Vidican Auktor 2020. Arrows lead to the right: three home groups, each with one A, one B and one C student teaching each other.">
<title>Jigsaw: expert groups, then home groups</title>
<style>
.w32mvjigsaw-fl{animation:w32mvjigsaw-fl 5s ease-in-out infinite}.w32mvjigsaw-d2{animation-delay:-1.6s}.w32mvjigsaw-d3{animation-delay:-3.2s}
.w32mvjigsaw-pu{animation:w32mvjigsaw-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w32mvjigsaw-dr{stroke-dasharray:8 9;animation:w32mvjigsaw-dr 1.4s linear infinite}
.w32mvjigsaw-tw{animation:w32mvjigsaw-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w32mvjigsaw-bl{animation:w32mvjigsaw-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w32mvjigsaw-wk{animation:w32mvjigsaw-wk .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.w32mvjigsaw-sp{animation:w32mvjigsaw-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes w32mvjigsaw-fl{50%{transform:translateY(-5px)}}
@keyframes w32mvjigsaw-pu{50%{transform:scale(1.08)}}
@keyframes w32mvjigsaw-dr{to{stroke-dashoffset:-34}}
@keyframes w32mvjigsaw-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32mvjigsaw-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32mvjigsaw-wk{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes w32mvjigsaw-sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="w32mvjigsaw-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf1e6"/><stop offset="1" stop-color="#f1e0cc"/></linearGradient>
<pattern id="w32mvjigsaw-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#b0512a" fill-opacity=".15"/></pattern>
