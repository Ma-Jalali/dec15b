<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="Four students around a table, each with a job badge: the speaker standing with notes, the timekeeper with a stopwatch, the question master with a question mark card, and the language monitor with a tick list. A curved arrow shows that the jobs move one place to the left after each turn.">
<title>Group jobs that move round the table</title>
<style>
.w32mvroles-fl{animation:w32mvroles-fl 5s ease-in-out infinite}.w32mvroles-d2{animation-delay:-1.6s}.w32mvroles-d3{animation-delay:-3.2s}
.w32mvroles-pu{animation:w32mvroles-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w32mvroles-dr{stroke-dasharray:8 9;animation:w32mvroles-dr 1.4s linear infinite}
.w32mvroles-tw{animation:w32mvroles-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w32mvroles-bl{animation:w32mvroles-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w32mvroles-wk{animation:w32mvroles-wk .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.w32mvroles-sp{animation:w32mvroles-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes w32mvroles-fl{50%{transform:translateY(-5px)}}
@keyframes w32mvroles-pu{50%{transform:scale(1.08)}}
@keyframes w32mvroles-dr{to{stroke-dashoffset:-34}}
@keyframes w32mvroles-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32mvroles-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32mvroles-wk{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes w32mvroles-sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
