<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" fill="none" role="img" aria-label="Discussion netiquette as seven icons: be patient and read the whole thread; refer back to a post; use academic style with no emojis or text speak; give your own point of view; cite your sources; be succinct; always be polite and proofread before you send.">
<title>Discussion netiquette</title>
<style>
.w32netiquette-fl{animation:w32netiquette-fl 6s ease-in-out infinite}.w32netiquette-f2{animation-delay:-2s}.w32netiquette-f3{animation-delay:-4s}
.w32netiquette-tw{animation:w32netiquette-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32netiquette-t2{animation-delay:-1s}.w32netiquette-t3{animation-delay:-2s}
.w32netiquette-bl{animation:w32netiquette-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32netiquette-b2{animation-delay:-1.7s}.w32netiquette-b3{animation-delay:-3.2s}
.w32netiquette-sp{animation:w32netiquette-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32netiquette-sr{animation-direction:reverse}
.w32netiquette-pu{animation:w32netiquette-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32netiquette-p2{animation-delay:-1.3s}
.w32netiquette-dr{stroke-dasharray:6 8;animation:w32netiquette-dr 1.6s linear infinite}
.w32netiquette-wv{animation:w32netiquette-wv 2.4s ease-out infinite}.w32netiquette-w2{animation-delay:-.8s}.w32netiquette-w3{animation-delay:-1.6s}
.w32netiquette-bob{animation:w32netiquette-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32netiquette-dw{stroke-dasharray:420;stroke-dashoffset:0;animation:w32netiquette-dw 7s ease-in-out infinite}
.w32netiquette-eq{animation:w32netiquette-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32netiquette-e2{animation-delay:-.3s}.w32netiquette-e3{animation-delay:-.6s}.w32netiquette-e4{animation-delay:-.85s}
@keyframes w32netiquette-fl{50%{transform:translateY(-4px)}}
@keyframes w32netiquette-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32netiquette-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32netiquette-sp{to{transform:rotate(360deg)}}
@keyframes w32netiquette-pu{50%{transform:scale(1.07)}}
@keyframes w32netiquette-dr{to{stroke-dashoffset:-28}}
@keyframes w32netiquette-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32netiquette-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32netiquette-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32netiquette-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="w32netiquette-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f7ec"/><stop offset="1" stop-color="#dcebd3"/></linearGradient>
<pattern id="w32netiquette-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#3f7a3a" fill-opacity=".14"/></pattern>
<radialGradient id="w32netiquette-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w32netiquette-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w32netiquette-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w32netiquette-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="w32netiquette-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w32netiquette-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w32netiquette-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f7a3a" stop-opacity=".85"/><stop offset="1" stop-color="#2a5626"/></linearGradient>
<linearGradient id="w32netiquette-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc576"/><stop offset="1" stop-color="#2f7d3a"/></linearGradient>
<linearGradient id="w32netiquette-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d7fc4"/><stop offset=".5" stop-color="#23497e"/><stop offset="1" stop-color="#16325a"/></linearGradient>
<linearGradient id="w32netiquette-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<linearGradient id="w32netiquette-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfe6ea"/><stop offset="1" stop-color="#8d9ea9"/></linearGradient>
<linearGradient id="w32netiquette-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9f4"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
</defs>
<rect x="6" y="6" width="988" height="388" rx="28" fill="url(#w32netiquette-bg)"/><rect x="6" y="6" width="988" height="388" rx="28" fill="url(#w32netiquette-dots)"/><rect x="6" y="6" width="988" height="388" rx="28" stroke="#fff" stroke-width="2"/><text x="500" y="52" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#3f7a3a" text-anchor="middle">Netiquette: 7 habits for discussion boards</text><g class="w32netiquette-fl w32netiquette-f1"><rect x="28" y="92" width="124" height="260" rx="16" fill="#fff" filter="url(#w32netiquette-sh)"/><circle cx="90" cy="160" r="38" fill="#2f6db5"/><g transform="translate(90 160)"><path d="M-14 -16h28M-14 -6h28M-14 4h20M-14 14h24" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><text x="90" y="236" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="900" fill="#2f6db5" text-anchor="middle" opacity="0.35">1</text><text x="90" y="272" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#2f6db5" text-anchor="middle">Be</text><text x="90" y="292" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#2f6db5" text-anchor="middle">patient</text><text x="90" y="328" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#14293a" text-anchor="middle">read it all first</text></g><g class="w32netiquette-fl w32netiquette-f2"><rect x="165" y="92" width="124" height="260" rx="16" fill="#fff" filter="url(#w32netiquette-sh)"/><circle cx="227" cy="160" r="38" fill="#13887a"/><g transform="translate(227 160)"><path d="M8 -10H-10l8-8M-10 -10l8 8" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M-10 10h20" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><text x="227" y="236" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="900" fill="#13887a" text-anchor="middle" opacity="0.35">2</text><text x="227" y="272" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#13887a" text-anchor="middle">Refer</text><text x="227" y="292" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#13887a" text-anchor="middle">back</text><text x="227" y="328" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#14293a" text-anchor="middle">“You mentioned …”</text></g><g class="w32netiquette-fl w32netiquette-f3"><rect x="302" y="92" width="124" height="260" rx="16" fill="#fff" filter="url(#w32netiquette-sh)"/><circle cx="364" cy="160" r="38" fill="#7a4a8c"/><g transform="translate(364 160)"><circle r="15" stroke="#fff" stroke-width="4"/><path d="M-11 11L11 -11" stroke="#fff" stroke-width="4"/></g><text x="364" y="236" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="900" fill="#7a4a8c" text-anchor="middle" opacity="0.35">3</text><text x="364" y="272" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#7a4a8c" text-anchor="middle">Academic</text><text x="364" y="292" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#7a4a8c" text-anchor="middle">style</text><text x="364" y="328" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#14293a" text-anchor="middle">no emojis, no “U”</text></g><g class="w32netiquette-fl w32netiquette-f1"><rect x="439" y="92" width="124" height="260" rx="16" fill="#fff" filter="url(#w32netiquette-sh)"/><circle cx="501" cy="160" r="38" fill="#e3a843"/><g transform="translate(501 160)"><path d="M-16 -14h32v22h-18l-10 8v-8h-4z" fill="#fff"/></g><text x="501" y="236" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="900" fill="#e3a843" text-anchor="middle" opacity="0.35">4</text><text x="501" y="272" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#e3a843" text-anchor="middle">Your</text><text x="501" y="292" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#e3a843" text-anchor="middle">view</text><text x="501" y="328" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#14293a" text-anchor="middle">“In my view, …”</text></g><g class="w32netiquette-fl w32netiquette-f2"><rect x="576" y="92" width="124" height="260" rx="16" fill="#fff" filter="url(#w32netiquette-sh)"/><circle cx="638" cy="160" r="38" fill="#b07d12"/><g transform="translate(638 160)"><text x="0" y="10" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="900" fill="#fff" text-anchor="middle">( )</text></g><text x="638" y="236" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="900" fill="#b07d12" text-anchor="middle" opacity="0.35">5</text><text x="638" y="272" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#b07d12" text-anchor="middle">Cite</text><text x="638" y="292" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#b07d12" text-anchor="middle">sources</text><text x="638" y="328" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#14293a" text-anchor="middle">(Vona et al., 2019)</text></g><g class="w32netiquette-fl w32netiquette-f3"><rect x="713" y="92" width="124" height="260" rx="16" fill="#fff" filter="url(#w32netiquette-sh)"/><circle cx="775" cy="160" r="38" fill="#e64626"/><g transform="translate(775 160)"><circle r="15" stroke="#fff" stroke-width="4"/><circle r="6" fill="#fff"/></g><text x="775" y="236" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="900" fill="#e64626" text-anchor="middle" opacity="0.35">6</text><text x="775" y="272" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#e64626" text-anchor="middle">Be</text><text x="775" y="292" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#e64626" text-anchor="middle">succinct</text><text x="775" y="328" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#14293a" text-anchor="middle">stay on point</text></g><g class="w32netiquette-fl w32netiquette-f1"><rect x="850" y="92" width="124" height="260" rx="16" fill="#fff" filter="url(#w32netiquette-sh)"/><circle cx="912" cy="160" r="38" fill="#3f7a3a"/><g transform="translate(912 160)"><path d="M-12 -2l8 9 16-18" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/></g><text x="912" y="236" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="900" fill="#3f7a3a" text-anchor="middle" opacity="0.35">7</text><text x="912" y="272" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#3f7a3a" text-anchor="middle">Be</text><text x="912" y="292" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#3f7a3a" text-anchor="middle">polite</text><text x="912" y="328" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#14293a" text-anchor="middle">then proofread</text></g>
</svg>
