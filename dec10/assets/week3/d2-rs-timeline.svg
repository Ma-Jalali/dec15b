<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" fill="none" role="img" aria-label="Timeline of the research summary task this week. Monday: research and prepare a summary on your own. Tuesday, today: share your summary in a group, then plan one group presentation. Thursday and Friday: groups give 8 to 10 minute group presentations.">
<title>The research summary week</title>
<style>
