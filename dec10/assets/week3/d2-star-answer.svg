<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" fill="none" role="img" aria-label="The STAR method for interview examples, as four steps on a path: S Situation, where and when; T Task, what you had to do; A Action, what you did; R Result, what happened, with a number if possible.">
<title>Answer interview questions with STAR</title>
<style>
.w32staranswer-fl{animation:w32staranswer-fl 6s ease-in-out infinite}.w32staranswer-f2{animation-delay:-2s}.w32staranswer-f3{animation-delay:-4s}
.w32staranswer-tw{animation:w32staranswer-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32staranswer-t2{animation-delay:-1s}.w32staranswer-t3{animation-delay:-2s}
.w32staranswer-bl{animation:w32staranswer-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32staranswer-b2{animation-delay:-1.7s}.w32staranswer-b3{animation-delay:-3.2s}
.w32staranswer-sp{animation:w32staranswer-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32staranswer-sr{animation-direction:reverse}
.w32staranswer-pu{animation:w32staranswer-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32staranswer-p2{animation-delay:-1.3s}
.w32staranswer-dr{stroke-dasharray:6 8;animation:w32staranswer-dr 1.6s linear infinite}
.w32staranswer-wv{animation:w32staranswer-wv 2.4s ease-out infinite}.w32staranswer-w2{animation-delay:-.8s}.w32staranswer-w3{animation-delay:-1.6s}
.w32staranswer-bob{animation:w32staranswer-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32staranswer-dw{stroke-dasharray:420;stroke-dashoffset:420;animation:w32staranswer-dw 7s ease-in-out infinite}
.w32staranswer-eq{animation:w32staranswer-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32staranswer-e2{animation-delay:-.3s}.w32staranswer-e3{animation-delay:-.6s}.w32staranswer-e4{animation-delay:-.85s}
@keyframes w32staranswer-fl{50%{transform:translateY(-4px)}}
@keyframes w32staranswer-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32staranswer-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32staranswer-sp{to{transform:rotate(360deg)}}
@keyframes w32staranswer-pu{50%{transform:scale(1.07)}}
@keyframes w32staranswer-dr{to{stroke-dashoffset:-28}}
@keyframes w32staranswer-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32staranswer-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32staranswer-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32staranswer-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="w32staranswer-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dbe6f6"/></linearGradient>
<pattern id="w32staranswer-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#2f6db5" fill-opacity=".14"/></pattern>
<radialGradient id="w32staranswer-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w32staranswer-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w32staranswer-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w32staranswer-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="w32staranswer-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w32staranswer-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w32staranswer-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6db5" stop-opacity=".85"/><stop offset="1" stop-color="#1d4b85"/></linearGradient>
<linearGradient id="w32staranswer-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc576"/><stop offset="1" stop-color="#2f7d3a"/></linearGradient>
<linearGradient id="w32staranswer-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d7fc4"/><stop offset=".5" stop-color="#23497e"/><stop offset="1" stop-color="#16325a"/></linearGradient>
<linearGradient id="w32staranswer-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<linearGradient id="w32staranswer-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfe6ea"/><stop offset="1" stop-color="#8d9ea9"/></linearGradient>
<linearGradient id="w32staranswer-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9f4"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
</defs>
<rect x="6" y="6" width="988" height="328" rx="28" fill="url(#w32staranswer-bg)"/><rect x="6" y="6" width="988" height="328" rx="28" fill="url(#w32staranswer-dots)"/><rect x="6" y="6" width="988" height="328" rx="28" stroke="#fff" stroke-width="2"/><rect x="40" y="250" width="200" height="70" rx="18" fill="#2f6db5" opacity=".16"/><g class="w32staranswer-fl w32staranswer-f1"><circle cx="140" cy="246" r="34" fill="#2f6db5" filter="url(#w32staranswer-sh)"/><text x="140" y="259" font-family="Manrope, Arial, sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">S</text></g><text x="140" y="312" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#2f6db5" text-anchor="middle">Situation</text><text x="140" y="338" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">Where and when?</text><path d="M180 230L326.2 203.8" stroke="#14293a" stroke-width="3" stroke-linecap="round" class="w32staranswer-dr"/><path d="M336 202L327.1 209.2L325.2 198.4z" fill="#14293a"/><rect x="280" y="216" width="200" height="104" rx="18" fill="#13887a" opacity=".16"/><g class="w32staranswer-fl w32staranswer-f2"><circle cx="380" cy="212" r="34" fill="#13887a" filter="url(#w32staranswer-sh)"/><text x="380" y="225" font-family="Manrope, Arial, sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">T</text></g><text x="380" y="278" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#13887a" text-anchor="middle">Task</text><text x="380" y="304" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">What did you have to do?</text><path d="M420 196L566.2 169.8" stroke="#14293a" stroke-width="3" stroke-linecap="round" class="w32staranswer-dr"/><path d="M576 168L567.1 175.2L565.2 164.4z" fill="#14293a"/><rect x="520" y="182" width="200" height="138" rx="18" fill="#e3a843" opacity=".16"/><g class="w32staranswer-fl w32staranswer-f3"><circle cx="620" cy="178" r="34" fill="#e3a843" filter="url(#w32staranswer-sh)"/><text x="620" y="191" font-family="Manrope, Arial, sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">A</text></g><text x="620" y="244" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#e3a843" text-anchor="middle">Action</text><text x="620" y="270" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">What did YOU do?</text><text x="620" y="296" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#3d5466" text-anchor="middle">“I introduced …”</text><path d="M660 162L806.2 135.8" stroke="#14293a" stroke-width="3" stroke-linecap="round" class="w32staranswer-dr"/><path d="M816 134L807.1 141.2L805.2 130.4z" fill="#14293a"/><rect x="760" y="148" width="200" height="172" rx="18" fill="#e64626" opacity=".16"/><g class="w32staranswer-fl w32staranswer-f1"><circle cx="860" cy="144" r="34" fill="#e64626" filter="url(#w32staranswer-sh)"/><text x="860" y="157" font-family="Manrope, Arial, sans-serif" font-size="36" font-weight="900" fill="#fff" text-anchor="middle">R</text></g><text x="860" y="210" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#e64626" text-anchor="middle">Result</text><text x="860" y="236" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">What happened? A number!</text><text x="860" y="262" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#3d5466" text-anchor="middle">“Energy use fell by 15%.”</text><path class="w32staranswer-pu" d="M950.0 32.0L954.8 43.4L967.1 44.4L957.7 52.5L960.6 64.6L950.0 58.1L939.4 64.6L942.3 52.5L932.9 44.4L945.2 43.4z" fill="#e3a843"/><path class="w32staranswer-tw w32staranswer-t2" d="M50 42.5C51.35 48.65 51.35 48.65 57.5 50C51.35 51.35 51.35 51.35 50 57.5C48.65 51.35 48.65 51.35 42.5 50C48.65 48.65 48.65 48.65 50 42.5z" fill="#2f6db5"/>
</svg>
