ont-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">storage</text></g><path d="M734 278V328" stroke="#14293a" stroke-opacity=".25" stroke-width="2" stroke-dasharray="4 5"/><g class="w32techspectrum-fl w32techspectrum-f3"><rect x="824" y="60" width="132" height="210" rx="16" fill="#fff" filter="url(#w32techspectrum-sh)"/><g transform="translate(890 148)"><g transform="translate(0 4) scale(1.2)" filter="url(#w32techspectrum-sh)"><path d="M-40 6C-40 -4 -36 -8 -28 -9L-18 -22C-15 -26 -11 -27 -6 -27H14C19 -27 23 -25 26 -21L34 -9C40 -8 42 -4 42 6V12H-40z" fill="#e64626"/><path d="M-14 -21H-1V-10H-23z" fill="#dff3f7"/><path d="M3 -21H14C17 -21 19 -20 21 -17L26 -10H3z" fill="#dff3f7"/><circle cx="-24" cy="12" r="8" fill="#14293a"/><circle cx="-24" cy="12" r="3.5" fill="#c8d4da"/><circle cx="26" cy="12" r="8" fill="#14293a"/><circle cx="26" cy="12" r="3.5" fill="#c8d4da"/><path d="M5 -6l-5 8h5l-4 8 10-11h-5l4-5z" fill="#e3a843"/><rect x="36" y="-4" width="6" height="4" rx="1.5" fill="#fff" opacity=".8"/></g></g><text x="890" y="240" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">Electric</text><text x="890" y="261" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">vehicles</text></g><path d="M890 278V328" stroke="#14293a" stroke-opacity=".25" stroke-width="2" stroke-dasharray="4 5"/><text x="500" y="52" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="900" fill="#13887a" text-anchor="middle">Green job areas</text><path class="w32techspectrum-tw w32techspectrum-t1" d="M950 42C951.44 48.56 951.44 48.56 958 50C951.44 51.44 951.44 51.44 950 58C948.56 51.44 948.56 51.44 942 50C948.56 48.56 948.56 48.56 950 42z" fill="#e3a843"/>
