<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="A spectrum of six green job areas, from lower technological sophistication on the left to higher technological sophistication on the right: waste water treatment, recycling, solar panels, bioenergy, battery energy storage and electric vehicles.">
<title>Green job areas from lower to higher technological sophistication</title>
<style>
.w32techspectrum-fl{animation:w32techspectrum-fl 6s ease-in-out infinite}.w32techspectrum-f2{animation-delay:-2s}.w32techspectrum-f3{animation-delay:-4s}
.w32techspectrum-tw{animation:w32techspectrum-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32techspectrum-t2{animation-delay:-1s}.w32techspectrum-t3{animation-delay:-2s}
.w32techspectrum-bl{animation:w32techspectrum-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32techspectrum-b2{animation-delay:-1.7s}.w32techspectrum-b3{animation-delay:-3.2s}
.w32techspectrum-sp{animation:w32techspectrum-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32techspectrum-sr{animation-direction:reverse}
.w32techspectrum-pu{animation:w32techspectrum-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32techspectrum-p2{animation-delay:-1.3s}
.w32techspectrum-dr{stroke-dasharray:6 8;animation:w32techspectrum-dr 1.6s linear infinite}
.w32techspectrum-wv{animation:w32techspectrum-wv 2.4s ease-out infinite}.w32techspectrum-w2{animation-delay:-.8s}.w32techspectrum-w3{animation-delay:-1.6s}
.w32techspectrum-bob{animation:w32techspectrum-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32techspectrum-dw{stroke-dasharray:420;stroke-dashoffset:0;animation:w32techspectrum-dw 7s ease-in-out infinite}
.w32techspectrum-eq{animation:w32techspectrum-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32techspectrum-e2{animation-delay:-.3s}.w32techspectrum-e3{animation-delay:-.6s}.w32techspectrum-e4{animation-delay:-.85s}
@keyframes w32techspectrum-fl{50%{transform:translateY(-4px)}}
@keyframes w32techspectrum-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32techspectrum-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32techspectrum-sp{to{transform:rotate(360deg)}}
@keyframes w32techspectrum-pu{50%{transform:scale(1.07)}}
@keyframes w32techspectrum-dr{to{stroke-dashoffset:-28}}
@keyframes w32techspectrum-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32techspectrum-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32techspectrum-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32techspectrum-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="w32techspectrum-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7f3"/><stop offset="1" stop-color="#d9ece5"/></linearGradient>
<pattern id="w32techspectrum-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#13887a" fill-opacity=".14"/></pattern>
<radialGradient id="w32techspectrum-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w32techspectrum-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w32techspectrum-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w32techspectrum-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="w32techspectrum-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w32techspectrum-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w32techspectrum-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13887a" stop-opacity=".85"/><stop offset="1" stop-color="#0b5a51"/></linearGradient>
<linearGradient id="w32techspectrum-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc576"/><stop offset="1" stop-color="#2f7d3a"/></linearGradient>
<linearGradient id="w32techspectrum-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d7fc4"/><stop offset=".5" stop-color="#23497e"/><stop offset="1" stop-color="#16325a"/></linearGradient>
<linearGradient id="w32techspectrum-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<linearGradient id="w32techspectrum-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfe6ea"/><stop offset="1" stop-color="#8d9ea9"/></linearGradient>
<linearGradient id="w32techspectrum-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9f4"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
</defs>
<rect x="6" y="6" width="988" height="408" rx="28" fill="url(#w32techspectrum-bg)"/><rect x="6" y="6" width="988" height="408" rx="28" fill="url(#w32techspectrum-dots)"/><rect x="6" y="6" width="988" height="408" rx="28" stroke="#fff" stroke-width="2"/><linearGradient id="w32techspectrum-spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fd4c8"/><stop offset=".5" stop-color="#e3a843"/><stop offset="1" stop-color="#e64626"/></linearGradient><rect x="60" y="330" width="880" height="22" rx="11" fill="url(#w32techspectrum-spec)"/><path d="M60 341L928.0 341.0" stroke="#14293a" stroke-width="0.1" stroke-linecap="round"/><path d="M950 341L928.0 353.1L928.0 328.9z" fill="#14293a"/><text x="70" y="384" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#13887a" text-anchor="start">← Lower technological sophistication</text><text x="930" y="384" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#e64626" text-anchor="end">Higher technological sophistication →</text><g class="w32techspectrum-fl w32techspectrum-f1"><rect x="44" y="100" width="132" height="170" rx="16" fill="#fff" filter="url(#w32techspectrum-sh)"/><g transform="translate(110 168)"><g transform="translate(0 0) scale(2.2)"><path d="M0 -18C6 -8 12 -2 12 6A12 12 0 0 1 -12 6C-12 -2 -6 -8 0 -18z" fill="#2d7a9a" filter="url(#w32techspectrum-sh)"/><path d="M-6 4A6 6 0 0 0 -2 11" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/></g></g><text x="110" y="240" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">Waste water</text><text x="110" y="261" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">treatment</text></g><path d="M110 278V328" stroke="#14293a" stroke-opacity=".25" stroke-width="2" stroke-dasharray="4 5"/><g class="w32techspectrum-fl w32techspectrum-f2"><rect x="200" y="92" width="132" height="178