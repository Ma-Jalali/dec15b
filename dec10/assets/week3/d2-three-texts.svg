<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" fill="none" role="img" aria-label="Three overlapping circles, one for each text: Bowen et al. (2018), a reading; Hyman and Smith (2023), a podcast; Vidican Auktor (2020), a report. The space where all three overlap holds a question mark: what ideas are the same in all three?">
<title>Where do the three texts meet?</title>
<style>
