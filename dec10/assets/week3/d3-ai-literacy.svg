<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" fill="none" role="img" aria-label="Digital literacy tools: AI. Five overlapping circles: using tools to support learning; making choices based on relevance for learning; using prompts (today’s focus); critical engagement with AI generated output; acknowledging use of AI.">
<title>Digital literacy tools: AI. Five overlapping circles: using tools to support learning; making choices based on relevance for learning; using prompts (today’s focus); critical engagement with AI generated output; acknowledging use of AI.</title>
<style>
