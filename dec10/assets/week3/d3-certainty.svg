<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" fill="none" role="img" aria-label="A certainty meter. At the top, too certain for academic writing: will definitely, always, never, everyone, really. Lower down, hedged academic language: will probably, is likely to, tends to, may, might, could, it is possible that.">
<title>A certainty meter. At the top, too certain for academic writing: will definitely, always, never, everyone, really. Lower down, hedged academic language: will probably, is likely to, tends to, may, might, could, it is possible that.</title>
<style>
.w3d3d6-fl{animation:w3d3d6-fl 6s ease-in-out infinite}.w3d3d6-f2{animation:w3d3d6-fl 7s ease-in-out -2.5s infinite}.w3d3d6-f3{animation:w3d3d6-fl 5.5s ease-in-out -4s infinite}
.w3d3d6-tw{animation:w3d3d6-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3d6-t2{animation-delay:-1.1s}.w3d3d6-t3{animation-delay:-2.2s}
.w3d3d6-bl{animation:w3d3d6-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3d6-b2{animation-delay:-1.7s}.w3d3d6-b3{animation-delay:-3.1s}
.w3d3d6-pu{animation:w3d3d6-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3d6-p2{animation-delay:-1.6s}
.w3d3d6-dr{stroke-dasharray:6 8;animation:w3d3d6-dr 1.8s linear infinite}
.w3d3d6-sp{animation:w3d3d6-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3d6-ca{animation:w3d3d6-ca 1.1s steps(1) infinite}
.w3d3d6-sw{animation:w3d3d6-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3d6-wv{animation:w3d3d6-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3d6-w2{animation-delay:.85s}.w3d3d6-w3{animation-delay:1.7s}
.w3d3d6-rv{animation:w3d3d6-rv 5s ease-in-out infinite}
.w3d3d6-gl{animation:w3d3d6-gl 5s ease-in-out infinite}
@keyframes w3d3d6-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3d6-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3d6-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d3d6-pu{0%,100%{transform:scale(1)}20%{transform:scale(1.08)}40%{transform:scale(1)}}
@keyframes w3d3d6-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3d6-sp{to{transform:rotate(360deg)}}
@keyframes w3d3d6-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3d6-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3d6-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3d6-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3d6-gl{0%,100%{opacity:.55}50%{opacity:1}}
.w3d3d6-ar{animation:w3d3d6-ar 5s ease-in-out infinite}@keyframes w3d3d6-ar{0%,100%{transform:translateY(0)}50%{transform:translateY(190px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d3d6-wv{opacity:.8}.w3d3d6-rv{opacity:1}}
</style>
<defs>
<linearGradient id="w3d3d6-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcf4ee"/><stop offset="1" stop-color="#f6e6dc"/></linearGradient>
<pattern id="w3d3d6-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#b0512a" fill-opacity=".11"/></pattern>
<radialGradient id="w3d3d6-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w3d3d6-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d3d6-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b0512a"/><stop offset="1" stop-color="#8a3c1d"/></linearGradient>
<linearGradient id="w3d3d6-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient>
<linearGradient id="w3d3d6-scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22384d"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d3d6-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#e0a526"/></linearGradient>
<filter id="w3d3d6-sh" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#14293a" flood-opacity=".13"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w3d3d6-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/></filter>
<filter id="w3d3d6-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<linearGradient id="w3d3d6-th" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c0392b"/><stop offset=".45" stop-color="#f2c14e"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
</defs>
<rect width="960" height="380" rx="28" fill="url(#w3d3d6-bg)"/><rect width="960" height="380" rx="28" fill="url(#w3d3d6-dots)"/>
<ellipse cx="787.1999999999999" cy="68.39999999999999" rx="211.2" ry="98.8" fill="#f6e1d6" opacity=".7" filter="url(#w3d3d6-blur)"/>
<ellipse cx="134.4" cy="326.8" rx="192" ry="76" fill="#fff" opacity=".65" filter="url(#w3d3d6-blur)"/>
<rect x="70" y="40" width="60" height="306" rx="30" fill="#fff" stroke="#e0cfc4" stroke-width="3" filter="url(#w3d3d6-sm)"/><rect x="82" y="52" width="36" height="276" rx="18" fill="url(#w3d3d6-th)"/><text x="100" y="28" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#c0392b" text-anchor="middle">100% certain</text><text x="100" y="366" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#2f7d6b" text-anchor="middle">cautious</text><g class="w3d3d6-ar"><path d="M60 110L40 100v20z" fill="#14293a"/></g><rect x="230" y="34" width="690" height="120" rx="14" fill="url(#w3d3d6-pap)" filter="url(#w3d3d6-sh)"/><rect x="230" y="34" width="10" height="120" rx="5" fill="#c0392b"/><text x="260" y="70" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#c0392b" text-anchor="start">Too certain (no evidence?)</text><rect x="260" y="92" width="156" height="34" rx="17" fill="#f8d7d0"/><text x="338" y="115" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#a3302a" text-anchor="middle">will definitely</text><path d="M270 109h136" stroke="#c0392b" stroke-width="2" opacity=".6"/><rect x="430" y="92" width="80.4" height="34" rx="17" fill="#f8d7d0"/><text x="470.2" y="115" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#a3302a" text-anchor="middle">always</text><path d="M440 109h60.400000000000006" stroke="#c0392b" stroke-width="2" opacity=".6"/><rect x="524.4" y="92" width="72" height="34" rx="17" fill="#f8d7d0"/><text x="560.4" y="115" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#a3302a" text-anchor="middle">never</text><path d="M534.4 109h52" stroke="#c0392b" stroke-width="2" opacity=".6"/><rect x="610.4" y="92" width="97.2" height="34" rx="17" fill="#f8d7d0"/><text x="659" y="115" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#a3302a" text-anchor="middle">everyone</text><path d="M620.4 109h77.2" stroke="#c0392b" stroke-width="2" opacity=".6"/><rect x="721.6" y="92" width="80.4" height="34" rx="17" fill="#f8d7d0"/><text x="761.8" y="115" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#a3302a" text-anchor="middle">really</text><path d="M731.6 109h60.400000000000006" stroke="#c0392b" stroke-width="2" opacity=".6"/><rect x="230" y="180" width="690" height="160" rx="14" fill="url(#w3d3d6-pap)" filter="url(#w3d3d6-sh)"/><rect x="230" y="180" width="10" height="160" rx="5" fill="#2f7d6b"/><text x="260" y="216" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#2f7d6b" text-anchor="start">Hedged — careful, academic</text><g class="w3d3d6-fl" style="animation-delay:-0s"><rect x="260" y="236" width="139.2" height="36" rx="18" fill="#d8eee5"/><text x="329.6" y="260" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#215c4e" text-anchor="middle">will probably</text></g><g class="w3d3d6-fl" style="animation-delay:-0.6s"><rect x="413.2" y="236" width="130.8" height="36" rx="18" fill="#d8eee5"/><text x="478.6" y="260" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#215c4e" text-anchor="middle">is likely to</text></g><g class="w3d3d6-fl" style="animation-delay:-1.2s"><rect x="558" y="236" width="97.2" height="36" rx="18" fill="#d8eee5"/><text x="606.6" y="260" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#215c4e" text-anchor="middle">tends to</text></g><g class="w3d3d6-fl" style="animation-delay:-1.7999999999999998s"><rect x="669.2" y="236" width="55.2" height="36" rx="18" fill="#d8eee5"/><text x="696.8" y="260" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#215c4e" text-anchor="middle">may</text></g><g class="w3d3d6-fl" style="animation-delay:-2.4s"><rect x="738.4000000000001" y="236" width="72" height="36" rx="18" fill="#d8eee5"/><text x="774.4" y="260" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#215c4e" text-anchor="middle">might</text></g><g class="w3d3d6-fl" style="animation-delay:-3s"><rect x="824.4000000000001" y="236" width="72" height="36" rx="18" fill="#d8eee5"/><text x="860.4" y="260" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#215c4e" text-anchor="middle">could</text></g><g class="w3d3d6-fl" style="animation-delay:-3.5999999999999996s"><rect x="260" y="286" width="189.6" height="36" rx="18" fill="#d8eee5"/><text x="354.8" y="310" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#215c4e" text-anchor="middle">it is possible that</text></g><g class="w3d3d6-fl" style="animation-delay:-4.2s"><rect x="463.6" y="286" width="189.6" height="36" rx="18" fill="#d8eee5"/><text x="558.4" y="310" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#215c4e" text-anchor="middle">It is likely that …</text></g>
</svg>
