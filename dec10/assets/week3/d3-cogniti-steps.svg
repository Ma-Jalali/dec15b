<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none" role="img" aria-label="How to log in to Cogniti in seven steps: 1 go to app.cogniti.ai; 2 click Log in, then Log in with Australian Access Federation (or Log in with Microsoft); 3 search for The University of Sydney; 4 log in with your Unikey and password; 5 verify your access and click Approve; 6 click Chat with agents; 7 search for agents and pin them.">
<title>How to log in to Cogniti in seven steps: 1 go to app.cogniti.ai; 2 click Log in, then Log in with Australian Access Federation (or Log in with Microsoft); 3 search for The University of Sydney; 4 log in with your Unikey and password; 5 verify your access and click Approve; 6 click Chat with agents; 7 search for agents and pin them.</title>
<style>
