.w3d3d17-wv{animation:w3d3d17-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3d17-w2{animation-delay:.85s}.w3d3d17-w3{animation-delay:1.7s}
.w3d3d17-rv{animation:w3d3d17-rv 5s ease-in-out infinite}
.w3d3d17-gl{animation:w3d3d17-gl 5s ease-in-out infinite}
