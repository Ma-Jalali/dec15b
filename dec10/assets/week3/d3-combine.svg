<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none" role="img" aria-label="Eleven draft sentences become seven revised sentences. Draft 1 to revised 1, draft 2 to revised 2, draft 3 and 4 join into revised 3 with “and” and noun phrases, draft 5, 6, 7 and 8 join into revised 4 with a noun phrase subject and “can be attributed to”, draft 9 to 5, draft 10 to 6, draft 11 to 7.">
<title>Eleven draft sentences become seven revised sentences. Draft 1 to revised 1, draft 2 to revised 2, draft 3 and 4 join into revised 3 with “and” and noun phrases, draft 5, 6, 7 and 8 join into revised 4 with a noun phrase subject and “can be attributed to”, draft 9 to 5, draft 10 to 6, draft 11 to 7.</title>
<style>
.w3d3d7-fl{animation:w3d3d7-fl 6s ease-in-out infinite}.w3d3d7-f2{animation:w3d3d7-fl 7s ease-in-out -2.5s infinite}.w3d3d7-f3{animation:w3d3d7-fl 5.5s ease-in-out -4s infinite}
.w3d3d7-tw{animation:w3d3d7-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3d7-t2{animation-delay:-1.1s}.w3d3d7-t3{animation-delay:-2.2s}
.w3d3d7-bl{animation:w3d3d7-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3d7-b2{animation-delay:-1.7s}.w3d3d7-b3{animation-delay:-3.1s}
.w3d3d7-pu{animation:w3d3d7-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3d7-p2{animation-delay:-1.6s}
.w3d3d7-dr{stroke-dasharray:6 8;animation:w3d3d7-dr 1.8s linear infinite}
.w3d3d7-sp{animation:w3d3d7-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3d7-ca{animation:w3d3d7-ca 1.1s steps(1) infinite}
.w3d3d7-sw{animation:w3d3d7-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3d7-wv{animation:w3d3d7-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3d7-w2{animation-delay:.85s}.w3d3d7-w3{animation-delay:1.7s}
.w3d3d7-rv{animation:w3d3d7-rv 5s ease-in-out infinite}
.w3d3d7-gl{animation:w3d3d7-gl 5s ease-in-out infinite}
@keyframes w3d3d7-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3d7-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3d7-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d3d7-pu{0%,100%{transform:scale(1)}20%{transform:scale(1.08)}40%{transform:scale(1)}}
@keyframes w3d3d7-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3d7-sp{to{transform:rotate(360deg)}}
@keyframes w3d3d7-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3d7-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3d7-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3d7-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3d7-gl{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d3d7-wv{opacity:.8}.w3d3d7-rv{opacity:1}}
</style>
