<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" fill="none" role="img" aria-label="Copilot with data protection. Log in with firstname.lastname@sydney.edu.au, not unikey@sydney.edu.au, and look for the green badge next to your profile. Benefits: searches are not linked to individual user accounts, prompts and responses are not saved, and no one at Microsoft can view your data.">
<title>Copilot with data protection. Log in with firstname.lastname@sydney.edu.au, not unikey@sydney.edu.au, and look for the green badge next to your profile. Benefits: searches are not linked to individual user accounts, prompts and responses are not saved, and no one at Microsoft can view your data.</title>
<style>
.w3d3d18-fl{animation:w3d3d18-fl 6s ease-in-out infinite}.w3d3d18-f2{animation:w3d3d18-fl 7s ease-in-out -2.5s infinite}.w3d3d18-f3{animation:w3d3d18-fl 5.5s ease-in-out -4s infinite}
.w3d3d18-tw{animation:w3d3d18-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3d18-t2{animation-delay:-1.1s}.w3d3d18-t3{animation-delay:-2.2s}
.w3d3d18-bl{animation:w3d3d18-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3d18-b2{animation-delay:-1.7s}.w3d3d18-b3{animation-delay:-3.1s}
.w3d3d18-pu{animation:w3d3d18-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3d18-p2{animation-delay:-1.6s}
.w3d3d18-dr{stroke-dasharray:6 8;animation:w3d3d18-dr 1.8s linear infinite}
.w3d3d18-sp{animation:w3d3d18-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3d18-ca{animation:w3d3d18-ca 1.1s steps(1) infinite}
.w3d3d18-sw{animation:w3d3d18-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3d18-wv{animation:w3d3d18-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3d18-w2{animation-delay:.85s}.w3d3d18-w3{animation-delay:1.7s}
.w3d3d18-rv{animation:w3d3d18-rv 5s ease-in-out infinite}
.w3d3d18-gl{animation:w3d3d18-gl 5s ease-in-out infinite}
@keyframes w3d3d18-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3d18-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3d18-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d3d18-pu{0%,100%{transform:scale(1)}20%{transform:scale(1.08)}40%{transform:scale(1)}}
@keyframes w3d3d18-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3d18-sp{to{transform:rotate(360deg)}}
@keyframes w3d3d18-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3d18-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3d18-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3d18-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3d18-gl{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d3d18-wv{opacity:.8}.w3d3d18-rv{opacity:1}}
</style>
<defs>
<linearGradient id="w3d3d18-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f2fa"/><stop offset="1" stop-color="#ece2f3"/></linearGradient>
<pattern id="w3d3d18-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#7a4a8c" fill-opacity=".11"/></pattern>
<radialGradient id="w3d3d18-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w3d3d18-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d3d18-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a8c"/><stop offset="1" stop-color="#5c3569"/></linearGradient>
<linearGradient id="w3d3d18-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient>
<linearGradient id="w3d3d18-scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22384d"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d3d18-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#e0a526"/></linearGradient>
<filter id="w3d3d18-sh" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#14293a" flood-opacity=".13"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w3d3d18-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/></filter>
<filter id="w3d3d18-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>

</defs>
<rect width="960" height="400" rx="28" fill="url(#w3d3d18-bg)"/><rect width="960" height="400" rx="28" fill="url(#w3d3d18-dots)"/>
<ellipse cx="787.1999999999999" cy="72" rx="211.2" ry="104" fill="#ebdff1" opacity=".7" filter="url(#w3d3d18-blur)"/>
<ellipse cx="134.4" cy="344" rx="192" ry="80" fill="#fff" opacity=".65" filter="url(#w3d3d18-blur)"/>
<text x="40" y="50" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#2d7a9a" text-anchor="start">1 · Log in with your university email</text><rect x="40" y="70" width="400" height="64" rx="14" fill="url(#w3d3d18-pap)" filter="url(#w3d3d18-sm)"/><circle cx="76" cy="102" r="16" fill="#2f7d6b"/><path d="M68.8 102l5.12 5.44 9.6-10.56" stroke="#fff" stroke-width="4.16" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="108" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="start">firstname.lastname@sydney.edu.au</text><rect x="40" y="148" width="400" height="64" rx="14" fill="url(#w3d3d18-pap)" filter="url(#w3d3d18-sm)"/><circle cx="76" cy="180" r="16" fill="#c0392b"/><path d="M69.92 173.92l12.16 12.16M82.08 173.92l-12.16 12.16" stroke="#fff" stroke-width="3.84" stroke-linecap="round"/><text x="104" y="186" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#7f8c99" text-anchor="start">unikey@sydney.edu.au</text><path d="M100 181h196" stroke="#c0392b" stroke-width="2.5"/><text x="40" y="262" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#2d7a9a" text-anchor="start">2 · Look for the green badge</text><rect x="40" y="280" width="400" height="92" rx="14" fill="url(#w3d3d18-pap)" filter="url(#w3d3d18-sm)"/><circle cx="96" cy="326" r="28" fill="#d9a07a"/><path d="M68 318c0-18 12-26 28-26s28 8 28 26c-8-6-18-9-28-9s-20 3-28 9z" fill="#2b1d16"/><g class="w3d3d18-pu"><path d="M128 300c9 0 16-4 16-4v14c0 12-9 18-16 20-7-2-16-8-16-20v-14s7 4 16 4z" fill="#2f9e5f"/><path d="M121 314l5 5 9-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g><text x="170" y="320" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#2f9e5f" text-anchor="start">Protected</text><text x="170" y="344" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a" text-anchor="start">your data is safe here</text><text x="500" y="50" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#2d7a9a" text-anchor="start">3 · Benefits of data protection</text><g class="w3d3d18-fl" style="animation-delay:-0s"><rect x="500" y="70" width="420" height="84" rx="14" fill="url(#w3d3d18-pap)" filter="url(#w3d3d18-sm)"/><path d="M540 92c9 0 16-4 16-4v16c0 13-9 19-16 22-7-3-16-9-16-22v-16s7 4 16 4z" fill="#2f9e5f"/><path d="M533 110l5 5 9-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><text x="576" y="108" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">Searches not linked to</text><text x="576" y="129" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">individual user accounts</text></g><g class="w3d3d18-fl" style="animation-delay:-1.3s"><rect x="500" y="170" width="420" height="84" rx="14" fill="url(#w3d3d18-pap)" filter="url(#w3d3d18-sm)"/><path d="M540 192c9 0 16-4 16-4v16c0 13-9 19-16 22-7-3-16-9-16-22v-16s7 4 16 4z" fill="#2f9e5f"/><path d="M533 210l5 5 9-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><text x="576" y="208" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">Prompts and responses are not</text><text x="576" y="229" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">saved</text></g><g class="w3d3d18-fl" style="animation-delay:-2.6s"><rect x="500" y="270" width="420" height="84" rx="14" fill="url(#w3d3d18-pap)" filter="url(#w3d3d18-sm)"/><path d="M540 292c9 0 16-4 16-4v16c0 13-9 19-16 22-7-3-16-9-16-22v-16s7 4 16 4z" fill="#2f9e5f"/><path d="M533 310l5 5 9-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><text x="576" y="308" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">No one at Microsoft can view</text><text x="576" y="329" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">your data</text></g>
</svg>
