<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none" role="img" aria-label="An email to a lecturer in seven parts: 1 subject line with student number, 2 formal greeting, 3 who you are, 4 thanks and context, 5 your request, 6 polite closing, 7 your name and student number.">
<title>An email to a lecturer in seven parts: 1 subject line with student number, 2 formal greeting, 3 who you are, 4 thanks and context, 5 your request, 6 polite closing, 7 your name and student number.</title>
<style>
.w3d3d3-fl{animation:w3d3d3-fl 6s ease-in-out infinite}.w3d3d3-f2{animation:w3d3d3-fl 7s ease-in-out -2.5s infinite}.w3d3d3-f3{animation:w3d3d3-fl 5.5s ease-in-out -4s infinite}
.w3d3d3-tw{animation:w3d3d3-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3d3-t2{animation-delay:-1.1s}.w3d3d3-t3{animation-delay:-2.2s}
.w3d3d3-bl{animation:w3d3d3-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3d3-b2{animation-delay:-1.7s}.w3d3d3-b3{animation-delay:-3.1s}
.w3d3d3-pu{animation:w3d3d3-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3d3-p2{animation-delay:-1.6s}
.w3d3d3-dr{stroke-dasharray:6 8;animation:w3d3d3-dr 1.8s linear infinite}
.w3d3d3-sp{animation:w3d3d3-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3d3-ca{animation:w3d3d3-ca 1.1s steps(1) infinite}
.w3d3d3-sw{animation:w3d3d3-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3d3-wv{animation:w3d3d3-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3d3-w2{animation-delay:.85s}.w3d3d3-w3{animation-delay:1.7s}
.w3d3d3-rv{animation:w3d3d3-rv 5s ease-in-out infinite}
.w3d3d3-gl{animation:w3d3d3-gl 5s ease-in-out infinite}
@keyframes w3d3d3-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3d3-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3d3-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d3d3-pu{0%,100%{transform:scale(1)}20%{transform:scale(1.08)}40%{transform:scale(1)}}
@keyframes w3d3d3-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3d3-sp{to{transform:rotate(360deg)}}
@keyframes w3d3d3-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3d3-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3d3-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3d3-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3d3-gl{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d3d3-wv{opacity:.8}.w3d3d3-rv{opacity:1}}
</style>
<defs>
<linearGradient id="w3d3d3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#e2eaf7"/></linearGradient>
<pattern id="w3d3d3-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#3a58a0" fill-opacity=".11"/></pattern>
<radialGradient id="w3d3d3-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w3d3d3-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d3d3-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a58a0"/><stop offset="1" stop-color="#2a4178"/></linearGradient>
<linearGradient id="w3d3d3-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient>
<linearGradient id="w3d3d3-scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22384d"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d3d3-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#e0a526"/></linearGradient>
<filter id="w3d3d3-sh" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#14293a" flood-opacity=".13"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w3d3d3-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/></filter>
<filter id="w3d3d3-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>

</defs>
<rect width="960" height="560" rx="28" fill="url(#w3d3d3-bg)"/><rect width="960" height="560" rx="28" fill="url(#w3d3d3-dots)"/>
<ellipse cx="787.1999999999999" cy="100.8" rx="211.2" ry="145.6" fill="#dfe7f6" opacity=".7" filter="url(#w3d3d3-blur)"/>
<ellipse cx="134.4" cy="481.59999999999997" rx="192" ry="112" fill="#fff" opacity=".65" filter="url(#w3d3d3-blur)"/>
<rect x="110" y="30" width="820" height="510" rx="14" fill="url(#w3d3d3-pap)" filter="url(#w3d3d3-sh)"/><path d="M110 44q0-14 14-14h792q14 0 14 14v24h-820z" fill="#3a58a0"/><circle cx="134" cy="49" r="5" fill="#fff" opacity=".8"/><circle cx="152" cy="49" r="5" fill="#fff" opacity=".8"/><circle cx="170" cy="49" r="5" fill="#fff" opacity=".8"/><text x="912" y="55" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="end">New message</text><path d="M130 113.2h780" stroke="#e1e6ef" stroke-width="2"/><circle class="w3d3d3-pu" cx="67.2" cy="95.2" r="21" fill="#3a58a0" opacity=".16"/><circle cx="67.2" cy="95.2" r="15" fill="#fff" stroke="#3a58a0" stroke-width="2.5"/><path d="M89.2 95.2H124" stroke="#3a58a0" stroke-width="2" stroke-dasharray="3 4"/><text x="136" y="101.2" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#14293a" text-anchor="start">Subject: Student # 12345678: Query about reading recommendations</text><rect x="797.6" y="82.2" width="120.39999999999999" height="26" rx="13" fill="#3a58a0"/><text x="857.8" y="99.9" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Subject line</text><circle class="w3d3d3-pu" cx="67.2" cy="173.6" r="21" fill="#2f7d6b" opacity=".16"/><circle cx="67.2" cy="173.6" r="15" fill="#fff" stroke="#2f7d6b" stroke-width="2.5"/><path d="M89.2 173.6H124" stroke="#2f7d6b" stroke-width="2" stroke-dasharray="3 4"/><text x="136" y="179.6" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="start">Dear Dr. X,</text><rect x="773" y="160.6" width="145" height="26" rx="13" fill="#2f7d6b"/><text x="845.5" y="178.3" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Formal greeting</text><circle class="w3d3d3-pu" cx="67.2" cy="240.79999999999998" r="21" fill="#8a4f9e" opacity=".16"/><circle cx="67.2" cy="240.79999999999998" r="15" fill="#fff" stroke="#8a4f9e" stroke-width="2.5"/><path d="M89.2 240.79999999999998H124" stroke="#8a4f9e" stroke-width="2" stroke-dasharray="3 4"/><text x="136" y="246.8" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="500" fill="#14293a" text-anchor="start">My name is … and I am a student in your course on …</text><rect x="805.8" y="227.79999999999998" width="112.19999999999999" height="26" rx="13" fill="#8a4f9e"/><text x="861.9" y="245.5" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Who you are</text><circle class="w3d3d3-pu" cx="67.2" cy="313.6" r="21" fill="#b07d12" opacity=".16"/><circle cx="67.2" cy="313.6" r="15" fill="#fff" stroke="#b07d12" stroke-width="2.5"/><path d="M89.2 313.6H124" stroke="#b07d12" stroke-width="2" stroke-dasharray="3 4"/><text x="136" y="319.6" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="500" fill="#14293a" text-anchor="start">Thank you for recommending … I was interested in this reading because …</text><rect x="764.8" y="300.6" width="153.2" height="26" rx="13" fill="#b07d12"/><text x="841.4" y="318.3" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Thanks + context</text><circle class="w3d3d3-pu" cx="67.2" cy="392" r="21" fill="#c4562f" opacity=".16"/><circle cx="67.2" cy="392" r="15" fill="#fff" stroke="#c4562f" stroke-width="2.5"/><path d="M89.2 392H124" stroke="#c4562f" stroke-width="2" stroke-dasharray="3 4"/><text x="136" y="398" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="500" fill="#14293a" text-anchor="start">I’m emailing to ask if you could possibly recommend …</text><rect x="797.6" y="379" width="120.39999999999999" height="26" rx="13" fill="#c4562f"/><text x="857.8" y="396.7" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Your request</text><circle class="w3d3d3-pu" cx="67.2" cy="459.2" r="21" fill="#2d7a9a" opacity=".16"/><circle cx="67.2" cy="459.2" r="15" fill="#fff" stroke="#2d7a9a" stroke-width="2.5"/><path d="M89.2 459.2H124" stroke="#2d7a9a" stroke-width="2" stroke-dasharray="3 4"/><text x="136" y="465.2" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="500" fill="#14293a" text-anchor="start">Thank you very much.   Kind regards,</text><rect x="781.2" y="446.2" width="136.79999999999998" height="26" rx="13" fill="#2d7a9a"/><text x="849.6" y="463.9" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Polite closing</text><circle class="w3d3d3-pu" cx="67.2" cy="520.8000000000001" r="21" fill="#a3416a" opacity=".16"/><circle cx="67.2" cy="520.8000000000001" r="15" fill="#fff" stroke="#a3416a" stroke-width="2.5"/><path d="M89.2 520.8000000000001H124" stroke="#a3416a" stroke-width="2" stroke-dasharray="3 4"/><text x="136" y="526.8" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="start">Samuel Blank  #12345678</text><rect x="789.4" y="507.80000000000007" width="128.6" height="26" rx="13" fill="#a3416a"/><text x="853.7" y="525.5" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Name + number</text><path class="w3d3d3-tw " d="M40 32Q41.44 38.56 48 40Q41.44 41.44 40 48Q38.56 41.44 32 40Q38.56 38.56 40 32Z" fill="#f2c14e"/>
</svg>
