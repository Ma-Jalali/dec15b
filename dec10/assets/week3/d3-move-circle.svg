<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" fill="none" role="img" aria-label="Speed-dating circles seen from above: an inner circle faces an outer circle in pairs. After two minutes the outer circle moves one seat to the right and talks to a new partner.">
<title>Speed-dating circles seen from above: an inner circle faces an outer circle in pairs. After two minutes the outer circle moves one seat to the right and talks to a new partner.</title>
<style>
.w3d3ci-fl{animation:w3d3ci-fl 5s ease-in-out infinite;transform-box:fill-box}.w3d3ci-f2{animation-delay:-1.6s}.w3d3ci-f3{animation-delay:-3.2s}
.w3d3ci-bob{animation:w3d3ci-bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w3d3ci-b2{animation-delay:-.8s}.w3d3ci-b3{animation-delay:-1.6s}
.w3d3ci-dr{stroke-dasharray:7 9;animation:w3d3ci-dr 1.6s linear infinite}
.w3d3ci-pu{animation:w3d3ci-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3ci-p2{animation-delay:-1.4s}
.w3d3ci-tw{animation:w3d3ci-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3ci-t2{animation-delay:-1s}.w3d3ci-t3{animation-delay:-2s}
.w3d3ci-sp{animation:w3d3ci-sp 18s linear infinite;transform-box:view-box;transform-origin:480px 190px}
.w3d3ci-bl{animation:w3d3ci-bl 5s infinite;transform-box:fill-box;transform-origin:center}
.w3d3ci-arc{animation:w3d3ci-arc 3.2s ease-in-out infinite}
@keyframes w3d3ci-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3ci-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d3ci-dr{to{stroke-dashoffset:-32}}
@keyframes w3d3ci-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w3d3ci-tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3ci-sp{to{transform:rotate(360deg)}}
@keyframes w3d3ci-bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes w3d3ci-arc{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="w3d3ci-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#f1ece2"/></linearGradient>
<pattern id="w3d3ci-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.1" fill="#14293a" fill-opacity=".07"/></pattern>
<linearGradient id="w3d3ci-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d3ci-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e0cf"/><stop offset="1" stop-color="#ddd1bb"/></linearGradient>
<filter id="w3d3ci-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w3d3ci-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#14293a" flood-opacity=".18"/></filter>
</defs>
<rect x="4" y="4" width="952" height="332" rx="26" fill="url(#w3d3ci-bg)"/><rect x="4" y="4" width="952" height="332" rx="26" fill="url(#w3d3ci-dots)"/>
<rect x="4" y="4" width="952" height="332" rx="26" stroke="#14293a" stroke-opacity=".08" stroke-width="2"/>
<text x="40" y="44" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#14293a" text-anchor="start">Speed-dating circles</text>
<text x="40" y="68" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#4a5a68" text-anchor="start">2 minutes per partner.</text>
<text x="40" y="90" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#c4562f" text-anchor="start">Outer circle: move one seat →</text>
<circle cx="480" cy="190" r="140" fill="#fff" opacity=".5"/><circle cx="480" cy="190" r="58" fill="#eef3fb"/>
<circle cx="542.0" cy="190.0" r="15" fill="#3a58a0"/><circle cx="542.0" cy="190.0" r="9" fill="#f1c7a3"/>
