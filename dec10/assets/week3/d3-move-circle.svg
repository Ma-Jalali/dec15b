<circle cx="418.0" cy="190.0" r="15" fill="#3a58a0"/><circle cx="418.0" cy="190.0" r="9" fill="#f3d2b5"/>
<circle cx="436.2" cy="146.2" r="15" fill="#3a58a0"/><circle cx="436.2" cy="146.2" r="9" fill="#a8714f"/>
<circle cx="480.0" cy="128.0" r="15" fill="#3a58a0"/><circle cx="480.0" cy="128.0" r="9" fill="#f1c7a3"/>
<circle cx="523.8" cy="146.2" r="15" fill="#3a58a0"/><circle cx="523.8" cy="146.2" r="9" fill="#d9a27a"/>
<g class="w3d3ci-sp">
<circle cx="598.0" cy="190.0" r="15" fill="#c4562f"/><circle cx="598.0" cy="190.0" r="9" fill="#c68863"/>
<circle cx="563.4" cy="273.4" r="15" fill="#c4562f"/><circle cx="563.4" cy="273.4" r="9" fill="#f3d2b5"/>
<circle cx="480.0" cy="308.0" r="15" fill="#c4562f"/><circle cx="480.0" cy="308.0" r="9" fill="#a8714f"/>
<circle cx="396.6" cy="273.4" r="15" fill="#c4562f"/><circle cx="396.6" cy="273.4" r="9" fill="#f1c7a3"/>
<circle cx="362.0" cy="190.0" r="15" fill="#c4562f"/><circle cx="362.0" cy="190.0" r="9" fill="#d9a27a"/>
<circle cx="396.6" cy="106.6" r="15" fill="#c4562f"/><circle cx="396.6" cy="106.6" r="9" fill="#8d5a3b"/>
