<circle cx="563.4" cy="106.6" r="15" fill="#c4562f"/><circle cx="563.4" cy="106.6" r="9" fill="#f3d2b5"/>
</g>
<path d="M630 150 A 155 155 0 0 1 600 288" stroke="#c4562f" stroke-width="3" stroke-linecap="round" class="w3d3ci-dr"/><path d="M592 282 l14 12 4 -17z" fill="#c4562f"/>
<g transform="translate(800 190)"><g class="w3d3ci-pu"><circle r="56" fill="#fff" stroke="#14293a" stroke-width="3" filter="url(#w3d3ci-sh)"/><circle r="46" stroke="#e0a526" stroke-width="7" stroke-dasharray="210 300" transform="rotate(-90)"/><text x="0" y="8" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#14293a" text-anchor="middle">2:00</text></g></g>
<g transform="translate(150 190)"><rect x="-90" y="-50" width="180" height="100" rx="16" fill="#fff" filter="url(#w3d3ci-sh)"/><text x="0" y="-20" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#3a58a0" text-anchor="middle">Spin the topic</text><text x="0" y="4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#c4562f" text-anchor="middle">Spin the task</text><text x="0" y="30" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a5a68" text-anchor="middle">Talk · then move</text></g>
<circle cx="480" cy="190" r="4" fill="#14293a"/>
<text x="480" y="330" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a5a68" text-anchor="middle">Inner circle stays. Outer circle moves.</text>
</svg>
