<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" fill="none" role="img" aria-label="Three corners: the teacher names a topic, for example hedging. Walk to a corner: “I’m confident”, “Getting there” or “I need help”. Students in the confident corner help students in the help corner.">
<title>Three corners: the teacher names a topic, for example hedging. Walk to a corner: “I’m confident”, “Getting there” or “I need help”. Students in the confident corner help students in the help corner.</title>
<style>
.w3d3co-fl{animation:w3d3co-fl 5s ease-in-out infinite;transform-box:fill-box}.w3d3co-f2{animation-delay:-1.6s}.w3d3co-f3{animation-delay:-3.2s}
.w3d3co-bob{animation:w3d3co-bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w3d3co-b2{animation-delay:-.8s}.w3d3co-b3{animation-delay:-1.6s}
.w3d3co-dr{stroke-dasharray:7 9;animation:w3d3co-dr 1.6s linear infinite}
.w3d3co-pu{animation:w3d3co-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3co-p2{animation-delay:-1.4s}
.w3d3co-tw{animation:w3d3co-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3co-t2{animation-delay:-1s}.w3d3co-t3{animation-delay:-2s}
.w3d3co-sp{animation:w3d3co-sp 18s linear infinite;transform-box:view-box;transform-origin:480px 190px}
.w3d3co-bl{animation:w3d3co-bl 5s infinite;transform-box:fill-box;transform-origin:center}
.w3d3co-arc{animation:w3d3co-arc 3.2s ease-in-out infinite}
@keyframes w3d3co-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3co-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d3co-dr{to{stroke-dashoffset:-32}}
@keyframes w3d3co-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w3d3co-tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3co-sp{to{transform:rotate(360deg)}}
@keyframes w3d3co-bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes w3d3co-arc{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="w3d3co-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#f1ece2"/></linearGradient>
<pattern id="w3d3co-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.1" fill="#14293a" fill-opacity=".07"/></pattern>
<linearGradient id="w3d3co-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d3co-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e0cf"/><stop offset="1" stop-color="#ddd1bb"/></linearGradient>
<filter id="w3d3co-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#14293a" flood-opacity=".12"/></filter>
