<text x="40" y="68" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#4a5a68" text-anchor="start">Stick it up → walk and read → star your favourites</text>
<rect x="60" y="86" width="840" height="130" rx="12" fill="#efe6d4" stroke="#d9cbb0" stroke-width="2"/>
