<text x="690" y="156" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#14293a" text-anchor="middle">these experts …</text>
<polygon class="w3d3ga-tw w3d3ga-t2" points="732.0,105.0 734.9,112.0 742.5,112.6 736.7,117.5 738.5,124.9 732.0,121.0 725.5,124.9 727.3,117.5 721.5,112.6 729.1,112.0" fill="#e0a526"/>
