<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" fill="none" role="img" aria-label="Gallery walk: students stick their best sentence or phrase on the wall on a sticky note, walk along the wall, read the notes and add a star or a tick to their favourites.">
<title>Gallery walk: students stick their best sentence or phrase on the wall on a sticky note, walk along the wall, read the notes and add a star or a tick to their favourites.</title>
<style>
.w3d3ga-fl{animation:w3d3ga-fl 5s ease-in-out infinite;transform-box:fill-box}.w3d3ga-f2{animation-delay:-1.6s}.w3d3ga-f3{animation-delay:-3.2s}
.w3d3ga-bob{animation:w3d3ga-bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w3d3ga-b2{animation-delay:-.8s}.w3d3ga-b3{animation-delay:-1.6s}
.w3d3ga-dr{stroke-dasharray:7 9;animation:w3d3ga-dr 1.6s linear infinite}
.w3d3ga-pu{animation:w3d3ga-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3ga-p2{animation-delay:-1.4s}
.w3d3ga-tw{animation:w3d3ga-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3ga-t2{animation-delay:-1s}.w3d3ga-t3{animation-delay:-2s}
.w3d3ga-sp{animation:w3d3ga-sp 18s linear infinite;transform-box:view-box;transform-origin:480px 190px}
.w3d3ga-bl{animation:w3d3ga-bl 5s infinite;transform-box:fill-box;transform-origin:center}
.w3d3ga-arc{animation:w3d3ga-arc 3.2s ease-in-out infinite}
@keyframes w3d3ga-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3ga-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d3ga-dr{to{stroke-dashoffset:-32}}
@keyframes w3d3ga-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w3d3ga-tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3ga-sp{to{transform:rotate(360deg)}}
@keyframes w3d3ga-bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes w3d3ga-arc{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="w3d3ga-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#f1ece2"/></linearGradient>
<pattern id="w3d3ga-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.1" fill="#14293a" fill-opacity=".07"/></pattern>
<linearGradient id="w3d3ga-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d3ga-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e0cf"/><stop offset="1" stop-color="#ddd1bb"/></linearGradient>
<filter id="w3d3ga-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w3d3ga-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#14293a" flood-opacity=".18"/></filter>
</defs>
<rect x="4" y="4" width="952" height="332" rx="26" fill="url(#w3d3ga-bg)"/><rect x="4" y="4" width="952" height="332" rx="26" fill="url(#w3d3ga-dots)"/>
<rect x="4" y="4" width="952" height="332" rx="26" stroke="#14293a" stroke-opacity=".08" stroke-width="2"/>
