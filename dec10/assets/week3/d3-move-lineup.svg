<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" fill="none" role="img" aria-label="Opinion line-up: an arrow on the floor runs from “Not academic at all” to “Very academic”. Students stand on the line where they agree and explain to the person next to them, for example “It uses contractions, so it’s not academic.”">
