<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" fill="none" role="img" aria-label="Find your partner: half the class has an informal card, half has a formal card. Stand up, read your card aloud and find your partner, for example “cares about” and “values”, “will definitely” and “it is likely”, “there are more” and “the emergence of”. Stand together and read the academic sentence.">
<title>Find your partner: half the class has an informal card, half has a formal card. Stand up, read your card aloud and find your partner, for example “cares about” and “values”, “will definitely” and “it is likely”, “there are more” and “the emergence of”. Stand together and read the academic sentence.</title>
<style>
.w3d3mg-fl{animation:w3d3mg-fl 5s ease-in-out infinite;transform-box:fill-box}.w3d3mg-f2{animation-delay:-1.6s}.w3d3mg-f3{animation-delay:-3.2s}
.w3d3mg-bob{animation:w3d3mg-bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w3d3mg-b2{animation-delay:-.8s}.w3d3mg-b3{animation-delay:-1.6s}
.w3d3mg-dr{stroke-dasharray:7 9;animation:w3d3mg-dr 1.6s linear infinite}
.w3d3mg-pu{animation:w3d3mg-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3mg-p2{animation-delay:-1.4s}
.w3d3mg-tw{animation:w3d3mg-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3mg-t2{animation-delay:-1s}.w3d3mg-t3{animation-delay:-2s}
.w3d3mg-sp{animation:w3d3mg-sp 18s linear infinite;transform-box:view-box;transform-origin:480px 190px}
.w3d3mg-bl{animation:w3d3mg-bl 5s infinite;transform-box:fill-box;transform-origin:center}
.w3d3mg-arc{animation:w3d3mg-arc 3.2s ease-in-out infinite}
@keyframes w3d3mg-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3mg-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d3mg-dr{to{stroke-dashoffset:-32}}
@keyframes w3d3mg-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w3d3mg-tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3mg-sp{to{transform:rotate(360deg)}}
@keyframes w3d3mg-bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes w3d3mg-arc{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
