<g transform="translate(480 230) rotate(-3)" filter="url(#w3d3sb-sh)"><rect x="-150" y="-36" width="300" height="72" rx="6" fill="#fffdf6" stroke="#e0d6c2" stroke-width="2"/><text x="0" y="-8" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#14293a" text-anchor="middle">We would like to know more about</text><text x="0" y="16" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#14293a" text-anchor="middle">how workers could be retrained …</text></g>
