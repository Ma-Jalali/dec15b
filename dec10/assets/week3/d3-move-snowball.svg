<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" fill="none" role="img" aria-label="Question snowball: each student writes one question for Group 2 on paper, makes a paper ball and throws it gently into the middle. Everyone picks up one ball, opens it and reads the question aloud. The group chooses the best two questions to post.">
<title>Question snowball: each student writes one question for Group 2 on paper, makes a paper ball and throws it gently into the middle. Everyone picks up one ball, opens it and reads the question aloud. The group chooses the best two questions to post.</title>
<style>
.w3d3sb-fl{animation:w3d3sb-fl 5s ease-in-out infinite;transform-box:fill-box}.w3d3sb-f2{animation-delay:-1.6s}.w3d3sb-f3{animation-delay:-3.2s}
.w3d3sb-bob{animation:w3d3sb-bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w3d3sb-b2{animation-delay:-.8s}.w3d3sb-b3{animation-delay:-1.6s}
.w3d3sb-dr{stroke-dasharray:7 9;animation:w3d3sb-dr 1.6s linear infinite}
.w3d3sb-pu{animation:w3d3sb-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3sb-p2{animation-delay:-1.4s}
.w3d3sb-tw{animation:w3d3sb-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3sb-t2{animation-delay:-1s}.w3d3sb-t3{animation-delay:-2s}
.w3d3sb-sp{animation:w3d3sb-sp 18s linear infinite;transform-box:view-box;transform-origin:480px 190px}
.w3d3sb-bl{animation:w3d3sb-bl 5s infinite;transform-box:fill-box;transform-origin:center}
.w3d3sb-arc{animation:w3d3sb-arc 3.2s ease-in-out infinite}
@keyframes w3d3sb-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3sb-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d3sb-dr{to{stroke-dashoffset:-32}}
@keyframes w3d3sb-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w3d3sb-tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3sb-sp{to{transform:rotate(360deg)}}
@keyframes w3d3sb-bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes w3d3sb-arc{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="w3d3sb-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#f1ece2"/></linearGradient>
<pattern id="w3d3sb-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.1" fill="#14293a" fill-opacity=".07"/></pattern>
<linearGradient id="w3d3sb-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d3sb-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e0cf"/><stop offset="1" stop-color="#ddd1bb"/></linearGradient>
<filter id="w3d3sb-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w3d3sb-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#14293a" flood-opacity=".18"/></filter>
</defs>
<rect x="4" y="4" width="952" height="332" rx="26" fill="url(#w3d3sb-bg)"/><rect x="4" y="4" width="952" height="332" rx="26" fill="url(#w3d3sb-dots)"/>
<rect x="4" y="4" width="952" height="332" rx="26" stroke="#14293a" stroke-opacity=".08" stroke-width="2"/>
<text x="40" y="44" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#14293a" text-anchor="start">Question snowball</text>
<text x="40" y="68" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#4a5a68" text-anchor="start">Write → throw (gently!) → pick one up → read it aloud → choose the best two</text>
