<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" fill="none" role="img" aria-label="Stand up, sit down: your teacher reads a netiquette card. Good netiquette (Do)? Stand up. Bad netiquette (Don’t)? Sit down. Then one student says why.">
<title>Stand up, sit down: your teacher reads a netiquette card. Good netiquette (Do)? Stand up. Bad netiquette (Don’t)? Sit down. Then one student says why.</title>
<style>
