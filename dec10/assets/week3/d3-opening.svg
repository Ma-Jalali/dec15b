<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" fill="none" role="img" aria-label="Group 2’s Opening Remarks, 5–7 minutes, in three parts: 1 a brief introduction to the country they selected and why they chose it, 2 causes and/or effects of the sustainability issue or problem, 3 possible strategies or solutions. The audience writes down what they would like to know more about, then posts one group post to the Discussion Board.">
<title>Group 2’s Opening Remarks, 5–7 minutes, in three parts: 1 a brief introduction to the country they selected and why they chose it, 2 causes and/or effects of the sustainability issue or problem, 3 possible strategies or solutions. The audience writes down what they would like to know more about, then posts one group post to the Discussion Board.</title>
<style>
