<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" fill="none" role="img" aria-label="Who submits what after today. Seminar Group 1: Portfolio Submission 3, a written summary of and reflection on teacher and peer feedback, and Portfolio Submission 4, the assessed video response. The rest of the class: Peer Feedback 1, uploaded to Group 1’s portfolio by the end of today by one member per group. Seminar Group 2: Portfolio Submission 1, a reflection on the teacher’s feedback on their Opening Remarks, before their Seminar in Week 4.">
