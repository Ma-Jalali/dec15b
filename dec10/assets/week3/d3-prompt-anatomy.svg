<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" fill="none" role="img" aria-label="A good prompt in four parts. Role: Act as an environmental scientist with expertise in ecology and wildlife conservation. Task: Write an environmental assessment report for a company evaluating the potential impact of their new development project on the endangered Blue-Striped Skink. Requirements: The report should include an introduction, methodology, findings, discussion, recommendations, and conclusion. It must be no longer than two pages and use only academic sources. Instructions: Provide an overview of the Blue-Striped Skink, including its habitat, diet, and conservation status. Describe the survey techniques used to assess the skink population and habitat. Present data on population estimates, habitat quality, and threats. Analyze the potential impact of the development project. Offer strategies to mitigate negative impacts, such as habitat preservation and monitoring plans. Use clear language and provide scientific references.">
<title>A good prompt in four parts. Role: Act as an environmental scientist with expertise in ecology and wildlife conservation. Task: Write an environmental assessment report for a company evaluating the potential impact of their new development project on the endangered Blue-Striped Skink. Requirements: The report should include an introduction, methodology, findings, discussion, recommendations, and conclusion. It must be no longer than two pages and use only academic sources. Instructions: Provide an overview of the Blue-Striped Skink, including its habitat, diet, and conservation status. Describe the survey techniques used to assess the skink population and habitat. Present data on population estimates, habitat quality, and threats. Analyze the potential impact of the development project. Offer strategies to mitigate negative impacts, such as habitat preservation and monitoring plans. Use clear language and provide scientific references.</title>
<style>
.w3d3d16-fl{animation:w3d3d16-fl 6s ease-in-out infinite}.w3d3d16-f2{animation:w3d3d16-fl 7s ease-in-out -2.5s infinite}.w3d3d16-f3{animation:w3d3d16-fl 5.5s ease-in-out -4s infinite}
