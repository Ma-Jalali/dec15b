resent data on population estimates, habitat quality, and threats. Analyze the potential</text><text x="254" y="414.1" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="500" fill="#14293a" text-anchor="start">impact … Offer strategies to mitigate negative impacts … Use clear language and provide</text><text x="254" y="433.1" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="500" fill="#14293a" text-anchor="start">scientific references.</text>
