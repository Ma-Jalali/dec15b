.w3d3d16-pu{animation:w3d3d16-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3d16-p2{animation-delay:-1.6s}
.w3d3d16-dr{stroke-dasharray:6 8;animation:w3d3d16-dr 1.8s linear infinite}
.w3d3d16-sp{animation:w3d3d16-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3d16-ca{animation:w3d3d16-ca 1.1s steps(1) infinite}
.w3d3d16-sw{animation:w3d3d16-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3d16-wv{animation:w3d3d16-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3d16-w2{animation-delay:.85s}.w3d3d16-w3{animation-delay:1.7s}
.w3d3d16-rv{animation:w3d3d16-rv 5s ease-in-out infinite}
.w3d3d16-gl{animation:w3d3d16-gl 5s ease-in-out infinite}
@keyframes w3d3d16-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3d16-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3d16-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d3d16-pu{0%,100%{transform:scale(1)}20%{transform:scale(1.08)}40%{transform:scale(1)}}
@keyframes w3d3d16-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3d16-sp{to{transform:rotate(360deg)}}
@keyframes w3d3d16-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3d16-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3d16-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3d16-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3d16-gl{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d3d16-wv{opacity:.8}.w3d3d16-rv{opacity:1}}
</style>
