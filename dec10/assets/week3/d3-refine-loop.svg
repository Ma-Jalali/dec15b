<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none" role="img" aria-label="Try and refine, a cycle of four steps: 1 formulate a relevant prompt; 2 consider when the output does not meet expectations; 3 enhance the clarity of the prompt; 4 repeat the process to improve the prompt.">
<title>Try and refine, a cycle of four steps: 1 formulate a relevant prompt; 2 consider when the output does not meet expectations; 3 enhance the clarity of the prompt; 4 repeat the process to improve the prompt.</title>
<style>
.w3d3d15-fl{animation:w3d3d15-fl 6s ease-in-out infinite}.w3d3d15-f2{animation:w3d3d15-fl 7s ease-in-out -2.5s infinite}.w3d3d15-f3{animation:w3d3d15-fl 5.5s ease-in-out -4s infinite}
.w3d3d15-tw{animation:w3d3d15-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3d15-t2{animation-delay:-1.1s}.w3d3d15-t3{animation-delay:-2.2s}
.w3d3d15-bl{animation:w3d3d15-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3d15-b2{animation-delay:-1.7s}.w3d3d15-b3{animation-delay:-3.1s}
.w3d3d15-pu{animation:w3d3d15-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3d15-p2{animation-delay:-1.6s}
.w3d3d15-dr{stroke-dasharray:6 8;animation:w3d3d15-dr 1.8s linear infinite}
.w3d3d15-sp{animation:w3d3d15-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3d15-ca{animation:w3d3d15-ca 1.1s steps(1) infinite}
.w3d3d15-sw{animation:w3d3d15-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3d15-wv{animation:w3d3d15-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3d15-w2{animation-delay:.85s}.w3d3d15-w3{animation-delay:1.7s}
.w3d3d15-rv{animation:w3d3d15-rv 5s ease-in-out infinite}
.w3d3d15-gl{animation:w3d3d15-gl 5s ease-in-out infinite}
@keyframes w3d3d15-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3d15-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3d15-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d3d15-pu{0%,100%{transform:scale(1)}20%{transform:scale(1.08)}40%{transform:scale(1)}}
@keyframes w3d3d15-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3d15-sp{to{transform:rotate(360deg)}}
@keyframes w3d3d15-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3d15-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3d15-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3d15-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3d15-gl{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d3d15-wv{opacity:.8}.w3d3d15-rv{opacity:1}}
</style>
<defs>
<linearGradient id="w3d3d15-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f2fa"/><stop offset="1" stop-color="#ece2f3"/></linearGradient>
<pattern id="w3d3d15-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#7a4a8c" fill-opacity=".11"/></pattern>
<radialGradient id="w3d3d15-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w3d3d15-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d3d15-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a8c"/><stop offset="1" stop-color="#5c3569"/></linearGradient>
<linearGradient id="w3d3d15-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient>
<linearGradient id="w3d3d15-scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22384d"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d3d15-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#e0a526"/></linearGradient>
<filter id="w3d3d15-sh" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#14293a" flood-opacity=".13"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w3d3d15-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/></filter>
<filter id="w3d3d15-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>

</defs>
<rect width="960" height="440" rx="28" fill="url(#w3d3d15-bg)"/><rect width="960" height="440" rx="28" fill="url(#w3d3d15-dots)"/>
<ellipse cx="787.1999999999999" cy="79.2" rx="211.2" ry="114.4" fill="#ebdff1" opacity=".7" filter="url(#w3d3d15-blur)"/>
<ellipse cx="134.4" cy="378.4" rx="192" ry="88" fill="#fff" opacity=".65" filter="url(#w3d3d15-blur)"/>
