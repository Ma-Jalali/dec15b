eight="800" fill="#c4562f" text-anchor="start">Consider</text><text x="632" y="229" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="start">when the output doesn’t</text><text x="632" y="249" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="start">meet expectations</text><circle cx="480" cy="330" r="22" fill="#2f7d6b"/><circle cx="480" cy="330" r="22" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><text x="480" y="337.9" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="480" y="388" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#2f7d6b" text-anchor="middle">Enhance</text><text x="480" y="410" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="middle">the clarity of the prompt</text><circle cx="372" cy="222" r="22" fill="#8a4f9e"/><circle cx="372" cy="222" r="22" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><text x="372" y="229.9" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="328" y="217.5" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#8a4f9e" text-anchor="end">Repeat</text><text x="328" y="239.5" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="end">to improve the prompt</text>
</svg>
