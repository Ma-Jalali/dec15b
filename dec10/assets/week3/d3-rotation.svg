<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" fill="none" role="img" aria-label="The Seminar relay. Week 2: Group 1 gave its Opening Remarks. Week 3, today: Group 1 Seminar Presentation and Group 2 Opening Remarks. Week 4: Group 2 Seminar Presentation and Group 3 Opening Remarks. Each group opens one week and leads the Seminar the next week.">
<title>The Seminar relay. Week 2: Group 1 gave its Opening Remarks. Week 3, today: Group 1 Seminar Presentation and Group 2 Opening Remarks. Week 4: Group 2 Seminar Presentation and Group 3 Opening Remarks. Each group opens one week and leads the Seminar the next week.</title>
<style>
