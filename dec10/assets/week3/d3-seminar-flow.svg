.w3d3d8-ca{animation:w3d3d8-ca 1.1s steps(1) infinite}
.w3d3d8-sw{animation:w3d3d8-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3d8-wv{animation:w3d3d8-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3d8-w2{animation-delay:.85s}.w3d3d8-w3{animation-delay:1.7s}
.w3d3d8-rv{animation:w3d3d8-rv 5s ease-in-out infinite}
.w3d3d8-gl{animation:w3d3d8-gl 5s ease-in-out infinite}
@keyframes w3d3d8-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
