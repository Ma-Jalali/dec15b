<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" fill="none" role="img" aria-label="The Seminar in four parts. Part 1, 10–12 minutes: Group 1 presents (class reactions and focus, research summary, two questions); the class listens with the feedback tool. Part 2, 10 minutes: the class discusses the two questions; one Group 1 presenter sits with each group and only takes notes. Part 3, 1–2 minutes: Group 1 summarises each discussion; the class listens. Part 4: Group 1 gets teacher feedback; the class prepares and uploads peer feedback.">
<title>The Seminar in four parts. Part 1, 10–12 minutes: Group 1 presents (class reactions and focus, research summary, two questions); the class listens with the feedback tool. Part 2, 10 minutes: the class discusses the two questions; one Group 1 presenter sits with each group and only takes notes. Part 3, 1–2 minutes: Group 1 summarises each discussion; the class listens. Part 4: Group 1 gets teacher feedback; the class prepares and uploads peer feedback.</title>
<style>
