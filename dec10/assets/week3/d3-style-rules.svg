.w3d3d5-ca{animation:w3d3d5-ca 1.1s steps(1) infinite}
.w3d3d5-sw{animation:w3d3d5-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3d5-wv{animation:w3d3d5-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3d5-w2{animation-delay:.85s}.w3d3d5-w3{animation-delay:1.7s}
.w3d3d5-rv{animation:w3d3d5-rv 5s ease-in-out infinite}
