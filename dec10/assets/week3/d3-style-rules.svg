<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" role="img" aria-label="Twelve features of academic style. Grammar and structure: use nominalisations; reference ideas from sources; no ‘and’, ‘but’, ‘so’ at the start of a sentence; no contractions; no direct questions; avoid repetition with summary nouns; hedge; keep it impersonal. Vocabulary: no idioms; use specialised words; be precise; no phrasal verbs or chatty words.">
<title>Twelve features of academic style. Grammar and structure: use nominalisations; reference ideas from sources; no ‘and’, ‘but’, ‘so’ at the start of a sentence; no contractions; no direct questions; avoid repetition with summary nouns; hedge; keep it impersonal. Vocabulary: no idioms; use specialised words; be precise; no phrasal verbs or chatty words.</title>
<style>
