<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-label="Four audience jobs: question master, evidence detective, cause and effect tracker, language spotter. Jobs rotate after every presentation.">
<title>Four audience jobs: question master, evidence detective, cause and effect tracker, language spotter. Jobs rotate after every presentation.</title>
<style>.w3d4aj-fl{animation:w3d4aj-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4aj-fl2{animation:w3d4aj-fl 6.5s ease-in-out -2.5s infinite;transform-box:fill-box;transform-origin:center}
.w3d4aj-tw{animation:w3d4aj-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4aj-bl{animation:w3d4aj-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4aj-pu{animation:w3d4aj-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4aj-dr{stroke-dasharray:7 8;animation:w3d4aj-dr 1.4s linear infinite}
.w3d4aj-sp{animation:w3d4aj-sp 12s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d4aj-wk{animation:w3d4aj-wk 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w3d4aj-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes w3d4aj-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d4aj-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d4aj-pu{0%,100%{transform:scale(1)}15%{transform:scale(1.07)}30%{transform:scale(1)}}
@keyframes w3d4aj-dr{to{stroke-dashoffset:-30}}
@keyframes w3d4aj-sp{to{transform:rotate(360deg)}}
@keyframes w3d4aj-wk{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
