<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-label="Five stepping stones to your own position: focus, question, analyse, evaluate, reach your own position">
<title>Five stepping stones to your own position: focus, question, analyse, evaluate, reach your own position</title>
<style>.w3d4d4ctsteps-fl{animation:w3d4d4ctsteps-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4ctsteps-fl2{animation:w3d4d4ctsteps-fl 6.5s ease-in-out -2.5s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4ctsteps-tw{animation:w3d4d4ctsteps-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d4ctsteps-tw2{animation-delay:-1.5s}
.w3d4d4ctsteps-bl{animation:w3d4d4ctsteps-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4ctsteps-pu{animation:w3d4d4ctsteps-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d4ctsteps-pu2{animation-delay:-1.3s}
.w3d4d4ctsteps-dr{stroke-dasharray:6 7;animation:w3d4d4ctsteps-dr 1.5s linear infinite}
.w3d4d4ctsteps-sw{animation:w3d4d4ctsteps-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d4d4ctsteps-sp{animation:w3d4d4ctsteps-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4ctsteps-wv{animation:w3d4d4ctsteps-wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.w3d4d4ctsteps-wv2{animation-delay:1.4s}
.w3d4d4ctsteps-rv{animation:w3d4d4ctsteps-rv .9s ease-out both}.w3d4d4ctsteps-d1{animation-delay:.15s}.w3d4d4ctsteps-d2{animation-delay:.3s}.w3d4d4ctsteps-d3{animation-delay:.45s}.w3d4d4ctsteps-d4{animation-delay:.6s}
@keyframes w3d4d4ctsteps-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d4d4ctsteps-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d4d4ctsteps-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d4d4ctsteps-pu{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}}
@keyframes w3d4d4ctsteps-dr{to{stroke-dashoffset:-26}}
@keyframes w3d4d4ctsteps-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d4d4ctsteps-sp{to{transform:rotate(360deg)}}
@keyframes w3d4d4ctsteps-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4d4ctsteps-rv{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w3d4d4ctsteps-rv{opacity:1!important}.w3d4d4ctsteps-wv{opacity:.5!important}}</style>
