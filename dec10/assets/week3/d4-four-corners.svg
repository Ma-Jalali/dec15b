@keyframes w3d4fc-dr{to{stroke-dashoffset:-30}}
@keyframes w3d4fc-sp{to{transform:rotate(360deg)}}
@keyframes w3d4fc-wk{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
