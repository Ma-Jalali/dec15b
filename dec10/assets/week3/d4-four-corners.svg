<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-label="Four corners: each corner of the room is one laptop. Students walk to the laptop they would buy now; one student moves to a new corner because her position changed.">
<title>Four corners: each corner of the room is one laptop. Students walk to the laptop they would buy now; one student moves to a new corner because her position changed.</title>
<style>.w3d4fc-fl{animation:w3d4fc-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
