@keyframes w3d4fc-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes w3d4fc-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
