<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-label="The road from Week 1 to Week 7; you are here at Week 3; the Interactive Presentation is on Thursday and Friday of Week 7">
<title>The road from Week 1 to Week 7; you are here at Week 3; the Interactive Presentation is on Thursday and Friday of Week 7</title>
<style>.w3d4d4iproad-fl{animation:w3d4d4iproad-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4iproad-fl2{animation:w3d4d4iproad-fl 6.5s ease-in-out -2.5s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4iproad-tw{animation:w3d4d4iproad-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d4iproad-tw2{animation-delay:-1.5s}
.w3d4d4iproad-bl{animation:w3d4d4iproad-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4iproad-pu{animation:w3d4d4iproad-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d4iproad-pu2{animation-delay:-1.3s}
.w3d4d4iproad-dr{stroke-dasharray:6 7;animation:w3d4d4iproad-dr 1.5s linear infinite}
.w3d4d4iproad-sw{animation:w3d4d4iproad-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d4d4iproad-sp{animation:w3d4d4iproad-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4iproad-wv{animation:w3d4d4iproad-wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.w3d4d4iproad-wv2{animation-delay:1.4s}
.w3d4d4iproad-rv{animation:w3d4d4iproad-rv .9s ease-out both}.w3d4d4iproad-d1{animation-delay:.15s}.w3d4d4iproad-d2{animation-delay:.3s}.w3d4d4iproad-d3{animation-delay:.45s}.w3d4d4iproad-d4{animation-delay:.6s}
@keyframes w3d4d4iproad-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d4d4iproad-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d4d4iproad-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d4d4iproad-pu{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}}
@keyframes w3d4d4iproad-dr{to{stroke-dashoffset:-26}}
@keyframes w3d4d4iproad-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d4d4iproad-sp{to{transform:rotate(360deg)}}
@keyframes w3d4d4iproad-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4d4iproad-rv{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w3d4d4iproad-rv{opacity:1!important}.w3d4d4iproad-wv{opacity:.5!important}}</style>
