<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="The scenario: your laptop broke; you need one for university. Key features: long battery life, lightweight, security; other features will be taken into consideration">
<title>The scenario: your laptop broke; you need one for university. Key features: long battery life, lightweight, security; other features will be taken into consideration</title>
<style>.w3d4d4laptopneeds-fl{animation:w3d4d4laptopneeds-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4laptopneeds-fl2{animation:w3d4d4laptopneeds-fl 6.5s ease-in-out -2.5s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4laptopneeds-tw{animation:w3d4d4laptopneeds-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d4laptopneeds-tw2{animation-delay:-1.5s}
.w3d4d4laptopneeds-bl{animation:w3d4d4laptopneeds-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4laptopneeds-pu{animation:w3d4d4laptopneeds-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d4laptopneeds-pu2{animation-delay:-1.3s}
.w3d4d4laptopneeds-dr{stroke-dasharray:6 7;animation:w3d4d4laptopneeds-dr 1.5s linear infinite}
.w3d4d4laptopneeds-sw{animation:w3d4d4laptopneeds-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d4d4laptopneeds-sp{animation:w3d4d4laptopneeds-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4laptopneeds-wv{animation:w3d4d4laptopneeds-wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.w3d4d4laptopneeds-wv2{animation-delay:1.4s}
.w3d4d4laptopneeds-rv{animation:w3d4d4laptopneeds-rv .9s ease-out both}.w3d4d4laptopneeds-d1{animation-delay:.15s}.w3d4d4laptopneeds-d2{animation-delay:.3s}.w3d4d4laptopneeds-d3{animation-delay:.45s}.w3d4d4laptopneeds-d4{animation-delay:.6s}
@keyframes w3d4d4laptopneeds-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d4d4laptopneeds-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d4d4laptopneeds-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d4d4laptopneeds-pu{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}}
@keyframes w3d4d4laptopneeds-dr{to{stroke-dashoffset:-26}}
@keyframes w3d4d4laptopneeds-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d4d4laptopneeds-sp{to{transform:rotate(360deg)}}
@keyframes w3d4d4laptopneeds-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4d4laptopneeds-rv{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w3d4d4laptopneeds-rv{opacity:1!important}.w3d4d4laptopneeds-wv{opacity:.5!important}}</style>
<defs>
<filter id="w3d4d4laptopneeds-sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w3d4d4laptopneeds-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="w3d4d4laptopneeds-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<linearGradient id="w3d4d4laptopneeds-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f1fb"/><stop offset=".6" stop-color="#fbfaf7"/><stop offset="1" stop-color="#c3d7f0" stop-opacity=".7"/></linearGradient>
<linearGradient id="w3d4d4laptopneeds-ta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8fd0"/><stop offset="1" stop-color="#2f6db5"/></linearGradient>
<linearGradient id="w3d4d4laptopneeds-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c66a"/><stop offset="1" stop-color="#d1922a"/></linearGradient>
<linearGradient id="w3d4d4laptopneeds-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d4d4laptopneeds-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f4f1ea"/></linearGradient>
<radialGradient id="w3d4d4laptopneeds-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect x="6" y="6" width="988" height="448" rx="30" fill="url(#w3d4d4laptopneeds-bg)"/><rect x="6" y="6" width="988" height="448" rx="30" fill="url(#w3d4d4laptopneeds-dots)"/><g transform="rotate(-8 170 240)"><g transform="translate(170 290) scale(2.6)"><rect x="-40" y="-52" width="80" height="50" rx="5" fill="#cfd6dd" filter="url(#w3d4d4laptopneeds-sh2)"/><rect x="-36" y="-48" width="72" height="42" rx="3" fill="#33424f"/><path d="M-30 -44l20 18-8 6 22 16" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M-50 -2h100l-6 8h-88z" fill="#b9c3cc"/><rect x="-10" y="-2" width="20" height="3" rx="1.5" fill="#97a3ad"/></g></g><text x="170" y="360" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#b0512a" text-anchor="middle">Your laptop broke!</text><text x="170" y="392" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">Same brand for 10 years …</text><text x="170" y="414" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">friends say there are better options.</text><g class="w3d4d4laptopneeds-rv w3d4d4laptopneeds-d1"><rect x="295" y="70" width="180" height="270" rx="18" fill="#fff" filter="url(#w3d4d4laptopneeds-sh)"/><rect x="330" y="110" width="90" height="48" rx="10" fill="none" stroke="#2f7d4f" stroke-width="6"/><rect x="422" y="124" width="10" height="20" rx="3" fill="#2f7d4f"/><rect class="w3d4d4laptopneeds-pu" x="338" y="118" width="74" height="32" rx="5" fill="#2f7d4f"/><text x="385" y="230" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#2f7d4f" text-anchor="middle">Long battery life</text><text x="385" y="262" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14293a" text-anchor="middle">Not all lecture rooms have</text><text x="385" y="283" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14293a" text-anchor="middle">power points to charge.</text></g><g class="w3d4d4laptopneeds-rv w3d4d4laptopneeds-d2"><rect x="495" y="70" width="180" height="270" rx="18" fill="#fff" filter="url(#w3d4d4laptopneeds-sh)"/><g class="w3d4d4laptopneeds-fl"><path d="M540 170c20-40 60-56 80-60-6 22-30 64-76 70z" fill="#13887a"/><path d="M534 180l64-58" stroke="#fff" stroke-width="2.5"/></g><text x="585" y="230" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#13887a" text-anchor="middle">Lightweight</text><text x="585" y="262" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14293a" text-anchor="middle">You carry it from class</text><text x="585" y="283" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14293a" text-anchor="middle">to class.</text></g><g class="w3d4d4laptopneeds-rv w3d4d4laptopneeds-d3"><rect x="695" y="70" width="180" height="270" rx="18" fill="#fff" filter="url(#w3d4d4laptopneeds-sh)"/><rect x="746" y="128" width="68" height="52" rx="10" fill="#b07d12"/><path d="M760 128v-14a20 20 0 0 1 40 0v14" stroke="#b07d12" stroke-width="8"/><circle cx="780" cy="152" r="7" fill="#14293a"/><text x="785" y="230" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#b07d12" text-anchor="middle">Security</text><text x="785" y="262" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14293a" text-anchor="middle">You also use it for</text><text x="785" y="283" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#14293a" text-anchor="middle">personal use.</text></g><rect x="330" y="370" width="560" height="50" rx="25" fill="url(#w3d4d4laptopneeds-navy)"/><text x="610" y="402" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">+ Other features will be taken into consideration</text><path class="w3d4d4laptopneeds-tw" d="M950 40C951.8 48.2 951.8 48.2 960 50C951.8 51.8 951.8 51.8 950 60C948.2 51.8 948.2 51.8 940 50C948.2 48.2 948.2 48.2 950 40Z" fill="#e3a843"/>
</svg>
