"/></g><path d="M-6 -128 q6 5 12 0" stroke="#14293a" stroke-width="2" stroke-linecap="round"/></g><g transform="translate(720 384) scale(0.92)"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#14293a" fill-opacity=".12"/><path d="M-9 -60 L-11 -2 M9 -60 L11 -2" stroke="#2c4c68" stroke-width="11" stroke-linecap="round"/><path d="M-26 -60 q0 -52 26 -54 q26 2 26 54 z" fill="#2f7d6b" filter="url(#w3d4ol-sh2)"/><rect x="-6" y="-124" width="12" height="12" rx="4" fill="#b97a56"/><circle cx="0" cy="-140" r="22" fill="#b97a56"/><path d="M-23 -142 q2 -26 24 -24 q22 0 22 24 q-10 -12 -24 -10 q-12 2 -22 10z" fill="#2a1d16"/><g class="w3d4ol-bl"><circle cx="-8" cy="-138" r="2.6" fill="#14293a"/><circle cx="8" cy="-138" r="2.6" fill="#14293a"/></g><path d="M-6 -128 q6 5 12 0" stroke="#14293a" stroke-width="2" stroke-linecap="round"/></g><g transform="translate(800 384) scale(0.92)"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#14293a" fill-opacity=".12"/><path d="M-9 -60 L-11 -2 M9 -60 L11 -2" stroke="#2c4c68" stroke-width="11" stroke-linecap="round"/><path d="M-26 -60 q0 -52 26 -54 q26 2 26 54 z" fill="#3a58a0" filter="url(#w3d4ol-sh2)"/><rect x="-6" y="-124" width="12" height="12" rx="4" fill="#e9b98f"/><circle cx="0" cy="-140" r="22" fill="#e9b98f"/><path d="M-23 -142 q2 -26 24 -24 q22 0 22 24 q-10 -12 -24 -10 q-12 2 -22 10z" fill="#5a3a22"/><g class="w3d4ol-bl"><circle cx="-8" cy="-138" r="2.6" fill="#14293a"/><circle cx="8" cy="-138" r="2.6" fill="#14293a"/></g><path d="M-6 -128 q6 5 12 0" stroke="#14293a" stroke-width="2" stroke-linecap="round"/></g><g transform="translate(880 384) scale(0.92)"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#14293a" fill-opacity=".12"/><path d="M-9 -60 L-11 -2 M9 -60 L11 -2" stroke="#2c4c68" stroke-width="11" stroke-linecap="round"/><path d="M-26 -60 q0 -52 26 -54 q26 2 26 54 z" fill="#2f7d6b" filter="url(#w3d4ol-sh2)"/><rect x="-6" y="-124" width="12" height="12" rx="4" fill="#c98d63"/><circle cx="0" cy="-140" r="22" fill="#c98d63"/><path d="M-23 -142 q2 -26 24 -24 q22 0 22 24 q-10 -12 -24 -10 q-12 2 -22 10z" fill="#1f1a17"/><g class="w3d4ol-bl"><circle cx="-8" cy="-138" r="2.6" fill="#14293a"/><circle cx="8" cy="-138" r="2.6" fill="#14293a"/></g><path d="M-6 -128 q6 5 12 0" stroke="#14293a" stroke-width="2" stroke-linecap="round"/></g><path class="w3d4ol-dr" d="M260 360 C320 330 360 330 410 352" stroke="#7a4a8c" stroke-width="3.5" stroke-linecap="round"/><path d="M404 340 l12 12 l-16 6" stroke="#7a4a8c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="282" cy="372" rx="6" ry="3.4" fill="#7a4a8c" fill-opacity="0.25"/><ellipse cx="304" cy="378" rx="6" ry="3.4" fill="#7a4a8c" fill-opacity="0.37"/><ellipse cx="330" cy="370" rx="6" ry="3.4" fill="#7a4a8c" fill-opacity="0.49"/><ellipse cx="354" cy="376" rx="6" ry="3.4" fill="#7a4a8c" fill-opacity="0.61"/><g class="w3d4ol-wk"><g transform="translate(440 384) scale(0.92)"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#14293a" fill-opacity=".12"/><path d="M-9 -60 L-11 -2 M9 -60 L11 -2" stroke="#2c4c68" stroke-width="11" stroke-linecap="round"/><path d="M-26 -60 q0 -52 26 -54 q26 2 26 54 z" fill="#7a4a8c" filter="url(#w3d4ol-sh2)"/><rect x="-6" y="-124" width="12" height="12" rx="4" fill="#d8a47f"/><circle cx="0" cy="-140" r="22" fill="#d8a47f"/><path d="M-23 -142 q2 -26 24 -24 q22 0 22 24 q-10 -12 -24 -10 q-12 2 -22 10z" fill="#3a2a20"/><g class="w3d4ol-bl"><circle cx="-8" cy="-138" r="2.6" fill="#14293a"/><circle cx="8" cy="-138" r="2.6" fill="#14293a"/></g><path d="M-6 -128 q6 5 12 0" stroke="#14293a" stroke-width="2" stroke-linecap="round"/></g></g><g class="w3d4ol-fl"><rect x="392" y="150" width="230" height="44" rx="22" fill="url(#w3d4ol-paper)" stroke="#7a4a8c" stroke-opacity=".35" stroke-width="2" filter="url(#w3d4ol-sh2)"/><path d="M422 193 l8 16 l10 -16z" fill="#fff"/><text x="507.0" y="178" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#7a4a8c" text-anchor="middle">That’s a fair point!</text></g><g class="w3d4ol-fl2"><rect x="90" y="160" width="190" height="44" rx="22" fill="url(#w3d4ol-paper)" stroke="#c4562f" stroke-opacity=".35" stroke-width="2" filter="url(#w3d4ol-sh2)"/><path d="M120 203 l8 16 l10 -16z" fill="#fff"/><text x="185.0" y="188" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#c4562f" text-anchor="middle">I disagree, because…</text></g><g class="w3d4ol-fl2"><rect x="700" y="160" width="220" height="44" rx="22" fill="url(#w3d4ol-paper)" stroke="#2f7d6b" stroke-opacity=".35" stroke-width="2" filter="url(#w3d4ol-sh2)"/><path d="M730 203 l8 16 l10 -16z" fill="#fff"/><text x="810.0" y="188" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#2f7d6b" text-anchor="middle">I agree — new evidence…</text></g></svg>
