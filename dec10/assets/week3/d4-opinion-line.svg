<g class="w3d4ol-fl2"><rect x="150" y="34" width="700" height="66" rx="33" fill="url(#w3d4ol-navy)" filter="url(#w3d4ol-sh)"/><text x="500" y="76" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">“It is OK to change your mind after making a decision.”</text></g><rect x="60" y="392" width="880" height="16" rx="8" fill="url(#w3d4ol-line)" filter="url(#w3d4ol-sh2)"/><rect x="100" y="388" width="4" height="24" rx="2" fill="#fff" fill-opacity=".8"/><rect x="182" y="388" width="4" height="24" rx="2" fill="#fff" fill-opacity=".8"/><rect x="264" y="388" width="4" height="24" rx="2" fill="#fff" fill-opacity=".8"/><rect x="346" y="388" width="4" height="24" rx="2" fill="#fff" fill-opacity=".8"/><rect x="428" y="388" width="4" height="24" rx="2" fill="#fff" fill-opacity=".8"/><rect x="510" y="388" width="4" height="24" rx="2" fill="#fff" fill-opacity=".8"/><rect x="592" y="388" width="4" height="24" rx="2" fill="#fff" fill-opacity=".8"/><rect x="674" y="388" width="4" height="24" rx="2" fill="#fff" fill-opacity=".8"/><rect x="756" y="388" width="4" height="24" rx="2" fill="#fff" fill-opacity=".8"/><rect x="838" y="388" width="4" height="24" rx="2" fill="#fff" fill-opacity=".8"/><text x="70" y="444" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#c4562f">Strongly disagree</text><text x="500" y="444" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#985c0e" text-anchor="middle">Not sure</text><text x="930" y="444" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#2f7d6b" text-anchor="end">Strongly agree</text><text x="500" y="474" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" fill-opacity=".75" text-anchor="middle">Stand where you stand. Talk. Move if you are persuaded — and say why.</text><g transform="translate(120 384) scale(0.92)"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#14293a"