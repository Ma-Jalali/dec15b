<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-label="Opinion line-up: students stand on a line from strongly disagree to strongly agree, and move when they are persuaded.">
<title>Opinion line-up: students stand on a line from strongly disagree to strongly agree, and move when they are persuaded.</title>
<style>.w3d4ol-fl{animation:w3d4ol-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4ol-fl2{animation:w3d4ol-fl 6.5s ease-in-out -2.5s infinite;transform-box:fill-box;transform-origin:center}
.w3d4ol-tw{animation:w3d4ol-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4ol-bl{animation:w3d4ol-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4ol-pu{animation:w3d4ol-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4ol-dr{stroke-dasharray:7 8;animation:w3d4ol-dr 1.4s linear infinite}
.w3d4ol-sp{animation:w3d4ol-sp 12s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d4ol-wk{animation:w3d4ol-wk 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w3d4ol-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes w3d4ol-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d4ol-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d4ol-pu{0%,100%{transform:scale(1)}15%{transform:scale(1.07)}30%{transform:scale(1)}}
@keyframes w3d4ol-dr{to{stroke-dashoffset:-30}}
@keyframes w3d4ol-sp{to{transform:rotate(360deg)}}
@keyframes w3d4ol-wk{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<filter id="w3d4ol-sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w3d4ol-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="w3d4ol-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<linearGradient id="w3d4ol-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3ebf7"/><stop offset=".6" stop-color="#fbfaf7"/><stop offset="1" stop-color="#c7d6ee" stop-opacity=".7"/></linearGradient>
<linearGradient id="w3d4ol-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c66a"/><stop offset="1" stop-color="#d1922a"/></linearGradient>
<linearGradient id="w3d4ol-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d4ol-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f4f1ea"/></linearGradient>
<linearGradient id="w3d4ol-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4562f"/><stop offset=".5" stop-color="#e3a843"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<radialGradient id="w3d4ol-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect x="6" y="6" width="988" height="488" rx="30" fill="url(#w3d4ol-bg)"/><rect x="6" y="6" width="988" height="488" rx="30" fill="url(#w3d4ol-dots)"/>
