<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="Four steps for each group in about 30 minutes: present, questions, prepare feedback, give feedback and send the forms">
<title>Four steps for each group in about 30 minutes: present, questions, prepare feedback, give feedback and send the forms</title>
<style>.w3d4d4rscycle-fl{animation:w3d4d4rscycle-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4rscycle-fl2{animation:w3d4d4rscycle-fl 6.5s ease-in-out -2.5s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4rscycle-tw{animation:w3d4d4rscycle-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d4rscycle-tw2{animation-delay:-1.5s}
.w3d4d4rscycle-bl{animation:w3d4d4rscycle-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4rscycle-pu{animation:w3d4d4rscycle-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d4rscycle-pu2{animation-delay:-1.3s}
.w3d4d4rscycle-dr{stroke-dasharray:6 7;animation:w3d4d4rscycle-dr 1.5s linear infinite}
.w3d4d4rscycle-sw{animation:w3d4d4rscycle-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d4d4rscycle-sp{animation:w3d4d4rscycle-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4rscycle-wv{animation:w3d4d4rscycle-wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.w3d4d4rscycle-wv2{animation-delay:1.4s}
.w3d4d4rscycle-rv{animation:w3d4d4rscycle-rv .9s ease-out both}.w3d4d4rscycle-d1{animation-delay:.15s}.w3d4d4rscycle-d2{animation-delay:.3s}.w3d4d4rscycle-d3{animation-delay:.45s}.w3d4d4rscycle-d4{animation-delay:.6s}
@keyframes w3d4d4rscycle-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d4d4rscycle-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d4d4rscycle-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d4d4rscycle-pu{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}}
@keyframes w3d4d4rscycle-dr{to{stroke-dashoffset:-26}}
@keyframes w3d4d4rscycle-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d4d4rscycle-sp{to{transform:rotate(360deg)}}
@keyframes w3d4d4rscycle-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4d4rscycle-rv{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w3d4d4rscycle-rv{opacity:1!important}.w3d4d4rscycle-wv{opacity:.5!important}}</style>
<defs>
<filter id="w3d4d4rscycle-sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w3d4d4rscycle-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="w3d4d4rscycle-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<linearGradient id="w3d4d4rscycle-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efe4f5"/><stop offset=".6" stop-color="#fbfaf7"/><stop offset="1" stop-color="#d9c4e4" stop-opacity=".7"/></linearGradient>
<linearGradient id="w3d4d4rscycle-ta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9467a6"/><stop offset="1" stop-color="#7a4a8c"/></linearGradient>
<linearGradient id="w3d4d4rscycle-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c66a"/><stop offset="1" stop-color="#d1922a"/></linearGradient>
<linearGradient id="w3d4d4rscycle-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d4d4rscycle-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f4f1ea"/></linearGradient>
<radialGradient id="w3d4d4rscycle-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect x="6" y="6" width="988" height="448" rx="30" fill="url(#w3d4d4rscycle-bg)"/><rect x="6" y="6" width="988" height="448" rx="30" fill="url(#w3d4d4rscycle-dots)"/><circle class="w3d4d4rscycle-dr" cx="500" cy="236" r="190" stroke="#d9c4e4" stroke-width="4" fill="none"/><g><circle cx="500" cy="236" r="44" fill="#fff" stroke="#14293a" stroke-width="6.16" filter="url(#w3d4d4rscycle-sh2)"/><path d="M500 236V209.6" stroke="#14293a" stroke-width="5.279999999999999" stroke-linecap="round"/><g class="w3d4d4rscycle-sp"><path d="M500 236L519.8 244.8" stroke="#b0512a" stroke-width="4.4" stroke-linecap="round"/><circle cx="500" cy="236" r="4.4" fill="#14293a"/></g></g><text x="500" y="310" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#b0512a" text-anchor="middle">≈ 30 min</text><g class="w3d4d4rscycle-rv w3d4d4rscycle-d1"><rect x="60" y="40" width="240" height="160" rx="18" fill="#fff" filter="url(#w3d4d4rscycle-sh)"/><g><circle cx="94" cy="76" r="22" fill="#2f6db5" filter="url(#w3d4d4rscycle-sh2)"/><circle cx="94" cy="76" r="19" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><text x="94" y="82.336" font-family="Manrope, Arial, sans-serif" font-size="17.6" font-weight="800" fill="#fff" text-anchor="middle">1</text></g><text x="126" y="74" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#2f6db5" text-anchor="start">Present</text><text x="126" y="96" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="start" fill-opacity="0.7">8–10 min</text><text x="80" y="132" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">The group presents.</text><text x="80" y="153" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Everyone listens and fills</text><text x="80" y="174" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">in the feedback tool.</text></g><g class="w3d4d4rscycle-rv w3d4d4rscycle-d2"><rect x="700" y="40" width="240" height="160" rx="18" fill="#fff" filter="url(#w3d4d4rscycle-sh)"/><g><circle cx="734" cy="76" r="22" fill="#7a4a8c" filter="url(#w3d4d4rscycle-sh2)"/><circle cx="734" cy="76" r="19" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><text x="734" y="82.336" font-family="Manrope, Arial, sans-serif" font-size="17.6" font-weight="800" fill="#fff" text-anchor="middle">2</text></g><text x="766" y="74" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#7a4a8c" text-anchor="start">Questions</text><text x="766" y="96" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="start" fill-opacity="0.7">10 min</text><text x="720" y="132" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Write one C, P or AST</text><text x="720" y="153" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">question. 3–5 students</text><text x="720" y="174" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">ask. Presenters reflect.</text></g><g class="w3d4d4rscycle-rv w3d4d4rscycle-d3"><rect x="700" y="260" width="240" height="160" rx="18" fill="#fff" filter="url(#w3d4d4rscycle-sh)"/><g><circle cx="734" cy="296" r="22" fill="#b07d12" filter="url(#w3d4d4rscycle-sh2)"/><circle cx="734" cy="296" r="19" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><text x="734" y="302.336" font-family="Manrope, Arial, sans-serif" font-size="17.6" font-weight="800" fill="#fff" text-anchor="middle">3</text></g><text x="766" y="294" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#b07d12" text-anchor="start">Prepare feedback</text><text x="766" y="316" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="start" fill-opacity="0.7">5–7 min</text><text x="720" y="352" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Agree on your feedback</text><text x="720" y="373" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">+ one action point.</text><text x="720" y="394" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Teacher → presenters.</text></g><g class="w3d4d4rscycle-rv w3d4d4rscycle-d4"><rect x="60" y="260" width="240" height="160" rx="18" fill="#fff" filter="url(#w3d4d4rscycle-sh)"/><g><circle cx="94" cy="296" r="22" fill="#2f7d4f" filter="url(#w3d4d4rscycle-sh2)"/><circle cx="94" cy="296" r="19" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><text x="94" y="302.336" font-family="Manrope, Arial, sans-serif" font-size="17.6" font-weight="800" fill="#fff" text-anchor="middle">4</text></g><text x="126" y="294" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#2f7d4f" text-anchor="start">Give + send</text><text x="126" y="316" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="start" fill-opacity="0.7">5 min</text><text x="80" y="352" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Your presenter sits</text><text x="80" y="373" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">with you. Give feedback.</text><text x="80" y="394" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Send the form.</text></g><path d="M305 110Q497.5 80 690 110" stroke="#14293a" stroke-width="3" stroke-linecap="round"/><path d="M678.5 113.5L690 110L680.1 103.2" stroke="#14293a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M820 205Q820 230 820 255" stroke="#14293a" stroke-width="3" stroke-linecap="round"/><path d="M814.8 244.2L820 255L825.2 244.2" stroke="#14293a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M690 340Q497.5 370 305 340" stroke="#14293a" stroke-width="3" stroke-linecap="round"/><path d="M316.5 336.5L305 340L314.9 346.8" stroke="#14293a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="w3d4d4rscycle-dr" d="M180 255Q180 230 180 205" stroke="#14293a" stroke-width="3" stroke-linecap="round"/><path d="M185.2 215.8L180 205L174.8 215.8" stroke="#14293a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
