<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="Three groups of reporting verbs: research verbs, discourse verbs and evaluative verbs, with examples">
<title>Three groups of reporting verbs: research verbs, discourse verbs and evaluative verbs, with examples</title>
<style>.w3d4d4verbgroups-fl{animation:w3d4d4verbgroups-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4verbgroups-fl2{animation:w3d4d4verbgroups-fl 6.5s ease-in-out -2.5s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4verbgroups-tw{animation:w3d4d4verbgroups-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d4verbgroups-tw2{animation-delay:-1.5s}
.w3d4d4verbgroups-bl{animation:w3d4d4verbgroups-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4verbgroups-pu{animation:w3d4d4verbgroups-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d4verbgroups-pu2{animation-delay:-1.3s}
.w3d4d4verbgroups-dr{stroke-dasharray:6 7;animation:w3d4d4verbgroups-dr 1.5s linear infinite}
.w3d4d4verbgroups-sw{animation:w3d4d4verbgroups-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d4d4verbgroups-sp{animation:w3d4d4verbgroups-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d4d4verbgroups-wv{animation:w3d4d4verbgroups-wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.w3d4d4verbgroups-wv2{animation-delay:1.4s}
.w3d4d4verbgroups-rv{animation:w3d4d4verbgroups-rv .9s ease-out both}.w3d4d4verbgroups-d1{animation-delay:.15s}.w3d4d4verbgroups-d2{animation-delay:.3s}.w3d4d4verbgroups-d3{animation-delay:.45s}.w3d4d4verbgroups-d4{animation-delay:.6s}
@keyframes w3d4d4verbgroups-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d4d4verbgroups-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d4d4verbgroups-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d4d4verbgroups-pu{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}}
@keyframes w3d4d4verbgroups-dr{to{stroke-dashoffset:-26}}
@keyframes w3d4d4verbgroups-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d4d4verbgroups-sp{to{transform:rotate(360deg)}}
@keyframes w3d4d4verbgroups-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4d4verbgroups-rv{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w3d4d4verbgroups-rv{opacity:1!important}.w3d4d4verbgroups-wv{opacity:.5!important}}</style>
<defs>
<filter id="w3d4d4verbgroups-sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w3d4d4verbgroups-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="w3d4d4verbgroups-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<linearGradient id="w3d4d4verbgroups-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7f4ea"/><stop offset=".6" stop-color="#fbfaf7"/><stop offset="1" stop-color="#bfe0c8" stop-opacity=".7"/></linearGradient>
<linearGradient id="w3d4d4verbgroups-ta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fa36d"/><stop offset="1" stop-color="#2f7d4f"/></linearGradient>
<linearGradient id="w3d4d4verbgroups-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c66a"/><stop offset="1" stop-color="#d1922a"/></linearGradient>
<linearGradient id="w3d4d4verbgroups-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d4d4verbgroups-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f4f1ea"/></linearGradient>
<radialGradient id="w3d4d4verbgroups-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect x="6" y="6" width="988" height="448" rx="30" fill="url(#w3d4d4verbgroups-bg)"/><rect x="6" y="6" width="988" height="448" rx="30" fill="url(#w3d4d4verbgroups-dots)"/><g class="w3d4d4verbgroups-rv w3d4d4verbgroups-d1"><rect x="40" y="50" width="290" height="360" rx="18" fill="#fff" filter="url(#w3d4d4verbgroups-sh)"/><path d="M40 68a18 18 0 0 1 18-18h254a18 18 0 0 1 18 18v28h-290z" fill="#2f6db5"/><text x="185" y="84" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">1  Research</text><text x="185" y="124" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6db5" text-anchor="middle">what the source studied</text><rect x="70" y="146" width="110" height="42" rx="21" fill="#2f6db5" fill-opacity=".14" stroke="#2f6db5" stroke-width="2"/><text x="125" y="173" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#2f6db5" text-anchor="middle">study</text><rect x="190" y="146" width="110" height="42" rx="21" fill="#2f6db5" fill-opacity=".14" stroke="#2f6db5" stroke-width="2"/><text x="245" y="173" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#2f6db5" text-anchor="middle">investigate</text><rect x="70" y="202" width="110" height="42" rx="21" fill="#2f6db5" fill-opacity=".14" stroke="#2f6db5" stroke-width="2"/><text x="125" y="229" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#2f6db5" text-anchor="middle">research</text><rect x="190" y="202" width="110" height="42" rx="21" fill="#2f6db5" fill-opacity=".14" stroke="#2f6db5" stroke-width="2"/><text x="245" y="229" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#2f6db5" text-anchor="middle">explore</text><text x="185" y="300" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a" text-anchor="middle">e.g.</text><text x="185" y="322" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a" text-anchor="middle">Dalton (2004) studied</text><text x="185" y="344" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a" text-anchor="middle">changes in urban water usage.</text></g><g class="w3d4d4verbgroups-rv w3d4d4verbgroups-d2"><rect x="355" y="50" width="290" height="360" rx="18" fill="#fff" filter="url(#w3d4d4verbgroups-sh)"/><path d="M355 68a18 18 0 0 1 18-18h254a18 18 0 0 1 18 18v28h-290z" fill="#2f7d4f"/><text x="500" y="84" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">2  Discourse</text><text x="500" y="124" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f7d4f" text-anchor="middle">what the source does</text><rect x="385" y="146" width="110" height="42" rx="21" fill="#2f7d4f" fill-opacity=".14" stroke="#2f7d4f" stroke-width="2"/><text x="440" y="173" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#2f7d4f" text-anchor="middle">state</text><rect x="505" y="146" width="110" height="42" rx="21" fill="#2f7d4f" fill-opacity=".14" stroke="#2f7d4f" stroke-width="2"/><text x="560" y="173" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#2f7d4f" text-anchor="middle">mention</text><rect x="385" y="202" width="110" height="42" rx="21" fill="#2f7d4f" fill-opacity=".14" stroke="#2f7d4f" stroke-width="2"/><text x="440" y="229" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#2f7d4f" text-anchor="middle">suggest</text><rect x="505" y="202" width="110" height="42" rx="21" fill="#2f7d4f" fill-opacity=".14" stroke="#2f7d4f" stroke-width="2"/><text x="560" y="229" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#2f7d4f" text-anchor="middle">conclude</text><text x="500" y="300" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a" text-anchor="middle">e.g.</text><text x="500" y="322" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a" text-anchor="middle">Toso (2012) concludes that states</text><text x="500" y="344" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a" text-anchor="middle">are not enforcing the legislation.</text></g><g class="w3d4d4verbgroups-rv w3d4d4verbgroups-d3"><rect x="670" y="50" width="290" height="360" rx="18" fill="#fff" filter="url(#w3d4d4verbgroups-sh)"/><path d="M670 68a18 18 0 0 1 18-18h254a18 18 0 0 1 18 18v28h-290z" fill="#b0512a"/><text x="815" y="84" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">3  Evaluative</text><text x="815" y="124" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#b0512a" text-anchor="middle">YOUR judgment of the source</text><rect x="700" y="146" width="110" height="42" rx="21" fill="#b0512a" fill-opacity=".14" stroke="#b0512a" stroke-width="2"/><text x="755" y="173" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#b0512a" text-anchor="middle">contend</text><rect x="820" y="146" width="110" height="42" rx="21" fill="#b0512a" fill-opacity=".14" stroke="#b0512a" stroke-width="2"/><text x="875" y="173" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#b0512a" text-anchor="middle">assume</text><rect x="700" y="202" width="110" height="42" rx="21" fill="#b0512a" fill-opacity=".14" stroke="#b0512a" stroke-width="2"/><text x="755" y="229" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#b0512a" text-anchor="middle">assert</text><rect x="820" y="202" width="110" height="42" rx="21" fill="#b0512a" fill-opacity=".14" stroke="#b0512a" stroke-width="2"/><text x="875" y="229" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#b0512a" text-anchor="middle">allege</text><text x="815" y="300" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a" text-anchor="middle">e.g.</text><text x="815" y="322" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a" text-anchor="middle">Cooper and Davy (1999) allege</text><text x="815" y="344" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a" text-anchor="middle">that governments understate …</text></g><g class="w3d4d4verbgroups-fl"><g><circle cx="920" cy="370" r="16" fill="#fff" fill-opacity=".6" stroke="#b0512a" stroke-width="3.52"/><path d="M931.52 381.52L945.6 395.6" stroke="#b0512a" stroke-width="5.12" stroke-linecap="round"/><path d="M912.8 366.8A8 8 0 0 1 918.4 362" stroke="#fff" stroke-width="1.92" stroke-linecap="round"/></g></g><text x="500" y="440" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle" fill-opacity="0.8">Choose carefully: “mentions” = only briefly · “alleges” = without proof</text>
</svg>
