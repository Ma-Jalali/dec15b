<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" fill="none" role="img" aria-label="Feedback literacy: four features in a cycle — appreciate feedback, make judgements, manage emotions, take action">
<title>Feedback literacy: four features in a cycle — appreciate feedback, make judgements, manage emotions, take action</title>
<style>.w3d5fl-fl{animation:w3d5fl-fl 6s ease-in-out infinite}.w3d5fl-f2{animation-delay:-2s}.w3d5fl-f3{animation-delay:-4s}
.w3d5fl-dr{stroke-dasharray:7 9;animation:w3d5fl-dr 2.2s linear infinite}
.w3d5fl-pu{animation:w3d5fl-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w3d5fl-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d5fl-dr{to{stroke-dashoffset:-32}}
@keyframes w3d5fl-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><filter id="w3d5fl-sh" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#14293a" flood-opacity=".12"/><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w3d5fl-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/></filter>
<linearGradient id="w3d5fl-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d5fl-bg" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#f4faf8"/><stop offset="1" stop-color="#e1efeb"/></linearGradient>
<pattern id="w3d5fl-dd" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#2f7d6b" opacity=".1"/></pattern>
<clipPath id="w3d5fl-clip"><rect width="960" height="460" rx="28"/></clipPath></defs>
<g clip-path="url(#w3d5fl-clip)"><rect width="960" height="460" fill="url(#w3d5fl-bg)"/><rect width="960" height="460" fill="url(#w3d5fl-dd)"/><circle cx="900" cy="440" r="170" fill="#2f7d6b" opacity=".04"/></g>
<rect x=".75" y=".75" width="958.5" height="458.5" rx="27.25" stroke="#2f7d6b" stroke-opacity=".14" stroke-width="1.5"/>
<path class="w3d5fl-dr" d="M360 105 C 430 60, 530 60, 600 105" stroke="#2f7d6b" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><path d="M591.1 104.0L600 105L596.0 96.9" stroke="#2f7d6b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path class="w3d5fl-dr" d="M760 170 C 800 210, 800 250, 760 290" stroke="#3a58a0" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><path d="M761.0 281.1L760 290L768.1 286.0" stroke="#3a58a0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path class="w3d5fl-dr" d="M600 355 C 530 400, 430 400, 360 355" stroke="#b07d12" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><path d="M368.9 356.0L360 355L364.0 363.1" stroke="#b07d12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path class="w3d5fl-dr" d="M200 290 C 160 250, 160 210, 200 170" stroke="#c4562f" stroke-width="2.6" stroke-linecap="round" opacity=".55"/><path d="M199.8 179.0L200 170L192.3 174.7" stroke="#c4562f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#w3d5fl-sh)"><rect x="60" y="40" width="300" height="130" rx="20" fill="#fff"/></g><rect x="60" y="40" width="10" height="130" rx="5" fill="#2f7d6b"/><g filter="url(#w3d5fl-sm)"><circle cx="106" cy="86" r="22" fill="#2f7d6b"/><circle cx="106" cy="79.4" r="15.4" fill="url(#w3d5fl-gls)"/><text x="106" y="93.92" font-family="Manrope, Arial, sans-serif" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">1</text></g><text x="140" y="94" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#2f7d6b" text-anchor="start">Appreciate feedback</text><text x="90" y="132" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">See feedback as help,</text><text x="90" y="153" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">not as a mark.</text><g filter="url(#w3d5fl-sh)"><rect x="600" y="40" width="300" height="130" rx="20" fill="#fff"/></g><rect x="600" y="40" width="10" height="130" rx="5" fill="#3a58a0"/><g filter="url(#w3d5fl-sm)"><circle cx="646" cy="86" r="22" fill="#3a58a0"/><circle cx="646" cy="79.4" r="15.4" fill="url(#w3d5fl-gls)"/><text x="646" y="93.92" font-family="Manrope, Arial, sans-serif" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">2</text></g><text x="680" y="94" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#3a58a0" text-anchor="start">Make judgements</text><text x="630" y="132" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Look for patterns. Compare</text><text x="630" y="153" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">with your own view.</text><g filter="url(#w3d5fl-sh)"><rect x="600" y="290" width="300" height="130" rx="20" fill="#fff"/></g><rect x="600" y="290" width="10" height="130" rx="5" fill="#b07d12"/><g filter="url(#w3d5fl-sm)"><circle cx="646" cy="336" r="22" fill="#b07d12"/><circle cx="646" cy="329.4" r="15.4" fill="url(#w3d5fl-gls)"/><text x="646" y="343.92" font-family="Manrope, Arial, sans-serif" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">3</text></g><text x="680" y="344" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#b07d12" text-anchor="start">Manage emotions</text><text x="630" y="382" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Stay calm and open.</text><text x="630" y="403" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Don’t argue. Don’t give up.</text><g filter="url(#w3d5fl-sh)"><rect x="60" y="290" width="300" height="130" rx="20" fill="#fff"/></g><rect x="60" y="290" width="10" height="130" rx="5" fill="#c4562f"/><g filter="url(#w3d5fl-sm)"><circle cx="106" cy="336" r="22" fill="#c4562f"/><circle cx="106" cy="329.4" r="15.4" fill="url(#w3d5fl-gls)"/><text x="106" y="343.92" font-family="Manrope, Arial, sans-serif" font-size="23" font-weight="800" fill="#fff" text-anchor="middle">4</text></g><text x="140" y="344" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#c4562f" text-anchor="start">Take action</text><text x="90" y="382" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Turn it into specific steps</text><text x="90" y="403" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">and do them before next time.</text><g class="w3d5fl-fl"><g filter="url(#w3d5fl-sh)"><rect x="400" y="175" width="160" height="92" rx="20" fill="#fff"/></g><path d="M455 266 l-8 22 26-22z" fill="#fff"/><text x="480" y="214" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a" text-anchor="middle">Feedback</text><text x="480" y="240" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="600" fill="#5d6a74" text-anchor="middle">teacher · classmates</text></g><text x="480" y="448" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" fill="#5d6a74" text-anchor="middle">Carless &amp; Boud (2018)</text></svg>
