.w3d5fs-pu{animation:w3d5fs-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w3d5fs-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d5fs-dr{to{stroke-dashoffset:-32}}
