<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" fill="none" role="img" aria-label="The four skills on the Interactive Discussion rubric: argumentation skills, engagement and interaction, pronunciation and flow, language use. Each gets a score; the final score is the average.">
<title>The four skills on the Interactive Discussion rubric: argumentation skills, engagement and interaction, pronunciation and flow, language use. Each gets a score; the final score is the average.</title>
<style>.w3d5fs-fl{animation:w3d5fs-fl 6s ease-in-out infinite}.w3d5fs-f2{animation-delay:-2s}.w3d5fs-f3{animation-delay:-4s}
