<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" fill="none" role="img" aria-label="One group presentation in four steps: present, ask, teacher feedback, share feedback">
<title>One group presentation in four steps: present, ask, teacher feedback, share feedback</title>
<style>
.w3d5rc-fl{animation:w3d5rc-fl 6s ease-in-out infinite}.w3d5rc-f2{animation-delay:-2s}.w3d5rc-f3{animation-delay:-4s}
.w3d5rc-tw{animation:w3d5rc-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d5rc-t2{animation-delay:-1.1s}.w3d5rc-t3{animation-delay:-2.2s}
.w3d5rc-bl{animation:w3d5rc-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.w3d5rc-b2{animation-delay:-1.7s}.w3d5rc-b3{animation-delay:-3.1s}
.w3d5rc-pu{animation:w3d5rc-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d5rc-p2{animation-delay:-1s}.w3d5rc-p3{animation-delay:-2s}
.w3d5rc-dr{stroke-dasharray:7 9;animation:w3d5rc-dr 2.2s linear infinite}
.w3d5rc-sp{animation:w3d5rc-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d5rc-wv{animation:w3d5rc-wv 2.6s ease-in-out infinite}
.w3d5rc-ha{animation:w3d5rc-ha 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.w3d5rc-h2{animation-delay:-1.5s}
.w3d5rc-dw{stroke-dasharray:240;animation:w3d5rc-dw 5s ease-in-out infinite}
.w3d5rc-rk{animation:w3d5rc-rk 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w3d5rc-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d5rc-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d5rc-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d5rc-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w3d5rc-dr{to{stroke-dashoffset:-32}}
@keyframes w3d5rc-sp{to{transform:rotate(360deg)}}
@keyframes w3d5rc-wv{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes w3d5rc-ha{0%{opacity:.55;transform:scale(.85)}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d5rc-dw{0%{stroke-dashoffset:240}45%,100%{stroke-dashoffset:0}}
@keyframes w3d5rc-rk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d5rc-ha{opacity:0}}
</style>
<defs><filter id="w3d5rc-sh" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#14293a" flood-opacity=".12"/></filter><filter id="w3d5rc-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/></filter><filter id="w3d5rc-bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter><radialGradient id="w3d5rc-glo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><radialGradient id="w3d5rc-gold" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fde9c4" stop-opacity=".85"/><stop offset="1" stop-color="#fde9c4" stop-opacity="0"/></radialGradient><pattern id="w3d5rc-dt" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#8a4f9e" fill-opacity=".14"/></pattern><pattern id="w3d5rc-ln" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#fff" stroke-opacity=".22" stroke-width="3"/></pattern><linearGradient id="w3d5rc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4eef9"/><stop offset="1" stop-color="#e4d6ee"/></linearGradient><linearGradient id="w3d5rc-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fbf7ef"/></linearGradient><linearGradient id="w3d5rc-ta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a4f9e"/><stop offset="1" stop-color="#6a3a80"/></linearGradient><linearGradient id="w3d5rc-gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><linearGradient id="w3d5rc-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="w3d5rc-gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c46a"/><stop offset="1" stop-color="#d29a2c"/></linearGradient><linearGradient id="w3d5rc-co" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec8c6f"/><stop offset="1" stop-color="#cf5f42"/></linearGradient><linearGradient id="w3d5rc-bu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b7cc4"/><stop offset="1" stop-color="#36539a"/></linearGradient><linearGradient id="w3d5rc-te" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fa08c"/><stop offset="1" stop-color="#2a6f60"/></linearGradient><linearGradient id="w3d5rc-pl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a476b3"/><stop offset="1" stop-color="#7a4a8c"/></linearGradient><linearGradient id="w3d5rc-gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cbf6a"/><stop offset="1" stop-color="#4c8a3a"/></linearGradient><linearGradient id="w3d5rc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8ecfa"/><stop offset="1" stop-color="#f3f8fc"/></linearGradient><linearGradient id="w3d5rc-wd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8935a"/><stop offset="1" stop-color="#a06d3b"/></linearGradient><linearGradient id="w3d5rc-nv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a4157"/><stop offset="1" stop-color="#16293a"/></linearGradient><linearGradient id="w3d5rc-sol" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3c64a8"/><stop offset="1" stop-color="#22417a"/></linearGradient></defs>
<clipPath id="w3d5rc-clip"><rect width="960" height="450" rx="28"/></clipPath><linearGradient id="w3d5rc-dbg" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#fdfaf3"/><stop offset="1" stop-color="#f4ecdd"/></linearGradient><pattern id="w3d5rc-dd" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#7a5a2a" opacity=".09"/></pattern><g clip-path="url(#w3d5rc-clip)"><rect width="960" height="450" fill="url(#w3d5rc-dbg)"/><rect width="960" height="450" fill="url(#w3d5rc-dd)"/><ellipse cx="211.2" cy="54.0" rx="403.2" ry="225.0" fill="url(#w3d5rc-glo)" opacity=".75"/><circle cx="900" cy="430" r="189.0" fill="#7a5a2a" opacity=".035"/></g><rect x=".75" y=".75" width="958.5" height="448.5" rx="27.25" stroke="#7a5a2a" stroke-opacity=".14" stroke-width="1.5"/><text x="40" y="50" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a">One group presentation · about 30 minutes</text><g filter="url(#w3d5rc-sh)"><rect x="40" y="80" width="200" height="340" rx="18" fill="url(#w3d5rc-pap)"/><path d="M40 98a18 18 0 0 1 18-18h164a18 18 0 0 1 18 18v28h-200z" fill="#8a4f9e"/><rect x="40" y="80" width="200" height="46" rx="18" fill="url(#w3d5rc-ln)" opacity=".5"/></g><circle cx="66" cy="103" r="14" fill="#fff" opacity=".95"/><text x="66" y="108.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#8a4f9e" text-anchor="middle">1</text><text x="88" y="109" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Present</text><rect x="156" y="92" width="74" height="22" rx="11.0" fill="#ffffff"/><text x="193.0" y="107.14" font-family="Manrope, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#8a4f9e" text-anchor="middle">8–10 min</text><rect x="54" y="140" width="172" height="104" rx="12" fill="#8a4f9e" opacity=".08"/><text x="64" y="162" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#8a4f9e" letter-spacing=".6">PRESENTING GROUP</text><text x="64" y="184" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a"><tspan x="64" dy="0">The group presents.</tspan></text><rect x="54" y="256" width="172" height="146" rx="12" fill="#fff" stroke="#8a4f9e" stroke-opacity=".25"/><text x="64" y="278" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#8a4f9e" letter-spacing=".6">AUDIENCE</text><text x="64" y="300" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a"><tspan x="64" dy="0">Listen. Fill in the</tspan><tspan x="64" dy="18">feedback tool for your</tspan><tspan x="64" dy="18">presenter.</tspan></text><path class="w3d5rc-dr" d="M242 250H264" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/><path d="M258.1 254.3L266 250L258.1 245.7" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><g filter="url(#w3d5rc-sh)"><rect x="266" y="80" width="200" height="340" rx="18" fill="url(#w3d5rc-pap)"/><path d="M266 98a18 18 0 0 1 18-18h164a18 18 0 0 1 18 18v28h-200z" fill="#3a58a0"/><rect x="266" y="80" width="200" height="46" rx="18" fill="url(#w3d5rc-ln)" opacity=".5"/></g><circle cx="292" cy="103" r="14" fill="#fff" opacity=".95"/><text x="292" y="108.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#3a58a0" text-anchor="middle">2</text><text x="314" y="109" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Ask</text><rect x="375" y="92" width="81" height="22" rx="11.0" fill="#ffffff"/><text x="415.5" y="107.14" font-family="Manrope, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#3a58a0" text-anchor="middle">questions</text><rect x="280" y="140" width="172" height="104" rx="12" fill="#3a58a0" opacity=".08"/><text x="290" y="162" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#3a58a0" letter-spacing=".6">PRESENTING GROUP</text><text x="290" y="184" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a"><tspan x="290" dy="0">The group reflects,</tspan><tspan x="290" dy="18">then answers.</tspan></text><rect x="280" y="256" width="172" height="146" rx="12" fill="#fff" stroke="#3a58a0" stroke-opacity=".25"/><text x="290" y="278" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#3a58a0" letter-spacing=".6">AUDIENCE</text><text x="290" y="300" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a"><tspan x="290" dy="0">Write one</tspan><tspan x="290" dy="18">clarification, probing</tspan><tspan x="290" dy="18">or AST question. A few</tspan><tspan x="290" dy="18">students ask.</tspan></text><path class="w3d5rc-dr" d="M468 250H490" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/><path d="M484.1 254.3L492 250L484.1 245.7" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><g filter="url(#w3d5rc-sh)"><rect x="492" y="80" width="200" height="340" rx="18" fill="url(#w3d5rc-pap)"/><path d="M492 98a18 18 0 0 1 18-18h164a18 18 0 0 1 18 18v28h-200z" fill="#2f7d6b"/><rect x="492" y="80" width="200" height="46" rx="18" fill="url(#w3d5rc-ln)" opacity=".5"/></g><circle cx="518" cy="103" r="14" fill="#fff" opacity=".95"/><text x="518" y="108.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#2f7d6b" text-anchor="middle">3</text><text x="540" y="109" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Teacher</text><rect x="615" y="92" width="67" height="22" rx="11.0" fill="#ffffff"/><text x="648.5" y="107.14" font-family="Manrope, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#2f7d6b" text-anchor="middle">5–7 min</text><rect x="506" y="140" width="172" height="104" rx="12" fill="#2f7d6b" opacity=".08"/><text x="516" y="162" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#2f7d6b" letter-spacing=".6">PRESENTING GROUP</text><text x="516" y="184" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a"><tspan x="516" dy="0">The teacher gives the</tspan><tspan x="516" dy="18">group feedback.</tspan></text><rect x="506" y="256" width="172" height="146" rx="12" fill="#fff" stroke="#2f7d6b" stroke-opacity=".25"/><text x="516" y="278" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#2f7d6b" letter-spacing=".6">AUDIENCE</text><text x="516" y="300" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a"><tspan x="516" dy="0">Agree on your feedback</tspan><tspan x="516" dy="18">+ at least one action</tspan><tspan x="516" dy="18">point.</tspan></text><path class="w3d5rc-dr" d="M694 250H716" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/><path d="M710.1 254.3L718 250L710.1 245.7" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><g filter="url(#w3d5rc-sh)"><rect x="718" y="80" width="200" height="340" rx="18" fill="url(#w3d5rc-pap)"/><path d="M718 98a18 18 0 0 1 18-18h164a18 18 0 0 1 18 18v28h-200z" fill="#c4562f"/><rect x="718" y="80" width="200" height="46" rx="18" fill="url(#w3d5rc-ln)" opacity=".5"/></g><circle cx="744" cy="103" r="14" fill="#fff" opacity=".95"/><text x="744" y="108.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#c4562f" text-anchor="middle">4</text><text x="766" y="109" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Share</text><rect x="855" y="92" width="53" height="22" rx="11.0" fill="#ffffff"/><text x="881.5" y="107.14" font-family="Manrope, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#c4562f" text-anchor="middle">5 min</text><rect x="732" y="140" width="172" height="104" rx="12" fill="#c4562f" opacity=".08"/><text x="742" y="162" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#c4562f" letter-spacing=".6">PRESENTING GROUP</text><text x="742" y="184" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a"><tspan x="742" dy="0">Each presenter hears</tspan><tspan x="742" dy="18">their feedback.</tspan></text><rect x="732" y="256" width="172" height="146" rx="12" fill="#fff" stroke="#c4562f" stroke-opacity=".25"/><text x="742" y="278" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#c4562f" letter-spacing=".6">AUDIENCE</text><text x="742" y="300" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a"><tspan x="742" dy="0">Give feedback face to</tspan><tspan x="742" dy="18">face. Send the form.</tspan></text><path class="w3d5rc-tw " d="M900 36Q902.24 41.76 908 44Q902.24 46.24 900 52Q897.76 46.24 892 44Q897.76 41.76 900 36z" fill="#e3a843"/><path class="w3d5rc-tw w3d5rc-t2" d="M870 26Q871.12 28.88 874 30Q871.12 31.12 870 34Q868.88 31.12 866 30Q868.88 28.88 870 26z" fill="#e07a5f"/>
</svg>
