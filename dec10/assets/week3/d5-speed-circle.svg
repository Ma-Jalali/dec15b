<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none" role="img" aria-label="Inner and outer circle. Inner circle A asks the question, outer circle B answers for one minute, A gives one tip, then B moves one seat. Then swap roles.">
<title>Inner and outer circle. Inner circle A asks the question, outer circle B answers for one minute, A gives one tip, then B moves one seat. Then swap roles.</title>
<style>
