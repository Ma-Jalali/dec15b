set="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="w3d5tf-gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c46a"/><stop offset="1" stop-color="#d29a2c"/></linearGradient><linearGradient id="w3d5tf-co" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec8c6f"/><stop offset="1" stop-color="#cf5f42"/></linearGradient><linearGradient id="w3d5tf-bu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b7cc4"/><stop offset="1" stop-color="#36539a"/></linearGradient><linearGradient id="w3d5tf-te" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fa08c"/><stop offset="1" stop-color="#2a6f60"/></linearGradient><linearGradient id="w3d5tf-pl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a476b3"/><stop offset="1" stop-color="#7a4a8c"/></linearGradient><linearGradient id="w3d5tf-gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cbf6a"/><stop offset="1" stop-color="#4c8a3a"/></linearGradient><linearGradient id="w3d5tf-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8ecfa"/><stop offset="1" stop-color="#f3f8fc"/></linearGradient><linearGradient id="w3d5tf-wd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8935a"/><stop offset="1" stop-color="#a06d3b"/></linearGradient><linearGradient id="w3d5tf-nv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a4157"/><stop offset="1" stop-color="#16293a"/></linearGradient><linearGradient id="w3d5tf-sol" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3c64a8"/><stop offset="1" stop-color="#22417a"/></linearGradient></defs>
<clipPath id="w3d5tf-clip"><rect width="960" height="410" rx="28"/></clipPath><linearGradient id="w3d5tf-dbg" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#fdfaf3"/><stop offset="1" stop-color="#f4ecdd"/></linearGradient><pattern id="w3d5tf-dd" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#7a5a2a" opacity=".09"/></pattern><g clip-path="url(#w3d5tf-clip)"><rect width="960" height="410" fill="url(#w3d5tf-dbg)"/><rect width="960" height="410" fill="url(#w3d5tf-dd)"/><ellipse cx="211.2" cy="49.199999999999996" rx="403.2" ry="205.0" fill="url(#w3d5tf-glo)" opacity=".75"/><circle cx="900" cy="390" r="172.2" fill="#7a5a2a" opacity=".035"/></g><rect x=".75" y=".75" width="958.5" height="408.5" rx="27.25" stroke="#7a5a2a" stroke-opacity=".14" stroke-width="1.5"/><text x="40" y="50" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a">Taking the floor politely: four moves</text><g filter="url(#w3d5tf-sh)"><rect x="40" y="80" width="206" height="200" rx="18" fill="url(#w3d5tf-pap)"/><path d="M40 98a18 18 0 0 1 18-18h170a18 18 0 0 1 18 18v28h-206z" fill="#3a58a0"/><rect x="40" y="80" width="206" height="46" rx="18" fill="url(#w3d5tf-ln)" opacity=".5"/></g><circle cx="66" cy="103" r="14" fill="#fff" opacity=".95"/><text x="66" y="108.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#3a58a0" text-anchor="middle">1</text><text x="88" y="109" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Wait</text><text x="56" y="230" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14293a"><tspan x="56" dy="0">for a small pause or the</tspan><tspan x="56" dy="17">end of a sentence.</tspan></text><g class="w3d5tf-pu"><rect x="113" y="144" width="16" height="50" rx="5" fill="#3a58a0"/><rect x="157" y="144" width="16" height="50" rx="5" fill="#3a58a0"/></g><path d="M248 180H262" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/><path d="M255.1 184.3L263 180L255.1 175.7" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><g filter="url(#w3d5tf-sh)"><rect x="266" y="80" width="206" height="200" rx="18" fill="url(#w3d5tf-pap)"/><path d="M266 98a18 18 0 0 1 18-18h170a18 18 0 0 1 18 18v28h-206z" fill="#2f7d6b"/><rect x="266" y="80" width="206" height="46" rx="18" fill="url(#w3d5tf-ln)" opacity=".5"/></g><circle cx="292" cy="103" r="14" fill="#fff" opacity=".95"/><text x="292" y="108.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#2f7d6b" text-anchor="middle">2</text><text x="314" y="109" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Signal</text><text x="282" y="230" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14293a"><tspan x="282" dy="0">with eye contact, a nod</tspan><tspan x="282" dy="17">or a small hand gesture.</tspan></text><g class="w3d5tf-bl"><ellipse cx="353" cy="172" rx="14" ry="16" fill="#fff" stroke="#14293a" stroke-width="3"/><ellipse cx="385" cy="172" rx="14" ry="16" fill="#fff" stroke="#14293a" stroke-width="3"/><circle cx="357" cy="174" r="6" fill="#14293a"/><circle cx="389" cy="174" r="6" fill="#14293a"/></g><path d="M474 180H488" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/><path d="M481.1 184.3L489 180L481.1 175.7" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><g filter="url(#w3d5tf-sh)"><rect x="492" y="80" width="206" height="200" rx="18" fill="url(#w3d5tf-pap)"/><path d="M492 98a18 18 0 0 1 18-18h170a18 18 0 0 1 18 18v28h-206z" fill="#4c8a3a"/><rect x="492" y="80" width="206" height="46" rx="18" fill="url(#w3d5tf-ln)" opacity=".5"/></g><circle cx="518" cy="103" r="14" fill="#fff" opacity=".95"/><text x="518" y="108.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#4c8a3a" text-anchor="middle">3</text><text x="540" y="109" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Say it politely</text><text x="508" y="230" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14293a"><tspan x="508" dy="0">“Sorry to jump in, but…”</tspan><tspan x="508" dy="17">· “Just a quick thought…”</tspan></text><g class="" filter="url(#w3d5tf-sm)"><rect x="525" y="142" width="140" height="48" rx="16" fill="#fff" stroke="#4c8a3a" stroke-width="1.2"/><path d="M543 188L537 204L559 188Z" fill="#fff"/></g><text x="595" y="172" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#4c8a3a" text-anchor="middle">Sorry to jump in…</text><path d="M700 180H714" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/><path d="M707.1 184.3L715 180L707.1 175.7" stroke="#14293a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><g filter="url(#w3d5tf-sh)"><rect x="718" y="80" width="206" height="200" rx="18" fill="url(#w3d5tf-pap)"/><path d="M718 98a18 18 0 0 1 18-18h170a18 18 0 0 1 18 18v28h-206z" fill="#8a4f9e"/><rect x="718" y="80" width="206" height="46" rx="18" fill="url(#w3d5tf-ln)" opacity=".5"/></g><circle cx="744" cy="103" r="14" fill="#fff" opacity=".95"/><text x="744" y="108.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#8a4f9e" text-anchor="middle">4</text><text x="766" y="109" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Short + linked</text><text x="734" y="230" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#14293a"><tspan x="734" dy="0">One point. Link it to</tspan><tspan x="734" dy="17">what was said.</tspan></text><g filter="url(#w3d5tf-sm)"><rect x="763" y="150" width="48" height="34" rx="9" fill="#8a4f9e" opacity=".8"/><rect x="831" y="150" width="48" height="34" rx="9" fill="#e3a843"/></g><path d="M811 167h20" stroke="#14293a" stroke-width="3" stroke-dasharray="3 4"/><g filter="url(#w3d5tf-sm)"><rect x="40" y="300" width="880" height="84" rx="18" fill="#fff"/></g><rect x="40" y="300" width="10" height="84" rx="5" fill="#e07a5f"/><text x="70" y="332" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#e07a5f">Not like this:</text><text x="70" y="356" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a"><tspan x="70" dy="0">talking over someone, “No, that’s wrong. Listen to me.”, or</tspan><tspan x="70" dy="18">a very long turn.</tspan></text><g class="" filter="url(#w3d5tf-sm)"><rect x="650" y="318" width="120" height="44" rx="16" fill="#fde2da"/><path d="M736 360L758 376L752 360Z" fill="#fde2da"/></g><g class="" filter="url(#w3d5tf-sm)"><rect x="760" y="326" width="130" height="44" rx="16" fill="#fde2da"/><path d="M778 368L772 384L794 368Z" fill="#fde2da"/></g><path d="M640 312L900 376" stroke="#e07a5f" stroke-width="5" stroke-linecap="round"/>
</svg>
