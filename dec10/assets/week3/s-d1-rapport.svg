@keyframes w3d1srap-sw{50%{transform:rotate(5deg)}}
@keyframes w3d1srap-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1srap-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
