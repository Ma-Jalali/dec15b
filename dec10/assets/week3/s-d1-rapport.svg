.w3d1srap-ri{animation:w3d1srap-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1srap-r2{animation-delay:-1.7s}.w3d1srap-r3{animation-delay:-3.4s}
.w3d1srap-dw{stroke-dasharray:400;animation:w3d1srap-dw 6s ease-in-out infinite}
@keyframes w3d1srap-fl{50%{transform:translateY(-4px)}}
@keyframes w3d1srap-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
