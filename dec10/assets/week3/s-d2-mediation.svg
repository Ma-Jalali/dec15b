<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="Three sources — a book, a podcast microphone and a UN-style report — send glowing threads into a note-taking matrix; in front, an HR representative and a candidate shake hands across an interview desk with wind turbines in the window.">
<title>7A Mediation: three texts and a job interview</title>
<style>
