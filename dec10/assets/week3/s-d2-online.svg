<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A student works at home on a laptop showing a discussion board, surrounded by floating windows: an email to a lecturer, a shared document with comment bubbles and a netiquette checklist with ticks; no emojis allowed.">
<title>8A AST Digital literacy: online communication</title>
<style>
.w32sonline-fl{animation:w32sonline-fl 6s ease-in-out infinite}.w32sonline-f2{animation-delay:-2s}.w32sonline-f3{animation-delay:-4s}
.w32sonline-tw{animation:w32sonline-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32sonline-t2{animation-delay:-1s}.w32sonline-t3{animation-delay:-2s}
.w32sonline-bl{animation:w32sonline-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32sonline-b2{animation-delay:-1.7s}.w32sonline-b3{animation-delay:-3.2s}
.w32sonline-sp{animation:w32sonline-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32sonline-sr{animation-direction:reverse}
.w32sonline-pu{animation:w32sonline-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32sonline-p2{animation-delay:-1.3s}
.w32sonline-dr{stroke-dasharray:6 8;animation:w32sonline-dr 1.6s linear infinite}
.w32sonline-wv{animation:w32sonline-wv 2.4s ease-out infinite}.w32sonline-w2{animation-delay:-.8s}.w32sonline-w3{animation-delay:-1.6s}
.w32sonline-bob{animation:w32sonline-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32sonline-dw{stroke-dasharray:420;stroke-dashoffset:420;animation:w32sonline-dw 7s ease-in-out infinite}
.w32sonline-eq{animation:w32sonline-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32sonline-e2{animation-delay:-.3s}.w32sonline-e3{animation-delay:-.6s}.w32sonline-e4{animation-delay:-.85s}
@keyframes w32sonline-fl{50%{transform:translateY(-4px)}}
@keyframes w32sonline-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32sonline-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32sonline-sp{to{transform:rotate(360deg)}}
@keyframes w32sonline-pu{50%{transform:scale(1.07)}}
@keyframes w32sonline-dr{to{stroke-dashoffset:-28}}
@keyframes w32sonline-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32sonline-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32sonline-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32sonline-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
