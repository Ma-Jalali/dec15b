.w32srsgroup-dw{stroke-dasharray:420;stroke-dashoffset:420;animation:w32srsgroup-dw 7s ease-in-out infinite}
.w32srsgroup-eq{animation:w32srsgroup-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32srsgroup-e2{animation-delay:-.3s}.w32srsgroup-e3{animation-delay:-.6s}.w32srsgroup-e4{animation-delay:-.85s}
@keyframes w32srsgroup-fl{50%{transform:translateY(-4px)}}
@keyframes w32srsgroup-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
