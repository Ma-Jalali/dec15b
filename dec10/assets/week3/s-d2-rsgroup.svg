<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A small group of four students sits around a round table sharing research: one speaks as the expert in front of a laptop, others hold source cards; above them, four speech bubbles merge into one big presentation screen showing causes and effects.">
<title>5A Research summary presentations: share, then plan together</title>
<style>
.w32srsgroup-fl{animation:w32srsgroup-fl 6s ease-in-out infinite}.w32srsgroup-f2{animation-delay:-2s}.w32srsgroup-f3{animation-delay:-4s}
