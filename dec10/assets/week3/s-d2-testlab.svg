<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A calm evening study desk: a student with headphones does the Canvas listening practice on a laptop; a target, a timer, a word counter showing three words and a checklist of tactics float around the lamp light.">
