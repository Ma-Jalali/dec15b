@keyframes w3d3sa-pu{0%,100%{transform:scale(1)}20%{transform:scale(1.08)}40%{transform:scale(1)}}
@keyframes w3d3sa-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3sa-sp{to{transform:rotate(360deg)}}
@keyframes w3d3sa-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3sa-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3sa-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3sa-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3sa-gl{0%,100%{opacity:.55}50%{opacity:1}}

