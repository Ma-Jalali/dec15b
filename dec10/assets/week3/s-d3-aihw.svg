<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="AI homework in the evening: a student at a desk lamp types a prompt into a laptop; a friendly AI assistant answers from a chat window, and a prompt card with four coloured parts — Role, Task, Requirements, Instructions — floats above; a moon and stars shine through the window.">
<title>AI homework in the evening: a student at a desk lamp types a prompt into a laptop; a friendly AI assistant answers from a chat window, and a prompt card with four coloured parts — Role, Task, Requirements, Instructions — floats above; a moon and stars shine through the window.</title>
<style>
.w3d3sa-fl{animation:w3d3sa-fl 6s ease-in-out infinite}.w3d3sa-f2{animation:w3d3sa-fl 7s ease-in-out -2.5s infinite}.w3d3sa-f3{animation:w3d3sa-fl 5.5s ease-in-out -4s infinite}
.w3d3sa-tw{animation:w3d3sa-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3sa-t2{animation-delay:-1.1s}.w3d3sa-t3{animation-delay:-2.2s}
