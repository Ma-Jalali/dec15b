.w3d3sa-sp{animation:w3d3sa-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3sa-ca{animation:w3d3sa-ca 1.1s steps(1) infinite}
.w3d3sa-sw{animation:w3d3sa-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3sa-wv{animation:w3d3sa-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3sa-w2{animation-delay:.85s}.w3d3sa-w3{animation-delay:1.7s}
.w3d3sa-rv{animation:w3d3sa-rv 5s ease-in-out infinite}
.w3d3sa-gl{animation:w3d3sa-gl 5s ease-in-out infinite}
@keyframes w3d3sa-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3sa-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
