<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="Online communication at university: a laptop shows a discussion board thread with polite replies; an email to a lecturer flies out with a paper plane trail; four coloured comment bubbles — suggest, disagree, clarify, praise — float beside a shared document; two students wave from video tiles.">
<title>Online communication at university: a laptop shows a discussion board thread with polite replies; an email to a lecturer flies out with a paper plane trail; four coloured comment bubbles — suggest, disagree, clarify, praise — float beside a shared document; two students wave from video tiles.</title>
<style>
