<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A STAR moment: under a big golden star with turning rays, a student holds up a card with her top two learning needs; the teacher listens with a notebook, and a vote board shows the class choosing what to practise.">
<title>A STAR moment: under a big golden star with turning rays, a student holds up a card with her top two learning needs; the teacher listens with a notebook, and a vote board shows the class choosing what to practise.</title>
<style>
