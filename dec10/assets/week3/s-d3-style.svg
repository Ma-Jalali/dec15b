="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#c4562f" text-anchor="middle">figure out</text></g><g class="w3d3st-f3"><g filter="url(#w3d3st-sm)"><rect x="330" y="82" width="96" height="26" rx="13" fill="#fff" stroke="none" stroke-width="0"/></g><text x="378" y="98.9" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#2f7d6b" text-anchor="middle">determine</text></g><path class="w3d3st-tw " d="M410 12Q411.44 18.56 418 20Q411.44 21.44 410 28Q408.56 21.44 402 20Q408.56 18.56 410 12Z" fill="#f2c14e"/><path class="w3d3st-tw w3d3st-t2" d="M24 18Q25.08 22.92 30 24Q25.08 25.08 24 30Q22.92 25.08 18 24Q22.92 22.92 24 18Z" fill="#f3b8a0"/><path class="w3d3st-tw w3d3st-t3" d="M200 230Q201.08 234.92 206 236Q201.08 237.08 200 242Q198.92 237.08 194 236Q198.92 234.92 200 230Z" fill="#f2c14e"/>
