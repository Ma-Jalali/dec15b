<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="Academic style: on a desk, a messy draft with orange marks passes under a magic highlighter and comes out as a neat academic paragraph with a gold star; above, a register slider moves from informal (“gonna”, “figure out”) to formal (“determine”, “it is likely that”).">
<title>Academic style: on a desk, a messy draft with orange marks passes under a magic highlighter and comes out as a neat academic paragraph with a gold star; above, a register slider moves from informal (“gonna”, “figure out”) to formal (“determine”, “it is likely that”).</title>
<style>
.w3d3st-fl{animation:w3d3st-fl 6s ease-in-out infinite}.w3d3st-f2{animation:w3d3st-fl 7s ease-in-out -2.5s infinite}.w3d3st-f3{animation:w3d3st-fl 5.5s ease-in-out -4s infinite}
.w3d3st-tw{animation:w3d3st-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3st-t2{animation-delay:-1.1s}.w3d3st-t3{animation-delay:-2.2s}
.w3d3st-bl{animation:w3d3st-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3st-b2{animation-delay:-1.7s}.w3d3st-b3{animation-delay:-3.1s}
.w3d3st-pu{animation:w3d3st-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3st-p2{animation-delay:-1.6s}
.w3d3st-dr{stroke-dasharray:6 8;animation:w3d3st-dr 1.8s linear infinite}
.w3d3st-sp{animation:w3d3st-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3st-ca{animation:w3d3st-ca 1.1s steps(1) infinite}
.w3d3st-sw{animation:w3d3st-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3st-wv{animation:w3d3st-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3st-w2{animation-delay:.85s}.w3d3st-w3{animation-delay:1.7s}
.w3d3st-rv{animation:w3d3st-rv 5s ease-in-out infinite}
.w3d3st-gl{animation:w3d3st-gl 5s ease-in-out infinite}
@keyframes w3d3st-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3st-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3st-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d3st-pu{0%,100%{transform:scale(1)}20%{transform:scale(1.08)}40%{transform:scale(1)}}
@keyframes w3d3st-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3st-sp{to{transform:rotate(360deg)}}
@keyframes w3d3st-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3st-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3st-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3st-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3st-gl{0%,100%{opacity:.55}50%{opacity:1}}
.w3d3st-kn{animation:w3d3st-kn 6s ease-in-out infinite}@keyframes w3d3st-kn{0%,100%{transform:translateX(-140px)}50%{transform:translateX(90px)}}.w3d3st-hl{animation:w3d3st-hl 4s ease-in-out infinite}@keyframes w3d3st-hl{0%,100%{transform:translate(0,0) }50%{transform:translate(0,-8px) }}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d3st-wv{opacity:.8}.w3d3st-rv{opacity:1}}
</style>
