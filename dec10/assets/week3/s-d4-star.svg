@keyframes w3d4sd4star-sp{to{transform:rotate(360deg)}}
@keyframes w3d4sd4star-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4sd4star-rv{from{transform:translateY(8px)}to{transform:none}}
