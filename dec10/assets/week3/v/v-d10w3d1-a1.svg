.w3d1a1-ri{animation:w3d1a1-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1a1-r2{animation-delay:-1.7s}.w3d1a1-r3{animation-delay:-3.4s}
.w3d1a1-dw{stroke-dasharray:400;animation:w3d1a1-dw 6s ease-in-out infinite}
@keyframes w3d1a1-fl{50%{transform:translateY(-4px)}}
@keyframes w3d1a1-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
