<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Five colourful definition cards fanned out, with an arrow to a leaf in a circle: what do they have in common?">
<title>Warmer: definitions of green jobs</title>
<style>
.w3d1a1-fl{animation:w3d1a1-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1a1-f2{animation-delay:-2s}.w3d1a1-f3{animation-delay:-4s}
