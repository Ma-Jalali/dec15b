.w3d1a1-sp{animation:w3d1a1-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1a1-slow{animation-duration:14s}
.w3d1a1-pu{animation:w3d1a1-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1a1-p2{animation-delay:-1.2s}
