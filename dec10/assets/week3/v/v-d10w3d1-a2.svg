<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Three key terms — Greening, Green ES, Career changer — joined by dotted lines to definition cards">
<title>Match the key terms</title>
<style>
.w3d1a2-fl{animation:w3d1a2-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1a2-f2{animation-delay:-2s}.w3d1a2-f3{animation-delay:-4s}
