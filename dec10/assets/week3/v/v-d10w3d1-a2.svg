.w3d1a2-ri{animation:w3d1a2-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1a2-r2{animation-delay:-1.7s}.w3d1a2-r3{animation-delay:-3.4s}
