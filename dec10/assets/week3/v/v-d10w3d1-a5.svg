<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Three jigsaw pieces numbered 1, 2 and 3 above a notes page: each group reads one part of the text">
<title>Jigsaw reading and note taking</title>
<style>
.w3d1a5-fl{animation:w3d1a5-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1a5-f2{animation-delay:-2s}.w3d1a5-f3{animation-delay:-4s}
.w3d1a5-tw{animation:w3d1a5-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1a5-t2{animation-delay:-1s}.w3d1a5-t3{animation-delay:-2s}
.w3d1a5-sp{animation:w3d1a5-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1a5-slow{animation-duration:14s}
.w3d1a5-pu{animation:w3d1a5-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1a5-p2{animation-delay:-1.2s}
.w3d1a5-dr{stroke-dasharray:6 7;animation:w3d1a5-dr 1.5s linear infinite}
.w3d1a5-bl{animation:w3d1a5-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1a5-b2{animation-delay:-1.7s}.w3d1a5-b3{animation-delay:-3.1s}
.w3d1a5-sw{animation:w3d1a5-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1a5-ri{animation:w3d1a5-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1a5-r2{animation-delay:-1.7s}.w3d1a5-r3{animation-delay:-3.4s}
.w3d1a5-dw{stroke-dasharray:400;animation:w3d1a5-dw 6s ease-in-out infinite}
@keyframes w3d1a5-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes w3d1a5-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1a5-sp{to{transform:rotate(360deg)}}
@keyframes w3d1a5-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1a5-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1a5-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1a5-sw{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes w3d1a5-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1a5-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="w3d1a5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecf7f2"/><stop offset="1" stop-color="#cfe6dc"/></linearGradient>
<pattern id="w3d1a5-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#13887a" fill-opacity=".14"/></pattern>
<linearGradient id="w3d1a5-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d1a5-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ccbb9"/><stop offset="1" stop-color="#13887a"/></linearGradient>
<linearGradient id="w3d1a5-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfeaf2"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
<linearGradient id="w3d1a5-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd27f"/><stop offset="1" stop-color="#3f7a3a"/></linearGradient>
<linearGradient id="w3d1a5-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d77c9"/><stop offset="1" stop-color="#1f3a78"/></linearGradient>
<linearGradient id="w3d1a5-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf62"/><stop offset="1" stop-color="#d99a2b"/></linearGradient>
<radialGradient id="w3d1a5-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<radialGradient id="w3d1a5-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w3d1a5-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".1"/></filter>
