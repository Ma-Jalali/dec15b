<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two emails to Matt: Jamie’s red one says always… never…, Sam’s green one follows Observation, Feeling, Need, Request">
<title>Two messages to Matt</title>
<style>
