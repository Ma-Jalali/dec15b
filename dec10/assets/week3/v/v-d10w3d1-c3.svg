.w3d1c3-ri{animation:w3d1c3-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1c3-r2{animation-delay:-1.7s}.w3d1c3-r3{animation-delay:-3.4s}
.w3d1c3-dw{stroke-dasharray:400;animation:w3d1c3-dw 6s ease-in-out infinite}
