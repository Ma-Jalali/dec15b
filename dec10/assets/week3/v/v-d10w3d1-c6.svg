<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A five-level pyramid of needs with a growing leaf on top and need words floating around: support, respect, stability">
<title>Expressing our needs</title>
<style>
.w3d1c6-fl{animation:w3d1c6-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1c6-f2{animation-delay:-2s}.w3d1c6-f3{animation-delay:-4s}
.w3d1c6-tw{animation:w3d1c6-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1c6-t2{animation-delay:-1s}.w3d1c6-t3{animation-delay:-2s}
.w3d1c6-sp{animation:w3d1c6-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1c6-slow{animation-duration:14s}
.w3d1c6-pu{animation:w3d1c6-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1c6-p2{animation-delay:-1.2s}
.w3d1c6-dr{stroke-dasharray:6 7;animation:w3d1c6-dr 1.5s linear infinite}
.w3d1c6-bl{animation:w3d1c6-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1c6-b2{animation-delay:-1.7s}.w3d1c6-b3{animation-delay:-3.1s}
.w3d1c6-sw{animation:w3d1c6-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1c6-ri{animation:w3d1c6-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1c6-r2{animation-delay:-1.7s}.w3d1c6-r3{animation-delay:-3.4s}
.w3d1c6-dw{stroke-dasharray:400;animation:w3d1c6-dw 6s ease-in-out infinite}
@keyframes w3d1c6-fl{50%{transform:translateY(-4px)}}
@keyframes w3d1c6-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1c6-sp{to{transform:rotate(360deg)}}
@keyframes w3d1c6-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1c6-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1c6-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1c6-sw{50%{transform:rotate(5deg)}}
@keyframes w3d1c6-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1c6-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
