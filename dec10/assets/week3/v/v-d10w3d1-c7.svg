.w3d1c7-ri{animation:w3d1c7-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1c7-r2{animation-delay:-1.7s}.w3d1c7-r3{animation-delay:-3.4s}
