<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A week calendar: Monday research, Tuesday share, Thursday and Friday present">
<title>Review the task details</title>
<style>
.w3d1h1-fl{animation:w3d1h1-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1h1-f2{animation-delay:-2s}.w3d1h1-f3{animation-delay:-4s}
.w3d1h1-tw{animation:w3d1h1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1h1-t2{animation-delay:-1s}.w3d1h1-t3{animation-delay:-2s}
.w3d1h1-sp{animation:w3d1h1-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1h1-slow{animation-duration:14s}
.w3d1h1-pu{animation:w3d1h1-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1h1-p2{animation-delay:-1.2s}
.w3d1h1-dr{stroke-dasharray:6 7;animation:w3d1h1-dr 1.5s linear infinite}
.w3d1h1-bl{animation:w3d1h1-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1h1-b2{animation-delay:-1.7s}.w3d1h1-b3{animation-delay:-3.1s}
.w3d1h1-sw{animation:w3d1h1-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1h1-ri{animation:w3d1h1-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1h1-r2{animation-delay:-1.7s}.w3d1h1-r3{animation-delay:-3.4s}
.w3d1h1-dw{stroke-dasharray:400;animation:w3d1h1-dw 6s ease-in-out infinite}
@keyframes w3d1h1-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes w3d1h1-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1h1-sp{to{transform:rotate(360deg)}}
@keyframes w3d1h1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1h1-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1h1-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1h1-sw{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes w3d1h1-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1h1-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="w3d1h1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf6e7"/><stop offset="1" stop-color="#f5e1b8"/></linearGradient>
<pattern id="w3d1h1-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#c98d2c" fill-opacity=".14"/></pattern>
<linearGradient id="w3d1h1-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d1h1-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0c26a"/><stop offset="1" stop-color="#c98d2c"/></linearGradient>
<linearGradient id="w3d1h1-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfeaf2"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
<linearGradient id="w3d1h1-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd27f"/><stop offset="1" stop-color="#3f7a3a"/></linearGradient>
<linearGradient id="w3d1h1-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d77c9"/><stop offset="1" stop-color="#1f3a78"/></linearGradient>
<linearGradient id="w3d1h1-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf62"/><stop offset="1" stop-color="#d99a2b"/></linearGradient>
<radialGradient id="w3d1h1-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<radialGradient id="w3d1h1-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w3d1h1-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w3d1h1-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".16"/></filter>
<marker id="w3d1h1-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#c98d2c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="w3d1h1-an" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#14293a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<path id="w3d1h1-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>

</defs>
<clipPath id="w3d1h1-clip"><rect x="6" y="6" width="228" height="168" rx="26"/></clipPath><rect x="6" y="6" width="228" height="168" rx="26" fill="url(#w3d1h1-bg)"/><rect x="6" y="6" width="228" height="168" rx="26" fill="url(#w3d1h1-dots)"/><g clip-path="url(#w3d1h1-clip)"><circle cx="210" cy="30" r="46" fill="#c98d2c" opacity=".08"/><circle cx="26" cy="156" r="38" fill="#2b776e" opacity=".12"/><path d="M6 140c50-12 110-10 160 0s40 6 68-6v40H6z" fill="#c98d2c" opacity=".07"/></g><g filter="url(#w3d1h1-sh)"><rect x="26" y="34" width="188" height="110" rx="12" fill="#fff"/></g><rect x="26" y="34" width="188" height="26" rx="12" fill="#c98d2c"/><rect x="26" y="50" width="188" height="10" fill="#c98d2c"/><circle cx="60" cy="34" r="4" fill="#fff"/><circle cx="180" cy="34" r="4" fill="#fff"/><text x="52" y="80" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#14293a" text-anchor="middle">Mon</text><circle cx="52" cy="104" r="12" fill="#3f7a3a" opacity="1"/><text x="86" y="80" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#14293a" text-anchor="middle">Tue</text><circle cx="86" cy="104" r="12" fill="#13887a" opacity="1"/><text x="120" y="80" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#14293a" text-anchor="middle">Wed</text><circle cx="120" cy="104" r="12" fill="#c9d3dd" opacity="0.35"/><text x="154" y="80" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#14293a" text-anchor="middle">Thu</text><circle cx="154" cy="104" r="12" fill="#7a4a8c" opacity="1"/><text x="188" y="80" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#14293a" text-anchor="middle">Fri</text><circle cx="188" cy="104" r="12" fill="#7a4a8c" opacity="1"/><g class="w3d1h1-pu"><circle cx="52" cy="104" r="16" fill="none" stroke="#e3a843" stroke-width="3"/></g><g transform="translate(52 104)"><g><g transform="translate(0 0) scale(0.4)"><circle r="14" fill="#fff" fill-opacity=".35" stroke="#14293a" stroke-width="4"/><path d="M10 10l13 13" stroke="#14293a" stroke-width="6" stroke-linecap="round"/><path d="M-7-6a9 9 0 0 1 8-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g></g></g><text x="86" y="108" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="154" y="108" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">★</text><text x="188" y="108" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">★</text><text x="120" y="132" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#985c0e" text-anchor="middle">research → share → present</text><g transform="translate(214 24) scale(0.8)"><use href="#w3d1h1-st" class="w3d1h1-tw" fill="#e3a843"/></g>
</svg>
