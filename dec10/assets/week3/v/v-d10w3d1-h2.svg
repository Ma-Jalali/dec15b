<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A laptop with search results, a magnifying glass, a 30-minute clock and a notes page">
<title>Research and take notes</title>
<style>
.w3d1h2-fl{animation:w3d1h2-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1h2-f2{animation-delay:-2s}.w3d1h2-f3{animation-delay:-4s}
.w3d1h2-tw{animation:w3d1h2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1h2-t2{animation-delay:-1s}.w3d1h2-t3{animation-delay:-2s}
.w3d1h2-sp{animation:w3d1h2-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1h2-slow{animation-duration:14s}
.w3d1h2-pu{animation:w3d1h2-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1h2-p2{animation-delay:-1.2s}
.w3d1h2-dr{stroke-dasharray:6 7;animation:w3d1h2-dr 1.5s linear infinite}
.w3d1h2-bl{animation:w3d1h2-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1h2-b2{animation-delay:-1.7s}.w3d1h2-b3{animation-delay:-3.1s}
.w3d1h2-sw{animation:w3d1h2-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1h2-ri{animation:w3d1h2-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1h2-r2{animation-delay:-1.7s}.w3d1h2-r3{animation-delay:-3.4s}
.w3d1h2-dw{stroke-dasharray:400;animation:w3d1h2-dw 6s ease-in-out infinite}
@keyframes w3d1h2-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes w3d1h2-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1h2-sp{to{transform:rotate(360deg)}}
@keyframes w3d1h2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1h2-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1h2-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1h2-sw{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@keyframes w3d1h2-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1h2-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="w3d1h2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf6e7"/><stop offset="1" stop-color="#f5e1b8"/></linearGradient>
<pattern id="w3d1h2-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#c98d2c" fill-opacity=".14"/></pattern>
<linearGradient id="w3d1h2-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d1h2-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0c26a"/><stop offset="1" stop-color="#c98d2c"/></linearGradient>
<linearGradient id="w3d1h2-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfeaf2"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
<linearGradient id="w3d1h2-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd27f"/><stop offset="1" stop-color="#3f7a3a"/></linearGradient>
<linearGradient id="w3d1h2-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d77c9"/><stop offset="1" stop-color="#1f3a78"/></linearGradient>
<linearGradient id="w3d1h2-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf62"/><stop offset="1" stop-color="#d99a2b"/></linearGradient>
<radialGradient id="w3d1h2-gs" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14293a" stop-opacity=".22"/><stop offset="1" stop-color="#14293a" stop-opacity="0"/></radialGradient>
<radialGradient id="w3d1h2-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w3d1h2-sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".18"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w3d1h2-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".16"/></filter>
<marker id="w3d1h2-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#c98d2c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="w3d1h2-an" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#14293a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<path id="w3d1h2-st" d="M0-6C.8-1.5 1.5-.8 6 0 1.5.8.8 1.5 0 6-.8 1.5-1.5.8-6 0-1.5-.8-.8-1.5 0-6z"/>

</defs>
<clipPath id="w3d1h2-clip"><rect x="6" y="6" width="228" height="168" rx="26"/></clipPath><rect x="6" y="6" width="228" height="168" rx="26" fill="url(#w3d1h2-bg)"/><rect x="6" y="6" width="228" height="168" rx="26" fill="url(#w3d1h2-dots)"/><g clip-path="url(#w3d1h2-clip)"><circle cx="210" cy="30" r="46" fill="#c98d2c" opacity=".08"/><circle cx="26" cy="156" r="38" fill="#2b776e" opacity=".12"/><path d="M6 140c50-12 110-10 160 0s40 6 68-6v40H6z" fill="#c98d2c" opacity=".07"/></g><g transform="translate(92 120) scale(1.25)" filter="url(#w3d1h2-sh2)"><rect x="-40" y="-52" width="80" height="52" rx="5" fill="#2a4458"/><rect x="-35" y="-47" width="70" height="42" rx="2" fill="#fdf6e7"/><rect x="-30" y="-42" width="60" height="9" rx="4.5" fill="#fff" stroke="#c98d2c"/><rect x="-26" y="-39" width="30" height="3" rx="1.5" fill="#c9d3dd"/><rect x="-30" y="-28" width="44" height="3" rx="1.5" fill="#3a58a0"/><rect x="-30" y="-22" width="54" height="3" rx="1.5" fill="#c9d3dd"/><rect x="-30" y="-16" width="40" height="3" rx="1.5" fill="#3a58a0"/><rect x="-30" y="-10" width="50" height="3" rx="1.5" fill="#c9d3dd"/><path d="M-50 0h100l-8 8h-84z" fill="#c9d3dd"/></g><g class="w3d1h2-fl"><g transform="translate(152 74) scale(0.9)"><circle r="14" fill="#fff" fill-opacity=".35" stroke="#14293a" stroke-width="4"/><path d="M10 10l13 13" stroke="#14293a" stroke-width="6" stroke-linecap="round"/><path d="M-7-6a9 9 0 0 1 8-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g></g><g transform="translate(196 40)" filter="url(#w3d1h2-sh2)"><circle r="18" fill="#fff" stroke="#c98d2c" stroke-width="3"/><path d="M0 0V-11.16" stroke="#14293a" stroke-width="2" stroke-linecap="round"/><g class="w3d1h2-sp"><path d="M0 0L9.0 5.3999999999999995" stroke="#c98d2c" stroke-width="2" stroke-linecap="round"/></g><circle r="2" fill="#14293a"/></g><text x="196" y="72" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#985c0e" text-anchor="middle">30 min</text><g class="w3d1h2-fl w3d1h2-f2"><g transform="rotate(0 195.0 127.0)" filter="url(#w3d1h2-sh2)"><rect x="172" y="98" width="46" height="58" rx="5" fill="#fff"/><rect x="180" y="110.0" width="30" height="3" rx="1.5" fill="#c9d3dd"/><rect x="179" y="108.0" width="18.0" height="7" rx="2" fill="#f0c26a" opacity=".55"/><rect x="180" y="119.5" width="22" height="3" rx="1.5" fill="#c9d3dd"/><rect x="180" y="129.0" width="14" height="3" rx="1.5" fill="#c9d3dd"/><rect x="180" y="138.5" width="30" height="3" rx="1.5" fill="#c9d3dd"/></g></g><g class="w3d1h2-sw"><g transform="translate(34 40) rotate(-20) scale(0.8)"><path d="M0 0C-14-6-18-22-10-34 2-28 10-16 0 0z" fill="url(#w3d1h2-leaf)"/><path d="M0 0C-4-10-6-20-10-32" stroke="#e8f5df" stroke-width="1.3" stroke-linecap="round" opacity=".8"/></g></g>
</svg>
