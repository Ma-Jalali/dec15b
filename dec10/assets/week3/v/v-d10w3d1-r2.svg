<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A colourful spinning wheel marked 2040 next to a wind turbine, a solar panel and a leaf: jobs of the future">
<title>Spin a job of the future</title>
<style>
.w3d1r2-fl{animation:w3d1r2-fl 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1r2-f2{animation-delay:-2s}.w3d1r2-f3{animation-delay:-4s}
.w3d1r2-tw{animation:w3d1r2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1r2-t2{animation-delay:-1s}.w3d1r2-t3{animation-delay:-2s}
.w3d1r2-sp{animation:w3d1r2-sp 7s linear infinite;transform-box:fill-box;transform-origin:center}.w3d1r2-slow{animation-duration:14s}
.w3d1r2-pu{animation:w3d1r2-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1r2-p2{animation-delay:-1.2s}
.w3d1r2-dr{stroke-dasharray:6 7;animation:w3d1r2-dr 1.5s linear infinite}
.w3d1r2-bl{animation:w3d1r2-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w3d1r2-b2{animation-delay:-1.7s}.w3d1r2-b3{animation-delay:-3.1s}
.w3d1r2-sw{animation:w3d1r2-sw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.w3d1r2-ri{animation:w3d1r2-ri 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d1r2-r2{animation-delay:-1.7s}.w3d1r2-r3{animation-delay:-3.4s}
.w3d1r2-dw{stroke-dasharray:400;animation:w3d1r2-dw 6s ease-in-out infinite}
@keyframes w3d1r2-fl{50%{transform:translateY(-4px)}}
@keyframes w3d1r2-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w3d1r2-sp{to{transform:rotate(360deg)}}
@keyframes w3d1r2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w3d1r2-dr{to{stroke-dashoffset:-26}}
@keyframes w3d1r2-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d1r2-sw{50%{transform:rotate(5deg)}}
@keyframes w3d1r2-ri{0%{opacity:0;transform:translateY(10px)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes w3d1r2-dw{0%{stroke-dashoffset:400}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
