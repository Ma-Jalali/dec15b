<linearGradient id="w3d1r2-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfeaf2"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
<linearGradient id="w3d1r2-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd27f"/><stop offset="1" stop-color="#3f7a3a"/></linearGradient>
<linearGradient id="w3d1r2-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d77c9"/><stop offset="1" stop-color="#1f3a78"/></linearGradient>
<linearGradient id="w3d1r2-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf62"/><stop offset="1" stop-color="#d99a2b"/></linearGradient>
