<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A spinner wheel with coloured question segments beside a student with curly hair who talks about her research, holding up a source card under a magnifying glass; a one-minute timer and sparkles.">
