<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A student with a bob haircut looks up from short speaking notes: a card shows key words and arrows instead of full sentences; a crossed-out script page lies behind it.">
