.w32a5-bob{animation:w32a5-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32a5-dw{stroke-dasharray:420;stroke-dashoffset:420;animation:w32a5-dw 7s ease-in-out infinite}
