<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Four separate summary cards slide into two big boxes labelled C for causes and E for effects, with arrows grouping similar ideas together.">
<title>Group the ideas into causes and effects — don’t just list them</title>
<style>
