<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A row of green job icons from simple to high-tech — a water drop, a recycling sign, a solar panel, a leaf, a battery and an electric car — on a rising arrow, with a student counting jobs on her fingers.">
<title>Warmer: name green jobs from six areas</title>
<style>
.w32b1-fl{animation:w32b1-fl 6s ease-in-out infinite}.w32b1-f2{animation-delay:-2s}.w32b1-f3{animation-delay:-4s}
.w32b1-tw{animation:w32b1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32b1-t2{animation-delay:-1s}.w32b1-t3{animation-delay:-2s}
.w32b1-bl{animation:w32b1-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32b1-b2{animation-delay:-1.7s}.w32b1-b3{animation-delay:-3.2s}
