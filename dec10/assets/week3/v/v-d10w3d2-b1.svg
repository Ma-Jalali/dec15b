.w32b1-dr{stroke-dasharray:6 8;animation:w32b1-dr 1.6s linear infinite}
.w32b1-wv{animation:w32b1-wv 2.4s ease-out infinite}.w32b1-w2{animation-delay:-.8s}.w32b1-w3{animation-delay:-1.6s}
.w32b1-bob{animation:w32b1-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32b1-dw{stroke-dasharray:420;stroke-dashoffset:0;animation:w32b1-dw 7s ease-in-out infinite}
.w32b1-eq{animation:w32b1-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32b1-e2{animation-delay:-.3s}.w32b1-e3{animation-delay:-.6s}.w32b1-e4{animation-delay:-.85s}
@keyframes w32b1-fl{50%{transform:translateY(-4px)}}
@keyframes w32b1-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32b1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32b1-sp{to{transform:rotate(360deg)}}
@keyframes w32b1-pu{50%{transform:scale(1.07)}}
@keyframes w32b1-dr{to{stroke-dashoffset:-28}}
@keyframes w32b1-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32b1-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32b1-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32b1-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
