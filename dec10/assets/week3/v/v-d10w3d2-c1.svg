<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two flip cards turning over — a question mark on the front and a tick on the back — next to a book and a podcast microphone from earlier in the week.">
<title>Recap: remember the reading and the listening</title>
<style>
.w32c1-fl{animation:w32c1-fl 6s ease-in-out infinite}.w32c1-f2{animation-delay:-2s}.w32c1-f3{animation-delay:-4s}
