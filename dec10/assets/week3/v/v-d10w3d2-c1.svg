@keyframes w32c1-fl{50%{transform:translateY(-4px)}}
@keyframes w32c1-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32c1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32c1-sp{to{transform:rotate(360deg)}}
@keyframes w32c1-pu{50%{transform:scale(1.07)}}
@keyframes w32c1-dr{to{stroke-dashoffset:-28}}
@keyframes w32c1-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32c1-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32c1-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32c1-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
