<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A report titled Green industrial skills is skimmed quickly: a fast-moving eye line sweeps across the page, a stopwatch ticks and two answer options light up.">
<title>Reading for gist: read fast for the big picture</title>
<style>
.w32c3-fl{animation:w32c3-fl 6s ease-in-out infinite}.w32c3-f2{animation-delay:-2s}.w32c3-f3{animation-delay:-4s}
