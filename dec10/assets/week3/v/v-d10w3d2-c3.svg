.w32c3-wv{animation:w32c3-wv 2.4s ease-out infinite}.w32c3-w2{animation-delay:-.8s}.w32c3-w3{animation-delay:-1.6s}
.w32c3-bob{animation:w32c3-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32c3-dw{stroke-dasharray:420;stroke-dashoffset:420;animation:w32c3-dw 7s ease-in-out infinite}
.w32c3-eq{animation:w32c3-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32c3-e2{animation-delay:-.3s}.w32c3-e3{animation-delay:-.6s}.w32c3-e4{animation-delay:-.85s}
@keyframes w32c3-fl{50%{transform:translateY(-4px)}}
@keyframes w32c3-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32c3-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32c3-sp{to{transform:rotate(360deg)}}
@keyframes w32c3-pu{50%{transform:scale(1.07)}}
@keyframes w32c3-dr{to{stroke-dashoffset:-28}}
@keyframes w32c3-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32c3-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32c3-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32c3-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
