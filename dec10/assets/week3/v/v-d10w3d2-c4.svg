<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A note-taking matrix with three columns — a book, a podcast microphone and a report — and two rows for green jobs and green skills, with a pencil filling in a cell; matching ideas glow yellow.">
<title>Reading for detail: complete the note-taking matrix</title>
<style>
.w32c4-fl{animation:w32c4-fl 6s ease-in-out infinite}.w32c4-f2{animation-delay:-2s}.w32c4-f3{animation-delay:-4s}
.w32c4-tw{animation:w32c4-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32c4-t2{animation-delay:-1s}.w32c4-t3{animation-delay:-2s}
.w32c4-bl{animation:w32c4-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32c4-b2{animation-delay:-1.7s}.w32c4-b3{animation-delay:-3.2s}
.w32c4-sp{animation:w32c4-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32c4-sr{animation-direction:reverse}
.w32c4-pu{animation:w32c4-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32c4-p2{animation-delay:-1.3s}
.w32c4-dr{stroke-dasharray:6 8;animation:w32c4-dr 1.6s linear infinite}
.w32c4-wv{animation:w32c4-wv 2.4s ease-out infinite}.w32c4-w2{animation-delay:-.8s}.w32c4-w3{animation-delay:-1.6s}
.w32c4-bob{animation:w32c4-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32c4-dw{stroke-dasharray:420;stroke-dashoffset:0;animation:w32c4-dw 7s ease-in-out infinite}
.w32c4-eq{animation:w32c4-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32c4-e2{animation-delay:-.3s}.w32c4-e3{animation-delay:-.6s}.w32c4-e4{animation-delay:-.85s}
@keyframes w32c4-fl{50%{transform:translateY(-4px)}}
@keyframes w32c4-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32c4-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32c4-sp{to{transform:rotate(360deg)}}
@keyframes w32c4-pu{50%{transform:scale(1.07)}}
@keyframes w32c4-dr{to{stroke-dashoffset:-28}}
@keyframes w32c4-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32c4-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32c4-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32c4-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
