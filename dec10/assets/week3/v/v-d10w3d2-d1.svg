<pattern id="w32d1-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#3f7a3a" fill-opacity=".14"/></pattern>
<radialGradient id="w32d1-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w32d1-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w32d1-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w32d1-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="w32d1-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w32d1-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w32d1-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f7a3a" stop-opacity=".85"/><stop offset="1" stop-color="#2a5626"/></linearGradient>
<linearGradient id="w32d1-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc576"/><stop offset="1" stop-color="#2f7d3a"/></linearGradient>
<linearGradient id="w32d1-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d7fc4"/><stop offset=".5" stop-color="#23497e"/><stop offset="1" stop-color="#16325a"/></linearGradient>
<linearGradient id="w32d1-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<linearGradient id="w32d1-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfe6ea"/><stop offset="1" stop-color="#8d9ea9"/></linearGradient>
<linearGradient id="w32d1-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9f4"/><stop offset="1" stop-color="#f4fbf6"/></linearGradient>
</defs>
