/><circle cx="206" cy="48" r="2" fill="#e3a843"/></g><g class="w32d1-fl w32d1-f3"><circle cx="212" cy="96" r="13" fill="#fff" filter="url(#w32d1-sh)"/><path d="M208 100l8-8a3 3 0 0 0-4-4l-9 9a5 5 0 0 0 7 7l7-7" stroke="#2f6db5" stroke-width="1.8" fill="none" stroke-linecap="round"/></g><path class="w32d1-tw w32d1-t1" d="M26 105.5C26.81 109.19 26.81 109.19 30.5 110C26.81 110.81 26.81 110.81 26 114.5C25.19 110.81 25.19 110.81 21.5 110C25.19 109.19 25.19 109.19 26 105.5z" fill="#e3a843"/>
