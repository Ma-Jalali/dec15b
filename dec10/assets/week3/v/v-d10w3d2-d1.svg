<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A laptop shows a Canvas discussion board with a menu, a topic title and a thread of replies; small icons for reply, subscribe and attach float around it.">
<title>Discussion boards in Canvas</title>
<style>
.w32d1-fl{animation:w32d1-fl 6s ease-in-out infinite}.w32d1-f2{animation-delay:-2s}.w32d1-f3{animation-delay:-4s}
.w32d1-tw{animation:w32d1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32d1-t2{animation-delay:-1s}.w32d1-t3{animation-delay:-2s}
.w32d1-bl{animation:w32d1-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32d1-b2{animation-delay:-1.7s}.w32d1-b3{animation-delay:-3.2s}
.w32d1-sp{animation:w32d1-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32d1-sr{animation-direction:reverse}
.w32d1-pu{animation:w32d1-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32d1-p2{animation-delay:-1.3s}
.w32d1-dr{stroke-dasharray:6 8;animation:w32d1-dr 1.6s linear infinite}
.w32d1-wv{animation:w32d1-wv 2.4s ease-out infinite}.w32d1-w2{animation-delay:-.8s}.w32d1-w3{animation-delay:-1.6s}
.w32d1-bob{animation:w32d1-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32d1-dw{stroke-dasharray:420;stroke-dashoffset:0;animation:w32d1-dw 7s ease-in-out infinite}
.w32d1-eq{animation:w32d1-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32d1-e2{animation-delay:-.3s}.w32d1-e3{animation-delay:-.6s}.w32d1-e4{animation-delay:-.85s}
@keyframes w32d1-fl{50%{transform:translateY(-4px)}}
@keyframes w32d1-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32d1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32d1-sp{to{transform:rotate(360deg)}}
@keyframes w32d1-pu{50%{transform:scale(1.07)}}
@keyframes w32d1-dr{to{stroke-dashoffset:-28}}
@keyframes w32d1-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32d1-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32d1-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32d1-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
