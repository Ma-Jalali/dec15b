<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Three reply cards on a discussion thread: the first has a green tick and a polite smile, the second a red cross and an angry storm cloud, the third a yellow question mark because it has no opinion.">
<title>Discussion netiquette: polite or not?</title>
<style>
.w32d2-fl{animation:w32d2-fl 6s ease-in-out infinite}.w32d2-f2{animation-delay:-2s}.w32d2-f3{animation-delay:-4s}
.w32d2-tw{animation:w32d2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32d2-t2{animation-delay:-1s}.w32d2-t3{animation-delay:-2s}
.w32d2-bl{animation:w32d2-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32d2-b2{animation-delay:-1.7s}.w32d2-b3{animation-delay:-3.2s}
.w32d2-sp{animation:w32d2-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32d2-sr{animation-direction:reverse}
.w32d2-pu{animation:w32d2-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32d2-p2{animation-delay:-1.3s}
.w32d2-dr{stroke-dasharray:6 8;animation:w32d2-dr 1.6s linear infinite}
.w32d2-wv{animation:w32d2-wv 2.4s ease-out infinite}.w32d2-w2{animation-delay:-.8s}.w32d2-w3{animation-delay:-1.6s}
.w32d2-bob{animation:w32d2-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32d2-dw{stroke-dasharray:420;stroke-dashoffset:0;animation:w32d2-dw 7s ease-in-out infinite}
.w32d2-eq{animation:w32d2-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32d2-e2{animation-delay:-.3s}.w32d2-e3{animation-delay:-.6s}.w32d2-e4{animation-delay:-.85s}
@keyframes w32d2-fl{50%{transform:translateY(-4px)}}
@keyframes w32d2-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32d2-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32d2-sp{to{transform:rotate(360deg)}}
@keyframes w32d2-pu{50%{transform:scale(1.07)}}
@keyframes w32d2-dr{to{stroke-dashoffset:-28}}
@keyframes w32d2-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32d2-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32d2-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32d2-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
