0" y="66" width="72" height="26" rx="8" fill="#2f6db5" filter="url(#w32d4-sh)"/><text x="186" y="83" font-family="Manrope, Arial, sans-serif" font-size="7.5" font-weight="800" fill="#fff" text-anchor="middle">Can you clarify?</text></g><g class="w32d4-fl w32d4-f3"><rect x="150" y="102" width="72" height="26" rx="8" fill="#3f7a3a" filter="url(#w32d4-sh)"/><text x="186" y="119" font-family="Manrope, Arial, sans-serif" font-size="8" font-weight="800" fill="#fff" text-anchor="middle">Great idea!</text></g><g class="w32d4-fl"><path d="M110 120l0 14 4-4 4 7 3-1-4-7 6 0z" fill="#e64626" stroke="#fff" stroke-width="1"/></g><g class="w32d4-fl w32d4-f3"><path d="M64 134l0 14 4-4 4 7 3-1-4-7 6 0z" fill="#7a4a8c" stroke="#fff" stroke-width="1"/></g><path class="w32d4-tw w32d4-t2" d="M214 145.5C214.81 149.19 214.81 149.19 218.5 150C214.81 150.81 214.81 150.81 214 154.5C213.19 150.81 213.19 150.81 209.5 150C213.19 149.19 213.19 149.19 214 145.5z" fill="#e3a843"/>
