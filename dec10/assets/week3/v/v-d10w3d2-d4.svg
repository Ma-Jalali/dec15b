<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A shared online document with coloured comment bubbles from three classmates — a suggestion, a question and a thumbs up — and cursors moving across the page.">
<title>Polite language for online group work</title>
<style>
.w32d4-fl{animation:w32d4-fl 6s ease-in-out infinite}.w32d4-f2{animation-delay:-2s}.w32d4-f3{animation-delay:-4s}
.w32d4-tw{animation:w32d4-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32d4-t2{animation-delay:-1s}.w32d4-t3{animation-delay:-2s}
.w32d4-bl{animation:w32d4-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w32d4-b2{animation-delay:-1.7s}.w32d4-b3{animation-delay:-3.2s}
.w32d4-sp{animation:w32d4-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}.w32d4-sr{animation-direction:reverse}
.w32d4-pu{animation:w32d4-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w32d4-p2{animation-delay:-1.3s}
.w32d4-dr{stroke-dasharray:6 8;animation:w32d4-dr 1.6s linear infinite}
.w32d4-wv{animation:w32d4-wv 2.4s ease-out infinite}.w32d4-w2{animation-delay:-.8s}.w32d4-w3{animation-delay:-1.6s}
.w32d4-bob{animation:w32d4-bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w32d4-dw{stroke-dasharray:420;stroke-dashoffset:420;animation:w32d4-dw 7s ease-in-out infinite}
.w32d4-eq{animation:w32d4-eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w32d4-e2{animation-delay:-.3s}.w32d4-e3{animation-delay:-.6s}.w32d4-e4{animation-delay:-.85s}
@keyframes w32d4-fl{50%{transform:translateY(-4px)}}
@keyframes w32d4-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w32d4-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w32d4-sp{to{transform:rotate(360deg)}}
@keyframes w32d4-pu{50%{transform:scale(1.07)}}
@keyframes w32d4-dr{to{stroke-dashoffset:-28}}
@keyframes w32d4-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes w32d4-bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes w32d4-dw{0%{stroke-dashoffset:420}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@keyframes w32d4-eq{50%{transform:scaleY(.45)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
