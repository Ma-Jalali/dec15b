<linearGradient id="w32d4-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w32d4-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w32d4-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f7a3a" stop-opacity=".85"/><stop offset="1" stop-color="#2a5626"/></linearGradient>
<linearGradient id="w32d4-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc576"/><stop offset="1" stop-color="#2f7d3a"/></linearGradient>
<linearGradient id="w32d4-solar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d7fc4"/><stop offset=".5" stop-color="#23497e"/><stop offset="1" stop-color="#16325a"/></linearGradient>
<linearGradient id="w32d4-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<linearGradient id="w32d4-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfe6ea"/><stop offset="1" stop-color="#8d9ea9"/></linearGradient>
