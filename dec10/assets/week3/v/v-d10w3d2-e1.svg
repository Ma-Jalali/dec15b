<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A laptop with the Canvas listening practice: a play button, a sound wave and answer boxes, with headphones resting beside it, a checklist of tactics and a target.">
