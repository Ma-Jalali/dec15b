.w3d3a2-sp{animation:w3d3a2-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3a2-ca{animation:w3d3a2-ca 1.1s steps(1) infinite}
.w3d3a2-sw{animation:w3d3a2-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3a2-wv{animation:w3d3a2-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3a2-w2{animation-delay:.85s}.w3d3a2-w3{animation-delay:1.7s}
.w3d3a2-rv{animation:w3d3a2-rv 5s ease-in-out infinite}
.w3d3a2-gl{animation:w3d3a2-gl 5s ease-in-out infinite}
@keyframes w3d3a2-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3a2-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
