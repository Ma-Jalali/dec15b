<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A shared group document with four coloured comment bubbles in the margin — suggest, disagree, clarify and praise — and two small avatars">
<title>A shared group document with four coloured comment bubbles in the margin — suggest, disagree, clarify and praise — and two small avatars</title>
<style>
.w3d3a2-fl{animation:w3d3a2-fl 6s ease-in-out infinite}.w3d3a2-f2{animation:w3d3a2-fl 7s ease-in-out -2.5s infinite}.w3d3a2-f3{animation:w3d3a2-fl 5.5s ease-in-out -4s infinite}
.w3d3a2-tw{animation:w3d3a2-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3a2-t2{animation-delay:-1.1s}.w3d3a2-t3{animation-delay:-2.2s}
.w3d3a2-bl{animation:w3d3a2-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3a2-b2{animation-delay:-1.7s}.w3d3a2-b3{animation-delay:-3.1s}
.w3d3a2-pu{animation:w3d3a2-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3a2-p2{animation-delay:-1.6s}
