<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A register slider from informal to formal: a chat bubble on the left, an academic journal on the right and a knob sliding towards formal">
<title>A register slider from informal to formal: a chat bubble on the left, an academic journal on the right and a knob sliding towards formal</title>
<style>
.w3d3b1-fl{animation:w3d3b1-fl 6s ease-in-out infinite}.w3d3b1-f2{animation:w3d3b1-fl 7s ease-in-out -2.5s infinite}.w3d3b1-f3{animation:w3d3b1-fl 5.5s ease-in-out -4s infinite}
