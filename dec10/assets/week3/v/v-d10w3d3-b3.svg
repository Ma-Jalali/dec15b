<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A teacher holds a feedback list with ticks; a red pen and a speech bubble say “Good ideas — now make it academic”">
<title>A teacher holds a feedback list with ticks; a red pen and a speech bubble say “Good ideas — now make it academic”</title>
<style>
.w3d3b3-fl{animation:w3d3b3-fl 6s ease-in-out infinite}.w3d3b3-f2{animation:w3d3b3-fl 7s ease-in-out -2.5s infinite}.w3d3b3-f3{animation:w3d3b3-fl 5.5s ease-in-out -4s infinite}
.w3d3b3-tw{animation:w3d3b3-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3b3-t2{animation-delay:-1.1s}.w3d3b3-t3{animation-delay:-2.2s}
.w3d3b3-bl{animation:w3d3b3-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3b3-b2{animation-delay:-1.7s}.w3d3b3-b3{animation-delay:-3.1s}
.w3d3b3-pu{animation:w3d3b3-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3b3-p2{animation-delay:-1.6s}
