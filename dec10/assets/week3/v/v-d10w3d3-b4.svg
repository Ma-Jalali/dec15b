<title>A paragraph with phrases highlighted in four colours and a highlighter pen marking the next one</title>
<style>
.w3d3b4-fl{animation:w3d3b4-fl 6s ease-in-out infinite}.w3d3b4-f2{animation:w3d3b4-fl 7s ease-in-out -2.5s infinite}.w3d3b4-f3{animation:w3d3b4-fl 5.5s ease-in-out -4s infinite}
