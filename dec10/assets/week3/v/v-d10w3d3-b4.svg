.w3d3b4-wv{animation:w3d3b4-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3b4-w2{animation-delay:.85s}.w3d3b4-w3{animation-delay:1.7s}
