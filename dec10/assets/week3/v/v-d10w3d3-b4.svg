.w3d3b4-bl{animation:w3d3b4-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3b4-b2{animation-delay:-1.7s}.w3d3b4-b3{animation-delay:-3.1s}
.w3d3b4-pu{animation:w3d3b4-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3b4-p2{animation-delay:-1.6s}
