<linearGradient id="w3d3b5-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d3b5-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b0512a"/><stop offset="1" stop-color="#8a3c1d"/></linearGradient>
<linearGradient id="w3d3b5-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient>
