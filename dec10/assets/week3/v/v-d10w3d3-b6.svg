<title>A crumpled draft and a shining edited version side by side, with a gold star on the edited one</title>
<style>
.w3d3b6-fl{animation:w3d3b6-fl 6s ease-in-out infinite}.w3d3b6-f2{animation:w3d3b6-fl 7s ease-in-out -2.5s infinite}.w3d3b6-f3{animation:w3d3b6-fl 5.5s ease-in-out -4s infinite}
.w3d3b6-tw{animation:w3d3b6-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3b6-t2{animation-delay:-1.1s}.w3d3b6-t3{animation-delay:-2.2s}
