<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Eleven short bars flow through a funnel and come out as seven longer, joined bars — sentences combined">
<title>Eleven short bars flow through a funnel and come out as seven longer, joined bars — sentences combined</title>
<style>
.w3d3b7-fl{animation:w3d3b7-fl 6s ease-in-out infinite}.w3d3b7-f2{animation:w3d3b7-fl 7s ease-in-out -2.5s infinite}.w3d3b7-f3{animation:w3d3b7-fl 5.5s ease-in-out -4s infinite}
