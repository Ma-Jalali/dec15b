@keyframes w3d3b7-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3b7-sp{to{transform:rotate(360deg)}}
@keyframes w3d3b7-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3b7-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3b7-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3b7-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3b7-gl{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d3b7-wv{opacity:.8}.w3d3b7-rv{opacity:1}}
</style>
