<title>A student writes at a laptop; coloured lights above the screen turn on one by one as she uses academic features</title>
<style>
.w3d3b8-fl{animation:w3d3b8-fl 6s ease-in-out infinite}.w3d3b8-f2{animation:w3d3b8-fl 7s ease-in-out -2.5s infinite}.w3d3b8-f3{animation:w3d3b8-fl 5.5s ease-in-out -4s infinite}
.w3d3b8-tw{animation:w3d3b8-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3b8-t2{animation-delay:-1.1s}.w3d3b8-t3{animation-delay:-2.2s}
.w3d3b8-bl{animation:w3d3b8-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3b8-b2{animation-delay:-1.7s}.w3d3b8-b3{animation-delay:-3.1s}
.w3d3b8-pu{animation:w3d3b8-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3b8-p2{animation-delay:-1.6s}
