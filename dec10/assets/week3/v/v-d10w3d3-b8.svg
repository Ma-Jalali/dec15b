@keyframes w3d3b8-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3b8-sp{to{transform:rotate(360deg)}}
@keyframes w3d3b8-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3b8-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3b8-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3b8-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3b8-gl{0%,100%{opacity:.55}50%{opacity:1}}
.w3d3b8-li{animation:w3d3b8-li 4s ease-in-out infinite;opacity:.25}@keyframes w3d3b8-li{0%,10%{opacity:.25}25%,85%{opacity:1}100%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d3b8-wv{opacity:.8}.w3d3b8-rv{opacity:1}}
</style>
