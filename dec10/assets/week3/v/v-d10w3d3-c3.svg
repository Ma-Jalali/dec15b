@keyframes w3d3c3-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3c3-gl{0%,100%{opacity:.55}50%{opacity:1}}

