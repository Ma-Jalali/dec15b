<style>
.w3d3c3-fl{animation:w3d3c3-fl 6s ease-in-out infinite}.w3d3c3-f2{animation:w3d3c3-fl 7s ease-in-out -2.5s infinite}.w3d3c3-f3{animation:w3d3c3-fl 5.5s ease-in-out -4s infinite}
