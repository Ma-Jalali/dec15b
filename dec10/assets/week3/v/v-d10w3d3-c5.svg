<title>Group 2 presents their country: a globe with a location pin, a wind turbine and a solar panel for green jobs</title>
<style>
.w3d3c5-fl{animation:w3d3c5-fl 6s ease-in-out infinite}.w3d3c5-f2{animation:w3d3c5-fl 7s ease-in-out -2.5s infinite}.w3d3c5-f3{animation:w3d3c5-fl 5.5s ease-in-out -4s infinite}
.w3d3c5-tw{animation:w3d3c5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3c5-t2{animation-delay:-1.1s}.w3d3c5-t3{animation-delay:-2.2s}
