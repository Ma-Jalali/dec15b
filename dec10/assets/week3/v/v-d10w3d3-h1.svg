.w3d3h1-sp{animation:w3d3h1-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3h1-ca{animation:w3d3h1-ca 1.1s steps(1) infinite}
.w3d3h1-sw{animation:w3d3h1-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3h1-wv{animation:w3d3h1-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3h1-w2{animation-delay:.85s}.w3d3h1-w3{animation-delay:1.7s}
.w3d3h1-rv{animation:w3d3h1-rv 5s ease-in-out infinite}
.w3d3h1-gl{animation:w3d3h1-gl 5s ease-in-out infinite}
@keyframes w3d3h1-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3h1-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
