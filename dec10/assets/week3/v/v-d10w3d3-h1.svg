<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A prompt bubble goes into a glowing brain made of connected dots, which sends out text, an image and sound waves">
<title>A prompt bubble goes into a glowing brain made of connected dots, which sends out text, an image and sound waves</title>
<style>
.w3d3h1-fl{animation:w3d3h1-fl 6s ease-in-out infinite}.w3d3h1-f2{animation:w3d3h1-fl 7s ease-in-out -2.5s infinite}.w3d3h1-f3{animation:w3d3h1-fl 5.5s ease-in-out -4s infinite}
.w3d3h1-tw{animation:w3d3h1-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3h1-t2{animation-delay:-1.1s}.w3d3h1-t3{animation-delay:-2.2s}
