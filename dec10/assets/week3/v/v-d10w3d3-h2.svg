<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two prompts lead to two pictures: a short prompt gives a backpack and a bottle side by side; a detailed prompt gives one backpack with a built-in bottle">
<title>Two prompts lead to two pictures: a short prompt gives a backpack and a bottle side by side; a detailed prompt gives one backpack with a built-in bottle</title>
<style>
.w3d3h2-fl{animation:w3d3h2-fl 6s ease-in-out infinite}.w3d3h2-f2{animation:w3d3h2-fl 7s ease-in-out -2.5s infinite}.w3d3h2-f3{animation:w3d3h2-fl 5.5s ease-in-out -4s infinite}
.w3d3h2-tw{animation:w3d3h2-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3h2-t2{animation-delay:-1.1s}.w3d3h2-t3{animation-delay:-2.2s}
.w3d3h2-bl{animation:w3d3h2-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3h2-b2{animation-delay:-1.7s}.w3d3h2-b3{animation-delay:-3.1s}
.w3d3h2-pu{animation:w3d3h2-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3h2-p2{animation-delay:-1.6s}
.w3d3h2-dr{stroke-dasharray:6 8;animation:w3d3h2-dr 1.8s linear infinite}
.w3d3h2-sp{animation:w3d3h2-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3h2-ca{animation:w3d3h2-ca 1.1s steps(1) infinite}
.w3d3h2-sw{animation:w3d3h2-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3h2-wv{animation:w3d3h2-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3h2-w2{animation-delay:.85s}.w3d3h2-w3{animation-delay:1.7s}
.w3d3h2-rv{animation:w3d3h2-rv 5s ease-in-out infinite}
.w3d3h2-gl{animation:w3d3h2-gl 5s ease-in-out infinite}
@keyframes w3d3h2-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3h2-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
