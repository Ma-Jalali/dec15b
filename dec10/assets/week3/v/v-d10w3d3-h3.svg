xt-anchor="middle">4</text><g class="w3d3h3-pu"><rect x="94" y="72" width="52" height="40" rx="14" fill="url(#w3d3h3-pap)" filter="url(#w3d3h3-sm)"/><path d="M102 84h36" stroke="#a98bbd" stroke-width="3" stroke-linecap="round"/><path d="M102 92h33.1" stroke="#a98bbd" stroke-width="3" stroke-linecap="round"/><path d="M102 100h21.6" stroke="#a98bbd" stroke-width="3" stroke-linecap="round"/></g><path class="w3d3h3-tw " d="M214 24Q215.08 28.92 220 30Q215.08 31.08 214 36Q212.92 31.08 208 30Q212.92 28.92 214 24Z" fill="#f2c14e"/><path class="w3d3h3-tw w3d3h3-t2" d="M26 145Q26.9 149.1 31 150Q26.9 150.9 26 155Q25.1 150.9 21 150Q25.1 149.1 26 145Z" fill="#c7b5f0"/>
