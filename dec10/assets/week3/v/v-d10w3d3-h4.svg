<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A prompt card with four coloured stripes labelled R, T, R and I: role, task, requirements, instructions">
<title>A prompt card with four coloured stripes labelled R, T, R and I: role, task, requirements, instructions</title>
<style>
.w3d3h4-fl{animation:w3d3h4-fl 6s ease-in-out infinite}.w3d3h4-f2{animation:w3d3h4-fl 7s ease-in-out -2.5s infinite}.w3d3h4-f3{animation:w3d3h4-fl 5.5s ease-in-out -4s infinite}
.w3d3h4-tw{animation:w3d3h4-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3h4-t2{animation-delay:-1.1s}.w3d3h4-t3{animation-delay:-2.2s}
.w3d3h4-bl{animation:w3d3h4-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3h4-b2{animation-delay:-1.7s}.w3d3h4-b3{animation-delay:-3.1s}
.w3d3h4-pu{animation:w3d3h4-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3h4-p2{animation-delay:-1.6s}
.w3d3h4-dr{stroke-dasharray:6 8;animation:w3d3h4-dr 1.8s linear infinite}
.w3d3h4-sp{animation:w3d3h4-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3h4-ca{animation:w3d3h4-ca 1.1s steps(1) infinite}
.w3d3h4-sw{animation:w3d3h4-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3h4-wv{animation:w3d3h4-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3h4-w2{animation-delay:.85s}.w3d3h4-w3{animation-delay:1.7s}
.w3d3h4-rv{animation:w3d3h4-rv 5s ease-in-out infinite}
.w3d3h4-gl{animation:w3d3h4-gl 5s ease-in-out infinite}
@keyframes w3d3h4-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3h4-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3h4-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d3h4-pu{0%,100%{transform:scale(1)}20%{transform:scale(1.08)}40%{transform:scale(1)}}
@keyframes w3d3h4-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3h4-sp{to{transform:rotate(360deg)}}
@keyframes w3d3h4-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3h4-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3h4-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3h4-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3h4-gl{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d3h4-wv{opacity:.8}.w3d3h4-rv{opacity:1}}
</style>
