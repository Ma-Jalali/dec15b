<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="The Copilot window with a green shield badge for data protection; a long text becomes three easy bullet points">
<title>The Copilot window with a green shield badge for data protection; a long text becomes three easy bullet points</title>
<style>
.w3d3h6-fl{animation:w3d3h6-fl 6s ease-in-out infinite}.w3d3h6-f2{animation:w3d3h6-fl 7s ease-in-out -2.5s infinite}.w3d3h6-f3{animation:w3d3h6-fl 5.5s ease-in-out -4s infinite}
.w3d3h6-tw{animation:w3d3h6-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3h6-t2{animation-delay:-1.1s}.w3d3h6-t3{animation-delay:-2.2s}
.w3d3h6-bl{animation:w3d3h6-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w3d3h6-b2{animation-delay:-1.7s}.w3d3h6-b3{animation-delay:-3.1s}
.w3d3h6-pu{animation:w3d3h6-pu 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d3h6-p2{animation-delay:-1.6s}
.w3d3h6-dr{stroke-dasharray:6 8;animation:w3d3h6-dr 1.8s linear infinite}
.w3d3h6-sp{animation:w3d3h6-sp 24s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d3h6-ca{animation:w3d3h6-ca 1.1s steps(1) infinite}
.w3d3h6-sw{animation:w3d3h6-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d3h6-wv{animation:w3d3h6-wv 2.6s ease-out infinite;transform-box:fill-box;transform-origin:left center;opacity:0}.w3d3h6-w2{animation-delay:.85s}.w3d3h6-w3{animation-delay:1.7s}
.w3d3h6-rv{animation:w3d3h6-rv 5s ease-in-out infinite}
.w3d3h6-gl{animation:w3d3h6-gl 5s ease-in-out infinite}
@keyframes w3d3h6-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d3h6-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d3h6-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d3h6-pu{0%,100%{transform:scale(1)}20%{transform:scale(1.08)}40%{transform:scale(1)}}
@keyframes w3d3h6-dr{to{stroke-dashoffset:-28}}
@keyframes w3d3h6-sp{to{transform:rotate(360deg)}}
@keyframes w3d3h6-ca{0%,100%{opacity:1}50%{opacity:0}}
@keyframes w3d3h6-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d3h6-wv{0%{opacity:0;transform:translateX(-4px) scale(.7)}30%{opacity:.9}100%{opacity:0;transform:translateX(8px) scale(1.2)}}
@keyframes w3d3h6-rv{0%,15%{opacity:0;transform:translateY(6px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes w3d3h6-gl{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d3h6-wv{opacity:.8}.w3d3h6-rv{opacity:1}}
</style>
<defs>
<linearGradient id="w3d3h6-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f2fa"/><stop offset="1" stop-color="#ece2f3"/></linearGradient>
<pattern id="w3d3h6-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#7a4a8c" fill-opacity=".11"/></pattern>
<radialGradient id="w3d3h6-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w3d3h6-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d3h6-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a8c"/><stop offset="1" stop-color="#5c3569"/></linearGradient>
<linearGradient id="w3d3h6-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient>
<linearGradient id="w3d3h6-scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22384d"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d3h6-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#e0a526"/></linearGradient>
<filter id="w3d3h6-sh" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#14293a" flood-opacity=".13"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w3d3h6-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/></filter>
<filter id="w3d3h6-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<clipPath id="w3d3h6-clip"><path d="M40 16C80 4 166 4 200 22c26 14 32 46 28 76-4 34-22 56-58 64-40 8-98 8-128-6C14 142 8 110 12 80 16 50 18 28 40 16z"/></clipPath>
</defs>
<g clip-path="url(#w3d3h6-clip)"><rect width="240" height="180" fill="url(#w3d3h6-bg)"/><rect width="240" height="180" fill="url(#w3d3h6-dots)"/><circle cx="120" cy="82" r="78" fill="url(#w3d3h6-glow)"/><ellipse cx="200" cy="30" rx="50" ry="36" fill="#ebdff1" opacity=".8" filter="url(#w3d3h6-blur)"/></g>
<path d="M40 16C80 4 166 4 200 22c26 14 32 46 28 76-4 34-22 56-58 64-40 8-98 8-128-6C14 142 8 110 12 80 16 50 18 28 40 16z" stroke="#7a4a8c" stroke-opacity=".18" stroke-width="2"/>
<g filter="url(#w3d3h6-sh)"><rect x="24" y="24" width="192" height="132" rx="14" fill="#fff"/><path d="M24 38q0-14 14-14h164q14 0 14 14v14h-192z" fill="#2d7a9a"/></g><circle cx="40" cy="38" r="3.5" fill="#fff" opacity=".8"/><circle cx="52" cy="38" r="3.5" fill="#fff" opacity=".8"/><circle cx="64" cy="38" r="3.5" fill="#fff" opacity=".8"/><text x="202" y="43" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="end">Copilot</text><g class="w3d3h6-pu"><path d="M190 44c8 0 14-3 14-3v12c0 10-8 15-14 17-6-2-14-7-14-17v-12s6 3 14 3z" fill="#2f9e5f"/><path d="M184 56l4 4 8-8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></g><path d="M36 60h64" stroke="#c9d6dd" stroke-width="3" stroke-linecap="round"/><path d="M36 69h58.9" stroke="#c9d6dd" stroke-width="3" stroke-linecap="round"/><path d="M36 78h62.1" stroke="#c9d6dd" stroke-width="3" stroke-linecap="round"/><path d="M36 87h54.4" stroke="#c9d6dd" stroke-width="3" stroke-linecap="round"/><path d="M36 96h64" stroke="#c9d6dd" stroke-width="3" stroke-linecap="round"/><path d="M36 105h38.4" stroke="#c9d6dd" stroke-width="3" stroke-linecap="round"/><path d="M108 84L123 84" stroke="#2d7a9a" stroke-width="3" stroke-linecap="round" fill="none" class="w3d3h6-dr"/><path d="M128 84L121 87.8L121 80.2Z" fill="#2d7a9a"/><g class="w3d3h6-rv" style="animation-delay:0s"><circle cx="140" cy="74" r="4" fill="#2f7d6b"/><path d="M150 74h48" stroke="#7fb8cc" stroke-width="5" stroke-linecap="round"/></g><g class="w3d3h6-rv" style="animation-delay:0.5s"><circle cx="140" cy="92" r="4" fill="#2f7d6b"/><path d="M150 92h40" stroke="#7fb8cc" stroke-width="5" stroke-linecap="round"/></g><g class="w3d3h6-rv" style="animation-delay:1s"><circle cx="140" cy="110" r="4" fill="#2f7d6b"/><path d="M150 110h32" stroke="#7fb8cc" stroke-width="5" stroke-linecap="round"/></g>
</svg>
