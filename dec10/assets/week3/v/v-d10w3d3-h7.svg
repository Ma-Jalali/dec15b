<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A notebook with three coloured tabs — prompting, Cogniti, Copilot — and a pen writing notes">
<title>A notebook with three coloured tabs — prompting, Cogniti, Copilot — and a pen writing notes</title>
<style>
.w3d3h7-fl{animation:w3d3h7-fl 6s ease-in-out infinite}.w3d3h7-f2{animation:w3d3h7-fl 7s ease-in-out -2.5s infinite}.w3d3h7-f3{animation:w3d3h7-fl 5.5s ease-in-out -4s infinite}
