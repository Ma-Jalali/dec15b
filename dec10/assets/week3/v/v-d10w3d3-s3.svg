<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A student raises a hand and asks “Could you explain … again?”; the teacher answers “Sure!” with a light bulb">
<title>A student raises a hand and asks “Could you explain … again?”; the teacher answers “Sure!” with a light bulb</title>
<style>
.w3d3s3-fl{animation:w3d3s3-fl 6s ease-in-out infinite}.w3d3s3-f2{animation:w3d3s3-fl 7s ease-in-out -2.5s infinite}.w3d3s3-f3{animation:w3d3s3-fl 5.5s ease-in-out -4s infinite}
