<pattern id="w3d3s4-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="#b07d12" fill-opacity=".11"/></pattern>
<radialGradient id="w3d3s4-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w3d3s4-gls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="w3d3s4-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b07d12"/><stop offset="1" stop-color="#87600c"/></linearGradient>
<linearGradient id="w3d3s4-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f4ee"/></linearGradient>
<linearGradient id="w3d3s4-scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22384d"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d3s4-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset="1" stop-color="#e0a526"/></linearGradient>
<filter id="w3d3s4-sh" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#14293a" flood-opacity=".13"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w3d3s4-sm" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".17"/></filter>
<filter id="w3d3s4-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<clipPath id="w3d3s4-clip"><path d="M40 16C80 4 166 4 200 22c26 14 32 46 28 76-4 34-22 56-58 64-40 8-98 8-128-6C14 142 8 110 12 80 16 50 18 28 40 16z"/></clipPath><clipPath id="w3d3s4-r1"><rect x="52" y="58" width="58" height="66" rx="8"/></clipPath><clipPath id="w3d3s4-r2"><rect x="118" y="58" width="58" height="66" rx="8"/></clipPath>
</defs>
<g clip-path="url(#w3d3s4-clip)"><rect width="240" height="180" fill="url(#w3d3s4-bg)"/><rect width="240" height="180" fill="url(#w3d3s4-dots)"/><circle cx="120" cy="82" r="78" fill="url(#w3d3s4-glow)"/><ellipse cx="200" cy="30" rx="50" ry="36" fill="#f8e9c4" opacity=".8" filter="url(#w3d3s4-blur)"/></g>
