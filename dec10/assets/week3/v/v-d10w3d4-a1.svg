.w3d4a1-tw{animation:w3d4a1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4a1-tw2{animation-delay:-1.5s}
.w3d4a1-bl{animation:w3d4a1-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
