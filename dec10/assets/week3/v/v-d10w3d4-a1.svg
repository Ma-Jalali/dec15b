<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A week calendar: Monday and Tuesday are ticked, Thursday is circled with presentations 1, 2 and 3">
<title>A week calendar: Monday and Tuesday are ticked, Thursday is circled with presentations 1, 2 and 3</title>
<style>.w3d4a1-fl{animation:w3d4a1-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
