@keyframes w3d4a2-dr{to{stroke-dashoffset:-26}}
@keyframes w3d4a2-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d4a2-sp{to{transform:rotate(360deg)}}
@keyframes w3d4a2-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4a2-rv{from{transform:translateY(8px)}to{transform:none}}
