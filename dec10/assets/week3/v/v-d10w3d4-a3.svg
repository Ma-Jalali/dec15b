.w3d4a3-tw{animation:w3d4a3-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4a3-tw2{animation-delay:-1.5s}
.w3d4a3-bl{animation:w3d4a3-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4a3-pu{animation:w3d4a3-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4a3-pu2{animation-delay:-1.3s}
