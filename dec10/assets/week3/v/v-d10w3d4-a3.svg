.w3d4a3-sw{animation:w3d4a3-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d4a3-sp{animation:w3d4a3-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d4a3-wv{animation:w3d4a3-wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.w3d4a3-wv2{animation-delay:1.4s}
.w3d4a3-rv{animation:w3d4a3-rv .9s ease-out both}.w3d4a3-d1{animation-delay:.15s}.w3d4a3-d2{animation-delay:.3s}.w3d4a3-d3{animation-delay:.45s}.w3d4a3-d4{animation-delay:.6s}
@keyframes w3d4a3-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d4a3-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
