.w3d4b2-tw{animation:w3d4b2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4b2-tw2{animation-delay:-1.5s}
.w3d4b2-bl{animation:w3d4b2-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4b2-pu{animation:w3d4b2-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4b2-pu2{animation-delay:-1.3s}
