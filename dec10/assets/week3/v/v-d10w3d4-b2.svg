@keyframes w3d4b2-pu{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}}
@keyframes w3d4b2-dr{to{stroke-dashoffset:-26}}
@keyframes w3d4b2-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d4b2-sp{to{transform:rotate(360deg)}}
@keyframes w3d4b2-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4b2-rv{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w3d4b2-rv{opacity:1!important}.w3d4b2-wv{opacity:.5!important}}</style>
