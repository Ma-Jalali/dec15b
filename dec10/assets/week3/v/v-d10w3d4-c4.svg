<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A signed group agreement with four signatures and a stamp">
<title>A signed group agreement with four signatures and a stamp</title>
<style>.w3d4c4-fl{animation:w3d4c4-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
