.w3d4c4-wv{animation:w3d4c4-wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.w3d4c4-wv2{animation-delay:1.4s}
.w3d4c4-rv{animation:w3d4c4-rv .9s ease-out both}.w3d4c4-d1{animation-delay:.15s}.w3d4c4-d2{animation-delay:.3s}.w3d4c4-d3{animation-delay:.45s}.w3d4c4-d4{animation-delay:.6s}
