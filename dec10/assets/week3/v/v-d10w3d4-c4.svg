.w3d4c4-tw{animation:w3d4c4-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4c4-tw2{animation-delay:-1.5s}
.w3d4c4-bl{animation:w3d4c4-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
