<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A friend persuades a student to go to the theatre instead of the cinema">
<title>A friend persuades a student to go to the theatre instead of the cinema</title>
<style>.w3d4d1-fl{animation:w3d4d1-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4d1-fl2{animation:w3d4d1-fl 6.5s ease-in-out -2.5s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d1-tw{animation:w3d4d1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d1-tw2{animation-delay:-1.5s}
.w3d4d1-bl{animation:w3d4d1-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d1-pu{animation:w3d4d1-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d1-pu2{animation-delay:-1.3s}
.w3d4d1-dr{stroke-dasharray:6 7;animation:w3d4d1-dr 1.5s linear infinite}
.w3d4d1-sw{animation:w3d4d1-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d4d1-sp{animation:w3d4d1-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d4d1-wv{animation:w3d4d1-wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.w3d4d1-wv2{animation-delay:1.4s}
.w3d4d1-rv{animation:w3d4d1-rv .9s ease-out both}.w3d4d1-d1{animation-delay:.15s}.w3d4d1-d2{animation-delay:.3s}.w3d4d1-d3{animation-delay:.45s}.w3d4d1-d4{animation-delay:.6s}
@keyframes w3d4d1-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d4d1-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d4d1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d4d1-pu{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}}
@keyframes w3d4d1-dr{to{stroke-dashoffset:-26}}
@keyframes w3d4d1-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d4d1-sp{to{transform:rotate(360deg)}}
@keyframes w3d4d1-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4d1-rv{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w3d4d1-rv{opacity:1!important}.w3d4d1-wv{opacity:.5!important}}</style>
