<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A magnifying glass over a definition card with one word crossed out">
<title>A magnifying glass over a definition card with one word crossed out</title>
<style>.w3d4d2-fl{animation:w3d4d2-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4d2-fl2{animation:w3d4d2-fl 6.5s ease-in-out -2.5s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d2-tw{animation:w3d4d2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d2-tw2{animation-delay:-1.5s}
.w3d4d2-bl{animation:w3d4d2-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4d2-pu{animation:w3d4d2-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4d2-pu2{animation-delay:-1.3s}
.w3d4d2-dr{stroke-dasharray:6 7;animation:w3d4d2-dr 1.5s linear infinite}
.w3d4d2-sw{animation:w3d4d2-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d4d2-sp{animation:w3d4d2-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d4d2-wv{animation:w3d4d2-wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.w3d4d2-wv2{animation-delay:1.4s}
.w3d4d2-rv{animation:w3d4d2-rv .9s ease-out both}.w3d4d2-d1{animation-delay:.15s}.w3d4d2-d2{animation-delay:.3s}.w3d4d2-d3{animation-delay:.45s}.w3d4d2-d4{animation-delay:.6s}
@keyframes w3d4d2-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d4d2-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d4d2-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d4d2-pu{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}}
@keyframes w3d4d2-dr{to{stroke-dashoffset:-26}}
@keyframes w3d4d2-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d4d2-sp{to{transform:rotate(360deg)}}
@keyframes w3d4d2-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4d2-rv{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w3d4d2-rv{opacity:1!important}.w3d4d2-wv{opacity:.5!important}}</style>
