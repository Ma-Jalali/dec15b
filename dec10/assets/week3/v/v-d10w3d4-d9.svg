@keyframes w3d4d9-sp{to{transform:rotate(360deg)}}
@keyframes w3d4d9-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4d9-rv{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w3d4d9-rv{opacity:1!important}.w3d4d9-wv{opacity:.5!important}}</style>
