.w3d4d9-wv{animation:w3d4d9-wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.w3d4d9-wv2{animation-delay:1.4s}
.w3d4d9-rv{animation:w3d4d9-rv .9s ease-out both}.w3d4d9-d1{animation-delay:.15s}.w3d4d9-d2{animation-delay:.3s}.w3d4d9-d3{animation-delay:.45s}.w3d4d9-d4{animation-delay:.6s}
