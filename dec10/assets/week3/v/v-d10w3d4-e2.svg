<linearGradient id="w3d4e2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7f4ea"/><stop offset=".6" stop-color="#fbfaf7"/><stop offset="1" stop-color="#bfe0c8" stop-opacity=".7"/></linearGradient>
<linearGradient id="w3d4e2-ta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fa36d"/><stop offset="1" stop-color="#2f7d4f"/></linearGradient>
<linearGradient id="w3d4e2-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c66a"/><stop offset="1" stop-color="#d1922a"/></linearGradient>
<linearGradient id="w3d4e2-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d4e2-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f4f1ea"/></linearGradient>
<radialGradient id="w3d4e2-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
