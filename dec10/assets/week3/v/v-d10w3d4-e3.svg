<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two ways to use a source: quotation marks for a direct quote, and a speech bubble with new words for a paraphrase">
<title>Two ways to use a source: quotation marks for a direct quote, and a speech bubble with new words for a paraphrase</title>
<style>.w3d4e3-fl{animation:w3d4e3-fl 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w3d4e3-fl2{animation:w3d4e3-fl 6.5s ease-in-out -2.5s infinite;transform-box:fill-box;transform-origin:center}
.w3d4e3-tw{animation:w3d4e3-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4e3-tw2{animation-delay:-1.5s}
.w3d4e3-bl{animation:w3d4e3-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}
.w3d4e3-pu{animation:w3d4e3-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d4e3-pu2{animation-delay:-1.3s}
.w3d4e3-dr{stroke-dasharray:6 7;animation:w3d4e3-dr 1.5s linear infinite}
.w3d4e3-sw{animation:w3d4e3-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w3d4e3-sp{animation:w3d4e3-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d4e3-wv{animation:w3d4e3-wv 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}.w3d4e3-wv2{animation-delay:1.4s}
.w3d4e3-rv{animation:w3d4e3-rv .9s ease-out both}.w3d4e3-d1{animation-delay:.15s}.w3d4e3-d2{animation-delay:.3s}.w3d4e3-d3{animation-delay:.45s}.w3d4e3-d4{animation-delay:.6s}
@keyframes w3d4e3-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w3d4e3-tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d4e3-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d4e3-pu{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}}
@keyframes w3d4e3-dr{to{stroke-dashoffset:-26}}
@keyframes w3d4e3-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w3d4e3-sp{to{transform:rotate(360deg)}}
@keyframes w3d4e3-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.8}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d4e3-rv{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.w3d4e3-rv{opacity:1!important}.w3d4e3-wv{opacity:.5!important}}</style>
<defs>
<filter id="w3d4e3-sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w3d4e3-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="w3d4e3-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<linearGradient id="w3d4e3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7f4ea"/><stop offset=".6" stop-color="#fbfaf7"/><stop offset="1" stop-color="#bfe0c8" stop-opacity=".7"/></linearGradient>
<linearGradient id="w3d4e3-ta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fa36d"/><stop offset="1" stop-color="#2f7d4f"/></linearGradient>
<linearGradient id="w3d4e3-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c66a"/><stop offset="1" stop-color="#d1922a"/></linearGradient>
<linearGradient id="w3d4e3-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w3d4e3-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f4f1ea"/></linearGradient>
<radialGradient id="w3d4e3-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
