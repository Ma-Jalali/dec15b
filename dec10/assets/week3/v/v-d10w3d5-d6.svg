@keyframes w3d5d6-dw{0%{stroke-dashoffset:240}45%,100%{stroke-dashoffset:0}}
@keyframes w3d5d6-rk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

