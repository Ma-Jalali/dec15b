<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Four numbered circles in a cycle: appreciate, judge, manage emotions, take action">
<title>Four numbered circles in a cycle: appreciate, judge, manage emotions, take action</title>
<style>
.w3d5f2-fl{animation:w3d5f2-fl 6s ease-in-out infinite}.w3d5f2-f2{animation-delay:-2s}.w3d5f2-f3{animation-delay:-4s}
.w3d5f2-tw{animation:w3d5f2-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d5f2-t2{animation-delay:-1.1s}.w3d5f2-t3{animation-delay:-2.2s}
.w3d5f2-bl{animation:w3d5f2-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.w3d5f2-b2{animation-delay:-1.7s}.w3d5f2-b3{animation-delay:-3.1s}
.w3d5f2-pu{animation:w3d5f2-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d5f2-p2{animation-delay:-1s}.w3d5f2-p3{animation-delay:-2s}
.w3d5f2-dr{stroke-dasharray:7 9;animation:w3d5f2-dr 2.2s linear infinite}
.w3d5f2-sp{animation:w3d5f2-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d5f2-wv{animation:w3d5f2-wv 2.6s ease-in-out infinite}
.w3d5f2-ha{animation:w3d5f2-ha 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.w3d5f2-h2{animation-delay:-1.5s}
.w3d5f2-dw{stroke-dasharray:240;animation:w3d5f2-dw 5s ease-in-out infinite}
.w3d5f2-rk{animation:w3d5f2-rk 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w3d5f2-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d5f2-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
