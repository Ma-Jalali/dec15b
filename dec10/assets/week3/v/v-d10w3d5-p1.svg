<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A week of calendar cards: Monday, Tuesday, Thursday and Friday, with Friday starred">
<title>A week of calendar cards: Monday, Tuesday, Thursday and Friday, with Friday starred</title>
<style>
.w3d5p1-fl{animation:w3d5p1-fl 6s ease-in-out infinite}.w3d5p1-f2{animation-delay:-2s}.w3d5p1-f3{animation-delay:-4s}
.w3d5p1-tw{animation:w3d5p1-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d5p1-t2{animation-delay:-1.1s}.w3d5p1-t3{animation-delay:-2.2s}
.w3d5p1-bl{animation:w3d5p1-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.w3d5p1-b2{animation-delay:-1.7s}.w3d5p1-b3{animation-delay:-3.1s}
.w3d5p1-pu{animation:w3d5p1-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d5p1-p2{animation-delay:-1s}.w3d5p1-p3{animation-delay:-2s}
.w3d5p1-dr{stroke-dasharray:7 9;animation:w3d5p1-dr 2.2s linear infinite}
.w3d5p1-sp{animation:w3d5p1-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d5p1-wv{animation:w3d5p1-wv 2.6s ease-in-out infinite}
.w3d5p1-ha{animation:w3d5p1-ha 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.w3d5p1-h2{animation-delay:-1.5s}
.w3d5p1-dw{stroke-dasharray:240;animation:w3d5p1-dw 5s ease-in-out infinite}
.w3d5p1-rk{animation:w3d5p1-rk 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w3d5p1-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d5p1-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d5p1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d5p1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w3d5p1-dr{to{stroke-dashoffset:-32}}
@keyframes w3d5p1-sp{to{transform:rotate(360deg)}}
@keyframes w3d5p1-wv{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes w3d5p1-ha{0%{opacity:.55;transform:scale(.85)}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d5p1-dw{0%{stroke-dashoffset:240}45%,100%{stroke-dashoffset:0}}
@keyframes w3d5p1-rk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d5p1-ha{opacity:0}}
</style>
