.w3d5p3-sp{animation:w3d5p3-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d5p3-wv{animation:w3d5p3-wv 2.6s ease-in-out infinite}
.w3d5p3-ha{animation:w3d5p3-ha 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.w3d5p3-h2{animation-delay:-1.5s}
.w3d5p3-dw{stroke-dasharray:240;animation:w3d5p3-dw 5s ease-in-out infinite}
.w3d5p3-rk{animation:w3d5p3-rk 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w3d5p3-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d5p3-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
