<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A question sheet and three question bubbles: clarification, probing and AST">
<title>A question sheet and three question bubbles: clarification, probing and AST</title>
<style>
.w3d5p3-fl{animation:w3d5p3-fl 6s ease-in-out infinite}.w3d5p3-f2{animation-delay:-2s}.w3d5p3-f3{animation-delay:-4s}
.w3d5p3-tw{animation:w3d5p3-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d5p3-t2{animation-delay:-1.1s}.w3d5p3-t3{animation-delay:-2.2s}
.w3d5p3-bl{animation:w3d5p3-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.w3d5p3-b2{animation-delay:-1.7s}.w3d5p3-b3{animation-delay:-3.1s}
