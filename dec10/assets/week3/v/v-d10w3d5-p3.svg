@keyframes w3d5p3-dr{to{stroke-dashoffset:-32}}
@keyframes w3d5p3-sp{to{transform:rotate(360deg)}}
@keyframes w3d5p3-wv{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes w3d5p3-ha{0%{opacity:.55;transform:scale(.85)}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d5p3-dw{0%{stroke-dashoffset:240}45%,100%{stroke-dashoffset:0}}
@keyframes w3d5p3-rk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d5p3-ha{opacity:0}}
</style>
