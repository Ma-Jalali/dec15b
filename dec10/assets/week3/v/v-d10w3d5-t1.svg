.w3d5t1-sp{animation:w3d5t1-sp 9s linear infinite;transform-box:fill-box;transform-origin:center}
.w3d5t1-wv{animation:w3d5t1-wv 2.6s ease-in-out infinite}
.w3d5t1-ha{animation:w3d5t1-ha 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.w3d5t1-h2{animation-delay:-1.5s}
.w3d5t1-dw{stroke-dasharray:240;animation:w3d5t1-dw 5s ease-in-out infinite}
.w3d5t1-rk{animation:w3d5t1-rk 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w3d5t1-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes w3d5t1-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w3d5t1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w3d5t1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w3d5t1-dr{to{stroke-dashoffset:-32}}
@keyframes w3d5t1-sp{to{transform:rotate(360deg)}}
@keyframes w3d5t1-wv{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes w3d5t1-ha{0%{opacity:.55;transform:scale(.85)}100%{opacity:0;transform:scale(1.5)}}
@keyframes w3d5t1-dw{0%{stroke-dashoffset:240}45%,100%{stroke-dashoffset:0}}
@keyframes w3d5t1-rk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d5t1-ha{opacity:0}}
</style>
