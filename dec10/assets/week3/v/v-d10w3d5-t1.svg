<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Headphones and a checklist before the test">
<title>Headphones and a checklist before the test</title>
<style>
.w3d5t1-fl{animation:w3d5t1-fl 6s ease-in-out infinite}.w3d5t1-f2{animation-delay:-2s}.w3d5t1-f3{animation-delay:-4s}
.w3d5t1-tw{animation:w3d5t1-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d5t1-t2{animation-delay:-1.1s}.w3d5t1-t3{animation-delay:-2.2s}
.w3d5t1-bl{animation:w3d5t1-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.w3d5t1-b2{animation-delay:-1.7s}.w3d5t1-b3{animation-delay:-3.1s}
.w3d5t1-pu{animation:w3d5t1-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w3d5t1-p2{animation-delay:-1s}.w3d5t1-p3{animation-delay:-2s}
