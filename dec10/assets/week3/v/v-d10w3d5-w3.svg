@keyframes w3d5w3-dw{0%{stroke-dashoffset:240}45%,100%{stroke-dashoffset:0}}
@keyframes w3d5w3-rk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.w3d5w3-ha{opacity:0}}
</style>
