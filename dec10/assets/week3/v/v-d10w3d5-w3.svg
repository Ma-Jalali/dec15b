<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Four paragraph labels matched to four purposes">
<title>Four paragraph labels matched to four purposes</title>
<style>
.w3d5w3-fl{animation:w3d5w3-fl 6s ease-in-out infinite}.w3d5w3-f2{animation-delay:-2s}.w3d5w3-f3{animation-delay:-4s}
