<rect width="1000" height="460" rx="24" fill="#e9f5ec"/><rect width="1000" height="460" rx="24" fill="url(#w4d1es-dots)"/><text x="500" y="46" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#1d4d33" text-anchor="middle">Sample 3.1 · What is the key challenge in transitioning to a “green” job market?</text><g class="w4d1es-fl "><g filter="url(#w4d1es-sh)"><rect x="40" y="260" width="214" height="150" rx="18" fill="#fff" /></g><rect x="40" y="260" width="214" height="58" rx="18" fill="#2d7a9a"/><rect x="40" y="300" width="214" height="18" fill="#2d7a9a"/><text x="147.0" y="288" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Introduction</text><text x="147.0" y="310" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">Context + position</text><text x="147.0" y="348" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">Green jobs emerge…</text><text x="147.0" y="374" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">BUT key challenge =</text><text x="147.0" y="400" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">workforce readiness</text></g><g class="w4d1es-fl w4d1es-f2"><g filter="url(#w4d1es-sh)"><rect x="276" y="160" width="214" height="250" rx="18" fill="#fff" /></g><rect x="276" y="160" width="214" height="58" rx="18" fill="#b07d12"/><rect x="276" y="200" width="214" height="18" fill="#b07d12"/><text x="383.0" y="188" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Body 1</text><text x="383.0" y="210" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">A challenge, NOT the key one</text><text x="383.0" y="248" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">No clear definition</text><text x="383.0" y="274" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">BUT tools can help</text><text x="383.0" y="300" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">(GGS index)</text></g><g class="w4d1es-fl w4d1es-f3"><g filter="url(#w4d1es-sh)"><rect x="512" y="80" width="214" height="330" rx="18" fill="#fff" /></g><rect x="512" y="80" width="214" height="58" rx="18" fill="#e0673f"/><rect x="512" y="120" width="214" height="18" fill="#e0673f"/><text x="619.0" y="108" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Body 2</text><text x="619.0" y="130" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">THE key challenge + reasons</text><text x="619.0" y="168" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">Workforce readiness</text><text x="619.0" y="194" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">skills gap: 1 in 8</text><text x="619.0" y="220" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">widening → reskilling</text></g><g class="w4d1es-fl "><g filter="url(#w4d1es-sh)"><rect x="748" y="260" width="214" height="150" rx="18" fill="#fff" /></g><rect x="748" y="260" width="214" height="58" rx="18" fill="#2f7d4f"/><rect x="748" y="300" width="214" height="18" fill="#2f7d4f"/><text x="855.0" y="288" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Conclusion</text><text x="855.0" y="310" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="700" fill=