<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="The Integrated Writing Assessment as a path of seven stepping stones: 1 listening test, 2 reading test, 3 receive the question, 4 listen again and take notes, 5 take a position, 6 plan, 7 write 450 to 600 words. Flags show Week 5 and Week 9.">
<title>The Integrated Writing Assessment: seven steps</title>
<style>
.w4d1is-fl{animation:w4d1is-fl 6s ease-in-out infinite}.w4d1is-f2{animation-delay:-2s}.w4d1is-f3{animation-delay:-4s}
.w4d1is-tw{animation:w4d1is-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d1is-t2{animation-delay:-1s}.w4d1is-t3{animation-delay:-2s}
.w4d1is-pu{animation:w4d1is-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w4d1is-dr{stroke-dasharray:7 7;animation:w4d1is-dr 1.8s linear infinite}
.w4d1is-sw{animation:w4d1is-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w4d1is-bl{animation:w4d1is-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w4d1is-b2{animation-delay:-1.7s}.w4d1is-b3{animation-delay:-3.1s}
.w4d1is-wv{animation:w4d1is-wv 2.4s ease-in-out infinite}.w4d1is-w2{animation-delay:-.8s}.w4d1is-w3{animation-delay:-1.6s}
.w4d1is-sl{animation:w4d1is-sl 9s ease-in-out infinite}
.w4d1is-sp{animation:w4d1is-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes w4d1is-fl{50%{transform:translateY(-5px)}}
@keyframes w4d1is-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes w4d1is-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w4d1is-dr{to{stroke-dashoffset:-28}}
@keyframes w4d1is-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w4d1is-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w4d1is-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w4d1is-sl{50%{transform:translateX(14px)}}
@keyframes w4d1is-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
