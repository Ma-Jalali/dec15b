<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="A jigsaw diagram. Step 1: home groups 1, 2 and 3 read Goal 2, in yellow; groups 4, 5 and 6 read Goal 3, in green. Step 2: students pair up with someone from the other colour and swap their notes, so each pair completes the whole puzzle.">
<title>Jigsaw reading</title>
<style>
.w4d1jg-fl{animation:w4d1jg-fl 6s ease-in-out infinite}.w4d1jg-f2{animation-delay:-2s}.w4d1jg-f3{animation-delay:-4s}
