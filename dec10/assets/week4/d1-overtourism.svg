<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none" role="img" aria-label="A world map with three pins. Copenhagen: a bicycle and a free meal tray, rewards for eco-friendly tourists. Kyoto: a narrow lane with a no-entry sign, tourists banned from private roads in Gion. Bali: a ticket with a leaf, a tourist tax for conservation.">
<title>Three initiatives against overtourism</title>
<style>
.w4d1ot-fl{animation:w4d1ot-fl 6s ease-in-out infinite}.w4d1ot-f2{animation-delay:-2s}.w4d1ot-f3{animation-delay:-4s}
.w4d1ot-tw{animation:w4d1ot-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d1ot-t2{animation-delay:-1s}.w4d1ot-t3{animation-delay:-2s}
.w4d1ot-pu{animation:w4d1ot-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w4d1ot-dr{stroke-dasharray:7 7;animation:w4d1ot-dr 1.8s linear infinite}
.w4d1ot-sw{animation:w4d1ot-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w4d1ot-bl{animation:w4d1ot-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w4d1ot-b2{animation-delay:-1.7s}.w4d1ot-b3{animation-delay:-3.1s}
.w4d1ot-wv{animation:w4d1ot-wv 2.4s ease-in-out infinite}.w4d1ot-w2{animation-delay:-.8s}.w4d1ot-w3{animation-delay:-1.6s}
.w4d1ot-sl{animation:w4d1ot-sl 9s ease-in-out infinite}
.w4d1ot-sp{animation:w4d1ot-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes w4d1ot-fl{50%{transform:translateY(-5px)}}
@keyframes w4d1ot-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes w4d1ot-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w4d1ot-dr{to{stroke-dashoffset:-28}}
@keyframes w4d1ot-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w4d1ot-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w4d1ot-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w4d1ot-sl{50%{transform:translateX(14px)}}
@keyframes w4d1ot-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="w4d1ot-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf2fb"/><stop offset="1" stop-color="#d7e2f6"/></linearGradient>
<radialGradient id="w4d1ot-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="w4d1ot-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#3a58a0" fill-opacity=".14"/></pattern>
<filter id="w4d1ot-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w4d1ot-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w4d1ot-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="w4d1ot-leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fbf6b"/><stop offset="1" stop-color="#2f7d4f"/></linearGradient>
<linearGradient id="w4d1ot-leaf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad37a"/><stop offset="1" stop-color="#4c9a3e"/></linearGradient>
<linearGradient id="w4d1ot-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0d0"/><stop offset="1" stop-color="#1d7fa5"/></linearGradient>
<linearGradient id="w4d1ot-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6f5"/><stop offset="1" stop-color="#fdf1d6"/></linearGradient>
<linearGradient id="w4d1ot-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99a62"/><stop offset="1" stop-color="#8a5f34"/></linearGradient>
<linearGradient id="w4d1ot-tone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a58a0"/><stop offset="1" stop-color="#1f3363"/></linearGradient>
<radialGradient id="w4d1ot-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#e3a843"/><stop offset="1" stop-color="#e3a843" stop-opacity="0"/></radialGradient>

</defs>
