6b4a07" text-anchor="middle">local food · farm income · fish</text><g filter="url(#w4d1sg-sh)"><rect x="650" y="92" width="260" height="200" rx="22" fill="#4c9a4f" /></g><text x="690" y="140" font-family="Manrope, Arial, sans-serif" font-size="44" font-weight="800" fill="#fff" text-anchor="start">3</text><text x="738" y="128" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="start">GOOD HEALTH</text><text x="738" y="150" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="start">&amp; WELLBEING</text><path class="w4d1sg-pu" d="M780 250c-26-20-40-34-40-50a20 20 0 0 1 40-6a20 20 0 0 1 40 6c0 16-14 30-40 50z" fill="#fff"/><path d="M732 214h26l8-16 12 30 8-14h40" stroke="#4c9a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="780" y="300" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4d33" text-anchor="middle">parks · sport · clinics</text><path class="w4d1sg-dr" d="M400.0 200.0Q376.0 195.0 352.0 190.0" stroke="#d9a53a" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M363.0 186.2L352.0 190.0L360.6 197.9" stroke="#d9a53a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path class="w4d1sg-dr" d="M600.0 200.0Q624.0 195.0 648.0 190.0" stroke="#4c9a4f" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M639.4 197.9L648.0 190.0L637.0 186.2" stroke="#4c9a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="500" y="372" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f3363" text-anchor="middle">Tourism is named in the targets of:</text><circle cx="380" cy="413" r="26" fill="#a3214a"/><circle cx="380" cy="413" r="23" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="380" y="420.92" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="380" y="458" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#14293a" text-anchor="middle">decent work</text><circle cx="500" cy="413" r="26" fill="#b8862a"/><circle cx="500" cy="413" r="23" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="500" y="420.92" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">12</text><text x="500" y="458" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#14293a" text-anchor="middle">responsible consumption</text><circle cx="620" cy="413" r="26" fill="#2a6fb0"/><circle cx="620" cy="413" r="23" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="620" y="420.92" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">14</text><text x="620" y="458" font-family="Manrope, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#14293a" text-anchor="middle">life below water</text><path class="w4d1sg-tw " d="M70 322L72.4 327.6L78 330L72.4 332.4L70 338L67.6 332.4L62 330L67.6 327.6z" fill="#e3a843"/><path class="w4d1sg-tw w4d1sg-t2" d="M930 333L932.1 337.9L937 340L932.1 342.1L930 347L927.9 342.1L923 340L927.9 337.9z" fill="#3a58a0"/></svg>
