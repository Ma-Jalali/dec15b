<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" fill="none" role="img" aria-label="Two large goal badges beside a globe with a suitcase: Goal 2 Zero hunger, a bowl and a wheat stalk, and Goal 3 Good health and wellbeing, a heart with a pulse line. Smaller badges for Goals 8, 12 and 14, where tourism is named in the targets.">
<title>Tourism and the Sustainable Development Goals</title>
<style>
.w4d1sg-fl{animation:w4d1sg-fl 6s ease-in-out infinite}.w4d1sg-f2{animation-delay:-2s}.w4d1sg-f3{animation-delay:-4s}
.w4d1sg-tw{animation:w4d1sg-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d1sg-t2{animation-delay:-1s}.w4d1sg-t3{animation-delay:-2s}
