<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" fill="none" role="img" aria-label="Four link cards. SO, an arrow forward: a result, for example resulting in, this leads to, hindering, therefore, hence. BUT, a turning arrow: contrast or concession, for example however, while. BECAUSE, an arrow back to a root: a reason, for example as, given. AND, a plus sign: more of the same, for example she adds, also, in fact.">
<title>The four links: SO, BUT, BECAUSE, AND</title>
<style>
.w4d1sl-fl{animation:w4d1sl-fl 6s ease-in-out infinite}.w4d1sl-f2{animation-delay:-2s}.w4d1sl-f3{animation-delay:-4s}
.w4d1sl-tw{animation:w4d1sl-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d1sl-t2{animation-delay:-1s}.w4d1sl-t3{animation-delay:-2s}
.w4d1sl-pu{animation:w4d1sl-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w4d1sl-dr{stroke-dasharray:7 7;animation:w4d1sl-dr 1.8s linear infinite}
.w4d1sl-sw{animation:w4d1sl-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w4d1sl-bl{animation:w4d1sl-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w4d1sl-b2{animation-delay:-1.7s}.w4d1sl-b3{animation-delay:-3.1s}
.w4d1sl-wv{animation:w4d1sl-wv 2.4s ease-in-out infinite}.w4d1sl-w2{animation-delay:-.8s}.w4d1sl-w3{animation-delay:-1.6s}
.w4d1sl-sl{animation:w4d1sl-sl 9s ease-in-out infinite}
.w4d1sl-sp{animation:w4d1sl-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes w4d1sl-fl{50%{transform:translateY(-5px)}}
@keyframes w4d1sl-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes w4d1sl-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w4d1sl-dr{to{stroke-dashoffset:-28}}
@keyframes w4d1sl-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w4d1sl-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w4d1sl-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w4d1sl-sl{50%{transform:translateX(14px)}}
@keyframes w4d1sl-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="w4d1sl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f5ec"/><stop offset="1" stop-color="#d3ecda"/></linearGradient>
<radialGradient id="w4d1sl-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="w4d1sl-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#2f7d4f" fill-opacity=".14"/></pattern>
<filter id="w4d1sl-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w4d1sl-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w4d1sl-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="w4d1sl-leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fbf6b"/><stop offset="1" stop-color="#2f7d4f"/></linearGradient>
<linearGradient id="w4d1sl-leaf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad37a"/><stop offset="1" stop-color="#4c9a3e"/></linearGradient>
<linearGradient id="w4d1sl-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0d0"/><stop offset="1" stop-color="#1d7fa5"/></linearGradient>
<linearGradient id="w4d1sl-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6f5"/><stop offset="1" stop-color="#fdf1d6"/></linearGradient>
<linearGradient id="w4d1sl-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99a62"/><stop offset="1" stop-color="#8a5f34"/></linearGradient>
<linearGradient id="w4d1sl-tone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7d4f"/><stop offset="1" stop-color="#1d4d33"/></linearGradient>
<radialGradient id="w4d1sl-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#e3a843"/><stop offset="1" stop-color="#e3a843" stop-opacity="0"/></radialGradient>

</defs>
<rect width="1000" height="380" rx="24" fill="#e9f5ec"/><rect width="1000" height="380" rx="24" fill="url(#w4d1sl-dots)"/><g class="w4d1sl-fl "><g filter="url(#w4d1sl-sh)"><rect x="30" y="40" width="220" height="300" rx="20" fill="#fff" stroke="#2f7d4f" stroke-width="3" /></g><circle cx="140.0" cy="104" r="40" fill="#2f7d4f" opacity=".14"/><path d="M114.0 104.0Q140.0 104.0 166.0 104.0" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M154.0 111.2L166.0 104.0L154.0 96.8" stroke="#2f7d4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="140.0" y="174" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="800" fill="#2f7d4f" text-anchor="middle">SO</text><text x="140.0" y="200" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#4a5a66" text-anchor="middle">result / effect</text><rect x="50" y="216" width="180" height="24" rx="12" fill="#2f7d4f" opacity=".1"/><text x="140.0" y="233" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">resulting in</text><rect x="50" y="246" width="180" height="24" rx="12" fill="#2f7d4f" opacity=".1"/><text x="140.0" y="263" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">This leads to</text><rect x="50" y="276" width="180" height="24" rx="12" fill="#2f7d4f" opacity=".1"/><text x="140.0" y="293" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">hindering</text><rect x="50" y="306" width="180" height="24" rx="12" fill="#2f7d4f" opacity=".1"/><text x="140.0" y="323" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">Therefore · Hence</text></g><g class="w4d1sl-fl w4d1sl-f2"><g filter="url(#w4d1sl-sh)"><rect x="270" y="40" width="220" height="300" rx="20" fill="#fff" stroke="#e0673f" stroke-width="3" /></g><circle cx="380.0" cy="104" r="40" fill="#e0673f" opacity=".14"/><path d="M356.0 120h28a14 14 0 0 0 0-28h-10" stroke="#e0673f" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M378.0 82l-10 10 10 10" stroke="#e0673f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="380.0" y="174" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="800" fill="#e0673f" text-anchor="middle">BUT</text><text x="380.0" y="200" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#4a5a66" text-anchor="middle">contrast / concession</text><rect x="290" y="216" width="180" height="24" rx="12" fill="#e0673f" opacity=".1"/><text x="380.0" y="233" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">However</text><rect x="290" y="246" width="180" height="24" rx="12" fill="#e0673f" opacity=".1"/><text x="380.0" y="263" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">while</text><rect x="290" y="276" width="180" height="24" rx="12" fill="#e0673f" opacity=".1"/><text x="380.0" y="293" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">BUT a solution…</text></g><g class="w4d1sl-fl w4d1sl-f3"><g filter="url(#w4d1sl-sh)"><rect x="510" y="40" width="220" height="300" rx="20" fill="#fff" stroke="#3a58a0" stroke-width="3" /></g><circle cx="620.0" cy="104" r="40" fill="#3a58a0" opacity=".14"/><path d="M644.0 90.0Q625.0 90.0 606.0 90.0" stroke="#3a58a0" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M616.0 84.0L606.0 90.0L616.0 96.0" stroke="#3a58a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M614.0 104v20M614.0 124l-10 8M614.0 124l10 8M614.0 116l-8-4" stroke="#7a5a3a" stroke-width="4" stroke-linecap="round"/><text x="620.0" y="174" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="800" fill="#3a58a0" text-anchor="middle">BECAUSE</text><text x="620.0" y="200" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#4a5a66" text-anchor="middle">reason</text><rect x="530" y="216" width="180" height="24" rx="12" fill="#3a58a0" opacity=".1"/><text x="620.0" y="233" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">as</text><rect x="530" y="246" width="180" height="24" rx="12" fill="#3a58a0" opacity=".1"/><text x="620.0" y="263" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">given</text><rect x="530" y="276" width="180" height="24" rx="12" fill="#3a58a0" opacity=".1"/><text x="620.0" y="293" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">because of</text></g><g class="w4d1sl-fl "><g filter="url(#w4d1sl-sh)"><rect x="750" y="40" width="220" height="300" rx="20" fill="#fff" stroke="#b07d12" stroke-width="3" /></g><circle cx="860.0" cy="104" r="40" fill="#b07d12" opacity=".14"/><path class="w4d1sl-pu" d="M860.0 82v44M838.0 104h44" stroke="#b07d12" stroke-width="8" stroke-linecap="round"/><text x="860.0" y="174" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="800" fill="#b07d12" text-anchor="middle">AND</text><text x="860.0" y="200" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#4a5a66" text-anchor="middle">more of the same</text><rect x="770" y="216" width="180" height="24" rx="12" fill="#b07d12" opacity=".1"/><text x="860.0" y="233" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">She adds</text><rect x="770" y="246" width="180" height="24" rx="12" fill="#b07d12" opacity=".1"/><text x="860.0" y="263" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">also · In fact</text><rect x="770" y="276" width="180" height="24" rx="12" fill="#b07d12" opacity=".1"/><text x="860.0" y="293" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#14293a" text-anchor="middle">not only… but also</text></g></svg>
