<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-label="A notebook page set up for the Sentence Method: the title and source at the top, then numbered bullet points, one short sentence each, with speaker tags H for host, R for Ralph Buckley and S for Stefan Gossling in coloured circles on the left.">
<title>The Sentence Method: page set-up</title>
<style>
.w4d1sm-fl{animation:w4d1sm-fl 6s ease-in-out infinite}.w4d1sm-f2{animation-delay:-2s}.w4d1sm-f3{animation-delay:-4s}
.w4d1sm-tw{animation:w4d1sm-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d1sm-t2{animation-delay:-1s}.w4d1sm-t3{animation-delay:-2s}
.w4d1sm-pu{animation:w4d1sm-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w4d1sm-dr{stroke-dasharray:7 7;animation:w4d1sm-dr 1.8s linear infinite}
.w4d1sm-sw{animation:w4d1sm-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w4d1sm-bl{animation:w4d1sm-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w4d1sm-b2{animation-delay:-1.7s}.w4d1sm-b3{animation-delay:-3.1s}
.w4d1sm-wv{animation:w4d1sm-wv 2.4s ease-in-out infinite}.w4d1sm-w2{animation-delay:-.8s}.w4d1sm-w3{animation-delay:-1.6s}
.w4d1sm-sl{animation:w4d1sm-sl 9s ease-in-out infinite}
.w4d1sm-sp{animation:w4d1sm-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes w4d1sm-fl{50%{transform:translateY(-5px)}}
@keyframes w4d1sm-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes w4d1sm-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w4d1sm-dr{to{stroke-dashoffset:-28}}
@keyframes w4d1sm-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w4d1sm-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w4d1sm-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w4d1sm-sl{50%{transform:translateX(14px)}}
@keyframes w4d1sm-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
