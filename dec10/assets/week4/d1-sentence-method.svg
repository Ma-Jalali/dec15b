l, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">H</text><circle cx="250" cy="180" r="3.5" fill="#14293a"/><text x="264" y="186" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">= rich Western tourists pay to protect wildlife</text><path d="M230 234h600" stroke="#cfe0ea" stroke-width="1.5"/><circle cx="208" cy="220" r="13" fill="#13887a"/><circle cx="208" cy="220" r="10" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="208" y="224.68" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">R</text><circle cx="250" cy="220" r="3.5" fill="#14293a"/><text x="264" y="226" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Never well defined; similar terms = vague</text><path d="M230 274h600" stroke="#cfe0ea" stroke-width="1.5"/><circle cx="208" cy="260" r="13" fill="#13887a"/><circle cx="208" cy="260" r="10" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="208" y="264.68" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">R</text><circle cx="250" cy="260" r="3.5" fill="#14293a"/><text x="264" y="266" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">No real penalties; certification not regulated</text><path d="M230 314h600" stroke="#cfe0ea" stroke-width="1.5"/><circle cx="208" cy="300" r="13" fill="#e0673f"/><circle cx="208" cy="300" r="10" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="208" y="304.68" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">S</text><circle cx="250" cy="300" r="3.5" fill="#14293a"/><text x="264" y="306" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Tourism ≈ 10% of global warming (2019)</text><path d="M230 354h600" stroke="#cfe0ea" stroke-width="1.5"/><circle cx="208" cy="340" r="13" fill="#e0673f"/><circle cx="208" cy="340" r="10" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="208" y="344.68" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">S</text><circle cx="250" cy="340" r="3.5" fill="#14293a"/><text x="264" y="346" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">⅓ flights · ⅓ food · ⅓ transport + hotels</text><path d="M230 394h600" stroke="#cfe0ea" stroke-width="1.5"/><circle cx="208" cy="380" r="13" fill="#7a4a8c"/><circle cx="208" cy="380" r="10" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="208" y="384.68" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">H</text><circle cx="250" cy="380" r="3.5" fill="#14293a"/><text x="264" y="386" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Costa Rica ≈ 5% GDP from tourism (2021)</text><path d="M230 434h600" stroke="#cfe0ea" stroke-width="1.5"/><circle cx="208" cy="420" r="13" fill="#9fb3c4"/><circle cx="208" cy="420" r="10" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="208" y="424.68" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">…</text><circle cx="250" cy="420" r="3.5" fill="#14293a"/><text x="264" y="426" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">…</text></g><g class="w4d1sm-fl"><path d="M860 380l60-60 12 12-60 60-18 6z" fill="#e3a843"/><path d="M920 320l12 12" stroke="#14293a" stroke-width="2"/></g><rect x="10" y="100" width="120" height="34" rx="17" fill="#b07d12"/><text x="70" y="123" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">short</text><rect x="10" y="200" width="120" height="34" rx="17" fill="#b07d12"/><text x="70" y="223" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">one per line</text><rect x="10" y="300" width="120" height="34" rx="17" fill="#b07d12"/><text x="70" y="323" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">tag the speaker</text></svg>
