roke-opacity=".3" stroke-width="2"/><path d="M716.0 350.0L704.0 350.0" stroke="#14293a" stroke-opacity=".3" stroke-width="2"/><text x="260" y="384" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#2f7d4f" text-anchor="middle">CAREFUL</text><text x="740" y="384" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#e0673f" text-anchor="middle">CERTAIN</text><text x="500" y="70" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#b07d12" text-anchor="middle">LIKELY</text><text x="130" y="150" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4d33" text-anchor="middle">might · could · may</text><text x="130" y="180" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4d33" text-anchor="middle">possibly · perhaps</text><text x="130" y="210" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4d33" text-anchor="middle">to some extent</text><text x="130" y="240" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4d33" text-anchor="middle">tend to · somewhat</text><text x="870" y="150" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#8a3a20" text-anchor="middle">will undoubtedly</text><text x="870" y="180" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#8a3a20" text-anchor="middle">the most significant</text><text x="870" y="210" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#8a3a20" text-anchor="middle">extremely</text><text x="870" y="240" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#8a3a20" text-anchor="middle">definitely</text><g filter="url(#w4d1sd-sh)"><rect x="340" y="372" width="320" height="58" rx="14" fill="#fff" stroke="#b07d12" stroke-width="2" /></g><text x="500" y="396" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6b4a07" text-anchor="middle">is likely to · it appears that</text><text x="500" y="418" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#6b4a07" text-anchor="middle">there is a strong possibility that</text><g class="w4d1sd-nd"><path d="M492 350L500 150L508 350z" fill="#14293a"/></g><circle cx="500" cy="350" r="18" fill="#14293a"/><circle cx="500" cy="350" r="7" fill="#e3a843"/><text x="130" y="120" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#2f7d4f" text-anchor="middle">HEDGING</text><text x="870" y="120" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#e0673f" text-anchor="middle">BOOSTING</text></svg>
