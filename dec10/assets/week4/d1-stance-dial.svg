@keyframes w4d1sd-sp{to{transform:rotate(360deg)}}
.w4d1sd-nd{animation:w4d1sd-nd 6s ease-in-out infinite;transform-origin:500px 350px}@keyframes w4d1sd-nd{0%,100%{transform:rotate(-55deg)}50%{transform:rotate(40deg)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
