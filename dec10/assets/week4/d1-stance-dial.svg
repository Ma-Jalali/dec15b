<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="A dial from careful to certain. Careful, hedging: might, could, possibly, to some extent, may. Middle: likely, it appears that. Certain, boosting: undoubtedly, will, the most significant. A needle swings between them.">
<title>Hedging: turn the certainty dial</title>
<style>
.w4d1sd-fl{animation:w4d1sd-fl 6s ease-in-out infinite}.w4d1sd-f2{animation-delay:-2s}.w4d1sd-f3{animation-delay:-4s}
.w4d1sd-tw{animation:w4d1sd-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d1sd-t2{animation-delay:-1s}.w4d1sd-t3{animation-delay:-2s}
