@keyframes w4d1sd-dr{to{stroke-dashoffset:-28}}
@keyframes w4d1sd-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w4d1sd-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w4d1sd-wv{0%,100%{opacity:.3}50%{opacity:1}}
