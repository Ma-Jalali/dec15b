.w4d1sd-bl{animation:w4d1sd-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w4d1sd-b2{animation-delay:-1.7s}.w4d1sd-b3{animation-delay:-3.1s}
.w4d1sd-wv{animation:w4d1sd-wv 2.4s ease-in-out infinite}.w4d1sd-w2{animation-delay:-.8s}.w4d1sd-w3{animation-delay:-1.6s}
.w4d1sd-sl{animation:w4d1sd-sl 9s ease-in-out infinite}
.w4d1sd-sp{animation:w4d1sd-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes w4d1sd-fl{50%{transform:translateY(-5px)}}
