<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none" role="img" aria-label="Three holiday cards on a map of Australia. Imperial Hotel, Gold Coast, Queensland: a tall luxury hotel by the beach with a pool. Outback Hotel, New South Wales: a low hotel in red desert country under a starry sky. Vern's Ridge, Western Australia: a small sustainable house with solar panels among trees.">
