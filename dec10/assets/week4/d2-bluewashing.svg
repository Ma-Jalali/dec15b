<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" fill="none" role="img" aria-label="Bluewashing. A resort is covered by a shiny blue curtain that says SUSTAINABLE. Behind it, what is hidden: profits flow to an international consortium far away, bulldozers clear forest land, a village is pushed aside, and the lagoon and water system are under pressure.">
<title>Bluewashing. A resort is covered by a shiny blue curtain that says SUSTAINABLE. Behind it, what is hidden: profits flow to an international consortium far away, bulldozers clear forest land, a village is pushed aside, and the lagoon and water system are under pressure.</title>
<style>
.db42-fl{animation:db42-fl 6s ease-in-out infinite}.db42-f2{animation-delay:-2s}.db42-f3{animation-delay:-4s}
.db42-tw{animation:db42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.db42-t2{animation-delay:-1s}.db42-t3{animation-delay:-2s}
.db42-dr{stroke-dasharray:6 8;animation:db42-dr 1.6s linear infinite}
.db42-pu{animation:db42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.db42-sw{animation:db42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.db42-bl{animation:db42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.db42-b2{animation-delay:-1.7s}.db42-b3{animation-delay:-3.1s}
.db42-wv{animation:db42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.db42-w2{animation-delay:.9s}.db42-w3{animation-delay:1.8s}
.db42-sp{animation:db42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.db42-sea{animation:db42-sea 5s ease-in-out infinite}.db42-s2{animation-delay:-2.5s}
.db42-dw{stroke-dasharray:400;animation:db42-dw 5s ease-in-out infinite}
@keyframes db42-fl{50%{transform:translateY(-4px)}}
@keyframes db42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes db42-dr{to{stroke-dashoffset:-28}}
@keyframes db42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes db42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes db42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes db42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes db42-sp{to{transform:rotate(360deg)}}
@keyframes db42-sea{50%{transform:translateX(-10px)}}
@keyframes db42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
