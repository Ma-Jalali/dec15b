<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none" role="img" aria-label="A government briefing room. The Minister for Tourism sits at a desk; a clock shows ten minutes to the press conference. The research adviser stands with three source folders. An observer sits at the side with a checklist. Through the window: a coastline with a planned resort.">
<title>A government briefing room. The Minister for Tourism sits at a desk; a clock shows ten minutes to the press conference. The research adviser stands with three source folders. An observer sits at the side with a checklist. Through the window: a coastline with a planned resort.</title>
<style>
.dr42-fl{animation:dr42-fl 6s ease-in-out infinite}.dr42-f2{animation-delay:-2s}.dr42-f3{animation-delay:-4s}
.dr42-tw{animation:dr42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dr42-t2{animation-delay:-1s}.dr42-t3{animation-delay:-2s}
.dr42-dr{stroke-dasharray:6 8;animation:dr42-dr 1.6s linear infinite}
.dr42-pu{animation:dr42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr42-sw{animation:dr42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.dr42-bl{animation:dr42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dr42-b2{animation-delay:-1.7s}.dr42-b3{animation-delay:-3.1s}
.dr42-wv{animation:dr42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.dr42-w2{animation-delay:.9s}.dr42-w3{animation-delay:1.8s}
.dr42-sp{animation:dr42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.dr42-sea{animation:dr42-sea 5s ease-in-out infinite}.dr42-s2{animation-delay:-2.5s}
.dr42-dw{stroke-dasharray:400;animation:dr42-dw 5s ease-in-out infinite}
@keyframes dr42-fl{50%{transform:translateY(-4px)}}
@keyframes dr42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes dr42-dr{to{stroke-dashoffset:-28}}
@keyframes dr42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dr42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dr42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes dr42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes dr42-sp{to{transform:rotate(360deg)}}
@keyframes dr42-sea{50%{transform:translateX(-10px)}}
@keyframes dr42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
