<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="From an idea to a marketing term. Late 1970s: ecotourism is introduced to be ecologically responsible, promote conservation, benefit local populations and help travellers connect with biocultural diversity. Today: more a marketing term, a responsible sheen on adventure packages, profits kept by international consortiums, and in the worst cases communities blocked from ancestral lands or forced to move.">
<title>From an idea to a marketing term. Late 1970s: ecotourism is introduced to be ecologically responsible, promote conservation, benefit local populations and help travellers connect with biocultural diversity. Today: more a marketing term, a responsible sheen on adventure packages, profits kept by international consortiums, and in the worst cases communities blocked from ancestral lands or forced to move.</title>
<style>
.de42-fl{animation:de42-fl 6s ease-in-out infinite}.de42-f2{animation-delay:-2s}.de42-f3{animation-delay:-4s}
.de42-tw{animation:de42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.de42-t2{animation-delay:-1s}.de42-t3{animation-delay:-2s}
.de42-dr{stroke-dasharray:6 8;animation:de42-dr 1.6s linear infinite}
.de42-pu{animation:de42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.de42-sw{animation:de42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.de42-bl{animation:de42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.de42-b2{animation-delay:-1.7s}.de42-b3{animation-delay:-3.1s}
.de42-wv{animation:de42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.de42-w2{animation-delay:.9s}.de42-w3{animation-delay:1.8s}
.de42-sp{animation:de42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.de42-sea{animation:de42-sea 5s ease-in-out infinite}.de42-s2{animation-delay:-2.5s}
.de42-dw{stroke-dasharray:400;animation:de42-dw 5s ease-in-out infinite}
@keyframes de42-fl{50%{transform:translateY(-4px)}}
@keyframes de42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes de42-dr{to{stroke-dashoffset:-28}}
@keyframes de42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes de42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes de42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes de42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes de42-sp{to{transform:rotate(360deg)}}
@keyframes de42-sea{50%{transform:translateX(-10px)}}
@keyframes de42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
