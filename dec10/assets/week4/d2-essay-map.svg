<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none" role="img" aria-label="The shape of the Sample 4.1 text map. Top: Introduction — background, then THESIS: goals unlikely to be achieved, because they are undermined. Middle, three columns: Counter-argument (ecotourism is a realistic alternative; SDGs; Costa Rica), Reason 1 (unclear definitions, weak regulation, bluewashing), Reason 2 (local populations displaced, environment destroyed). Bottom: Conclusion — robust regulation and reduced impacts; implication: only through comprehensive measures. Arrows are labelled SO, BUT and AND.">
<title>The shape of the Sample 4.1 text map. Top: Introduction — background, then THESIS: goals unlikely to be achieved, because they are undermined. Middle, three columns: Counter-argument (ecotourism is a realistic alternative; SDGs; Costa Rica), Reason 1 (unclear definitions, weak regulation, bluewashing), Reason 2 (local populations displaced, environment destroyed). Bottom: Conclusion — robust regulation and reduced impacts; implication: only through comprehensive measures. Arrows are labelled SO, BUT and AND.</title>
<style>
.dk42-fl{animation:dk42-fl 6s ease-in-out infinite}.dk42-f2{animation-delay:-2s}.dk42-f3{animation-delay:-4s}
.dk42-tw{animation:dk42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dk42-t2{animation-delay:-1s}.dk42-t3{animation-delay:-2s}
.dk42-dr{stroke-dasharray:6 8;animation:dk42-dr 1.6s linear infinite}
.dk42-pu{animation:dk42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dk42-sw{animation:dk42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.dk42-bl{animation:dk42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dk42-b2{animation-delay:-1.7s}.dk42-b3{animation-delay:-3.1s}
.dk42-wv{animation:dk42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.dk42-w2{animation-delay:.9s}.dk42-w3{animation-delay:1.8s}
.dk42-sp{animation:dk42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.dk42-sea{animation:dk42-sea 5s ease-in-out infinite}.dk42-s2{animation-delay:-2.5s}
.dk42-dw{stroke-dasharray:400;animation:dk42-dw 5s ease-in-out infinite}
@keyframes dk42-fl{50%{transform:translateY(-4px)}}
@keyframes dk42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes dk42-dr{to{stroke-dashoffset:-28}}
@keyframes dk42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dk42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dk42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes dk42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes dk42-sp{to{transform:rotate(360deg)}}
@keyframes dk42-sea{50%{transform:translateX(-10px)}}
@keyframes dk42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
