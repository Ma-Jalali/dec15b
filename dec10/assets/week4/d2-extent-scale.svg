t-anchor="middle">to be achieved, as …</text><g class="dx42-pu"><circle cx="620" cy="129" r="20" fill="#7fb98a" stroke="#fff" stroke-width="4"/></g><text x="620" y="186" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#2f7d4b" text-anchor="middle">to a large extent</text><rect x="502" y="208" width="236" height="76" rx="14" fill="#fff" stroke="#7fb98a" stroke-width="2.5"/><text x="620" y="236" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="600" fill="#4a5a68" text-anchor="middle">“… the goals of ecotourism</text><text x="620" y="256" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#14293a" text-anchor="middle">are largely likely to be</text><text x="620" y="274" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#14293a" text-anchor="middle">achieved, provided that …</text><g class="dx42-pu"><circle cx="880" cy="129" r="20" fill="#2f7d6b" stroke="#fff" stroke-width="4"/></g><text x="880" y="186" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#2f7d6b" text-anchor="middle">completely</text><rect x="762" y="208" width="236" height="76" rx="14" fill="#fff" stroke="#2f7d6b" stroke-width="2.5"/><text x="880" y="236" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="600" fill="#4a5a68" text-anchor="middle">“… the goals of ecotourism</text><text x="880" y="256" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#14293a" text-anchor="middle">will certainly be achieved</text><text x="880" y="274" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#14293a" text-anchor="middle">(rare in academic writing)</text><text x="500" y="326" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#2f7d6b" text-anchor="middle">Choose your place on the scale — then prove it with the sources.</text></svg>
