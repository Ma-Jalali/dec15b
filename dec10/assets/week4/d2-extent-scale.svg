<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" fill="none" role="img" aria-label="To what extent? A scale with four points: not at all, to a small extent, to a large extent, completely. Thesis starters: are not likely to be achieved because …; are only partly likely to be achieved, as …; are largely likely to be achieved, provided that …; will certainly be achieved (rarely a good academic answer).">
<title>To what extent? A scale with four points: not at all, to a small extent, to a large extent, completely. Thesis starters: are not likely to be achieved because …; are only partly likely to be achieved, as …; are largely likely to be achieved, provided that …; will certainly be achieved (rarely a good academic answer).</title>
<style>
.dx42-fl{animation:dx42-fl 6s ease-in-out infinite}.dx42-f2{animation-delay:-2s}.dx42-f3{animation-delay:-4s}
.dx42-tw{animation:dx42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dx42-t2{animation-delay:-1s}.dx42-t3{animation-delay:-2s}
.dx42-dr{stroke-dasharray:6 8;animation:dx42-dr 1.6s linear infinite}
.dx42-pu{animation:dx42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dx42-sw{animation:dx42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.dx42-bl{animation:dx42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dx42-b2{animation-delay:-1.7s}.dx42-b3{animation-delay:-3.1s}
.dx42-wv{animation:dx42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.dx42-w2{animation-delay:.9s}.dx42-w3{animation-delay:1.8s}
.dx42-sp{animation:dx42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.dx42-sea{animation:dx42-sea 5s ease-in-out infinite}.dx42-s2{animation-delay:-2.5s}
.dx42-dw{stroke-dasharray:400;animation:dx42-dw 5s ease-in-out infinite}
@keyframes dx42-fl{50%{transform:translateY(-4px)}}
@keyframes dx42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes dx42-dr{to{stroke-dashoffset:-28}}
@keyframes dx42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dx42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dx42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes dx42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes dx42-sp{to{transform:rotate(360deg)}}
@keyframes dx42-sea{50%{transform:translateX(-10px)}}
@keyframes dx42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
