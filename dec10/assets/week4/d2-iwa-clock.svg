<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="A 90-minute clock: the first 30 minutes are for planning (making notes and a plan), the next 60 minutes are for writing, with a few minutes at the end to check and click Submit Quiz. Up to three blank sheets of paper for notes.">
<title>A 90-minute clock: the first 30 minutes are for planning (making notes and a plan), the next 60 minutes are for writing, with a few minutes at the end to check and click Submit Quiz. Up to three blank sheets of paper for notes.</title>
<style>
.dc42-fl{animation:dc42-fl 6s ease-in-out infinite}.dc42-f2{animation-delay:-2s}.dc42-f3{animation-delay:-4s}
.dc42-tw{animation:dc42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dc42-t2{animation-delay:-1s}.dc42-t3{animation-delay:-2s}
.dc42-dr{stroke-dasharray:6 8;animation:dc42-dr 1.6s linear infinite}
.dc42-pu{animation:dc42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dc42-sw{animation:dc42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.dc42-bl{animation:dc42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dc42-b2{animation-delay:-1.7s}.dc42-b3{animation-delay:-3.1s}
.dc42-wv{animation:dc42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.dc42-w2{animation-delay:.9s}.dc42-w3{animation-delay:1.8s}
.dc42-sp{animation:dc42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.dc42-sea{animation:dc42-sea 5s ease-in-out infinite}.dc42-s2{animation-delay:-2.5s}
.dc42-dw{stroke-dasharray:400;animation:dc42-dw 5s ease-in-out infinite}
@keyframes dc42-fl{50%{transform:translateY(-4px)}}
@keyframes dc42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes dc42-dr{to{stroke-dashoffset:-28}}
@keyframes dc42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dc42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dc42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes dc42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes dc42-sp{to{transform:rotate(360deg)}}
@keyframes dc42-sea{50%{transform:translateX(-10px)}}
@keyframes dc42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="dc42-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="dc42-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="dc42-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="dc42-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dc42-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="dc42-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="dc42-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="dc42-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="dc42-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect width="1000" height="420" rx="24" fill="#fdf7ea"/><rect width="1000" height="420" rx="24" fill="url(#dc42-dots)"/><circle cx="300" cy="210" r="184" fill="#fff" filter="url(#dc42-sh)"/><path d="M300.0 60.0A150 150 0 0 1 429.9 285.0" stroke="#e3a843" stroke-width="46" fill="none"/><path d="M429.9 285.0A150 150 0 1 1 248.7 69.0" stroke="#2b776e" stroke-width="46" fill="none"/><path d="M248.7 69.0A150 150 0 0 1 299.9 60.0" stroke="#2f7d4b" stroke-width="46" fill="none"/><text x="300" y="204" font-family="Manrope, Arial, sans-serif" font-size="54" font-weight="800" fill="#14293a" text-anchor="middle">90</text><text x="300" y="238" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="700" fill="#14293a" text-anchor="middle">minutes</text><g class="dc42-sp" style="transform-origin:300px 210px;transform-box:view-box"><path d="M300 210V100" stroke="#c4562f" stroke-width="5" stroke-linecap="round"/></g><circle cx="300" cy="210" r="7" fill="#c4562f"/><rect x="560" y="84" width="30" height="30" rx="8" fill="#e3a843"/><text x="606" y="106" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a" text-anchor="start">30 min · planning</text><text x="606" y="134" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#4a5a68" text-anchor="start">make notes relevant to the question, plan</text><rect x="560" y="176" width="30" height="30" rx="8" fill="#2b776e"/><text x="606" y="198" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a" text-anchor="start">60 min · writing</text><text x="606" y="226" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#4a5a68" text-anchor="start">type in the text box · 450–600 words</text><rect x="560" y="268" width="30" height="30" rx="8" fill="#2f7d4b"/><text x="606" y="290" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a" text-anchor="start">last minutes · check</text><text x="606" y="318" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#4a5a68" text-anchor="start">then click Submit Quiz before 90:00</text><g transform="translate(850 330) rotate(-8)"><rect width="54" height="68" rx="4" fill="#fff" filter="url(#dc42-ss)"/></g><g transform="translate(862 336) rotate(-2)"><rect width="54" height="68" rx="4" fill="#fff" filter="url(#dc42-ss)"/></g><g transform="translate(874 342) rotate(4)"><rect width="54" height="68" rx="4" fill="#fff" filter="url(#dc42-ss)"/></g><text x="890" y="410" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#985c0e" text-anchor="middle">up to 3 sheets</text></svg>
