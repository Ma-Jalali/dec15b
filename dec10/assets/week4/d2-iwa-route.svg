<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" fill="none" role="img" aria-label="Six steps on a path: 1 Analyse the question, 2 Take notes from the sources, 3 Choose your position, 4 Plan, 5 Write, 6 Check. A student with a backpack walks along it.">
<title>Six steps on a path: 1 Analyse the question, 2 Take notes from the sources, 3 Choose your position, 4 Plan, 5 Write, 6 Check. A student with a backpack walks along it.</title>
<style>
.dw42-fl{animation:dw42-fl 6s ease-in-out infinite}.dw42-f2{animation-delay:-2s}.dw42-f3{animation-delay:-4s}
.dw42-tw{animation:dw42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dw42-t2{animation-delay:-1s}.dw42-t3{animation-delay:-2s}
.dw42-dr{stroke-dasharray:6 8;animation:dw42-dr 1.6s linear infinite}
.dw42-pu{animation:dw42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dw42-sw{animation:dw42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.dw42-bl{animation:dw42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dw42-b2{animation-delay:-1.7s}.dw42-b3{animation-delay:-3.1s}
.dw42-wv{animation:dw42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.dw42-w2{animation-delay:.9s}.dw42-w3{animation-delay:1.8s}
.dw42-sp{animation:dw42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.dw42-sea{animation:dw42-sea 5s ease-in-out infinite}.dw42-s2{animation-delay:-2.5s}
.dw42-dw{stroke-dasharray:400;animation:dw42-dw 5s ease-in-out infinite}
@keyframes dw42-fl{50%{transform:translateY(-4px)}}
@keyframes dw42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes dw42-dr{to{stroke-dashoffset:-28}}
@keyframes dw42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dw42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dw42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes dw42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes dw42-sp{to{transform:rotate(360deg)}}
@keyframes dw42-sea{50%{transform:translateX(-10px)}}
@keyframes dw42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
