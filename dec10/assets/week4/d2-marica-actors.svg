@keyframes dm42-sp{to{transform:rotate(360deg)}}
@keyframes dm42-sea{50%{transform:translateX(-10px)}}
@keyframes dm42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
