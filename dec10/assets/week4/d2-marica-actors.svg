<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" fill="none" role="img" aria-label="The Maricá case as a map: forest, a lagoon and the sea; the Mbyá Guaraní village; the planned Maraey resort with a golf course; the local government town hall; the courts; the ILO C169 agreement; and the human rights lawyer. Numbered markers are on each.">
<title>The Maricá case as a map: forest, a lagoon and the sea; the Mbyá Guaraní village; the planned Maraey resort with a golf course; the local government town hall; the courts; the ILO C169 agreement; and the human rights lawyer. Numbered markers are on each.</title>
<style>
.dm42-fl{animation:dm42-fl 6s ease-in-out infinite}.dm42-f2{animation-delay:-2s}.dm42-f3{animation-delay:-4s}
.dm42-tw{animation:dm42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dm42-t2{animation-delay:-1s}.dm42-t3{animation-delay:-2s}
.dm42-dr{stroke-dasharray:6 8;animation:dm42-dr 1.6s linear infinite}
.dm42-pu{animation:dm42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
