.dm42-sea{animation:dm42-sea 5s ease-in-out infinite}.dm42-s2{animation-delay:-2.5s}
.dm42-dw{stroke-dasharray:400;animation:dm42-dw 5s ease-in-out infinite}
@keyframes dm42-fl{50%{transform:translateY(-4px)}}
@keyframes dm42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes dm42-dr{to{stroke-dashoffset:-28}}
@keyframes dm42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dm42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dm42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
