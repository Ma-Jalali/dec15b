<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="Four parts of a perspective. Evaluation: a judgement based on facts (positive: effective, relevant; negative: problematic, biased). Attitude: feeling or position on a subject (optimistic, sympathetic; critical, superficial). Opinion: a personal judgement (It is clear that …, Equally important …). Stance: a position made publicly (It is well established that …; It is unlikely that …).">
<title>Four parts of a perspective. Evaluation: a judgement based on facts (positive: effective, relevant; negative: problematic, biased). Attitude: feeling or position on a subject (optimistic, sympathetic; critical, superficial). Opinion: a personal judgement (It is clear that …, Equally important …). Stance: a position made publicly (It is well established that …; It is unlikely that …).</title>
<style>
.dp42-fl{animation:dp42-fl 6s ease-in-out infinite}.dp42-f2{animation-delay:-2s}.dp42-f3{animation-delay:-4s}
.dp42-tw{animation:dp42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dp42-t2{animation-delay:-1s}.dp42-t3{animation-delay:-2s}
.dp42-dr{stroke-dasharray:6 8;animation:dp42-dr 1.6s linear infinite}
.dp42-pu{animation:dp42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dp42-sw{animation:dp42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.dp42-bl{animation:dp42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dp42-b2{animation-delay:-1.7s}.dp42-b3{animation-delay:-3.1s}
.dp42-wv{animation:dp42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.dp42-w2{animation-delay:.9s}.dp42-w3{animation-delay:1.8s}
.dp42-sp{animation:dp42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.dp42-sea{animation:dp42-sea 5s ease-in-out infinite}.dp42-s2{animation-delay:-2.5s}
.dp42-dw{stroke-dasharray:400;animation:dp42-dw 5s ease-in-out infinite}
@keyframes dp42-fl{50%{transform:translateY(-4px)}}
@keyframes dp42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes dp42-dr{to{stroke-dashoffset:-28}}
@keyframes dp42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dp42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dp42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes dp42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes dp42-sp{to{transform:rotate(360deg)}}
@keyframes dp42-sea{50%{transform:translateX(-10px)}}
@keyframes dp42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
