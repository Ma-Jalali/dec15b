<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="Summarize versus synthesize. Summarize: to integrate multiple details from one text into one short text. Synthesize: to integrate multiple details from multiple texts to generate a new, bigger thought.">
<title>Summarize versus synthesize. Summarize: to integrate multiple details from one text into one short text. Synthesize: to integrate multiple details from multiple texts to generate a new, bigger thought.</title>
<style>
.dy42-fl{animation:dy42-fl 6s ease-in-out infinite}.dy42-f2{animation-delay:-2s}.dy42-f3{animation-delay:-4s}
.dy42-tw{animation:dy42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dy42-t2{animation-delay:-1s}.dy42-t3{animation-delay:-2s}
.dy42-dr{stroke-dasharray:6 8;animation:dy42-dr 1.6s linear infinite}
.dy42-pu{animation:dy42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dy42-sw{animation:dy42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.dy42-bl{animation:dy42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dy42-b2{animation-delay:-1.7s}.dy42-b3{animation-delay:-3.1s}
.dy42-wv{animation:dy42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.dy42-w2{animation-delay:.9s}.dy42-w3{animation-delay:1.8s}
.dy42-sp{animation:dy42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.dy42-sea{animation:dy42-sea 5s ease-in-out infinite}.dy42-s2{animation-delay:-2.5s}
.dy42-dw{stroke-dasharray:400;animation:dy42-dw 5s ease-in-out infinite}
@keyframes dy42-fl{50%{transform:translateY(-4px)}}
@keyframes dy42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes dy42-dr{to{stroke-dashoffset:-28}}
@keyframes dy42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dy42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dy42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes dy42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes dy42-sp{to{transform:rotate(360deg)}}
@keyframes dy42-sea{50%{transform:translateX(-10px)}}
@keyframes dy42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="dy42-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="dy42-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="dy42-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="dy42-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dy42-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="dy42-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="dy42-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="dy42-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="dy42-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect width="1000" height="440" rx="24" fill="#f1f4fb"/><rect width="1000" height="440" rx="24" fill="url(#dy42-dots)"/><rect x="30" y="30" width="430" height="380" rx="22" fill="#fff" stroke="#c4562f" stroke-width="3" filter="url(#dy42-sh)"/><text x="245" y="78" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="800" fill="#c4562f" text-anchor="middle">SUMMARIZE</text><text x="245" y="106" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="middle">to integrate multiple details</text><g transform="translate(90 150)"><path d="M0 0h84l16 16v114H0z" fill="#fff" stroke="#14293a" stroke-opacity=".2"/><path d="M84 0v16h16" fill="#e8eef5"/><rect x="10" y="26" width="78" height="4" rx="2" fill="#c4562f" opacity=".35"/><rect x="10" y="37" width="68" height="4" rx="2" fill="#c4562f" opacity=".35"/><rect x="10" y="48" width="78" height="4" rx="2" fill="#c4562f" opacity=".35"/><rect x="10" y="59" width="68" height="4" rx="2" fill="#c4562f" opacity=".35"/><text x="50.0" y="18" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#c4562f" text-anchor="middle">one text</text></g><circle class="dy42-tw dy42-t1" cx="140" cy="200" r="5" fill="#c4562f"/><circle class="dy42-tw dy42-t2" cx="160" cy="218" r="5" fill="#c4562f"/><circle class="dy42-tw dy42-t3" cx="140" cy="236" r="5" fill="#c4562f"/><circle class="dy42-tw dy42-t1" cx="160" cy="254" r="5" fill="#c4562f"/><path class="dy42-dr" d="M210.0 215.0L280.0 215.0" stroke="#c4562f" stroke-width="4" stroke-linecap="round"/><path d="M271.2 219.8L280.0 215.0L271.2 210.2" stroke="#c4562f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="295" y="180" width="130" height="70" rx="12" fill="#f8e4da" stroke="#c4562f" stroke-width="2"/><text x="360" y="222" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#b0512a" text-anchor="middle">summary</text><rect x="520" y="30" width="450" height="380" rx="22" fill="#fff" stroke="#3a58a0" stroke-width="3" filter="url(#dy42-sh)"/><text x="745" y="78" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="800" fill="#3a58a0" text-anchor="middle">SYNTHESIZE</text><text x="745" y="106" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">to integrate multiple details from multiple</text><text x="745" y="126" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">texts to generate a new, bigger thought</text><g transform="translate(560 160)"><path d="M0 0h44l16 16v48H0z" fill="#fff" stroke="#14293a" stroke-opacity=".2"/><path d="M44 0v16h16" fill="#e8eef5"/><rect x="10" y="26" width="38" height="4" rx="2" fill="#2f7d6b" opacity=".35"/><rect x="10" y="37" width="28" height="4" rx="2" fill="#2f7d6b" opacity=".35"/><rect x="10" y="48" width="38" height="4" rx="2" fill="#2f7d6b" opacity=".35"/><rect x="10" y="59" width="28" height="4" rx="2" fill="#2f7d6b" opacity=".35"/></g><path class="dy42-dr" d="M624 192C700 192 720 262 790 262" stroke="#2f7d6b" stroke-width="4" fill="none"/><g transform="translate(560 234)"><path d="M0 0h44l16 16v48H0z" fill="#fff" stroke="#14293a" stroke-opacity=".2"/><path d="M44 0v16h16" fill="#e8eef5"/><rect x="10" y="26" width="38" height="4" rx="2" fill="#2b776e" opacity=".35"/><rect x="10" y="37" width="28" height="4" rx="2" fill="#2b776e" opacity=".35"/><rect x="10" y="48" width="38" height="4" rx="2" fill="#2b776e" opacity=".35"/><rect x="10" y="59" width="28" height="4" rx="2" fill="#2b776e" opacity=".35"/></g><path class="dy42-dr" d="M624 266C700 266 720 262 790 262" stroke="#2b776e" stroke-width="4" fill="none"/><g transform="translate(560 308)"><path d="M0 0h44l16 16v48H0z" fill="#fff" stroke="#14293a" stroke-opacity=".2"/><path d="M44 0v16h16" fill="#e8eef5"/><rect x="10" y="26" width="38" height="4" rx="2" fill="#3a58a0" opacity=".35"/><rect x="10" y="37" width="28" height="4" rx="2" fill="#3a58a0" opacity=".35"/><rect x="10" y="48" width="38" height="4" rx="2" fill="#3a58a0" opacity=".35"/><rect x="10" y="59" width="28" height="4" rx="2" fill="#3a58a0" opacity=".35"/></g><path class="dy42-dr" d="M624 340C700 340 720 262 790 262" stroke="#3a58a0" stroke-width="4" fill="none"/><g transform="translate(850 262) scale(1.9)"><circle class="dy42-pu" r="30" fill="#f6c453" opacity=".25"/><path d="M-16 4a20 20 0 1 1 32 0c-5 6-6 10-6 16h-20c0-6-1-10-6-16z" fill="#fbd97a" stroke="#b07d12" stroke-width="2.5"/><rect x="-10" y="22" width="20" height="6" rx="2" fill="#9fb0c0"/><rect x="-8" y="30" width="16" height="5" rx="2" fill="#7f90a0"/><path d="M-5 10l5-8 5 8" stroke="#b07d12" stroke-width="2" fill="none"/></g><text x="850" y="365" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#3a58a0" text-anchor="middle">a new, bigger thought</text></svg>
