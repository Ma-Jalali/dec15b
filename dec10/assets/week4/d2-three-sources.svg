<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" fill="none" role="img" aria-label="A synthesis matrix on eco-tourism. Across the top: Spenceley and Rylance (2021), Alom (2023), Mielly (2023). Down the side: 1 background, 2 economic development, 3 environment protection, 4 social benefits, 5 tourist benefits, 6 legislation. Green links show agreement; orange links show disagreement.">
<title>A synthesis matrix on eco-tourism. Across the top: Spenceley and Rylance (2021), Alom (2023), Mielly (2023). Down the side: 1 background, 2 economic development, 3 environment protection, 4 social benefits, 5 tourist benefits, 6 legislation. Green links show agreement; orange links show disagreement.</title>
<style>
.dt42-fl{animation:dt42-fl 6s ease-in-out infinite}.dt42-f2{animation-delay:-2s}.dt42-f3{animation-delay:-4s}
.dt42-tw{animation:dt42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dt42-t2{animation-delay:-1s}.dt42-t3{animation-delay:-2s}
.dt42-dr{stroke-dasharray:6 8;animation:dt42-dr 1.6s linear infinite}
.dt42-pu{animation:dt42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dt42-sw{animation:dt42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.dt42-bl{animation:dt42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dt42-b2{animation-delay:-1.7s}.dt42-b3{animation-delay:-3.1s}
.dt42-wv{animation:dt42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.dt42-w2{animation-delay:.9s}.dt42-w3{animation-delay:1.8s}
.dt42-sp{animation:dt42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.dt42-sea{animation:dt42-sea 5s ease-in-out infinite}.dt42-s2{animation-delay:-2.5s}
.dt42-dw{stroke-dasharray:400;animation:dt42-dw 5s ease-in-out infinite}
@keyframes dt42-fl{50%{transform:translateY(-4px)}}
@keyframes dt42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes dt42-dr{to{stroke-dashoffset:-28}}
@keyframes dt42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dt42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dt42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes dt42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes dt42-sp{to{transform:rotate(360deg)}}
@keyframes dt42-sea{50%{transform:translateX(-10px)}}
@keyframes dt42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="dt42-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="dt42-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="dt42-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="dt42-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dt42-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="dt42-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="dt42-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="dt42-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="dt42-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
