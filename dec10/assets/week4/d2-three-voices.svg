<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" fill="none" role="img" aria-label="Three voices in the podcast. The host asks: can tourism ever be good for the climate? Ralph Buckley, Griffith University: eco-tourism has never been well defined; on a global level it does more harm than good. Stefan Gossling, Lund University: tourism is about 10% of global warming; internalise the cost of carbon dioxide.">
<title>Three voices in the podcast. The host asks: can tourism ever be good for the climate? Ralph Buckley, Griffith University: eco-tourism has never been well defined; on a global level it does more harm than good. Stefan Gossling, Lund University: tourism is about 10% of global warming; internalise the cost of carbon dioxide.</title>
<style>
.dv42-fl{animation:dv42-fl 6s ease-in-out infinite}.dv42-f2{animation-delay:-2s}.dv42-f3{animation-delay:-4s}
.dv42-tw{animation:dv42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dv42-t2{animation-delay:-1s}.dv42-t3{animation-delay:-2s}
.dv42-dr{stroke-dasharray:6 8;animation:dv42-dr 1.6s linear infinite}
.dv42-pu{animation:dv42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dv42-sw{animation:dv42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.dv42-bl{animation:dv42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dv42-b2{animation-delay:-1.7s}.dv42-b3{animation-delay:-3.1s}
.dv42-wv{animation:dv42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.dv42-w2{animation-delay:.9s}.dv42-w3{animation-delay:1.8s}
.dv42-sp{animation:dv42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.dv42-sea{animation:dv42-sea 5s ease-in-out infinite}.dv42-s2{animation-delay:-2.5s}
.dv42-dw{stroke-dasharray:400;animation:dv42-dw 5s ease-in-out infinite}
@keyframes dv42-fl{50%{transform:translateY(-4px)}}
@keyframes dv42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes dv42-dr{to{stroke-dashoffset:-28}}
@keyframes dv42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dv42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dv42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes dv42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes dv42-sp{to{transform:rotate(360deg)}}
@keyframes dv42-sea{50%{transform:translateX(-10px)}}
@keyframes dv42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
