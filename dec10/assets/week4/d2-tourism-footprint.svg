<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="Tourism’s footprint. Tourism was about 10% of global warming in 2019. Where it comes from: aviation about one third; food about one third; other transport, accommodation (mostly heating and cooling), shopping and activities about one third.">
<title>Tourism’s footprint. Tourism was about 10% of global warming in 2019. Where it comes from: aviation about one third; food about one third; other transport, accommodation (mostly heating and cooling), shopping and activities about one third.</title>
<style>
.df42-fl{animation:df42-fl 6s ease-in-out infinite}.df42-f2{animation-delay:-2s}.df42-f3{animation-delay:-4s}
.df42-tw{animation:df42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.df42-t2{animation-delay:-1s}.df42-t3{animation-delay:-2s}
.df42-dr{stroke-dasharray:6 8;animation:df42-dr 1.6s linear infinite}
.df42-pu{animation:df42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.df42-sw{animation:df42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.df42-bl{animation:df42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.df42-b2{animation-delay:-1.7s}.df42-b3{animation-delay:-3.1s}
.df42-wv{animation:df42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.df42-w2{animation-delay:.9s}.df42-w3{animation-delay:1.8s}
.df42-sp{animation:df42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.df42-sea{animation:df42-sea 5s ease-in-out infinite}.df42-s2{animation-delay:-2.5s}
.df42-dw{stroke-dasharray:400;animation:df42-dw 5s ease-in-out infinite}
@keyframes df42-fl{50%{transform:translateY(-4px)}}
@keyframes df42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes df42-dr{to{stroke-dashoffset:-28}}
@keyframes df42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes df42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes df42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes df42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes df42-sp{to{transform:rotate(360deg)}}
@keyframes df42-sea{50%{transform:translateX(-10px)}}
@keyframes df42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
