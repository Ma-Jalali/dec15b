<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="A Venn diagram with two circles. Left: Reading 1, Spenceley and Rylance (2021). Right: the listening, Alom (2023). The overlap in the middle is for common ideas found in both sources.">
<title>A Venn diagram with two circles. Left: Reading 1, Spenceley and Rylance (2021). Right: the listening, Alom (2023). The overlap in the middle is for common ideas found in both sources.</title>
<style>
.dn42-fl{animation:dn42-fl 6s ease-in-out infinite}.dn42-f2{animation-delay:-2s}.dn42-f3{animation-delay:-4s}
.dn42-tw{animation:dn42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dn42-t2{animation-delay:-1s}.dn42-t3{animation-delay:-2s}
.dn42-dr{stroke-dasharray:6 8;animation:dn42-dr 1.6s linear infinite}
.dn42-pu{animation:dn42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dn42-sw{animation:dn42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.dn42-bl{animation:dn42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dn42-b2{animation-delay:-1.7s}.dn42-b3{animation-delay:-3.1s}
.dn42-wv{animation:dn42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.dn42-w2{animation-delay:.9s}.dn42-w3{animation-delay:1.8s}
.dn42-sp{animation:dn42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.dn42-sea{animation:dn42-sea 5s ease-in-out infinite}.dn42-s2{animation-delay:-2.5s}
.dn42-dw{stroke-dasharray:400;animation:dn42-dw 5s ease-in-out infinite}
@keyframes dn42-fl{50%{transform:translateY(-4px)}}
@keyframes dn42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes dn42-dr{to{stroke-dashoffset:-28}}
@keyframes dn42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dn42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dn42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes dn42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes dn42-sp{to{transform:rotate(360deg)}}
@keyframes dn42-sea{50%{transform:translateX(-10px)}}
@keyframes dn42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
