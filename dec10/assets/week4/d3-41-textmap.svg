<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" fill="none" role="img" aria-label="Text map of Sample 4.1: Introduction — context and position (unlikely, because of 2 reasons). Body 1 — counter-argument: ecotourism is realistic (SDGs, agrotourism, marine-protected areas, Costa Rica). BUT Body 2 — reject the counter-argument + reason 1: lack of clear definitions and regulation, Bahia but loopholes, and bluewashing. AND Body 3 — reason 2: deep impact on local people, displacement, so loss of habitat. SO Conclusion — re-state the position, summarise the reasons, emphasise the importance.">
