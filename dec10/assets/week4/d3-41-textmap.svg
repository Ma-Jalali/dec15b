, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Reject the counter-argument + Reason 1: lack of clear definitions and</text><text x="250" y="306.1" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">regulation — Bahia BUT loopholes — AND bluewashing</text></g><rect x="470" y="228" width="60" height="26" rx="13.0" fill="#14293a"/><text x="500.0" y="246.04" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">BUT</text><g class="w4d3m-fl w4d3m-f1"><rect x="40" y="366" width="920" height="88" rx="16" fill="#fff" filter="url(#w4d3m-sh)"/><rect x="40" y="366" width="190" height="88" rx="16" fill="#7a4a8c"/><rect x="200" y="366" width="30" height="88" fill="#7a4a8c"/><text x="135" y="417" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">Body 3</text><text x="250" y="396.0" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">AND Reason 2: deep impact on local people — displacement (Indonesia,</text><text x="250" y="418.1" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Brazil) SO loss of habitat</text></g><rect x="470" y="340" width="60" height="26" rx="13.0" fill="#14293a"/><text x="500.0" y="358.04" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">AND</text><g class="w4d3m-fl w4d3m-f2"><rect x="40" y="478" width="920" height="88" rx="16" fill="#fff" filter="url(#w4d3m-sh)"/><rect x="40" y="478" width="190" height="88" rx="16" fill="#c4562f"/><rect x="200" y="478" width="30" height="88" fill="#c4562f"/><text x="135" y="529" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">Conclusion</text><text x="250" y="508.0" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Re-state the position · summarise the reasons · emphasise the importance</text><text x="250" y="530.1" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">(“Only through … can …”)</text></g><rect x="470" y="452" width="60" height="26" rx="13.0" fill="#14293a"/><text x="500.0" y="470.04" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">SO</text>
