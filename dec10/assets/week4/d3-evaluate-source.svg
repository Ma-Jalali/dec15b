<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" fill="none" role="img" aria-label="Three steps to evaluate an idea from a source: 1 identify a point of view from a source; 2 present it by paraphrasing or summarising; 3 evaluate it, positively or negatively, to show your own view. Judge ideas in terms of quality, value, significance, or strengths and limitations. Examples: Body 1, positive, value — “Indeed, … not only support … but also ensure …”; Body 3, negative, significance — “This ongoing kind of bluewashing remains a significant barrier …”.">
<title>Three steps to evaluate an idea from a source: 1 identify a point of view from a source; 2 present it by paraphrasing or summarising; 3 evaluate it, positively or negatively, to show your own view. Judge ideas in terms of quality, value, significance, or strengths and limitations. Examples: Body 1, positive, value — “Indeed, … not only support … but also ensure …”; Body 3, negative, significance — “This ongoing kind of bluewashing remains a significant barrier …”.</title>
