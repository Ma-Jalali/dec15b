.w4d3t-sw{animation:w4d3t-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w4d3t-s2{animation-delay:-2s}
.w4d3t-sp{animation:w4d3t-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w4d3t-ti{animation:w4d3t-ti 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.w4d3t-in{animation:w4d3t-in 7s ease-in-out infinite}.w4d3t-i2{animation-delay:-2.3s}.w4d3t-i3{animation-delay:-4.6s}
@keyframes w4d3t-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w4d3t-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w4d3t-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w4d3t-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w4d3t-dr{to{stroke-dashoffset:-30}}
@keyframes w4d3t-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w4d3t-sp{to{transform:rotate(360deg)}}
@keyframes w4d3t-ti{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w4d3t-in{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
