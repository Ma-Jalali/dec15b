<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none" role="img" aria-label="A toolbox with six drawers for expressing your position persuasively: adjectives (inadequate, ongoing, significant, robust, undesirable); adverbs (frequently, falsely, clearly); verbs (are undermined by, fall short of, extend beyond, be manipulated to justify, remain); nouns (your own finds, e.g. loopholes, barrier, displacement); contrasting links (However; While …; Despite …, however; can also …); phrases (unlikely to be achieved; due to a lack of; As … points out; It is essential to; Only through … can …).">
<title>A toolbox with six drawers for expressing your position persuasively: adjectives (inadequate, ongoing, significant, robust, undesirable); adverbs (frequently, falsely, clearly); verbs (are undermined by, fall short of, extend beyond, be manipulated to justify, remain); nouns (your own finds, e.g. loopholes, barrier, displacement); contrasting links (However; While …; Despite …, however; can also …); phrases (unlikely to be achieved; due to a lack of; As … points out; It is essential to; Only through … can …).</title>
<style>
.w4d3t-fl{animation:w4d3t-fl 6s ease-in-out infinite}.w4d3t-f2{animation-delay:-2s}.w4d3t-f3{animation-delay:-4s}
.w4d3t-tw{animation:w4d3t-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d3t-t2{animation-delay:-1s}.w4d3t-t3{animation-delay:-2s}
