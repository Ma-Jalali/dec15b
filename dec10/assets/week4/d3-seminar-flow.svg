<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="The seminar in four parts. Part 1, present: Group 2 speaks for 10–12 minutes — reactions, focus, research summary and two questions. Part 2, discuss: the class discusses the two questions for 10 minutes; presenters only listen and take notes. Part 3, summarise: each presenter gives a 1–2-minute summary of one group’s discussion. Part 4, feedback: Group 2 gets teacher feedback; the class prepares peer feedback and uploads it today.">
<title>The seminar in four parts. Part 1, present: Group 2 speaks for 10–12 minutes — reactions, focus, research summary and two questions. Part 2, discuss: the class discusses the two questions for 10 minutes; presenters only listen and take notes. Part 3, summarise: each presenter gives a 1–2-minute summary of one group’s discussion. Part 4, feedback: Group 2 gets teacher feedback; the class prepares peer feedback and uploads it today.</title>
