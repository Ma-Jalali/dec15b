<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none" role="img" aria-label="A balance: on the left, green notes of achievements (agrotourism income for farmers, marine-protected areas, Costa Rica as a model); on the right, more red notes of problems (no clear definitions, weak rules and loopholes, bluewashing, displacement of people). The red side is heavier: “More red → unlikely to be achieved”.">
<title>A balance: on the left, green notes of achievements (agrotourism income for farmers, marine-protected areas, Costa Rica as a model); on the right, more red notes of problems (no clear definitions, weak rules and loopholes, bluewashing, displacement of people). The red side is heavier: “More red → unlikely to be achieved”.</title>
<style>
