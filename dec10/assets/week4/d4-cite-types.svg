  <g class="dd4e-fl"><g filter="url(#dd4e-sh2)"><rect x="30" y="84" width="940" height="92" rx="16" fill="#fff"/></g><path d="M46 84h4v92h-4a16 16 0 0 1-16-16v-60a16 16 0 0 1 16-16z" fill="#13887a"/><rect x="56" y="104" width="200" height="34" rx="6" fill="#13887a"/><text x="156" y="127" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="900" fill="#fff" text-anchor="middle">As Mielly (2023)</text><rect x="264" y="104" width="116" height="34" rx="6" fill="#b9cbec"/><text x="322" y="127" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#3a58a0" text-anchor="middle">points out,</text><text x="392" y="127" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="600" fill="#14293a" text-anchor="start">terms such as sustainable and regenerative</text><text x="56" y="160" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="600" fill="#14293a" text-anchor="start">tourism lack clear definitions.</text></g>
  <text x="270" y="210" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#3a58a0" text-anchor="start">▲ reporting verb</text><text x="60" y="210" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#0b5a51" text-anchor="start">▲ name (year)</text>
  <g filter="url(#dd4e-sh)"><rect x="40" y="246" width="102.4" height="32" rx="16" fill="#c98a22"/></g><text x="91.2" y="267.8" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">EXTERNAL</text><text x="178" y="268" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#c98a22" text-anchor="start">the name is in brackets, outside the grammar</text>
  <g class="dd4e-fl dd4e-f2"><g filter="url(#dd4e-sh2)"><rect x="30" y="294" width="940" height="70" rx="16" fill="#fff"/></g><path d="M46 294h4v70h-4a16 16 0 0 1-16-16v-38a16 16 0 0 1 16-16z" fill="#e3a843"/><text x="56" y="336" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="600" fill="#14293a" text-anchor="start">Ecotourism aligns with a number of Sustainable Development Goals</text><g class="dd4e-pu"><rect x="682" y="314" width="270" height="34" rx="17" fill="#f6dfa8" stroke="#e3a843" stroke-width="2"/></g><text x="817" y="337" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#14293a" text-anchor="middle">(Spenceley &amp; Rylance, 2021).</text></g>
  <text x="60" y="410" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">In brackets: “&amp;” and a comma before the year.   In the sentence: “and”, year in brackets.</text>
