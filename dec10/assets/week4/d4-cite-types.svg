<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="Two sentence strips. Internal citation: As Mielly (2023) points out, terms such as sustainable and regenerative tourism lack clear definitions — the source name is part of the sentence. External citation: Ecotourism aligns with a number of Sustainable Development Goals (Spenceley &amp; Rylance, 2021) — the source is outside the sentence grammar, in brackets.">
<title>Internal and external citations</title>
<style>
.dd4e-fl{animation:dd4e-fl 6s ease-in-out infinite}.dd4e-f2{animation-delay:-2s}.dd4e-f3{animation-delay:-4s}
@keyframes dd4e-fl{50%{transform:translateY(-4px)}}
.dd4e-tw{animation:dd4e-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dd4e-t2{animation-delay:-1s}.dd4e-t3{animation-delay:-2s}
@keyframes dd4e-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dd4e-bl{animation:dd4e-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dd4e-b2{animation-delay:-1.7s}.dd4e-b3{animation-delay:-3.1s}
@keyframes dd4e-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dd4e-dr{stroke-dasharray:5 7;animation:dd4e-dr 1.6s linear infinite}
@keyframes dd4e-dr{to{stroke-dashoffset:-24}}
.dd4e-pu{animation:dd4e-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dd4e-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.dd4e-sp{animation:dd4e-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.dd4e-sr{animation-direction:reverse}
@keyframes dd4e-sp{to{transform:rotate(360deg)}}
.dd4e-sw{animation:dd4e-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dd4e-sw{50%{transform:rotate(4deg)}}
.dd4e-gl{animation:dd4e-gl 3s ease-in-out infinite}
@keyframes dd4e-gl{50%{opacity:.45}}
.dd4e-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:dd4e-dw 5s ease-in-out infinite}
@keyframes dd4e-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.dd4e-wv{animation:dd4e-wv 5s ease-in-out infinite}
@keyframes dd4e-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
