<linearGradient id="dd4e-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="dd4e-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="dd4e-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="dd4e-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e6cd"/><stop offset="1" stop-color="#e8c99c"/></linearGradient>
<pattern id="dd4e-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.3" fill="#14293a" fill-opacity="0.05"/></pattern>
</defs>
<rect width="1000" height="440" rx="26" fill="#eef7f3"/><rect width="1000" height="440" rx="26" fill="url(#dd4e-dots)"/>
