    <circle cx="240" cy="107" r="5" fill="#4a9fd8"/><text x="256" y="113" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" fill="#14293a" text-anchor="start">Defining performance criteria for a task (rubric)</text><circle cx="240" cy="141" r="5" fill="#4a9fd8"/><text x="256" y="147" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" fill="#14293a" text-anchor="start">Understanding feedback from teachers and peers</text><circle cx="240" cy="175" r="5" fill="#4a9fd8"/><text x="256" y="181" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" fill="#14293a" text-anchor="start">Verbalising how feedback will be used</text><path d="M40 216H190V316L115 348L40 316z" fill="#4a3cc0"/><text x="115" y="268" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">Making</text><text x="115" y="290" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">judgements</text>
    <g class="dd4j-pu"><g filter="url(#dd4j-sh2)"><rect x="210" y="220" width="640" height="112" rx="16" fill="#fff"/></g><rect x="210" y="220" width="640" height="112" rx="16" stroke="#4a3cc0" stroke-width="4"/></g>
    <circle cx="240" cy="253" r="5" fill="#4a3cc0"/><text x="256" y="259" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" fill="#14293a" text-anchor="start">Evaluating the quality of your own work and others’</text><rect x="226" y="272" width="608" height="30" rx="8" fill="#f6dfa8"/><circle cx="240" cy="287" r="5" fill="#4a3cc0"/><text x="256" y="293" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="start">Comparing your own work against others and against exemplars</text><path d="M40 362H190V462L115 494L40 462z" fill="#8a3c9e"/><text x="115" y="414" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">Taking</text><text x="115" y="436" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">action</text>
    <g><g filter="url(#dd4j-sh)"><rect x="210" y="366" width="640" height="112" rx="16" fill="#fff"/></g><rect x="210" y="366" width="640" height="112" rx="16" stroke="#8a3c9e" stroke-width="2"/></g>
    <circle cx="240" cy="399" r="5" fill="#8a3c9e"/><text x="256" y="405" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" fill="#14293a" text-anchor="start">Explaining how feedback has been applied / used</text><circle cx="240" cy="433" r="5" fill="#8a3c9e"/><text x="256" y="439" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" fill="#14293a" text-anchor="start">Documenting actions taken in response to feedback</text><path class="dd4j-dr" d="M970 268H874" stroke="#e64626" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M887.9 260L874 268L887.9 276" stroke="#e64626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="930" y="300" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#c4562f" text-anchor="middle">TODAY</text>
