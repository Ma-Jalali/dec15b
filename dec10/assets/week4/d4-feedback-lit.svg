<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none" role="img" aria-label="Feedback literacy in three stages. Appreciating feedback: defining performance criteria (rubric); understanding feedback from teachers and peers; verbalising how feedback will be used. Making judgements, highlighted as today’s focus: evaluating the quality of your own work and others’; comparing your own work against others and against exemplars. Taking action: explaining how feedback has been applied; documenting actions taken.">
<title>Feedback literacy: today’s focus is making judgements</title>
<style>
.dd4j-fl{animation:dd4j-fl 6s ease-in-out infinite}.dd4j-f2{animation-delay:-2s}.dd4j-f3{animation-delay:-4s}
@keyframes dd4j-fl{50%{transform:translateY(-4px)}}
.dd4j-tw{animation:dd4j-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dd4j-t2{animation-delay:-1s}.dd4j-t3{animation-delay:-2s}
@keyframes dd4j-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dd4j-bl{animation:dd4j-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dd4j-b2{animation-delay:-1.7s}.dd4j-b3{animation-delay:-3.1s}
@keyframes dd4j-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dd4j-dr{stroke-dasharray:5 7;animation:dd4j-dr 1.6s linear infinite}
@keyframes dd4j-dr{to{stroke-dashoffset:-24}}
.dd4j-pu{animation:dd4j-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dd4j-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.dd4j-sp{animation:dd4j-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.dd4j-sr{animation-direction:reverse}
@keyframes dd4j-sp{to{transform:rotate(360deg)}}
.dd4j-sw{animation:dd4j-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dd4j-sw{50%{transform:rotate(4deg)}}
.dd4j-gl{animation:dd4j-gl 3s ease-in-out infinite}
@keyframes dd4j-gl{50%{opacity:.45}}
.dd4j-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:dd4j-dw 5s ease-in-out infinite}
@keyframes dd4j-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.dd4j-wv{animation:dd4j-wv 5s ease-in-out infinite}
@keyframes dd4j-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
