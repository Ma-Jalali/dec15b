<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none" role="img" aria-label="A word tree of noun endings. -tion and -sion: classification, definition, implementation, expansion. -ment: assessment, requirement, involvement, development. -ance and -ence: importance, prevalence, existence, resilience. -ity: complexity, diversity, ambiguity, necessity. -ness and -cy: vagueness, efficiency, decency. Other changes: emphasis, variety, argument, tradition.">
<title>Common noun endings</title>
<style>
.dd4d-fl{animation:dd4d-fl 6s ease-in-out infinite}.dd4d-f2{animation-delay:-2s}.dd4d-f3{animation-delay:-4s}
@keyframes dd4d-fl{50%{transform:translateY(-4px)}}
.dd4d-tw{animation:dd4d-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dd4d-t2{animation-delay:-1s}.dd4d-t3{animation-delay:-2s}
@keyframes dd4d-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dd4d-bl{animation:dd4d-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dd4d-b2{animation-delay:-1.7s}.dd4d-b3{animation-delay:-3.1s}
@keyframes dd4d-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dd4d-dr{stroke-dasharray:5 7;animation:dd4d-dr 1.6s linear infinite}
@keyframes dd4d-dr{to{stroke-dashoffset:-24}}
.dd4d-pu{animation:dd4d-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dd4d-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.dd4d-sp{animation:dd4d-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.dd4d-sr{animation-direction:reverse}
@keyframes dd4d-sp{to{transform:rotate(360deg)}}
.dd4d-sw{animation:dd4d-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dd4d-sw{50%{transform:rotate(4deg)}}
.dd4d-gl{animation:dd4d-gl 3s ease-in-out infinite}
@keyframes dd4d-gl{50%{opacity:.45}}
.dd4d-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:dd4d-dw 5s ease-in-out infinite}
@keyframes dd4d-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.dd4d-wv{animation:dd4d-wv 5s ease-in-out infinite}
@keyframes dd4d-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
