<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" fill="none" role="img" aria-label="Three structures of nominalised noun phrases. 1 Noun + of + noun phrase + verb: The expansion of the green economy fosters sustainable development worldwide. 2 Noun + ’s + noun phrase + verb: The industry’s shift towards green jobs promotes environmental responsibility. 3 Noun + of + noun phrase + by + noun phrase + verb: The growth of green technologies by innovative companies accelerates the transition to a green economy.">
<title>Three structures of nominalised subjects</title>
<style>
.dd4b-fl{animation:dd4b-fl 6s ease-in-out infinite}.dd4b-f2{animation-delay:-2s}.dd4b-f3{animation-delay:-4s}
@keyframes dd4b-fl{50%{transform:translateY(-4px)}}
.dd4b-tw{animation:dd4b-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dd4b-t2{animation-delay:-1s}.dd4b-t3{animation-delay:-2s}
@keyframes dd4b-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dd4b-bl{animation:dd4b-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dd4b-b2{animation-delay:-1.7s}.dd4b-b3{animation-delay:-3.1s}
@keyframes dd4b-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dd4b-dr{stroke-dasharray:5 7;animation:dd4b-dr 1.6s linear infinite}
@keyframes dd4b-dr{to{stroke-dashoffset:-24}}
.dd4b-pu{animation:dd4b-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dd4b-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.dd4b-sp{animation:dd4b-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.dd4b-sr{animation-direction:reverse}
@keyframes dd4b-sp{to{transform:rotate(360deg)}}
.dd4b-sw{animation:dd4b-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dd4b-sw{50%{transform:rotate(4deg)}}
.dd4b-gl{animation:dd4b-gl 3s ease-in-out infinite}
@keyframes dd4b-gl{50%{opacity:.45}}
.dd4b-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:dd4b-dw 5s ease-in-out infinite}
@keyframes dd4b-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.dd4b-wv{animation:dd4b-wv 5s ease-in-out infinite}
@keyframes dd4b-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<filter id="dd4b-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".15"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="dd4b-sh2" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="dd4b-blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<radialGradient id="dd4b-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dd4b-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="dd4b-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="dd4b-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="dd4b-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e6cd"/><stop offset="1" stop-color="#e8c99c"/></linearGradient>
<pattern id="dd4b-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.3" fill="#14293a" fill-opacity="0.05"/></pattern>
</defs>
<rect width="1000" height="600" rx="26" fill="#f6f1fa"/><rect width="1000" height="600" rx="26" fill="url(#dd4b-dots)"/><text x="40" y="52" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#7a4a8c" text-anchor="start" letter-spacing="0.5">SUBJECT (a long noun phrase)</text><text x="700" y="52" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#c4562f" text-anchor="start" letter-spacing="0.5">MAIN VERB</text><g class="dd4b-fl dd4b-f1"><g filter="url(#dd4b-sh2)"><rect x="24" y="80" width="952" height="150" rx="16" fill="#fff"/></g><circle cx="58" cy="114" r="18" fill="#7a4a8c"/><text x="58" y="121" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">1</text><text x="86" y="121" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="start">Noun + of + noun phrase + verb</text><rect x="44" y="144" width="168.4" height="40" rx="10" fill="#7a4a8c"/><text x="128.2" y="170" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">The expansion</text><rect x="218.4" y="144" width="244" height="40" rx="10" fill="#c9b6dc"/><text x="340.4" y="170" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="middle">of the green economy</text><path d="M44 196H462.4" stroke="#7a4a8c" stroke-width="3" stroke-linecap="round"/><g class="dd4b-pu"><rect x="478.4" y="144" width="107.6" height="40" rx="20" fill="#e64626"/></g><text x="532.2" y="170" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">fosters</text><text x="598" y="170" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#3c4f5e" text-anchor="start">sustainable development worldwide.</text></g><g class="dd4b-fl dd4b-f2"><g filter="url(#dd4b-sh2)"><rect x="24" y="250" width="952" height="150" rx="16" fill="#fff"/></g><circle cx="58" cy="284" r="18" fill="#7a4a8c"/><text x="58" y="291" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">2</text><text x="86" y="291" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="start">Noun + ’s + noun phrase + verb</text><rect x="44" y="314" width="179.2" height="40" rx="10" fill="#c9b6dc"/><text x="133.6" y="340" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="middle">The industry’s</text><rect x="229.2" y="314" width="287.2" height="40" rx="10" fill="#7a4a8c"/><text x="372.8" y="340" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">shift towards green jobs</text><path d="M44 366H516.4" stroke="#7a4a8c" stroke-width="3" stroke-linecap="round"/><g class="dd4b-pu"><rect x="532.4" y="314" width="118.39999999999999" height="40" rx="20" fill="#e64626"/></g><text x="591.6" y="340" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">promotes</text><text x="662.8" y="340" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#3c4f5e" text-anchor="start">environmental responsibility.</text></g><g class="dd4b-fl dd4b-f3"><g filter="url(#dd4b-sh2)"><rect x="24" y="420" width="952" height="150" rx="16" fill="#fff"/></g><circle cx="58" cy="454" r="18" fill="#7a4a8c"/><text x="58" y="461" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">3</text><text x="86" y="461" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="start">Noun + of + noun phrase + by + noun phrase + verb</text><rect x="44" y="484" width="136" height="40" rx="10" fill="#7a4a8c"/><text x="112" y="510" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">The growth</text><rect x="186" y="484" width="254.79999999999998" height="40" rx="10" fill="#c9b6dc"/><text x="313.4" y="510" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="middle">of green technologies</text><rect x="446.79999999999995" y="484" width="276.4" height="40" rx="10" fill="#f6dfa8"/><text x="585" y="510" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="middle">by innovative companies</text><path d="M44 536H723.1999999999999" stroke="#7a4a8c" stroke-width="3" stroke-linecap="round"/><g class="dd4b-pu"><rect x="739.1999999999999" y="484" width="150.8" height="40" rx="20" fill="#e64626"/></g><text x="814.6" y="510" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">accelerates</text><text x="944" y="560" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#3c4f5e" text-anchor="end">the transition to a green economy.</text></g><path class="dd4b-tw" d="M960 31C961.62 38.38 961.62 38.38 969 40C961.62 41.62 961.62 41.62 960 49C958.38 41.62 958.38 41.62 951 40C958.38 38.38 958.38 38.38 960 31z" fill="#e3a843"/>
</svg>
