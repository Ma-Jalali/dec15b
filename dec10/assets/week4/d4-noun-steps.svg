<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" fill="none" role="img" aria-label="How to nominalise in three steps, joined by curved arrows. Step 1: identify which verbs or adjectives can be nominalised; not all can be or need to be changed. Step 2: change key verbs and adjectives to nouns; you can use a dictionary. Step 3: rewrite the sentence using these nouns; you may need to change other word forms, add articles and prepositions and change the grammar. Example: constructing becomes construction, indicates becomes indication.">
<title>How to nominalise in three steps</title>
<style>
.dd4c-fl{animation:dd4c-fl 6s ease-in-out infinite}.dd4c-f2{animation-delay:-2s}.dd4c-f3{animation-delay:-4s}
@keyframes dd4c-fl{50%{transform:translateY(-4px)}}
.dd4c-tw{animation:dd4c-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dd4c-t2{animation-delay:-1s}.dd4c-t3{animation-delay:-2s}
@keyframes dd4c-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dd4c-bl{animation:dd4c-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dd4c-b2{animation-delay:-1.7s}.dd4c-b3{animation-delay:-3.1s}
@keyframes dd4c-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dd4c-dr{stroke-dasharray:5 7;animation:dd4c-dr 1.6s linear infinite}
@keyframes dd4c-dr{to{stroke-dashoffset:-24}}
.dd4c-pu{animation:dd4c-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dd4c-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.dd4c-sp{animation:dd4c-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.dd4c-sr{animation-direction:reverse}
@keyframes dd4c-sp{to{transform:rotate(360deg)}}
.dd4c-sw{animation:dd4c-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dd4c-sw{50%{transform:rotate(4deg)}}
.dd4c-gl{animation:dd4c-gl 3s ease-in-out infinite}
@keyframes dd4c-gl{50%{opacity:.45}}
.dd4c-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:dd4c-dw 5s ease-in-out infinite}
@keyframes dd4c-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.dd4c-wv{animation:dd4c-wv 5s ease-in-out infinite}
@keyframes dd4c-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<filter id="dd4c-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".15"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="dd4c-sh2" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="dd4c-blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<radialGradient id="dd4c-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dd4c-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="dd4c-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="dd4c-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="dd4c-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e6cd"/><stop offset="1" stop-color="#e8c99c"/></linearGradient>
<pattern id="dd4c-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.3" fill="#14293a" fill-opacity="0.05"/></pattern>
</defs>
<rect width="1000" height="450" rx="26" fill="#f6f1fa"/><rect width="1000" height="450" rx="26" fill="url(#dd4c-dots)"/><g class="dd4c-fl dd4c-f1"><g filter="url(#dd4c-sh2)"><rect x="30" y="100" width="290" height="272" rx="18" fill="#fff"/></g><rect x="30" y="100" width="290" height="272" rx="18" stroke="#e64626" stroke-width="2.5"/><rect x="30" y="100" width="290" height="64" rx="18" fill="#e64626"/><rect x="30" y="140" width="290" height="24" fill="#e64626"/><text x="54" y="142" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff" text-anchor="start">Step 1</text><text x="296" y="142" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="end" letter-spacing="1">IDENTIFY</text>
    <text x="54" y="198" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Which verbs / adjectives</text><text x="54" y="222" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">can be nominalised? Not all</text><text x="54" y="246" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">can be — or need to be —</text><text x="54" y="270" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">changed.</text><rect x="46" y="300" width="258" height="58" rx="10" fill="#e64626" opacity=".12"/><text x="58" y="324" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#e64626" text-anchor="start" font-style="italic">constructing · indicates</text></g><g class="dd4c-fl dd4c-f2"><g filter="url(#dd4c-sh2)"><rect x="352" y="64" width="290" height="272" rx="18" fill="#fff"/></g><rect x="352" y="64" width="290" height="272" rx="18" stroke="#2f9a63" stroke-width="2.5"/><rect x="352" y="64" width="290" height="64" rx="18" fill="#2f9a63"/><rect x="352" y="104" width="290" height="24" fill="#2f9a63"/><text x="376" y="106" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff" text-anchor="start">Step 2</text><text x="618" y="106" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="end" letter-spacing="1">CHANGE</text>
    <text x="376" y="162" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Change key verbs /</text><text x="376" y="186" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">adjectives to nouns. You</text><text x="376" y="210" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">can use a dictionary.</text><rect x="368" y="264" width="258" height="58" rx="10" fill="#2f9a63" opacity=".12"/><text x="380" y="288" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#2f9a63" text-anchor="start" font-style="italic">construction · indication</text></g><g class="dd4c-fl dd4c-f3"><g filter="url(#dd4c-sh2)"><rect x="674" y="100" width="290" height="272" rx="18" fill="#fff"/></g><rect x="674" y="100" width="290" height="272" rx="18" stroke="#2f6db5" stroke-width="2.5"/><rect x="674" y="100" width="290" height="64" rx="18" fill="#2f6db5"/><rect x="674" y="140" width="290" height="24" fill="#2f6db5"/><text x="698" y="142" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff" text-anchor="start">Step 3</text><text x="940" y="142" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="end" letter-spacing="1">REWRITE</text>
    <text x="698" y="198" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">Rewrite the sentence with</text><text x="698" y="222" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">these nouns. Add articles</text><text x="698" y="246" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">and prepositions; change</text><text x="698" y="270" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="start">the grammar so it fits.</text><rect x="690" y="300" width="258" height="58" rx="10" fill="#2f6db5" opacity=".12"/><text x="702" y="324" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#2f6db5" text-anchor="start" font-style="italic">the construction of · an</text><text x="702" y="342" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#2f6db5" text-anchor="start" font-style="italic">indication of</text></g><path class="dd4c-dr" d="M250 96C280 40 330 30 352 58" stroke="#e64626" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M338.8 53.2L352 58L349.6 44.2" stroke="#e64626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path class="dd4c-dr" d="M600 64C640 30 680 40 690 92" stroke="#2f9a63" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M681 81.3L690 92L694.8 78.8" stroke="#2f9a63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="500" y="428" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">Compare with the original: what else changed? (a new verb, articles, prepositions)</text><path class="dd4c-tw" d="M965 41C966.62 48.38 966.62 48.38 974 50C966.62 51.62 966.62 51.62 965 59C963.38 51.62 963.38 51.62 956 50C963.38 48.38 963.38 48.38 965 41z" fill="#e3a843"/>
</svg>
