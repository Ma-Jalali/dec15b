@keyframes dd4a-sp{to{transform:rotate(360deg)}}
.dd4a-sw{animation:dd4a-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dd4a-sw{50%{transform:rotate(4deg)}}
.dd4a-gl{animation:dd4a-gl 3s ease-in-out infinite}
@keyframes dd4a-gl{50%{opacity:.45}}
.dd4a-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:dd4a-dw 5s ease-in-out infinite}
@keyframes dd4a-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.dd4a-wv{animation:dd4a-wv 5s ease-in-out infinite}
