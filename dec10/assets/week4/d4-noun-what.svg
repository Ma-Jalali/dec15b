<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="Two sentences with two verbs go into a funnel and come out as one sentence with one verb. Left: In 2015, governments adopted the 2030 Agenda. The agenda established a global framework. Right: The 2015 government adoption of the Agenda established a global framework. Labels: adopted becomes the adoption of; 2 sentences become 1; 2 verbs become 1.">
<title>What is nominalisation?</title>
<style>
.dd4a-fl{animation:dd4a-fl 6s ease-in-out infinite}.dd4a-f2{animation-delay:-2s}.dd4a-f3{animation-delay:-4s}
