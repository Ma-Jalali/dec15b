.dd4a-bl{animation:dd4a-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dd4a-b2{animation-delay:-1.7s}.dd4a-b3{animation-delay:-3.1s}
@keyframes dd4a-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dd4a-dr{stroke-dasharray:5 7;animation:dd4a-dr 1.6s linear infinite}
