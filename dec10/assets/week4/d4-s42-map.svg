<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none" role="img" aria-label="A map of Sample 4.2, paragraph by paragraph. Gold blocks are the writer’s voice, teal blocks have an external citation, blue blocks have an internal citation, and a striped block is a source’s idea without a new citation. Introduction: S1 gold, S2 teal, S3 gold, S4 gold. Body 1: S1 to S4 teal, S5 blue, S6 gold. Body 2: S1 gold, S2 to S4 teal, S5 gold. Body 3: S1 gold, S2 blue, S3 striped, S4 gold. Conclusion: S1 to S3 gold.">
<title>Sample 4.2: voice and citations at a glance</title>
<style>
.dd4i-fl{animation:dd4i-fl 6s ease-in-out infinite}.dd4i-f2{animation-delay:-2s}.dd4i-f3{animation-delay:-4s}
@keyframes dd4i-fl{50%{transform:translateY(-4px)}}
.dd4i-tw{animation:dd4i-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dd4i-t2{animation-delay:-1s}.dd4i-t3{animation-delay:-2s}
@keyframes dd4i-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dd4i-bl{animation:dd4i-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dd4i-b2{animation-delay:-1.7s}.dd4i-b3{animation-delay:-3.1s}
@keyframes dd4i-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dd4i-dr{stroke-dasharray:5 7;animation:dd4i-dr 1.6s linear infinite}
@keyframes dd4i-dr{to{stroke-dashoffset:-24}}
.dd4i-pu{animation:dd4i-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dd4i-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.dd4i-sp{animation:dd4i-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.dd4i-sr{animation-direction:reverse}
@keyframes dd4i-sp{to{transform:rotate(360deg)}}
.dd4i-sw{animation:dd4i-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dd4i-sw{50%{transform:rotate(4deg)}}
.dd4i-gl{animation:dd4i-gl 3s ease-in-out infinite}
@keyframes dd4i-gl{50%{opacity:.45}}
.dd4i-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:dd4i-dw 5s ease-in-out infinite}
@keyframes dd4i-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.dd4i-wv{animation:dd4i-wv 5s ease-in-out infinite}
@keyframes dd4i-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
