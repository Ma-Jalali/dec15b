<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none" role="img" aria-label="Five sentence patterns for reporting verbs, colour-coded: source in teal, reporting verb in blue, the rest in white. 1 verb + noun phrase: Adams (2022) outlines the important role of education. 2 verb + noun clause: Mielly (2023) acknowledges that regulations … have met with success. 3 According to + source, + sentence: According to Yu (2022), the role of governments is limited. 4 As + source + verb, + sentence: As Yu (2022) explains, the role of governments is limited. 5 Noun phrase, + verb + source, + rest: The importance of education, argues Adams (2022), needs to be emphasised.">
<title>Sentence patterns for reporting verbs</title>
<style>
.dd4g-fl{animation:dd4g-fl 6s ease-in-out infinite}.dd4g-f2{animation-delay:-2s}.dd4g-f3{animation-delay:-4s}
@keyframes dd4g-fl{50%{transform:translateY(-4px)}}
.dd4g-tw{animation:dd4g-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dd4g-t2{animation-delay:-1s}.dd4g-t3{animation-delay:-2s}
@keyframes dd4g-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dd4g-bl{animation:dd4g-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dd4g-b2{animation-delay:-1.7s}.dd4g-b3{animation-delay:-3.1s}
@keyframes dd4g-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dd4g-dr{stroke-dasharray:5 7;animation:dd4g-dr 1.6s linear infinite}
@keyframes dd4g-dr{to{stroke-dashoffset:-24}}
.dd4g-pu{animation:dd4g-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dd4g-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.dd4g-sp{animation:dd4g-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.dd4g-sr{animation-direction:reverse}
@keyframes dd4g-sp{to{transform:rotate(360deg)}}
.dd4g-sw{animation:dd4g-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dd4g-sw{50%{transform:rotate(4deg)}}
.dd4g-gl{animation:dd4g-gl 3s ease-in-out infinite}
@keyframes dd4g-gl{50%{opacity:.45}}
.dd4g-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:dd4g-dw 5s ease-in-out infinite}
@keyframes dd4g-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.dd4g-wv{animation:dd4g-wv 5s ease-in-out infinite}
@keyframes dd4g-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<filter id="dd4g-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".15"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="dd4g-sh2" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="dd4g-blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<radialGradient id="dd4g-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dd4g-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="dd4g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="dd4g-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="dd4g-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e6cd"/><stop offset="1" stop-color="#e8c99c"/></linearGradient>
<pattern id="dd4g-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.3" fill="#14293a" fill-opacity="0.05"/></pattern>
</defs>
<rect width="1000" height="560" rx="26" fill="#eef7f3"/><rect width="1000" height="560" rx="26" fill="url(#dd4g-dots)"/><g filter="url(#dd4g-sh)"><rect x="600" y="20" width="72.8" height="28" rx="14" fill="#13887a"/></g><text x="636.4" y="39" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">source</text><g filter="url(#dd4g-sh)"><rect x="700" y="20" width="140" height="28" rx="14" fill="#3a58a0"/></g><text x="770" y="39" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">reporting verb</text><g filter="url(#dd4g-sh)"><rect x="860" y="20" width="89.6" height="28" rx="14" fill="#fff"/></g><text x="904.8" y="39" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#14293a" text-anchor="middle">the rest</text><g class="dd4g-fl dd4g-f1"><circle cx="50" cy="106" r="20" fill="#14293a"/><text x="50" y="113" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">1</text><text x="82" y="102" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#0b5a51" text-anchor="start">verb + noun</text><text x="82" y="121" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#0b5a51" text-anchor="start">phrase</text><g filter="url(#dd4g-sh)"><rect x="250" y="84" width="148.39999999999998" height="44" rx="12" fill="#13887a"/></g><text x="324.2" y="112" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Adams (2022)</text><g filter="url(#dd4g-sh)"><rect x="406.4" y="84" width="107.6" height="44" rx="12" fill="#3a58a0"/></g><text x="460.2" y="112" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">outlines</text><g filter="url(#dd4g-sh)"><rect x="522" y="84" width="319.76" height="44" rx="12" fill="#fff"/></g><text x="681.9" y="112" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="middle">the important role of education.</text></g><g class="dd4g-fl dd4g-f2"><circle cx="50" cy="200" r="20" fill="#14293a"/><text x="50" y="207" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">2</text><text x="82" y="196" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#0b5a51" text-anchor="start">verb + noun</text><text x="82" y="215" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#0b5a51" text-anchor="start">clause</text><g filter="url(#dd4g-sh)"><rect x="250" y="178" width="158.6" height="44" rx="12" fill="#13887a"/></g><text x="329.3" y="206" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Mielly (2023)</text><g filter="url(#dd4g-sh)"><rect x="416.6" y="178" width="199.4" height="44" rx="12" fill="#3a58a0"/></g><text x="516.3" y="206" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">acknowledges that</text><g filter="url(#dd4g-sh)"><rect x="624" y="178" width="356.48" height="44" rx="12" fill="#fff"/></g><text x="802.2" y="206" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="middle">regulations … have met with success.</text></g><g class="dd4g-fl dd4g-f3"><circle cx="50" cy="294" r="20" fill="#14293a"/><text x="50" y="301" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">3</text><text x="82" y="290" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#0b5a51" text-anchor="start">According to …,</text><g filter="url(#dd4g-sh)"><rect x="250" y="272" width="148.39999999999998" height="44" rx="12" fill="#3a58a0"/></g><text x="324.2" y="300" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">According to</text><g filter="url(#dd4g-sh)"><rect x="406.4" y="272" width="128" height="44" rx="12" fill="#13887a"/></g><text x="470.4" y="300" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Yu (2022),</text><g filter="url(#dd4g-sh)"><rect x="542.4" y="272" width="347.3" height="44" rx="12" fill="#fff"/></g><text x="716.1" y="300" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="middle">the role of governments is limited.</text></g><g class="dd4g-fl dd4g-f1"><circle cx="50" cy="388" r="20" fill="#14293a"/><text x="50" y="395" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">4</text><text x="82" y="384" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#0b5a51" text-anchor="start">As … + verb,</text><g filter="url(#dd4g-sh)"><rect x="250" y="366" width="46.4" height="44" rx="12" fill="#3a58a0"/></g><text x="273.2" y="394" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">As</text><g filter="url(#dd4g-sh)"><rect x="304.4" y="366" width="117.8" height="44" rx="12" fill="#13887a"/></g><text x="363.3" y="394" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Yu (2022)</text><g filter="url(#dd4g-sh)"><rect x="430.2" y="366" width="117.8" height="44" rx="12" fill="#3a58a0"/></g><text x="489.1" y="394" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">explains,</text><g filter="url(#dd4g-sh)"><rect x="556" y="366" width="347.3" height="44" rx="12" fill="#fff"/></g><text x="729.7" y="394" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="middle">the role of governments is limited.</text></g><g class="dd4g-fl dd4g-f2"><circle cx="50" cy="482" r="20" fill="#14293a"/><text x="50" y="489" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#fff" text-anchor="middle">5</text><text x="82" y="478" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#0b5a51" text-anchor="start">Noun phrase,</text><text x="82" y="497" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#0b5a51" text-anchor="start">verb + source,</text><g filter="url(#dd4g-sh)"><rect x="250" y="460" width="283.04" height="44" rx="12" fill="#fff"/></g><text x="391.5" y="488" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="middle">The importance of education,</text><g filter="url(#dd4g-sh)"><rect x="541.04" y="460" width="87.19999999999999" height="44" rx="12" fill="#3a58a0"/></g><text x="584.6" y="488" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">argues</text><g filter="url(#dd4g-sh)"><rect x="636.24" y="460" width="158.6" height="44" rx="12" fill="#13887a"/></g><text x="715.5" y="488" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">Adams (2022),</text><g filter="url(#dd4g-sh)"><rect x="802.84" y="460" width="237.14000000000001" height="44" rx="12" fill="#fff"/></g><text x="921.4" y="488" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="600" fill="#14293a" text-anchor="middle">needs to be emphasised.</text></g>
</svg>
