<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="Discourse reporting verbs objectively report information and facts from a source: states, explains, mentions, notes, reports, lists, describes, points out. Evaluative reporting verbs express your evaluation of information or ideas from a source: claims, contends, assumes, alleges, exaggerates, implies, reveals.">
<title>Discourse and evaluative reporting verbs</title>
<style>
.dd4f-fl{animation:dd4f-fl 6s ease-in-out infinite}.dd4f-f2{animation-delay:-2s}.dd4f-f3{animation-delay:-4s}
@keyframes dd4f-fl{50%{transform:translateY(-4px)}}
.dd4f-tw{animation:dd4f-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dd4f-t2{animation-delay:-1s}.dd4f-t3{animation-delay:-2s}
@keyframes dd4f-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dd4f-bl{animation:dd4f-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dd4f-b2{animation-delay:-1.7s}.dd4f-b3{animation-delay:-3.1s}
@keyframes dd4f-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dd4f-dr{stroke-dasharray:5 7;animation:dd4f-dr 1.6s linear infinite}
@keyframes dd4f-dr{to{stroke-dashoffset:-24}}
.dd4f-pu{animation:dd4f-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dd4f-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.dd4f-sp{animation:dd4f-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.dd4f-sr{animation-direction:reverse}
@keyframes dd4f-sp{to{transform:rotate(360deg)}}
.dd4f-sw{animation:dd4f-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dd4f-sw{50%{transform:rotate(4deg)}}
.dd4f-gl{animation:dd4f-gl 3s ease-in-out infinite}
@keyframes dd4f-gl{50%{opacity:.45}}
.dd4f-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:dd4f-dw 5s ease-in-out infinite}
@keyframes dd4f-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.dd4f-wv{animation:dd4f-wv 5s ease-in-out infinite}
@keyframes dd4f-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
