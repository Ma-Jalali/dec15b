<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" fill="none" role="img" aria-label="An essay page in the middle with gold and teal lines. On the left, the writer speaks in a gold bubble: my position, my claims, my evaluation — no citation. On the right, three source bubbles with tags: Spenceley &amp; Rylance (2021), Mielly (2023), Alom (2023): their information and ideas — always cited. Dashed arrows bring both kinds of voice onto the page.">
<title>Your voice and the voices of your sources</title>
<style>
.dd4h-fl{animation:dd4h-fl 6s ease-in-out infinite}.dd4h-f2{animation-delay:-2s}.dd4h-f3{animation-delay:-4s}
@keyframes dd4h-fl{50%{transform:translateY(-4px)}}
.dd4h-tw{animation:dd4h-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dd4h-t2{animation-delay:-1s}.dd4h-t3{animation-delay:-2s}
@keyframes dd4h-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dd4h-bl{animation:dd4h-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.dd4h-b2{animation-delay:-1.7s}.dd4h-b3{animation-delay:-3.1s}
@keyframes dd4h-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dd4h-dr{stroke-dasharray:5 7;animation:dd4h-dr 1.6s linear infinite}
@keyframes dd4h-dr{to{stroke-dashoffset:-24}}
.dd4h-pu{animation:dd4h-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dd4h-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.dd4h-sp{animation:dd4h-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.dd4h-sr{animation-direction:reverse}
@keyframes dd4h-sp{to{transform:rotate(360deg)}}
.dd4h-sw{animation:dd4h-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dd4h-sw{50%{transform:rotate(4deg)}}
.dd4h-gl{animation:dd4h-gl 3s ease-in-out infinite}
@keyframes dd4h-gl{50%{opacity:.45}}
.dd4h-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:dd4h-dw 5s ease-in-out infinite}
@keyframes dd4h-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.dd4h-wv{animation:dd4h-wv 5s ease-in-out infinite}
@keyframes dd4h-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<filter id="dd4h-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".15"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="dd4h-sh2" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="dd4h-blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<radialGradient id="dd4h-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dd4h-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="dd4h-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="dd4h-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="dd4h-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e6cd"/><stop offset="1" stop-color="#e8c99c"/></linearGradient>
<pattern id="dd4h-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.3" fill="#14293a" fill-opacity="0.05"/></pattern>
</defs>
<rect width="1000" height="480" rx="26" fill="#eef7f3"/><rect width="1000" height="480" rx="26" fill="url(#dd4h-dots)"/>
  <g filter="url(#dd4h-sh2)"><rect x="400" y="70" width="200" height="300" rx="10" fill="url(#dd4h-pap)"/></g>
  <rect x="420" y="96" width="150" height="12" rx="6" fill="#e3a843"/><rect x="420" y="124" width="160" height="12" rx="6" fill="#13887a"/><rect x="420" y="152" width="130" height="12" rx="6" fill="#13887a"/><rect x="420" y="180" width="156" height="12" rx="6" fill="#e3a843"/><rect x="420" y="208" width="120" height="12" rx="6" fill="#3a58a0"/><rect x="420" y="236" width="140" height="12" rx="6" fill="#e3a843"/><rect x="420" y="264" width="150" height="12" rx="6" fill="#d9cfbd"/><rect x="420" y="292" width="110" height="12" rx="6" fill="#13887a"/><rect x="420" y="320" width="160" height="12" rx="6" fill="#e3a843"/>
  <text x="500" y="400" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#14293a" text-anchor="middle" letter-spacing="1">YOUR ESSAY</text>
  <g class="dd4h-fl"><g filter="url(#dd4h-sh)"><rect x="30" y="90" width="320" height="150" rx="22" fill="#e3a843"/><path d="M324 239l12 11l-2-11z" fill="#e3a843"/></g><text x="56" y="130" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#fff" text-anchor="start">WRITER’S VOICE</text><text x="56" y="162" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">My position, my claims,</text><text x="56" y="186" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">my evaluation. No</text><text x="56" y="210" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start">citation.</text></g>
  <g transform="translate(120 330) scale(1.6)"><path d="M-24 62C-24 38-14 24 0 24C14 24 24 38 24 62z" fill="#e3a843"/><path d="M6 24.6C17 27 24 39 24 62H12C13 45 11 33 6 24.6z" fill="#14293a" opacity=".13"/><rect x="-5" y="9" width="10" height="16" rx="4" fill="#e0a98a"/><path d="M-6 24L0 30L6 24z" fill="#e0a98a"/><circle r="14" fill="#e0a98a"/><circle cx="0" cy="-19" r="7" fill="#2b1d16"/><path d="M-14 1C-15-12-8-16 0-16C8-16 15-12 14 1C11-7 6-9 0-9C-6-9-11-7-14 1z" fill="#2b1d16"/><g class="dd4h-bl"><ellipse cx="-5.2" cy="2.4" rx="1.7" ry="2.1" fill="#14293a"/><ellipse cx="5.2" cy="2.4" rx="1.7" ry="2.1" fill="#14293a"/><circle cx="-4.6" cy="1.8" r=".55" fill="#fff"/><circle cx="5.8" cy="1.8" r=".55" fill="#fff"/></g><path d="M-7.6-2.8q2.4-1.6 4.8 0M2.8-2.8q2.4-1.6 4.8 0" stroke="#14293a" stroke-width="1.2" stroke-linecap="round" opacity=".8"/><circle cx="-9" cy="7.2" r="2.5" fill="#e8806b" opacity=".3"/><circle cx="9" cy="7.2" r="2.5" fill="#e8806b" opacity=".3"/><path d="M-3.4 7.4q3.4 6 6.8 0z" fill="#14293a"/><path d="M-1.5 10.3q1.5-1.3 3 0" fill="#e8806b"/></g>
  <g class="dd4h-fl dd4h-f1"><g filter="url(#dd4h-sh)"><rect x="650" y="70" width="320" height="78" rx="18" fill="#fff"/><path d="M666 147l2 11l10-11z" fill="#fff"/></g><rect x="666" y="84" width="273.6" height="30" rx="15" fill="#2f9a63"/><text x="678" y="105" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="start">Spenceley &amp; Rylance (2021)</text><text x="668" y="136" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#3c4f5e" text-anchor="start">their information and ideas — always cited</text></g><g class="dd4h-fl dd4h-f2"><g filter="url(#dd4h-sh)"><rect x="650" y="174" width="320" height="78" rx="18" fill="#fff"/><path d="M666 251l2 11l10-11z" fill="#fff"/></g><rect x="666" y="188" width="148.8" height="30" rx="15" fill="#e64626"/><text x="678" y="209" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="start">Mielly (2023)</text><text x="668" y="240" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#3c4f5e" text-anchor="start">their information and ideas — always cited</text></g><g class="dd4h-fl dd4h-f3"><g filter="url(#dd4h-sh)"><rect x="650" y="278" width="320" height="78" rx="18" fill="#fff"/><path d="M666 355l2 11l10-11z" fill="#fff"/></g><rect x="666" y="292" width="129.6" height="30" rx="15" fill="#3a58a0"/><text x="678" y="313" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="start">Alom (2023)</text><text x="668" y="344" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#3c4f5e" text-anchor="start">their information and ideas — always cited</text></g>
  <path class="dd4h-dr" d="M330 250C360 250 380 220 396 200" stroke="#e3a843" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M393.9 211.8L396 200L384.7 204.1" stroke="#e3a843" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path class="dd4h-dr" d="M650 200C630 200 620 210 606 220" stroke="#13887a" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M612 209.6L606 220L618 220" stroke="#13887a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="500" y="456" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#14293a" text-anchor="middle">A strong paragraph = your voice + their voices. Sources support your position; they do not replace it.</text>
