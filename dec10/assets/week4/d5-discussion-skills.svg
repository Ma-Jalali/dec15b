<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" fill="none" role="img" aria-label="Two rows of skill badges. Discussion skills: Start the discussion, Introduce ideas, Take the floor politely. Skills to encourage negotiation: Build on others’ ideas, Ask for clarification, opinions or justification, Give opinions, suggest solutions and justify choices. Under them, a strip: Refer to sources.">
<title>Two rows of skill badges. Discussion skills: Start the discussion, Introduce ideas, Take the floor politely. Skills to encourage negotiation: Build on others’ ideas, Ask for clarification, opinions or justification, Give opinions, suggest solutions and justify choices. Under them, a strip: Refer to sources.</title>
<style>
.dd5-fl{animation:dd5-fl 6s ease-in-out infinite}.dd5-f2{animation-delay:-2s}.dd5-f3{animation-delay:-4s}
@keyframes dd5-fl{50%{transform:translateY(-6px)}}
.dd5-tw{animation:dd5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dd5-t2{animation-delay:-1.1s}.dd5-t3{animation-delay:-2.2s}
@keyframes dd5-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dd5-bl{animation:dd5-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.dd5-b2{animation-delay:-1.6s}.dd5-b3{animation-delay:-3.1s}
@keyframes dd5-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dd5-pu{animation:dd5-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dd5-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.dd5-dr{stroke-dasharray:6 9;animation:dd5-dr 1.6s linear infinite}
@keyframes dd5-dr{to{stroke-dashoffset:-30}}
.dd5-sp{animation:dd5-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes dd5-sp{to{transform:rotate(360deg)}}
.dd5-sw{animation:dd5-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dd5-sw{50%{transform:rotate(3deg)}}
.dd5-wv{animation:dd5-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.dd5-w2{animation-delay:-1s}
@keyframes dd5-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.dd5-ty{animation:dd5-ty 1.4s steps(1) infinite}.dd5-y2{animation-delay:-.45s}.dd5-y3{animation-delay:-.9s}
@keyframes dd5-ty{0%,100%{opacity:1}50%{opacity:.2}}
.dd5-sl{animation:dd5-sl 9s ease-in-out infinite}
@keyframes dd5-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="dd5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef6f7"/><stop offset="1" stop-color="#eef6f7"/></linearGradient>
<pattern id="dd5-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="dd5-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dd5-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="dd5-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="dd5-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="dd5-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="dd5-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="dd5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="dd5-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="dd5-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<rect width="960" height="470" rx="24" fill="#eef6f7"/><rect width="960" height="470" rx="24" fill="url(#dd5-dots)"/>

