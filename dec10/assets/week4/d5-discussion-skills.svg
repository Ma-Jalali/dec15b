<g filter="url(#dd5-sh)"><rect x="40" y="370" width="880" height="64" rx="32" fill="#e3a843"/></g>
<g transform="translate(110 402)"><rect x="-22" y="-16" width="30" height="34" rx="3" fill="#fff"/><rect x="-14" y="-20" width="30" height="34" rx="3" fill="#fff" stroke="#c4831f"/><path d="M-8-10h18M-8-3h18M-8 4h12" stroke="#c4831f" stroke-width="2"/></g>
<text x="500" y="410" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a" text-anchor="middle">Refer to sources: “Mielly (2023) mentions that …”</text>
