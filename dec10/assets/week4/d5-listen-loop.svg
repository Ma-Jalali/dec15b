<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none" role="img" aria-label="A loop of four steps around a group at a table: 1 Listen to the idea, 2 Check what you heard, 3 Confirm the decision, 4 Act on it.">
<title>A loop of four steps around a group at a table: 1 Listen to the idea, 2 Check what you heard, 3 Confirm the decision, 4 Act on it.</title>
<style>
.dl5-fl{animation:dl5-fl 6s ease-in-out infinite}.dl5-f2{animation-delay:-2s}.dl5-f3{animation-delay:-4s}
@keyframes dl5-fl{50%{transform:translateY(-6px)}}
.dl5-tw{animation:dl5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dl5-t2{animation-delay:-1.1s}.dl5-t3{animation-delay:-2.2s}
@keyframes dl5-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dl5-bl{animation:dl5-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.dl5-b2{animation-delay:-1.6s}.dl5-b3{animation-delay:-3.1s}
@keyframes dl5-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dl5-pu{animation:dl5-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dl5-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.dl5-dr{stroke-dasharray:6 9;animation:dl5-dr 1.6s linear infinite}
@keyframes dl5-dr{to{stroke-dashoffset:-30}}
.dl5-sp{animation:dl5-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes dl5-sp{to{transform:rotate(360deg)}}
.dl5-sw{animation:dl5-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dl5-sw{50%{transform:rotate(3deg)}}
.dl5-wv{animation:dl5-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.dl5-w2{animation-delay:-1s}
@keyframes dl5-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.dl5-ty{animation:dl5-ty 1.4s steps(1) infinite}.dl5-y2{animation-delay:-.45s}.dl5-y3{animation-delay:-.9s}
@keyframes dl5-ty{0%,100%{opacity:1}50%{opacity:.2}}
.dl5-sl{animation:dl5-sl 9s ease-in-out infinite}
@keyframes dl5-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
