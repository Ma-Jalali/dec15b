<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" fill="none" role="img" aria-label="A project cycle. Transactional listening 1: Discussing goals (Student A), then Making a plan of action (Student B). Transactional listening 2: Discussing progress (Student A), then Potential challenges (Student B). An arrow goes back to goals.">
<title>A project cycle. Transactional listening 1: Discussing goals (Student A), then Making a plan of action (Student B). Transactional listening 2: Discussing progress (Student A), then Potential challenges (Student B). An arrow goes back to goals.</title>
<style>
.dm5-fl{animation:dm5-fl 6s ease-in-out infinite}.dm5-f2{animation-delay:-2s}.dm5-f3{animation-delay:-4s}
@keyframes dm5-fl{50%{translate:0 -6px}}
.dm5-tw{animation:dm5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dm5-t2{animation-delay:-1.1s}.dm5-t3{animation-delay:-2.2s}
@keyframes dm5-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.dm5-bl{animation:dm5-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.dm5-b2{animation-delay:-1.6s}.dm5-b3{animation-delay:-3.1s}
@keyframes dm5-bl{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.dm5-pu{animation:dm5-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dm5-pu{0%,100%{scale:1}50%{scale:1.08}}
.dm5-dr{stroke-dasharray:6 9;animation:dm5-dr 1.6s linear infinite}
@keyframes dm5-dr{to{stroke-dashoffset:-30}}
.dm5-sp{animation:dm5-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes dm5-sp{to{rotate:360deg}}
.dm5-sw{animation:dm5-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dm5-sw{50%{rotate:3deg}}
.dm5-wv{animation:dm5-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.dm5-w2{animation-delay:-1s}
@keyframes dm5-wv{0%{opacity:0;scale:.7}30%{opacity:.9}100%{opacity:0;scale:1.3}}
.dm5-ty{animation:dm5-ty 1.4s steps(1) infinite}.dm5-y2{animation-delay:-.45s}.dm5-y3{animation-delay:-.9s}
@keyframes dm5-ty{0%,100%{opacity:1}50%{opacity:.2}}
.dm5-sl{animation:dm5-sl 9s ease-in-out infinite}
@keyframes dm5-sl{50%{translate:14px 0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="dm5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f8f6"/><stop offset="1" stop-color="#f3f8f6"/></linearGradient>
<pattern id="dm5-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="dm5-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dm5-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="dm5-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="dm5-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="dm5-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="dm5-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="dm5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="dm5-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="dm5-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<rect width="960" height="460" rx="24" fill="#f3f8f6"/><rect width="960" height="460" rx="24" fill="url(#dm5-dots)"/>

<defs><marker id="dm5-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14293a"/></marker></defs>
<rect x="30" y="60" width="430" height="300" rx="22" fill="#e1f1ea" stroke="#2f7d6b" stroke-opacity=".4" stroke-width="2"/>
<rect x="500" y="60" width="430" height="300" rx="22" fill="#e6ecf8" stroke="#3a58a0" stroke-opacity=".4" stroke-width="2"/>
<text x="245" y="96" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#2f7d6b" text-anchor="middle">Transactional listening 1</text><text x="715" y="96" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#3a58a0" text-anchor="middle">Transactional listening 2</text>
<g filter="url(#dm5-sh)"><rect x="50" y="130" width="180" height="190" rx="16" fill="#fff" stroke="#2f7d6b" stroke-width="3"/><text x="140" y="206.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#14293a" text-anchor="middle">Discussing</text><text x="140" y="232.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="600" fill="#14293a" text-anchor="middle">goals</text><text x="140" y="258.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="600" fill="#14293a" text-anchor="middle">Student A</text></g>
<g filter="url(#dm5-sh)"><rect x="260" y="130" width="180" height="190" rx="16" fill="#fff" stroke="#2f7d6b" stroke-width="3"/><text x="350" y="206.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#14293a" text-anchor="middle">Making a plan</text><text x="350" y="232.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="600" fill="#14293a" text-anchor="middle">of action</text><text x="350" y="258.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="600" fill="#14293a" text-anchor="middle">Student B</text></g>
<g filter="url(#dm5-sh)"><rect x="520" y="130" width="180" height="190" rx="16" fill="#fff" stroke="#3a58a0" stroke-width="3"/><text x="610" y="206.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#14293a" text-anchor="middle">Discussing</text><text x="610" y="232.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="600" fill="#14293a" text-anchor="middle">progress</text><text x="610" y="258.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="600" fill="#14293a" text-anchor="middle">Student A</text></g>
<g filter="url(#dm5-sh)"><rect x="730" y="130" width="180" height="190" rx="16" fill="#fff" stroke="#3a58a0" stroke-width="3"/><text x="820" y="206.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#14293a" text-anchor="middle">Potential</text><text x="820" y="232.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="600" fill="#14293a" text-anchor="middle">challenges</text><text x="820" y="258.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="600" fill="#14293a" text-anchor="middle">Student B</text></g>
<circle cx="140" cy="150" r="0" fill="#2f7d6b"/><g transform="translate(140 300)"><circle r="16" fill="#2f7d6b"/><text y="6" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">G</text></g><circle cx="350" cy="150" r="0" fill="#2f7d6b"/><g transform="translate(350 300)"><circle r="16" fill="#2f7d6b"/><text y="6" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">P</text></g><circle cx="610" cy="150" r="0" fill="#3a58a0"/><g transform="translate(610 300)"><circle r="16" fill="#3a58a0"/><text y="6" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">R</text></g><circle cx="820" cy="150" r="0" fill="#3a58a0"/><g transform="translate(820 300)"><circle r="16" fill="#3a58a0"/><text y="6" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">C</text></g>
<path d="M232 225h24M462 225h54M702 225h24" stroke="#14293a" stroke-width="4" class="dm5-dr" marker-end="url(#dm5-a)"/>
<path d="M820 362C820 400 140 400 140 362" stroke="#14293a" stroke-width="4" fill="none" class="dm5-dr" marker-end="url(#dm5-a)"/>
<rect x="340" y="420" width="280" height="30" rx="15" fill="#fff"/><text x="480" y="441" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#41566a" text-anchor="middle">keep checking: back to your goals</text>
<text x="480" y="36" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#14293a" text-anchor="middle">Two meetings, four jobs</text>
</svg>