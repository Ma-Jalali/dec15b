<g transform="translate(790 150)"><g transform="translate(0 0) scale(1.1)" filter="url(#dg5-sh2)"><path d="M0 0v-56" stroke="#14293a" stroke-width="4"/><path d="M-20 0h40" stroke="#14293a" stroke-width="5" stroke-linecap="round"/><g class="dg5-sw"><path d="M-46-56h92" stroke="#14293a" stroke-width="4" stroke-linecap="round"/><path d="M-46-56l-14 26h28zM46-56l-14 26h28z" stroke="#14293a" stroke-width="1.5" fill="none"/><path d="M-62-30a16 7 0 0 0 32 0z" fill="url(#dg5-gold)"/><path d="M30-30a16 7 0 0 0 32 0z" fill="url(#dg5-gold)"/></g><circle cx="0" cy="-58" r="5" fill="url(#dg5-gold)"/></g></g>
<text x="730" y="64" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#c4562f" text-anchor="middle">tourism</text><text x="850" y="64" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#2f7d6b" text-anchor="middle">sustainability</text>
