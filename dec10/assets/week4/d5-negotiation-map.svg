<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none" role="img" aria-label="A negotiation table seen from above with three option cards: 1 Incentives for certified operators, 2 Limit visitors to vulnerable areas, 3 Rebates for sustainable tourists. Speech bubbles from four seats point to the cards, and a balance in the middle weighs tourism against sustainability.">
<title>A negotiation table seen from above with three option cards: 1 Incentives for certified operators, 2 Limit visitors to vulnerable areas, 3 Rebates for sustainable tourists. Speech bubbles from four seats point to the cards, and a balance in the middle weighs tourism against sustainability.</title>
<style>
.dg5-fl{animation:dg5-fl 6s ease-in-out infinite}.dg5-f2{animation-delay:-2s}.dg5-f3{animation-delay:-4s}
@keyframes dg5-fl{50%{translate:0 -6px}}
.dg5-tw{animation:dg5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dg5-t2{animation-delay:-1.1s}.dg5-t3{animation-delay:-2.2s}
@keyframes dg5-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.dg5-bl{animation:dg5-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.dg5-b2{animation-delay:-1.6s}.dg5-b3{animation-delay:-3.1s}
@keyframes dg5-bl{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.dg5-pu{animation:dg5-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dg5-pu{0%,100%{scale:1}50%{scale:1.08}}
.dg5-dr{stroke-dasharray:6 9;animation:dg5-dr 1.6s linear infinite}
@keyframes dg5-dr{to{stroke-dashoffset:-30}}
.dg5-sp{animation:dg5-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes dg5-sp{to{rotate:360deg}}
.dg5-sw{animation:dg5-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dg5-sw{50%{rotate:3deg}}
.dg5-wv{animation:dg5-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.dg5-w2{animation-delay:-1s}
@keyframes dg5-wv{0%{opacity:0;scale:.7}30%{opacity:.9}100%{opacity:0;scale:1.3}}
.dg5-ty{animation:dg5-ty 1.4s steps(1) infinite}.dg5-y2{animation-delay:-.45s}.dg5-y3{animation-delay:-.9s}
@keyframes dg5-ty{0%,100%{opacity:1}50%{opacity:.2}}
.dg5-sl{animation:dg5-sl 9s ease-in-out infinite}
@keyframes dg5-sl{50%{translate:14px 0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="dg5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f2ea"/><stop offset="1" stop-color="#f6f2ea"/></linearGradient>
<pattern id="dg5-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="dg5-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dg5-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="dg5-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="dg5-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="dg5-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="dg5-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="dg5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="dg5-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
