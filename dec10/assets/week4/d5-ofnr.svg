<rect x="261" y="322" width="200" height="36" rx="18" fill="#fff" filter="url(#do5-sh2)"/><text x="361" y="346" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#3a58a0" text-anchor="middle" font-style="italic">I feel …</text></g><g class="do5-fl do5-f3"><ellipse cx="597" cy="270" rx="92" ry="24" fill="#14293a" fill-opacity=".12"/><ellipse cx="597" cy="258" rx="96" ry="28" fill="#683b77"/><ellipse cx="597" cy="250" rx="96" ry="28" fill="#8a4f9e"/><text x="597" y="260" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="900" fill="#fff" text-anchor="middle">N</text>
<g filter="url(#do5-sh)"><rect x="492" y="50" width="210" height="118" rx="16" fill="#fff" stroke="#8a4f9e" stroke-width="3"/><text x="597" y="103.34" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#14293a" text-anchor="middle">Needs</text><text x="597" y="128.34" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="600" fill="#14293a" text-anchor="middle">Say what you need</text></g>
<rect x="497" y="292" width="200" height="36" rx="18" fill="#fff" filter="url(#do5-sh2)"/><text x="597" y="316" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#8a4f9e" text-anchor="middle" font-style="italic">I need …</text></g><g class="do5-fl do5-f1"><ellipse cx="833" cy="300" rx="92" ry="24" fill="#14293a" fill-opacity=".12"/><ellipse cx="833" cy="288" rx="96" ry="28" fill="#934123"/><ellipse cx="833" cy="280" rx="96" ry="28" fill="#c4562f"/><text x="833" y="290" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="900" fill="#fff" text-anchor="middle">R</text>
<g filter="url(#do5-sh)"><rect x="728" y="80" width="210" height="118" rx="16" fill="#fff" stroke="#c4562f" stroke-width="3"/><text x="833" y="120.84" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#14293a" text-anchor="middle">Request</text><text x="833" y="145.84" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="600" fill="#14293a" text-anchor="middle">Make a request</text><text x="833" y="170.84" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="600" fill="#14293a" text-anchor="middle">for action</text></g>
<rect x="733" y="322" width="200" height="36" rx="18" fill="#fff" filter="url(#do5-sh2)"/><text x="833" y="346" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#c4562f" text-anchor="middle" font-style="italic">Would you be willing to …?</text></g>
