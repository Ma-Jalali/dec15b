<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" fill="none" role="img" aria-label="O-F-N-R: four stepping stones across a river. O Observation: show you have noticed something (When I see…). F Feelings: say how you feel (I feel…). N Needs: say what you need (I need…). R Request: make a request for action (Would you be willing to…?).">
<title>O-F-N-R: four stepping stones across a river. O Observation: show you have noticed something (When I see…). F Feelings: say how you feel (I feel…). N Needs: say what you need (I need…). R Request: make a request for action (Would you be willing to…?).</title>
<style>
.do5-fl{animation:do5-fl 6s ease-in-out infinite}.do5-f2{animation-delay:-2s}.do5-f3{animation-delay:-4s}
@keyframes do5-fl{50%{transform:translateY(-6px)}}
.do5-tw{animation:do5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.do5-t2{animation-delay:-1.1s}.do5-t3{animation-delay:-2.2s}
@keyframes do5-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.do5-bl{animation:do5-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.do5-b2{animation-delay:-1.6s}.do5-b3{animation-delay:-3.1s}
@keyframes do5-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.do5-pu{animation:do5-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes do5-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.do5-dr{stroke-dasharray:6 9;animation:do5-dr 1.6s linear infinite}
@keyframes do5-dr{to{stroke-dashoffset:-30}}
.do5-sp{animation:do5-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes do5-sp{to{transform:rotate(360deg)}}
.do5-sw{animation:do5-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes do5-sw{50%{transform:rotate(3deg)}}
.do5-wv{animation:do5-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.do5-w2{animation-delay:-1s}
@keyframes do5-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.do5-ty{animation:do5-ty 1.4s steps(1) infinite}.do5-y2{animation-delay:-.45s}.do5-y3{animation-delay:-.9s}
@keyframes do5-ty{0%,100%{opacity:1}50%{opacity:.2}}
.do5-sl{animation:do5-sl 9s ease-in-out infinite}
@keyframes do5-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="do5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f8f6"/><stop offset="1" stop-color="#f3f8f6"/></linearGradient>
