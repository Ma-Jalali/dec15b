@keyframes dc5-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.dc5-ty{animation:dc5-ty 1.4s steps(1) infinite}.dc5-y2{animation-delay:-.45s}.dc5-y3{animation-delay:-.9s}
@keyframes dc5-ty{0%,100%{opacity:1}50%{opacity:.2}}
.dc5-sl{animation:dc5-sl 9s ease-in-out infinite}
@keyframes dc5-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
