<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none" role="img" aria-label="A magnifying glass over an AI answer. Around it are six check tags: Accurate? Relevant? Specific? Real sources? Right level? Fair and balanced?">
<title>A magnifying glass over an AI answer. Around it are six check tags: Accurate? Relevant? Specific? Real sources? Right level? Fair and balanced?</title>
<style>
.dc5-fl{animation:dc5-fl 6s ease-in-out infinite}.dc5-f2{animation-delay:-2s}.dc5-f3{animation-delay:-4s}
@keyframes dc5-fl{50%{transform:translateY(-6px)}}
.dc5-tw{animation:dc5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dc5-t2{animation-delay:-1.1s}.dc5-t3{animation-delay:-2.2s}
@keyframes dc5-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.dc5-bl{animation:dc5-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.dc5-b2{animation-delay:-1.6s}.dc5-b3{animation-delay:-3.1s}
