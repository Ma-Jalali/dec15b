.dc5-sp{animation:dc5-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes dc5-sp{to{transform:rotate(360deg)}}
.dc5-sw{animation:dc5-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dc5-sw{50%{transform:rotate(3deg)}}
