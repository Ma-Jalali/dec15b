@keyframes dt5-ty{0%,100%{opacity:1}50%{opacity:.2}}
.dt5-sl{animation:dt5-sl 9s ease-in-out infinite}
@keyframes dt5-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
