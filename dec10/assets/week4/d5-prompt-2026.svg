<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none" role="img" aria-label="A prompt card in six coloured strips: Role, Task, Context, Requirements, Instructions and Check. The first, second, fourth and fifth strips are marked RTRI. Context and Check are marked as the 2 Cs, with a small gold star.">
<title>A prompt card in six coloured strips: Role, Task, Context, Requirements, Instructions and Check. The first, second, fourth and fifth strips are marked RTRI. Context and Check are marked as the 2 Cs, with a small gold star.</title>
<style>
.dq5-fl{animation:dq5-fl 6s ease-in-out infinite}.dq5-f2{animation-delay:-2s}.dq5-f3{animation-delay:-4s}
@keyframes dq5-fl{50%{translate:0 -6px}}
.dq5-tw{animation:dq5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dq5-t2{animation-delay:-1.1s}
@keyframes dq5-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.dq5-pu{animation:dq5-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dq5-pu{0%,100%{scale:1}50%{scale:1.08}}
.dq5-dr{stroke-dasharray:6 9;animation:dq5-dr 1.6s linear infinite}
@keyframes dq5-dr{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="dq5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#e4ecf8"/></linearGradient>
<pattern id="dq5-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<linearGradient id="dq5-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="dq5-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<filter id="dq5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="dq5-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
</defs><rect width="960" height="520" rx="28" fill="url(#dq5-bg)"/><rect width="960" height="520" rx="28" fill="url(#dq5-dots)"/><rect x="44" y="40" width="590" height="452" rx="22" fill="url(#dq5-paper)" filter="url(#dq5-sh)"/><rect x="62" y="58" width="554" height="60" rx="14" fill="#ad6a12" fill-opacity="0.1" stroke="#ad6a12" stroke-opacity="0.35" stroke-width="1.5"/><rect x="62" y="58" width="8" height="60" rx="4" fill="#ad6a12"/><text x="140" y="82" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#ad6a12">Role</text><text x="140" y="104" font-family="Manrope, Arial, sans-serif" font-size="14.5" fill="#33475a">Act as a university tutor in sustainable tourism.</text><rect x="62" y="131" width="554" height="60" rx="14" fill="#2b776e" fill-opacity="0.1" stroke="#2b776e" stroke-opacity="0.35" stroke-width="1.5"/><rect x="62" y="131" width="8" height="60" rx="4" fill="#2b776e"/><text x="140" y="155" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#2b776e">Task</text><text x="140" y="177" font-family="Manrope, Arial, sans-serif" font-size="14.5" fill="#33475a">Help me brainstorm ideas on eco-certifications.</text><rect x="62" y="204" width="554" height="60" rx="14" fill="#b0512a" fill-opacity="0.16" stroke="#b0512a" stroke-opacity="0.9" stroke-width="2.5"/><rect x="62" y="204" width="8" height="60" rx="4" fill="#b0512a"/><text x="140" y="228" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#b0512a">Context</text><text x="140" y="250" font-family="Manrope, Arial, sans-serif" font-size="14.5" fill="#33475a">I’m a pre-university student; this is for a research task.</text><polygon class="dq5-pu" points="590.0,221.0 593.4,229.3 602.4,230.0 595.6,235.8 597.6,244.5 590.0,239.8 582.4,244.5 584.4,235.8 577.6,230.0 586.6,229.3" fill="url(#dq5-gold)"/><rect x="62" y="277" width="554" height="60" rx="14" fill="#3a58a0" fill-opacity="0.1" stroke="#3a58a0" stroke-opacity="0.35" stroke-width="1.5"/><rect x="62" y="277" width="8" height="60" rx="4" fill="#3a58a0"/><text x="140" y="301" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#3a58a0">Requirements</text><text x="140" y="323" font-family="Manrope, Arial, sans-serif" font-size="14.5" fill="#33475a">Clear B1–B2 English · both sides · max 250 words.</text><rect x="62" y="350" width="554" height="60" rx="14" fill="#7a4a8c" fill-opacity="0.1" stroke="#7a4a8c" stroke-opacity="0.35" stroke-width="1.5"/><rect x="62" y="350" width="8" height="60" rx="4" fill="#7a4a8c"/><text x="140" y="374" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#7a4a8c">Instructions</text><text x="140" y="396" font-family="Manrope, Arial, sans-serif" font-size="14.5" fill="#33475a">Bullet points under 3–4 headings + 3 research questions.</text><rect x="62" y="422" width="554" height="60" rx="14" fill="#2d7a9a" fill-opacity="0.16" stroke="#2d7a9a" stroke-opacity="0.9" stroke-width="2.5"/><rect x="62" y="422" width="8" height="60" rx="4" fill="#2d7a9a"/><text x="140" y="446" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#2d7a9a">Check</text><text x="140" y="468" font-family="Manrope, Arial, sans-serif" font-size="14.5" fill="#33475a">First ask me 2 questions. Say when you are not sure.</text><polygon class="dq5-pu" points="590.0,439.0 593.4,447.3 602.4,448.0 595.6,453.8 597.6,462.5 590.0,457.9 582.4,462.5 584.4,453.8 577.6,448.0 586.6,447.3" fill="url(#dq5-gold)"/><path d="M660 70 h14 v120 h-14 M674 130 h16" stroke="#566b7c" stroke-width="2.5" stroke-linecap="round"/><path d="M660 285 h14 v110 h-14 M674 340 h16" stroke="#566b7c" stroke-width="2.5" stroke-linecap="round"/><g class="dq5-fl"><rect x="700" y="98" width="226" height="66" rx="16" fill="#fff" filter="url(#dq5-sh2)"/><text x="716" y="126" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a">RTRI</text><text x="716" y="149" font-family="Manrope, Arial, sans-serif" font-size="13.5" fill="#566b7c">the skeleton (Week 3)</text></g><g class="dq5-fl dq5-f2"><rect x="700" y="306" width="226" height="66" rx="16" fill="#fff" filter="url(#dq5-sh2)"/><text x="716" y="334" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a">RTRI</text><text x="716" y="357" font-family="Manrope, Arial, sans-serif" font-size="13.5" fill="#566b7c">still useful, every time</text></g><g class="dq5-fl dq5-f3"><rect x="676" y="196" width="262" height="78" rx="18" fill="#14293a" filter="url(#dq5-sh)"/><polygon class="dq5-tw" points="704.0,221.0 707.7,229.9 717.3,230.7 710.0,236.9 712.2,246.3 704.0,241.3 695.8,246.3 698.0,236.9 690.7,230.7 700.3,229.9" fill="url(#dq5-gold)"/><text x="728" y="230" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff">+ the 2 Cs</text><text x="728" y="253" font-family="Manrope, Arial, sans-serif" font-size="13.5" fill="#c9d6e2">Context and Check: the 2026 upgrade</text></g><path class="dq5-dr" d="M676 235 C 650 235 640 234 618 234" stroke="#e3a843" stroke-width="2.5"/><path class="dq5-dr" d="M720 274 C 700 420 660 452 618 452" stroke="#e3a843" stroke-width="2.5"/><g class="dq5-fl dq5-f2"><rect x="676" y="410" width="262" height="70" rx="18" fill="#fff" filter="url(#dq5-sh2)"/><circle cx="702" cy="445" r="14" fill="#3a58a0"/><text x="702" y="450" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">AI</text><text x="724" y="440" font-family="Manrope, Arial, sans-serif" font-size="13.5" fill="#14293a">Before I answer, two</text><text x="724" y="459" font-family="Manrope, Arial, sans-serif" font-size="13.5" fill="#14293a">quick questions …</text></g></svg>
