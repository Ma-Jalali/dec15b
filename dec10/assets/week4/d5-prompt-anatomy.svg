<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" fill="none" role="img" aria-label="A prompt card cut into four coloured strips: Role, Task, Requirements and Instructions, each with an example about sustainability certifications in ecotourism. On the side, two tags: Context and Format.">
<title>A prompt card cut into four coloured strips: Role, Task, Requirements and Instructions, each with an example about sustainability certifications in ecotourism. On the side, two tags: Context and Format.</title>
<style>
.dp5-fl{animation:dp5-fl 6s ease-in-out infinite}.dp5-f2{animation-delay:-2s}.dp5-f3{animation-delay:-4s}
@keyframes dp5-fl{50%{translate:0 -6px}}
.dp5-tw{animation:dp5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dp5-t2{animation-delay:-1.1s}.dp5-t3{animation-delay:-2.2s}
@keyframes dp5-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.dp5-bl{animation:dp5-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.dp5-b2{animation-delay:-1.6s}.dp5-b3{animation-delay:-3.1s}
@keyframes dp5-bl{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.dp5-pu{animation:dp5-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dp5-pu{0%,100%{scale:1}50%{scale:1.08}}
.dp5-dr{stroke-dasharray:6 9;animation:dp5-dr 1.6s linear infinite}
@keyframes dp5-dr{to{stroke-dashoffset:-30}}
.dp5-sp{animation:dp5-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes dp5-sp{to{rotate:360deg}}
.dp5-sw{animation:dp5-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dp5-sw{50%{rotate:3deg}}
.dp5-wv{animation:dp5-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.dp5-w2{animation-delay:-1s}
@keyframes dp5-wv{0%{opacity:0;scale:.7}30%{opacity:.9}100%{opacity:0;scale:1.3}}
.dp5-ty{animation:dp5-ty 1.4s steps(1) infinite}.dp5-y2{animation-delay:-.45s}.dp5-y3{animation-delay:-.9s}
@keyframes dp5-ty{0%,100%{opacity:1}50%{opacity:.2}}
.dp5-sl{animation:dp5-sl 9s ease-in-out infinite}
@keyframes dp5-sl{50%{translate:14px 0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="dp5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
<pattern id="dp5-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="dp5-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dp5-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="dp5-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="dp5-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="dp5-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="dp5-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="dp5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="dp5-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="dp5-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<rect width="960" height="500" rx="24" fill="#eef3fb"/><rect width="960" height="500" rx="24" fill="url(#dp5-dots)"/>

<g filter="url(#dp5-sh)"><rect x="40" y="40" width="720" height="420" rx="22" fill="#fff"/></g>
<g class="dp5-fl dp5-f1"><rect x="60" y="62" width="680" height="84" rx="16" fill="#2f7d6b" fill-opacity=".12"/><rect x="60" y="62" width="10" height="84" rx="5" fill="#2f7d6b"/><circle cx="117" cy="104" r="28" fill="#2f7d6b"/><text x="117" y="114" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">R</text><text x="165" y="98" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a">Role</text><text x="165" y="126" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" fill="#41566a">Act as a researcher in sustainable tourism.</text></g><g class="dp5-fl dp5-f2"><rect x="60" y="160" width="680" height="84" rx="16" fill="#3a58a0" fill-opacity=".12"/><rect x="60" y="160" width="10" height="84" rx="5" fill="#3a58a0"/><circle cx="117" cy="202" r="28" fill="#3a58a0"/><text x="117" y="212" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">T</text><text x="165" y="196" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a">Task</text><text x="165" y="224" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" fill="#41566a">Brainstorm ideas on eco-certifications.</text></g><g class="dp5-fl dp5-f3"><rect x="60" y="258" width="680" height="84" rx="16" fill="#8a4f9e" fill-opacity=".12"/><rect x="60" y="258" width="10" height="84" rx="5" fill="#8a4f9e"/><circle cx="117" cy="300" r="28" fill="#8a4f9e"/><text x="117" y="310" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">Q</text><text x="165" y="294" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a">Requirements</text><text x="165" y="322" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" fill="#41566a">Clear English · both sides · 250 words.</text></g><g class="dp5-fl dp5-f1"><rect x="60" y="356" width="680" height="84" rx="16" fill="#c4562f" fill-opacity=".12"/><rect x="60" y="356" width="10" height="84" rx="5" fill="#c4562f"/><circle cx="117" cy="398" r="28" fill="#c4562f"/><text x="117" y="408" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">I</text><text x="165" y="392" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a">Instructions</text><text x="165" y="420" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="600" fill="#41566a">Bullet points under headings, then 3 questions.</text></g>
<g transform="translate(850 160)" class="dp5-sw"><path d="M-62 -34h100l24 34-24 34h-100z" fill="#b07d12" filter="url(#dp5-sh2)"/><circle cx="-48" cy="0" r="6" fill="#fff"/><text x="-6" y="6" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">+ Context</text></g><g transform="translate(850 320)" class="dp5-sw"><path d="M-62 -34h100l24 34-24 34h-100z" fill="#2d7a9a" filter="url(#dp5-sh2)"/><circle cx="-48" cy="0" r="6" fill="#fff"/><text x="-6" y="6" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">+ Format</text></g>
<path class="dp5-tw dp5-t" d="M820 58Q822.4 67.6 832 70Q822.4 72.4 820 82Q817.6 72.4 808 70Q817.6 67.6 820 58z" fill="#e3a843"/>
