<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" fill="none" role="img" aria-label="The iterative process of prompting: Craft prompt, then Analyse response and review prompt, then Use output. A big arrow loops back from Analyse response to Craft prompt.">
<title>The iterative process of prompting: Craft prompt, then Analyse response and review prompt, then Use output. A big arrow loops back from Analyse response to Craft prompt.</title>
<style>
.df5-fl{animation:df5-fl 6s ease-in-out infinite}.df5-f2{animation-delay:-2s}.df5-f3{animation-delay:-4s}
@keyframes df5-fl{50%{translate:0 -6px}}
.df5-tw{animation:df5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.df5-t2{animation-delay:-1.1s}.df5-t3{animation-delay:-2.2s}
@keyframes df5-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.df5-bl{animation:df5-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.df5-b2{animation-delay:-1.6s}.df5-b3{animation-delay:-3.1s}
@keyframes df5-bl{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.df5-pu{animation:df5-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes df5-pu{0%,100%{scale:1}50%{scale:1.08}}
.df5-dr{stroke-dasharray:6 9;animation:df5-dr 1.6s linear infinite}
@keyframes df5-dr{to{stroke-dashoffset:-30}}
.df5-sp{animation:df5-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes df5-sp{to{rotate:360deg}}
.df5-sw{animation:df5-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes df5-sw{50%{rotate:3deg}}
.df5-wv{animation:df5-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.df5-w2{animation-delay:-1s}
@keyframes df5-wv{0%{opacity:0;scale:.7}30%{opacity:.9}100%{opacity:0;scale:1.3}}
.df5-ty{animation:df5-ty 1.4s steps(1) infinite}.df5-y2{animation-delay:-.45s}.df5-y3{animation-delay:-.9s}
@keyframes df5-ty{0%,100%{opacity:1}50%{opacity:.2}}
.df5-sl{animation:df5-sl 9s ease-in-out infinite}
@keyframes df5-sl{50%{translate:14px 0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="df5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
<pattern id="df5-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="df5-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="df5-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="df5-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="df5-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="df5-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="df5-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="df5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="df5-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="df5-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<rect width="960" height="400" rx="24" fill="#eef3fb"/><rect width="960" height="400" rx="24" fill="url(#df5-dots)"/>

<defs><marker id="df5-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7fb0dc"/></marker></defs>
<path d="M480 190V110q0-40-40-40H210q-40 0-40 40v40" stroke="#9cc3e4" stroke-width="34" fill="none"/>
<path d="M146 140l24 40 24-40z" fill="#9cc3e4"/>
<path d="M480 190V110q0-40-40-40H210q-40 0-40 40v28" stroke="#fff" stroke-width="4" fill="none" class="df5-dr"/>
<text x="325" y="58" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#3a58a0" text-anchor="middle">refine and try again</text>
<g filter="url(#df5-sh)"><rect x="40" y="200" width="260" height="140" rx="16" fill="#0a6ab0" /><text x="170" y="279.36" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">Craft prompt</text></g>
<g filter="url(#df5-sh)"><rect x="350" y="200" width="260" height="140" rx="16" fill="#0a6ab0" /><text x="480" y="263.64" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">Analyse response</text><text x="480" y="293.64" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">and review prompt</text></g>
<g filter="url(#df5-sh)"><rect x="660" y="200" width="260" height="140" rx="16" fill="#0a6ab0" /><text x="790" y="279.36" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">Use output</text></g>
<path d="M308 270h34l-14-14M342 270l-14 14" stroke="#9cc3e4" stroke-width="10" stroke-linecap="round" fill="none"/>
<path d="M618 270h34l-14-14M652 270l-14 14" stroke="#9cc3e4" stroke-width="10" stroke-linecap="round" fill="none"/>
<g class="df5-pu" transform="translate(860 80)"><rect x="-70" y="-26" width="140" height="52" rx="26" fill="#fff" filter="url(#df5-sh2)"/><text y="7" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#3a58a0" text-anchor="middle">v1 → v2 → v3</text></g>
</svg>