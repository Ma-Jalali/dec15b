<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none" role="img" aria-label="A risk map. Across: how likely a problem is. Up: how big the effect would be. Sticky notes: delays to first drafts (likely, big effect), a member is sick (not likely, big effect), the talk is too long (likely, small effect), a slide design problem (not likely, small effect).">
<title>A risk map. Across: how likely a problem is. Up: how big the effect would be. Sticky notes: delays to first drafts (likely, big effect), a member is sick (not likely, big effect), the talk is too long (likely, small effect), a slide design problem (not likely, small effect).</title>
<style>
.dr5-fl{animation:dr5-fl 6s ease-in-out infinite}.dr5-f2{animation-delay:-2s}.dr5-f3{animation-delay:-4s}
@keyframes dr5-fl{50%{translate:0 -6px}}
.dr5-tw{animation:dr5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.dr5-t2{animation-delay:-1.1s}.dr5-t3{animation-delay:-2.2s}
@keyframes dr5-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.dr5-bl{animation:dr5-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.dr5-b2{animation-delay:-1.6s}.dr5-b3{animation-delay:-3.1s}
@keyframes dr5-bl{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.dr5-pu{animation:dr5-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dr5-pu{0%,100%{scale:1}50%{scale:1.08}}
.dr5-dr{stroke-dasharray:6 9;animation:dr5-dr 1.6s linear infinite}
@keyframes dr5-dr{to{stroke-dashoffset:-30}}
.dr5-sp{animation:dr5-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes dr5-sp{to{rotate:360deg}}
.dr5-sw{animation:dr5-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dr5-sw{50%{rotate:3deg}}
.dr5-wv{animation:dr5-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.dr5-w2{animation-delay:-1s}
@keyframes dr5-wv{0%{opacity:0;scale:.7}30%{opacity:.9}100%{opacity:0;scale:1.3}}
.dr5-ty{animation:dr5-ty 1.4s steps(1) infinite}.dr5-y2{animation-delay:-.45s}.dr5-y3{animation-delay:-.9s}
@keyframes dr5-ty{0%,100%{opacity:1}50%{opacity:.2}}
.dr5-sl{animation:dr5-sl 9s ease-in-out infinite}
@keyframes dr5-sl{50%{translate:14px 0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="dr5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f8f6"/><stop offset="1" stop-color="#f3f8f6"/></linearGradient>
<pattern id="dr5-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="dr5-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="dr5-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="dr5-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="dr5-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="dr5-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="dr5-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="dr5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="dr5-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="dr5-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<rect width="960" height="520" rx="24" fill="#f3f8f6"/><rect width="960" height="520" rx="24" fill="url(#dr5-dots)"/>

<defs><marker id="dr5-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14293a"/></marker></defs>
<rect x="150" y="60" width="330" height="200" rx="14" fill="#fbe9c6"/><rect x="490" y="60" width="330" height="200" rx="14" fill="#f6d2c4"/>
<rect x="150" y="270" width="330" height="200" rx="14" fill="#d9eee4"/><rect x="490" y="270" width="330" height="200" rx="14" fill="#dbe5f6"/>
<path d="M130 480V50" stroke="#14293a" stroke-width="4" marker-end="url(#dr5-a)"/><path d="M130 480H860" stroke="#14293a" stroke-width="4" marker-end="url(#dr5-a)"/>
<text x="0" y="0" transform="translate(100 270) rotate(-90)" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#14293a" text-anchor="middle">Bigger effect ↑</text>
<text x="500" y="510" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#14293a" text-anchor="middle">More likely →</text>
<g transform="translate(600 90) rotate(3)" filter="url(#dr5-sh2)"><rect x="0" y="0" width="130" height="130" rx="3" fill="#fff3b0"/><path d="M0 0h130v8H0z" fill="#000" fill-opacity=".05"/><circle cx="65" cy="4" r="3.2" fill="#c4562f"/><text x="65" y="61" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">Delays to</text><text x="65" y="81" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">first drafts</text></g>
<g transform="translate(250 92) rotate(-4)" filter="url(#dr5-sh2)"><rect x="0" y="0" width="130" height="130" rx="3" fill="#ffe1d6"/><path d="M0 0h130v8H0z" fill="#000" fill-opacity=".05"/><circle cx="65" cy="4" r="3.2" fill="#c4562f"/><text x="65" y="61" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">A member</text><text x="65" y="81" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">is sick</text></g>
<g transform="translate(600 300) rotate(-3)" filter="url(#dr5-sh2)"><rect x="0" y="0" width="130" height="130" rx="3" fill="#e6f0ff"/><path d="M0 0h130v8H0z" fill="#000" fill-opacity=".05"/><circle cx="65" cy="4" r="3.2" fill="#c4562f"/><text x="65" y="61" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">The talk is</text><text x="65" y="81" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">too long</text></g>
<g transform="translate(250 302) rotate(4)" filter="url(#dr5-sh2)"><rect x="0" y="0" width="130" height="130" rx="3" fill="#dff5e6"/><path d="M0 0h130v8H0z" fill="#000" fill-opacity=".05"/><circle cx="65" cy="4" r="3.2" fill="#c4562f"/><text x="65" y="61" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">Slide design</text><text x="65" y="81" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">problem</text></g>
<g class="dr5-pu"><text x="808" y="92" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#c4562f" text-anchor="end">deal with first!</text></g>
<g transform="translate(860 120)" class="dr5-fl"><g transform="translate(40 0) scale(1.6)"><circle r="11" fill="#2f7d6b"/><path d="M-5 0l3.5 3.5L5.5-4" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="40" y="44" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#2f7d6b" text-anchor="middle">strategy</text></g>
</svg>