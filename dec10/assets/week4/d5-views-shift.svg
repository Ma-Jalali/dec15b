<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" fill="none" role="img" aria-label="An opinion line from ‘Ecotourism rarely keeps its promises’ to ‘Ecotourism usually keeps its promises’. A grey Monday marker sits on one side, a green Friday marker has moved. Three source cards below push it: Spenceley and Rylance 2021, Mielly 2023, Alom 2023.">
