<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A night desk: a laptop plays the podcast The Climate Question with a moving sound wave, headphones and a notebook with notes, under the moon and stars.">
<title>Listening to write homework: the podcast at night</title>
<style>
.sd1h-fl{animation:sd1h-fl 6s ease-in-out infinite}.sd1h-f2{animation-delay:-2s}.sd1h-f3{animation-delay:-4s}
.sd1h-tw{animation:sd1h-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sd1h-t2{animation-delay:-1s}.sd1h-t3{animation-delay:-2s}
.sd1h-pu{animation:sd1h-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sd1h-dr{stroke-dasharray:7 7;animation:sd1h-dr 1.8s linear infinite}
.sd1h-sw{animation:sd1h-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sd1h-bl{animation:sd1h-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.sd1h-b2{animation-delay:-1.7s}.sd1h-b3{animation-delay:-3.1s}
.sd1h-wv{animation:sd1h-wv 2.4s ease-in-out infinite}.sd1h-w2{animation-delay:-.8s}.sd1h-w3{animation-delay:-1.6s}
.sd1h-sl{animation:sd1h-sl 9s ease-in-out infinite}
.sd1h-sp{animation:sd1h-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes sd1h-fl{50%{transform:translateY(-5px)}}
@keyframes sd1h-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes sd1h-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes sd1h-dr{to{stroke-dashoffset:-28}}
@keyframes sd1h-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sd1h-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sd1h-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes sd1h-sl{50%{transform:translateX(14px)}}
@keyframes sd1h-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
