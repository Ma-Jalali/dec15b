="sd1h-wv " x="196" y="150.0" width="6" height="60" rx="3" fill="#e3a843"/><rect class="sd1h-wv sd1h-w2" x="208" y="162.0" width="6" height="36" rx="3" fill="#e3a843"/><rect class="sd1h-wv sd1h-w3" x="220" y="154.0" width="6" height="52" rx="3" fill="#e3a843"/><rect class="sd1h-wv " x="232" y="168.0" width="6" height="24" rx="3" fill="#e3a843"/><rect class="sd1h-wv sd1h-w2" x="244" y="160.0" width="6" height="40" rx="3" fill="#e3a843"/><rect class="sd1h-wv sd1h-w3" x="256" y="152.0" width="6" height="56" rx="3" fill="#e3a843"/><rect class="sd1h-wv " x="268" y="166.0" width="6" height="28" rx="3" fill="#e3a843"/><rect class="sd1h-wv sd1h-w2" x="280" y="172.0" width="6" height="16" rx="3" fill="#e3a843"/><rect class="sd1h-wv sd1h-w3" x="292" y="164.0" width="6" height="32" rx="3" fill="#e3a843"/><text x="230" y="156" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">The Climate Question</text><g transform="translate(100 200) scale(1.6)"><path d="M-20 4v-6a20 20 0 0 1 40 0v6" stroke="#14293a" stroke-width="4" fill="none"/><rect x="-26" y="0" width="12" height="18" rx="5" fill="#e0673f"/><rect x="14" y="0" width="12" height="18" rx="5" fill="#e0673f"/></g><g filter="url(#sd1h-sh)"><rect x="320" y="196" width="80" height="50" rx="6" fill="#fffdf8" /></g><path d="M330 208h56" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/><path d="M330 218h48" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/><path d="M330 228h40" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/><path d="M330 238h32" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/><g class="sd1h-fl"><path d="M380 236l24-24 5 5-24 24-8 3z" fill="#e3a843"/></g></svg>
