<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A map of Australia with three pins, A, B and C, a suitcase, a plane, and a student asking Which one?">
<title>Listening to write lead-in: choose your holiday</title>
<style>
.sd1l-fl{animation:sd1l-fl 6s ease-in-out infinite}.sd1l-f2{animation-delay:-2s}.sd1l-f3{animation-delay:-4s}
.sd1l-tw{animation:sd1l-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sd1l-t2{animation-delay:-1s}.sd1l-t3{animation-delay:-2s}
.sd1l-pu{animation:sd1l-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sd1l-dr{stroke-dasharray:7 7;animation:sd1l-dr 1.8s linear infinite}
.sd1l-sw{animation:sd1l-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.sd1l-bl{animation:sd1l-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.sd1l-b2{animation-delay:-1.7s}.sd1l-b3{animation-delay:-3.1s}
.sd1l-wv{animation:sd1l-wv 2.4s ease-in-out infinite}.sd1l-w2{animation-delay:-.8s}.sd1l-w3{animation-delay:-1.6s}
.sd1l-sl{animation:sd1l-sl 9s ease-in-out infinite}
.sd1l-sp{animation:sd1l-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes sd1l-fl{50%{transform:translateY(-5px)}}
@keyframes sd1l-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes sd1l-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes sd1l-dr{to{stroke-dashoffset:-28}}
@keyframes sd1l-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sd1l-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sd1l-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes sd1l-sl{50%{transform:translateX(14px)}}
@keyframes sd1l-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
