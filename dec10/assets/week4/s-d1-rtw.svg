<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="An open book with a rainforest, palm trees, a lagoon and a turtle growing out of it, between Goal 2 and Goal 3 badges, and a student reading.">
<title>Reading to write: ecotourism and the SDGs</title>
<style>
.sd1r-fl{animation:sd1r-fl 6s ease-in-out infinite}.sd1r-f2{animation-delay:-2s}.sd1r-f3{animation-delay:-4s}
