<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="Integrated Writing Practice Assessment: a student types an essay at a laptop under exam conditions, with a 90-minute clock split into 30 minutes planning and 60 minutes writing, three blank note sheets and a Submit button">
<title>Integrated Writing Practice Assessment: a student types an essay at a laptop under exam conditions, with a 90-minute clock split into 30 minutes planning and 60 minutes writing, three blank note sheets and a Submit button</title>
<style>
.si42-fl{animation:si42-fl 6s ease-in-out infinite}.si42-f2{animation-delay:-2s}.si42-f3{animation-delay:-4s}
.si42-tw{animation:si42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.si42-t2{animation-delay:-1s}.si42-t3{animation-delay:-2s}
.si42-dr{stroke-dasharray:6 8;animation:si42-dr 1.6s linear infinite}
.si42-pu{animation:si42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.si42-sw{animation:si42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.si42-bl{animation:si42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.si42-b2{animation-delay:-1.7s}.si42-b3{animation-delay:-3.1s}
.si42-wv{animation:si42-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.si42-w2{animation-delay:.9s}.si42-w3{animation-delay:1.8s}
.si42-sp{animation:si42-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.si42-sea{animation:si42-sea 5s ease-in-out infinite}.si42-s2{animation-delay:-2.5s}
.si42-dw{stroke-dasharray:400;animation:si42-dw 5s ease-in-out infinite}
@keyframes si42-fl{50%{transform:translateY(-4px)}}
@keyframes si42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes si42-dr{to{stroke-dashoffset:-28}}
@keyframes si42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes si42-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes si42-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes si42-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes si42-sp{to{transform:rotate(360deg)}}
@keyframes si42-sea{50%{transform:translateX(-10px)}}
@keyframes si42-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
