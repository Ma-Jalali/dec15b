<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="Listening to write: a student with headphones listens to a BBC podcast microphone, writes a summary on a notepad, and three speech bubbles show the host, Buckley and Gossling">
