<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="Mediation: three source cards — Spenceley and Rylance, Alom and Mielly — feed into a synthesis matrix, and a student holds a glowing light bulb: a new, bigger thought">
<title>Mediation: three source cards — Spenceley and Rylance, Alom and Mielly — feed into a synthesis matrix, and a student holds a glowing light bulb: a new, bigger thought</title>
<style>
.sm42-fl{animation:sm42-fl 6s ease-in-out infinite}.sm42-f2{animation-delay:-2s}.sm42-f3{animation-delay:-4s}
.sm42-tw{animation:sm42-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sm42-t2{animation-delay:-1s}.sm42-t3{animation-delay:-2s}
.sm42-dr{stroke-dasharray:6 8;animation:sm42-dr 1.6s linear infinite}
.sm42-pu{animation:sm42-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sm42-sw{animation:sm42-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.sm42-bl{animation:sm42-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.sm42-b2{animation-delay:-1.7s}.sm42-b3{animation-delay:-3.1s}
