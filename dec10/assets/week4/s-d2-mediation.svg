.sm42-sea{animation:sm42-sea 5s ease-in-out infinite}.sm42-s2{animation-delay:-2.5s}
.sm42-dw{stroke-dasharray:400;animation:sm42-dw 5s ease-in-out infinite}
@keyframes sm42-fl{50%{transform:translateY(-4px)}}
@keyframes sm42-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes sm42-dr{to{stroke-dashoffset:-28}}
@keyframes sm42-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
