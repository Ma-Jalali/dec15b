<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A noun factory: verb cards (preserve, displace, implement) ride a conveyor belt into a machine with spinning gears and a screen that says VERB to NOUN; noun cards (preservation, displacement, implementation) come out. A student watches.">
