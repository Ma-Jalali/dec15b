<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A writing workshop: Sample 4.2 stands on an easel with colour-coded sentence bars, a legend shows gold for my voice, teal for external and blue for internal citations, Sample 4.1 is pinned beside it, a desk lamp glows and a student holds up a highlighter.">
