<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A path of six numbered stepping stones climbs to a flag marked IWA, a student waves at the start and a checklist card shows the steps.">
<title>Review the task: the IWA path</title>
<style>
.va1-fl{animation:va1-fl 6s ease-in-out infinite}.va1-f2{animation-delay:-2s}.va1-f3{animation-delay:-4s}
.va1-tw{animation:va1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.va1-t2{animation-delay:-1s}.va1-t3{animation-delay:-2s}
.va1-pu{animation:va1-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.va1-dr{stroke-dasharray:7 7;animation:va1-dr 1.8s linear infinite}
.va1-sw{animation:va1-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.va1-bl{animation:va1-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.va1-b2{animation-delay:-1.7s}.va1-b3{animation-delay:-3.1s}
.va1-wv{animation:va1-wv 2.4s ease-in-out infinite}.va1-w2{animation-delay:-.8s}.va1-w3{animation-delay:-1.6s}
.va1-sl{animation:va1-sl 9s ease-in-out infinite}
.va1-sp{animation:va1-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes va1-fl{50%{transform:translateY(-5px)}}
@keyframes va1-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes va1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes va1-dr{to{stroke-dashoffset:-28}}
@keyframes va1-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes va1-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes va1-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes va1-sl{50%{transform:translateX(14px)}}
@keyframes va1-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
