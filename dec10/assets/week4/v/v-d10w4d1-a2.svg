<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A magnifying glass over an essay question card with the key word and content words highlighted, and three labels: content, limiting, task.">
<title>Analyse the question</title>
<style>
.va2-fl{animation:va2-fl 6s ease-in-out infinite}.va2-f2{animation-delay:-2s}.va2-f3{animation-delay:-4s}
.va2-tw{animation:va2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.va2-t2{animation-delay:-1s}.va2-t3{animation-delay:-2s}
.va2-pu{animation:va2-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.va2-dr{stroke-dasharray:7 7;animation:va2-dr 1.8s linear infinite}
.va2-sw{animation:va2-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.va2-bl{animation:va2-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.va2-b2{animation-delay:-1.7s}.va2-b3{animation-delay:-3.1s}
.va2-wv{animation:va2-wv 2.4s ease-in-out infinite}.va2-w2{animation-delay:-.8s}.va2-w3{animation-delay:-1.6s}
.va2-sl{animation:va2-sl 9s ease-in-out infinite}
.va2-sp{animation:va2-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes va2-fl{50%{transform:translateY(-5px)}}
@keyframes va2-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes va2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes va2-dr{to{stroke-dashoffset:-28}}
@keyframes va2-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes va2-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes va2-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes va2-sl{50%{transform:translateX(14px)}}
@keyframes va2-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="va2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f5ec"/><stop offset="1" stop-color="#d3ecda"/></linearGradient>
