ITING</text><rect x="30" y="156" width="58" height="16" rx="8" fill="#7a4a8c"/><text x="59.0" y="167.5" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">TASK</text><path class="va2-tw " d="M206 35L207.5 38.5L211 40L207.5 41.5L206 45L204.5 41.5L201 40L204.5 38.5z" fill="#e3a843"/><path class="va2-tw va2-t2" d="M40 32L41.2 34.8L44 36L41.2 37.2L40 40L38.8 37.2L36 36L38.8 34.8z" fill="#13887a"/></svg>
