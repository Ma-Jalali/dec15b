<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="An essay page split into four coloured paragraphs, each linked by a dotted line to a label: Intro, Body 1, Body 2, Conclusion.">
<title>Analysing rhetorical function by paragraph</title>
<style>
.va3-fl{animation:va3-fl 6s ease-in-out infinite}.va3-f2{animation-delay:-2s}.va3-f3{animation-delay:-4s}
.va3-tw{animation:va3-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.va3-t2{animation-delay:-1s}.va3-t3{animation-delay:-2s}
.va3-pu{animation:va3-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.va3-dr{stroke-dasharray:7 7;animation:va3-dr 1.8s linear infinite}
.va3-sw{animation:va3-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.va3-bl{animation:va3-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.va3-b2{animation-delay:-1.7s}.va3-b3{animation-delay:-3.1s}
.va3-wv{animation:va3-wv 2.4s ease-in-out infinite}.va3-w2{animation-delay:-.8s}.va3-w3{animation-delay:-1.6s}
.va3-sl{animation:va3-sl 9s ease-in-out infinite}
.va3-sp{animation:va3-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes va3-fl{50%{transform:translateY(-5px)}}
@keyframes va3-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes va3-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes va3-dr{to{stroke-dashoffset:-28}}
@keyframes va3-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes va3-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes va3-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes va3-sl{50%{transform:translateX(14px)}}
@keyframes va3-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
