<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A page with highlighted lines beside a row of falling dominoes labelled SO, SO, SO — one cause leads to the next effect.">
<title>Introduction and Body 1: the consequence chain</title>
<style>
.va4-fl{animation:va4-fl 6s ease-in-out infinite}.va4-f2{animation-delay:-2s}.va4-f3{animation-delay:-4s}
.va4-tw{animation:va4-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.va4-t2{animation-delay:-1s}.va4-t3{animation-delay:-2s}
.va4-pu{animation:va4-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.va4-dr{stroke-dasharray:7 7;animation:va4-dr 1.8s linear infinite}
.va4-sw{animation:va4-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.va4-bl{animation:va4-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.va4-b2{animation-delay:-1.7s}.va4-b3{animation-delay:-3.1s}
.va4-wv{animation:va4-wv 2.4s ease-in-out infinite}.va4-w2{animation-delay:-.8s}.va4-w3{animation-delay:-1.6s}
.va4-sl{animation:va4-sl 9s ease-in-out infinite}
.va4-sp{animation:va4-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes va4-fl{50%{transform:translateY(-5px)}}
@keyframes va4-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes va4-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes va4-dr{to{stroke-dashoffset:-28}}
@keyframes va4-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes va4-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes va4-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes va4-sl{50%{transform:translateX(14px)}}
@keyframes va4-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
