<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A small text map: boxes joined by dotted arrows, some with dashed outlines and numbers waiting to be filled, and a pencil.">
<title>Body 2, conclusion and the text map</title>
<style>
.va5-fl{animation:va5-fl 6s ease-in-out infinite}.va5-f2{animation-delay:-2s}.va5-f3{animation-delay:-4s}
.va5-tw{animation:va5-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.va5-t2{animation-delay:-1s}.va5-t3{animation-delay:-2s}
.va5-pu{animation:va5-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.va5-dr{stroke-dasharray:7 7;animation:va5-dr 1.8s linear infinite}
.va5-sw{animation:va5-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.va5-bl{animation:va5-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.va5-b2{animation-delay:-1.7s}.va5-b3{animation-delay:-3.1s}
.va5-wv{animation:va5-wv 2.4s ease-in-out infinite}.va5-w2{animation-delay:-.8s}.va5-w3{animation-delay:-1.6s}
.va5-sl{animation:va5-sl 9s ease-in-out infinite}
.va5-sp{animation:va5-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes va5-fl{50%{transform:translateY(-5px)}}
@keyframes va5-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes va5-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes va5-dr{to{stroke-dashoffset:-28}}
@keyframes va5-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes va5-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes va5-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes va5-sl{50%{transform:translateX(14px)}}
@keyframes va5-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
