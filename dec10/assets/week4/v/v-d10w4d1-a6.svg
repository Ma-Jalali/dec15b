<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A certainty dial from careful in green to certain in red, with a needle and two speech bubbles saying may and likely.">
<title>Language focus: hedging</title>
<style>
.va6-fl{animation:va6-fl 6s ease-in-out infinite}.va6-f2{animation-delay:-2s}.va6-f3{animation-delay:-4s}
.va6-tw{animation:va6-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.va6-t2{animation-delay:-1s}.va6-t3{animation-delay:-2s}
.va6-pu{animation:va6-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.va6-dr{stroke-dasharray:7 7;animation:va6-dr 1.8s linear infinite}
.va6-sw{animation:va6-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.va6-bl{animation:va6-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.va6-b2{animation-delay:-1.7s}.va6-b3{animation-delay:-3.1s}
.va6-wv{animation:va6-wv 2.4s ease-in-out infinite}.va6-w2{animation-delay:-.8s}.va6-w3{animation-delay:-1.6s}
.va6-sl{animation:va6-sl 9s ease-in-out infinite}
.va6-sp{animation:va6-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes va6-fl{50%{transform:translateY(-5px)}}
@keyframes va6-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes va6-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes va6-dr{to{stroke-dashoffset:-28}}
@keyframes va6-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes va6-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes va6-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes va6-sl{50%{transform:translateX(14px)}}
@keyframes va6-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
