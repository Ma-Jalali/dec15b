<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Three students talk around a table with a notes card; thought bubbles show a leaf and a plane.">
<title>Preliminary guided discussion</title>
<style>
.vb1-fl{animation:vb1-fl 6s ease-in-out infinite}.vb1-f2{animation-delay:-2s}.vb1-f3{animation-delay:-4s}
.vb1-tw{animation:vb1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb1-t2{animation-delay:-1s}.vb1-t3{animation-delay:-2s}
.vb1-pu{animation:vb1-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vb1-dr{stroke-dasharray:7 7;animation:vb1-dr 1.8s linear infinite}
.vb1-sw{animation:vb1-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vb1-bl{animation:vb1-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vb1-b2{animation-delay:-1.7s}.vb1-b3{animation-delay:-3.1s}
.vb1-wv{animation:vb1-wv 2.4s ease-in-out infinite}.vb1-w2{animation-delay:-.8s}.vb1-w3{animation-delay:-1.6s}
.vb1-sl{animation:vb1-sl 9s ease-in-out infinite}
.vb1-sp{animation:vb1-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb1-fl{50%{transform:translateY(-5px)}}
@keyframes vb1-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vb1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vb1-dr{to{stroke-dashoffset:-28}}
@keyframes vb1-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vb1-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vb1-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vb1-sl{50%{transform:translateX(14px)}}
@keyframes vb1-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
