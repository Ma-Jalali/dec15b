<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two small phones: one shows an empty lagoon and a heart, the other the same lagoon full of people and the word queue.">
<title>Warmer: Instagram versus reality</title>
<style>
.vb2-fl{animation:vb2-fl 6s ease-in-out infinite}.vb2-f2{animation-delay:-2s}.vb2-f3{animation-delay:-4s}
.vb2-tw{animation:vb2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb2-t2{animation-delay:-1s}.vb2-t3{animation-delay:-2s}
.vb2-pu{animation:vb2-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vb2-dr{stroke-dasharray:7 7;animation:vb2-dr 1.8s linear infinite}
.vb2-sw{animation:vb2-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vb2-bl{animation:vb2-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vb2-b2{animation-delay:-1.7s}.vb2-b3{animation-delay:-3.1s}
.vb2-wv{animation:vb2-wv 2.4s ease-in-out infinite}.vb2-w2{animation-delay:-.8s}.vb2-w3{animation-delay:-1.6s}
.vb2-sl{animation:vb2-sl 9s ease-in-out infinite}
.vb2-sp{animation:vb2-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb2-fl{50%{transform:translateY(-5px)}}
@keyframes vb2-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vb2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vb2-dr{to{stroke-dashoffset:-28}}
@keyframes vb2-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vb2-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vb2-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vb2-sl{50%{transform:translateX(14px)}}
@keyframes vb2-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
