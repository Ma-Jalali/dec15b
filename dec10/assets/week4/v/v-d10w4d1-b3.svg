" y="76" font-family="Manrope, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#fff" text-anchor="middle">conservation</text></g><g transform="translate(80 136) scale(0.45)" class=""><rect x="-4" y="-30" width="8" height="30" rx="3" fill="url(#vb3-wood)"/><circle cx="0" cy="-46" r="22" fill="url(#vb3-leaf)"/><circle cx="-14" cy="-36" r="14" fill="url(#vb3-leaf)"/><circle cx="14" cy="-36" r="14" fill="url(#vb3-leaf)"/><circle cx="-6" cy="-54" r="8" fill="#fff" opacity=".15"/></g><g transform="translate(160 128) scale(0.6)" class=""><ellipse cx="22" cy="-2" rx="8" ry="6" fill="#7fae5c"/><path d="M-14 -10l-12-8M-14 8l-12 8M10 -12l8-10M10 10l8 10" stroke="#7fae5c" stroke-width="6" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="18" ry="14" fill="#5b8a3a"/><path d="M-10 -6l10-6 10 6v8l-10 6-10-6z" fill="#86b35c" stroke="#3f6a26" stroke-width="1.4"/><circle cx="25" cy="-4" r="1.4" fill="#14293a"/></g><path class="vb3-tw " d="M214 96L215.2 98.8L218 100L215.2 101.2L214 104L212.8 101.2L210 100L212.8 98.8z" fill="#e3a843"/></svg>
