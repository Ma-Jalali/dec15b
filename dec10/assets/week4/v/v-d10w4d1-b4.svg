<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="An open book with two goal badges rising from it, Goal 2 in yellow and Goal 3 in green, and a magnifying glass skimming the lines.">
<title>Reading for gist</title>
<style>
.vb4-fl{animation:vb4-fl 6s ease-in-out infinite}.vb4-f2{animation-delay:-2s}.vb4-f3{animation-delay:-4s}
.vb4-tw{animation:vb4-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb4-t2{animation-delay:-1s}.vb4-t3{animation-delay:-2s}
.vb4-pu{animation:vb4-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vb4-dr{stroke-dasharray:7 7;animation:vb4-dr 1.8s linear infinite}
.vb4-sw{animation:vb4-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vb4-bl{animation:vb4-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vb4-b2{animation-delay:-1.7s}.vb4-b3{animation-delay:-3.1s}
.vb4-wv{animation:vb4-wv 2.4s ease-in-out infinite}.vb4-w2{animation-delay:-.8s}.vb4-w3{animation-delay:-1.6s}
.vb4-sl{animation:vb4-sl 9s ease-in-out infinite}
.vb4-sp{animation:vb4-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb4-fl{50%{transform:translateY(-5px)}}
@keyframes vb4-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vb4-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vb4-dr{to{stroke-dashoffset:-28}}
@keyframes vb4-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vb4-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vb4-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vb4-sl{50%{transform:translateX(14px)}}
@keyframes vb4-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
