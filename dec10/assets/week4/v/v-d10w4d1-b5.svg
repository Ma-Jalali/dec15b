<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two jigsaw pieces, Goal 2 and Goal 3, fit together above a four-column notes table and a pencil.">
<title>Jigsaw reading: take notes on your goal</title>
<style>
.vb5-fl{animation:vb5-fl 6s ease-in-out infinite}.vb5-f2{animation-delay:-2s}.vb5-f3{animation-delay:-4s}
.vb5-tw{animation:vb5-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb5-t2{animation-delay:-1s}.vb5-t3{animation-delay:-2s}
.vb5-pu{animation:vb5-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vb5-dr{stroke-dasharray:7 7;animation:vb5-dr 1.8s linear infinite}
.vb5-sw{animation:vb5-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vb5-bl{animation:vb5-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vb5-b2{animation-delay:-1.7s}.vb5-b3{animation-delay:-3.1s}
.vb5-wv{animation:vb5-wv 2.4s ease-in-out infinite}.vb5-w2{animation-delay:-.8s}.vb5-w3{animation-delay:-1.6s}
.vb5-sl{animation:vb5-sl 9s ease-in-out infinite}
.vb5-sp{animation:vb5-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb5-fl{50%{transform:translateY(-5px)}}
@keyframes vb5-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vb5-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vb5-dr{to{stroke-dashoffset:-28}}
@keyframes vb5-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vb5-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vb5-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vb5-sl{50%{transform:translateX(14px)}}
@keyframes vb5-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="vb5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf2fb"/><stop offset="1" stop-color="#d7e2f6"/></linearGradient>
<radialGradient id="vb5-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="vb5-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#3a58a0" fill-opacity=".14"/></pattern>
<filter id="vb5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vb5-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="vb5-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="vb5-leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fbf6b"/><stop offset="1" stop-color="#2f7d4f"/></linearGradient>
<linearGradient id="vb5-leaf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad37a"/><stop offset="1" stop-color="#4c9a3e"/></linearGradient>
<linearGradient id="vb5-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0d0"/><stop offset="1" stop-color="#1d7fa5"/></linearGradient>
<linearGradient id="vb5-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6f5"/><stop offset="1" stop-color="#fdf1d6"/></linearGradient>
<linearGradient id="vb5-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99a62"/><stop offset="1" stop-color="#8a5f34"/></linearGradient>
<linearGradient id="vb5-tone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a58a0"/><stop offset="1" stop-color="#1f3363"/></linearGradient>
<radialGradient id="vb5-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#e3a843"/><stop offset="1" stop-color="#e3a843" stop-opacity="0"/></radialGradient>

</defs>
