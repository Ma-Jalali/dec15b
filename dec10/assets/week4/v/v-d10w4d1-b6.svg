<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two students from different groups explain their goals to each other with speech bubbles, swapping a small notes card.">
<title>Sharing understanding</title>
<style>
.vb6-fl{animation:vb6-fl 6s ease-in-out infinite}.vb6-f2{animation-delay:-2s}.vb6-f3{animation-delay:-4s}
.vb6-tw{animation:vb6-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb6-t2{animation-delay:-1s}.vb6-t3{animation-delay:-2s}
.vb6-pu{animation:vb6-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vb6-dr{stroke-dasharray:7 7;animation:vb6-dr 1.8s linear infinite}
.vb6-sw{animation:vb6-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vb6-bl{animation:vb6-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vb6-b2{animation-delay:-1.7s}.vb6-b3{animation-delay:-3.1s}
.vb6-wv{animation:vb6-wv 2.4s ease-in-out infinite}.vb6-w2{animation-delay:-.8s}.vb6-w3{animation-delay:-1.6s}
.vb6-sl{animation:vb6-sl 9s ease-in-out infinite}
.vb6-sp{animation:vb6-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb6-fl{50%{transform:translateY(-5px)}}
@keyframes vb6-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vb6-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vb6-dr{to{stroke-dashoffset:-28}}
@keyframes vb6-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vb6-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vb6-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vb6-sl{50%{transform:translateX(14px)}}
@keyframes vb6-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
