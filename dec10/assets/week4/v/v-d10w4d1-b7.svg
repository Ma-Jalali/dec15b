<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="An answer sheet with six rows of A to D bubbles, one filled in each row, and a green tick badge.">
<title>Building understanding: test practice</title>
<style>
.vb7-fl{animation:vb7-fl 6s ease-in-out infinite}.vb7-f2{animation-delay:-2s}.vb7-f3{animation-delay:-4s}
.vb7-tw{animation:vb7-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb7-t2{animation-delay:-1s}.vb7-t3{animation-delay:-2s}
.vb7-pu{animation:vb7-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vb7-dr{stroke-dasharray:7 7;animation:vb7-dr 1.8s linear infinite}
.vb7-sw{animation:vb7-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vb7-bl{animation:vb7-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vb7-b2{animation-delay:-1.7s}.vb7-b3{animation-delay:-3.1s}
.vb7-wv{animation:vb7-wv 2.4s ease-in-out infinite}.vb7-w2{animation-delay:-.8s}.vb7-w3{animation-delay:-1.6s}
.vb7-sl{animation:vb7-sl 9s ease-in-out infinite}
.vb7-sp{animation:vb7-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb7-fl{50%{transform:translateY(-5px)}}
@keyframes vb7-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vb7-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vb7-dr{to{stroke-dashoffset:-28}}
@keyframes vb7-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vb7-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vb7-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vb7-sl{50%{transform:translateX(14px)}}
@keyframes vb7-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
