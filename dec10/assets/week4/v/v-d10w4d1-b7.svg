<linearGradient id="vb7-tone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a58a0"/><stop offset="1" stop-color="#1f3363"/></linearGradient>
<radialGradient id="vb7-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#e3a843"/><stop offset="1" stop-color="#e3a843" stop-opacity="0"/></radialGradient>

