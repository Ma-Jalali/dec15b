<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A balance scale weighing two map pins labelled feasible and effective, with a third pin on top.">
<title>Criticality: evaluate an initiative</title>
<style>
.vb9-fl{animation:vb9-fl 6s ease-in-out infinite}.vb9-f2{animation-delay:-2s}.vb9-f3{animation-delay:-4s}
.vb9-tw{animation:vb9-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb9-t2{animation-delay:-1s}.vb9-t3{animation-delay:-2s}
.vb9-pu{animation:vb9-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vb9-dr{stroke-dasharray:7 7;animation:vb9-dr 1.8s linear infinite}
.vb9-sw{animation:vb9-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vb9-bl{animation:vb9-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vb9-b2{animation-delay:-1.7s}.vb9-b3{animation-delay:-3.1s}
.vb9-wv{animation:vb9-wv 2.4s ease-in-out infinite}.vb9-w2{animation-delay:-.8s}.vb9-w3{animation-delay:-1.6s}
.vb9-sl{animation:vb9-sl 9s ease-in-out infinite}
.vb9-sp{animation:vb9-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb9-fl{50%{transform:translateY(-5px)}}
@keyframes vb9-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vb9-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vb9-dr{to{stroke-dashoffset:-28}}
@keyframes vb9-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vb9-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vb9-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vb9-sl{50%{transform:translateX(14px)}}
@keyframes vb9-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
