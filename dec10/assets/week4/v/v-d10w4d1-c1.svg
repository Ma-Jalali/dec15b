"#3a58a0"/><path d="M164 92l14-10" stroke="#fff" stroke-width="2"/></g><g transform="translate(212 132) scale(0.4)" class=""><rect x="-4" y="-30" width="8" height="30" rx="3" fill="url(#vc1-wood)"/><circle cx="0" cy="-46" r="22" fill="url(#vc1-leaf)"/><circle cx="-14" cy="-36" r="14" fill="url(#vc1-leaf)"/><circle cx="14" cy="-36" r="14" fill="url(#vc1-leaf)"/><circle cx="-6" cy="-54" r="8" fill="#fff" opacity=".15"/></g><circle cx="50" cy="150" r="9" fill="#e0673f"/><circle cx="50" cy="150" r="6" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="50" y="153.6" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">A</text><circle cx="111" cy="150" r="9" fill="#b07d12"/><circle cx="111" cy="150" r="6" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="111" y="153.6" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">B</text><circle cx="178" cy="150" r="9" fill="#4c7a2e"/><circle cx="178" cy="150" r="6" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="178" y="153.6" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">C</text><g class="vc1-sw"><rect x="102" y="30" width="36" height="26" rx="5" fill="#e0673f"/><path d="M112 30v-6h16v6" stroke="#14293a" stroke-width="3"/></g><path class="vc1-tw " d="M160 34L161.8 38.2L166 40L161.8 41.8L160 46L158.2 41.8L154 40L158.2 38.2z" fill="#e3a843"/><path class="vc1-tw vc1-t2" d="M80 32L81.2 34.8L84 36L81.2 37.2L80 40L78.8 37.2L76 36L78.8 34.8z" fill="#13887a"/></svg>
