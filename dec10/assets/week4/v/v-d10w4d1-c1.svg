<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A suitcase above three places to stay: a tall beach hotel A, an outback hotel B and a small eco house C among trees.">
<title>Lead-in: choose your stay</title>
<style>
.vc1-fl{animation:vc1-fl 6s ease-in-out infinite}.vc1-f2{animation-delay:-2s}.vc1-f3{animation-delay:-4s}
.vc1-tw{animation:vc1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vc1-t2{animation-delay:-1s}.vc1-t3{animation-delay:-2s}
.vc1-pu{animation:vc1-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vc1-dr{stroke-dasharray:7 7;animation:vc1-dr 1.8s linear infinite}
.vc1-sw{animation:vc1-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vc1-bl{animation:vc1-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vc1-b2{animation-delay:-1.7s}.vc1-b3{animation-delay:-3.1s}
.vc1-wv{animation:vc1-wv 2.4s ease-in-out infinite}.vc1-w2{animation-delay:-.8s}.vc1-w3{animation-delay:-1.6s}
.vc1-sl{animation:vc1-sl 9s ease-in-out infinite}
.vc1-sp{animation:vc1-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vc1-fl{50%{transform:translateY(-5px)}}
@keyframes vc1-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vc1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vc1-dr{to{stroke-dashoffset:-28}}
@keyframes vc1-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vc1-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vc1-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vc1-sl{50%{transform:translateX(14px)}}
@keyframes vc1-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="vc1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f4ef"/><stop offset="1" stop-color="#cfe9e1"/></linearGradient>
<radialGradient id="vc1-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="vc1-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#13887a" fill-opacity=".14"/></pattern>
<filter id="vc1-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vc1-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="vc1-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="vc1-leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fbf6b"/><stop offset="1" stop-color="#2f7d4f"/></linearGradient>
<linearGradient id="vc1-leaf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad37a"/><stop offset="1" stop-color="#4c9a3e"/></linearGradient>
<linearGradient id="vc1-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0d0"/><stop offset="1" stop-color="#1d7fa5"/></linearGradient>
<linearGradient id="vc1-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6f5"/><stop offset="1" stop-color="#fdf1d6"/></linearGradient>
<linearGradient id="vc1-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99a62"/><stop offset="1" stop-color="#8a5f34"/></linearGradient>
<linearGradient id="vc1-tone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13887a"/><stop offset="1" stop-color="#0b4f47"/></linearGradient>
<radialGradient id="vc1-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#e3a843"/><stop offset="1" stop-color="#e3a843" stop-opacity="0"/></radialGradient>

</defs>
