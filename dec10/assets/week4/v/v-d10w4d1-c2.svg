<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Three speech bubbles, Wi-Fi, pool and towels, flow into one summary card that starts Most of us.">
<title>Summarise your discussion</title>
<style>
.vc2-fl{animation:vc2-fl 6s ease-in-out infinite}.vc2-f2{animation-delay:-2s}.vc2-f3{animation-delay:-4s}
.vc2-tw{animation:vc2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vc2-t2{animation-delay:-1s}.vc2-t3{animation-delay:-2s}
.vc2-pu{animation:vc2-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vc2-dr{stroke-dasharray:7 7;animation:vc2-dr 1.8s linear infinite}
.vc2-sw{animation:vc2-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vc2-bl{animation:vc2-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vc2-b2{animation-delay:-1.7s}.vc2-b3{animation-delay:-3.1s}
.vc2-wv{animation:vc2-wv 2.4s ease-in-out infinite}.vc2-w2{animation-delay:-.8s}.vc2-w3{animation-delay:-1.6s}
.vc2-sl{animation:vc2-sl 9s ease-in-out infinite}
.vc2-sp{animation:vc2-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vc2-fl{50%{transform:translateY(-5px)}}
@keyframes vc2-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vc2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vc2-dr{to{stroke-dashoffset:-28}}
@keyframes vc2-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vc2-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vc2-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vc2-sl{50%{transform:translateX(14px)}}
@keyframes vc2-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
