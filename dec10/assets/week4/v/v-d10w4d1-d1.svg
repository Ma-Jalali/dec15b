stroke-width="2"/><circle cx="182" cy="112" r="4" fill="#2d7a9a"/><text x="182" y="156" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#2d7a9a" text-anchor="middle">ripples</text></svg>
