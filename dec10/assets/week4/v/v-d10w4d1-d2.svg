<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Headphones send out sound waves towards a card listing four main ideas numbered one to four.">
<title>Listening for gist</title>
<style>
.vd2-fl{animation:vd2-fl 6s ease-in-out infinite}.vd2-f2{animation-delay:-2s}.vd2-f3{animation-delay:-4s}
.vd2-tw{animation:vd2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd2-t2{animation-delay:-1s}.vd2-t3{animation-delay:-2s}
.vd2-pu{animation:vd2-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vd2-dr{stroke-dasharray:7 7;animation:vd2-dr 1.8s linear infinite}
.vd2-sw{animation:vd2-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vd2-bl{animation:vd2-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vd2-b2{animation-delay:-1.7s}.vd2-b3{animation-delay:-3.1s}
.vd2-wv{animation:vd2-wv 2.4s ease-in-out infinite}.vd2-w2{animation-delay:-.8s}.vd2-w3{animation-delay:-1.6s}
.vd2-sl{animation:vd2-sl 9s ease-in-out infinite}
.vd2-sp{animation:vd2-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd2-fl{50%{transform:translateY(-5px)}}
@keyframes vd2-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vd2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vd2-dr{to{stroke-dashoffset:-28}}
@keyframes vd2-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vd2-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vd2-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vd2-sl{50%{transform:translateX(14px)}}
@keyframes vd2-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="vd2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcf5e6"/><stop offset="1" stop-color="#f6e6c2"/></linearGradient>
<radialGradient id="vd2-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="vd2-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#b07d12" fill-opacity=".14"/></pattern>
<filter id="vd2-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vd2-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="vd2-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="vd2-leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fbf6b"/><stop offset="1" stop-color="#2f7d4f"/></linearGradient>
<linearGradient id="vd2-leaf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad37a"/><stop offset="1" stop-color="#4c9a3e"/></linearGradient>
<linearGradient id="vd2-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0d0"/><stop offset="1" stop-color="#1d7fa5"/></linearGradient>
<linearGradient id="vd2-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6f5"/><stop offset="1" stop-color="#fdf1d6"/></linearGradient>
<linearGradient id="vd2-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99a62"/><stop offset="1" stop-color="#8a5f34"/></linearGradient>
<linearGradient id="vd2-tone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b07d12"/><stop offset="1" stop-color="#6b4a07"/></linearGradient>
<radialGradient id="vd2-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#e3a843"/><stop offset="1" stop-color="#e3a843" stop-opacity="0"/></radialGradient>

</defs>
<clipPath id="vd2-clip"><path d="M52 18C92 4 172 8 204 30c24 16 26 46 20 76-6 32-30 54-70 58-38 4-90 4-118-12C12 136 8 104 14 74c6-28 14-46 38-56z"/></clipPath><path d="M52 18C92 4 172 8 204 30c24 16 26 46 20 76-6 32-30 54-70 58-38 4-90 4-118-12C12 136 8 104 14 74c6-28 14-46 38-56z" fill="url(#vd2-bg)"/><g clip-path="url(#vd2-clip)"><rect width="240" height="180" fill="url(#vd2-dots)"/><ellipse cx="116" cy="72" rx="110" ry="70" fill="url(#vd2-glow)"/></g><path d="M52 18C92 4 172 8 204 30c24 16 26 46 20 76-6 32-30 54-70 58-38 4-90 4-118-12C12 136 8 104 14 74c6-28 14-46 38-56z" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/><ellipse cx="120" cy="162" rx="92" ry="6" fill="#14293a" opacity=".11" filter="url(#vd2-blur)"/><g transform="translate(70 60) scale(1.5)"><path d="M-20 4v-6a20 20 0 0 1 40 0v6" stroke="#14293a" stroke-width="4" fill="none"/><rect x="-26" y="0" width="12" height="18" rx="5" fill="#e0673f"/><rect x="14" y="0" width="12" height="18" rx="5" fill="#e0673f"/></g><path class="vd2-wv " d="M104 82a10 10 0 0 1 0 20" stroke="#b07d12" stroke-width="2.6" stroke-linecap="round"/><path class="vd2-wv vd2-w2" d="M104 74a18 18 0 0 1 0 36" stroke="#b07d12" stroke-width="2.6" stroke-linecap="round"/><path class="vd2-wv vd2-w3" d="M104 66a26 26 0 0 1 0 52" stroke="#b07d12" stroke-width="2.6" stroke-linecap="round"/><g filter="url(#vd2-sh)"><rect x="126" y="30" width="92" height="120" rx="10" fill="#fff" /></g><circle cx="142" cy="52" r="9" fill="#b07d12"/><circle cx="142" cy="52" r="6" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="142" y="55.6" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">1</text><path d="M156 52h52" stroke="#c8d4da" stroke-width="3" stroke-linecap="round"/><circle cx="142" cy="78" r="9" fill="#2d7a9a"/><circle cx="142" cy="78" r="6" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="142" y="81.6" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">2</text><path d="M156 78h52" stroke="#c8d4da" stroke-width="3" stroke-linecap="round"/><circle cx="142" cy="104" r="9" fill="#7a4a8c"/><circle cx="142" cy="104" r="6" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="142" y="107.6" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">3</text><path d="M156 104h52" stroke="#c8d4da" stroke-width="3" stroke-linecap="round"/><circle cx="142" cy="130" r="9" fill="#e0673f"/><circle cx="142" cy="130" r="6" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="142" y="133.6" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">4</text><path d="M156 130h52" stroke="#c8d4da" stroke-width="3" stroke-linecap="round"/><path class="vd2-tw " d="M30 135L31.5 138.5L35 140L31.5 141.5L30 145L28.5 141.5L25 140L28.5 138.5z" fill="#e3a843"/></svg>
