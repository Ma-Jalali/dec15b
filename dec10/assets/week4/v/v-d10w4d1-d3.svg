<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A notebook page with five bullet lines, each tagged R, H or S for the speaker, a pencil and headphones.">
<title>Note-taking with the Sentence Method</title>
<style>
.vd3-fl{animation:vd3-fl 6s ease-in-out infinite}.vd3-f2{animation-delay:-2s}.vd3-f3{animation-delay:-4s}
.vd3-tw{animation:vd3-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd3-t2{animation-delay:-1s}.vd3-t3{animation-delay:-2s}
.vd3-pu{animation:vd3-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vd3-dr{stroke-dasharray:7 7;animation:vd3-dr 1.8s linear infinite}
.vd3-sw{animation:vd3-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vd3-bl{animation:vd3-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vd3-b2{animation-delay:-1.7s}.vd3-b3{animation-delay:-3.1s}
.vd3-wv{animation:vd3-wv 2.4s ease-in-out infinite}.vd3-w2{animation-delay:-.8s}.vd3-w3{animation-delay:-1.6s}
.vd3-sl{animation:vd3-sl 9s ease-in-out infinite}
.vd3-sp{animation:vd3-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd3-fl{50%{transform:translateY(-5px)}}
@keyframes vd3-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vd3-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vd3-dr{to{stroke-dashoffset:-28}}
@keyframes vd3-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vd3-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vd3-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vd3-sl{50%{transform:translateX(14px)}}
@keyframes vd3-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="vd3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcf5e6"/><stop offset="1" stop-color="#f6e6c2"/></linearGradient>
<radialGradient id="vd3-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="vd3-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#b07d12" fill-opacity=".14"/></pattern>
<filter id="vd3-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vd3-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="vd3-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="vd3-leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fbf6b"/><stop offset="1" stop-color="#2f7d4f"/></linearGradient>
<linearGradient id="vd3-leaf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad37a"/><stop offset="1" stop-color="#4c9a3e"/></linearGradient>
<linearGradient id="vd3-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0d0"/><stop offset="1" stop-color="#1d7fa5"/></linearGradient>
<linearGradient id="vd3-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6f5"/><stop offset="1" stop-color="#fdf1d6"/></linearGradient>
<linearGradient id="vd3-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99a62"/><stop offset="1" stop-color="#8a5f34"/></linearGradient>
<linearGradient id="vd3-tone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b07d12"/><stop offset="1" stop-color="#6b4a07"/></linearGradient>
<radialGradient id="vd3-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#e3a843"/><stop offset="1" stop-color="#e3a843" stop-opacity="0"/></radialGradient>

</defs>
<clipPath id="vd3-clip"><path d="M52 18C92 4 172 8 204 30c24 16 26 46 20 76-6 32-30 54-70 58-38 4-90 4-118-12C12 136 8 104 14 74c6-28 14-46 38-56z"/></clipPath><path d="M52 18C92 4 172 8 204 30c24 16 26 46 20 76-6 32-30 54-70 58-38 4-90 4-118-12C12 136 8 104 14 74c6-28 14-46 38-56z" fill="url(#vd3-bg)"/><g clip-path="url(#vd3-clip)"><rect width="240" height="180" fill="url(#vd3-dots)"/><ellipse cx="116" cy="72" rx="110" ry="70" fill="url(#vd3-glow)"/></g><path d="M52 18C92 4 172 8 204 30c24 16 26 46 20 76-6 32-30 54-70 58-38 4-90 4-118-12C12 136 8 104 14 74c6-28 14-46 38-56z" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/><ellipse cx="120" cy="162" rx="92" ry="6" fill="#14293a" opacity=".11" filter="url(#vd3-blur)"/><g filter="url(#vd3-sh)"><rect x="46" y="20" width="150" height="144" rx="10" fill="#fffdf8" /></g><path d="M70 20v144" stroke="#f0a59a" stroke-width="1.5"/><circle cx="58" cy="42" r="8" fill="#13887a"/><circle cx="58" cy="42" r="5" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="58" y="45.24" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">R</text><circle cx="78" cy="42" r="2" fill="#14293a"/><path d="M86 42h90" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/><circle cx="58" cy="66" r="8" fill="#7a4a8c"/><circle cx="58" cy="66" r="5" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="58" y="69.24" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">H</text><circle cx="78" cy="66" r="2" fill="#14293a"/><path d="M86 66h66" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/><circle cx="58" cy="90" r="8" fill="#e0673f"/><circle cx="58" cy="90" r="5" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="58" y="93.24" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">S</text><circle cx="78" cy="90" r="2" fill="#14293a"/><path d="M86 90h90" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/><circle cx="58" cy="114" r="8" fill="#e0673f"/><circle cx="58" cy="114" r="5" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="58" y="117.24" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">S</text><circle cx="78" cy="114" r="2" fill="#14293a"/><path d="M86 114h66" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/><circle cx="58" cy="138" r="8" fill="#13887a"/><circle cx="58" cy="138" r="5" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><text x="58" y="141.24" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">R</text><circle cx="78" cy="138" r="2" fill="#14293a"/><path d="M86 138h90" stroke="#9fb3c4" stroke-width="3" stroke-linecap="round"/><g class="vd3-fl"><path d="M184 120l30-30 6 6-30 30-10 4z" fill="#e3a843"/></g><g transform="translate(206 44) scale(0.8)"><path d="M-20 4v-6a20 20 0 0 1 40 0v6" stroke="#14293a" stroke-width="4" fill="none"/><rect x="-26" y="0" width="12" height="18" rx="5" fill="#e0673f"/><rect x="14" y="0" width="12" height="18" rx="5" fill="#e0673f"/></g></svg>
