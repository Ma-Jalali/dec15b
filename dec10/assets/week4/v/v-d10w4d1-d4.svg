<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A summary page with coloured highlighted lines and a column of five glowing checker lights, and a pen writing.">
<title>Summarise and paraphrase</title>
<style>
.vd4-fl{animation:vd4-fl 6s ease-in-out infinite}.vd4-f2{animation-delay:-2s}.vd4-f3{animation-delay:-4s}
.vd4-tw{animation:vd4-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd4-t2{animation-delay:-1s}.vd4-t3{animation-delay:-2s}
.vd4-pu{animation:vd4-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vd4-dr{stroke-dasharray:7 7;animation:vd4-dr 1.8s linear infinite}
.vd4-sw{animation:vd4-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vd4-bl{animation:vd4-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vd4-b2{animation-delay:-1.7s}.vd4-b3{animation-delay:-3.1s}
.vd4-wv{animation:vd4-wv 2.4s ease-in-out infinite}.vd4-w2{animation-delay:-.8s}.vd4-w3{animation-delay:-1.6s}
.vd4-sl{animation:vd4-sl 9s ease-in-out infinite}
.vd4-sp{animation:vd4-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd4-fl{50%{transform:translateY(-5px)}}
@keyframes vd4-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vd4-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vd4-dr{to{stroke-dashoffset:-28}}
@keyframes vd4-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vd4-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vd4-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vd4-sl{50%{transform:translateX(14px)}}
@keyframes vd4-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="vd4-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcf5e6"/><stop offset="1" stop-color="#f6e6c2"/></linearGradient>
<radialGradient id="vd4-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="vd4-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#b07d12" fill-opacity=".14"/></pattern>
<filter id="vd4-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vd4-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="vd4-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="vd4-leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fbf6b"/><stop offset="1" stop-color="#2f7d4f"/></linearGradient>
<linearGradient id="vd4-leaf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad37a"/><stop offset="1" stop-color="#4c9a3e"/></linearGradient>
<linearGradient id="vd4-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0d0"/><stop offset="1" stop-color="#1d7fa5"/></linearGradient>
<linearGradient id="vd4-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6f5"/><stop offset="1" stop-color="#fdf1d6"/></linearGradient>
<linearGradient id="vd4-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99a62"/><stop offset="1" stop-color="#8a5f34"/></linearGradient>
<linearGradient id="vd4-tone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b07d12"/><stop offset="1" stop-color="#6b4a07"/></linearGradient>
<radialGradient id="vd4-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#e3a843"/><stop offset="1" stop-color="#e3a843" stop-opacity="0"/></radialGradient>

</defs>
