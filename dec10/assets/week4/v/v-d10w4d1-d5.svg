<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Headphones next to an answer card with three-word boxes and a row of A to D choices, and a green tick.">
<title>Building understanding: listening test practice</title>
<style>
.vd5-fl{animation:vd5-fl 6s ease-in-out infinite}.vd5-f2{animation-delay:-2s}.vd5-f3{animation-delay:-4s}
.vd5-tw{animation:vd5-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd5-t2{animation-delay:-1s}.vd5-t3{animation-delay:-2s}
.vd5-pu{animation:vd5-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vd5-dr{stroke-dasharray:7 7;animation:vd5-dr 1.8s linear infinite}
.vd5-sw{animation:vd5-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.vd5-bl{animation:vd5-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vd5-b2{animation-delay:-1.7s}.vd5-b3{animation-delay:-3.1s}
.vd5-wv{animation:vd5-wv 2.4s ease-in-out infinite}.vd5-w2{animation-delay:-.8s}.vd5-w3{animation-delay:-1.6s}
.vd5-sl{animation:vd5-sl 9s ease-in-out infinite}
.vd5-sp{animation:vd5-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd5-fl{50%{transform:translateY(-5px)}}
@keyframes vd5-tw{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vd5-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vd5-dr{to{stroke-dashoffset:-28}}
@keyframes vd5-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes vd5-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vd5-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes vd5-sl{50%{transform:translateX(14px)}}
@keyframes vd5-sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="vd5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcf5e6"/><stop offset="1" stop-color="#f6e6c2"/></linearGradient>
<radialGradient id="vd5-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="vd5-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#b07d12" fill-opacity=".14"/></pattern>
<filter id="vd5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vd5-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="vd5-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="vd5-leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fbf6b"/><stop offset="1" stop-color="#2f7d4f"/></linearGradient>
<linearGradient id="vd5-leaf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad37a"/><stop offset="1" stop-color="#4c9a3e"/></linearGradient>
<linearGradient id="vd5-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd0d0"/><stop offset="1" stop-color="#1d7fa5"/></linearGradient>
<linearGradient id="vd5-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6f5"/><stop offset="1" stop-color="#fdf1d6"/></linearGradient>
<linearGradient id="vd5-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c99a62"/><stop offset="1" stop-color="#8a5f34"/></linearGradient>
<linearGradient id="vd5-tone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b07d12"/><stop offset="1" stop-color="#6b4a07"/></linearGradient>
<radialGradient id="vd5-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".6" stop-color="#e3a843"/><stop offset="1" stop-color="#e3a843" stop-opacity="0"/></radialGradient>

</defs>
<clipPath id="vd5-clip"><path d="M52 18C92 4 172 8 204 30c24 16 26 46 20 76-6 32-30 54-70 58-38 4-90 4-118-12C12 136 8 104 14 74c6-28 14-46 38-56z"/></clipPath><path d="M52 18C92 4 172 8 204 30c24 16 26 46 20 76-6 32-30 54-70 58-38 4-90 4-118-12C12 136 8 104 14 74c6-28 14-46 38-56z" fill="url(#vd5-bg)"/><g clip-path="url(#vd5-clip)"><rect width="240" height="180" fill="url(#vd5-dots)"/><ellipse cx="116" cy="72" rx="110" ry="70" fill="url(#vd5-glow)"/></g><path d="M52 18C92 4 172 8 204 30c24 16 26 46 20 76-6 32-30 54-70 58-38 4-90 4-118-12C12 136 8 104 14 74c6-28 14-46 38-56z" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/><ellipse cx="120" cy="162" rx="92" ry="6" fill="#14293a" opacity=".11" filter="url(#vd5-blur)"/><g transform="translate(56 52) scale(1.3)"><path d="M-20 4v-6a20 20 0 0 1 40 0v6" stroke="#14293a" stroke-width="4" fill="none"/><rect x="-26" y="0" width="12" height="18" rx="5" fill="#b07d12"/><rect x="14" y="0" width="12" height="18" rx="5" fill="#b07d12"/></g><g filter="url(#vd5-sh)"><rect x="100" y="30" width="116" height="34" rx="8" fill="#fff" /></g><rect x="108" y="38" width="30" height="18" rx="4" fill="#b07d12" opacity=".18"/><rect x="143" y="38" width="30" height="18" rx="4" fill="#b07d12" opacity=".18"/><rect x="178" y="38" width="30" height="18" rx="4" fill="#b07d12" opacity=".18"/><text x="158" y="78" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#b07d12" text-anchor="middle">≤ 3 words</text><g filter="url(#vd5-sh)"><rect x="100" y="92" width="116" height="60" rx="8" fill="#fff" /></g><circle cx="116" cy="122" r="8" fill="#2d7a9a" stroke="#2d7a9a" stroke-width="1.8"/><text x="116" y="142" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" fill="#14293a" text-anchor="middle">A</text><circle cx="144" cy="122" r="8" fill="#fff" stroke="#2d7a9a" stroke-width="1.8"/><text x="144" y="142" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" fill="#14293a" text-anchor="middle">B</text><circle cx="172" cy="122" r="8" fill="#fff" stroke="#2d7a9a" stroke-width="1.8"/><text x="172" y="142" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" fill="#14293a" text-anchor="middle">C</text><circle cx="200" cy="122" r="8" fill="#fff" stroke="#2d7a9a" stroke-width="1.8"/><text x="200" y="142" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" fill="#14293a" text-anchor="middle">D</text><g class="vd5-pu"><circle cx="46" cy="132" r="18" fill="#2f7d4f"/><path d="M37 132l6 6 12-12" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
