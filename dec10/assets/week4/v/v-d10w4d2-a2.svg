<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Three summaries side by side with a magnifying glass and ticks: comparing summaries and a sample">
<title>Three summaries side by side with a magnifying glass and ticks: comparing summaries and a sample</title>
<style>
.va2-fl{animation:va2-fl 6s ease-in-out infinite}.va2-f2{animation-delay:-2s}.va2-f3{animation-delay:-4s}
