<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Four perspective lenses: scales for evaluation, a heart for attitude, a thought bubble for opinion and a microphone for stance">
<title>Four perspective lenses: scales for evaluation, a heart for attitude, a thought bubble for opinion and a microphone for stance</title>
<style>
.va3-fl{animation:va3-fl 6s ease-in-out infinite}.va3-f2{animation-delay:-2s}.va3-f3{animation-delay:-4s}
.va3-tw{animation:va3-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.va3-t2{animation-delay:-1s}.va3-t3{animation-delay:-2s}
.va3-dr{stroke-dasharray:6 8;animation:va3-dr 1.6s linear infinite}
.va3-pu{animation:va3-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.va3-sw{animation:va3-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.va3-bl{animation:va3-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.va3-b2{animation-delay:-1.7s}.va3-b3{animation-delay:-3.1s}
.va3-wv{animation:va3-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.va3-w2{animation-delay:.9s}.va3-w3{animation-delay:1.8s}
.va3-sp{animation:va3-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.va3-sea{animation:va3-sea 5s ease-in-out infinite}.va3-s2{animation-delay:-2.5s}
.va3-dw{stroke-dasharray:400;animation:va3-dw 5s ease-in-out infinite}
@keyframes va3-fl{50%{transform:translateY(-4px)}}
@keyframes va3-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes va3-dr{to{stroke-dashoffset:-28}}
@keyframes va3-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes va3-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes va3-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes va3-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes va3-sp{to{transform:rotate(360deg)}}
@keyframes va3-sea{50%{transform:translateX(-10px)}}
@keyframes va3-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="va3-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="va3-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="va3-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="va3-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="va3-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="va3-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="va3-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="va3-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="va3-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect x="6" y="6" width="228" height="168" rx="30" fill="#dff1ee"/><rect x="6" y="6" width="228" height="168" rx="30" fill="url(#va3-dots)"/><ellipse cx="120.0" cy="75.6" rx="100.8" ry="68.4" fill="url(#va3-glow)"/><circle cx="211.2" cy="28.8" r="21.599999999999998" fill="#2b776e" opacity=".08"/><circle cx="24.0" cy="154.8" r="16.2" fill="#2b776e" opacity=".07"/><g class="va3-fl"><g transform="translate(40 80)"><circle r="24" fill="#fff" filter="url(#va3-ss)"/><circle r="24" fill="none" stroke="#2f7d6b" stroke-width="4"/><text x="0" y="7" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#2f7d6b" text-anchor="middle">E</text></g></g><g class="va3-fl va3-f2"><g transform="translate(94 80)"><circle r="24" fill="#fff" filter="url(#va3-ss)"/><circle r="24" fill="none" stroke="#8a4f9e" stroke-width="4"/><text x="0" y="7" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#8a4f9e" text-anchor="middle">A</text></g></g><g class="va3-fl va3-f3"><g transform="translate(148 80)"><circle r="24" fill="#fff" filter="url(#va3-ss)"/><circle r="24" fill="none" stroke="#3a58a0" stroke-width="4"/><text x="0" y="7" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#3a58a0" text-anchor="middle">O</text></g></g><g class="va3-fl"><g transform="translate(202 80)"><circle r="24" fill="#fff" filter="url(#va3-ss)"/><circle r="24" fill="none" stroke="#c4562f" stroke-width="4"/><text x="0" y="7" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#c4562f" text-anchor="middle">S</text></g></g><g transform="translate(40 128)"><path d="M-14 0h28M0 0v-10M-12-10h24" stroke="#2f7d6b" stroke-width="2.5" stroke-linecap="round"/><path d="M-12-10l-5 9h10zM12-10l-5 9h10z" fill="#2f7d6b" opacity=".6"/></g><path d="M94 122c-4-6 2-10 6-6 4-4 10 0 6 6l-6 6z" fill="#8a4f9e"/><g transform="translate(148 124)"><circle r="9" fill="#3a58a0" opacity=".3"/><circle cx="-10" cy="10" r="3" fill="#3a58a0" opacity=".3"/></g><g transform="translate(202 124)"><rect x="-4" y="-10" width="8" height="14" rx="4" fill="#c4562f"/><path d="M0 4v6M-5 10h10" stroke="#c4562f" stroke-width="2"/></g><g transform="translate(120 30) scale(1.1)"><path class="va3-tw va3-t2" d="M0-7C1-2 2-1 7 0 2 1 1 2 0 7-1 2-2 1-7 0-2-1-1-2 0-7z" fill="#e3a843"/></g><text x="120" y="162" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#14293a" text-anchor="middle">perspective</text></svg>
