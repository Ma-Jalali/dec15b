<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A Venn diagram: two overlapping circles for the reading and the listening, with shared ideas in the middle">
<title>A Venn diagram: two overlapping circles for the reading and the listening, with shared ideas in the middle</title>
<style>
.vb1-fl{animation:vb1-fl 6s ease-in-out infinite}.vb1-f2{animation-delay:-2s}.vb1-f3{animation-delay:-4s}
.vb1-tw{animation:vb1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb1-t2{animation-delay:-1s}.vb1-t3{animation-delay:-2s}
.vb1-dr{stroke-dasharray:6 8;animation:vb1-dr 1.6s linear infinite}
.vb1-pu{animation:vb1-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vb1-sw{animation:vb1-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.vb1-bl{animation:vb1-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vb1-b2{animation-delay:-1.7s}.vb1-b3{animation-delay:-3.1s}
.vb1-wv{animation:vb1-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.vb1-w2{animation-delay:.9s}.vb1-w3{animation-delay:1.8s}
.vb1-sp{animation:vb1-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.vb1-sea{animation:vb1-sea 5s ease-in-out infinite}.vb1-s2{animation-delay:-2.5s}
.vb1-dw{stroke-dasharray:400;animation:vb1-dw 5s ease-in-out infinite}
@keyframes vb1-fl{50%{transform:translateY(-4px)}}
@keyframes vb1-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vb1-dr{to{stroke-dashoffset:-28}}
@keyframes vb1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vb1-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes vb1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vb1-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes vb1-sp{to{transform:rotate(360deg)}}
@keyframes vb1-sea{50%{transform:translateX(-10px)}}
@keyframes vb1-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="vb1-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vb1-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="vb1-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vb1-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vb1-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="vb1-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="vb1-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="vb1-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="vb1-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect x="6" y="6" width="228" height="168" rx="30" fill="#e2e9f7"/><rect x="6" y="6" width="228" height="168" rx="30" fill="url(#vb1-dots)"/><ellipse cx="120.0" cy="75.6" rx="100.8" ry="68.4" fill="url(#vb1-glow)"/><circle cx="211.2" cy="28.8" r="21.599999999999998" fill="#3a58a0" opacity=".08"/><circle cx="24.0" cy="154.8" r="16.2" fill="#3a58a0" opacity=".07"/><circle cx="92" cy="88" r="56" fill="#2f7d6b" opacity=".22" stroke="#2f7d6b" stroke-width="3"/><circle cx="148" cy="88" r="56" fill="#2b776e" opacity=".22" stroke="#3a58a0" stroke-width="3"/><g class="vb1-pu"><circle cx="120" cy="70" r="5" fill="#e3a843"/><circle cx="120" cy="88" r="5" fill="#e3a843"/><circle cx="120" cy="106" r="5" fill="#e3a843"/></g><g transform="translate(62 72)"><rect width="22" height="28" rx="3" fill="#fff"/><path d="M5 9h12M5 15h12M5 21h8" stroke="#2f7d6b" stroke-width="2"/></g><g transform="translate(172 80) scale(0.8)"><path d="M-22 6a22 22 0 0 1 44 0" stroke="#14293a" stroke-width="5" fill="none"/><rect x="-28" y="0" width="12" height="20" rx="5" fill="#3a58a0"/><rect x="16" y="0" width="12" height="20" rx="5" fill="#3a58a0"/></g><text x="92" y="166" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="800" fill="#2f7d6b" text-anchor="middle">Reading</text><text x="148" y="166" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="800" fill="#3a58a0" text-anchor="middle">Listening</text><g transform="translate(210 30) scale(1)"><path class="vb1-tw vb1-t2" d="M0-7C1-2 2-1 7 0 2 1 1 2 0 7-1 2-2 1-7 0-2-1-1-2 0-7z" fill="#e3a843"/></g></svg>
