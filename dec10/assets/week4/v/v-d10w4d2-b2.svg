<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Synthesis: details from three texts flow together into one light bulb, a new and bigger thought">
<title>Synthesis: details from three texts flow together into one light bulb, a new and bigger thought</title>
<style>
.vb2-fl{animation:vb2-fl 6s ease-in-out infinite}.vb2-f2{animation-delay:-2s}.vb2-f3{animation-delay:-4s}
.vb2-tw{animation:vb2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb2-t2{animation-delay:-1s}.vb2-t3{animation-delay:-2s}
.vb2-dr{stroke-dasharray:6 8;animation:vb2-dr 1.6s linear infinite}
.vb2-pu{animation:vb2-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vb2-sw{animation:vb2-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.vb2-bl{animation:vb2-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vb2-b2{animation-delay:-1.7s}.vb2-b3{animation-delay:-3.1s}
.vb2-wv{animation:vb2-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.vb2-w2{animation-delay:.9s}.vb2-w3{animation-delay:1.8s}
.vb2-sp{animation:vb2-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.vb2-sea{animation:vb2-sea 5s ease-in-out infinite}.vb2-s2{animation-delay:-2.5s}
.vb2-dw{stroke-dasharray:400;animation:vb2-dw 5s ease-in-out infinite}
@keyframes vb2-fl{50%{transform:translateY(-4px)}}
@keyframes vb2-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vb2-dr{to{stroke-dashoffset:-28}}
@keyframes vb2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vb2-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes vb2-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vb2-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes vb2-sp{to{transform:rotate(360deg)}}
@keyframes vb2-sea{50%{transform:translateX(-10px)}}
@keyframes vb2-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="vb2-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vb2-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="vb2-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vb2-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vb2-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="vb2-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="vb2-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="vb2-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="vb2-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect x="6" y="6" width="228" height="168" rx="30" fill="#e2e9f7"/><rect x="6" y="6" width="228" height="168" rx="30" fill="url(#vb2-dots)"/><ellipse cx="120.0" cy="75.6" rx="100.8" ry="68.4" fill="url(#vb2-glow)"/><circle cx="211.2" cy="28.8" r="21.599999999999998" fill="#3a58a0" opacity=".08"/><circle cx="24.0" cy="154.8" r="16.2" fill="#3a58a0" opacity=".07"/><g class="vb2-fl"><g transform="translate(22 26)"><rect width="54" height="34" rx="6" fill="#fff" filter="url(#vb2-ss)"/><rect width="54" height="6" rx="3" fill="#2f7d6b"/><path d="M8 16h36M8 24h26" stroke="#14293a" stroke-opacity=".2" stroke-width="3"/></g></g><path class="vb2-dr" d="M78 43C120 43 130 90 158 90" stroke="#2f7d6b" stroke-width="3" fill="none"/><g class="vb2-fl vb2-f2"><g transform="translate(22 70)"><rect width="54" height="34" rx="6" fill="#fff" filter="url(#vb2-ss)"/><rect width="54" height="6" rx="3" fill="#2b776e"/><path d="M8 16h36M8 24h26" stroke="#14293a" stroke-opacity=".2" stroke-width="3"/></g></g><path class="vb2-dr" d="M78 87C120 87 130 90 158 90" stroke="#2b776e" stroke-width="3" fill="none"/><g class="vb2-fl vb2-f3"><g transform="translate(22 114)"><rect width="54" height="34" rx="6" fill="#fff" filter="url(#vb2-ss)"/><rect width="54" height="6" rx="3" fill="#3a58a0"/><path d="M8 16h36M8 24h26" stroke="#14293a" stroke-opacity=".2" stroke-width="3"/></g></g><path class="vb2-dr" d="M78 131C120 131 130 90 158 90" stroke="#3a58a0" stroke-width="3" fill="none"/><g transform="translate(186 86) scale(1.1)"><circle class="vb2-pu" r="30" fill="#f6c453" opacity=".25"/><path d="M-16 4a20 20 0 1 1 32 0c-5 6-6 10-6 16h-20c0-6-1-10-6-16z" fill="#fbd97a" stroke="#b07d12" stroke-width="2.5"/><rect x="-10" y="22" width="20" height="6" rx="2" fill="#9fb0c0"/><rect x="-8" y="30" width="16" height="5" rx="2" fill="#7f90a0"/><path d="M-5 10l5-8 5 8" stroke="#b07d12" stroke-width="2" fill="none"/></g><g transform="translate(214 34) scale(1)"><path class="vb2-tw vb2-t2" d="M0-7C1-2 2-1 7 0 2 1 1 2 0 7-1 2-2 1-7 0-2-1-1-2 0-7z" fill="#e3a843"/></g><g transform="translate(160 150) scale(0.8)"><path class="vb2-tw vb2-t3" d="M0-7C1-2 2-1 7 0 2 1 1 2 0 7-1 2-2 1-7 0-2-1-1-2 0-7z" fill="#3a58a0"/></g></svg>
