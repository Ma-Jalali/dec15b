<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Note-taking grid with three rows — resort developer, indigenous community, other ideas — and a pen">
<title>Note-taking grid with three rows — resort developer, indigenous community, other ideas — and a pen</title>
<style>
.vb5-fl{animation:vb5-fl 6s ease-in-out infinite}.vb5-f2{animation-delay:-2s}.vb5-f3{animation-delay:-4s}
.vb5-tw{animation:vb5-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb5-t2{animation-delay:-1s}.vb5-t3{animation-delay:-2s}
.vb5-dr{stroke-dasharray:6 8;animation:vb5-dr 1.6s linear infinite}
.vb5-pu{animation:vb5-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vb5-sw{animation:vb5-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.vb5-bl{animation:vb5-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vb5-b2{animation-delay:-1.7s}.vb5-b3{animation-delay:-3.1s}
.vb5-wv{animation:vb5-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.vb5-w2{animation-delay:.9s}.vb5-w3{animation-delay:1.8s}
.vb5-sp{animation:vb5-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.vb5-sea{animation:vb5-sea 5s ease-in-out infinite}.vb5-s2{animation-delay:-2.5s}
.vb5-dw{stroke-dasharray:400;animation:vb5-dw 5s ease-in-out infinite}
@keyframes vb5-fl{50%{transform:translateY(-4px)}}
@keyframes vb5-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vb5-dr{to{stroke-dashoffset:-28}}
@keyframes vb5-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vb5-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes vb5-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vb5-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes vb5-sp{to{transform:rotate(360deg)}}
@keyframes vb5-sea{50%{transform:translateX(-10px)}}
@keyframes vb5-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="vb5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vb5-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="vb5-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vb5-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vb5-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="vb5-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="vb5-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="vb5-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="vb5-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect x="6" y="6" width="228" height="168" rx="30" fill="#e2e9f7"/><rect x="6" y="6" width="228" height="168" rx="30" fill="url(#vb5-dots)"/><ellipse cx="120.0" cy="75.6" rx="100.8" ry="68.4" fill="url(#vb5-glow)"/><circle cx="211.2" cy="28.8" r="21.599999999999998" fill="#3a58a0" opacity=".08"/><circle cx="24.0" cy="154.8" r="16.2" fill="#3a58a0" opacity=".07"/><g transform="translate(26 22)"><rect width="188" height="132" rx="10" fill="#fff" filter="url(#vb5-sh)"/><rect x="10" y="10" width="64" height="32" rx="6" fill="#c4562f" opacity=".15"/><text x="42" y="31" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#c4562f" text-anchor="middle">Developer</text><rect x="84" y="16" width="86" height="4" rx="2" fill="#c4562f" opacity=".35"/><rect x="84" y="25" width="66" height="4" rx="2" fill="#c4562f" opacity=".35"/><rect x="84" y="34" width="86" height="4" rx="2" fill="#c4562f" opacity=".35"/><rect x="10" y="50" width="64" height="32" rx="6" fill="#2f7d6b" opacity=".15"/><text x="42" y="71" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#2f7d6b" text-anchor="middle">Community</text><rect x="84" y="56" width="86" height="4" rx="2" fill="#2f7d6b" opacity=".35"/><rect x="84" y="65" width="66" height="4" rx="2" fill="#2f7d6b" opacity=".35"/><rect x="84" y="74" width="86" height="4" rx="2" fill="#2f7d6b" opacity=".35"/><rect x="10" y="90" width="64" height="32" rx="6" fill="#3a58a0" opacity=".15"/><text x="42" y="111" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#3a58a0" text-anchor="middle">Other</text><rect x="84" y="96" width="86" height="4" rx="2" fill="#3a58a0" opacity=".35"/><rect x="84" y="105" width="66" height="4" rx="2" fill="#3a58a0" opacity=".35"/><rect x="84" y="114" width="86" height="4" rx="2" fill="#3a58a0" opacity=".35"/></g><g transform="translate(210 140) rotate(30) scale(0.9)"><rect x="-4" y="-34" width="8" height="40" rx="2" fill="#3a58a0"/><path d="M-4 6h8l-4 10z" fill="#f2c9a0"/><path d="M-1.5 12h3l-1.5 4z" fill="#14293a"/><rect x="-4" y="-34" width="8" height="6" fill="#fff" opacity=".4"/></g></svg>
