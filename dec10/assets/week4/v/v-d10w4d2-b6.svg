<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A synthesis matrix with three source columns and six idea rows; a note card is dropped into the right row">
<title>A synthesis matrix with three source columns and six idea rows; a note card is dropped into the right row</title>
<style>
.vb6-fl{animation:vb6-fl 6s ease-in-out infinite}.vb6-f2{animation-delay:-2s}.vb6-f3{animation-delay:-4s}
.vb6-tw{animation:vb6-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb6-t2{animation-delay:-1s}.vb6-t3{animation-delay:-2s}
.vb6-dr{stroke-dasharray:6 8;animation:vb6-dr 1.6s linear infinite}
.vb6-pu{animation:vb6-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vb6-sw{animation:vb6-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.vb6-bl{animation:vb6-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vb6-b2{animation-delay:-1.7s}.vb6-b3{animation-delay:-3.1s}
.vb6-wv{animation:vb6-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.vb6-w2{animation-delay:.9s}.vb6-w3{animation-delay:1.8s}
.vb6-sp{animation:vb6-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.vb6-sea{animation:vb6-sea 5s ease-in-out infinite}.vb6-s2{animation-delay:-2.5s}
.vb6-dw{stroke-dasharray:400;animation:vb6-dw 5s ease-in-out infinite}
@keyframes vb6-fl{50%{transform:translateY(-4px)}}
@keyframes vb6-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vb6-dr{to{stroke-dashoffset:-28}}
@keyframes vb6-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vb6-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes vb6-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vb6-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes vb6-sp{to{transform:rotate(360deg)}}
@keyframes vb6-sea{50%{transform:translateX(-10px)}}
@keyframes vb6-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="vb6-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vb6-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="vb6-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vb6-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vb6-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="vb6-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="vb6-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="vb6-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="vb6-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect x="6" y="6" width="228" height="168" rx="30" fill="#e2e9f7"/><rect x="6" y="6" width="228" height="168" rx="30" fill="url(#vb6-dots)"/><ellipse cx="120.0" cy="75.6" rx="100.8" ry="68.4" fill="url(#vb6-glow)"/><circle cx="211.2" cy="28.8" r="21.599999999999998" fill="#3a58a0" opacity=".08"/><circle cx="24.0" cy="154.8" r="16.2" fill="#3a58a0" opacity=".07"/><g transform="translate(24 30)"><rect width="190" height="126" rx="10" fill="#fff" filter="url(#vb6-sh)"/><rect x="58" y="8" width="36" height="9" rx="4.5" fill="#2f7d6b"/><rect x="102" y="8" width="36" height="9" rx="4.5" fill="#2b776e"/><rect x="146" y="8" width="36" height="9" rx="4.5" fill="#3a58a0"/><rect x="10" y="24" width="38" height="8" rx="4" fill="#14293a" opacity=".2"/><path d="M8 36h174" stroke="#14293a" stroke-opacity=".08"/><rect x="102" y="24" width="26" height="7" rx="3.5" fill="#2b776e" opacity=".3"/><rect x="146" y="24" width="26" height="7" rx="3.5" fill="#3a58a0" opacity=".3"/><rect x="10" y="40" width="38" height="8" rx="4" fill="#14293a" opacity=".2"/><path d="M8 52h174" stroke="#14293a" stroke-opacity=".08"/><rect x="58" y="40" width="34" height="7" rx="3.5" fill="#2f7d6b" opacity=".3"/><rect x="102" y="40" width="34" height="7" rx="3.5" fill="#2b776e" opacity=".3"/><rect x="10" y="56" width="38" height="8" rx="4" fill="#14293a" opacity=".2"/><path d="M8 68h174" stroke="#14293a" stroke-opacity=".08"/><rect x="102" y="56" width="26" height="7" rx="3.5" fill="#2b776e" opacity=".3"/><rect x="146" y="56" width="26" height="7" rx="3.5" fill="#3a58a0" opacity=".3"/><rect x="10" y="72" width="38" height="8" rx="4" fill="#14293a" opacity=".2"/><path d="M8 84h174" stroke="#14293a" stroke-opacity=".08"/><rect x="58" y="72" width="34" height="7" rx="3.5" fill="#2f7d6b" opacity=".3"/><rect x="102" y="72" width="34" height="7" rx="3.5" fill="#2b776e" opacity=".3"/><rect x="10" y="88" width="38" height="8" rx="4" fill="#14293a" opacity=".2"/><path d="M8 100h174" stroke="#14293a" stroke-opacity=".08"/><rect x="102" y="88" width="26" height="7" rx="3.5" fill="#2b776e" opacity=".3"/><rect x="146" y="88" width="26" height="7" rx="3.5" fill="#3a58a0" opacity=".3"/><rect x="10" y="104" width="38" height="8" rx="4" fill="#14293a" opacity=".2"/><path d="M8 116h174" stroke="#14293a" stroke-opacity=".08"/><rect x="58" y="104" width="34" height="7" rx="3.5" fill="#2f7d6b" opacity=".3"/><rect x="102" y="104" width="34" height="7" rx="3.5" fill="#2b776e" opacity=".3"/></g><g class="vb6-fl vb6-f2"><g transform="translate(150 6) rotate(8)"><rect width="66" height="30" rx="6" fill="#fbd97a" filter="url(#vb6-ss)"/><path d="M8 12h48M8 20h30" stroke="#14293a" stroke-opacity=".3" stroke-width="3"/></g></g></svg>
