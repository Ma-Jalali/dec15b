<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Planning time: three blank sheets with notes and a plan, and a clock showing the first 30 minutes in amber">
<title>Planning time: three blank sheets with notes and a plan, and a clock showing the first 30 minutes in amber</title>
<style>
.vc1-fl{animation:vc1-fl 6s ease-in-out infinite}.vc1-f2{animation-delay:-2s}.vc1-f3{animation-delay:-4s}
.vc1-tw{animation:vc1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vc1-t2{animation-delay:-1s}.vc1-t3{animation-delay:-2s}
.vc1-dr{stroke-dasharray:6 8;animation:vc1-dr 1.6s linear infinite}
.vc1-pu{animation:vc1-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vc1-sw{animation:vc1-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.vc1-bl{animation:vc1-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vc1-b2{animation-delay:-1.7s}.vc1-b3{animation-delay:-3.1s}
.vc1-wv{animation:vc1-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.vc1-w2{animation-delay:.9s}.vc1-w3{animation-delay:1.8s}
.vc1-sp{animation:vc1-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.vc1-sea{animation:vc1-sea 5s ease-in-out infinite}.vc1-s2{animation-delay:-2.5s}
.vc1-dw{stroke-dasharray:400;animation:vc1-dw 5s ease-in-out infinite}
@keyframes vc1-fl{50%{transform:translateY(-4px)}}
@keyframes vc1-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vc1-dr{to{stroke-dashoffset:-28}}
@keyframes vc1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vc1-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes vc1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vc1-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes vc1-sp{to{transform:rotate(360deg)}}
@keyframes vc1-sea{50%{transform:translateX(-10px)}}
@keyframes vc1-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="vc1-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vc1-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="vc1-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vc1-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vc1-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="vc1-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="vc1-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="vc1-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="vc1-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect x="6" y="6" width="228" height="168" rx="30" fill="#fbefd6"/><rect x="6" y="6" width="228" height="168" rx="30" fill="url(#vc1-dots)"/><ellipse cx="120.0" cy="75.6" rx="100.8" ry="68.4" fill="url(#vc1-glow)"/><circle cx="211.2" cy="28.8" r="21.599999999999998" fill="#e3a843" opacity=".08"/><circle cx="24.0" cy="154.8" r="16.2" fill="#e3a843" opacity=".07"/><g transform="translate(30 30) rotate(-6)"><rect width="72" height="96" rx="6" fill="#fff" filter="url(#vc1-ss)"/></g><g transform="translate(46 38) rotate(-1)"><rect width="72" height="96" rx="6" fill="#fff" filter="url(#vc1-ss)"/></g><g transform="translate(62 46) rotate(4)"><rect width="72" height="96" rx="6" fill="#fff" filter="url(#vc1-ss)"/></g><g transform="translate(66 62) rotate(4)"><rect x="8" y="10" width="44" height="4" rx="2" fill="#985c0e" opacity=".45"/><rect x="8" y="22" width="34" height="4" rx="2" fill="#985c0e" opacity=".45"/><rect x="8" y="34" width="24" height="4" rx="2" fill="#985c0e" opacity=".45"/><rect x="8" y="46" width="44" height="4" rx="2" fill="#985c0e" opacity=".45"/><rect x="8" y="58" width="34" height="4" rx="2" fill="#985c0e" opacity=".45"/><path d="M6 76l8-8 8 8" stroke="#2b776e" stroke-width="2.5" fill="none"/></g><g transform="translate(176 80)"><circle r="40" fill="#fff" filter="url(#vc1-sh)"/><path d="M0-30A30 30 0 0 1 30 0" stroke="#e3a843" stroke-width="12" fill="none"/><path d="M30 0A30 30 0 1 1 0-30" stroke="#2b776e" stroke-width="12" fill="none" opacity=".35"/><text x="0" y="6" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#14293a" text-anchor="middle">30</text></g><g transform="translate(140 150) rotate(-40) scale(0.9)"><rect x="-4" y="-34" width="8" height="40" rx="2" fill="#c4562f"/><path d="M-4 6h8l-4 10z" fill="#f2c9a0"/><path d="M-1.5 12h3l-1.5 4z" fill="#14293a"/><rect x="-4" y="-34" width="8" height="6" fill="#fff" opacity=".4"/></g><g transform="translate(214 150) scale(1)"><path class="vc1-tw vc1-t2" d="M0-7C1-2 2-1 7 0 2 1 1 2 0 7-1 2-2 1-7 0-2-1-1-2 0-7z" fill="#e3a843"/></g></svg>
