<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Writing time: a student types an essay on a laptop in silence, with a no-AI sign and a Submit button">
<title>Writing time: a student types an essay on a laptop in silence, with a no-AI sign and a Submit button</title>
<style>
.vc2-fl{animation:vc2-fl 6s ease-in-out infinite}.vc2-f2{animation-delay:-2s}.vc2-f3{animation-delay:-4s}
.vc2-tw{animation:vc2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vc2-t2{animation-delay:-1s}.vc2-t3{animation-delay:-2s}
.vc2-dr{stroke-dasharray:6 8;animation:vc2-dr 1.6s linear infinite}
.vc2-pu{animation:vc2-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vc2-sw{animation:vc2-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.vc2-bl{animation:vc2-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vc2-b2{animation-delay:-1.7s}.vc2-b3{animation-delay:-3.1s}
.vc2-wv{animation:vc2-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.vc2-w2{animation-delay:.9s}.vc2-w3{animation-delay:1.8s}
.vc2-sp{animation:vc2-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.vc2-sea{animation:vc2-sea 5s ease-in-out infinite}.vc2-s2{animation-delay:-2.5s}
.vc2-dw{stroke-dasharray:400;animation:vc2-dw 5s ease-in-out infinite}
@keyframes vc2-fl{50%{transform:translateY(-4px)}}
@keyframes vc2-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vc2-dr{to{stroke-dashoffset:-28}}
@keyframes vc2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vc2-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes vc2-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vc2-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes vc2-sp{to{transform:rotate(360deg)}}
@keyframes vc2-sea{50%{transform:translateX(-10px)}}
@keyframes vc2-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="vc2-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vc2-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="vc2-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vc2-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vc2-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="vc2-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="vc2-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="vc2-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="vc2-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect x="6" y="6" width="228" height="168" rx="30" fill="#fbefd6"/><rect x="6" y="6" width="228" height="168" rx="30" fill="url(#vc2-dots)"/><ellipse cx="120.0" cy="75.6" rx="100.8" ry="68.4" fill="url(#vc2-glow)"/><circle cx="211.2" cy="28.8" r="21.599999999999998" fill="#e3a843" opacity=".08"/><circle cx="24.0" cy="154.8" r="16.2" fill="#e3a843" opacity=".07"/><g transform="translate(110 168) scale(0.78)"><path d="M-34 40C-36 6-24-12 0-12 24-12 36 6 34 40z" fill="#e3a843"/><path d="M-8-12l8 10 8-10" fill="#fff" opacity=".85"/><path d="M-30-6c-4 12 0 22 10 28M30-6c4 12 0 22-10 28" stroke="#e3a843" stroke-width="12" stroke-linecap="round"/><circle cx="-18" cy="24" r="6" fill="#e8b48a"/><circle cx="18" cy="24" r="6" fill="#e8b48a"/><rect x="-6" y="-24" width="12" height="14" rx="5" fill="#e8b48a"/><g transform="translate(0 -44)"><path d="M-20-2C-24-26-2-32 8-28 22-24 24-6 21 18 18 6 16-6 12-14 2-18-10-14-14-8-16 6-18 18-24 20-20-2z" fill="#5a3a22"/><circle r="20" fill="#e8b48a"/><circle cx="-20" cy="2" r="4" fill="#e8b48a"/><circle cx="20" cy="2" r="4" fill="#e8b48a"/><path d="M-19-6C-18-22-4-28 6-26 16-24 20-14 19-6 12-14 0-15-8-12-14-10-17-8-19-6z" fill="#5a3a22"/><g class="vc2-bl vc2-b2"><circle cx="-7" cy="0" r="2.4" fill="#14293a"/><circle cx="7" cy="0" r="2.4" fill="#14293a"/></g><circle cx="-12" cy="6" r="3" fill="#e88a7a" opacity=".35"/><circle cx="12" cy="6" r="3" fill="#e88a7a" opacity=".35"/><path d="M-5 9h10" stroke="#8a3a2a" stroke-width="2" stroke-linecap="round" fill="none"/></g></g><g transform="translate(110 166) scale(0.95)"><rect x="-46" y="-34" width="92" height="58" rx="5" fill="#14293a"/><rect x="-41" y="-29" width="82" height="48" rx="2" fill="#fdf7ea"/><path d="M-56 24h112l-8 10h-96z" fill="#c9d3dd"/><rect x="-10" y="26" width="20" height="3" rx="1.5" fill="#9fb0c0"/></g><rect x="78" y="142" width="50" height="4" rx="2" fill="#985c0e" opacity=".5"/><g transform="translate(196 50)"><circle r="20" fill="#fff" filter="url(#vc2-ss)"/><text x="0" y="6" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#14293a" text-anchor="middle">AI</text><circle r="16" stroke="#c4562f" stroke-width="3.5" fill="none"/><path d="M-11 11L11-11" stroke="#c4562f" stroke-width="3.5"/></g><g class="vc2-pu"><rect x="160" y="120" width="64" height="24" rx="12" fill="#2b776e"/><text x="192" y="136" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">Submit</text></g><g transform="translate(40 40)"><path d="M-12 0h24" stroke="#14293a" stroke-width="3" stroke-linecap="round" opacity=".4"/><text x="0" y="-6" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#14293a" text-anchor="middle">shh</text></g></svg>
