<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Review the question: a sticky note with “To what extent?” above a scale from not at all to completely">
<title>Review the question: a sticky note with “To what extent?” above a scale from not at all to completely</title>
<style>
.vd1-fl{animation:vd1-fl 6s ease-in-out infinite}.vd1-f2{animation-delay:-2s}.vd1-f3{animation-delay:-4s}
.vd1-tw{animation:vd1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd1-t2{animation-delay:-1s}.vd1-t3{animation-delay:-2s}
.vd1-dr{stroke-dasharray:6 8;animation:vd1-dr 1.6s linear infinite}
.vd1-pu{animation:vd1-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vd1-sw{animation:vd1-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.vd1-bl{animation:vd1-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vd1-b2{animation-delay:-1.7s}.vd1-b3{animation-delay:-3.1s}
.vd1-wv{animation:vd1-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.vd1-w2{animation-delay:.9s}.vd1-w3{animation-delay:1.8s}
.vd1-sp{animation:vd1-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.vd1-sea{animation:vd1-sea 5s ease-in-out infinite}.vd1-s2{animation-delay:-2.5s}
.vd1-dw{stroke-dasharray:400;animation:vd1-dw 5s ease-in-out infinite}
@keyframes vd1-fl{50%{transform:translateY(-4px)}}
@keyframes vd1-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vd1-dr{to{stroke-dashoffset:-28}}
@keyframes vd1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vd1-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes vd1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vd1-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes vd1-sp{to{transform:rotate(360deg)}}
@keyframes vd1-sea{50%{transform:translateX(-10px)}}
@keyframes vd1-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="vd1-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vd1-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="vd1-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vd1-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vd1-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="vd1-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="vd1-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="vd1-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="vd1-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect x="6" y="6" width="228" height="168" rx="30" fill="#e3f1e2"/><rect x="6" y="6" width="228" height="168" rx="30" fill="url(#vd1-dots)"/><ellipse cx="120.0" cy="75.6" rx="100.8" ry="68.4" fill="url(#vd1-glow)"/><circle cx="211.2" cy="28.8" r="21.599999999999998" fill="#2f7d6b" opacity=".08"/><circle cx="24.0" cy="154.8" r="16.2" fill="#2f7d6b" opacity=".07"/><g class="vd1-fl"><g transform="translate(46 20) rotate(-3)"><rect width="148" height="56" rx="6" fill="#fbd97a" filter="url(#vd1-ss)"/><text x="74" y="26" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#14293a" text-anchor="middle">To what extent …?</text><text x="74" y="44" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="700" fill="#985c0e" text-anchor="middle">450–600 words</text></g></g><g transform="translate(30 116)"><rect width="180" height="10" rx="5" fill="#fff"/><circle cx="0" cy="5" r="8" fill="#c4562f" stroke="#fff" stroke-width="2"/><circle cx="60" cy="5" r="8" fill="#e3a843" stroke="#fff" stroke-width="2"/><circle cx="120" cy="5" r="8" fill="#7fb98a" stroke="#fff" stroke-width="2"/><circle cx="180" cy="5" r="8" fill="#2f7d6b" stroke="#fff" stroke-width="2"/><g class="vd1-pu"><path d="M40 -18l8 12 8-12z" fill="#14293a"/></g><text x="0" y="32" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#14293a" text-anchor="start">not at all</text><text x="180" y="32" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="700" fill="#14293a" text-anchor="end">completely</text></g></svg>
