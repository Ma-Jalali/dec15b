<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Sample essay 4.1 with the thesis highlighted in yellow and a position marker that says “unlikely”">
<title>Sample essay 4.1 with the thesis highlighted in yellow and a position marker that says “unlikely”</title>
<style>
.vd2-fl{animation:vd2-fl 6s ease-in-out infinite}.vd2-f2{animation-delay:-2s}.vd2-f3{animation-delay:-4s}
.vd2-tw{animation:vd2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd2-t2{animation-delay:-1s}.vd2-t3{animation-delay:-2s}
.vd2-dr{stroke-dasharray:6 8;animation:vd2-dr 1.6s linear infinite}
.vd2-pu{animation:vd2-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vd2-sw{animation:vd2-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.vd2-bl{animation:vd2-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vd2-b2{animation-delay:-1.7s}.vd2-b3{animation-delay:-3.1s}
.vd2-wv{animation:vd2-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.vd2-w2{animation-delay:.9s}.vd2-w3{animation-delay:1.8s}
.vd2-sp{animation:vd2-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.vd2-sea{animation:vd2-sea 5s ease-in-out infinite}.vd2-s2{animation-delay:-2.5s}
.vd2-dw{stroke-dasharray:400;animation:vd2-dw 5s ease-in-out infinite}
@keyframes vd2-fl{50%{transform:translateY(-4px)}}
@keyframes vd2-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vd2-dr{to{stroke-dashoffset:-28}}
@keyframes vd2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vd2-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes vd2-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vd2-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes vd2-sp{to{transform:rotate(360deg)}}
@keyframes vd2-sea{50%{transform:translateX(-10px)}}
@keyframes vd2-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="vd2-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vd2-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="vd2-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vd2-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vd2-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="vd2-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="vd2-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="vd2-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="vd2-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect x="6" y="6" width="228" height="168" rx="30" fill="#e3f1e2"/><rect x="6" y="6" width="228" height="168" rx="30" fill="url(#vd2-dots)"/><ellipse cx="120.0" cy="75.6" rx="100.8" ry="68.4" fill="url(#vd2-glow)"/><circle cx="211.2" cy="28.8" r="21.599999999999998" fill="#2f7d6b" opacity=".08"/><circle cx="24.0" cy="154.8" r="16.2" fill="#2f7d6b" opacity=".07"/><g transform="translate(40 18) rotate(-3)"><rect width="120" height="148" rx="8" fill="#fff" filter="url(#vd2-sh)"/><text x="60" y="22" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#2f7d6b" text-anchor="middle">Sample 4.1</text><rect x="12" y="34" width="96" height="4" rx="2" fill="#14293a" opacity=".14"/><rect x="12" y="46" width="84" height="4" rx="2" fill="#14293a" opacity=".14"/><rect x="12" y="58" width="72" height="4" rx="2" fill="#14293a" opacity=".14"/><rect x="12" y="70" width="96" height="4" rx="2" fill="#14293a" opacity=".14"/><rect x="12" y="82" width="84" height="4" rx="2" fill="#14293a" opacity=".14"/><rect x="12" y="94" width="72" height="4" rx="2" fill="#14293a" opacity=".14"/><rect x="12" y="106" width="96" height="4" rx="2" fill="#14293a" opacity=".14"/><rect x="12" y="118" width="84" height="4" rx="2" fill="#14293a" opacity=".14"/><rect x="12" y="130" width="72" height="4" rx="2" fill="#14293a" opacity=".14"/><rect class="vd2-pu" x="10" y="54" width="96" height="10" rx="3" fill="#f6c453" opacity=".7"/></g><g class="vd2-fl vd2-f2"><g transform="translate(150 96)"><rect width="76" height="28" rx="14" fill="#c4562f" filter="url(#vd2-ss)"/><text x="38" y="19" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">unlikely</text></g></g></svg>
