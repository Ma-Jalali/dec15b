<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Bring your notes to class: a backpack with an evidence table and a phone recording a one-minute answer">
<title>Bring your notes to class: a backpack with an evidence table and a phone recording a one-minute answer</title>
<style>
.vd4-fl{animation:vd4-fl 6s ease-in-out infinite}.vd4-f2{animation-delay:-2s}.vd4-f3{animation-delay:-4s}
.vd4-tw{animation:vd4-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd4-t2{animation-delay:-1s}.vd4-t3{animation-delay:-2s}
.vd4-dr{stroke-dasharray:6 8;animation:vd4-dr 1.6s linear infinite}
.vd4-pu{animation:vd4-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.vd4-sw{animation:vd4-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.vd4-bl{animation:vd4-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.vd4-b2{animation-delay:-1.7s}.vd4-b3{animation-delay:-3.1s}
.vd4-wv{animation:vd4-wv 2.7s ease-out infinite;transform-box:fill-box;transform-origin:left center}.vd4-w2{animation-delay:.9s}.vd4-w3{animation-delay:1.8s}
.vd4-sp{animation:vd4-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.vd4-sea{animation:vd4-sea 5s ease-in-out infinite}.vd4-s2{animation-delay:-2.5s}
.vd4-dw{stroke-dasharray:400;animation:vd4-dw 5s ease-in-out infinite}
@keyframes vd4-fl{50%{transform:translateY(-4px)}}
@keyframes vd4-tw{0%,100%{opacity:.3;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
@keyframes vd4-dr{to{stroke-dashoffset:-28}}
@keyframes vd4-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes vd4-sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes vd4-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes vd4-wv{0%{opacity:0;transform:scale(.6)}25%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes vd4-sp{to{transform:rotate(360deg)}}
@keyframes vd4-sea{50%{transform:translateX(-10px)}}
@keyframes vd4-dw{0%{stroke-dashoffset:400}55%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="vd4-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".7" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="vd4-ss" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".18"/></filter>
<pattern id="vd4-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vd4-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vd4-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ef"/><stop offset=".6" stop-color="#e6f4f2"/><stop offset="1" stop-color="#fbf1dc"/></linearGradient>
<linearGradient id="vd4-seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa7b5"/><stop offset="1" stop-color="#1f6f8a"/></linearGradient>
<linearGradient id="vd4-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e2b8"/><stop offset="1" stop-color="#e8c98d"/></linearGradient>
<linearGradient id="vd4-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fae6e"/><stop offset="1" stop-color="#2f7d4b"/></linearGradient>
<linearGradient id="vd4-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb6f0" stop-opacity=".85"/><stop offset=".5" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#4d89cc" stop-opacity=".8"/></linearGradient>
</defs>
<rect x="6" y="6" width="228" height="168" rx="30" fill="#e3f1e2"/><rect x="6" y="6" width="228" height="168" rx="30" fill="url(#vd4-dots)"/><ellipse cx="120.0" cy="75.6" rx="100.8" ry="68.4" fill="url(#vd4-glow)"/><circle cx="211.2" cy="28.8" r="21.599999999999998" fill="#2f7d6b" opacity=".08"/><circle cx="24.0" cy="154.8" r="16.2" fill="#2f7d6b" opacity=".07"/><g transform="translate(26 30)"><rect width="110" height="84" rx="8" fill="#fff" filter="url(#vd4-sh)"/><path d="M0 20h110" stroke="#14293a" stroke-opacity=".1"/><path d="M0 36h110" stroke="#14293a" stroke-opacity=".1"/><path d="M0 52h110" stroke="#14293a" stroke-opacity=".1"/><path d="M0 68h110" stroke="#14293a" stroke-opacity=".1"/><rect x="34" y="6" width="18" height="8" rx="4" fill="#2f7d6b"/><rect x="34" y="42" width="16" height="5" rx="2.5" fill="#2f7d6b" opacity=".35"/><rect x="34" y="58" width="16" height="5" rx="2.5" fill="#2f7d6b" opacity=".35"/><rect x="58" y="6" width="18" height="8" rx="4" fill="#c4562f"/><rect x="58" y="26" width="16" height="5" rx="2.5" fill="#c4562f" opacity=".35"/><rect x="58" y="42" width="16" height="5" rx="2.5" fill="#c4562f" opacity=".35"/><rect x="82" y="6" width="18" height="8" rx="4" fill="#e3a843"/><rect x="82" y="26" width="16" height="5" rx="2.5" fill="#e3a843" opacity=".35"/><rect x="82" y="58" width="16" height="5" rx="2.5" fill="#e3a843" opacity=".35"/></g><g transform="translate(176 96)"><rect x="-22" y="-40" width="44" height="78" rx="8" fill="#14293a"/><rect x="-18" y="-34" width="36" height="62" rx="4" fill="#e3f1e2"/><circle class="vd4-pu" cy="-4" r="9" fill="#c4562f"/><text x="0" y="22" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#14293a" text-anchor="middle">1:00</text></g><path d="M30 154c0-22 14-30 40-30s40 8 40 30z" fill="#2f7d6b" opacity=".85"/><rect x="56" y="134" width="28" height="10" rx="3" fill="#fbd97a"/></svg>
