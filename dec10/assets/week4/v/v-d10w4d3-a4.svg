<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Five coloured building blocks stacked into an essay: introduction, body 1, body 2, body 3, conclusion">
<title>Five coloured building blocks stacked into an essay: introduction, body 1, body 2, body 3, conclusion</title>
<style>
.w4d3a4-fl{animation:w4d3a4-fl 6s ease-in-out infinite}.w4d3a4-f2{animation-delay:-2s}.w4d3a4-f3{animation-delay:-4s}
