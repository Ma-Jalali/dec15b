.w4d3a4-sp{animation:w4d3a4-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w4d3a4-ti{animation:w4d3a4-ti 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
