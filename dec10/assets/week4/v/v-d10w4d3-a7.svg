<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Three sentences linked like a chain: the new information at the end of one becomes the old information at the start of the next">
<title>Three sentences linked like a chain: the new information at the end of one becomes the old information at the start of the next</title>
<style>
.w4d3a7-fl{animation:w4d3a7-fl 6s ease-in-out infinite}.w4d3a7-f2{animation-delay:-2s}.w4d3a7-f3{animation-delay:-4s}
.w4d3a7-tw{animation:w4d3a7-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d3a7-t2{animation-delay:-1s}.w4d3a7-t3{animation-delay:-2s}
.w4d3a7-bl{animation:w4d3a7-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w4d3a7-b2{animation-delay:-1.7s}.w4d3a7-b3{animation-delay:-3.1s}
.w4d3a7-pu{animation:w4d3a7-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d3a7-p2{animation-delay:-1.3s}
.w4d3a7-dr{stroke-dasharray:7 8;animation:w4d3a7-dr 1.8s linear infinite}
.w4d3a7-sw{animation:w4d3a7-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w4d3a7-s2{animation-delay:-2s}
.w4d3a7-sp{animation:w4d3a7-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w4d3a7-ti{animation:w4d3a7-ti 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.w4d3a7-in{animation:w4d3a7-in 7s ease-in-out infinite}.w4d3a7-i2{animation-delay:-2.3s}.w4d3a7-i3{animation-delay:-4.6s}
@keyframes w4d3a7-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w4d3a7-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w4d3a7-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w4d3a7-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w4d3a7-dr{to{stroke-dashoffset:-30}}
@keyframes w4d3a7-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w4d3a7-sp{to{transform:rotate(360deg)}}
@keyframes w4d3a7-ti{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w4d3a7-in{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
