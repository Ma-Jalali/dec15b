<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Group 3 opens the eco-tourism seminar with a slide of a green landscape and sea, in 5 to 7 minutes">
<title>Group 3 opens the eco-tourism seminar with a slide of a green landscape and sea, in 5 to 7 minutes</title>
<style>
.w4d3b3-fl{animation:w4d3b3-fl 6s ease-in-out infinite}.w4d3b3-f2{animation-delay:-2s}.w4d3b3-f3{animation-delay:-4s}
.w4d3b3-tw{animation:w4d3b3-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d3b3-t2{animation-delay:-1s}.w4d3b3-t3{animation-delay:-2s}
.w4d3b3-bl{animation:w4d3b3-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w4d3b3-b2{animation-delay:-1.7s}.w4d3b3-b3{animation-delay:-3.1s}
