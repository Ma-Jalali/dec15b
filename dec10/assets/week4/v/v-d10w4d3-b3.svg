@keyframes w4d3b3-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w4d3b3-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w4d3b3-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w4d3b3-dr{to{stroke-dashoffset:-30}}
@keyframes w4d3b3-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w4d3b3-sp{to{transform:rotate(360deg)}}
@keyframes w4d3b3-ti{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w4d3b3-in{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
