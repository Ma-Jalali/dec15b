.w4d3b3-dr{stroke-dasharray:7 8;animation:w4d3b3-dr 1.8s linear infinite}
.w4d3b3-sw{animation:w4d3b3-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w4d3b3-s2{animation-delay:-2s}
.w4d3b3-sp{animation:w4d3b3-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w4d3b3-ti{animation:w4d3b3-ti 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.w4d3b3-in{animation:w4d3b3-in 7s ease-in-out infinite}.w4d3b3-i2{animation-delay:-2.3s}.w4d3b3-i3{animation-delay:-4.6s}
