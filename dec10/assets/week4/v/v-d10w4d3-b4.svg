<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A discussion board with colourful sticky posts of reactions and questions">
<title>A discussion board with colourful sticky posts of reactions and questions</title>
<style>
.w4d3b4-fl{animation:w4d3b4-fl 6s ease-in-out infinite}.w4d3b4-f2{animation-delay:-2s}.w4d3b4-f3{animation-delay:-4s}
.w4d3b4-tw{animation:w4d3b4-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d3b4-t2{animation-delay:-1s}.w4d3b4-t3{animation-delay:-2s}
.w4d3b4-bl{animation:w4d3b4-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w4d3b4-b2{animation-delay:-1.7s}.w4d3b4-b3{animation-delay:-3.1s}
.w4d3b4-pu{animation:w4d3b4-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d3b4-p2{animation-delay:-1.3s}
.w4d3b4-dr{stroke-dasharray:7 8;animation:w4d3b4-dr 1.8s linear infinite}
.w4d3b4-sw{animation:w4d3b4-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w4d3b4-s2{animation-delay:-2s}
.w4d3b4-sp{animation:w4d3b4-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w4d3b4-ti{animation:w4d3b4-ti 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.w4d3b4-in{animation:w4d3b4-in 7s ease-in-out infinite}.w4d3b4-i2{animation-delay:-2.3s}.w4d3b4-i3{animation-delay:-4.6s}
@keyframes w4d3b4-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w4d3b4-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w4d3b4-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w4d3b4-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w4d3b4-dr{to{stroke-dashoffset:-30}}
@keyframes w4d3b4-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w4d3b4-sp{to{transform:rotate(360deg)}}
@keyframes w4d3b4-ti{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w4d3b4-in{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
