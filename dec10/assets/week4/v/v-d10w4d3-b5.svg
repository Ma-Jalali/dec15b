<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A Week 5 calendar with one day marked, next to a checklist of seminar preparation tasks">
<title>A Week 5 calendar with one day marked, next to a checklist of seminar preparation tasks</title>
<style>
.w4d3b5-fl{animation:w4d3b5-fl 6s ease-in-out infinite}.w4d3b5-f2{animation-delay:-2s}.w4d3b5-f3{animation-delay:-4s}
.w4d3b5-tw{animation:w4d3b5-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d3b5-t2{animation-delay:-1s}.w4d3b5-t3{animation-delay:-2s}
.w4d3b5-bl{animation:w4d3b5-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w4d3b5-b2{animation-delay:-1.7s}.w4d3b5-b3{animation-delay:-3.1s}
.w4d3b5-pu{animation:w4d3b5-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d3b5-p2{animation-delay:-1.3s}
.w4d3b5-dr{stroke-dasharray:7 8;animation:w4d3b5-dr 1.8s linear infinite}
.w4d3b5-sw{animation:w4d3b5-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w4d3b5-s2{animation-delay:-2s}
.w4d3b5-sp{animation:w4d3b5-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w4d3b5-ti{animation:w4d3b5-ti 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.w4d3b5-in{animation:w4d3b5-in 7s ease-in-out infinite}.w4d3b5-i2{animation-delay:-2.3s}.w4d3b5-i3{animation-delay:-4.6s}
@keyframes w4d3b5-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w4d3b5-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w4d3b5-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w4d3b5-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w4d3b5-dr{to{stroke-dashoffset:-30}}
@keyframes w4d3b5-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w4d3b5-sp{to{transform:rotate(360deg)}}
@keyframes w4d3b5-ti{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w4d3b5-in{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
