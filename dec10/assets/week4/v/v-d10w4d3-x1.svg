<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A quiz game board with four coloured categories and 100, 200 and 300 points">
<title>A quiz game board with four coloured categories and 100, 200 and 300 points</title>
<style>
.w4d3x1-fl{animation:w4d3x1-fl 6s ease-in-out infinite}.w4d3x1-f2{animation-delay:-2s}.w4d3x1-f3{animation-delay:-4s}
.w4d3x1-tw{animation:w4d3x1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d3x1-t2{animation-delay:-1s}.w4d3x1-t3{animation-delay:-2s}
.w4d3x1-bl{animation:w4d3x1-bl 5s infinite;transform-box:fill-box;transform-origin:center}.w4d3x1-b2{animation-delay:-1.7s}.w4d3x1-b3{animation-delay:-3.1s}
.w4d3x1-pu{animation:w4d3x1-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w4d3x1-p2{animation-delay:-1.3s}
.w4d3x1-dr{stroke-dasharray:7 8;animation:w4d3x1-dr 1.8s linear infinite}
.w4d3x1-sw{animation:w4d3x1-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w4d3x1-s2{animation-delay:-2s}
.w4d3x1-sp{animation:w4d3x1-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w4d3x1-ti{animation:w4d3x1-ti 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.w4d3x1-in{animation:w4d3x1-in 7s ease-in-out infinite}.w4d3x1-i2{animation-delay:-2.3s}.w4d3x1-i3{animation-delay:-4.6s}
@keyframes w4d3x1-fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes w4d3x1-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1.05)}}
@keyframes w4d3x1-bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w4d3x1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w4d3x1-dr{to{stroke-dashoffset:-30}}
@keyframes w4d3x1-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes w4d3x1-sp{to{transform:rotate(360deg)}}
@keyframes w4d3x1-ti{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w4d3x1-in{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="w4d3x1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7f2"/><stop offset="1" stop-color="#d8ebe2"/></linearGradient>
<pattern id="w4d3x1-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="#2f7d6b" fill-opacity=".14"/></pattern>
<filter id="w4d3x1-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="w4d3x1-sh2" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14293a" flood-opacity=".14"/></filter>
<radialGradient id="w4d3x1-glow" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w4d3x1-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad7e3"/><stop offset="1" stop-color="#3d9fb8"/></linearGradient>
<linearGradient id="w4d3x1-lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc08a"/><stop offset="1" stop-color="#3f8f5a"/></linearGradient>
<linearGradient id="w4d3x1-pp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6f8"/></linearGradient>
</defs>
