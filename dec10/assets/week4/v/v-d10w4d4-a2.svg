<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two sentence strips with two verbs go into a funnel and come out as one shorter strip with one verb; a badge says 2 to 1.">
<title>Two sentences become one with nominalisation</title>
