<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Three round stepping stones numbered 1, 2 and 3 with curved arrows between them; a student hops across from a verb to a finished noun sentence.">
<title>How to nominalise in three steps</title>
