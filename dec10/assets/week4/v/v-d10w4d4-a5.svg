<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A word machine with spinning gears: the verb card assess goes in and the noun card assessment comes out.">
<title>Change verbs and adjectives to nouns</title>
<style>
.v4a5-fl{animation:v4a5-fl 6s ease-in-out infinite}.v4a5-f2{animation-delay:-2s}.v4a5-f3{animation-delay:-4s}
@keyframes v4a5-fl{50%{transform:translateY(-4px)}}
.v4a5-tw{animation:v4a5-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.v4a5-t2{animation-delay:-1s}.v4a5-t3{animation-delay:-2s}
@keyframes v4a5-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.v4a5-bl{animation:v4a5-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.v4a5-b2{animation-delay:-1.7s}.v4a5-b3{animation-delay:-3.1s}
@keyframes v4a5-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.v4a5-dr{stroke-dasharray:5 7;animation:v4a5-dr 1.6s linear infinite}
@keyframes v4a5-dr{to{stroke-dashoffset:-24}}
.v4a5-pu{animation:v4a5-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes v4a5-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.v4a5-sp{animation:v4a5-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.v4a5-sr{animation-direction:reverse}
@keyframes v4a5-sp{to{transform:rotate(360deg)}}
.v4a5-sw{animation:v4a5-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes v4a5-sw{50%{transform:rotate(4deg)}}
.v4a5-gl{animation:v4a5-gl 3s ease-in-out infinite}
@keyframes v4a5-gl{50%{opacity:.45}}
.v4a5-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:v4a5-dw 5s ease-in-out infinite}
@keyframes v4a5-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.v4a5-wv{animation:v4a5-wv 5s ease-in-out infinite}
@keyframes v4a5-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
