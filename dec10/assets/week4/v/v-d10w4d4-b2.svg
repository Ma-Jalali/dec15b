<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two sentence strips: in the top one the source name sits inside the sentence; in the bottom one the source sits in brackets at the end. Tags read internal and external.">
<title>Internal and external citations</title>
<style>
.v4b2-fl{animation:v4b2-fl 6s ease-in-out infinite}.v4b2-f2{animation-delay:-2s}.v4b2-f3{animation-delay:-4s}
