@keyframes v4b2-gl{50%{opacity:.45}}
.v4b2-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:v4b2-dw 5s ease-in-out infinite}
@keyframes v4b2-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.v4b2-wv{animation:v4b2-wv 5s ease-in-out infinite}
@keyframes v4b2-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
