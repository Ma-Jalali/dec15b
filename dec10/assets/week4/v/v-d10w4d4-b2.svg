.v4b2-sp{animation:v4b2-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.v4b2-sr{animation-direction:reverse}
@keyframes v4b2-sp{to{transform:rotate(360deg)}}
.v4b2-sw{animation:v4b2-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes v4b2-sw{50%{transform:rotate(4deg)}}
