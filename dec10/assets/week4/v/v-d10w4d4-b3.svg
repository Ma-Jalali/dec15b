<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A magnifying glass over a sentence with brackets, and three source cards ordered A, M, S in alphabetical order.">
<title>Examples of citations</title>
<style>
.v4b3-fl{animation:v4b3-fl 6s ease-in-out infinite}.v4b3-f2{animation-delay:-2s}.v4b3-f3{animation-delay:-4s}
@keyframes v4b3-fl{50%{transform:translateY(-4px)}}
.v4b3-tw{animation:v4b3-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.v4b3-t2{animation-delay:-1s}.v4b3-t3{animation-delay:-2s}
@keyframes v4b3-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.v4b3-bl{animation:v4b3-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.v4b3-b2{animation-delay:-1.7s}.v4b3-b3{animation-delay:-3.1s}
@keyframes v4b3-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.v4b3-dr{stroke-dasharray:5 7;animation:v4b3-dr 1.6s linear infinite}
@keyframes v4b3-dr{to{stroke-dashoffset:-24}}
.v4b3-pu{animation:v4b3-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes v4b3-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.v4b3-sp{animation:v4b3-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.v4b3-sr{animation-direction:reverse}
@keyframes v4b3-sp{to{transform:rotate(360deg)}}
.v4b3-sw{animation:v4b3-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes v4b3-sw{50%{transform:rotate(4deg)}}
.v4b3-gl{animation:v4b3-gl 3s ease-in-out infinite}
@keyframes v4b3-gl{50%{opacity:.45}}
.v4b3-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:v4b3-dw 5s ease-in-out infinite}
@keyframes v4b3-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.v4b3-wv{animation:v4b3-wv 5s ease-in-out infinite}
@keyframes v4b3-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<filter id="v4b3-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".15"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="v4b3-sh2" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="v4b3-blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<radialGradient id="v4b3-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="v4b3-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="v4b3-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="v4b3-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="v4b3-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e6cd"/><stop offset="1" stop-color="#e8c99c"/></linearGradient>
<linearGradient id="v4b3-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef7f3"/><stop offset="1" stop-color="#d9ece5"/></linearGradient><pattern id="v4b3-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="0.8" fill="#13887a" fill-opacity="0.13"/></pattern><clipPath id="v4b3-clip"><path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z"/></clipPath>
</defs>
<path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" fill="url(#v4b3-bg)"/><g clip-path="url(#v4b3-clip)"><rect width="240" height="180" fill="url(#v4b3-dots)"/><ellipse cx="116" cy="72" rx="110" ry="70" fill="url(#v4b3-glow)"/></g><path d="M44 20C82 6 164 6 198 24c26 14 32 44 28 74-4 34-22 56-58 64-40 8-96 8-126-6C16 144 10 112 14 82c4-30 6-50 30-62z" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/><ellipse cx="120" cy="160" rx="82" ry="6" fill="#14293a" opacity=".1" filter="url(#v4b3-blur)"/>
    <g class="v4b3-fl v4b3-f1"><g filter="url(#v4b3-sh)"><rect x="140" y="28" width="72" height="22" rx="6" fill="#fff"/></g><path d="M146 28h4v22h-4a6 6 0 0 1-6-6v-10a6 6 0 0 1 6-6z" fill="#e64626"/><circle cx="156" cy="39" r="7" fill="#e64626"/><text x="156" y="42" font-family="Manrope, Arial, sans-serif" font-size="8" font-weight="900" fill="#fff" text-anchor="middle">A</text><text x="168" y="42" font-family="Manrope, Arial, sans-serif" font-size="7.5" font-weight="800" fill="#14293a" text-anchor="start">Alom</text></g><g class="v4b3-fl v4b3-f2"><g filter="url(#v4b3-sh)"><rect x="148" y="54" width="72" height="22" rx="6" fill="#fff"/></g><path d="M154 54h4v22h-4a6 6 0 0 1-6-6v-10a6 6 0 0 1 6-6z" fill="#13887a"/><circle cx="164" cy="65" r="7" fill="#13887a"/><text x="164" y="68" font-family="Manrope, Arial, sans-serif" font-size="8" font-weight="900" fill="#fff" text-anchor="middle">M</text><text x="176" y="68" font-family="Manrope, Arial, sans-serif" font-size="7.5" font-weight="800" fill="#14293a" text-anchor="start">Mielly</text></g><g class="v4b3-fl v4b3-f3"><g filter="url(#v4b3-sh)"><rect x="156" y="80" width="72" height="22" rx="6" fill="#fff"/></g><path d="M162 80h4v22h-4a6 6 0 0 1-6-6v-10a6 6 0 0 1 6-6z" fill="#3a58a0"/><circle cx="172" cy="91" r="7" fill="#3a58a0"/><text x="172" y="94" font-family="Manrope, Arial, sans-serif" font-size="8" font-weight="900" fill="#fff" text-anchor="middle">S</text><text x="184" y="94" font-family="Manrope, Arial, sans-serif" font-size="7.5" font-weight="800" fill="#14293a" text-anchor="start">Spenceley</text></g>
    <path class="v4b3-dr" d="M134 34C126 54 126 74 134 92" stroke="#14293a" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M127.1 86.2L134 92L135.6 83.1" stroke="#14293a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="116" y="66" font-family="Manrope, Arial, sans-serif" font-size="7" font-weight="900" fill="#14293a" text-anchor="middle">A→Z</text>
    <g filter="url(#v4b3-sh)"><rect x="18" y="108" width="190" height="30" rx="8" fill="#fff"/></g><path d="M26 123h70" stroke="#cfe3dc" stroke-width="4" stroke-linecap="round"/><text x="102" y="127" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="900" fill="#0b5a51" text-anchor="start">(A; M; S)</text><path d="M156 123h44" stroke="#cfe3dc" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(70 76)"><g class="v4b3-fl v4b3-f2"><circle cx="0" cy="0" r="16" fill="#fff" fill-opacity=".55" stroke="#14293a" stroke-width="4.48"/><path d="M11.52 11.52l12.8 12.8" stroke="#14293a" stroke-width="6.72" stroke-linecap="round"/><path d="M-8 -3.2a8.8 8.8 0 0 1 7.2-6.08" stroke="#fff" stroke-width="2.24" stroke-linecap="round"/><text x="0" y="4" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#13887a" text-anchor="middle">( ; )</text></g></g>
