.v4b4-bl{animation:v4b4-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.v4b4-b2{animation-delay:-1.7s}.v4b4-b3{animation-delay:-3.1s}
@keyframes v4b4-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.v4b4-dr{stroke-dasharray:5 7;animation:v4b4-dr 1.6s linear infinite}
