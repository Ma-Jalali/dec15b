<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A balance scale: the left pan holds the neutral verb states, the right pan holds the evaluative verb claims.">
<title>Discourse and evaluative reporting verbs</title>
<style>
.v4b4-fl{animation:v4b4-fl 6s ease-in-out infinite}.v4b4-f2{animation-delay:-2s}.v4b4-f3{animation-delay:-4s}
