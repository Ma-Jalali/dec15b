.v4c1-dr{stroke-dasharray:5 7;animation:v4c1-dr 1.6s linear infinite}
@keyframes v4c1-dr{to{stroke-dashoffset:-24}}
.v4c1-pu{animation:v4c1-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes v4c1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.v4c1-sp{animation:v4c1-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.v4c1-sr{animation-direction:reverse}
@keyframes v4c1-sp{to{transform:rotate(360deg)}}
.v4c1-sw{animation:v4c1-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes v4c1-sw{50%{transform:rotate(4deg)}}
.v4c1-gl{animation:v4c1-gl 3s ease-in-out infinite}
@keyframes v4c1-gl{50%{opacity:.45}}
.v4c1-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:v4c1-dw 5s ease-in-out infinite}
@keyframes v4c1-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.v4c1-wv{animation:v4c1-wv 5s ease-in-out infinite}
@keyframes v4c1-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
