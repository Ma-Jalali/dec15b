<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two essay pages labelled 4.1 and 4.2 face each other with VS between them; a small spinner wheel turns below.">
<title>Review Sample 2</title>
<style>
.v4c1-fl{animation:v4c1-fl 6s ease-in-out infinite}.v4c1-f2{animation-delay:-2s}.v4c1-f3{animation-delay:-4s}
@keyframes v4c1-fl{50%{transform:translateY(-4px)}}
.v4c1-tw{animation:v4c1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.v4c1-t2{animation-delay:-1s}.v4c1-t3{animation-delay:-2s}
