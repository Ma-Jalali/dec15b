<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="An introduction paragraph shown as four sentence bars, three gold for the writer’s voice and one teal for sources, under a magnifying glass.">
<title>Look at the introduction</title>
<style>
.v4c2-fl{animation:v4c2-fl 6s ease-in-out infinite}.v4c2-f2{animation-delay:-2s}.v4c2-f3{animation-delay:-4s}
