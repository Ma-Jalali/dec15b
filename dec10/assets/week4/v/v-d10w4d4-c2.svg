@keyframes v4c2-sp{to{transform:rotate(360deg)}}
.v4c2-sw{animation:v4c2-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes v4c2-sw{50%{transform:rotate(4deg)}}
.v4c2-gl{animation:v4c2-gl 3s ease-in-out infinite}
@keyframes v4c2-gl{50%{opacity:.45}}
.v4c2-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:v4c2-dw 5s ease-in-out infinite}
@keyframes v4c2-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.v4c2-wv{animation:v4c2-wv 5s ease-in-out infinite}
@keyframes v4c2-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
