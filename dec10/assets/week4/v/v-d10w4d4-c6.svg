.v4c6-dr{stroke-dasharray:5 7;animation:v4c6-dr 1.6s linear infinite}
@keyframes v4c6-dr{to{stroke-dashoffset:-24}}
.v4c6-pu{animation:v4c6-pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes v4c6-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.v4c6-sp{animation:v4c6-sp 10s linear infinite;transform-box:fill-box;transform-origin:center}.v4c6-sr{animation-direction:reverse}
@keyframes v4c6-sp{to{transform:rotate(360deg)}}
.v4c6-sw{animation:v4c6-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes v4c6-sw{50%{transform:rotate(4deg)}}
.v4c6-gl{animation:v4c6-gl 3s ease-in-out infinite}
@keyframes v4c6-gl{50%{opacity:.45}}
.v4c6-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:v4c6-dw 5s ease-in-out infinite}
@keyframes v4c6-dw{30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.v4c6-wv{animation:v4c6-wv 5s ease-in-out infinite}
@keyframes v4c6-wv{50%{transform:translateX(-10px)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
