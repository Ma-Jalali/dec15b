.v4c6-tw{animation:v4c6-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.v4c6-t2{animation-delay:-1s}.v4c6-t3{animation-delay:-2s}
@keyframes v4c6-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.v4c6-bl{animation:v4c6-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.v4c6-b2{animation-delay:-1.7s}.v4c6-b3{animation-delay:-3.1s}
