<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A mini tutorial: a tutor and a student talk; the student’s speech bubbles show a citation tag and a gold voice bubble.">
<title>Speak with sources and voice</title>
<style>
.v4c6-fl{animation:v4c6-fl 6s ease-in-out infinite}.v4c6-f2{animation-delay:-2s}.v4c6-f3{animation-delay:-4s}
