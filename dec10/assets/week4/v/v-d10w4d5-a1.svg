<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A student sits calmly with eyes closed, with a heart (feelings) and four letter stones O F N R">
<title>A student sits calmly with eyes closed, with a heart (feelings) and four letter stones O F N R</title>
<style>
.va1-fl{animation:va1-fl 6s ease-in-out infinite}.va1-f2{animation-delay:-2s}.va1-f3{animation-delay:-4s}
@keyframes va1-fl{50%{transform:translateY(-6px)}}
.va1-tw{animation:va1-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.va1-t2{animation-delay:-1.1s}.va1-t3{animation-delay:-2.2s}
@keyframes va1-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.va1-bl{animation:va1-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.va1-b2{animation-delay:-1.6s}.va1-b3{animation-delay:-3.1s}
