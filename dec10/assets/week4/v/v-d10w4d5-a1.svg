.va1-sp{animation:va1-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes va1-sp{to{transform:rotate(360deg)}}
.va1-sw{animation:va1-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes va1-sw{50%{transform:rotate(3deg)}}
.va1-wv{animation:va1-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.va1-w2{animation-delay:-1s}
@keyframes va1-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.va1-ty{animation:va1-ty 1.4s steps(1) infinite}.va1-y2{animation-delay:-.45s}.va1-y3{animation-delay:-.9s}
