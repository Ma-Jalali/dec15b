<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="An email from Matt lands in the group inbox with an apology and a moon icon for “online one evening”">
<title>An email from Matt lands in the group inbox with an apology and a moon icon for “online one evening”</title>
<style>
.va2-fl{animation:va2-fl 6s ease-in-out infinite}.va2-f2{animation-delay:-2s}.va2-f3{animation-delay:-4s}
@keyframes va2-fl{50%{transform:translateY(-6px)}}
.va2-tw{animation:va2-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.va2-t2{animation-delay:-1.1s}.va2-t3{animation-delay:-2.2s}
@keyframes va2-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.va2-bl{animation:va2-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.va2-b2{animation-delay:-1.6s}.va2-b3{animation-delay:-3.1s}
@keyframes va2-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.va2-pu{animation:va2-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes va2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.va2-dr{stroke-dasharray:6 9;animation:va2-dr 1.6s linear infinite}
@keyframes va2-dr{to{stroke-dashoffset:-30}}
.va2-sp{animation:va2-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes va2-sp{to{transform:rotate(360deg)}}
.va2-sw{animation:va2-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes va2-sw{50%{transform:rotate(3deg)}}
.va2-wv{animation:va2-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.va2-w2{animation-delay:-1s}
@keyframes va2-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.va2-ty{animation:va2-ty 1.4s steps(1) infinite}.va2-y2{animation-delay:-.45s}.va2-y3{animation-delay:-.9s}
@keyframes va2-ty{0%,100%{opacity:1}50%{opacity:.2}}
.va2-sl{animation:va2-sl 9s ease-in-out infinite}
@keyframes va2-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="va2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f4ee"/><stop offset="1" stop-color="#d2e9dd"/></linearGradient>
<pattern id="va2-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="va2-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="va2-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="va2-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="va2-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="va2-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="va2-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="va2-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="va2-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="va2-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="va2-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#va2-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#va2-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#va2-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#va2-blur)"/><circle cx="200" cy="150" r="60" fill="#2f7d6b" fill-opacity="0.14" filter="url(#va2-blur)"/>

<g filter="url(#va2-sh)" class="va2-fl"><rect x="34" y="40" width="130" height="96" rx="10" fill="url(#va2-paper)"/><path d="M34 50l65 44 65-44" stroke="#2f7d6b" stroke-width="3" fill="none"/><path d="M50 108h60M50 120h80" stroke="#9aa8b4" stroke-width="5" stroke-linecap="round"/></g>
<g transform="translate(140 34)"><circle r="16" fill="#c4562f" class="va2-pu"/><text y="6" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">1</text></g>
<g transform="translate(196 110) scale(0.85) scale(-1 1)">

<path d="M-22 70c0-26 8-46 22-46s22 20 22 46z" fill="#3a58a0"/>
<path d="M-6 24h12l-6 10z" fill="#fff" fill-opacity=".85"/>
<path d="M15 28 20 52" stroke="#2e4680" stroke-width="9" stroke-linecap="round"/><path d="M-15 28-20 52" stroke="#2e4680" stroke-width="9" stroke-linecap="round"/>
<rect x="-5" y="12" width="10" height="12" rx="4" fill="#dab395"/>
<circle cx="0" cy="0" r="17" fill="#f2c7a5"/>
<ellipse cx="-17" cy="2" rx="3" ry="4.5" fill="#dfb798"/><ellipse cx="17" cy="2" rx="3" ry="4.5" fill="#dfb798"/>
<path d="M-17 -5c-1-15 8-23 18-23 11 0 18 8 17 21-4-7-11-10-18-10-7 0-13 4-17 12z" fill="#4a2f22"/>
<g class="va2-bl "><ellipse cx="-6" cy="0" rx="2.1" ry="2.7" fill="#1d1a1a"/><ellipse cx="6" cy="0" rx="2.1" ry="2.7" fill="#1d1a1a"/></g>
<circle cx="-5.2" cy="-1" r=".8" fill="#fff"/><circle cx="6.8" cy="-1" r=".8" fill="#fff"/>
<ellipse cx="-10" cy="6" rx="3" ry="1.8" fill="#e8846b" fill-opacity=".35"/><ellipse cx="10" cy="6" rx="3" ry="1.8" fill="#e8846b" fill-opacity=".35"/>
<path d="M-5 7q5 5 10 0" stroke="#7a3a2a" stroke-width="2" stroke-linecap="round"/>

</g>
<g transform="translate(200 40)" class="va2-fl va2-f2"><path d="M8-14a16 16 0 1 0 12 26 13 13 0 1 1-12-26z" fill="#e3a843"/></g><path class="va2-tw va2-t" d="M170 25Q171 29 175 30Q171 31 170 35Q169 31 165 30Q169 29 170 25z" fill="#e3a843"/>
</g>
<rect x="6.5" y="6.5" width="227" height="167" rx="30" stroke="#14293a" stroke-opacity=".08"/>
</svg>