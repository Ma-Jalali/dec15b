size="10" font-weight="900" fill="#f7d27a" text-anchor="middle">100</text><rect x="165" y="64" width="36" height="24" rx="4" fill="#2b4a8a"/><text x="183" y="81" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="900" fill="#f7d27a" text-anchor="middle">200</text><rect x="165" y="94" width="36" height="24" rx="4" fill="#2b4a8a"/><text x="183" y="111" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="900" fill="#f7d27a" text-anchor="middle">300</text>
<g transform="translate(70 150)" class="vb1-fl vb1-f1"><ellipse cy="6" rx="16" ry="6" fill="#14293a" fill-opacity=".2"/><path d="M-14 4v-6a14 8 0 0 1 28 0v6z" fill="#2f7d6b"/><ellipse cy="-4" rx="10" ry="5" fill="#fff" fill-opacity=".5"/></g><g transform="translate(120 150)" class="vb1-fl vb1-f2"><ellipse cy="6" rx="16" ry="6" fill="#14293a" fill-opacity=".2"/><path d="M-14 4v-6a14 8 0 0 1 28 0v6z" fill="#c4562f"/><ellipse cy="-4" rx="10" ry="5" fill="#fff" fill-opacity=".5"/></g><g transform="translate(170 150)" class="vb1-fl vb1-f3"><ellipse cy="6" rx="16" ry="6" fill="#14293a" fill-opacity=".2"/><path d="M-14 4v-6a14 8 0 0 1 28 0v6z" fill="#8a4f9e"/><ellipse cy="-4" rx="10" ry="5" fill="#fff" fill-opacity=".5"/></g>
