<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A quiz-show board with point cards 100 to 400 and three team buzzers">
<title>A quiz-show board with point cards 100 to 400 and three team buzzers</title>
<style>
.vb1-fl{animation:vb1-fl 6s ease-in-out infinite}.vb1-f2{animation-delay:-2s}.vb1-f3{animation-delay:-4s}
@keyframes vb1-fl{50%{translate:0 -6px}}
.vb1-tw{animation:vb1-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb1-t2{animation-delay:-1.1s}.vb1-t3{animation-delay:-2.2s}
@keyframes vb1-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.vb1-bl{animation:vb1-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vb1-b2{animation-delay:-1.6s}.vb1-b3{animation-delay:-3.1s}
@keyframes vb1-bl{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.vb1-pu{animation:vb1-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb1-pu{0%,100%{scale:1}50%{scale:1.08}}
.vb1-dr{stroke-dasharray:6 9;animation:vb1-dr 1.6s linear infinite}
@keyframes vb1-dr{to{stroke-dashoffset:-30}}
.vb1-sp{animation:vb1-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb1-sp{to{rotate:360deg}}
.vb1-sw{animation:vb1-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes vb1-sw{50%{rotate:3deg}}
.vb1-wv{animation:vb1-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.vb1-w2{animation-delay:-1s}
@keyframes vb1-wv{0%{opacity:0;scale:.7}30%{opacity:.9}100%{opacity:0;scale:1.3}}
.vb1-ty{animation:vb1-ty 1.4s steps(1) infinite}.vb1-y2{animation-delay:-.45s}.vb1-y3{animation-delay:-.9s}
@keyframes vb1-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vb1-sl{animation:vb1-sl 9s ease-in-out infinite}
@keyframes vb1-sl{50%{translate:14px 0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vb1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf2fb"/><stop offset="1" stop-color="#d9e3f5"/></linearGradient>
<pattern id="vb1-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vb1-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vb1-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vb1-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="vb1-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="vb1-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="vb1-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="vb1-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vb1-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="vb1-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="vb1-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#vb1-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vb1-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vb1-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#vb1-blur)"/><circle cx="200" cy="150" r="60" fill="#3a58a0" fill-opacity="0.14" filter="url(#vb1-blur)"/>

<g filter="url(#vb1-sh)"><rect x="34" y="26" width="172" height="100" rx="10" fill="#1d3346"/></g>
