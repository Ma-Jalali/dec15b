<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A magnifying glass checks an AI answer: some lines get a green tick, one gets a red cross">
<title>A magnifying glass checks an AI answer: some lines get a green tick, one gets a red cross</title>
<style>
.vb3-fl{animation:vb3-fl 6s ease-in-out infinite}.vb3-f2{animation-delay:-2s}.vb3-f3{animation-delay:-4s}
@keyframes vb3-fl{50%{transform:translateY(-6px)}}
.vb3-tw{animation:vb3-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb3-t2{animation-delay:-1.1s}.vb3-t3{animation-delay:-2.2s}
@keyframes vb3-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.vb3-bl{animation:vb3-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vb3-b2{animation-delay:-1.6s}.vb3-b3{animation-delay:-3.1s}
@keyframes vb3-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.vb3-pu{animation:vb3-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb3-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.vb3-dr{stroke-dasharray:6 9;animation:vb3-dr 1.6s linear infinite}
@keyframes vb3-dr{to{stroke-dashoffset:-30}}
.vb3-sp{animation:vb3-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb3-sp{to{transform:rotate(360deg)}}
.vb3-sw{animation:vb3-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes vb3-sw{50%{transform:rotate(3deg)}}
.vb3-wv{animation:vb3-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.vb3-w2{animation-delay:-1s}
@keyframes vb3-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.vb3-ty{animation:vb3-ty 1.4s steps(1) infinite}.vb3-y2{animation-delay:-.45s}.vb3-y3{animation-delay:-.9s}
@keyframes vb3-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vb3-sl{animation:vb3-sl 9s ease-in-out infinite}
@keyframes vb3-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vb3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf2fb"/><stop offset="1" stop-color="#d9e3f5"/></linearGradient>
<pattern id="vb3-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vb3-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vb3-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vb3-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="vb3-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="vb3-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="vb3-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="vb3-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vb3-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="vb3-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="vb3-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#vb3-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vb3-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vb3-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#vb3-blur)"/><circle cx="200" cy="150" r="60" fill="#3a58a0" fill-opacity="0.14" filter="url(#vb3-blur)"/>

<g transform="translate(40 30)" filter="url(#vb3-sh)"><rect width="130" height="120" rx="12" fill="url(#vb3-paper)"/><path d="M0 12a12 12 0 0 1 12-12h106a12 12 0 0 1 12 12v12H0z" fill="#3a58a0"/><circle cx="14" cy="12" r="3" fill="#fff" fill-opacity=".7"/><circle cx="24" cy="12" r="3" fill="#fff" fill-opacity=".5"/><circle cx="34" cy="12" r="3" fill="#fff" fill-opacity=".35"/><text x="65" y="16" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">AI</text><rect x="12" y="34" width="100" height="16" rx="8" fill="#dbe5f6"/><rect x="12" y="58" width="80" height="16" rx="8" fill="#dbe5f6"/><rect x="12" y="82" width="106" height="16" rx="8" fill="#f6d2c4"/><rect x="12" y="106" width="70" height="16" rx="8" fill="#dbe5f6"/></g>
<g transform="translate(186 72) scale(0.9)"><circle r="11" fill="#2f7d6b"/><path d="M-5 0l3.5 3.5L5.5-4" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(186 96) scale(0.9)"><circle r="11" fill="#2f7d6b"/><path d="M-5 0l3.5 3.5L5.5-4" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(186 120) scale(0.9)"><circle r="11" fill="#c4562f"/><path d="M-4-4l8 8M4-4l-8 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g>
<g class="vb3-sl"><g transform="translate(120 104)" filter="url(#vb3-sh)"><path d="M17.68 17.68l18.2 18.2" stroke="#14293a" stroke-width="7.280000000000001" stroke-linecap="round"/><path d="M17.68 17.68l18.2 18.2" stroke="#e3a843" stroke-width="3.6400000000000006" stroke-linecap="round"/><circle r="26" fill="#eaf4fb" fill-opacity=".75"/><circle r="26" stroke="#14293a" stroke-width="4.16"/><path d="M-14.3 -7.8a15.6 15.6 0 0 1 11.700000000000001 -9.1" stroke="#fff" stroke-width="3.12" stroke-linecap="round"/></g></g>
</g>
<rect x="6.5" y="6.5" width="227" height="167" rx="30" stroke="#14293a" stroke-opacity=".08"/>
</svg>