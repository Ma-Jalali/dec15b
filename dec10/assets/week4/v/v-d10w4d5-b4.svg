<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A conversation loop: a question bubble, an AI answer bubble and a follow-up bubble connected by a circular arrow">
<title>A conversation loop: a question bubble, an AI answer bubble and a follow-up bubble connected by a circular arrow</title>
<style>
.vb4-fl{animation:vb4-fl 6s ease-in-out infinite}.vb4-f2{animation-delay:-2s}.vb4-f3{animation-delay:-4s}
@keyframes vb4-fl{50%{translate:0 -6px}}
.vb4-tw{animation:vb4-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vb4-t2{animation-delay:-1.1s}.vb4-t3{animation-delay:-2.2s}
@keyframes vb4-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.vb4-bl{animation:vb4-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vb4-b2{animation-delay:-1.6s}.vb4-b3{animation-delay:-3.1s}
@keyframes vb4-bl{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.vb4-pu{animation:vb4-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb4-pu{0%,100%{scale:1}50%{scale:1.08}}
.vb4-dr{stroke-dasharray:6 9;animation:vb4-dr 1.6s linear infinite}
@keyframes vb4-dr{to{stroke-dashoffset:-30}}
.vb4-sp{animation:vb4-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vb4-sp{to{rotate:360deg}}
.vb4-sw{animation:vb4-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes vb4-sw{50%{rotate:3deg}}
.vb4-wv{animation:vb4-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.vb4-w2{animation-delay:-1s}
@keyframes vb4-wv{0%{opacity:0;scale:.7}30%{opacity:.9}100%{opacity:0;scale:1.3}}
.vb4-ty{animation:vb4-ty 1.4s steps(1) infinite}.vb4-y2{animation-delay:-.45s}.vb4-y3{animation-delay:-.9s}
@keyframes vb4-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vb4-sl{animation:vb4-sl 9s ease-in-out infinite}
@keyframes vb4-sl{50%{translate:14px 0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vb4-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf2fb"/><stop offset="1" stop-color="#d9e3f5"/></linearGradient>
<pattern id="vb4-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vb4-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vb4-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vb4-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="vb4-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="vb4-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="vb4-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="vb4-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vb4-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="vb4-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="vb4-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#vb4-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vb4-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vb4-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#vb4-blur)"/><circle cx="200" cy="150" r="60" fill="#3a58a0" fill-opacity="0.14" filter="url(#vb4-blur)"/>

<defs><marker id="vb4-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a58a0"/></marker></defs>
<circle cx="120" cy="92" r="52" stroke="#3a58a0" stroke-width="4" fill="none" class="vb4-dr"/>
<g filter="url(#vb4-sh2)" class="vb4-fl"><path d="M60 58L60 70L76 58z" fill="#fff"/><rect x="30" y="30" width="70" height="30" rx="14" fill="#fff"/><text x="65" y="49.55" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#14293a" text-anchor="middle">Q1?</text></g>
<g filter="url(#vb4-sh2)" class="vb4-fl vb4-f2"><path d="M164 92L160 104L180 92z" fill="#dbe5f6"/><rect x="150" y="64" width="70" height="30" rx="14" fill="#dbe5f6"/><text x="185" y="83.55" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#14293a" text-anchor="middle">AI …</text></g>
<g filter="url(#vb4-sh2)" class="vb4-fl vb4-f3"><path d="M70 146L70 156L86 146z" fill="#fff"/><rect x="40" y="118" width="90" height="30" rx="14" fill="#fff"/><text x="85" y="137.2" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="700" fill="#14293a" text-anchor="middle">Follow-up?</text></g>
<g transform="translate(196 150) scale(0.5)" class="vb4-fl vb4-f3"><path d="M0-34v-10" stroke="#3a58a0" stroke-width="3"/><circle cx="0" cy="-47" r="5" fill="#e3a843" class="vb4-pu"/><rect x="-28" y="-34" width="56" height="44" rx="14" fill="#fff" stroke="#3a58a0" stroke-width="3"/><rect x="-20" y="-24" width="40" height="22" rx="8" fill="#1d3346"/><circle cx="-8" cy="-13" r="4" fill="#7cc7d6" class="vb4-bl"/><circle cx="8" cy="-13" r="4" fill="#7cc7d6" class="vb4-bl"/><path d="M-6 2q6 4 12 0" stroke="#3a58a0" stroke-width="2.4" stroke-linecap="round"/></g>
</g>
<rect x="6.5" y="6.5" width="227" height="167" rx="30" stroke="#14293a" stroke-opacity=".08"/>
</svg>