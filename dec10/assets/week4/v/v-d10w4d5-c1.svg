<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="An opinion slider moves from a grey Monday dot to a green Friday dot; a student thinks with a lightbulb">
<title>An opinion slider moves from a grey Monday dot to a green Friday dot; a student thinks with a lightbulb</title>
<style>
.vc1-fl{animation:vc1-fl 6s ease-in-out infinite}.vc1-f2{animation-delay:-2s}.vc1-f3{animation-delay:-4s}
@keyframes vc1-fl{50%{translate:0 -6px}}
.vc1-tw{animation:vc1-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vc1-t2{animation-delay:-1.1s}.vc1-t3{animation-delay:-2.2s}
@keyframes vc1-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.vc1-bl{animation:vc1-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vc1-b2{animation-delay:-1.6s}.vc1-b3{animation-delay:-3.1s}
@keyframes vc1-bl{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.vc1-pu{animation:vc1-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vc1-pu{0%,100%{scale:1}50%{scale:1.08}}
.vc1-dr{stroke-dasharray:6 9;animation:vc1-dr 1.6s linear infinite}
@keyframes vc1-dr{to{stroke-dashoffset:-30}}
.vc1-sp{animation:vc1-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vc1-sp{to{rotate:360deg}}
.vc1-sw{animation:vc1-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes vc1-sw{50%{rotate:3deg}}
.vc1-wv{animation:vc1-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.vc1-w2{animation-delay:-1s}
@keyframes vc1-wv{0%{opacity:0;scale:.7}30%{opacity:.9}100%{opacity:0;scale:1.3}}
.vc1-ty{animation:vc1-ty 1.4s steps(1) infinite}.vc1-y2{animation-delay:-.45s}.vc1-y3{animation-delay:-.9s}
@keyframes vc1-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vc1-sl{animation:vc1-sl 9s ease-in-out infinite}
@keyframes vc1-sl{50%{translate:14px 0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vc1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f3f4"/><stop offset="1" stop-color="#d0e8ec"/></linearGradient>
<pattern id="vc1-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vc1-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vc1-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vc1-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="vc1-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="vc1-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="vc1-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="vc1-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vc1-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="vc1-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="vc1-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#vc1-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vc1-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vc1-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#vc1-blur)"/><circle cx="200" cy="150" r="60" fill="#2d7a9a" fill-opacity="0.14" filter="url(#vc1-blur)"/>

<rect x="30" y="56" width="180" height="10" rx="5" fill="#c9d8de"/><circle cx="150" cy="61" r="10" fill="#9aa8b4"/><g class="vc1-sl"><circle cx="86" cy="61" r="12" fill="#2f7d6b" filter="url(#vc1-sh2)"/></g>
<text x="150" y="40" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#41566a" text-anchor="middle">Mon</text><text x="86" y="40" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="800" fill="#2f7d6b" text-anchor="middle">Fri</text>
<g transform="translate(120 120) scale(0.9)">
<circle cx="0" cy="-30" r="9" fill="#2a1d17"/>
<path d="M-22 70c0-26 8-46 22-46s22 20 22 46z" fill="#2d7a9a"/>
<path d="M-6 24h12l-6 10z" fill="#fff" fill-opacity=".85"/>
<path d="M15 28 20 52" stroke="#24627b" stroke-width="9" stroke-linecap="round"/><path d="M-15 28-20 52" stroke="#24627b" stroke-width="9" stroke-linecap="round"/>
<rect x="-5" y="12" width="10" height="12" rx="4" fill="#c3906e"/>
<circle cx="0" cy="0" r="17" fill="#d9a07a"/>
<ellipse cx="-17" cy="2" rx="3" ry="4.5" fill="#c89370"/><ellipse cx="17" cy="2" rx="3" ry="4.5" fill="#c89370"/>
<path d="M-17 -4c0-14 8-22 17-22s17 8 17 22c-6-9-16-12-23-11-5 1-9 5-11 11z" fill="#2a1d17"/>
<g class="vc1-bl "><ellipse cx="-6" cy="0" rx="2.1" ry="2.7" fill="#1d1a1a"/><ellipse cx="6" cy="0" rx="2.1" ry="2.7" fill="#1d1a1a"/></g>
<circle cx="-5.2" cy="-1" r=".8" fill="#fff"/><circle cx="6.8" cy="-1" r=".8" fill="#fff"/>
<ellipse cx="-10" cy="6" rx="3" ry="1.8" fill="#e8846b" fill-opacity=".35"/><ellipse cx="10" cy="6" rx="3" ry="1.8" fill="#e8846b" fill-opacity=".35"/>
<path d="M-5 7q5 5 10 0" stroke="#7a3a2a" stroke-width="2" stroke-linecap="round"/>

</g>
<g transform="translate(170 108)" class="vc1-pu"><circle r="12" fill="#f7d27a"/><rect x="-5" y="10" width="10" height="7" rx="2" fill="#9aa8b4"/></g>
</g>
<rect x="6.5" y="6.5" width="227" height="167" rx="30" stroke="#14293a" stroke-opacity=".08"/>
</svg>