<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Three option cards on a table with a balance and a ten-minute timer">
<title>Three option cards on a table with a balance and a ten-minute timer</title>
<style>
.vc3-fl{animation:vc3-fl 6s ease-in-out infinite}.vc3-f2{animation-delay:-2s}.vc3-f3{animation-delay:-4s}
@keyframes vc3-fl{50%{transform:translateY(-6px)}}
.vc3-tw{animation:vc3-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vc3-t2{animation-delay:-1.1s}.vc3-t3{animation-delay:-2.2s}
@keyframes vc3-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.vc3-bl{animation:vc3-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vc3-b2{animation-delay:-1.6s}.vc3-b3{animation-delay:-3.1s}
@keyframes vc3-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.vc3-pu{animation:vc3-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vc3-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.vc3-dr{stroke-dasharray:6 9;animation:vc3-dr 1.6s linear infinite}
@keyframes vc3-dr{to{stroke-dashoffset:-30}}
.vc3-sp{animation:vc3-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vc3-sp{to{transform:rotate(360deg)}}
.vc3-sw{animation:vc3-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes vc3-sw{50%{transform:rotate(3deg)}}
.vc3-wv{animation:vc3-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.vc3-w2{animation-delay:-1s}
@keyframes vc3-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.vc3-ty{animation:vc3-ty 1.4s steps(1) infinite}.vc3-y2{animation-delay:-.45s}.vc3-y3{animation-delay:-.9s}
@keyframes vc3-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vc3-sl{animation:vc3-sl 9s ease-in-out infinite}
@keyframes vc3-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vc3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f3f4"/><stop offset="1" stop-color="#d0e8ec"/></linearGradient>
<pattern id="vc3-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vc3-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vc3-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vc3-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="vc3-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="vc3-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="vc3-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="vc3-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vc3-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="vc3-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="vc3-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#vc3-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vc3-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vc3-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#vc3-blur)"/><circle cx="200" cy="150" r="60" fill="#2d7a9a" fill-opacity="0.14" filter="url(#vc3-blur)"/>

<g filter="url(#vc3-sh)"><ellipse cx="120" cy="148" rx="96" ry="24" fill="#a17b4e"/><ellipse cx="120" cy="140" rx="96" ry="24" fill="#c99a62"/><ellipse cx="91.2" cy="132.8" rx="38.400000000000006" ry="7.199999999999999" fill="#fff" fill-opacity=".14"/></g>
<g transform="translate(70 118) rotate(-6)" filter="url(#vc3-sh2)"><rect width="30" height="26" rx="5" fill="#cfe9e1"/><text x="15" y="18" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="900" fill="#14293a" text-anchor="middle">①</text></g><g transform="translate(106 118) rotate(0)" filter="url(#vc3-sh2)"><rect width="30" height="26" rx="5" fill="#dbe5f6"/><text x="15" y="18" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="900" fill="#14293a" text-anchor="middle">②</text></g><g transform="translate(142 118) rotate(6)" filter="url(#vc3-sh2)"><rect width="30" height="26" rx="5" fill="#fbe9c6"/><text x="15" y="18" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="900" fill="#14293a" text-anchor="middle">③</text></g>
<g transform="translate(110 90) scale(0.6)" filter="url(#vc3-sh2)"><path d="M0 0v-56" stroke="#14293a" stroke-width="4"/><path d="M-20 0h40" stroke="#14293a" stroke-width="5" stroke-linecap="round"/><g class="vc3-sw"><path d="M-46-56h92" stroke="#14293a" stroke-width="4" stroke-linecap="round"/><path d="M-46-56l-14 26h28zM46-56l-14 26h28z" stroke="#14293a" stroke-width="1.5" fill="none"/><path d="M-62-30a16 7 0 0 0 32 0z" fill="url(#vc3-gold)"/><path d="M30-30a16 7 0 0 0 32 0z" fill="url(#vc3-gold)"/></g><circle cx="0" cy="-58" r="5" fill="url(#vc3-gold)"/></g>
<g transform="translate(196 52)" class="vc3-fl"><circle r="18" fill="#fff" stroke="#2d7a9a" stroke-width="3"/><text y="5" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="900" fill="#2d7a9a" text-anchor="middle">10’</text></g>
</g>
<rect x="6.5" y="6.5" width="227" height="167" rx="30" stroke="#14293a" stroke-opacity=".08"/>
</svg>