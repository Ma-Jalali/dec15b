.vc4-sp{animation:vc4-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vc4-sp{to{rotate:360deg}}
.vc4-sw{animation:vc4-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
