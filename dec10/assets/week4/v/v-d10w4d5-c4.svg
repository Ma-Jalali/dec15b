.vc4-tw{animation:vc4-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vc4-t2{animation-delay:-1.1s}.vc4-t3{animation-delay:-2.2s}
@keyframes vc4-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.vc4-bl{animation:vc4-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vc4-b2{animation-delay:-1.6s}.vc4-b3{animation-delay:-3.1s}
@keyframes vc4-bl{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.vc4-pu{animation:vc4-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
