<title>A student looks into a mirror and writes a reflection on a rubric card with stars</title>
<style>
.vc4-fl{animation:vc4-fl 6s ease-in-out infinite}.vc4-f2{animation-delay:-2s}.vc4-f3{animation-delay:-4s}
