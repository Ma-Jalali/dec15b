.vc4-ty{animation:vc4-ty 1.4s steps(1) infinite}.vc4-y2{animation-delay:-.45s}.vc4-y3{animation-delay:-.9s}
@keyframes vc4-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vc4-sl{animation:vc4-sl 9s ease-in-out infinite}
