<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A gold star with the word STAR shines over a small classroom">
<title>A gold star with the word STAR shines over a small classroom</title>
<style>
.vd1-fl{animation:vd1-fl 6s ease-in-out infinite}.vd1-f2{animation-delay:-2s}.vd1-f3{animation-delay:-4s}
@keyframes vd1-fl{50%{transform:translateY(-6px)}}
.vd1-tw{animation:vd1-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd1-t2{animation-delay:-1.1s}.vd1-t3{animation-delay:-2.2s}
@keyframes vd1-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.vd1-bl{animation:vd1-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vd1-b2{animation-delay:-1.6s}.vd1-b3{animation-delay:-3.1s}
@keyframes vd1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.vd1-pu{animation:vd1-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.vd1-dr{stroke-dasharray:6 9;animation:vd1-dr 1.6s linear infinite}
@keyframes vd1-dr{to{stroke-dashoffset:-30}}
.vd1-sp{animation:vd1-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd1-sp{to{transform:rotate(360deg)}}
.vd1-sw{animation:vd1-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes vd1-sw{50%{transform:rotate(3deg)}}
.vd1-wv{animation:vd1-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.vd1-w2{animation-delay:-1s}
@keyframes vd1-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.vd1-ty{animation:vd1-ty 1.4s steps(1) infinite}.vd1-y2{animation-delay:-.45s}.vd1-y3{animation-delay:-.9s}
@keyframes vd1-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vd1-sl{animation:vd1-sl 9s ease-in-out infinite}
@keyframes vd1-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vd1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf5e4"/><stop offset="1" stop-color="#fae6c0"/></linearGradient>
<pattern id="vd1-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vd1-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vd1-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vd1-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="vd1-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="vd1-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="vd1-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="vd1-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vd1-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="vd1-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="vd1-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#vd1-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vd1-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vd1-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#vd1-blur)"/><circle cx="200" cy="150" r="60" fill="#c4831f" fill-opacity="0.14" filter="url(#vd1-blur)"/>

<circle cx="120" cy="80" r="56" fill="url(#vd1-glow)"/><path d="M120.0 36.0L131.6 64.0L161.8 66.4L138.8 86.1L145.9 115.6L120.0 99.8L94.1 115.6L101.2 86.1L78.2 66.4L108.4 64.0z" fill="url(#vd1-gold)" filter="url(#vd1-sh)" class="vd1-pu"/><text x="120" y="88" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#7a4a0c" text-anchor="middle">STAR</text>
<path class="vd1-tw vd1-t" d="M54 32Q55.6 38.4 62 40Q55.6 41.6 54 48Q52.4 41.6 46 40Q52.4 38.4 54 32z" fill="#fff"/><path class="vd1-tw vd1-t2" d="M190 123Q191.4 128.6 197 130Q191.4 131.4 190 137Q188.6 131.4 183 130Q188.6 128.6 190 123z" fill="#c4831f"/><path class="vd1-tw vd1-t3" d="M196 35Q197 39 201 40Q197 41 196 45Q195 41 191 40Q195 39 196 35z" fill="#fff"/>
<path d="M40 160h160" stroke="#c4831f" stroke-opacity=".4" stroke-width="6" stroke-linecap="round"/>
</g>
<rect x="6.5" y="6.5" width="227" height="167" rx="30" stroke="#14293a" stroke-opacity=".08"/>
</svg>