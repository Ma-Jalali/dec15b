<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A self-check card with three faces: confident, getting there and I need help">
<title>A self-check card with three faces: confident, getting there and I need help</title>
<style>
.vd2-fl{animation:vd2-fl 6s ease-in-out infinite}.vd2-f2{animation-delay:-2s}.vd2-f3{animation-delay:-4s}
@keyframes vd2-fl{50%{transform:translateY(-6px)}}
.vd2-tw{animation:vd2-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd2-t2{animation-delay:-1.1s}.vd2-t3{animation-delay:-2.2s}
@keyframes vd2-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.vd2-bl{animation:vd2-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vd2-b2{animation-delay:-1.6s}.vd2-b3{animation-delay:-3.1s}
@keyframes vd2-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.vd2-pu{animation:vd2-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.vd2-dr{stroke-dasharray:6 9;animation:vd2-dr 1.6s linear infinite}
@keyframes vd2-dr{to{stroke-dashoffset:-30}}
.vd2-sp{animation:vd2-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd2-sp{to{transform:rotate(360deg)}}
.vd2-sw{animation:vd2-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes vd2-sw{50%{transform:rotate(3deg)}}
.vd2-wv{animation:vd2-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.vd2-w2{animation-delay:-1s}
@keyframes vd2-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.vd2-ty{animation:vd2-ty 1.4s steps(1) infinite}.vd2-y2{animation-delay:-.45s}.vd2-y3{animation-delay:-.9s}
@keyframes vd2-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vd2-sl{animation:vd2-sl 9s ease-in-out infinite}
@keyframes vd2-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vd2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf5e4"/><stop offset="1" stop-color="#fae6c0"/></linearGradient>
<pattern id="vd2-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vd2-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vd2-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vd2-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="vd2-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="vd2-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="vd2-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="vd2-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vd2-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="vd2-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="vd2-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#vd2-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vd2-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vd2-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#vd2-blur)"/><circle cx="200" cy="150" r="60" fill="#c4831f" fill-opacity="0.14" filter="url(#vd2-blur)"/>

<g filter="url(#vd2-sh)"><rect x="40" y="30" width="160" height="120" rx="12" fill="#fff"/></g>
<g transform="translate(80 66)" class="vd2-fl vd2-f1"><circle r="15" fill="#2f7d6b"/><circle cx="-5" cy="-3" r="2" fill="#fff"/><circle cx="5" cy="-3" r="2" fill="#fff"/><path d="M-6 4q6 6 12 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><g transform="translate(120 66)" class="vd2-fl vd2-f2"><circle r="15" fill="#e3a843"/><circle cx="-5" cy="-3" r="2" fill="#fff"/><circle cx="5" cy="-3" r="2" fill="#fff"/><path d="M-6 5h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g><g transform="translate(160 66)" class="vd2-fl vd2-f3"><circle r="15" fill="#c4562f"/><circle cx="-5" cy="-3" r="2" fill="#fff"/><circle cx="5" cy="-3" r="2" fill="#fff"/><path d="M-6 7q6-6 12 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g>
<path d="M60 108h120M60 124h90" stroke="#9aa8b4" stroke-width="5" stroke-linecap="round"/>
</g>
<rect x="6.5" y="6.5" width="227" height="167" rx="30" stroke="#14293a" stroke-opacity=".08"/>
</svg>