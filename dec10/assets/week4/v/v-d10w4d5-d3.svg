.vd3-tw{animation:vd3-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd3-t2{animation-delay:-1.1s}.vd3-t3{animation-delay:-2.2s}
@keyframes vd3-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.vd3-bl{animation:vd3-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vd3-b2{animation-delay:-1.6s}.vd3-b3{animation-delay:-3.1s}
