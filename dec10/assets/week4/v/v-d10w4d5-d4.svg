<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A small Jeopardy board with eco icons and points">
<title>A small Jeopardy board with eco icons and points</title>
<style>
.vd4-fl{animation:vd4-fl 6s ease-in-out infinite}.vd4-f2{animation-delay:-2s}.vd4-f3{animation-delay:-4s}
@keyframes vd4-fl{50%{translate:0 -6px}}
.vd4-tw{animation:vd4-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd4-t2{animation-delay:-1.1s}.vd4-t3{animation-delay:-2.2s}
@keyframes vd4-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.vd4-bl{animation:vd4-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vd4-b2{animation-delay:-1.6s}.vd4-b3{animation-delay:-3.1s}
@keyframes vd4-bl{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.vd4-pu{animation:vd4-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd4-pu{0%,100%{scale:1}50%{scale:1.08}}
.vd4-dr{stroke-dasharray:6 9;animation:vd4-dr 1.6s linear infinite}
@keyframes vd4-dr{to{stroke-dashoffset:-30}}
.vd4-sp{animation:vd4-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd4-sp{to{rotate:360deg}}
.vd4-sw{animation:vd4-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes vd4-sw{50%{rotate:3deg}}
.vd4-wv{animation:vd4-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.vd4-w2{animation-delay:-1s}
@keyframes vd4-wv{0%{opacity:0;scale:.7}30%{opacity:.9}100%{opacity:0;scale:1.3}}
.vd4-ty{animation:vd4-ty 1.4s steps(1) infinite}.vd4-y2{animation-delay:-.45s}.vd4-y3{animation-delay:-.9s}
@keyframes vd4-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vd4-sl{animation:vd4-sl 9s ease-in-out infinite}
@keyframes vd4-sl{50%{translate:14px 0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vd4-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf5e4"/><stop offset="1" stop-color="#fae6c0"/></linearGradient>
<pattern id="vd4-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vd4-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vd4-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vd4-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="vd4-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="vd4-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="vd4-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="vd4-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vd4-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="vd4-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="vd4-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#vd4-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vd4-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vd4-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#vd4-blur)"/><circle cx="200" cy="150" r="60" fill="#c4831f" fill-opacity="0.14" filter="url(#vd4-blur)"/>

<g filter="url(#vd4-sh)"><rect x="30" y="30" width="180" height="112" rx="10" fill="#1d3346"/></g>
<rect x="38" y="38" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="57" y="57" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">100</text><rect x="38" y="72" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="57" y="91" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">200</text><rect x="38" y="106" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="57" y="125" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">300</text><rect x="81" y="38" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="100" y="57" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">100</text><rect x="81" y="72" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="100" y="91" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">200</text><rect x="81" y="106" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="100" y="125" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">300</text><rect x="124" y="38" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="143" y="57" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">100</text><rect x="124" y="72" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="143" y="91" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">200</text><rect x="124" y="106" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="143" y="125" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">300</text><rect x="167" y="38" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="186" y="57" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">100</text><rect x="167" y="72" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="186" y="91" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">200</text><rect x="167" y="106" width="38" height="28" rx="4" fill="#2b4a8a"/><text x="186" y="125" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#f7d27a" text-anchor="middle">300</text>
<path transform="translate(190 150) rotate(-40) scale(0.9)" d="M0 0C8-14 26-18 36-14 30-2 16 6 0 0z" fill="url(#vd4-leaf)"/><path transform="translate(190 150) rotate(-40) scale(0.9)" d="M2 -1C12-6 22-10 32-13" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/><path class="vd4-tw vd4-t" d="M30 147Q31.4 152.6 37 154Q31.4 155.4 30 161Q28.6 155.4 23 154Q28.6 152.6 30 147z" fill="#c4831f"/>
</g>
<rect x="6.5" y="6.5" width="227" height="167" rx="30" stroke="#14293a" stroke-opacity=".08"/>
</svg>