<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A 3-2-1 card and a ticked checklist: ready for Week 5">
<title>A 3-2-1 card and a ticked checklist: ready for Week 5</title>
<style>
.vd5-fl{animation:vd5-fl 6s ease-in-out infinite}.vd5-f2{animation-delay:-2s}.vd5-f3{animation-delay:-4s}
@keyframes vd5-fl{50%{translate:0 -6px}}
.vd5-tw{animation:vd5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vd5-t2{animation-delay:-1.1s}.vd5-t3{animation-delay:-2.2s}
@keyframes vd5-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.vd5-bl{animation:vd5-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vd5-b2{animation-delay:-1.6s}.vd5-b3{animation-delay:-3.1s}
@keyframes vd5-bl{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.vd5-pu{animation:vd5-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd5-pu{0%,100%{scale:1}50%{scale:1.08}}
.vd5-dr{stroke-dasharray:6 9;animation:vd5-dr 1.6s linear infinite}
@keyframes vd5-dr{to{stroke-dashoffset:-30}}
.vd5-sp{animation:vd5-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vd5-sp{to{rotate:360deg}}
.vd5-sw{animation:vd5-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes vd5-sw{50%{rotate:3deg}}
.vd5-wv{animation:vd5-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.vd5-w2{animation-delay:-1s}
@keyframes vd5-wv{0%{opacity:0;scale:.7}30%{opacity:.9}100%{opacity:0;scale:1.3}}
.vd5-ty{animation:vd5-ty 1.4s steps(1) infinite}.vd5-y2{animation-delay:-.45s}.vd5-y3{animation-delay:-.9s}
@keyframes vd5-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vd5-sl{animation:vd5-sl 9s ease-in-out infinite}
@keyframes vd5-sl{50%{translate:14px 0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vd5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf5e4"/><stop offset="1" stop-color="#fae6c0"/></linearGradient>
<pattern id="vd5-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vd5-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vd5-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vd5-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="vd5-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="vd5-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="vd5-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="vd5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vd5-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="vd5-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="vd5-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#vd5-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vd5-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vd5-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#vd5-blur)"/><circle cx="200" cy="150" r="60" fill="#c4831f" fill-opacity="0.14" filter="url(#vd5-blur)"/>

<g transform="translate(50 60)" class="vd5-fl vd5-f1"><circle r="20" fill="#2f7d6b" filter="url(#vd5-sh2)"/><text y="7" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">3</text></g><g transform="translate(100 60)" class="vd5-fl vd5-f2"><circle r="20" fill="#3a58a0" filter="url(#vd5-sh2)"/><text y="7" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">2</text></g><g transform="translate(150 60)" class="vd5-fl vd5-f3"><circle r="20" fill="#c4562f" filter="url(#vd5-sh2)"/><text y="7" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">1</text></g>
<g transform="translate(60 100)" filter="url(#vd5-sh2)"><rect width="120" height="50" rx="8" fill="#fff"/><g transform="translate(16 16) scale(0.55)"><circle r="11" fill="#2f7d6b"/><path d="M-5 0l3.5 3.5L5.5-4" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(16 34) scale(0.55)"><circle r="11" fill="#2f7d6b"/><path d="M-5 0l3.5 3.5L5.5-4" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M30 16h70M30 34h56" stroke="#9aa8b4" stroke-width="4" stroke-linecap="round"/></g>
<g transform="translate(206 40)" class="vd5-pu"><g transform="translate(0 20)"><path d="M0 0v-30" stroke="#14293a" stroke-width="2.4" stroke-linecap="round"/><path d="M0-30h18l-5 6 5 6H0z" fill="#e3a843"/></g></g>
</g>
<rect x="6.5" y="6.5" width="227" height="167" rx="30" stroke="#14293a" stroke-opacity=".08"/>
</svg>