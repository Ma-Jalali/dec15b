<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two prompt cards: a faded 2023 card crossed out and a bright 2026 card with six coloured lines and a green tick">
<title>Two prompt cards: a faded 2023 card crossed out and a bright 2026 card with six coloured lines and a green tick</title>
<style>
.vp1-fl{animation:vp1-fl 6s ease-in-out infinite}.vp1-f2{animation-delay:-2s}.vp1-f3{animation-delay:-4s}
@keyframes vp1-fl{50%{translate:0 -6px}}
.vp1-tw{animation:vp1-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vp1-t2{animation-delay:-1.1s}
@keyframes vp1-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.vp1-pu{animation:vp1-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vp1-pu{0%,100%{scale:1}50%{scale:1.08}}
.vp1-dr{stroke-dasharray:6 9;animation:vp1-dr 1.6s linear infinite}
@keyframes vp1-dr{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vp1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf2fb"/><stop offset="1" stop-color="#d9e3f5"/></linearGradient>
<pattern id="vp1-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<linearGradient id="vp1-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vp1-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<filter id="vp1-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vp1-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
</defs><clipPath id="vp1-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath><g clip-path="url(#vp1-clip)"><rect width="240" height="180" rx="30" fill="url(#vp1-bg)"/><rect width="240" height="180" fill="url(#vp1-dots)"/><g transform="rotate(-6 70 92)"><rect x="24" y="44" width="92" height="98" rx="14" fill="#fff" fill-opacity=".7" filter="url(#vp1-sh2)"/><text x="70" y="70" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#8ea2b0" text-anchor="middle">2023</text><rect x="38" y="84" width="64" height="7" rx="3.5" fill="#c9d4dd"/><rect x="38" y="99" width="50" height="7" rx="3.5" fill="#c9d4dd"/><rect x="38" y="114" width="58" height="7" rx="3.5" fill="#c9d4dd"/><path d="M40 82 L100 124 M100 82 L40 124" stroke="#c4562f" stroke-width="4" stroke-linecap="round" opacity=".75"/></g><path class="vp1-dr" d="M120 92 H140" stroke="#3a58a0" stroke-width="3" stroke-linecap="round"/><path d="M138 84 l10 8 l-10 8" stroke="#3a58a0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="vp1-fl"><rect x="150" y="38" width="70" height="108" rx="14" fill="#fff" filter="url(#vp1-sh)"/><text x="185" y="62" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#3a58a0" text-anchor="middle">2026</text><rect x="162" y="72" width="46" height="7" rx="3.5" fill="#ad6a12"/><rect x="162" y="83" width="38" height="7" rx="3.5" fill="#2b776e"/><rect x="162" y="94" width="46" height="7" rx="3.5" fill="#b0512a"/><rect x="162" y="105" width="38" height="7" rx="3.5" fill="#3a58a0"/><rect x="162" y="116" width="46" height="7" rx="3.5" fill="#7a4a8c"/><rect x="162" y="127" width="38" height="7" rx="3.5" fill="#2d7a9a"/><circle cx="214" cy="40" r="13" fill="#2f7d6b"/><path d="M207 40 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><polygon class="vp1-tw" points="36.0,22.0 38.1,27.1 43.6,27.5 39.4,31.1 40.7,36.5 36.0,33.6 31.3,36.5 32.6,31.1 28.4,27.5 33.9,27.1" fill="url(#vp1-gold)"/></g></svg>
