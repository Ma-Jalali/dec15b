<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A laptop shows a six-colour prompt; dotted lines send it to four AI tools: Cogniti, ChatGPT, Claude and Copilot">
<title>A laptop shows a six-colour prompt; dotted lines send it to four AI tools: Cogniti, ChatGPT, Claude and Copilot</title>
<style>
.vp3-fl{animation:vp3-fl 6s ease-in-out infinite}.vp3-f2{animation-delay:-2s}.vp3-f3{animation-delay:-4s}
@keyframes vp3-fl{50%{translate:0 -6px}}
.vp3-tw{animation:vp3-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vp3-t2{animation-delay:-1.1s}
@keyframes vp3-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.vp3-pu{animation:vp3-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vp3-pu{0%,100%{scale:1}50%{scale:1.08}}
.vp3-dr{stroke-dasharray:6 9;animation:vp3-dr 1.6s linear infinite}
@keyframes vp3-dr{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vp3-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf2fb"/><stop offset="1" stop-color="#d9e3f5"/></linearGradient>
<pattern id="vp3-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<linearGradient id="vp3-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vp3-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<filter id="vp3-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vp3-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
</defs><clipPath id="vp3-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath><g clip-path="url(#vp3-clip)"><rect width="240" height="180" rx="30" fill="url(#vp3-bg)"/><rect width="240" height="180" fill="url(#vp3-dots)"/><rect x="58" y="34" width="124" height="80" rx="10" fill="#14293a" filter="url(#vp3-sh)"/><rect x="64" y="40" width="112" height="68" rx="6" fill="#eef3fb"/><rect x="44" y="114" width="152" height="10" rx="5" fill="#33475a"/><rect x="72" y="47" width="70" height="5" rx="2.5" fill="#ad6a12"/><rect x="72" y="56" width="87" height="5" rx="2.5" fill="#2b776e"/><rect x="72" y="65" width="78" height="5" rx="2.5" fill="#b0512a"/><rect x="72" y="74" width="95" height="5" rx="2.5" fill="#3a58a0"/><rect x="72" y="83" width="86" height="5" rx="2.5" fill="#7a4a8c"/><rect x="72" y="92" width="77" height="5" rx="2.5" fill="#2d7a9a"/><g class="vp3-fl vp3-f1"><rect x="14" y="138" width="52" height="22" rx="11" fill="#fff" stroke="#2f7d6b" stroke-width="2" filter="url(#vp3-sh2)"/><text x="40" y="153" font-family="Manrope, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#2f7d6b" text-anchor="middle">Cogniti</text></g><g class="vp3-fl vp3-f2"><rect x="66" y="150" width="52" height="22" rx="11" fill="#fff" stroke="#33475a" stroke-width="2" filter="url(#vp3-sh2)"/><text x="92" y="165" font-family="Manrope, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#33475a" text-anchor="middle">ChatGPT</text></g><g class="vp3-fl vp3-f3"><rect x="122" y="150" width="52" height="22" rx="11" fill="#fff" stroke="#c4562f" stroke-width="2" filter="url(#vp3-sh2)"/><text x="148" y="165" font-family="Manrope, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#c4562f" text-anchor="middle">Claude</text></g><g class="vp3-fl vp3-f1"><rect x="176" y="138" width="52" height="22" rx="11" fill="#fff" stroke="#3a58a0" stroke-width="2" filter="url(#vp3-sh2)"/><text x="202" y="153" font-family="Manrope, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#3a58a0" text-anchor="middle">Copilot</text></g><path class="vp3-dr" d="M120 124 L40 140 M120 124 L92 150 M120 124 L148 150 M120 124 L202 140" stroke="#8ea2b0" stroke-width="1.6"/><polygon class="vp3-tw" points="200.0,22.0 202.1,27.1 207.6,27.5 203.4,31.1 204.7,36.5 200.0,33.6 195.3,36.5 196.6,31.1 192.4,27.5 197.9,27.1" fill="url(#vp3-gold)"/></g></svg>
