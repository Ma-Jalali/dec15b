<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A graduation cap above a balance: a green tick for help on one side and a red cross for harm on the other">
<title>A graduation cap above a balance: a green tick for help on one side and a red cross for harm on the other</title>
<style>
.vp6-fl{animation:vp6-fl 6s ease-in-out infinite}.vp6-f2{animation-delay:-2s}.vp6-f3{animation-delay:-4s}
@keyframes vp6-fl{50%{translate:0 -6px}}
.vp6-tw{animation:vp6-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vp6-t2{animation-delay:-1.1s}
@keyframes vp6-tw{0%,100%{opacity:.35;scale:.6}50%{opacity:1;scale:1}}
.vp6-pu{animation:vp6-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vp6-pu{0%,100%{scale:1}50%{scale:1.08}}
.vp6-dr{stroke-dasharray:6 9;animation:vp6-dr 1.6s linear infinite}
@keyframes vp6-dr{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vp6-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf2fb"/><stop offset="1" stop-color="#d9e3f5"/></linearGradient>
<pattern id="vp6-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<linearGradient id="vp6-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vp6-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<filter id="vp6-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vp6-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
