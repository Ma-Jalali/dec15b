<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A phone shows a group chat message confirming the next steps, with ticks">
<title>A phone shows a group chat message confirming the next steps, with ticks</title>
<style>
.vx1-fl{animation:vx1-fl 6s ease-in-out infinite}.vx1-f2{animation-delay:-2s}.vx1-f3{animation-delay:-4s}
@keyframes vx1-fl{50%{transform:translateY(-6px)}}
.vx1-tw{animation:vx1-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vx1-t2{animation-delay:-1.1s}.vx1-t3{animation-delay:-2.2s}
@keyframes vx1-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.vx1-bl{animation:vx1-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vx1-b2{animation-delay:-1.6s}.vx1-b3{animation-delay:-3.1s}
@keyframes vx1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.vx1-pu{animation:vx1-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vx1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.vx1-dr{stroke-dasharray:6 9;animation:vx1-dr 1.6s linear infinite}
@keyframes vx1-dr{to{stroke-dashoffset:-30}}
.vx1-sp{animation:vx1-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vx1-sp{to{transform:rotate(360deg)}}
.vx1-sw{animation:vx1-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes vx1-sw{50%{transform:rotate(3deg)}}
.vx1-wv{animation:vx1-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.vx1-w2{animation-delay:-1s}
@keyframes vx1-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.vx1-ty{animation:vx1-ty 1.4s steps(1) infinite}.vx1-y2{animation-delay:-.45s}.vx1-y3{animation-delay:-.9s}
@keyframes vx1-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vx1-sl{animation:vx1-sl 9s ease-in-out infinite}
@keyframes vx1-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vx1-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f4ee"/><stop offset="1" stop-color="#d2e9dd"/></linearGradient>
<pattern id="vx1-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vx1-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vx1-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vx1-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="vx1-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="vx1-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="vx1-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="vx1-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vx1-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="vx1-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="vx1-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#vx1-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vx1-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vx1-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#vx1-blur)"/><circle cx="200" cy="150" r="60" fill="#2f7d6b" fill-opacity="0.14" filter="url(#vx1-blur)"/>

<g filter="url(#vx1-sh)"><rect x="80" y="20" width="80" height="140" rx="14" fill="#1d3346"/><rect x="86" y="32" width="68" height="114" rx="6" fill="#eef7f1"/></g>
<rect x="92" y="42" width="54" height="16" rx="8" fill="#2f7d6b"/><rect x="92" y="64" width="44" height="12" rx="6" fill="#cfe9e1"/><rect x="92" y="82" width="56" height="12" rx="6" fill="#cfe9e1"/><rect x="100" y="104" width="46" height="14" rx="7" fill="#2f7d6b" class="vx1-pu"/>
<g transform="translate(186 60) scale(0.8)"><circle r="11" fill="#2f7d6b"/><path d="M-5 0l3.5 3.5L5.5-4" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(52 120) scale(0.8)"><circle r="11" fill="#3a58a0"/><path d="M-5 0l3.5 3.5L5.5-4" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><path class="vx1-tw vx1-t" d="M196 133Q197.4 138.6 203 140Q197.4 141.4 196 147Q194.6 141.4 189 140Q194.6 138.6 196 133z" fill="#e3a843"/>
</g>
<rect x="6.5" y="6.5" width="227" height="167" rx="30" stroke="#14293a" stroke-opacity=".08"/>
</svg>