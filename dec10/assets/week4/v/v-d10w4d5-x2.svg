<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A balance with a green tick on one side and a red cross on the other: using AI with integrity">
<title>A balance with a green tick on one side and a red cross on the other: using AI with integrity</title>
<style>
.vx2-fl{animation:vx2-fl 6s ease-in-out infinite}.vx2-f2{animation-delay:-2s}.vx2-f3{animation-delay:-4s}
@keyframes vx2-fl{50%{transform:translateY(-6px)}}
.vx2-tw{animation:vx2-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.vx2-t2{animation-delay:-1.1s}.vx2-t3{animation-delay:-2.2s}
@keyframes vx2-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.vx2-bl{animation:vx2-bl 4.6s infinite;transform-box:fill-box;transform-origin:center}.vx2-b2{animation-delay:-1.6s}.vx2-b3{animation-delay:-3.1s}
@keyframes vx2-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.vx2-pu{animation:vx2-pu 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes vx2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.vx2-dr{stroke-dasharray:6 9;animation:vx2-dr 1.6s linear infinite}
@keyframes vx2-dr{to{stroke-dashoffset:-30}}
.vx2-sp{animation:vx2-sp 30s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes vx2-sp{to{transform:rotate(360deg)}}
.vx2-sw{animation:vx2-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes vx2-sw{50%{transform:rotate(3deg)}}
.vx2-wv{animation:vx2-wv 3s ease-out infinite;transform-box:fill-box;transform-origin:center}.vx2-w2{animation-delay:-1s}
@keyframes vx2-wv{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.3)}}
.vx2-ty{animation:vx2-ty 1.4s steps(1) infinite}.vx2-y2{animation-delay:-.45s}.vx2-y3{animation-delay:-.9s}
@keyframes vx2-ty{0%,100%{opacity:1}50%{opacity:.2}}
.vx2-sl{animation:vx2-sl 9s ease-in-out infinite}
@keyframes vx2-sl{50%{transform:translateX(14px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="vx2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf2fb"/><stop offset="1" stop-color="#d9e3f5"/></linearGradient>
<pattern id="vx2-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r=".9" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="vx2-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="vx2-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f1e6"/></linearGradient>
<linearGradient id="vx2-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d27a"/><stop offset=".55" stop-color="#e3a843"/><stop offset="1" stop-color="#c4831f"/></linearGradient>
<linearGradient id="vx2-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fbf8b"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient>
<linearGradient id="vx2-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc7d6"/><stop offset="1" stop-color="#2d7a9a"/></linearGradient>
<linearGradient id="vx2-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f6"/></linearGradient>
<filter id="vx2-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#14293a" flood-opacity=".1"/></filter>
<filter id="vx2-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#14293a" flood-opacity=".18"/></filter>
<filter id="vx2-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>

</defs>
<clipPath id="vx2-clip"><rect x="6" y="6" width="228" height="168" rx="30"/></clipPath>
<g clip-path="url(#vx2-clip)"><rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vx2-bg)"/>
<rect x="0" y="0" width="240" height="180" rx="30" fill="url(#vx2-dots)"/>
<circle cx="50" cy="40" r="50" fill="#fff" fill-opacity="0.55" filter="url(#vx2-blur)"/><circle cx="200" cy="150" r="60" fill="#3a58a0" fill-opacity="0.14" filter="url(#vx2-blur)"/>

<g transform="translate(120 140) scale(1.2)" filter="url(#vx2-sh2)"><path d="M0 0v-56" stroke="#14293a" stroke-width="4"/><path d="M-20 0h40" stroke="#14293a" stroke-width="5" stroke-linecap="round"/><g class="vx2-sw"><path d="M-46-56h92" stroke="#14293a" stroke-width="4" stroke-linecap="round"/><path d="M-46-56l-14 26h28zM46-56l-14 26h28z" stroke="#14293a" stroke-width="1.5" fill="none"/><path d="M-62-30a16 7 0 0 0 32 0z" fill="url(#vx2-gold)"/><path d="M30-30a16 7 0 0 0 32 0z" fill="url(#vx2-gold)"/><g transform="translate(-46 -40)"><g transform="translate(0 0) scale(0.8)"><circle r="11" fill="#2f7d6b"/><path d="M-5 0l3.5 3.5L5.5-4" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(46 -40)"><g transform="translate(0 0) scale(0.8)"><circle r="11" fill="#c4562f"/><path d="M-4-4l8 8M4-4l-8 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g></g></g><circle cx="0" cy="-58" r="5" fill="url(#vx2-gold)"/></g>
<g transform="translate(196 60) scale(0.55)" class="vx2-fl vx2-f3"><path d="M0-34v-10" stroke="#3a58a0" stroke-width="3"/><circle cx="0" cy="-47" r="5" fill="#e3a843" class="vx2-pu"/><rect x="-28" y="-34" width="56" height="44" rx="14" fill="#fff" stroke="#3a58a0" stroke-width="3"/><rect x="-20" y="-24" width="40" height="22" rx="8" fill="#1d3346"/><circle cx="-8" cy="-13" r="4" fill="#7cc7d6" class="vx2-bl"/><circle cx="8" cy="-13" r="4" fill="#7cc7d6" class="vx2-bl"/><path d="M-6 2q6 4 12 0" stroke="#3a58a0" stroke-width="2.4" stroke-linecap="round"/></g><path class="vx2-tw vx2-t" d="M40 33Q41.4 38.6 47 40Q41.4 41.4 40 47Q38.6 41.4 33 40Q38.6 38.6 40 33z" fill="#fff"/>
</g>
<rect x="6.5" y="6.5" width="227" height="167" rx="30" stroke="#14293a" stroke-opacity=".08"/>
</svg>