<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="An annotation toolkit: highlight relevant information; circle or underline key words; draw an arrow with a comment in the margin to add your understanding; a question mark for parts you do not understand; three exclamation marks for important parts. Below, a strip of text shows all five marks in use.">
<title>An annotation toolkit: highlight relevant information; circle or underline key words; draw an arrow with a comment in the margin to add your understanding; a question mark for parts you do not understand; three exclamation marks for important parts. Below, a strip of text shows all five marks in use.</title>
<style>
.w5d1ann-fl{animation:w5d1ann-fl 6s ease-in-out infinite}.w5d1ann-f2{animation-delay:-2s}.w5d1ann-f3{animation-delay:-4s}
.w5d1ann-tw{animation:w5d1ann-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5d1ann-t2{animation-delay:-1.1s}.w5d1ann-t3{animation-delay:-2.2s}
.w5d1ann-bl{animation:w5d1ann-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w5d1ann-b2{animation-delay:-1.9s}.w5d1ann-b3{animation-delay:-3.1s}
.w5d1ann-pu{animation:w5d1ann-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5d1ann-p2{animation-delay:-1.3s}
.w5d1ann-dr{stroke-dasharray:6 9;animation:w5d1ann-dr 1.6s linear infinite}
.w5d1ann-sp{animation:w5d1ann-sp 18s linear infinite;transform-box:fill-box;transform-origin:center}
.w5d1ann-sw{animation:w5d1ann-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w5d1ann-s2{animation-delay:-1.7s}
.w5d1ann-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5d1ann-dw 5s ease-in-out infinite}
@keyframes w5d1ann-fl{50%{transform:translateY(-5px)}}
@keyframes w5d1ann-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w5d1ann-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w5d1ann-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w5d1ann-dr{to{stroke-dashoffset:-30}}
@keyframes w5d1ann-sp{to{transform:rotate(360deg)}}
@keyframes w5d1ann-sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes w5d1ann-dw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="w5d1ann-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w5d1ann-shl" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w5d1ann-blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="w5d1ann-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#7a4a8c" fill-opacity=".14"/></pattern>
<linearGradient id="w5d1ann-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4eef9"/><stop offset="1" stop-color="#e6dcf0"/></linearGradient>
<radialGradient id="w5d1ann-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w5d1ann-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f1e4"/></linearGradient>
<linearGradient id="w5d1ann-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48cc4"/><stop offset="1" stop-color="#7a4a8c"/></linearGradient>
<linearGradient id="w5d1ann-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w5d1ann-ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<radialGradient id="w5d1ann-sea" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7fc0e8"/><stop offset="1" stop-color="#2f6db5"/></radialGradient>
<radialGradient id="w5d1ann-hl" cx=".3" cy=".25" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>

</defs>
<rect width="1000" height="440" rx="26" fill="url(#w5d1ann-bg)"/><rect width="1000" height="440" rx="26" fill="url(#w5d1ann-dots)"/><ellipse cx="500" cy="176" rx="480" ry="198" fill="url(#w5d1ann-glow)"/>
<text x="500" y="46" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#4e2b5d" text-anchor="middle">Your annotation toolkit</text>
<g class="w5d1ann-fl w5d1ann-f1"><g><rect x="28" y="78" width="164" height="170" rx="18" fill="url(#w5d1ann-paper)" filter="url(#w5d1ann-sh)"/><rect x="28" y="78" width="164" height="170" rx="18" stroke="#d9cbe3" stroke-width="1.6"/></g><g transform="translate(110 136)"><rect x="-34" y="-8" width="68" height="16" rx="3" fill="#f7dc5c" opacity=".85"/><path d="M-30 0H30" stroke="#8a7a2a" stroke-width="2.4" stroke-linecap="round" opacity=".5"/></g></g><text x="110" y="196" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#4e2b5d" text-anchor="middle">Highlight</text><text x="110" y="220" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3d4f5e" text-anchor="middle">relevant information</text><g class="w5d1ann-fl w5d1ann-f2"><g><rect x="223" y="78" width="164" height="170" rx="18" fill="url(#w5d1ann-paper)" filter="url(#w5d1ann-sh)"/><rect x="223" y="78" width="164" height="170" rx="18" stroke="#d9cbe3" stroke-width="1.6"/></g><g transform="translate(305 136)"><ellipse cx="0" cy="-4" rx="30" ry="13" stroke="#e64626" stroke-width="3"/><path d="M-28 16H28" stroke="#2f6db5" stroke-width="3.4" stroke-linecap="round"/></g></g><text x="305" y="196" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#4e2b5d" text-anchor="middle">Circle / underline</text><text x="305" y="220" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3d4f5e" text-anchor="middle">key words</text><g class="w5d1ann-fl w5d1ann-f3"><g><rect x="418" y="78" width="164" height="170" rx="18" fill="url(#w5d1ann-paper)" filter="url(#w5d1ann-sh)"/><rect x="418" y="78" width="164" height="170" rx="18" stroke="#d9cbe3" stroke-width="1.6"/></g><g transform="translate(500 136)"><path d="M-32 10L18 -10" stroke="#7a4a8c" stroke-width="3.4" stroke-linecap="round"/><path d="M10.6 -1.9L18 -10L7 -10.8" stroke="#7a4a8c" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="-24" width="26" height="18" rx="3" fill="#fff6c9" stroke="#c9a64a"/></g></g><text x="500" y="196" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#4e2b5d" text-anchor="middle">Arrow + comment</text><text x="500" y="220" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3d4f5e" text-anchor="middle">add your understanding</text><g class="w5d1ann-fl w5d1ann-f1"><g><rect x="613" y="78" width="164" height="170" rx="18" fill="url(#w5d1ann-paper)" filter="url(#w5d1ann-sh)"/><rect x="613" y="78" width="164" height="170" rx="18" stroke="#d9cbe3" stroke-width="1.6"/></g><g transform="translate(695 136)"><circle r="22" fill="#e64626"/><text x="0" y="9" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">?</text></g></g><text x="695" y="196" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#4e2b5d" text-anchor="middle">?</text><text x="695" y="220" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3d4f5e" text-anchor="middle">parts you don’t</text><text x="695" y="238.9" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3d4f5e" text-anchor="middle">understand</text><g class="w5d1ann-fl w5d1ann-f2"><g><rect x="808" y="78" width="164" height="170" rx="18" fill="url(#w5d1ann-paper)" filter="url(#w5d1ann-sh)"/><rect x="808" y="78" width="164" height="170" rx="18" stroke="#d9cbe3" stroke-width="1.6"/></g><g transform="translate(890 136)"><text x="0" y="12" font-family="Manrope, Arial, sans-serif" font-size="36" font-weight="900" fill="#c4562f" text-anchor="middle">!!!</text></g></g><text x="890" y="196" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#4e2b5d" text-anchor="middle">!!!</text><text x="890" y="220" font-family="Manrope, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#3d4f5e" text-anchor="middle">important parts</text>
<g><rect x="70" y="280" width="860" height="130" rx="16" fill="url(#w5d1ann-paper)" filter="url(#w5d1ann-shl)"/></g>
<rect x="96" y="304" width="292" height="22" rx="4" fill="#f7dc5c" opacity=".7"/><text x="100" y="321" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a">Globalization is a multidimensional</text><text x="400" y="321" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a">phenomenon …</text>
<ellipse cx="453" cy="315" rx="58" ry="16" stroke="#e64626" stroke-width="2.4"/><text x="100" y="355" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a">the interaction between globalization and culture is an</text><path d="M100 362H560" stroke="#2f6db5" stroke-width="2.4"/><text x="100" y="389" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a">under-researched area …</text>
<path d="M580 352L690 330" stroke="#7a4a8c" stroke-width="2.6" stroke-linecap="round"/><path d="M682 336L690 330L680.3 327.5" stroke="#7a4a8c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="696" y="300" width="214" height="56" rx="6" fill="#fff6c9" stroke="#c9a64a"/><text x="708" y="323" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#7a4a8c">→ not much research</text><text x="708" y="342.5" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#7a4a8c">yet!</text>
