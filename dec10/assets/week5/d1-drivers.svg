<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" fill="none" role="img" aria-label="Five drivers point into a globe labelled cultural globalisation: advancements in technology (internet, social media); increased travel and migration; the spread of pop culture and global media networks (Netflix, Hollywood and Bollywood movies, K-pop); educational exchanges; economic globalisation (McDonald’s, Starbucks, Apple).">
<title>Five drivers point into a globe labelled cultural globalisation: advancements in technology (internet, social media); increased travel and migration; the spread of pop culture and global media networks (Netflix, Hollywood and Bollywood movies, K-pop); educational exchanges; economic globalisation (McDonald’s, Starbucks, Apple).</title>
<style>
