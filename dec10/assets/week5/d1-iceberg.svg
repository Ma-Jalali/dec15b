<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" fill="none" role="img" aria-label="An iceberg in the sea. Above the water, the surface of culture travels between countries: clothing, fashion, foods, arts, music, movies and crafts — little boats carry them across. Below the water, the deep part stays in place: values, beliefs, and the unique and intricate aspects tied to the original context and culture.">
<title>An iceberg in the sea. Above the water, the surface of culture travels between countries: clothing, fashion, foods, arts, music, movies and crafts — little boats carry them across. Below the water, the deep part stays in place: values, beliefs, and the unique and intricate aspects tied to the original context and culture.</title>
