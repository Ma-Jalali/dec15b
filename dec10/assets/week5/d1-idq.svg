<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" fill="none" role="img" aria-label="Two answer shapes for Interactive Discussion individual questions. Question about the ideas in the text (“Can you explain what they mean by this?”): 1 restate who and what — “The writers believe …”; 2 explain in your own words — “In other words …”; 3 add an example — “For example …”. Question about personal response (“To what extent do you agree …?”): 1 position — “To a large extent, I agree …”; 2 reason — “The main reason is …”; 3 example — “In my country …”; 4 link back — “So, overall …”.">
