<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" fill="none" role="img" aria-label="Diagram: four pillars hold up a roof labelled McDonaldization (George Ritzer, 1993). Efficiency: the fastest way to do a task. Calculability: quantity over quality. Predictability: the same everywhere — a Big Mac in New York tastes like one in Tokyo. Control: machines and scripts replace human choice. Underneath: it spreads to education, work, healthcare and travel. Criticised for homogeneity, dehumanisation and quantity over quality.">
<title>Diagram: four pillars hold up a roof labelled McDonaldization (George Ritzer, 1993). Efficiency: the fastest way to do a task. Calculability: quantity over quality. Predictability: the same everywhere — a Big Mac in New York tastes like one in Tokyo. Control: machines and scripts replace human choice. Underneath: it spreads to education, work, healthcare and travel. Criticised for homogeneity, dehumanisation and quantity over quality.</title>
