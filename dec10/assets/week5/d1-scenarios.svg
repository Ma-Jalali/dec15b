<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none" role="img" aria-label="The three H scenarios (Pieterse, 1996). Heterogenization, or cultural differentiation: strong walls keep cultures separate — not discussed in this text. Homogenization, or cultural convergence: weak barriers and strong global flows make many cultures into one similar culture. Hybridization, or cultural mixing: barriers let some global flows in, and global and local mix into a new, blended culture that is neither fully global nor fully local.">
<title>The three H scenarios (Pieterse, 1996). Heterogenization, or cultural differentiation: strong walls keep cultures separate — not discussed in this text. Homogenization, or cultural convergence: weak barriers and strong global flows make many cultures into one similar culture. Hybridization, or cultural mixing: barriers let some global flows in, and global and local mix into a new, blended culture that is neither fully global nor fully local.</title>
<style>
.w5d1sc-fl{animation:w5d1sc-fl 6s ease-in-out infinite}.w5d1sc-f2{animation-delay:-2s}.w5d1sc-f3{animation-delay:-4s}
.w5d1sc-tw{animation:w5d1sc-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5d1sc-t2{animation-delay:-1.1s}.w5d1sc-t3{animation-delay:-2.2s}
.w5d1sc-bl{animation:w5d1sc-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w5d1sc-b2{animation-delay:-1.9s}.w5d1sc-b3{animation-delay:-3.1s}
.w5d1sc-pu{animation:w5d1sc-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5d1sc-p2{animation-delay:-1.3s}
.w5d1sc-dr{stroke-dasharray:6 9;animation:w5d1sc-dr 1.6s linear infinite}
.w5d1sc-sp{animation:w5d1sc-sp 18s linear infinite;transform-box:fill-box;transform-origin:center}
.w5d1sc-sw{animation:w5d1sc-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w5d1sc-s2{animation-delay:-1.7s}
.w5d1sc-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5d1sc-dw 5s ease-in-out infinite}
@keyframes w5d1sc-fl{50%{transform:translateY(-5px)}}
@keyframes w5d1sc-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w5d1sc-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w5d1sc-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w5d1sc-dr{to{stroke-dashoffset:-30}}
@keyframes w5d1sc-sp{to{transform:rotate(360deg)}}
@keyframes w5d1sc-sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes w5d1sc-dw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
