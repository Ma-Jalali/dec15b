<filter id="w5d1sd-shl" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#14293a" flood-opacity=".15"/><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w5d1sd-blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="w5d1sd-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#7a4a8c" fill-opacity=".14"/></pattern>
<linearGradient id="w5d1sd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4eef9"/><stop offset="1" stop-color="#e6dcf0"/></linearGradient>
<radialGradient id="w5d1sd-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w5d1sd-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f1e4"/></linearGradient>
<linearGradient id="w5d1sd-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48cc4"/><stop offset="1" stop-color="#7a4a8c"/></linearGradient>
<linearGradient id="w5d1sd-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w5d1sd-ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<radialGradient id="w5d1sd-sea" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7fc0e8"/><stop offset="1" stop-color="#2f6db5"/></radialGradient>
<radialGradient id="w5d1sd-hl" cx=".3" cy=".25" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>

</defs>
