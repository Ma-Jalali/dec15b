<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" fill="none" role="img" aria-label="A stance dial from cautious to certain. Cautious end (hedging): may, might, could, perhaps, presumably, seem, suggest, often, sometimes. Middle: indicate, likely. Certain end: argue, contend, certainly, definitely, there is no doubt. Below, a toolbox: evaluative adjectives (important, misguided), evaluative adverbs (accurately, surprisingly), evaluative nouns (failure, disaster) and signalling words (however, therefore).">
<title>A stance dial from cautious to certain. Cautious end (hedging): may, might, could, perhaps, presumably, seem, suggest, often, sometimes. Middle: indicate, likely. Certain end: argue, contend, certainly, definitely, there is no doubt. Below, a toolbox: evaluative adjectives (important, misguided), evaluative adverbs (accurately, surprisingly), evaluative nouns (failure, disaster) and signalling words (however, therefore).</title>
<style>
.w5d1sd-fl{animation:w5d1sd-fl 6s ease-in-out infinite}.w5d1sd-f2{animation-delay:-2s}.w5d1sd-f3{animation-delay:-4s}
.w5d1sd-tw{animation:w5d1sd-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5d1sd-t2{animation-delay:-1.1s}.w5d1sd-t3{animation-delay:-2.2s}
.w5d1sd-bl{animation:w5d1sd-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w5d1sd-b2{animation-delay:-1.9s}.w5d1sd-b3{animation-delay:-3.1s}
.w5d1sd-pu{animation:w5d1sd-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5d1sd-p2{animation-delay:-1.3s}
.w5d1sd-dr{stroke-dasharray:6 9;animation:w5d1sd-dr 1.6s linear infinite}
.w5d1sd-sp{animation:w5d1sd-sp 18s linear infinite;transform-box:fill-box;transform-origin:center}
.w5d1sd-sw{animation:w5d1sd-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.w5d1sd-s2{animation-delay:-1.7s}
.w5d1sd-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5d1sd-dw 5s ease-in-out infinite}
@keyframes w5d1sd-fl{50%{transform:translateY(-5px)}}
@keyframes w5d1sd-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w5d1sd-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w5d1sd-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes w5d1sd-dr{to{stroke-dashoffset:-30}}
@keyframes w5d1sd-sp{to{transform:rotate(360deg)}}
@keyframes w5d1sd-sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes w5d1sd-dw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
