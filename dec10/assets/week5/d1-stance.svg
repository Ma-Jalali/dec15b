<g class="w5d1sd-fl w5d1sd-f1"><g><rect x="32" y="380" width="216" height="96" rx="16" fill="url(#w5d1sd-paper)" filter="url(#w5d1sd-sh)"/><rect x="32" y="380" width="216" height="96" rx="16" stroke="#7a4a8c" stroke-width="2"/></g></g><text x="140" y="418" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#7a4a8c" text-anchor="middle">Evaluative adjectives</text><text x="140" y="448" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#3d4f5e" text-anchor="middle" font-style="italic">important · misguided</text><g class="w5d1sd-fl w5d1sd-f2"><g><rect x="272" y="380" width="216" height="96" rx="16" fill="url(#w5d1sd-paper)" filter="url(#w5d1sd-sh)"/><rect x="272" y="380" width="216" height="96" rx="16" stroke="#2f6db5" stroke-width="2"/></g></g><text x="380" y="418" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#2f6db5" text-anchor="middle">Evaluative adverbs</text><text x="380" y="448" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#3d4f5e" text-anchor="middle" font-style="italic">accurately · surprisingly</text><g class="w5d1sd-fl w5d1sd-f3"><g><rect x="512" y="380" width="216" height="96" rx="16" fill="url(#w5d1sd-paper)" filter="url(#w5d1sd-sh)"/><rect x="512" y="380" width="216" height="96" rx="16" stroke="#c4562f" stroke-width="2"/></g></g><text x="620" y="418" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#c4562f" text-anchor="middle">Evaluative nouns</text><text x="620" y="448" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#3d4f5e" text-anchor="middle" font-style="italic">failure · disaster</text><g class="w5d1sd-fl w5d1sd-f1"><g><rect x="752" y="380" width="216" height="96" rx="16" fill="url(#w5d1sd-paper)" filter="url(#w5d1sd-sh)"/><rect x="752" y="380" width="216" height="96" rx="16" stroke="#2f7d6b" stroke-width="2"/></g></g><text x="860" y="418" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#2f7d6b" text-anchor="middle">Signalling words</text><text x="860" y="448" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#3d4f5e" text-anchor="middle" font-style="italic">however · therefore</text>
