<path d="M330 300A170 170 0 0 1 447.5 138.3" stroke="#2f7d6b" stroke-width="44"/><path d="M447.5 138.3A170 170 0 0 1 552.5 138.3" stroke="#e3a843" stroke-width="44"/><path d="M552.5 138.3A170 170 0 0 1 670 300" stroke="#c4562f" stroke-width="44"/>
<text x="330" y="334" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#2f7d6b" text-anchor="middle">CAUTIOUS</text><text x="330" y="354" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f7d6b" text-anchor="middle">(hedge)</text><text x="670" y="334" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="900" fill="#c4562f" text-anchor="middle">CERTAIN</text><text x="670" y="354" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#c4562f" text-anchor="middle">(boost)</text>
<text x="270.3" y="272.7" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#2f7d6b" text-anchor="end">may · might · could</text><text x="295.2" y="196.1" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#2f7d6b" text-anchor="end">perhaps · presumably</text><text x="341.8" y="135.3" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#2f7d6b" text-anchor="end">seem · suggest</text><text x="405.6" y="93.1" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#2f7d6b" text-anchor="end">often · sometimes</text><text x="500" y="73" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#985c0e" text-anchor="middle">indicate · likely</text><text x="608.9" y="100.2" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#c4562f" text-anchor="start">argue · contend</text><text x="682.8" y="162.2" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#c4562f" text-anchor="start">certainly · definitely</text><text x="725.1" y="248.9" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#c4562f" text-anchor="start">there is no doubt</text>
