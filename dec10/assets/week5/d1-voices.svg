<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="Two speech bubbles. Left: a source’s voice — it has a citation, “(Jaja, 2010)”, and strong words: “a destructive force”, “a recipe for cultural disaster”. Right: the writer’s own voice — no citation, and a hedge: “This is presumably due to …”. Two questions below: Whose idea is it? Look for a citation. How sure is the writer? Look for hedges.">
<title>Two speech bubbles. Left: a source’s voice — it has a citation, “(Jaja, 2010)”, and strong words: “a destructive force”, “a recipe for cultural disaster”. Right: the writer’s own voice — no citation, and a hedge: “This is presumably due to …”. Two questions below: Whose idea is it? Look for a citation. How sure is the writer? Look for hedges.</title>
