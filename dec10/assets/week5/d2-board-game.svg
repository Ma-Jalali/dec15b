<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none" role="img" aria-label="A winding board game with a Start square, squares numbered 1 to 14 and a Finish square. A coin shows Heads = 1 space and Tails = 2 spaces. Square colours show the question type: True or false, Define, Your opinion, and Think.">
<title>The recap board game</title>
<style>
.d52boardg-tw{animation:d52boardg-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52boardg-t2{animation-delay:-1s}.d52boardg-t3{animation-delay:-2s}
.d52boardg-fl{animation:d52boardg-fl 6s ease-in-out infinite}.d52boardg-f2{animation-delay:-2s}.d52boardg-f3{animation-delay:-4s}
.d52boardg-bl{animation:d52boardg-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.d52boardg-b2{animation-delay:-1.7s}.d52boardg-b3{animation-delay:-3.2s}
.d52boardg-pu{animation:d52boardg-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52boardg-u2{animation-delay:-1.3s}
.d52boardg-sp{animation:d52boardg-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52boardg-dr{stroke-dasharray:6 8;animation:d52boardg-dr 1.6s linear infinite}
.d52boardg-wv{animation:d52boardg-wv 2.4s ease-out infinite}.d52boardg-w2{animation-delay:-.8s}.d52boardg-w3{animation-delay:-1.6s}
.d52boardg-sw{animation:d52boardg-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52boardg-s2{animation-delay:-2s}
.d52boardg-pen{animation:d52boardg-pen 3s ease-in-out infinite}
.d52boardg-spin{animation:d52boardg-spin 9s linear infinite}
@keyframes d52boardg-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52boardg-fl{50%{transform:translateY(-4px)}}
@keyframes d52boardg-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52boardg-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52boardg-sp{to{transform:rotate(360deg)}}
@keyframes d52boardg-dr{to{stroke-dashoffset:-28}}
@keyframes d52boardg-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52boardg-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52boardg-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
