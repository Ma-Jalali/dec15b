<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" fill="none" role="img" aria-label="The Cornell note-taking template. A narrow Review column on the left, a wide Note-taking column on the right with the headings Criticisms, McDonald’s (George Ritzer’s research), American dominance, A common critique of globalisation = Americanisation, Arjun Appadurai’s thesis and Final thought, and a Summary box across the bottom.">
<title>The Cornell note-taking template</title>
<style>
.d52cornel-tw{animation:d52cornel-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52cornel-t2{animation-delay:-1s}.d52cornel-t3{animation-delay:-2s}
.d52cornel-fl{animation:d52cornel-fl 6s ease-in-out infinite}.d52cornel-f2{animation-delay:-2s}.d52cornel-f3{animation-delay:-4s}
.d52cornel-bl{animation:d52cornel-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.d52cornel-b2{animation-delay:-1.7s}.d52cornel-b3{animation-delay:-3.2s}
.d52cornel-pu{animation:d52cornel-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52cornel-u2{animation-delay:-1.3s}
.d52cornel-sp{animation:d52cornel-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52cornel-dr{stroke-dasharray:6 8;animation:d52cornel-dr 1.6s linear infinite}
.d52cornel-wv{animation:d52cornel-wv 2.4s ease-out infinite}.d52cornel-w2{animation-delay:-.8s}.d52cornel-w3{animation-delay:-1.6s}
.d52cornel-sw{animation:d52cornel-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52cornel-s2{animation-delay:-2s}
.d52cornel-pen{animation:d52cornel-pen 3s ease-in-out infinite}
.d52cornel-spin{animation:d52cornel-spin 9s linear infinite}
@keyframes d52cornel-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52cornel-fl{50%{transform:translateY(-4px)}}
@keyframes d52cornel-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52cornel-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52cornel-sp{to{transform:rotate(360deg)}}
@keyframes d52cornel-dr{to{stroke-dashoffset:-28}}
@keyframes d52cornel-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52cornel-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52cornel-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="d52cornel-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7f3"/><stop offset="1" stop-color="#d6ebe3"/></linearGradient>
<pattern id="d52cornel-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#13887a" fill-opacity=".14"/></pattern>
<radialGradient id="d52cornel-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="d52cornel-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="d52cornel-blur" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="d52cornel-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="d52cornel-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="d52cornel-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="d52cornel-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd1c3"/><stop offset="1" stop-color="#13887a"/></linearGradient>
<linearGradient id="d52cornel-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<radialGradient id="d52cornel-ocean" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#8fd3f0"/><stop offset=".6" stop-color="#2f6db5"/><stop offset="1" stop-color="#1d4680"/></radialGradient>
</defs>
<rect width="1000" height="620" rx="24" fill="#eef7f3"/><rect width="1000" height="620" rx="24" fill="url(#d52cornel-dots)" opacity=".7"/><g filter="url(#d52cornel-sh)"><rect x="50" y="24" width="900" height="576" rx="16" fill="url(#d52cornel-pap)"/></g><rect x="50" y="24" width="900" height="56" rx="16" fill="#13887a"/><rect x="50" y="60" width="900" height="20" fill="#13887a"/><text x="500" y="61" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">Cornell Note-Taking Template</text><path d="M300 80V470M50 470h900" stroke="#13887a" stroke-width="4"/><text x="175" y="116" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#2f6db5" text-anchor="middle">Review</text><text x="175" y="150" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b6f80" text-anchor="middle" font-style="italic">Don’t write here</text><text x="175" y="172" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b6f80" text-anchor="middle" font-style="italic">until after your</text><text x="175" y="194" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b6f80" text-anchor="middle" font-style="italic">first listening.</text><text x="175" y="216" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b6f80" text-anchor="middle" font-style="italic"></text><text x="175" y="238" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b6f80" text-anchor="middle" font-style="italic">Then write</text><text x="175" y="260" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b6f80" text-anchor="middle" font-style="italic">questions /</text><text x="175" y="282" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b6f80" text-anchor="middle" font-style="italic">comments.</text><path d="M90 340h170M90 372h130M90 404h150" stroke="#9cc9bf" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/><text x="330" y="116" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#13887a" text-anchor="start">Note-Taking</text><text x="500" y="116" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#5b6f80" text-anchor="start" font-style="italic">· keywords, abbreviations, symbols</text><rect x="326" y="136" width="8" height="22" rx="3" fill="#e64626"/><text x="344" y="152" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="start">Criticisms</text><path d="M344 170h460" stroke="#d6dde3" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 7"/><rect x="326" y="188" width="8" height="22" rx="3" fill="#e64626"/><text x="344" y="204" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="start">e.g. McDonald’s (George Ritzer’s research)</text><path d="M344 222h360" stroke="#d6dde3" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 7"/><rect x="326" y="240" width="8" height="22" rx="3" fill="#e64626"/><text x="344" y="256" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="start">American Dominance</text><path d="M344 274h460" stroke="#d6dde3" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 7"/><rect x="326" y="292" width="8" height="22" rx="3" fill="#e64626"/><text x="344" y="308" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="start">A Common Critique of Globalisation = Americanisation</text><path d="M344 326h360" stroke="#d6dde3" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 7"/><rect x="326" y="344" width="8" height="22" rx="3" fill="#2f7d6b"/><text x="344" y="360" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="start">Arjun Appadurai’s Thesis (Opinion)</text><path d="M344 378h460" stroke="#d6dde3" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 7"/><rect x="326" y="396" width="8" height="22" rx="3" fill="#d9962e"/><text x="344" y="412" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="start">Final thought (Lecturer’s Opinion)</text><path d="M344 430h360" stroke="#d6dde3" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 7"/><text x="500" y="504" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#7a4a8c" text-anchor="middle">Summary</text><path d="M90 536h820M90 566h560" stroke="#d6dde3" stroke-width="2.6" stroke-linecap="round"/><g class="d52cornel-pen"><g transform="translate(860 296) rotate(-32) scale(1.8)"><rect x="-4" y="-30" width="8" height="30" fill="#f4c542"/><rect x="-4" y="-34" width="8" height="5" fill="#e8806b"/><rect x="-4" y="-30" width="8" height="2.5" fill="#c9d3dd"/><path d="M-4 0h8l-4 8z" fill="#f3d9b1"/><path d="M-1.4 5.4h2.8l-1.4 2.6z" fill="#14293a"/><path d="M-1.5-28v26" stroke="#fff" stroke-opacity=".45" stroke-width="1.2"/></g></g>
</svg>
