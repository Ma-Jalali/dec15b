<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="Four signal cards a lecturer uses to explain a word: “X refers to …”, “X – or …”, “X, or we can say …”, and “They have the necessary economic means. They have the money.” Each card shows a hard word turning into an easy explanation.">
<title>How a lecturer signals a definition</title>
<style>
.d52defini-tw{animation:d52defini-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52defini-t2{animation-delay:-1s}.d52defini-t3{animation-delay:-2s}
.d52defini-fl{animation:d52defini-fl 6s ease-in-out infinite}.d52defini-f2{animation-delay:-2s}.d52defini-f3{animation-delay:-4s}
.d52defini-bl{animation:d52defini-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.d52defini-b2{animation-delay:-1.7s}.d52defini-b3{animation-delay:-3.2s}
.d52defini-pu{animation:d52defini-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52defini-u2{animation-delay:-1.3s}
.d52defini-sp{animation:d52defini-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52defini-dr{stroke-dasharray:6 8;animation:d52defini-dr 1.6s linear infinite}
.d52defini-wv{animation:d52defini-wv 2.4s ease-out infinite}.d52defini-w2{animation-delay:-.8s}.d52defini-w3{animation-delay:-1.6s}
.d52defini-sw{animation:d52defini-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52defini-s2{animation-delay:-2s}
.d52defini-pen{animation:d52defini-pen 3s ease-in-out infinite}
.d52defini-spin{animation:d52defini-spin 9s linear infinite}
@keyframes d52defini-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52defini-fl{50%{transform:translateY(-4px)}}
@keyframes d52defini-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52defini-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52defini-sp{to{transform:rotate(360deg)}}
@keyframes d52defini-dr{to{stroke-dashoffset:-28}}
@keyframes d52defini-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52defini-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52defini-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="d52defini-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7f3"/><stop offset="1" stop-color="#d6ebe3"/></linearGradient>
<pattern id="d52defini-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#13887a" fill-opacity=".14"/></pattern>
<radialGradient id="d52defini-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="d52defini-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="d52defini-blur" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="d52defini-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="d52defini-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="d52defini-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="d52defini-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd1c3"/><stop offset="1" stop-color="#13887a"/></linearGradient>
<linearGradient id="d52defini-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<radialGradient id="d52defini-ocean" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#8fd3f0"/><stop offset=".6" stop-color="#2f6db5"/><stop offset="1" stop-color="#1d4680"/></radialGradient>
</defs>
<rect width="1000" height="420" rx="24" fill="#eef7f3"/><rect width="1000" height="420" rx="24" fill="url(#d52defini-dots)" opacity=".7"/><text x="500" y="50" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="800" fill="#14293a" text-anchor="middle">Listen for the signal → get the meaning</text><g class="d52defini-fl "><rect x="30" y="84" width="220" height="306" rx="18" fill="#fff" filter="url(#d52defini-sh)" /><rect x="30" y="84" width="220" height="62" rx="18" fill="#13887a"/><rect x="30" y="120" width="220" height="26" fill="#13887a"/><text x="140" y="124" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="900" fill="#fff" text-anchor="middle">… refers to …</text><text x="140" y="182" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#14293a" text-anchor="middle">Cultural hybridity</text><path d="M140 238v30" stroke="#13887a" stroke-width="4" stroke-linecap="round"/><path d="M130 262l10 12 10-12" stroke="#13887a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="44" y="286" width="192" height="88" rx="12" fill="#eef7f3"/><text x="140" y="314" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#13887a" text-anchor="middle">the blending of</text><text x="140" y="336" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#13887a" text-anchor="middle">elements from</text><text x="140" y="358" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#13887a" text-anchor="middle">different cultures</text></g><g class="d52defini-fl d52defini-f2"><rect x="270" y="84" width="220" height="306" rx="18" fill="#fff" filter="url(#d52defini-sh)" /><rect x="270" y="84" width="220" height="62" rx="18" fill="#2f6db5"/><rect x="270" y="120" width="220" height="26" fill="#2f6db5"/><text x="380" y="124" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="900" fill="#fff" text-anchor="middle">– or …</text><text x="380" y="182" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#14293a" text-anchor="middle">American cultural</text><text x="380" y="206" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#14293a" text-anchor="middle">hegemony</text><path d="M380 238v30" stroke="#2f6db5" stroke-width="4" stroke-linecap="round"/><path d="M370 262l10 12 10-12" stroke="#2f6db5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="284" y="286" width="192" height="88" rx="12" fill="#eef7f3"/><text x="380" y="314" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#2f6db5" text-anchor="middle">the dominance of</text><text x="380" y="336" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#2f6db5" text-anchor="middle">American beliefs and</text><text x="380" y="358" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#2f6db5" text-anchor="middle">values</text></g><g class="d52defini-fl d52defini-f3"><rect x="510" y="84" width="220" height="306" rx="18" fill="#fff" filter="url(#d52defini-sh)" /><rect x="510" y="84" width="220" height="62" rx="18" fill="#7a4a8c"/><rect x="510" y="120" width="220" height="26" fill="#7a4a8c"/><text x="620" y="124" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="900" fill="#fff" text-anchor="middle">or we can say …</text><text x="620" y="182" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#14293a" text-anchor="middle">homogenisation</text><path d="M620 238v30" stroke="#7a4a8c" stroke-width="4" stroke-linecap="round"/><path d="M610 262l10 12 10-12" stroke="#7a4a8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="524" y="286" width="192" height="88" rx="12" fill="#eef7f3"/><text x="620" y="314" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#7a4a8c" text-anchor="middle">different cultures</text><text x="620" y="336" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#7a4a8c" text-anchor="middle">beginning to look</text><text x="620" y="358" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#7a4a8c" text-anchor="middle">similar</text></g><g class="d52defini-fl "><rect x="750" y="84" width="220" height="306" rx="18" fill="#fff" filter="url(#d52defini-sh)" /><rect x="750" y="84" width="220" height="62" rx="18" fill="#e64626"/><rect x="750" y="120" width="220" height="26" fill="#e64626"/><text x="860" y="124" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="900" fill="#fff" text-anchor="middle">say it simply</text><text x="860" y="182" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#14293a" text-anchor="middle">the necessary</text><text x="860" y="206" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#14293a" text-anchor="middle">economic means</text><path d="M860 238v30" stroke="#e64626" stroke-width="4" stroke-linecap="round"/><path d="M850 262l10 12 10-12" stroke="#e64626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="764" y="286" width="192" height="88" rx="12" fill="#eef7f3"/><text x="860" y="314" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#e64626" text-anchor="middle">They have the money.</text></g>
</svg>
