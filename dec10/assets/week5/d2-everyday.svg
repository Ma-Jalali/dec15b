<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="A clock showing the last 24 hours with four things around it: food, TV shows and movies, music, and slang. Arrows go from the clock to three places: my country, Australia, and a different country.">
<title>Your last 24 hours: where did it come from?</title>
<style>
.d52everyd-tw{animation:d52everyd-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52everyd-t2{animation-delay:-1s}.d52everyd-t3{animation-delay:-2s}
.d52everyd-fl{animation:d52everyd-fl 6s ease-in-out infinite}.d52everyd-f2{animation-delay:-2s}.d52everyd-f3{animation-delay:-4s}
