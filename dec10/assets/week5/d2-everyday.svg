.d52everyd-pu{animation:d52everyd-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52everyd-u2{animation-delay:-1.3s}
.d52everyd-sp{animation:d52everyd-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52everyd-dr{stroke-dasharray:6 8;animation:d52everyd-dr 1.6s linear infinite}
.d52everyd-wv{animation:d52everyd-wv 2.4s ease-out infinite}.d52everyd-w2{animation-delay:-.8s}.d52everyd-w3{animation-delay:-1.6s}
.d52everyd-sw{animation:d52everyd-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52everyd-s2{animation-delay:-2s}
.d52everyd-pen{animation:d52everyd-pen 3s ease-in-out infinite}
.d52everyd-spin{animation:d52everyd-spin 9s linear infinite}
@keyframes d52everyd-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52everyd-fl{50%{transform:translateY(-4px)}}
@keyframes d52everyd-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52everyd-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52everyd-sp{to{transform:rotate(360deg)}}
@keyframes d52everyd-dr{to{stroke-dashoffset:-28}}
@keyframes d52everyd-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52everyd-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52everyd-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
