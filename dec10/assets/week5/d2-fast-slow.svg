<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="Two rivers flow together. The fast culture river carries food, fashion and phone icons; the slow culture river carries a temple, a lantern and a scroll for history and tradition. Where they meet, a new colourful river is labelled “new ways to express identity”, with chips for remix, beyond stereotypes and co-creation.">
<title>Fast culture and slow culture are merging</title>
<style>
.d52fastsl-tw{animation:d52fastsl-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52fastsl-t2{animation-delay:-1s}.d52fastsl-t3{animation-delay:-2s}
.d52fastsl-fl{animation:d52fastsl-fl 6s ease-in-out infinite}.d52fastsl-f2{animation-delay:-2s}.d52fastsl-f3{animation-delay:-4s}
.d52fastsl-bl{animation:d52fastsl-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.d52fastsl-b2{animation-delay:-1.7s}.d52fastsl-b3{animation-delay:-3.2s}
.d52fastsl-pu{animation:d52fastsl-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52fastsl-u2{animation-delay:-1.3s}
.d52fastsl-sp{animation:d52fastsl-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52fastsl-dr{stroke-dasharray:6 8;animation:d52fastsl-dr 1.6s linear infinite}
.d52fastsl-wv{animation:d52fastsl-wv 2.4s ease-out infinite}.d52fastsl-w2{animation-delay:-.8s}.d52fastsl-w3{animation-delay:-1.6s}
.d52fastsl-sw{animation:d52fastsl-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52fastsl-s2{animation-delay:-2s}
.d52fastsl-pen{animation:d52fastsl-pen 3s ease-in-out infinite}
.d52fastsl-spin{animation:d52fastsl-spin 9s linear infinite}
@keyframes d52fastsl-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52fastsl-fl{50%{transform:translateY(-4px)}}
@keyframes d52fastsl-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52fastsl-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52fastsl-sp{to{transform:rotate(360deg)}}
@keyframes d52fastsl-dr{to{stroke-dashoffset:-28}}
@keyframes d52fastsl-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52fastsl-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52fastsl-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
