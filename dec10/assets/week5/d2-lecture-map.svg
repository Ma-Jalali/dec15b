<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" fill="none" role="img" aria-label="A road map of the lecture with seven stops: Introduction, Criticisms, McDonald’s (George Ritzer’s research), American dominance, A common critique: Americanisation, Arjun Appadurai’s thesis, and the lecturer’s final thought. Stops 2 to 5 are marked Student A (negative criticisms), stops 6 and 7 Student B (more positive views), with a “However, …” signpost between them.">
<title>The road through the lecture</title>
<style>
.d52lectur-tw{animation:d52lectur-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52lectur-t2{animation-delay:-1s}.d52lectur-t3{animation-delay:-2s}
.d52lectur-fl{animation:d52lectur-fl 6s ease-in-out infinite}.d52lectur-f2{animation-delay:-2s}.d52lectur-f3{animation-delay:-4s}
.d52lectur-bl{animation:d52lectur-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.d52lectur-b2{animation-delay:-1.7s}.d52lectur-b3{animation-delay:-3.2s}
.d52lectur-pu{animation:d52lectur-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52lectur-u2{animation-delay:-1.3s}
.d52lectur-sp{animation:d52lectur-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52lectur-dr{stroke-dasharray:6 8;animation:d52lectur-dr 1.6s linear infinite}
.d52lectur-wv{animation:d52lectur-wv 2.4s ease-out infinite}.d52lectur-w2{animation-delay:-.8s}.d52lectur-w3{animation-delay:-1.6s}
.d52lectur-sw{animation:d52lectur-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52lectur-s2{animation-delay:-2s}
.d52lectur-pen{animation:d52lectur-pen 3s ease-in-out infinite}
.d52lectur-spin{animation:d52lectur-spin 9s linear infinite}
@keyframes d52lectur-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52lectur-fl{50%{transform:translateY(-4px)}}
@keyframes d52lectur-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52lectur-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52lectur-sp{to{transform:rotate(360deg)}}
@keyframes d52lectur-dr{to{stroke-dashoffset:-28}}
@keyframes d52lectur-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52lectur-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52lectur-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
