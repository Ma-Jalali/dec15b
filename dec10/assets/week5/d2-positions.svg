<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" fill="none" role="img" aria-label="Three possible positions on a line. For: cultural globalisation IS having a negative impact on culture. Against: it is NOT ONLY having a negative impact — it’s not completely negative. Strongly against: it is having a POSITIVE impact on culture.">
<title>Three possible positions</title>
<style>
.d52positi-tw{animation:d52positi-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52positi-t2{animation-delay:-1s}.d52positi-t3{animation-delay:-2s}
.d52positi-fl{animation:d52positi-fl 6s ease-in-out infinite}.d52positi-f2{animation-delay:-2s}.d52positi-f3{animation-delay:-4s}
.d52positi-bl{animation:d52positi-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.d52positi-b2{animation-delay:-1.7s}.d52positi-b3{animation-delay:-3.2s}
.d52positi-pu{animation:d52positi-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52positi-u2{animation-delay:-1.3s}
.d52positi-sp{animation:d52positi-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52positi-dr{stroke-dasharray:6 8;animation:d52positi-dr 1.6s linear infinite}
.d52positi-wv{animation:d52positi-wv 2.4s ease-out infinite}.d52positi-w2{animation-delay:-.8s}.d52positi-w3{animation-delay:-1.6s}
.d52positi-sw{animation:d52positi-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52positi-s2{animation-delay:-2s}
.d52positi-pen{animation:d52positi-pen 3s ease-in-out infinite}
.d52positi-spin{animation:d52positi-spin 9s linear infinite}
@keyframes d52positi-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52positi-fl{50%{transform:translateY(-4px)}}
@keyframes d52positi-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52positi-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52positi-sp{to{transform:rotate(360deg)}}
@keyframes d52positi-dr{to{stroke-dashoffset:-28}}
@keyframes d52positi-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52positi-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52positi-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}
.d52positi-slide{animation:d52positi-slide 8s ease-in-out infinite}@keyframes d52positi-slide{0%,100%{transform:translateX(-330px)}50%{transform:translateX(330px)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="d52positi-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcf2ec"/><stop offset="1" stop-color="#f4dccd"/></linearGradient>
<pattern id="d52positi-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#b0512a" fill-opacity=".14"/></pattern>
<radialGradient id="d52positi-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="d52positi-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="d52positi-blur" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="d52positi-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="d52positi-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="d52positi-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="d52positi-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef9c78"/><stop offset="1" stop-color="#b0512a"/></linearGradient>
<linearGradient id="d52positi-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<radialGradient id="d52positi-ocean" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#8fd3f0"/><stop offset=".6" stop-color="#2f6db5"/><stop offset="1" stop-color="#1d4680"/></radialGradient>
</defs>
<rect width="1000" height="400" rx="24" fill="#fcf2ec"/><rect width="1000" height="400" rx="24" fill="url(#d52positi-dots)" opacity=".7"/><linearGradient id="d52positi-ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e64626"/><stop offset=".5" stop-color="#e3a843"/><stop offset="1" stop-color="#2f7d6b"/></linearGradient><rect x="100" y="120" width="800" height="16" rx="8" fill="url(#d52positi-ln)"/><g class="d52positi-pu "><circle cx="170" cy="128" r="26" fill="#e64626" stroke="#fff" stroke-width="5" filter="url(#d52positi-sh)"/></g><path d="M160 128h20" stroke="#fff" stroke-width="5" stroke-linecap="round"/><rect x="20" y="180" width="300" height="150" rx="18" fill="#fff" stroke="#e64626" stroke-width="1.6" filter="url(#d52positi-sh)" /><text x="170" y="222" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#e64626" text-anchor="middle">“For”</text><text x="170" y="256" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b6f80" text-anchor="middle">Cultural globalisation</text><text x="170" y="282" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">IS having a</text><text x="170" y="306" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">negative impact</text><g class="d52positi-pu d52positi-u2"><circle cx="500" cy="128" r="26" fill="#d9962e" stroke="#fff" stroke-width="5" filter="url(#d52positi-sh)"/></g><path d="M490 122h20M490 134h20" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="350" y="180" width="300" height="150" rx="18" fill="#fff" stroke="#d9962e" stroke-width="1.6" filter="url(#d52positi-sh)" /><text x="500" y="222" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#d9962e" text-anchor="middle">“Against”</text><text x="500" y="256" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b6f80" text-anchor="middle">Cultural globalisation</text><text x="500" y="282" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">NOT ONLY a negative impact</text><text x="500" y="306" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">(not completely negative)</text><g class="d52positi-pu "><circle cx="830" cy="128" r="26" fill="#2f7d6b" stroke="#fff" stroke-width="5" filter="url(#d52positi-sh)"/></g><path d="M820 128h20M830 118v20" stroke="#fff" stroke-width="5" stroke-linecap="round"/><rect x="680" y="180" width="300" height="150" rx="18" fill="#fff" stroke="#2f7d6b" stroke-width="1.6" filter="url(#d52positi-sh)" /><text x="830" y="222" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="900" fill="#2f7d6b" text-anchor="middle">“Strongly against”</text><text x="830" y="256" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b6f80" text-anchor="middle">Cultural globalisation</text><text x="830" y="282" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">is having a</text><text x="830" y="306" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">POSITIVE impact</text><text x="500" y="70" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#14293a" text-anchor="middle">Is cultural globalisation having a negative impact on culture?</text><g class="d52positi-slide"><path d="M500 92l-12-16h24z" fill="#14293a"/></g><text x="500" y="372" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#e64626" text-anchor="middle">Choose your position — then find evidence in all three sources.</text>
</svg>
