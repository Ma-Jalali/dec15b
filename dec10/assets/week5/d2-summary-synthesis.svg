<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" fill="none" role="img" aria-label="Left: a summary goes source by source — Source 1, then Source 2, then Source 3 in separate boxes. Right: a synthesis goes idea by idea in a research matrix. Rows are ideas (homogenisation, one-sided cultural flows, hybridity) and columns are sources (Hassi and Storti 2012, Van Krieken 2016, Crysell et al. 2023) with ticks for “supports” and crosses for “challenges”, and a column for my analysis.">
<title>Summary: source by source. Synthesis: idea by idea.</title>
<style>
.d52summar-tw{animation:d52summar-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52summar-t2{animation-delay:-1s}.d52summar-t3{animation-delay:-2s}
.d52summar-fl{animation:d52summar-fl 6s ease-in-out infinite}.d52summar-f2{animation-delay:-2s}.d52summar-f3{animation-delay:-4s}
.d52summar-bl{animation:d52summar-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.d52summar-b2{animation-delay:-1.7s}.d52summar-b3{animation-delay:-3.2s}
.d52summar-pu{animation:d52summar-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52summar-u2{animation-delay:-1.3s}
.d52summar-sp{animation:d52summar-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52summar-dr{stroke-dasharray:6 8;animation:d52summar-dr 1.6s linear infinite}
.d52summar-wv{animation:d52summar-wv 2.4s ease-out infinite}.d52summar-w2{animation-delay:-.8s}.d52summar-w3{animation-delay:-1.6s}
.d52summar-sw{animation:d52summar-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52summar-s2{animation-delay:-2s}
.d52summar-pen{animation:d52summar-pen 3s ease-in-out infinite}
.d52summar-spin{animation:d52summar-spin 9s linear infinite}
@keyframes d52summar-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52summar-fl{50%{transform:translateY(-4px)}}
@keyframes d52summar-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52summar-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52summar-sp{to{transform:rotate(360deg)}}
@keyframes d52summar-dr{to{stroke-dashoffset:-28}}
@keyframes d52summar-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52summar-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52summar-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
