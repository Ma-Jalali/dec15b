e="16" font-weight="700" fill="#7f3519" text-anchor="start">argument</text><rect x="40" y="635" width="920" height="131" rx="12" fill="#f7f9fd" stroke="#d6dde8" stroke-width="1.4"/><circle cx="58" cy="689.5" r="3.5" fill="#2f6db5"/><text x="70" y="694.5" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#14293a" text-anchor="start">Author expanded on</text><text x="70" y="715.5" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#14293a" text-anchor="start">these studies</text><path d="M360 650h-6v99h6M354 699.5h-10" stroke="#13887a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="370" y="663" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b5a51" text-anchor="start">suggesting</text><text x="370" y="684" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b5a51" text-anchor="start">illustrating</text><text x="370" y="705" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b5a51" text-anchor="start">supporting</text><text x="370" y="726" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b5a51" text-anchor="start">questioning</text><text x="370" y="747" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b5a51" text-anchor="start">rejecting</text><path d="M650 660.5h-6v78h6M644 699.5h-10" stroke="#e64626" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="660" y="673.5" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#7f3519" text-anchor="start">the notion</text><text x="660" y="694.5" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#7f3519" text-anchor="start">the recommendation</text><text x="660" y="715.5" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#7f3519" text-anchor="start">the findings</text><text