.d52synthl-pu{animation:d52synthl-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52synthl-u2{animation-delay:-1.3s}
.d52synthl-sp{animation:d52synthl-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52synthl-dr{stroke-dasharray:6 8;animation:d52synthl-dr 1.6s linear infinite}
.d52synthl-wv{animation:d52synthl-wv 2.4s ease-out infinite}.d52synthl-w2{animation-delay:-.8s}.d52synthl-w3{animation-delay:-1.6s}
.d52synthl-sw{animation:d52synthl-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52synthl-s2{animation-delay:-2s}
.d52synthl-pen{animation:d52synthl-pen 3s ease-in-out infinite}
.d52synthl-spin{animation:d52synthl-spin 9s linear infinite}
@keyframes d52synthl-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52synthl-fl{50%{transform:translateY(-4px)}}
@keyframes d52synthl-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52synthl-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52synthl-sp{to{transform:rotate(360deg)}}
@keyframes d52synthl-dr{to{stroke-dashoffset:-28}}
@keyframes d52synthl-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52synthl-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52synthl-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
