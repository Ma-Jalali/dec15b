<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1090" fill="none" role="img" aria-label="Language to compare, contrast and synthesise, as sentence builders in three columns. Row 1: The majority of / Numerous / Several / Some / A few + studies / authors + found / demonstrated / examined / questioned / suggest. Row 2: Despite x, the / However the / In contrast the / Similarly / Furthermore + author(s)(’s) + found / perspective or view is / argument is / findings are. Row 3: The literature / Research / Findings / Recommendations + is/are + consistent or inconsistent / clear or unclear. Row 4: Author takes a + similar / different / complimentary / contrasting / conflicting + view or perspective / argument. Row 5: Author expanded on these studies + suggesting / illustrating / supporting / questioning / rejecting + the notion / the recommendation / the findings / the assumption. Row 6: The relationship between A and B was + further / also / equally + supported by author / questioned by author. Row 7: There is + continued / little / some + debate / agreement / disagreement / controversy; There is + strong / little / significant / conclusive or inconclusive + evidence.">
<title>Language to compare, contrast and synthesise</title>
<style>
.d52synthl-tw{animation:d52synthl-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52synthl-t2{animation-delay:-1s}.d52synthl-t3{animation-delay:-2s}
.d52synthl-fl{animation:d52synthl-fl 6s ease-in-out infinite}.d52synthl-f2{animation-delay:-2s}.d52synthl-f3{animation-delay:-4s}
