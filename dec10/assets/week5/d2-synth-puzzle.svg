<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" fill="none" role="img" aria-label="Three puzzle pieces — Source 1, Source 2 and Source 3 — fit together with a fourth piece called Your point. On the right, crossed-out cards show what synthesis is not: a series of summaries, direct quotes without your own voice, simply comparing and contrasting, critiquing a source.">
<title>Synthesis is like a puzzle</title>
<style>
.d52synthp-tw{animation:d52synthp-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52synthp-t2{animation-delay:-1s}.d52synthp-t3{animation-delay:-2s}
.d52synthp-fl{animation:d52synthp-fl 6s ease-in-out infinite}.d52synthp-f2{animation-delay:-2s}.d52synthp-f3{animation-delay:-4s}
.d52synthp-bl{animation:d52synthp-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.d52synthp-b2{animation-delay:-1.7s}.d52synthp-b3{animation-delay:-3.2s}
.d52synthp-pu{animation:d52synthp-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52synthp-u2{animation-delay:-1.3s}
.d52synthp-sp{animation:d52synthp-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52synthp-dr{stroke-dasharray:6 8;animation:d52synthp-dr 1.6s linear infinite}
.d52synthp-wv{animation:d52synthp-wv 2.4s ease-out infinite}.d52synthp-w2{animation-delay:-.8s}.d52synthp-w3{animation-delay:-1.6s}
.d52synthp-sw{animation:d52synthp-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52synthp-s2{animation-delay:-2s}
.d52synthp-pen{animation:d52synthp-pen 3s ease-in-out infinite}
.d52synthp-spin{animation:d52synthp-spin 9s linear infinite}
@keyframes d52synthp-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52synthp-fl{50%{transform:translateY(-4px)}}
@keyframes d52synthp-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52synthp-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52synthp-sp{to{transform:rotate(360deg)}}
@keyframes d52synthp-dr{to{stroke-dashoffset:-28}}
@keyframes d52synthp-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52synthp-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52synthp-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="d52synthp-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2fa"/><stop offset="1" stop-color="#dbe4f5"/></linearGradient>
<pattern id="d52synthp-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#3a58a0" fill-opacity=".14"/></pattern>
<radialGradient id="d52synthp-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="d52synthp-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="d52synthp-blur" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="d52synthp-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="d52synthp-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="d52synthp-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="d52synthp-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fa8dc"/><stop offset="1" stop-color="#3a58a0"/></linearGradient>
<linearGradient id="d52synthp-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<radialGradient id="d52synthp-ocean" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#8fd3f0"/><stop offset=".6" stop-color="#2f6db5"/><stop offset="1" stop-color="#1d4680"/></radialGradient>
</defs>
<rect width="1000" height="480" rx="24" fill="#eef2fa"/><rect width="1000" height="480" rx="24" fill="url(#d52synthp-dots)" opacity=".7"/><text x="250" y="54" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="900" fill="#2f6db5" text-anchor="middle">Synthesis IS …</text><text x="750" y="54" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="900" fill="#e64626" text-anchor="middle">Synthesis is NOT …</text><g class="d52synthp-fl "><path d="M110 110L250 110L250 163.2A19.6 19.6 0 1 1 250 196.8L250 250L196.8 250A19.6 19.6 0 1 1 163.2 250L110 250L110 110z" fill="#2f6db5" stroke="#fff" stroke-width="3" filter="url(#d52synthp-sh)"/><text x="180" y="188" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="900" fill="#fff" text-anchor="middle">Source 1</text></g><g class="d52synthp-fl d52synthp-f2"><path d="M250 110L390 110L390 250L336.8 250A19.6 19.6 0 1 1 303.2 250L250 250L250 196.8A19.6 19.6 0 1 0 250 163.2L250 110z" fill="#13887a" stroke="#fff" stroke-width="3" filter="url(#d52synthp-sh)"/><text x="320" y="188" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="900" fill="#fff" text-anchor="middle">Source 2</text></g><g class="d52synthp-fl d52synthp-f3"><path d="M110 250L163.2 250A19.6 19.6 0 1 0 196.8 250L250 250L250 303.2A19.6 19.6 0 1 1 250 336.8L250 390L110 390L110 250z" fill="#e64626" stroke="#fff" stroke-width="3" filter="url(#d52synthp-sh)"/><text x="180" y="328" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="900" fill="#fff" text-anchor="middle">Source 3</text></g><g class=""><path d="M250 250L303.2 250A19.6 19.6 0 1 0 336.8 250L390 250L390 390L250 390L250 336.8A19.6 19.6 0 1 0 250 303.2L250 250z" fill="#d9962e" stroke="#fff" stroke-width="3" filter="url(#d52synthp-sh)"/><text x="320" y="328" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="900" fill="#fff" text-anchor="middle">Your point</text></g><g class="d52synthp-pu"><path class="d52synthp-tw " d="M404 366C406.52 377.48 406.52 377.48 418 380C406.52 382.52 406.52 382.52 404 394C401.48 382.52 401.48 382.52 390 380C401.48 377.48 401.48 377.48 404 366z" fill="#e3a843"/></g><text x="250" y="440" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">combine sources to support YOUR argument</text><rect x="560" y="96" width="380" height="64" rx="14" fill="#fff" filter="url(#d52synthp-sh)" /><g><circle cx="598" cy="128" r="17" fill="#e64626"/><path d="M591.54 121.54l12.92 12.92M604.46 121.54l-12.92 12.92" stroke="#fff" stroke-width="4.42" stroke-linecap="round"/></g><text x="630" y="135" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="start">A series of summaries</text><path d="M626 129h211.68" stroke="#e64626" stroke-width="2.4" opacity=".55"/><rect x="560" y="180" width="380" height="64" rx="14" fill="#fff" filter="url(#d52synthp-sh)" /><g><circle cx="598" cy="212" r="17" fill="#e64626"/><path d="M591.54 205.54l12.92 12.92M604.46 205.54l-12.92 12.92" stroke="#fff" stroke-width="4.42" stroke-linecap="round"/></g><text x="630" y="219" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="start">Direct quotes without your own voice</text><path d="M626 213h296" stroke="#e64626" stroke-width="2.4" opacity=".55"/><rect x="560" y="264" width="380" height="64" rx="14" fill="#fff" filter="url(#d52synthp-sh)" /><g><circle cx="598" cy="296" r="17" fill="#e64626"/><path d="M591.54 289.54l12.92 12.92M604.46 289.54l-12.92 12.92" stroke="#fff" stroke-width="4.42" stroke-linecap="round"/></g><text x="630" y="303" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="start">Simply comparing and contrasting</text><path d="M626 297h296" stroke="#e64626" stroke-width="2.4" opacity=".55"/><rect x="560" y="348" width="380" height="64" rx="14" fill="#fff" filter="url(#d52synthp-sh)" /><g><circle cx="598" cy="380" r="17" fill="#e64626"/><path d="M591.54 373.54l12.92 12.92M604.46 373.54l-12.92 12.92" stroke="#fff" stroke-width="4.42" stroke-linecap="round"/></g><text x="630" y="387" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#14293a" text-anchor="start">Critiquing a source</text><path d="M626 381h191.52" stroke="#e64626" stroke-width="2.4" opacity=".55"/>
</svg>
