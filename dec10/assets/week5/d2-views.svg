 sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">cultural heterogeneity</text><rect x="564" y="240" width="300" height="36" rx="18" fill="#2f7d6b" filter="url(#d52views-sh)"/><text x="714" y="264.12" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">different ways &amp; speeds</text></g><text x="270" y="70" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="900" fill="#e64626" text-anchor="middle">Critics · Ritzer · Americanisation theory</text><text x="722" y="70" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="900" fill="#2f7d6b" text-anchor="middle">Arjun Appadurai (more optimistic)</text><path d="M500 308l-46 76h92z" fill="#13887a" filter="url(#d52views-sh)"/><circle cx="500" cy="300" r="12" fill="#e3a843" stroke="#fff" stroke-width="3"/><rect x="300" y="396" width="400" height="50" rx="25" fill="#fff" stroke="#13887a" stroke-width="1.6" filter="url(#d52views-sh)" /><text x="500" y="427" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#13887a" text-anchor="middle">Lecturer: “Clearly … both unifying and diversifying”</text><path class="d52views-tw " d="M500 218C502.16 227.84 502.16 227.84 512 230C502.16 232.16 502.16 232.16 500 242C497.84 232.16 497.84 232.16 488 230C497.84 227.84 497.84 227.84 500 218z" fill="#e3a843"/><path class="d52views-tw d52views-t2" d="M60 392C61.44 398.56 61.44 398.56 68 400C61.44 401.44 61.44 401.44 60 408C58.56 401.44 58.56 401.44 52 400C58.56 398.56 58.56 398.56 60 392z" fill="#e64626"/><path class="d52views-tw d52views-t3" d="M950 392C951.44 398.56 951.44 398.56 958 400C951.44 401.44 951.44 401.44 950 408C948.56 401.44 948.56 401.44 942 400C948.56 398.56 948.56 398.56 950 392z" fill="#2f7d6b"/>
