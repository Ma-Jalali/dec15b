<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="A see-saw of views on globalisation and culture. On the left: critics, proponents of the Americanisation theory and George Ritzer — cultural imperialism, Americanisation, homogenisation and standardisation, McDonald’s. On the right: Arjun Appadurai — cultural hybridity, new cultural identities, heterogeneity, different ways and speeds. In the middle, the lecturer: clearly, both unifying and diversifying, depending on the local context.">
<title>Voices in the lecture</title>
<style>
.d52views-tw{animation:d52views-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52views-t2{animation-delay:-1s}.d52views-t3{animation-delay:-2s}
.d52views-fl{animation:d52views-fl 6s ease-in-out infinite}.d52views-f2{animation-delay:-2s}.d52views-f3{animation-delay:-4s}
.d52views-bl{animation:d52views-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.d52views-b2{animation-delay:-1.7s}.d52views-b3{animation-delay:-3.2s}
.d52views-pu{animation:d52views-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52views-u2{animation-delay:-1.3s}
.d52views-sp{animation:d52views-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52views-dr{stroke-dasharray:6 8;animation:d52views-dr 1.6s linear infinite}
.d52views-wv{animation:d52views-wv 2.4s ease-out infinite}.d52views-w2{animation-delay:-.8s}.d52views-w3{animation-delay:-1.6s}
.d52views-sw{animation:d52views-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52views-s2{animation-delay:-2s}
.d52views-pen{animation:d52views-pen 3s ease-in-out infinite}
.d52views-spin{animation:d52views-spin 9s linear infinite}
@keyframes d52views-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52views-fl{50%{transform:translateY(-4px)}}
@keyframes d52views-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52views-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52views-sp{to{transform:rotate(360deg)}}
@keyframes d52views-dr{to{stroke-dashoffset:-28}}
@keyframes d52views-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52views-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52views-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}
.d52views-rock{animation:d52views-rock 6s ease-in-out infinite}@keyframes d52views-rock{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
