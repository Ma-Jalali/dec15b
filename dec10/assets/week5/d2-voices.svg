h)"/><text x="533" y="180" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">In theory, … However, in practice …</text><rect x="515" y="208" width="455" height="44" rx="12" fill="#fff" stroke="#e64626" stroke-opacity=".5" stroke-width="1.6" filter="url(#d52voices-sh)"/><text x="533" y="236" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">There is little doubt that …</text><rect x="515" y="264" width="455" height="44" rx="12" fill="#fff" stroke="#e64626" stroke-opacity=".5" stroke-width="1.6" filter="url(#d52voices-sh)"/><text x="533" y="292" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">It’s not surprising then that …</text><rect x="515" y="320" width="455" height="44" rx="12" fill="#fff" stroke="#e64626" stroke-opacity=".5" stroke-width="1.6" filter="url(#d52voices-sh)"/><text x="533" y="348" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">Clearly, …</text><rect x="515" y="376" width="455" height="44" rx="12" fill="#fff" stroke="#e64626" stroke-opacity=".5" stroke-width="1.6" filter="url(#d52voices-sh)"/><text x="533" y="404" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">I would argue that …</text><rect x="515" y="432" width="455" height="44" rx="12" fill="#fff" stroke="#e64626" stroke-opacity=".5" stroke-width="1.6" filter="url(#d52voices-sh)"/><text x="533" y="460" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">It seems to me that …</text><rect x="515" y="488" width="455" height="44" rx="12" fill="#fff" stroke="#e64626" stroke-opacity=".5" stroke-width="1.6" filter="url(#d52voices-sh)"/><text x="533" y="516" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">I concur with ___ when they say …</text><rect x="515" y="544" width="455" height="44" rx="12" fill="#fff" stroke="#e64626" stroke-opacity=".5" stroke-width="1.6" filter="url(#d52voices-sh)"/><text x="533" y="572" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">I don’t entirely agree that … because …</text><g class="d52voices-pu"><circle cx="500" cy="51" r="16" fill="#e3a843" stroke="#fff" stroke-width="3"/><text x="500" y="57" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">vs</text></g>
