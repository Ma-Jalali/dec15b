<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" fill="none" role="img" aria-label="Two columns of speech bubbles. Left, phrases to introduce other people’s opinions: Critics of … argue that …; According to …; One of the most common critiques of … is that …; Proponents of this theory argue that …; … contends that … He/She thinks …; … suggests that …; … argues instead that …; In …’s thesis / view / opinion …; He/she doesn’t deny that …, but he/she also doesn’t believe that …. Right, phrases to express opinions: (The) chances are …; In theory, … However, in practice …; There is little doubt that …; It’s not surprising then that …; Clearly …; I would argue that …; It seems to me that …; I concur with … when they say …; I don’t entirely agree that … because ….">
<title>Language for expressing opinions</title>
<style>
.d52voices-tw{animation:d52voices-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52voices-t2{animation-delay:-1s}.d52voices-t3{animation-delay:-2s}
.d52voices-fl{animation:d52voices-fl 6s ease-in-out infinite}.d52voices-f2{animation-delay:-2s}.d52voices-f3{animation-delay:-4s}
.d52voices-bl{animation:d52voices-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.d52voices-b2{animation-delay:-1.7s}.d52voices-b3{animation-delay:-3.2s}
.d52voices-pu{animation:d52voices-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d52voices-u2{animation-delay:-1.3s}
.d52voices-sp{animation:d52voices-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.d52voices-dr{stroke-dasharray:6 8;animation:d52voices-dr 1.6s linear infinite}
.d52voices-wv{animation:d52voices-wv 2.4s ease-out infinite}.d52voices-w2{animation-delay:-.8s}.d52voices-w3{animation-delay:-1.6s}
.d52voices-sw{animation:d52voices-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.d52voices-s2{animation-delay:-2s}
.d52voices-pen{animation:d52voices-pen 3s ease-in-out infinite}
.d52voices-spin{animation:d52voices-spin 9s linear infinite}
@keyframes d52voices-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes d52voices-fl{50%{transform:translateY(-4px)}}
@keyframes d52voices-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes d52voices-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes d52voices-sp{to{transform:rotate(360deg)}}
@keyframes d52voices-dr{to{stroke-dashoffset:-28}}
@keyframes d52voices-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes d52voices-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes d52voices-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="d52voices-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7f3"/><stop offset="1" stop-color="#d6ebe3"/></linearGradient>
<pattern id="d52voices-dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".9" fill="#13887a" fill-opacity=".14"/></pattern>
<radialGradient id="d52voices-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="d52voices-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="d52voices-blur" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="d52voices-pap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f3ead8"/></linearGradient>
<linearGradient id="d52voices-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="d52voices-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="d52voices-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd1c3"/><stop offset="1" stop-color="#13887a"/></linearGradient>
<linearGradient id="d52voices-coral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c93b20"/></linearGradient>
<radialGradient id="d52voices-ocean" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#8fd3f0"/><stop offset=".6" stop-color="#2f6db5"/><stop offset="1" stop-color="#1d4680"/></radialGradient>
</defs>
<rect width="1000" height="620" rx="24" fill="#eef7f3"/><rect width="1000" height="620" rx="24" fill="url(#d52voices-dots)" opacity=".7"/><rect x="30" y="26" width="455" height="50" rx="25" fill="#13887a" filter="url(#d52voices-sh)"/><text x="257.5" y="58.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">Introduce OTHER people’s opinions</text><rect x="515" y="26" width="455" height="50" rx="25" fill="#e64626" filter="url(#d52voices-sh)"/><text x="742.5" y="58.2" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">Express YOUR opinion</text><rect x="30" y="96" width="455" height="44" rx="12" fill="#fff" stroke="#13887a" stroke-opacity=".5" stroke-width="1.6" filter="url(#d52voices-sh)"/><text x="48" y="124" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">Critics of ___ argue that …</text><rect x="30" y="152" width="455" height="44" rx="12" fill="#fff" stroke="#13887a" stroke-opacity=".5" stroke-width="1.6" filter="url(#d52voices-sh)"/><text x="48" y="180" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">According to ___, …</text><rect x="30" y="208" width="455" height="44" rx="12" fill="#fff" stroke="#13887a" stroke-opacity=".5" stroke-width="1.6" filter="url(#d52voices-sh)"/><text x="48" y="236" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#14293a" text-anchor="start">One of the most common critiques of ___ is that …</text><rect x="30" y="264" width="455" height="44" rx="12" fill="#fff" stroke="#13887a" stroke-opacity=".5" stroke-width="1.6" filter="url(#d52voices-sh)"/><text x="48" y="292" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="start">Proponents of this theory argue that …</text><rect x="30" y="320" width="455" height="44" rx="12" fill=