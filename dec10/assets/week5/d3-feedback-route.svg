<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" fill="none" role="img" aria-label="The route from feedback to action in four stops: 1 read the feedback, 2 match each comment to a rubric criterion, 3 decide exactly what you did well and what you could do better, 4 write an action plan for the group essay.">
<title>The route from feedback to action in four stops: 1 read the feedback, 2 match each comment to a rubric criterion, 3 decide exactly what you did well and what you could do better, 4 write an action plan for the group essay.</title>
<style>
