xt><text x="140" y="258" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">Read your feedback</text><text x="140" y="278" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">carefully — twice.</text><g class="w5d3fr-fl w5d3fr-f2"><g filter="url(#w5d3fr-sh)"><circle cx="380" cy="150" r="52" fill="#fff"/></g><circle cx="380" cy="150" r="52" stroke="#3a58a0" stroke-width="4"/><circle cx="380" cy="150" r="42" fill="#3a58a0" fill-opacity=".1"/><rect x="350" y="126" width="26" height="18" rx="5" fill="#e3a843"/><path d="M356 144l-3 7 9-7z" fill="#e3a843"/><rect x="382" y="124" width="30" height="10" rx="3" fill="#3a58a0" fill-opacity="0.25"/><rect x="382" y="138" width="30" height="10" rx="3" fill="#3a58a0" fill-opacity="0.45"/><rect x="382" y="152" width="30" height="10" rx="3" fill="#3a58a0" fill-opacity="0.25"/><rect x="382" y="166" width="30" height="10" rx="3" fill="#3a58a0" fill-opacity="0.25"/><path d="M374 135L379.0 141.0" stroke="#3a58a0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="1"/><path d="M373.5 138.5L379.0 141.0L377.5 135.2" stroke="#3a58a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="1"/></g><text x="380" y="232" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#3a58a0" text-anchor="middle">2  Match</text><text x="380" y="258" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">Match each comment</text><text x="380" y="278" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">to a rubric criterion.</text><g class="w5d3fr-fl w5d3fr-f3"><g filter="url(#w5d3fr-sh)"><circle cx="620" cy="150" r="52" fill="#fff"/></g><circle cx="620" cy="150" r="52" stroke="#b07d12" stroke-width="4"/><circle cx="620" cy="150" r="42" fill="#b07d12" fill-opacity=".1"/><g class="w5d3fr-pop"><circle cx="604" cy="150" r="15" fill="#2f9a63"/><path d="M597.25 150l4.5 4.8 9.0-9.3" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="w5d3fr-pop w5d3fr-o2"><circle cx="638" cy="150" r="15" fill="#e3a843"/><path d="M638 158V142M631 148l7-7 7 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="620" y="232" font-family="Manrope, Arial, sans-serif" font-size="21" font-weight="800" fill="#b07d12" text-anchor="middle">3  Decide</text><text x="620" y="258" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">What exactly did I do</text><text x="620" y="278" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">well? What could I</text><text x="620" y="298" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">do better?</text><g class="w5d3fr-fl w5d3fr-f1"><g filter="url(#w5d3fr-sh)"><circle cx="860" cy="150" r="52" fill="#fff"/></g><circle cx="860" cy="150" r="52" stroke="#8a4f9e" stroke-width="4"/><circle cx="860" cy="150" r="42" fill="#8a4f9e" fill-opacity=".1"/><rect x="836" y="122" width="40" height="54" rx="6" fill="#fff" stroke="#8a4f9e" stroke-width="2.5"/><g><circle cx="846" cy="135" r="4.5" fill="#2f9a63"/><path d="M843.975 135l1.3499999999999999 1.44 2.6999999999999997-2.79" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M854 135h16" stroke="#14293a" stroke-opacity=".3" stroke-width="2.5" stroke-linecap="round"/><g><circle cx="846" cy="149" r="4.5" fill="#2f9a63"/><path d="M843.975 149l1.3499999999999999 1.44 2.6999999999999997-2.79" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M854 149h16" stroke="#14293a" stroke-opacity=".3" stroke-width="2.5" stroke-linecap="round"/><g><circle cx="846"