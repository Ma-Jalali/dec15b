ize="19" font-weight="800" fill="#3a58a0" text-anchor="start">Explanation + source</text><text x="145" y="224" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">According to Van Krieken (2016), …</text></g><path d="M490 246v18" stroke="#3a58a0" stroke-width="2.5" stroke-dasharray="3 4"/><g class="w5d3pg-fl w5d3pg-f3"><g filter="url(#w5d3pg-sh)"><rect x="70" y="264" width="440" height="84" rx="14" fill="url(#w5d3pg-paper)"/></g><rect x="70" y="264" width="440" height="84" rx="14" stroke="#14293a" stroke-opacity=".08"/><rect x="70" y="264" width="12" height="84" rx="6" fill="#2b776e"/><rect x="76" y="264" width="434" height="84" rx="14" fill="#2b776e" fill-opacity=".06"/><circle cx="110" cy="306" r="23" fill="#2b776e" fill-opacity=".12"/><circle cx="110" cy="306" r="17" fill="#fff" stroke="#2b776e" stroke-width="3" stroke-dasharray="4 4"/><text x="145" y="300" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#2b776e" text-anchor="start">Example</text><text x="145" y="326" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">For instance, … / One example of this is …</text></g><path d="M490 348v18" stroke="#2b776e" stroke-width="2.5" stroke-dasharray="3 4"/><g class="w5d3pg-fl w5d3pg-f1"><g filter="url(#w5d3pg-sh)"><rect x="70" y="366" width="440" height="84" rx="14" fill="url(#w5d3pg-paper)"/></g><rect x="70" y="366" width="440" height="84" rx="14" stroke="#14293a" stroke-opacity=".08"/><rect x="70" y="366" width="12" height="84" rx="6" fill="#b0512a"/><rect x="76" y="366" width="434" height="84" rx="14" fill="#b0512a" fill-opacity=".06"/><circle cx="110" cy="408" r="23" fill="#b0512a" fill-opacity=".12"/><circle cx="110" cy="408" r="17" fill="#fff" stroke="#b0512a" stroke-width="3" stroke-dasharray="4 4"/><text x="145" y="402" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#b0512a" text-anchor="start">So what?</text><text x="145" y="428" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Consequently, … / As a result, …</text></g><path d="M490 450v18" stroke="#b0512a" stroke-width="2.5" stroke-dasharray="3 4"/><g class="w5d3pg-fl w5d3pg-f2"><g filter="url(#w5d3pg-sh)"><rect x="70" y="468" width="440" height="84" rx="14" fill="url(#w5d3pg-paper)"/></g><rect x="70" y="468" width="440" height="84" rx="14" stroke="#14293a" stroke-opacity=".08"/><rect x="70" y="468" width="12" height="84" rx="6" fill="#985c0e"/><rect x="76" y="468" width="434" height="84" rx="14" fill="#985c0e" fill-opacity=".06"/><circle cx="110" cy="510" r="23" fill="#985c0e" fill-opacity=".12"/><circle cx="110" cy="510" r="17" fill="#fff" stroke="#985c0e" stroke-width="3" stroke-dasharray="4 4"/><text x="145" y="504" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#985c0e" text-anchor="start">Link back</text><text x="145" y="530" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="start">Ultimately, … / Clearly, …</text></g><g filter="url(#w5d3pg-sh)"><rect x="560" y="110" width="400" height="400" rx="22" fill="url(#w5d3pg-paper)"/></g><rect x="560" y="110" width="400" height="400" rx="22" stroke="#14293a" stroke-opacity=".08"/><circle cx="600" cy="150" r="23" fill="#7a4a8c" fill-opacity=".12"/><circle cx="600" cy="150" r="17" fill="#fff" stroke="#7a4a8c" stroke-width="3" stroke-dasharray="4 4"/><text x="630" y="157" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#7a4a8c" text-anchor="start">Old → new information</text><rect x="584" y="200" width="352" height="62" rx="12" fill="#fff" stroke="#14293a" stroke-opacity=".1"/><text x="598" y="226" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="start">… globalisation creates a blend of</text><rect x="594" y="234" width=