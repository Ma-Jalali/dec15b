ill="#e1e8f6"/><text x="596" y="196" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" fill="#14293a" text-anchor="start">Argumentation = your position +</text><text x="596" y="216" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600" fill="#14293a" text-anchor="start">reasons + evidence + the other side.</text><path class="w5d3pp-ty" d="M596 236h250" stroke="#14293a" stroke-opacity=".2" stroke-width="5" stroke-linecap="round"/><path class="w5d3pp-ty w5d3pp-y2" d="M596 252h200" stroke="#14293a" stroke-opacity=".2" stroke-width="5" stroke-linecap="round"/><path class="w5d3pp-ty w5d3pp-y3" d="M596 268h120" stroke="#14293a" stroke-opacity=".2" stroke-width="5" stroke-linecap="round"/><rect x="580" y="290" width="360" height="24" rx="12" fill="#f0f3fa"/><rect class="w5d3pp-cu" x="592" y="296" width="2" height="12" fill="#14293a"/><path class="w5d3pp-dr" d="M760 326C760 350 430 350 340 336" stroke="#c4562f" stroke-width="3" stroke-linecap="round"/><path d="M352 328l-12 8 13 6" stroke="#c4562f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="370" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#c4562f" text-anchor="middle">Ask follow-up questions (iterative process)</text><path class="w5d3pp-tw w5d3pp-t2" d="M960 44Q961.08 48.92 966 50Q961.08 51.08 960 56Q958.92 51.08 954 50Q958.92 48.92 960 44z" fill="#e3a843"/><path class="w5d3pp-tw w5d3pp-t3" d="M480 95Q480.9 99.1 485 100Q480.9 100.9 480 105Q479.1 100.9 475 100Q479.1 99.1 480 95z" fill="#6f8fd6"/>
