<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" fill="none" role="img" aria-label="Four parts of a prompt join like puzzle pieces: Role (act as…), Task (what you want), Requirements (conditions and what the output should look like), Instructions (how to do it: steps and examples). With the rubric they go into the AI tool, which explains the rubric. An arrow loops back: ask follow-up questions.">
<title>Four parts of a prompt join like puzzle pieces: Role (act as…), Task (what you want), Requirements (conditions and what the output should look like), Instructions (how to do it: steps and examples). With the rubric they go into the AI tool, which explains the rubric. An arrow loops back: ask follow-up questions.</title>
