<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="The Seminar in four parts, about 40 minutes. Part 1: Group 3 presents for 10–12 minutes; the class listens and thinks of feedback. Part 2: the class discusses two questions for 10 minutes; each presenter sits with one group and only listens. Part 3: presenters summarise each group’s discussion in 1–2 minutes. Part 4: Group 3 gets feedback from the teacher; the class discusses and prepares peer feedback.">
