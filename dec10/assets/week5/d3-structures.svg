@keyframes w5d3st-dr { to { stroke-dashoffset: -32; } }
.w5d3st-dw { stroke-dasharray: 400; animation: w5d3st-dw 6s ease-in-out infinite; }
@keyframes w5d3st-dw { 0%, 10% { stroke-dashoffset: 400; } 45%, 100% { stroke-dashoffset: 0; } }
.w5d3st-cu { animation: w5d3st-cu 1.1s steps(2) infinite; }
@keyframes w5d3st-cu { 50% { opacity: 0; } }
.w5d3st-sp { animation: w5d3st-sp 14s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes w5d3st-sp { to { transform: rotate(360deg); } }
.w5d3st-ty { animation: w5d3st-ty 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 50%; } .w5d3st-y2 { animation-delay: -1.6s; } .w5d3st-y3 { animation-delay: -3.2s; }
@keyframes w5d3st-ty { 0%, 8% { transform: scaleX(0); } 45%, 100% { transform: scaleX(1); } }
.w5d3st-pop { animation: w5d3st-pop 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .w5d3st-o2 { animation-delay: -1.3s; } .w5d3st-o3 { animation-delay: -2.6s; }
@keyframes w5d3st-pop { 0%, 40% { transform: scale(.85); opacity: .6; } 55% { transform: scale(1.1); opacity: 1; } 70%, 100% { transform: scale(1); opacity: 1; } }
.w5d3st-sw { animation: w5d3st-sw 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
@keyframes w5d3st-sw { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
