ion</text></g><path d="M304 121L374.0 121.0" stroke="#7a4a8c" stroke-width="3" stroke-linecap="round" stroke-opacity="1"/><path d="M365.9 124.9L374.0 121.0L365.9 117.1" stroke="#7a4a8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="1"/><path d="M624 121L694.0 121.0" stroke="#7a4a8c" stroke-width="3" stroke-linecap="round" stroke-opacity="1"/><path d="M685.9 124.9L694.0 121.0L685.9 117.1" stroke="#7a4a8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="1"/><rect x="300" y="90" width="78" height="22" rx="11" fill="#c4562f"/><text x="339" y="106" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">SO</text><text x="339" y="152" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" fill="#14293a" text-anchor="middle">(“Consequently”)</text><rect x="620" y="90" width="78" height="22" rx="11" fill="#c4562f"/><text x="659" y="106" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">SO</text><text x="659" y="152" font-family="Manrope, Arial, sans-serif" font-size="12" font-weight="600" fill="#14293a" text-anchor="middle">(“thus”)</text><g filter="url(#w5d3tm-sh2)"><rect x="60" y="240" width="280" height="58" rx="14" fill="url(#w5d3tm-paper)"/></g><rect x="60" y="240" width="280" height="58" rx="14" stroke="#14293a" stroke-opacity=".08"/><rect x="74" y="256" width="46" height="26" rx="13" fill="#c4562f"/><text x="97.0" y="274" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">SO</text><text x="132" y="275" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="650" fill="#14293a" text-anchor="start">= a result</text><g filter="url(#w5d3tm-sh2)"><rect x="360" y="240" width="280" height="58" rx="14" fill="url(#w5d3tm-paper)"/></g><rect x="360" y="240" width="280" height="58" rx="14" stroke="#14293a" stroke-opacity=".08"/><rect x="374" y="256" width="57" height="26" rx="13" fill="#3a58a0"/><text x="402.5" y="274" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">BUT</text><text x="443" y="275" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="650" fill="#14293a" text-anchor="start">= contrast / refutation</text><g filter="url(#w5d3tm-sh2)"><rect x="660" y="240" width="280" height="58" rx="14" fill="url(#w5d3tm-paper)"/></g><rect x="660" y="240" width="280" height="58" rx="14" stroke="#14293a" stroke-opacity=".08"/><rect x="674" y="256" width="101" height="26" rx="13" fill="#2b776e"/><text x="724.5" y="274" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">BECAUSE</text><text x="787" y="275" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="650" fill="#14293a" text-anchor="start">= a reason</text><g filter="url(#w5d3tm-sh2)"><rect x="60" y="316" width="280" height="58" rx="14" fill="url(#w5d3tm-paper)"/></g><rect x="60" y="316" width="280" height="58" rx="14" stroke="#14293a" stroke-opacity=".08"/><rect x="74" y="332" width="57" height="26" rx="13" fill="#b07d12"/><text x="102.5" y="350" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">AND</text><text x="143" y="351" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="650" fill="#14293a" text-anchor="start">= one more point</text><g filter="url(#w5d3tm-sh2)"><rect x="360" y="316" width="280" height="58" rx="14" fill="url(#w5d3tm-paper)"/></g><rect x="360" y="316" width="280" height="58" rx="14" stroke="#14293a" stroke-opacity=".08"/><rect x="374" y="332" width="101" height="26" rx="13" fill="#8a4f9e"/><text x="424.5" y="350" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">EXAMPLE</text><text x="487" y="351" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="650" fill="#14293a" text-anchor="start">= a real case</text><g filter="url(#w5d3tm-sh2)"><rect x="660" y="316" width="280" height="58" rx="14" fill="url(#w5d3tm-paper)"/></g><rect x="660" y="316" width="280" height="58" rx="14" stroke="#14293a" stroke-opacity=".08"/><rect x="674" y="332" width="145" height="26" rx="13" fill="#2f6f9a"/><text x="746.5" y="350" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">EXPLANATION</text><text x="831" y="351" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="650" fill="#14293a" text-anchor="start">= evidence</text><path class="w5d3tm-tw w5d3tm-t2" d="M950 54Q951.08 58.92 956 60Q951.08 61.08 950 66Q948.92 61.08 944 60Q948.92 58.92 950 54z" fill="#e3a843"/><path class="w5d3tm-tw w5d3tm-t3" d="M44 205Q44.9 209.1 49 210Q44.9 210.9 44 215Q43.1 210.9 39 210Q43.1 209.1 44 205z" fill="#a77bb8"/>
