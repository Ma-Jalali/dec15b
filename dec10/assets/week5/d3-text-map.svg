<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="How to read a text map: each box is one idea from the essay. The words between the boxes show how the ideas connect: SO (a result), BUT (a contrast or refutation), BECAUSE (a reason), AND (one more point), EXAMPLE and EXPLANATION (evidence). The words in brackets are the writer’s real phrases.">
<title>How to read a text map: each box is one idea from the essay. The words between the boxes show how the ideas connect: SO (a result), BUT (a contrast or refutation), BECAUSE (a reason), AND (one more point), EXAMPLE and EXPLANATION (evidence). The words in brackets are the writer’s real phrases.</title>
<style>
.w5d3tm-fl { animation: w5d3tm-fl 6s ease-in-out infinite; } .w5d3tm-f2 { animation-delay: -2s; } .w5d3tm-f3 { animation-delay: -4s; }
@keyframes w5d3tm-fl { 50% { transform: translateY(-4px); } }
.w5d3tm-tw { animation: w5d3tm-tw 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .w5d3tm-t2 { animation-delay: -1.1s; } .w5d3tm-t3 { animation-delay: -2.2s; }
@keyframes w5d3tm-tw { 0%, 100% { opacity: .35; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
.w5d3tm-bl { animation: w5d3tm-bl 4.6s infinite; transform-box: fill-box; transform-origin: center; } .w5d3tm-b2 { animation-delay: -1.7s; } .w5d3tm-b3 { animation-delay: -3.1s; }
@keyframes w5d3tm-bl { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.w5d3tm-pu { animation: w5d3tm-pu 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .w5d3tm-p2 { animation-delay: -1s; } .w5d3tm-p3 { animation-delay: -2s; }
