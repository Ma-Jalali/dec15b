<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" fill="none" role="img" aria-label="A body paragraph as five layers: topic sentence (main point that links to the question), explanation and evidence (with citations), example, refutation or consequence (BUT or SO), and concluding sentence (links back to the topic sentence).">
<title>Body paragraph structure</title>
<style>
.w54dbodypa-tw{animation:w54dbodypa-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dbodypa-t2{animation-delay:-1s}.w54dbodypa-t3{animation-delay:-2s}
.w54dbodypa-fl{animation:w54dbodypa-fl 6s ease-in-out infinite}.w54dbodypa-f2{animation-delay:-2s}.w54dbodypa-f3{animation-delay:-4s}
.w54dbodypa-bl{animation:w54dbodypa-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54dbodypa-b2{animation-delay:-1.7s}.w54dbodypa-b3{animation-delay:-3.2s}.w54dbodypa-b4{animation-delay:-2.4s}
.w54dbodypa-pu{animation:w54dbodypa-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dbodypa-p2{animation-delay:-.9s}.w54dbodypa-p3{animation-delay:-1.7s}
.w54dbodypa-dr{stroke-dasharray:6 7;animation:w54dbodypa-dr 1.8s linear infinite}
.w54dbodypa-sp{animation:w54dbodypa-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54dbodypa-sw{animation:w54dbodypa-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54dbodypa-tk{animation:w54dbodypa-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54dbodypa-wv{animation:w54dbodypa-wv 2.4s ease-in-out infinite}.w54dbodypa-w2{animation-delay:-.8s}.w54dbodypa-w3{animation-delay:-1.6s}
.w54dbodypa-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54dbodypa-dw 6s ease-in-out infinite}
@keyframes w54dbodypa-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54dbodypa-fl{50%{transform:translateY(-4px)}}
@keyframes w54dbodypa-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54dbodypa-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54dbodypa-dr{to{stroke-dashoffset:-26}}
@keyframes w54dbodypa-sp{to{transform:rotate(360deg)}}
@keyframes w54dbodypa-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54dbodypa-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54dbodypa-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54dbodypa-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="w54dbodypa-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4eef9"/><stop offset="1" stop-color="#e4d8ef"/></linearGradient>
<pattern id="w54dbodypa-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r=".8" fill="#7a4a8c" fill-opacity=".14"/></pattern>
<radialGradient id="w54dbodypa-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w54dbodypa-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w54dbodypa-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w54dbodypa-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w54dbodypa-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93619f"/><stop offset="1" stop-color="#7a4a8c"/></linearGradient>
<linearGradient id="w54dbodypa-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient>
<linearGradient id="w54dbodypa-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w54dbodypa-clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c94a2c"/></linearGradient>
<marker id="w54dbodypa-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14293a"/></marker>
<marker id="w54dbodypa-arm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a4a8c"/></marker>
</defs>
<rect width="1000" height="480" rx="24" fill="#f4eef9"/><rect width="1000" height="480" rx="24" fill="url(#w54dbodypa-dots)"/><text x="40" y="50" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#7a4a8c">A body paragraph: each sentence has a job</text><g class="w54dbodypa-fl w54dbodypa-f1"><rect x="60" y="80" width="860" height="62" rx="18" fill="#e64626" filter="url(#w54dbodypa-sh)"/><circle cx="100" cy="111" r="22" fill="#fff"/><text x="100" y="118" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#e64626" text-anchor="middle">S1</text><text x="140" y="106" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">Topic sentence</text><text x="140" y="130" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#fff">the main point — links back to the question</text></g><g class="w54dbodypa-fl w54dbodypa-f2"><rect x="74" y="156" width="860" height="62" rx="18" fill="#2f6db5" filter="url(#w54dbodypa-sh)"/><circle cx="114" cy="187" r="22" fill="#fff"/><text x="114" y="194" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#2f6db5" text-anchor="middle">S2</text><text x="154" y="182" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">Explanation (Evidence)</text><text x="154" y="206" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#fff">with a citation: According to … / … describe …</text></g><g class="w54dbodypa-fl w54dbodypa-f3"><rect x="60" y="232" width="860" height="62" rx="18" fill="#e3a843" filter="url(#w54dbodypa-sh)"/><circle cx="100" cy="263" r="22" fill="#fff"/><text x="100" y="270" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#e3a843" text-anchor="middle">S3</text><text x="140" y="258" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">Example</text><text x="140" y="282" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#fff">One example of this is … / For instance, …</text></g><g class="w54dbodypa-fl w54dbodypa-f1"><rect x="74" y="308" width="860" height="62" rx="18" fill="#13887a" filter="url(#w54dbodypa-sh)"/><circle cx="114" cy="339" r="22" fill="#fff"/><text x="114" y="346" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#13887a" text-anchor="middle">S4</text><text x="154" y="334" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">BUT / SO</text><text x="154" y="358" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#fff">refutation (However, …) or consequence (Consequently, …)</text></g><g class="w54dbodypa-fl w54dbodypa-f2"><rect x="60" y="384" width="860" height="62" rx="18" fill="#7a4a8c" filter="url(#w54dbodypa-sh)"/><circle cx="100" cy="415" r="22" fill="#fff"/><text x="100" y="422" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#7a4a8c" text-anchor="middle">S5</text><text x="140" y="410" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">Concluding sentence</text><text x="140" y="434" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#fff">links back to the topic sentence (Ultimately, … / Clearly, …)</text></g>
</svg>
