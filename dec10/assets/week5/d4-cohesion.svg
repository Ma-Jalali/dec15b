<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="Four cohesive devices as chain links: linking words connect clauses and sentences; lexical chains repeat related words; summary phrases sum up what was said; referents such as this, which and they point back to earlier ideas.">
<title>Four cohesive devices</title>
<style>
.w54dcohesi-tw{animation:w54dcohesi-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dcohesi-t2{animation-delay:-1s}.w54dcohesi-t3{animation-delay:-2s}
.w54dcohesi-fl{animation:w54dcohesi-fl 6s ease-in-out infinite}.w54dcohesi-f2{animation-delay:-2s}.w54dcohesi-f3{animation-delay:-4s}
.w54dcohesi-bl{animation:w54dcohesi-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54dcohesi-b2{animation-delay:-1.7s}.w54dcohesi-b3{animation-delay:-3.2s}.w54dcohesi-b4{animation-delay:-2.4s}
.w54dcohesi-pu{animation:w54dcohesi-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dcohesi-p2{animation-delay:-.9s}.w54dcohesi-p3{animation-delay:-1.7s}
.w54dcohesi-dr{stroke-dasharray:6 7;animation:w54dcohesi-dr 1.8s linear infinite}
.w54dcohesi-sp{animation:w54dcohesi-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54dcohesi-sw{animation:w54dcohesi-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54dcohesi-tk{animation:w54dcohesi-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54dcohesi-wv{animation:w54dcohesi-wv 2.4s ease-in-out infinite}.w54dcohesi-w2{animation-delay:-.8s}.w54dcohesi-w3{animation-delay:-1.6s}
.w54dcohesi-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54dcohesi-dw 6s ease-in-out infinite}
@keyframes w54dcohesi-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54dcohesi-fl{50%{transform:translateY(-4px)}}
@keyframes w54dcohesi-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54dcohesi-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54dcohesi-dr{to{stroke-dashoffset:-26}}
@keyframes w54dcohesi-sp{to{transform:rotate(360deg)}}
@keyframes w54dcohesi-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54dcohesi-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54dcohesi-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54dcohesi-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="w54dcohesi-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4eef9"/><stop offset="1" stop-color="#e4d8ef"/></linearGradient>
<pattern id="w54dcohesi-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r=".8" fill="#7a4a8c" fill-opacity=".14"/></pattern>
<radialGradient id="w54dcohesi-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w54dcohesi-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w54dcohesi-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w54dcohesi-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w54dcohesi-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93619f"/><stop offset="1" stop-color="#7a4a8c"/></linearGradient>
<linearGradient id="w54dcohesi-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient>
<linearGradient id="w54dcohesi-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w54dcohesi-clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c94a2c"/></linearGradient>
<marker id="w54dcohesi-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14293a"/></marker>
<marker id="w54dcohesi-arm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a4a8c"/></marker>
</defs>
<rect width="1000" height="460" rx="24" fill="#f4eef9"/><rect width="1000" height="460" rx="24" fill="url(#w54dcohesi-dots)"/><text x="40" y="50" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#7a4a8c">Cohesion: old information → new information</text><rect x="40" y="120" width="212" height="300" rx="18" fill="#fff" stroke="#2f6db5" stroke-width="3" filter="url(#w54dcohesi-sh)"/><rect x="40" y="120" width="212" height="56" rx="16" fill="#2f6db5"/><text x="146" y="156" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">Linking words</text><text x="146" y="212" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">connect clauses and</text><text x="146" y="233.12" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">sentences</text><text x="146" y="320" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#2f6db5" text-anchor="middle" font-style="italic">“As a result”, “for</text><text x="146" y="339.8" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#2f6db5" text-anchor="middle" font-style="italic">instance”</text><g transform="translate(264 270)"><rect x="-16" y="-11" width="22" height="22" rx="11" stroke="#7a4a8c" stroke-width="5" fill="none"/><rect x="-6" y="-11" width="22" height="22" rx="11" stroke="#93619f" stroke-width="5" fill="none"/></g><rect x="276" y="120" width="212" height="300" rx="18" fill="#fff" stroke="#13887a" stroke-width="3" filter="url(#w54dcohesi-sh)"/><rect x="276" y="120" width="212" height="56" rx="16" fill="#13887a"/><text x="382" y="156" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">Lexical chains</text><text x="382" y="212" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">repeat related words</text><text x="382" y="233.12" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">and synonyms</text><text x="382" y="320" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#13887a" text-anchor="middle" font-style="italic">culture → cultural</text><text x="382" y="339.8" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#13887a" text-anchor="middle" font-style="italic">identities → cultural</text><text x="382" y="359.6" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#13887a" text-anchor="middle" font-style="italic">hybridisation</text><g transform="translate(500 270)"><rect x="-16" y="-11" width="22" height="22" rx="11" stroke="#7a4a8c" stroke-width="5" fill="none"/><rect x="-6" y="-11" width="22" height="22" rx="11" stroke="#93619f" stroke-width="5" fill="none"/></g><rect x="512" y="120" width="212" height="300" rx="18" fill="#fff" stroke="#e3a843" stroke-width="3" filter="url(#w54dcohesi-sh)"/><rect x="512" y="120" width="212" height="56" rx="16" fill="#e3a843"/><text x="618" y="156" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">Summary phrases</text><text x="618" y="212" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">a noun phrase that</text><text x="618" y="233.12" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">sums up (often with</text><text x="618" y="254.24" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">this / these)</text><text x="618" y="320" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#e3a843" text-anchor="middle" font-style="italic">“This flexibility of</text><text x="618" y="339.8" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#e3a843" text-anchor="middle" font-style="italic">cultural hybridity …”</text><g transform="translate(736 270)"><rect x="-16" y="-11" width="22" height="22" rx="11" stroke="#7a4a8c" stroke-width="5" fill="none"/><rect x="-6" y="-11" width="22" height="22" rx="11" stroke="#93619f" stroke-width="5" fill="none"/></g><rect x="748" y="120" width="212" height="300" rx="18" fill="#fff" stroke="#e64626" stroke-width="3" filter="url(#w54dcohesi-sh)"/><rect x="748" y="120" width="212" height="56" rx="16" fill="#e64626"/><text x="854" y="156" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">Referents</text><text x="854" y="212" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">point back: this,</text><text x="854" y="233.12" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">these, that, which,</text><text x="854" y="254.24" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle">who, it, they</text><text x="854" y="320" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#e64626" text-anchor="middle" font-style="italic">“… Sankuanz, which</text><text x="854" y="339.8" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#e64626" text-anchor="middle" font-style="italic">blends …”</text>
</svg>
