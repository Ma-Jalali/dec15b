<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="A balance scale. The counterargument (On the other hand, many argue that …) rises because it is lighter. The refutation (However, …) with evidence weights sinks, so the writer’s main argument wins. A label says that “Even if …” softens the counterargument.">
<title>Counterargument and refutation</title>
<style>
.w54dcounte-tw{animation:w54dcounte-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dcounte-t2{animation-delay:-1s}.w54dcounte-t3{animation-delay:-2s}
.w54dcounte-fl{animation:w54dcounte-fl 6s ease-in-out infinite}.w54dcounte-f2{animation-delay:-2s}.w54dcounte-f3{animation-delay:-4s}
.w54dcounte-bl{animation:w54dcounte-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54dcounte-b2{animation-delay:-1.7s}.w54dcounte-b3{animation-delay:-3.2s}.w54dcounte-b4{animation-delay:-2.4s}
.w54dcounte-pu{animation:w54dcounte-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dcounte-p2{animation-delay:-.9s}.w54dcounte-p3{animation-delay:-1.7s}
.w54dcounte-dr{stroke-dasharray:6 7;animation:w54dcounte-dr 1.8s linear infinite}
.w54dcounte-sp{animation:w54dcounte-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54dcounte-sw{animation:w54dcounte-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54dcounte-tk{animation:w54dcounte-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54dcounte-wv{animation:w54dcounte-wv 2.4s ease-in-out infinite}.w54dcounte-w2{animation-delay:-.8s}.w54dcounte-w3{animation-delay:-1.6s}
.w54dcounte-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54dcounte-dw 6s ease-in-out infinite}
@keyframes w54dcounte-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54dcounte-fl{50%{transform:translateY(-4px)}}
@keyframes w54dcounte-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54dcounte-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54dcounte-dr{to{stroke-dashoffset:-26}}
@keyframes w54dcounte-sp{to{transform:rotate(360deg)}}
@keyframes w54dcounte-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54dcounte-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54dcounte-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54dcounte-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="w54dcounte-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4eef9"/><stop offset="1" stop-color="#e4d8ef"/></linearGradient>
<pattern id="w54dcounte-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r=".8" fill="#7a4a8c" fill-opacity=".14"/></pattern>
<radialGradient id="w54dcounte-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w54dcounte-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w54dcounte-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w54dcounte-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w54dcounte-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93619f"/><stop offset="1" stop-color="#7a4a8c"/></linearGradient>
<linearGradient id="w54dcounte-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient>
<linearGradient id="w54dcounte-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w54dcounte-clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c94a2c"/></linearGradient>
<marker id="w54dcounte-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14293a"/></marker>
<marker id="w54dcounte-arm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a4a8c"/></marker>
</defs>
<rect width="1000" height="460" rx="24" fill="#f4eef9"/><rect width="1000" height="460" rx="24" fill="url(#w54dcounte-dots)"/><ellipse cx="500" cy="430" rx="200" ry="10" fill="#14293a" opacity="0.12" filter="url(#w54dcounte-blur)"/><path d="M484 420h32l-6-310h-20z" fill="url(#w54dcounte-navy)"/><rect x="420" y="414" width="160" height="18" rx="9" fill="#14293a"/><g transform="rotate(10 500 112)"><path d="M180 112h640" stroke="#14293a" stroke-width="10" stroke-linecap="round"/><path d="M220 112l-60 110M220 112l60 110M780 112l-60 110M780 112l60 110" stroke="#14293a" stroke-opacity=".45" stroke-width="2.5"/><path d="M140 222h160a80 26 0 0 1-160 0z" fill="#e3a843"/><path d="M700 222h160a80 26 0 0 1-160 0z" fill="#7a4a8c"/><g transform="rotate(-10 220 180)"><rect x="130" y="150" width="180" height="64" rx="12" fill="#fff" stroke="#e3a843" stroke-width="3" filter="url(#w54dcounte-sh)"/><text x="220" y="177" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#b07d12" text-anchor="middle">Counterargument</text><text x="220" y="200" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle" font-style="italic">“many argue that …”</text></g><g transform="rotate(-10 780 180)"><rect x="712" y="196" width="136" height="20" rx="4" fill="#e64626"/><rect x="718" y="174" width="124" height="20" rx="4" fill="#2f6db5"/><rect x="724" y="152" width="112" height="20" rx="4" fill="#13887a"/><text x="780" y="132" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#7a4a8c" text-anchor="middle">Refutation + evidence</text></g></g><circle cx="500" cy="112" r="12" fill="#e3a843" stroke="#fff" stroke-width="3"/><g class="w54dcounte-fl"><g class=""><g filter="url(#w54dcounte-sh)"><rect x="600" y="330" width="300" height="80" rx="13" fill="#fff"/><path d="M602 366L590 379.6L602 386z" fill="#fff"/></g></g><text x="750" y="362" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#7a4a8c" text-anchor="middle">“However, …”</text><text x="750" y="390" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">shows why your side is stronger</text></g><g class="w54dcounte-fl w54dcounte-f2"><g class=""><g filter="url(#w54dcounte-sh)"><rect x="60" y="330" width="320" height="80" rx="13" fill="#fff"/><path d="M378 366L390 379.6L378 386z" fill="#fff"/></g></g><text x="220" y="362" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#b07d12" text-anchor="middle">“Even if …, …”</text><text x="220" y="390" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">admits the other side but softens it</text></g><text x="40" y="50" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#7a4a8c">Show the other side — then win</text>
</svg>
