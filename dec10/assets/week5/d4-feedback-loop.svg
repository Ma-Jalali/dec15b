<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" fill="none" role="img" aria-label="A loop of four steps: 1 review the feedback from your teacher and from AI; 2 choose the areas to improve; 3 revise your essay; 4 ask AI for feedback on the criterion you wanted to improve. An arrow goes back to step 1.">
<title>The feedback loop</title>
<style>
.w54dfeedba-tw{animation:w54dfeedba-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dfeedba-t2{animation-delay:-1s}.w54dfeedba-t3{animation-delay:-2s}
.w54dfeedba-fl{animation:w54dfeedba-fl 6s ease-in-out infinite}.w54dfeedba-f2{animation-delay:-2s}.w54dfeedba-f3{animation-delay:-4s}
.w54dfeedba-bl{animation:w54dfeedba-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54dfeedba-b2{animation-delay:-1.7s}.w54dfeedba-b3{animation-delay:-3.2s}.w54dfeedba-b4{animation-delay:-2.4s}
.w54dfeedba-pu{animation:w54dfeedba-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dfeedba-p2{animation-delay:-.9s}.w54dfeedba-p3{animation-delay:-1.7s}
.w54dfeedba-dr{stroke-dasharray:6 7;animation:w54dfeedba-dr 1.8s linear infinite}
.w54dfeedba-sp{animation:w54dfeedba-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54dfeedba-sw{animation:w54dfeedba-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54dfeedba-tk{animation:w54dfeedba-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54dfeedba-wv{animation:w54dfeedba-wv 2.4s ease-in-out infinite}.w54dfeedba-w2{animation-delay:-.8s}.w54dfeedba-w3{animation-delay:-1.6s}
.w54dfeedba-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54dfeedba-dw 6s ease-in-out infinite}
@keyframes w54dfeedba-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54dfeedba-fl{50%{transform:translateY(-4px)}}
@keyframes w54dfeedba-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54dfeedba-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54dfeedba-dr{to{stroke-dashoffset:-26}}
@keyframes w54dfeedba-sp{to{transform:rotate(360deg)}}
@keyframes w54dfeedba-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54dfeedba-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54dfeedba-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54dfeedba-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="w54dfeedba-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf2fb"/><stop offset="1" stop-color="#d9e4f5"/></linearGradient>
<pattern id="w54dfeedba-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r=".8" fill="#3a58a0" fill-opacity=".14"/></pattern>
<radialGradient id="w54dfeedba-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w54dfeedba-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w54dfeedba-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w54dfeedba-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w54dfeedba-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6db5"/><stop offset="1" stop-color="#3a58a0"/></linearGradient>
<linearGradient id="w54dfeedba-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient>
<linearGradient id="w54dfeedba-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w54dfeedba-clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c94a2c"/></linearGradient>
<marker id="w54dfeedba-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14293a"/></marker>
<marker id="w54dfeedba-arm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a58a0"/></marker>
</defs>
<rect width="1000" height="440" rx="24" fill="#edf2fb"/><rect width="1000" height="440" rx="24" fill="url(#w54dfeedba-dots)"/><ellipse cx="500" cy="220" rx="320" ry="144" stroke="#3a58a0" stroke-opacity=".3" stroke-width="3" fill="none" stroke-dasharray="8 10" class="w54dfeedba-dr"/><path d="M650 92Q740 100 760 160" stroke="#13887a" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#w54dfeedba-ar)"/><path d="M760 290Q750 350 650 350" stroke="#e3a843" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#w54dfeedba-ar)"/><path d="M350 350Q250 350 240 290" stroke="#7a4a8c" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#w54dfeedba-ar)"/><path d="M240 150Q250 92 350 92" stroke="#2f6db5" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#w54dfeedba-ar)"/><g class="w54dfeedba-pu"><g transform="translate(500 196) scale(1.1)"><path d="M-26 64C-26 39-16 25 0 25C16 25 26 39 26 64z" fill="#2f6db5"/><path d="M6 25.6C18 27.5 26 40 26 64H13C14 46 12 34 6 25.6z" fill="#14293a" opacity=".13"/><path d="M-15 31C-19 36-21 44-21 52" stroke="#fff" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/><rect x="-5" y="9" width="10" height="17" rx="4" fill="#a9714a"/><path d="M-6.5 25L0 31.5L6.5 25z" fill="#a9714a"/><circle cx="-14.6" cy="2.5" r="3.3" fill="#a9714a"/><circle cx="14.6" cy="2.5" r="3.3" fill="#a9714a"/><circle r="15" fill="#c68a5e"/><path d="M-15.5 0C-16.5-12-8-18.5 1-18.5C10.5-18.5 16.5-12 15.5-1C12.5-6 9-9 3-10C-2-7-9-7-15.5 0z" fill="#20150e"/><g class="w54dfeedba-bl "><ellipse cx="-5.2" cy="2.6" rx="1.75" ry="2.1" fill="#14293a"/><ellipse cx="5.2" cy="2.6" rx="1.75" ry="2.1" fill="#14293a"/><circle cx="-4.6" cy="1.9" r=".55" fill="#fff"/><circle cx="5.8" cy="1.9" r=".55" fill="#fff"/></g><path d="M-7.6-2.8q2.4-1.6 4.8 0M2.8-2.8q2.4-1.6 4.8 0" stroke="#20150e" stroke-width="1.3" stroke-linecap="round" fill="none"/><circle cx="-9" cy="7.4" r="2.6" fill="#e8806b" opacity=".3"/><circle cx="9" cy="7.4" r="2.6" fill="#e8806b" opacity=".3"/><path d="M-3.6 7.6q3.6 6.2 7.2 0z" fill="#14293a"/><path d="M-1.6 10.6q1.6-1.4 3.2 0" fill="#e8806b"/></g></g><rect x="370" y="36" width="260" height="80" rx="18" fill="#fff" stroke="#13887a" stroke-width="3" filter="url(#w54dfeedba-sh)"/><text x="500" y="72" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#13887a" text-anchor="middle">1 Review</text><text x="500" y="98" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">teacher + AI feedback</text><rect x="690" y="180" width="260" height="80" rx="18" fill="#fff" stroke="#e3a843" stroke-width="3" filter="url(#w54dfeedba-sh)"/><text x="820" y="216" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#e3a843" text-anchor="middle">2 Choose</text><text x="820" y="242" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">the areas to improve</text><rect x="370" y="324" width="260" height="80" rx="18" fill="#fff" stroke="#7a4a8c" stroke-width="3" filter="url(#w54dfeedba-sh)"/><text x="500" y="360" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#7a4a8c" text-anchor="middle">3 Revise</text><text x="500" y="386" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">your essay</text><rect x="50" y="180" width="260" height="80" rx="18" fill="#fff" stroke="#2f6db5" stroke-width="3" filter="url(#w54dfeedba-sh)"/><text x="180" y="216" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="800" fill="#2f6db5" text-anchor="middle">4 Ask AI again</text><text x="180" y="242" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a" text-anchor="middle">on that criterion</text>
</svg>
