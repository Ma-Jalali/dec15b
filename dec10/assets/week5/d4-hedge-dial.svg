<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="A dial from Exaggerated to Cautious. Exaggerated words: always, all, every, definitely, completely, causes. Cautious words: can, some, many, for many, probably, contributes to, is more susceptible to. The needle points to cautious.">
<title>Hedging: from exaggerated to cautious</title>
<style>
.w54dhedged-tw{animation:w54dhedged-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dhedged-t2{animation-delay:-1s}.w54dhedged-t3{animation-delay:-2s}
.w54dhedged-fl{animation:w54dhedged-fl 6s ease-in-out infinite}.w54dhedged-f2{animation-delay:-2s}.w54dhedged-f3{animation-delay:-4s}
.w54dhedged-bl{animation:w54dhedged-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54dhedged-b2{animation-delay:-1.7s}.w54dhedged-b3{animation-delay:-3.2s}.w54dhedged-b4{animation-delay:-2.4s}
.w54dhedged-pu{animation:w54dhedged-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dhedged-p2{animation-delay:-.9s}.w54dhedged-p3{animation-delay:-1.7s}
.w54dhedged-dr{stroke-dasharray:6 7;animation:w54dhedged-dr 1.8s linear infinite}
.w54dhedged-sp{animation:w54dhedged-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54dhedged-sw{animation:w54dhedged-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54dhedged-tk{animation:w54dhedged-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54dhedged-wv{animation:w54dhedged-wv 2.4s ease-in-out infinite}.w54dhedged-w2{animation-delay:-.8s}.w54dhedged-w3{animation-delay:-1.6s}
.w54dhedged-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54dhedged-dw 6s ease-in-out infinite}
@keyframes w54dhedged-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54dhedged-fl{50%{transform:translateY(-4px)}}
@keyframes w54dhedged-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54dhedged-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54dhedged-dr{to{stroke-dashoffset:-26}}
@keyframes w54dhedged-sp{to{transform:rotate(360deg)}}
@keyframes w54dhedged-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54dhedged-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54dhedged-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54dhedged-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="w54dhedged-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4eef9"/><stop offset="1" stop-color="#e4d8ef"/></linearGradient>
<pattern id="w54dhedged-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r=".8" fill="#7a4a8c" fill-opacity=".14"/></pattern>
<radialGradient id="w54dhedged-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w54dhedged-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w54dhedged-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w54dhedged-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w54dhedged-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93619f"/><stop offset="1" stop-color="#7a4a8c"/></linearGradient>
<linearGradient id="w54dhedged-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient>
<linearGradient id="w54dhedged-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w54dhedged-clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c94a2c"/></linearGradient>
<marker id="w54dhedged-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14293a"/></marker>
<marker id="w54dhedged-arm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a4a8c"/></marker>
</defs>
<rect width="1000" height="460" rx="24" fill="#f4eef9"/><rect width="1000" height="460" rx="24" fill="url(#w54dhedged-dots)"/><path d="M260 380A240 240 0 0 1 740 380" stroke="#e6dcef" stroke-width="44" fill="none"/><path d="M260 380A240 240 0 0 1 430 150" stroke="#2f7d6b" stroke-width="44" fill="none"/><path d="M570 150A240 240 0 0 1 740 380" stroke="#e64626" stroke-width="44" fill="none"/><text x="300" y="430" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#2f7d6b" text-anchor="middle">CAUTIOUS</text><text x="700" y="430" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#e64626" text-anchor="middle">EXAGGERATED</text><g class="w54dhedged-sw" style="transform-origin:500px 380px;transform-box:view-box"><g transform="rotate(-45 500 380)"><path d="M500 380V190" stroke="#14293a" stroke-width="12" stroke-linecap="round"/></g></g><circle cx="500" cy="380" r="24" fill="#14293a"/><circle cx="500" cy="380" r="9" fill="#e3a843"/><g><rect x="104.5" y="40" width="51.0" height="25" rx="12.5" fill="#2f7d6b"/><text x="130" y="57.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">can</text></g><g><rect x="100" y="84" width="60.0" height="25" rx="12.5" fill="#2f7d6b"/><text x="130" y="101.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">some</text></g><g><rect x="100" y="128" width="60.0" height="25" rx="12.5" fill="#2f7d6b"/><text x="130" y="145.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">many</text></g><g><rect x="82" y="172" width="96.0" height="25" rx="12.5" fill="#2f7d6b"/><text x="130" y="189.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">for many</text></g><g><rect x="82" y="216" width="96.0" height="25" rx="12.5" fill="#2f7d6b"/><text x="130" y="233.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">probably</text></g><g><rect x="55" y="260" width="150.0" height="25" rx="12.5" fill="#2f7d6b"/><text x="130" y="277.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">contributes to</text></g><g><rect x="19" y="304" width="222.0" height="25" rx="12.5" fill="#2f7d6b"/><text x="130" y="321.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">is more susceptible to</text></g><g><rect x="831" y="40" width="78.0" height="25" rx="12.5" fill="#e64626"/><text x="870" y="57.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">always</text></g><g><rect x="844.5" y="84" width="51.0" height="25" rx="12.5" fill="#e64626"/><text x="870" y="101.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">all</text></g><g><rect x="835.5" y="128" width="69.0" height="25" rx="12.5" fill="#e64626"/><text x="870" y="145.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">every</text></g><g><rect x="813" y="172" width="114.0" height="25" rx="12.5" fill="#e64626"/><text x="870" y="189.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">definitely</text></g><g><rect x="813" y="216" width="114.0" height="25" rx="12.5" fill="#e64626"/><text x="870" y="233.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">completely</text></g><g><rect x="831" y="260" width="78.0" height="25" rx="12.5" fill="#e64626"/><text x="870" y="277.9" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">causes</text></g><text x="500" y="60" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#7a4a8c" text-anchor="middle">Turn the dial down</text>
</svg>
