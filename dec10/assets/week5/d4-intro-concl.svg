<linearGradient id="w54dintroc-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w54dintroc-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93619f"/><stop offset="1" stop-color="#7a4a8c"/></linearGradient>
<linearGradient id="w54dintroc-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient>
<linearGradient id="w54dintroc-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w54dintroc-clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c94a2c"/></linearGradient>
<marker id="w54dintroc-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14293a"/></marker>
<marker id="w54dintroc-arm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a4a8c"/></marker>
</defs>
<rect width="1000" height="580" rx="24" fill="#f4eef9"/><rect width="1000" height="580" rx="24" fill="url(#w54dintroc-dots)"/><text x="330" y="40" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#7a4a8c" text-anchor="middle" letter-spacing="2">INTRODUCTION</text><text x="330" y="560" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#7a4a8c" text-anchor="middle" letter-spacing="2">CONCLUSION</text><path d="M30 58h600l-30 46H60z" fill="#e3a843"/><text x="330" y="87" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Background (the topic)</text><path d="M80 114h500l-30 46H110z" fill="#13887a"/><text x="330" y="143" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">More specific background (focus + issue)</text><path d="M130 170h400l-30 46H160z" fill="#e64626"/><text x="330" y="199" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Writer’s thesis / position</text><path d="M180 226h300l-30 46H210z" fill="#7a4a8c"/><text x="330" y="255" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Preview main points 1, 2, 3</text><g class="w54dintroc-wv"><circle cx="330" cy="292" r="6" fill="#e3a843"/></g><path d="M210 318h240l30 50H180z" fill="#e64626"/><text x="330" y="349" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Repeat thesis / position</text><path d="M160 380h340l30 50H130z" fill="#93619f"/><text x="330" y="411" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Summarise main points</text><path d="M60 442h540l30 50H30z" fill="#e3a843"/><text x="330" y="473" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">Future statement (recommendation, significance)</text><path d="M700 50v236M700 318v236" stroke="#7a4a8c" stroke-opacity=".3" stroke-width="2"/><text x="750" y="40" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#7a4a8c">Sample 5.1</text><circle cx="700" cy="81" r="6" fill="#7a4a8c"/><text x="716" y="86" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" font-style="italic">“In today’s modern world, …”</text><circle cx="700" cy="137" r="6" fill="#7a4a8c"/><text x="716" y="142" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" font-style="italic">“While interconnection has …”</text><circle cx="700" cy="193" r="6" fill="#7a4a8c"/><text x="716" y="198" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" font-style="italic">“This essay asserts that …”</text><circle cx="700" cy="249" r="6" fill="#7a4a8c"/><text x="716" y="254" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" font-style="italic">“This is because …”</text><circle cx="700" cy="343" r="6" fill="#7a4a8c"/><text x="716" y="348" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" font-style="italic">“In summary, this essay has argued …”</text><circle cx="700" cy="405" r="6" fill="#7a4a8c"/><text x="716" y="410" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" font-style="italic">“Despite the potential for …”</text><circle cx="700" cy="467" r="6" fill="#7a4a8c"/><text x="716" y="472" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" font-style="italic">“It is imperative that …”</text>
