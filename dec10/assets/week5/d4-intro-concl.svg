<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" fill="none" role="img" aria-label="An hourglass. Introduction: background (the topic), more specific background (the focus and issue), the writer’s thesis or position, preview of main points 1, 2 and 3. Conclusion: repeat the thesis, summarise the main points, future statement (recommendation and significance of the topic).">
<title>Introduction and conclusion structure</title>
<style>
.w54dintroc-tw{animation:w54dintroc-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dintroc-t2{animation-delay:-1s}.w54dintroc-t3{animation-delay:-2s}
.w54dintroc-fl{animation:w54dintroc-fl 6s ease-in-out infinite}.w54dintroc-f2{animation-delay:-2s}.w54dintroc-f3{animation-delay:-4s}
.w54dintroc-bl{animation:w54dintroc-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54dintroc-b2{animation-delay:-1.7s}.w54dintroc-b3{animation-delay:-3.2s}.w54dintroc-b4{animation-delay:-2.4s}
.w54dintroc-pu{animation:w54dintroc-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dintroc-p2{animation-delay:-.9s}.w54dintroc-p3{animation-delay:-1.7s}
.w54dintroc-dr{stroke-dasharray:6 7;animation:w54dintroc-dr 1.8s linear infinite}
.w54dintroc-sp{animation:w54dintroc-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54dintroc-sw{animation:w54dintroc-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54dintroc-tk{animation:w54dintroc-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54dintroc-wv{animation:w54dintroc-wv 2.4s ease-in-out infinite}.w54dintroc-w2{animation-delay:-.8s}.w54dintroc-w3{animation-delay:-1.6s}
.w54dintroc-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54dintroc-dw 6s ease-in-out infinite}
@keyframes w54dintroc-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54dintroc-fl{50%{transform:translateY(-4px)}}
@keyframes w54dintroc-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54dintroc-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54dintroc-dr{to{stroke-dashoffset:-26}}
@keyframes w54dintroc-sp{to{transform:rotate(360deg)}}
@keyframes w54dintroc-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54dintroc-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54dintroc-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54dintroc-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="w54dintroc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4eef9"/><stop offset="1" stop-color="#e4d8ef"/></linearGradient>
<pattern id="w54dintroc-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r=".8" fill="#7a4a8c" fill-opacity=".14"/></pattern>
