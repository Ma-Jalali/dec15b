<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" fill="none" role="img" aria-label="Three option cards on a round table: a, incentives for local businesses; b, social media awareness campaigns; c, media content that represents cultural diversity. Stages: evaluate each option, negotiate, move towards consensus. A note says you do not have to agree.">
<title>The negotiation task</title>
<style>
.w54dnegoti-tw{animation:w54dnegoti-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dnegoti-t2{animation-delay:-1s}.w54dnegoti-t3{animation-delay:-2s}
.w54dnegoti-fl{animation:w54dnegoti-fl 6s ease-in-out infinite}.w54dnegoti-f2{animation-delay:-2s}.w54dnegoti-f3{animation-delay:-4s}
.w54dnegoti-bl{animation:w54dnegoti-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54dnegoti-b2{animation-delay:-1.7s}.w54dnegoti-b3{animation-delay:-3.2s}.w54dnegoti-b4{animation-delay:-2.4s}
.w54dnegoti-pu{animation:w54dnegoti-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dnegoti-p2{animation-delay:-.9s}.w54dnegoti-p3{animation-delay:-1.7s}
.w54dnegoti-dr{stroke-dasharray:6 7;animation:w54dnegoti-dr 1.8s linear infinite}
.w54dnegoti-sp{animation:w54dnegoti-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54dnegoti-sw{animation:w54dnegoti-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54dnegoti-tk{animation:w54dnegoti-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54dnegoti-wv{animation:w54dnegoti-wv 2.4s ease-in-out infinite}.w54dnegoti-w2{animation-delay:-.8s}.w54dnegoti-w3{animation-delay:-1.6s}
.w54dnegoti-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54dnegoti-dw 6s ease-in-out infinite}
@keyframes w54dnegoti-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54dnegoti-fl{50%{transform:translateY(-4px)}}
@keyframes w54dnegoti-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54dnegoti-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54dnegoti-dr{to{stroke-dashoffset:-26}}
@keyframes w54dnegoti-sp{to{transform:rotate(360deg)}}
@keyframes w54dnegoti-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54dnegoti-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54dnegoti-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54dnegoti-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="w54dnegoti-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf6f3"/><stop offset="1" stop-color="#d3ebe4"/></linearGradient>
<pattern id="w54dnegoti-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r=".8" fill="#2b776e" fill-opacity=".14"/></pattern>
<radialGradient id="w54dnegoti-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w54dnegoti-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w54dnegoti-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w54dnegoti-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w54dnegoti-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13887a"/><stop offset="1" stop-color="#2b776e"/></linearGradient>
<linearGradient id="w54dnegoti-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient>
<linearGradient id="w54dnegoti-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w54dnegoti-clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c94a2c"/></linearGradient>
<marker id="w54dnegoti-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14293a"/></marker>
<marker id="w54dnegoti-arm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b776e"/></marker>
</defs>
<rect width="1000" height="480" rx="24" fill="#eaf6f3"/><rect width="1000" height="480" rx="24" fill="url(#w54dnegoti-dots)"/><ellipse cx="500" cy="300" rx="380" ry="14" fill="#14293a" opacity="0.12" filter="url(#w54dnegoti-blur)"/><ellipse cx="500" cy="232" rx="400" ry="96" fill="#8a5d33"/><ellipse cx="500" cy="218" rx="400" ry="96" fill="#c99a62"/><ellipse cx="400" cy="180" rx="160" ry="22" fill="#fff" opacity=".15"/><g transform="rotate(-4 255 200)" class="w54dnegoti-fl w54dnegoti-f1"><rect x="140" y="120" width="230" height="150" rx="14" fill="#fff" stroke="#2b776e" stroke-width="3" filter="url(#w54dnegoti-sh)"/><circle cx="174" cy="156" r="20" fill="#2b776e"/><text x="174" y="163" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">a</text><text x="204" y="152" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#14293a">Incentives for local</text><text x="204" y="172" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#14293a">businesses</text><path d="M162 202h158.1" stroke="#e2ddd2" stroke-width="4" stroke-linecap="round"/><path d="M162 220h171.1" stroke="#e2ddd2" stroke-width="4" stroke-linecap="round"/><path d="M162 238h111.6" stroke="#e2ddd2" stroke-width="4" stroke-linecap="round"/></g><g transform="rotate(0 500 200)" class="w54dnegoti-fl w54dnegoti-f2"><rect x="385" y="120" width="230" height="150" rx="14" fill="#fff" stroke="#2f6db5" stroke-width="3" filter="url(#w54dnegoti-sh)"/><circle cx="419" cy="156" r="20" fill="#2f6db5"/><text x="419" y="163" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">b</text><text x="449" y="152" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#14293a">Social media awareness</text><text x="449" y="172" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#14293a">campaigns</text><path d="M407 202h158.1" stroke="#e2ddd2" stroke-width="4" stroke-linecap="round"/><path d="M407 220h171.1" stroke="#e2ddd2" stroke-width="4" stroke-linecap="round"/><path d="M407 238h111.6" stroke="#e2ddd2" stroke-width="4" stroke-linecap="round"/></g><g transform="rotate(4 745 200)" class="w54dnegoti-fl w54dnegoti-f3"><rect x="630" y="120" width="230" height="150" rx="14" fill="#fff" stroke="#e64626" stroke-width="3" filter="url(#w54dnegoti-sh)"/><circle cx="664" cy="156" r="20" fill="#e64626"/><text x="664" y="163" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">c</text><text x="694" y="152" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#14293a">Media content that shows</text><text x="694" y="172" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#14293a">cultural diversity</text><path d="M652 202h158.1" stroke="#e2ddd2" stroke-width="4" stroke-linecap="round"/><path d="M652 220h171.1" stroke="#e2ddd2" stroke-width="4" stroke-linecap="round"/><path d="M652 238h111.6" stroke="#e2ddd2" stroke-width="4" stroke-linecap="round"/></g><g><path d="M70 370h250l24 30-24 30H70l24-30z" fill="#2b776e"/><text x="205" y="406" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1  Evaluate each option</text></g><g><path d="M360 370h250l24 30-24 30H360l24-30z" fill="#2f6db5"/><text x="495" y="406" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2  Negotiate</text></g><g><path d="M650 370h250l24 30-24 30H650l24-30z" fill="#7a4a8c"/><text x="785" y="406" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3  Move towards consensus</text></g><g class="w54dnegoti-pu"><rect x="720" y="24" width="250" height="72" rx="10" fill="#fff6c9" stroke="#e3a843" stroke-width="2" transform="rotate(3 845 60)"/><text x="845" y="56" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#14293a" text-anchor="middle">You don’t have to agree!</text><text x="845" y="80" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">The discussion matters most.</text></g><text x="40" y="50" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#2b776e">Which strategy is best?</text><text x="40" y="78" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a">mitigate the negative effects of cultural homogenization</text><g><g filter="url(#w54dnegoti-sh)"><circle cx="660" cy="50" r="20" fill="#fff"/></g><rect x="657.5" y="25" width="5" height="4" rx="1.2" fill="#14293a"/><circle cx="660" cy="50" r="20" stroke="#14293a" stroke-width="2" fill="none"/><path d="M660 50V33A17 17 0 0 1 677 50z" fill="#e64626" opacity=".85"/><g class="w54dnegoti-sp" style="transform-origin:660px 50px;transform-box:view-box"><path d="M660 50V34" stroke="#14293a" stroke-width="1.6" stroke-linecap="round"/></g><circle cx="660" cy="50" r="1.6" fill="#14293a"/><rect x="645" y="73" width="30" height="11" rx="5.5" fill="#14293a"/><text x="660" y="81" font-family="Manrope, Arial, sans-serif" font-size="7" font-weight="800" fill="#fff" text-anchor="middle">10 min</text></g>
</svg>
