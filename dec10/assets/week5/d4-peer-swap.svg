<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" fill="none" role="img" aria-label="Two groups swap their joint writing and read it with the Connection of ideas criterion. The feedback card has one positive point with an example and two points for improvement that start with a verb.">
<title>Peer feedback on joint writing</title>
<style>
.w54dpeersw-tw{animation:w54dpeersw-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dpeersw-t2{animation-delay:-1s}.w54dpeersw-t3{animation-delay:-2s}
