<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" fill="none" role="img" aria-label="A Venn diagram. Peer feedback: knows the task and the class, can explain face to face, may be less detailed. AI feedback: fast, detailed, follows your prompt, may be general or miss points. Both: can help you improve, both need checking.">
<title>Peer feedback and AI feedback</title>
<style>
.w54dpeervs-tw{animation:w54dpeervs-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dpeervs-t2{animation-delay:-1s}.w54dpeervs-t3{animation-delay:-2s}
.w54dpeervs-fl{animation:w54dpeervs-fl 6s ease-in-out infinite}.w54dpeervs-f2{animation-delay:-2s}.w54dpeervs-f3{animation-delay:-4s}
.w54dpeervs-bl{animation:w54dpeervs-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54dpeervs-b2{animation-delay:-1.7s}.w54dpeervs-b3{animation-delay:-3.2s}.w54dpeervs-b4{animation-delay:-2.4s}
.w54dpeervs-pu{animation:w54dpeervs-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dpeervs-p2{animation-delay:-.9s}.w54dpeervs-p3{animation-delay:-1.7s}
.w54dpeervs-dr{stroke-dasharray:6 7;animation:w54dpeervs-dr 1.8s linear infinite}
.w54dpeervs-sp{animation:w54dpeervs-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54dpeervs-sw{animation:w54dpeervs-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54dpeervs-tk{animation:w54dpeervs-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54dpeervs-wv{animation:w54dpeervs-wv 2.4s ease-in-out infinite}.w54dpeervs-w2{animation-delay:-.8s}.w54dpeervs-w3{animation-delay:-1.6s}
.w54dpeervs-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54dpeervs-dw 6s ease-in-out infinite}
@keyframes w54dpeervs-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54dpeervs-fl{50%{transform:translateY(-4px)}}
@keyframes w54dpeervs-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54dpeervs-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54dpeervs-dr{to{stroke-dashoffset:-26}}
@keyframes w54dpeervs-sp{to{transform:rotate(360deg)}}
@keyframes w54dpeervs-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54dpeervs-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54dpeervs-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54dpeervs-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
