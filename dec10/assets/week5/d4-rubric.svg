<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" fill="none" role="img" aria-label="Four rubric cards: Argumentation, Use of Sources, Connection of Ideas, and Vocabulary and Grammar, each with an icon and a short question.">
<title>The four areas of the Integrated Writing rubric</title>
<style>
.w54drubric-tw{animation:w54drubric-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54drubric-t2{animation-delay:-1s}.w54drubric-t3{animation-delay:-2s}
.w54drubric-fl{animation:w54drubric-fl 6s ease-in-out infinite}.w54drubric-f2{animation-delay:-2s}.w54drubric-f3{animation-delay:-4s}
.w54drubric-bl{animation:w54drubric-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54drubric-b2{animation-delay:-1.7s}.w54drubric-b3{animation-delay:-3.2s}.w54drubric-b4{animation-delay:-2.4s}
.w54drubric-pu{animation:w54drubric-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54drubric-p2{animation-delay:-.9s}.w54drubric-p3{animation-delay:-1.7s}
.w54drubric-dr{stroke-dasharray:6 7;animation:w54drubric-dr 1.8s linear infinite}
.w54drubric-sp{animation:w54drubric-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54drubric-sw{animation:w54drubric-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54drubric-tk{animation:w54drubric-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54drubric-wv{animation:w54drubric-wv 2.4s ease-in-out infinite}.w54drubric-w2{animation-delay:-.8s}.w54drubric-w3{animation-delay:-1.6s}
.w54drubric-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54drubric-dw 6s ease-in-out infinite}
@keyframes w54drubric-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54drubric-fl{50%{transform:translateY(-4px)}}
@keyframes w54drubric-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54drubric-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54drubric-dr{to{stroke-dashoffset:-26}}
@keyframes w54drubric-sp{to{transform:rotate(360deg)}}
@keyframes w54drubric-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54drubric-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54drubric-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54drubric-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="w54drubric-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf2fb"/><stop offset="1" stop-color="#d9e4f5"/></linearGradient>
<pattern id="w54drubric-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r=".8" fill="#3a58a0" fill-opacity=".14"/></pattern>
<radialGradient id="w54drubric-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w54drubric-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w54drubric-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w54drubric-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w54drubric-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6db5"/><stop offset="1" stop-color="#3a58a0"/></linearGradient>
<linearGradient id="w54drubric-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient>
<linearGradient id="w54drubric-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w54drubric-clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c94a2c"/></linearGradient>
<marker id="w54drubric-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14293a"/></marker>
<marker id="w54drubric-arm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3a58a0"/></marker>
</defs>
<rect width="1000" height="400" rx="24" fill="#edf2fb"/><rect width="1000" height="400" rx="24" fill="url(#w54drubric-dots)"/><text x="40" y="52" font-family="Manrope, Arial, sans-serif" font-size="24" font-weight="800" fill="#3a58a0">Integrated Writing rubric: four areas</text><g class="w54drubric-fl w54drubric-f1"><rect x="40" y="90" width="212" height="270" rx="18" fill="#fff" stroke="#e64626" stroke-width="3" filter="url(#w54drubric-sh)"/><circle cx="146" cy="156" r="42" fill="#e64626"/><g transform="translate(146 156)"><circle r="20" stroke="#fff" stroke-width="4" fill="none"/><circle r="10" stroke="#fff" stroke-width="4" fill="none"/><circle r="3" fill="#fff"/></g><text x="146" y="232" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#e64626" text-anchor="middle">Argumentation</text><text x="146" y="296" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="middle">Is my position clear,</text><text x="146" y="316.15" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="middle">with strong reasons?</text></g><g class="w54drubric-fl w54drubric-f2"><rect x="276" y="90" width="212" height="270" rx="18" fill="#fff" stroke="#e3a843" stroke-width="3" filter="url(#w54drubric-sh)"/><circle cx="382" cy="156" r="42" fill="#e3a843"/><g transform="translate(382 156)"><path d="M-22-14h18a5 5 0 0 1 4 3v28a5 5 0 0 0-4-3h-18zM22-14H4a5 5 0 0 0-4 3v28a5 5 0 0 1 4-3h18z" fill="#fff"/></g><text x="382" y="232" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#e3a843" text-anchor="middle">Use of Sources</text><text x="382" y="296" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="middle">Do I use evidence from</text><text x="382" y="316.15" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="middle">the sources, cited</text><text x="382" y="336.3" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="middle">correctly?</text></g><g class="w54drubric-fl w54drubric-f3"><rect x="512" y="90" width="212" height="270" rx="18" fill="#fff" stroke="#13887a" stroke-width="3" filter="url(#w54drubric-sh)"/><circle cx="618" cy="156" r="42" fill="#13887a"/><g transform="translate(618 156)"><rect x="-24" y="-9" width="26" height="18" rx="9" stroke="#fff" stroke-width="4.5" fill="none"/><rect x="-2" y="-9" width="26" height="18" rx="9" stroke="#fff" stroke-width="4.5" fill="none"/></g><text x="618" y="232" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#13887a" text-anchor="middle">Connection of</text><text x="618" y="255.75" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#13887a" text-anchor="middle">Ideas</text><text x="618" y="296" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="middle">Do my sentences and</text><text x="618" y="316.15" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="middle">paragraphs link</text><text x="618" y="336.3" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="middle">clearly?</text></g><g class="w54drubric-fl w54drubric-f1"><rect x="748" y="90" width="212" height="270" rx="18" fill="#fff" stroke="#7a4a8c" stroke-width="3" filter="url(#w54drubric-sh)"/><circle cx="854" cy="156" r="42" fill="#7a4a8c"/><g transform="translate(854 156)"><text x="0" y="10" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="900" fill="#fff" text-anchor="middle">Aa</text></g><text x="854" y="232" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#7a4a8c" text-anchor="middle">Vocabulary and</text><text x="854" y="255.75" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#7a4a8c" text-anchor="middle">Grammar</text><text x="854" y="296" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="middle">Is my language</text><text x="854" y="316.15" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a" text-anchor="middle">accurate and academic?</text></g>
</svg>
