<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" fill="none" role="img" aria-label="Sample Text Map 5.1 (agree): background, thesis, three columns (Americanisation; loss of traditional identity; counterargument and refutation) and the conclusion with implications.">
<title>Sample Text Map 5.1: AGREE</title>
<style>
.w54dtextma-tw{animation:w54dtextma-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dtextma-t2{animation-delay:-1s}.w54dtextma-t3{animation-delay:-2s}
.w54dtextma-fl{animation:w54dtextma-fl 6s ease-in-out infinite}.w54dtextma-f2{animation-delay:-2s}.w54dtextma-f3{animation-delay:-4s}
.w54dtextma-bl{animation:w54dtextma-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54dtextma-b2{animation-delay:-1.7s}.w54dtextma-b3{animation-delay:-3.2s}.w54dtextma-b4{animation-delay:-2.4s}
.w54dtextma-pu{animation:w54dtextma-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54dtextma-p2{animation-delay:-.9s}.w54dtextma-p3{animation-delay:-1.7s}
.w54dtextma-dr{stroke-dasharray:6 7;animation:w54dtextma-dr 1.8s linear infinite}
.w54dtextma-sp{animation:w54dtextma-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54dtextma-sw{animation:w54dtextma-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54dtextma-tk{animation:w54dtextma-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54dtextma-wv{animation:w54dtextma-wv 2.4s ease-in-out infinite}.w54dtextma-w2{animation-delay:-.8s}.w54dtextma-w3{animation-delay:-1.6s}
.w54dtextma-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54dtextma-dw 6s ease-in-out infinite}
@keyframes w54dtextma-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54dtextma-fl{50%{transform:translateY(-4px)}}
@keyframes w54dtextma-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54dtextma-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54dtextma-dr{to{stroke-dashoffset:-26}}
@keyframes w54dtextma-sp{to{transform:rotate(360deg)}}
@keyframes w54dtextma-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54dtextma-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54dtextma-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54dtextma-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="w54dtextma-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4eef9"/><stop offset="1" stop-color="#e4d8ef"/></linearGradient>
<pattern id="w54dtextma-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r=".8" fill="#7a4a8c" fill-opacity=".14"/></pattern>
<radialGradient id="w54dtextma-glow" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="w54dtextma-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".16"/><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w54dtextma-blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="w54dtextma-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4c162"/><stop offset="1" stop-color="#d9962e"/></linearGradient>
<linearGradient id="w54dtextma-main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93619f"/><stop offset="1" stop-color="#7a4a8c"/></linearGradient>
<linearGradient id="w54dtextma-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f7f2e8"/></linearGradient>
<linearGradient id="w54dtextma-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4c68"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w54dtextma-clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0694c"/><stop offset="1" stop-color="#c94a2c"/></linearGradient>
<marker id="w54dtextma-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14293a"/></marker>
<marker id="w54dtextma-arm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a4a8c"/></marker>
</defs>
<rect width="1000" height="760" rx="24" fill="#f4eef9"/><rect width="1000" height="760" rx="24" fill="url(#w54dtextma-dots)"/><rect x="40" y="24" width="920" height="120" rx="16" fill="#fff" stroke="#7a4a8c" stroke-width="2.5" filter="url(#w54dtextma-sh)"/><text x="60" y="54" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a">Background: new tech &amp; increased international travel  →  SO (“led to”) + interconnected/globalised world</text><text x="60" y="75.39" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a">→  SO (“has spurred”) economic growth &amp; global collaboration</text><text x="60" y="96.78" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a">→  BUT (“While … it also raises significant concerns …”) impact on cultural identities</text><rect x="40" y="158" width="920" height="46" rx="14" fill="#7a4a8c"/><text x="500" y="188" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">THESIS (“This essay asserts that …”): cultural globalisation has a negative influence on traditional cultures</text><path d="M500 204V222H188V236" stroke="#7a4a8c" stroke-width="2.5" fill="none"/><rect x="40" y="236" width="296" height="56" rx="12" fill="#e64626"/><text x="188" y="259" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">Negative Impact 1:</text><text x="188" y="278.375" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">“Americanisation”</text><text x="50" y="319" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">US culture = dominant</text><rect x="48" y="335.2" width="244.2" height="22" rx="11" fill="#14293a"/><text x="57" y="350.7" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">EXPLANATION (“refer to as …”)</text><text x="50" y="376.2" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">“Americanisation” &amp; “American</text><text x="50" y="395.4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">hegemony” = US monopoly on</text><text x="50" y="414.59999999999997" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">entertainment, media &amp; fashion</text><rect x="48" y="430.79999999999995" width="166.2" height="22" rx="11" fill="#14293a"/><text x="57" y="446.29999999999995" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">EXAMPLE (“such as”)</text><text x="50" y="471.79999999999995" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">McDonalds &amp; Coca-Cola =</text><text x="50" y="490.99999999999994" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">omnipresent</text><rect x="48" y="507.19999999999993" width="228.6" height="22" rx="11" fill="#13887a"/><text x="57" y="522.6999999999999" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">SO (“Consequently”, “thus”)</text><text x="50" y="548.1999999999999" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">US values imposed SO traditional</text><text x="50" y="567.4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">ideologies undermined</text><rect x="48" y="583.5999999999999" width="150.6" height="22" rx="11" fill="#e64626"/><text x="57" y="599.0999999999999" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">BUT (“Even if …”)</text><text x="50" y="624.5999999999999" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">less concerning in some Asian</text><text x="50" y="643.8" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">countries, but other regions left</text><text x="50" y="662.9999999999999" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">behind</text><path d="M500 204V222H500V236" stroke="#7a4a8c" stroke-width="2.5" fill="none"/><rect x="352" y="236" width="296" height="56" rx="12" fill="#2f6db5"/><text x="500" y="259" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">Negative Impact 2: loss of</text><text x="500" y="278.375" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">traditional identity</text><text x="362" y="319" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">trad. cultures lose unique</text><text x="362" y="338.2" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">identity</text><rect x="360" y="354.4" width="142.8" height="22" rx="11" fill="#13887a"/><text x="369" y="369.9" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">SO (“through …”)</text><text x="362" y="395.4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">world + connected → global</text><text x="362" y="414.59999999999997" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">culture replaces local identities</text><rect x="360" y="430.79999999999995" width="228.6" height="22" rx="11" fill="#14293a"/><text x="369" y="446.29999999999995" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">CONSEQUENCE (“As a result”)</text><text x="362" y="471.79999999999995" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">young Asian people torn: cultural</text><text x="362" y="490.99999999999994" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">pride vs global citizens</text><rect x="360" y="507.19999999999993" width="228.6" height="22" rx="11" fill="#13887a"/><text x="369" y="522.6999999999999" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">SO (“which contributes to”)</text><text x="362" y="548.1999999999999" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">homogenised world</text><rect x="360" y="564.4" width="259.79999999999995" height="22" rx="11" fill="#13887a"/><text x="369" y="579.9" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">SO (“Ultimately … can lead to”)</text><text x="362" y="605.4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">erosion of unique traditions</text><path d="M500 204V222H812V236" stroke="#7a4a8c" stroke-width="2.5" fill="none"/><rect x="664" y="236" width="296" height="56" rx="12" fill="#13887a"/><text x="812" y="259" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">Counterargument / Refutation</text><rect x="672" y="306" width="228.6" height="22" rx="11" fill="#e64626"/><text x="681" y="321.5" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">BUT (“On the other hand …”)</text><text x="674" y="347" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">glob’n can facilitate diversity &amp;</text><text x="674" y="366.2" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">innovation by blending cultures</text><rect x="672" y="382.4" width="280" height="22" rx="11" fill="#14293a"/><text x="681" y="397.9" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">EXPLANATION (“Some scholars argue”)</text><text x="674" y="423.4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">multi-directional exchange →</text><text x="674" y="442.59999999999997" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">diverse global landscape</text><rect x="672" y="458.79999999999995" width="135" height="22" rx="11" fill="#e64626"/><text x="681" y="474.29999999999995" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">BUT (“However”)</text><text x="674" y="499.79999999999995" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">exchange = unbalanced</text><rect x="672" y="516" width="158.4" height="22" rx="11" fill="#13887a"/><text x="681" y="531.5" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">SO (“making them”)</text><text x="674" y="557" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">poorer / unstable countries +</text><text x="674" y="576.2" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">vulnerable to culture loss</text><rect x="40" y="648" width="920" height="96" rx="16" fill="#fff" stroke="#7a4a8c" stroke-width="2.5"/><text x="60" y="678" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#14293a">THESIS (“In summary, this essay has argued that …”): cultural globalisation has negative impacts on culture</text><text x="60" y="699.39" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#14293a">IMPLICATIONS (“It is imperative that …”): international policies/practices should protect &amp; nurture diverse</text><text x="60" y="720.78" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#14293a">cultural traditions  →  SO … NOT (“to prevent”) + future cultural loss</text>
</svg>
