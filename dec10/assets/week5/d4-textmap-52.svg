<rect width="1000" height="760" rx="24" fill="#f4eef9"/><rect width="1000" height="760" rx="24" fill="url(#w54dtextma-dots)"/><rect x="40" y="24" width="920" height="120" rx="16" fill="#fff" stroke="#7a4a8c" stroke-width="2.5" filter="url(#w54dtextma-sh)"/><text x="60" y="54" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a">DEFINITION (“… refers to …”) cultural globalisation = rapid movement of ideas, attitudes &amp; values across borders</text><text x="60" y="75.39" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a">→  SO (“often seen as leading to …”) more connected world  →  SO (“Critics argue …”) cultural homogenisation</text><text x="60" y="96.78" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#14293a">→  BUT (“However …”) this view simplifies the complex interactions when cultures meet</text><rect x="40" y="158" width="920" height="46" rx="14" fill="#7a4a8c"/><text x="500" y="188" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">THESIS (“This essay will challenge the belief that …”): cultural globalisation does NOT have a solely negative impact</text><path d="M500 204V222H188V236" stroke="#7a4a8c" stroke-width="2.5" fill="none"/><rect x="40" y="236" width="296" height="56" rx="12" fill="#e64626"/><text x="188" y="259" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">Counterargument / Refutation:</text><text x="188" y="278.375" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">loss of unique culture</text><rect x="48" y="306" width="205.2" height="22" rx="11" fill="#13887a"/><text x="57" y="321.5" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">SO (“it can cause … to”)</text><text x="50" y="347" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">glob’n → local cultures lose</text><text x="50" y="366.2" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">uniqueness</text><rect x="48" y="382.4" width="275.4" height="22" rx="11" fill="#14293a"/><text x="57" y="397.9" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">EXPLANATION (“Both … describe …”)</text><text x="50" y="423.4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">homogenised world: dominant</text><text x="50" y="442.59999999999997" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">cultures replace traditional ones</text><rect x="48" y="458.79999999999995" width="267.6" height="22" rx="11" fill="#14293a"/><text x="57" y="474.29999999999995" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">EXAMPLE (“citing examples of …”)</text><text x="50" y="499.79999999999995" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">Coca-Cola &amp; McDonalds =</text><text x="50" y="519" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">“Americanisation”</text><rect x="48" y="535.1999999999999" width="228.6" height="22" rx="11" fill="#e64626"/><text x="57" y="550.6999999999999" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">BUT (“However … rejects …”)</text><text x="50" y="576.1999999999999" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">“Americanisation” = outdated in</text><text x="50" y="595.4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">Asia</text><rect x="48" y="611.5999999999999" width="280" height="22" rx="11" fill="#e3a843"/><text x="57" y="627.0999999999999" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">AND / SO (“Additionally”, “Ultimately”)</text><text x="50" y="652.5999999999999" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">superficial artifacts; theory =</text><text x="50" y="671.8" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">inaccurate</text><path d="M500 204V222H500V236" stroke="#7a4a8c" stroke-width="2.5" fill="none"/><rect x="352" y="236" width="296" height="56" rx="12" fill="#13887a"/><text x="500" y="259" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">Blend of cultures → innovation</text><text x="500" y="278.375" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">&amp; new cultural IDs</text><rect x="360" y="306" width="280" height="22" rx="11" fill="#13887a"/><text x="369" y="321.5" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">SO (“One positive impact … is that …”)</text><text x="362" y="347" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">innovation &amp; new cultural</text><text x="362" y="366.2" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">identities</text><rect x="360" y="382.4" width="220.79999999999998" height="22" rx="11" fill="#14293a"/><text x="369" y="397.9" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">DEFINITION (“is termed …”)</text><text x="362" y="423.4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">global + local culture =</text><text x="362" y="442.59999999999997" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">“cultural hybridisation”</text><rect x="360" y="458.79999999999995" width="280" height="22" rx="11" fill="#2f6db5"/><text x="369" y="474.29999999999995" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">BECAUSE (“is being utilised by …”)</text><text x="362" y="499.79999999999995" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">young people express</text><text x="362" y="519" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">individuality, embrace pride</text><rect x="360" y="535.1999999999999" width="280" height="22" rx="11" fill="#14293a"/><text x="369" y="550.6999999999999" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">EXAMPLE (“One example of this is …”)</text><text x="362" y="576.1999999999999" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">a Chinese streetwear brand</text><rect x="360" y="592.4" width="244.2" height="22" rx="11" fill="#13887a"/><text x="369" y="607.9" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">SO (“which can be seen to …”)</text><text x="362" y="633.4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">enhanced &amp; diversified cultures</text><path d="M500 204V222H812V236" stroke="#7a4a8c" stroke-width="2.5" fill="none"/><rect x="664" y="236" width="296" height="56" rx="12" fill="#2f6db5"/><text x="812" y="259" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">Impacts = diverse &amp;</text><text x="812" y="278.375" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="800" fill="#fff" text-anchor="middle">under-researched</text><rect x="672" y="306" width="267.6" height="22" rx="11" fill="#2f6db5"/><text x="681" y="321.5" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">BECAUSE (“Another reason why …”)</text><text x="674" y="347" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">effects are diverse &amp;</text><text x="674" y="366.2" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">under-researched</text><rect x="672" y="382.4" width="252" height="22" rx="11" fill="#14293a"/><text x="681" y="397.9" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">EXPLANATION (“According to …”)</text><text x="674" y="423.4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">cultures change at different</text><text x="674" y="442.59999999999997" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">speeds &amp; in different ways</text><rect x="672" y="458.79999999999995" width="220.79999999999998" height="22" rx="11" fill="#14293a"/><text x="681" y="474.29999999999995" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">EXAMPLE (“For instance …”)</text><text x="674" y="499.79999999999995" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">weaker economies = more</text><text x="674" y="519" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">susceptible</text><rect x="672" y="535.1999999999999" width="280" height="22" rx="11" fill="#14293a"/><text x="681" y="550.6999999999999" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">EXPLANATION (“… categorise … as …”)</text><text x="674" y="576.1999999999999" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">convergence, hybridisation &amp;</text><text x="674" y="595.4" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">differentiation</text><rect x="672" y="611.5999999999999" width="142.8" height="22" rx="11" fill="#13887a"/><text x="681" y="627.0999999999999" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="800" fill="#fff">SO (“Clearly …”)</text><text x="674" y="652.5999999999999" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a">condemning as “negative” = unfair</text><rect x="40" y="648" width="920" height="96" rx="16" fill="#fff" stroke="#7a4a8c" stroke-width="2.5"/><text x="60" y="678" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#14293a">THESIS (“In conclusion, this essay has contested the view that …”): cultural globalisation does not just erode local cultures</text><text x="60" y="699.39" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#14293a">IMPLICATIONS (“Rather than …, … is needed plus …”): don’t see globalisation as a threat —</text><text x="60" y="720.78" font-family="Manrope, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#14293a">recognise its potential, and do more research</text>
</svg>
