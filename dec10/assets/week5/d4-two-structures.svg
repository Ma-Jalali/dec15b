<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" fill="none" role="img" aria-label="Two essay plans. Structure 1, DISAGREE (like Sample 5.2): paragraph 1 counterargument, negative impact: loss of unique culture; paragraph 2 positive impact: blend of cultures leads to innovation and new cultural identities; paragraph 3 not negative impacts: globalisation’s impacts are diverse and under-researched. Structure 2, AGREE (like Sample 5.1): paragraph 1 negative impact 1: one-sided influence, Americanisation; paragraph 2 negative impact 2: loss of traditional culture, homogenisation; paragraph 3 counterargument, positive impact: blending different cultures leads to innovation.">
<title>Two structures for the joint writing</title>
<style>
