@keyframes w54dtwostr-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54dtwostr-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

