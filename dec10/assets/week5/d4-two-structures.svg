.w54dtwostr-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54dtwostr-dw 6s ease-in-out infinite}
@keyframes w54dtwostr-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
