<rect width="1000" height="540" rx="24" fill="#f4eef9"/><rect width="1000" height="540" rx="24" fill="url(#w54dtwostr-dots)"/><rect x="40" y="30" width="440" height="480" rx="20" fill="#fff" stroke="#13887a" stroke-width="3" filter="url(#w54dtwostr-sh)"/><rect x="40" y="30" width="440" height="70" rx="20" fill="#13887a"/><text x="260" y="62" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Structure 1 · DISAGREE</text><text x="260" y="88" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">like Sample 5.2</text><text x="260" y="132" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle" font-style="italic">Not only having a negative impact (it’s not</text><text x="260" y="152.8" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle" font-style="italic">completely negative)</text><g class="w54dtwostr-fl w54dtwostr-f1"><rect x="64" y="190" width="392" height="88" rx="14" fill="#13887a" fill-opacity=".12" stroke="#13887a" stroke-width="2"/><text x="84" y="222" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#13887a">Para 1 · Counterargument (negative impact)</text><text x="84" y="252" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a">Loss of unique culture</text></g><g class="w54dtwostr-fl w54dtwostr-f2"><rect x="64" y="294" width="392" height="88" rx="14" fill="#13887a" fill-opacity=".12" stroke="#13887a" stroke-width="2"/><text x="84" y="326" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#13887a">Para 2 · Positive impact</text><text x="84" y="356" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a">Blend of cultures → innovation &amp; new cultural IDs</text></g><g class="w54dtwostr-fl w54dtwostr-f3"><rect x="64" y="398" width="392" height="88" rx="14" fill="#13887a" fill-opacity=".12" stroke="#13887a" stroke-width="2"/><text x="84" y="430" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#13887a">Para 3 · Not negative impacts</text><text x="84" y="460" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a">Impacts are diverse &amp; under-researched</text></g><rect x="520" y="30" width="440" height="480" rx="20" fill="#fff" stroke="#e64626" stroke-width="3" filter="url(#w54dtwostr-sh)"/><rect x="520" y="30" width="440" height="70" rx="20" fill="#e64626"/><text x="740" y="62" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">Structure 2 · AGREE</text><text x="740" y="88" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">like Sample 5.1</text><text x="740" y="132" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle" font-style="italic">Cultural globalisation is having a negative</text><text x="740" y="152.8" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" text-anchor="middle" font-style="italic">impact on culture</text><g class="w54dtwostr-fl w54dtwostr-f1"><rect x="544" y="190" width="392" height="88" rx="14" fill="#e64626" fill-opacity=".12" stroke="#e64626" stroke-width="2"/><text x="564" y="222" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#e64626">Para 1 · Negative impact 1</text><text x="564" y="252" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a">One-sided influence / “Americanisation”</text></g><g class="w54dtwostr-fl w54dtwostr-f2"><rect x="544" y="294" width="392" height="88" rx="14" fill="#e64626" fill-opacity=".12" stroke="#e64626" stroke-width="2"/><text x="564" y="326" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#e64626">Para 2 · Negative impact 2</text><text x="564" y="356" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a">Loss of traditional culture / “homogenisation”</text></g><g class="w54dtwostr-fl w54dtwostr-f3"><rect x="544" y="398" width="392" height="88" rx="14" fill="#e64626" fill-opacity=".12" stroke="#e64626" stroke-width="2"/><text x="564" y="430" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="800" fill="#e64626">Para 3 · Counterargument (positive impact)</text><text x="564" y="460" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" fill="#14293a">Blending different cultures → innovation</text></g>
