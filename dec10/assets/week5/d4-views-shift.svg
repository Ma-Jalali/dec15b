ansform="translate(500 194) scale(1.4)"><path d="M-12 4v-4a12 12 0 0 1 24 0v4M-14 2h6v12h-6zM8 2h6v12H8z" stroke="#7a4a8c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" fill="none"/></g><text x="500" y="270" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#7a4a8c" text-anchor="middle">Listen</text><text x="500" y="292" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">to a lecture</text></g><g class="w54dviewss-fl w54dviewss-f3"><circle cx="670" cy="236" r="44" fill="#fff" stroke="#b07d12" stroke-width="4" filter="url(#w54dviewss-sh)"/><g transform="translate(670 230) scale(1.4)"><path d="M-10 12l2-8 14-14 6 6-14 14zM-10 12l8-2" stroke="#b07d12" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" fill="none"/></g><text x="670" y="306" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="800" fill="#b07d12" text-anchor="middle">Write</text><text x="670" y="328" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" text-anchor="middle">an essay</text></g><g><g filter="url(#w54dviewss-sh)"><path d="M783 70H960L970 80V217a3 3 0 0 1-3 3H783a3 3 0 0 1-3-3V73a3 3 0 0 1 3-3z" fill="url(#w54dviewss-paper)"/></g><path d="M960 70L970 80H960z" fill="#e8dfcf"/><rect x="780" y="70" width="190" height="40" rx="4" fill="#2b776e"/><text x="875" y="98" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="2">TODAY</text><text x="800" y="140" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a">Look again at your</text><text x="800" y="161.6" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a">Monday answers</text><g transform="translate(930 196) scale(1.3)"><circle r="8" fill="#2f7d6b"/><path d="M-3.6 .2l2.6 2.6 4.8-5" stroke="#fff" stroke-width="2.2" stroke-linecap="rou