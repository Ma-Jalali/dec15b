<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" fill="none" role="img" aria-label="A path from Monday to Thursday: on Monday you wrote your first ideas; then you read, listened and wrote an essay; today you look again and ask: Have your views changed? Why or why not?">
<title>Have your views changed?</title>
<style>
