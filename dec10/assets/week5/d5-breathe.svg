<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" fill="none" role="img" aria-label="Box breathing: a gold dot moves around a rounded square. Top: breathe in for 4. Right: hold for 4. Bottom: breathe out for 4. Left: hold for 4. A calm student with closed eyes sits in a soft circle that grows and shrinks. Do it three times.">
<title>Box breathing</title>
<style>
.w5b-fl{animation:w5b-fl 6s ease-in-out infinite}.w5b-f2{animation-delay:-2s}.w5b-f3{animation-delay:-4s}
@keyframes w5b-fl{50%{transform:translateY(-6px)}}
.w5b-fs{animation:w5b-fs 5s ease-in-out infinite}
@keyframes w5b-fs{50%{transform:translateY(-3px)}}
.w5b-tw{animation:w5b-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5b-t2{animation-delay:-1.1s}.w5b-t3{animation-delay:-2.2s}
@keyframes w5b-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.w5b-bl{animation:w5b-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5b-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.w5b-pu{animation:w5b-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5b-p2{animation-delay:-1s}.w5b-p3{animation-delay:-2s}
@keyframes w5b-pu{50%{transform:scale(1.08)}}
.w5b-ring{animation:w5b-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5b-r2{animation-delay:-1.2s}.w5b-r3{animation-delay:-2.4s}
@keyframes w5b-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5b-flow{stroke-dasharray:5 10;animation:w5b-flow 1.4s linear infinite}
@keyframes w5b-flow{to{stroke-dashoffset:-30}}
.w5b-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5b-draw 5s ease-in-out infinite}
@keyframes w5b-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5b-bar{animation:w5b-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5b-bar{50%{transform:scaleY(.4)}}
.w5b-spin{animation:w5b-spin 12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5b-spin{to{transform:rotate(360deg)}}
.w5b-sw{animation:w5b-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5b-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5b-pop{animation:w5b-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5b-o2{animation-delay:-1.3s}.w5b-o3{animation-delay:-2.6s}
@keyframes w5b-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

.w5b-dot{animation:w5b-dot 16s linear infinite}
@keyframes w5b-dot{0%{transform:translate(0,0)}25%{transform:translate(240px,0)}50%{transform:translate(240px,240px)}75%{transform:translate(0,240px)}100%{transform:translate(0,0)}}
.w5b-lung{animation:w5b-lung 16s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5b-lung{0%{transform:scale(.72)}25%,50%{transform:scale(1.05)}75%,100%{transform:scale(.72)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="w5b-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w5b-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".16"/></filter>
<filter id="w5b-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="w5b-dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="0.8" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="w5b-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w5b-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f0e3"/></linearGradient>
<linearGradient id="w5b-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c867"/><stop offset="1" stop-color="#d9962b"/></linearGradient>
<linearGradient id="w5b-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d4a66"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w5b-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b7fd0"/><stop offset="1" stop-color="#2f4f96"/></linearGradient>
<linearGradient id="w5b-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fa395"/><stop offset="1" stop-color="#226a61"/></linearGradient>
<linearGradient id="w5b-clay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e07a4f"/><stop offset="1" stop-color="#b0482a"/></linearGradient>
<linearGradient id="w5b-plum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d6bb0"/><stop offset="1" stop-color="#6a3d7c"/></linearGradient>
<linearGradient id="w5b-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c99b"/><stop offset="1" stop-color="#cfa46d"/></linearGradient>
<linearGradient id="w5b-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f5"/><stop offset="1" stop-color="#7cc0e3"/></linearGradient>

</defs>

<rect x="1" y="1" width="438" height="438" rx="26" fill="#eef3fb"/><rect x="1" y="1" width="438" height="438" rx="26" fill="url(#w5b-dots)"/><rect x="100" y="100" width="240" height="240" rx="34" stroke="#c9d6ec" stroke-width="16"/><rect x="100" y="100" width="240" height="240" rx="34" stroke="#3a58a0" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/><g class="w5b-lung"><circle cx="220" cy="220" r="70" fill="url(#w5b-teal)" fill-opacity=".22"/><circle cx="220" cy="220" r="50" fill="url(#w5b-teal)" fill-opacity=".35"/></g><g transform="translate(220 206) scale(1.55)"><path d="M-27 66C-27 40-16 25 0 25C16 25 27 40 27 66z" fill="#2b776e"/><path d="M7 25.6C19 27.5 27 40 27 66H14C15 47 13 35 7 25.6z" fill="#14293a" opacity=".13"/><path d="M-15 32C-19 37-21 45-21 53" stroke="#fff" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/><rect x="-5" y="9" width="10" height="17" rx="4" fill="#c88a60"/><path d="M-6.5 25L0 31.5L6.5 25z" fill="#c88a60"/><circle cx="-14.6" cy="2.5" r="3.3" fill="#c88a60"/><circle cx="14.6" cy="2.5" r="3.3" fill="#c88a60"/><circle r="15" fill="#e0a77e"/><circle cx="0" cy="-21" r="7" fill="#2a1a12"/><path d="M-15.5 2C-17-11-9-18 0-18C9-18 17-11 15.5 2C13-6 7-11 0-11C-7-11-13-6-15.5 2z" fill="#2a1a12"/><path d="M-7.4 3q2.2 2 4.4 0M3 3q2.2 2 4.4 0" stroke="#14293a" stroke-width="1.5" stroke-linecap="round"/><path d="M-7.6-2.8q2.4-1.6 4.8 0M2.8-2.8q2.4-1.6 4.8 0" stroke="#1d1410" stroke-width="1.3" stroke-linecap="round"/><circle cx="-9" cy="7.4" r="2.6" fill="#e8806b" opacity=".3"/><circle cx="9" cy="7.4" r="2.6" fill="#e8806b" opacity=".3"/><path d="M-3 9q3 2.2 6 0" stroke="#14293a" stroke-width="1.4" stroke-linecap="round"/></g><g class="w5b-dot"><circle cx="100" cy="100" r="15" fill="#e3a843" stroke="#fff" stroke-width="4" filter="url(#w5b-sh2)"/></g><text x="220" y="78" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#3a58a0" >Breathe in · 4</text><text x="220" y="378" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#3a58a0" >Breathe out · 4</text><text x="376" y="226" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#2b776e" transform="rotate(90 376 220)">Hold · 4</text><text x="64" y="226" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="900" fill="#2b776e" transform="rotate(-90 64 220)">Hold · 4</text><text x="220" y="418" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="800" fill="#14293a" fill-opacity=".6">× 3</text>
</svg>
