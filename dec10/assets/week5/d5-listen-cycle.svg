<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" fill="none" role="img" aria-label="Four steps. Before you listen: 1 Predict — what kind of answer: number, name or reason? 2 Keywords — underline them and think of synonyms. During: 3 Listen and note — short notes with symbols. After: 4 Check — use the 8 minutes at the end to count the words and check spelling. The recording is heard once only.">
<title>The listening cycle</title>
<style>
.w5l-fl{animation:w5l-fl 6s ease-in-out infinite}.w5l-f2{animation-delay:-2s}.w5l-f3{animation-delay:-4s}
@keyframes w5l-fl{50%{transform:translateY(-6px)}}
.w5l-fs{animation:w5l-fs 5s ease-in-out infinite}
@keyframes w5l-fs{50%{transform:translateY(-3px)}}
.w5l-tw{animation:w5l-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5l-t2{animation-delay:-1.1s}.w5l-t3{animation-delay:-2.2s}
@keyframes w5l-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.w5l-bl{animation:w5l-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5l-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.w5l-pu{animation:w5l-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5l-p2{animation-delay:-1s}.w5l-p3{animation-delay:-2s}
@keyframes w5l-pu{50%{transform:scale(1.08)}}
.w5l-ring{animation:w5l-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5l-r2{animation-delay:-1.2s}.w5l-r3{animation-delay:-2.4s}
@keyframes w5l-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5l-flow{stroke-dasharray:5 10;animation:w5l-flow 1.4s linear infinite}
@keyframes w5l-flow{to{stroke-dashoffset:-30}}
.w5l-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5l-draw 5s ease-in-out infinite}
@keyframes w5l-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5l-bar{animation:w5l-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5l-bar{50%{transform:scaleY(.4)}}
.w5l-spin{animation:w5l-spin 12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5l-spin{to{transform:rotate(360deg)}}
.w5l-sw{animation:w5l-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5l-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5l-pop{animation:w5l-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5l-o2{animation-delay:-1.3s}.w5l-o3{animation-delay:-2.6s}
@keyframes w5l-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
