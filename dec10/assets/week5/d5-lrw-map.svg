<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none" role="img" aria-label="Three cards: Listen (a classroom speaker; about 35 minutes, heard once), Read (an open text; 50 minutes, Texts A, B and C) and Write (an essay page with a citation; 90 minutes, 4 sources). Arrows labelled notes flow from Listen and Read into Write. A banner says: three tests, one after the other, no break; your notes become the evidence in your essay.">
<title>The LRW Assessment map</title>
<style>
.w5m-fl{animation:w5m-fl 6s ease-in-out infinite}.w5m-f2{animation-delay:-2s}.w5m-f3{animation-delay:-4s}
@keyframes w5m-fl{50%{transform:translateY(-6px)}}
.w5m-fs{animation:w5m-fs 5s ease-in-out infinite}
@keyframes w5m-fs{50%{transform:translateY(-3px)}}
.w5m-tw{animation:w5m-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5m-t2{animation-delay:-1.1s}.w5m-t3{animation-delay:-2.2s}
@keyframes w5m-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.w5m-bl{animation:w5m-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5m-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.w5m-pu{animation:w5m-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5m-p2{animation-delay:-1s}.w5m-p3{animation-delay:-2s}
@keyframes w5m-pu{50%{transform:scale(1.08)}}
.w5m-ring{animation:w5m-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5m-r2{animation-delay:-1.2s}.w5m-r3{animation-delay:-2.4s}
@keyframes w5m-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5m-flow{stroke-dasharray:5 10;animation:w5m-flow 1.4s linear infinite}
@keyframes w5m-flow{to{stroke-dashoffset:-30}}
.w5m-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5m-draw 5s ease-in-out infinite}
@keyframes w5m-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5m-bar{animation:w5m-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5m-bar{50%{transform:scaleY(.4)}}
.w5m-spin{animation:w5m-spin 12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5m-spin{to{transform:rotate(360deg)}}
.w5m-sw{animation:w5m-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5m-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5m-pop{animation:w5m-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5m-o2{animation-delay:-1.3s}.w5m-o3{animation-delay:-2.6s}
@keyframes w5m-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
