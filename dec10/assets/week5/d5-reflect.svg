<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" fill="none" role="img" aria-label="A path with three stepping stones: What went well (a star), What was difficult (a small mountain), Next time I will … (an arrow). The path leads up a hill to a flag marked LRW 2, Week 9.">
<title>Reflection path</title>
<style>
.w5f-fl{animation:w5f-fl 6s ease-in-out infinite}.w5f-f2{animation-delay:-2s}.w5f-f3{animation-delay:-4s}
