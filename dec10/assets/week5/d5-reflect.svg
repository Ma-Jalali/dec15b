.w5f-flow{stroke-dasharray:5 10;animation:w5f-flow 1.4s linear infinite}
@keyframes w5f-flow{to{stroke-dashoffset:-30}}
.w5f-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5f-draw 5s ease-in-out infinite}
@keyframes w5f-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5f-bar{animation:w5f-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
