<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" fill="none" role="img" aria-label="Four tiles: Argumentation (a target, a clear position), Use of Sources (two linked pages, paraphrase and cite), Connection of Ideas (chain links, cohesion and flow), Vocabulary and Grammar (Aa, accurate and academic).">
<title>The four rubric criteria</title>
<style>
.w5r-fl{animation:w5r-fl 6s ease-in-out infinite}.w5r-f2{animation-delay:-2s}.w5r-f3{animation-delay:-4s}
@keyframes w5r-fl{50%{transform:translateY(-6px)}}
.w5r-fs{animation:w5r-fs 5s ease-in-out infinite}
@keyframes w5r-fs{50%{transform:translateY(-3px)}}
.w5r-tw{animation:w5r-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5r-t2{animation-delay:-1.1s}.w5r-t3{animation-delay:-2.2s}
@keyframes w5r-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.w5r-bl{animation:w5r-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5r-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.w5r-pu{animation:w5r-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5r-p2{animation-delay:-1s}.w5r-p3{animation-delay:-2s}
@keyframes w5r-pu{50%{transform:scale(1.08)}}
.w5r-ring{animation:w5r-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5r-r2{animation-delay:-1.2s}.w5r-r3{animation-delay:-2.4s}
@keyframes w5r-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5r-flow{stroke-dasharray:5 10;animation:w5r-flow 1.4s linear infinite}
@keyframes w5r-flow{to{stroke-dashoffset:-30}}
.w5r-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5r-draw 5s ease-in-out infinite}
@keyframes w5r-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5r-bar{animation:w5r-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5r-bar{50%{transform:scaleY(.4)}}
.w5r-spin{animation:w5r-spin 12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5r-spin{to{transform:rotate(360deg)}}
.w5r-sw{animation:w5r-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5r-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5r-pop{animation:w5r-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5r-o2{animation-delay:-1.3s}.w5r-o3{animation-delay:-2.6s}
@keyframes w5r-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="w5r-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="11" stdDeviation="9" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w5r-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".16"/></filter>
<filter id="w5r-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
<pattern id="w5r-dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="w5r-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w5r-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f0e3"/></linearGradient>
<linearGradient id="w5r-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c867"/><stop offset="1" stop-color="#d9962b"/></linearGradient>
<linearGradient id="w5r-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d4a66"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w5r-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b7fd0"/><stop offset="1" stop-color="#2f4f96"/></linearGradient>
<linearGradient id="w5r-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fa395"/><stop offset="1" stop-color="#226a61"/></linearGradient>
<linearGradient id="w5r-clay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e07a4f"/><stop offset="1" stop-color="#b0482a"/></linearGradient>
<linearGradient id="w5r-plum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d6bb0"/><stop offset="1" stop-color="#6a3d7c"/></linearGradient>
<linearGradient id="w5r-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c99b"/><stop offset="1" stop-color="#cfa46d"/></linearGradient>
<linearGradient id="w5r-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f5"/><stop offset="1" stop-color="#7cc0e3"/></linearGradient>

</defs>

<rect x="1" y="1" width="998" height="298" rx="26" fill="#f3f6fb"/><rect x="1" y="1" width="998" height="298" rx="26" fill="url(#w5r-dots)"/><g filter="url(#w5r-sh)"><rect x="28" y="34" width="224" height="232" rx="18" fill="#fff"/></g><g class="w5r-fs w5r-f1"><circle cx="140" cy="112" r="52" fill="url(#w5r-clay)"/><circle cx="122" cy="92" r="16" fill="#fff" fill-opacity=".18"/><circle cx="140" cy="112" r="30" stroke="#fff" stroke-width="5"/><circle cx="140" cy="112" r="16" stroke="#fff" stroke-width="5"/><circle cx="140" cy="112" r="5" fill="#fff"/><path d="M146 106l26-26" stroke="#14293a" stroke-width="4" stroke-linecap="round"/><path d="M168 78l8-2-2 8z" fill="#14293a"/></g><text x="140" y="202" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="900" fill="#c4562f" >Argumentation</text><text x="140" y="230" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" fill-opacity=".7">a clear position</text><g filter="url(#w5r-sh)"><rect x="268" y="34" width="224" height="232" rx="18" fill="#fff"/></g><g class="w5r-fs w5r-f2"><circle cx="380" cy="112" r="52" fill="url(#w5r-teal)"/><circle cx="362" cy="92" r="16" fill="#fff" fill-opacity=".18"/><rect x="346" y="90" width="28" height="40" rx="4" fill="#fff"/><rect x="386" y="90" width="28" height="40" rx="4" fill="#fff"/><path d="M351 100h18M351 108h18M391 100h18M391 108h18" stroke="#2b776e" stroke-width="2.4" stroke-linecap="round"/><path d="M374 120h12" stroke="#e3a843" stroke-width="5" stroke-linecap="round"/></g><text x="380" y="202" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="900" fill="#2b776e" >Use of Sources</text><text x="380" y="230" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" fill-opacity=".7">paraphrase + cite</text><g filter="url(#w5r-sh)"><rect x="508" y="34" width="224" height="232" rx="18" fill="#fff"/></g><g class="w5r-fs w5r-f3"><circle cx="620" cy="112" r="52" fill="url(#w5r-blue)"/><circle cx="602" cy="92" r="16" fill="#fff" fill-opacity=".18"/><rect x="582" y="100" width="42" height="24" rx="12" stroke="#fff" stroke-width="6"/><rect x="616" y="100" width="42" height="24" rx="12" stroke="#fff" stroke-width="6"/></g><text x="620" y="202" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#3a58a0" >Connection of Ideas</text><text x="620" y="230" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" fill-opacity=".7">cohesion + flow</text><g filter="url(#w5r-sh)"><rect x="748" y="34" width="224" height="232" rx="18" fill="#fff"/></g><g class="w5r-fs w5r-f1"><circle cx="860" cy="112" r="52" fill="url(#w5r-plum)"/><circle cx="842" cy="92" r="16" fill="#fff" fill-opacity=".18"/><text x="860" y="128" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="44" font-weight="900" fill="#fff" >Aa</text></g><text x="860" y="202" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="900" fill="#7a4a8c" >Vocabulary &amp; Grammar</text><text x="860" y="230" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" fill-opacity=".7">accurate + academic</text>
</svg>
