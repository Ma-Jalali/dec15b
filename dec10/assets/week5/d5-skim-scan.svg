<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" fill="none" role="img" aria-label="Left, SKIM for the main idea: an eye follows a fast wavy path over the title, headings and first sentences of a page. Right, SCAN for one detail: a magnifying glass jumps to highlighted words like 2012, Ritzer and 85%.">
<title>Skim and scan</title>
<style>
.w5s-fl{animation:w5s-fl 6s ease-in-out infinite}.w5s-f2{animation-delay:-2s}.w5s-f3{animation-delay:-4s}
@keyframes w5s-fl{50%{transform:translateY(-6px)}}
.w5s-fs{animation:w5s-fs 5s ease-in-out infinite}
@keyframes w5s-fs{50%{transform:translateY(-3px)}}
.w5s-tw{animation:w5s-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5s-t2{animation-delay:-1.1s}.w5s-t3{animation-delay:-2.2s}
@keyframes w5s-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.w5s-bl{animation:w5s-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5s-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.w5s-pu{animation:w5s-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5s-p2{animation-delay:-1s}.w5s-p3{animation-delay:-2s}
@keyframes w5s-pu{50%{transform:scale(1.08)}}
.w5s-ring{animation:w5s-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5s-r2{animation-delay:-1.2s}.w5s-r3{animation-delay:-2.4s}
@keyframes w5s-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5s-flow{stroke-dasharray:5 10;animation:w5s-flow 1.4s linear infinite}
@keyframes w5s-flow{to{stroke-dashoffset:-30}}
.w5s-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5s-draw 5s ease-in-out infinite}
@keyframes w5s-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5s-bar{animation:w5s-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5s-bar{50%{transform:scaleY(.4)}}
.w5s-spin{animation:w5s-spin 12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5s-spin{to{transform:rotate(360deg)}}
.w5s-sw{animation:w5s-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5s-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5s-pop{animation:w5s-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5s-o2{animation-delay:-1.3s}.w5s-o3{animation-delay:-2.6s}
@keyframes w5s-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

.w5s-mag{animation:w5s-mag 7s ease-in-out infinite}
@keyframes w5s-mag{0%,18%{transform:translate(0,0)}33%,51%{transform:translate(-80px,68px)}66%,84%{transform:translate(40px,144px)}100%{transform:translate(0,0)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="w5s-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="11" stdDeviation="9" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w5s-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".16"/></filter>
<filter id="w5s-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
<pattern id="w5s-dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="w5s-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w5s-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f0e3"/></linearGradient>
<linearGradient id="w5s-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c867"/><stop offset="1" stop-color="#d9962b"/></linearGradient>
<linearGradient id="w5s-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d4a66"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w5s-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b7fd0"/><stop offset="1" stop-color="#2f4f96"/></linearGradient>
<linearGradient id="w5s-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fa395"/><stop offset="1" stop-color="#226a61"/></linearGradient>
<linearGradient id="w5s-clay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e07a4f"/><stop offset="1" stop-color="#b0482a"/></linearGradient>
<linearGradient id="w5s-plum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d6bb0"/><stop offset="1" stop-color="#6a3d7c"/></linearGradient>
<linearGradient id="w5s-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c99b"/><stop offset="1" stop-color="#cfa46d"/></linearGradient>
<linearGradient id="w5s-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f5"/><stop offset="1" stop-color="#7cc0e3"/></linearGradient>

</defs>

<rect x="1" y="1" width="998" height="398" rx="26" fill="#f3f6fb"/><rect x="1" y="1" width="998" height="398" rx="26" fill="url(#w5s-dots)"/><g filter="url(#w5s-sh)"><rect x="28" y="28" width="458" height="344" rx="18" fill="#fff"/></g><rect x="50" y="46" width="120" height="40" rx="20" fill="url(#w5s-plum)"/><text x="110" y="73" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" letter-spacing="2">SKIM</text><text x="188" y="64" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#7a4a8c" >for the main idea</text><text x="188" y="86" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" fill-opacity=".75">title · headings · first sentences</text><rect x="68" y="110" width="250" height="240" rx="10" fill="url(#w5s-paper)" stroke="#e1e6ee" stroke-width="2"/><rect x="86" y="126" width="160" height="12" rx="6" fill="#14293a" fill-opacity=".8"/><rect x="86" y="160" width="90" height="8" rx="4" fill="#7a4a8c" fill-opacity=".7"/><path d="M86 182h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M86 194h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M86 206h130" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M86 182h200" stroke="#e3a843" stroke-width="8" stroke-linecap="round" stroke-opacity=".35"/><rect x="86" y="224" width="90" height="8" rx="4" fill="#7a4a8c" fill-opacity=".7"/><path d="M86 246h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M86 258h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M86 270h130" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M86 246h200" stroke="#e3a843" stroke-width="8" stroke-linecap="round" stroke-opacity=".35"/><rect x="86" y="288" width="90" height="8" rx="4" fill="#7a4a8c" fill-opacity=".7"/><path d="M86 310h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M86 322h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M86 334h130" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M86 310h200" stroke="#e3a843" stroke-width="8" stroke-linecap="round" stroke-opacity=".35"/><path class="w5s-flow" d="M78 132C188 116 268 140 304 170S88 180 98 230S298 230 304 290S88 310 108 340" stroke="#7a4a8c" stroke-width="3" stroke-linecap="round"/><g class="w5s-fl"><g filter="url(#w5s-sh2)"><path d="M358 210q40-36 80 0q-40 36-80 0z" fill="#fff"/></g><circle cx="398" cy="210" r="14" fill="#7a4a8c"/><circle cx="403" cy="205" r="5" fill="#fff"/></g><text x="398" y="268" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" >Read fast.</text><text x="398" y="290" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" >Get the big</text><text x="398" y="310" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" >picture.</text><g filter="url(#w5s-sh)"><rect x="514" y="28" width="458" height="344" rx="18" fill="#fff"/></g><rect x="536" y="46" width="120" height="40" rx="20" fill="url(#w5s-blue)"/><text x="596" y="73" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="900" fill="#fff" letter-spacing="2">SCAN</text><text x="674" y="64" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="800" fill="#3a58a0" >for one detail</text><text x="674" y="86" text-anchor="start" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="600" fill="#14293a" fill-opacity=".75">names · years · numbers</text><rect x="554" y="110" width="250" height="240" rx="10" fill="url(#w5s-paper)" stroke="#e1e6ee" stroke-width="2"/><rect x="572" y="126" width="160" height="12" rx="6" fill="#14293a" fill-opacity=".8"/><rect x="572" y="160" width="90" height="8" rx="4" fill="#3a58a0" fill-opacity=".7"/><path d="M572 182h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M572 194h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M572 206h130" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><rect x="572" y="224" width="90" height="8" rx="4" fill="#3a58a0" fill-opacity=".7"/><path d="M572 246h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M572 258h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M572 270h130" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><rect x="572" y="288" width="90" height="8" rx="4" fill="#3a58a0" fill-opacity=".7"/><path d="M572 310h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M572 322h200" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><path d="M572 334h130" stroke="#c9d2df" stroke-width="4" stroke-linecap="round"/><rect x="674" y="174" width="60" height="24" rx="6" fill="#e3a843" fill-opacity=".35"/><text x="704" y="191" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#14293a" >2012</text><rect x="594" y="242" width="60" height="24" rx="6" fill="#e3a843" fill-opacity=".35"/><text x="624" y="259" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#14293a" >Ritzer</text><rect x="714" y="318" width="60" height="24" rx="6" fill="#e3a843" fill-opacity=".35"/><text x="744" y="335" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="900" fill="#14293a" >85%</text><g class="w5s-mag"><g class=""><circle cx="704" cy="188" r="30" fill="#fff" fill-opacity=".55" stroke="#14293a" stroke-width="6.7"/><path d="M725.6 209.6l22.5 22.5" stroke="#14293a" stroke-width="11.5" stroke-linecap="round"/><path d="M689.0 182.0a16.5 16.5 0 0 1 15.0 -10.5" stroke="#fff" stroke-width="4.3" stroke-linecap="round"/></g></g><text x="884" y="268" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" >Jump to the</text><text x="884" y="290" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" >detail. Then</text><text x="884" y="310" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700" fill="#14293a" >read closely.</text><g class="w5s-pu"><g class=""><circle cx="880" cy="200" r="26" fill="#fff" fill-opacity=".55" stroke="#3a58a0" stroke-width="5.8"/><path d="M898.7 218.7l19.5 19.5" stroke="#3a58a0" stroke-width="10.0" stroke-linecap="round"/><path d="M867.0 194.8a14.3 14.3 0 0 1 13.0 -9.1" stroke="#fff" stroke-width="3.7" stroke-linecap="round"/></g></g>
</svg>
