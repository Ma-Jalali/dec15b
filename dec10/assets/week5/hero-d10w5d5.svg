<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 933" fill="none" role="img" aria-label="A calm, sunny study room. A student sits at a desk with her eyes closed, breathing slowly inside a soft glowing circle. On the desk: a speaker with sound waves, an open book with a magnifying glass, an essay page with a pen and a green tick, and a glass of water. A window with sunshine, a wall clock and a shelf of books are behind her. Floating labels say: Listen · predict, Read · skim &amp; scan, Write · plan, cite, check, and breathe 4 · 4 · 4 · 4.">
<title>LRW Assessment day</title>
<style>
.w5h-fl{animation:w5h-fl 6s ease-in-out infinite}.w5h-f2{animation-delay:-2s}.w5h-f3{animation-delay:-4s}
@keyframes w5h-fl{50%{transform:translateY(-9px)}}
.w5h-fs{animation:w5h-fs 5s ease-in-out infinite}
@keyframes w5h-fs{50%{transform:translateY(-4px)}}
.w5h-tw{animation:w5h-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5h-t2{animation-delay:-1.1s}.w5h-t3{animation-delay:-2.2s}
