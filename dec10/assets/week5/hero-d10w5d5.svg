@keyframes w5h-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

.w5h-breath{animation:w5h-breath 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5h-breath{0%,100%{transform:scale(.86);opacity:.6}50%{transform:scale(1.08);opacity:1}}
.w5h-drift{animation:w5h-drift 16s ease-in-out infinite}
