<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="Reading to write: an open book shows the text “The three H scenarios” with highlighted lines. On the left page grey identical circles merge into one (homogenization); on the right page coloured circles blend into a new pattern (hybridization). A student reads with a highlighter; a globe bookmark and note cards float around.">
<title>Reading to write: an open book shows the text “The three H scenarios” with highlighted lines. On the left page grey identical circles merge into one (homogenization); on the right page coloured circles blend into a new pattern (hybridization). A student reads with a highlighter; a globe bookmark and note cards float around.</title>
