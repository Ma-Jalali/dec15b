<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="Integrated writing workshop: three students write one essay together on a big shared screen; coloured cursors type the introduction and three paragraphs, a word count shows 450–600 words, and a globe floats above">
