<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" fill="none" role="img" aria-label="A calm exam desk by a sunny window: a laptop shows three tabs, L, R and W, with a progress bar; a power bank, a glass of water, a small plant and a note lie on the desk; a clock is on the wall. Chips say breathe and one part at a time.">
<title>LRW Assessment day</title>
<style>
.w5st-fl{animation:w5st-fl 6s ease-in-out infinite}.w5st-f2{animation-delay:-2s}.w5st-f3{animation-delay:-4s}
@keyframes w5st-fl{50%{transform:translateY(-4px)}}
.w5st-fs{animation:w5st-fs 5s ease-in-out infinite}
@keyframes w5st-fs{50%{transform:translateY(-2px)}}
.w5st-tw{animation:w5st-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5st-t2{animation-delay:-1.1s}.w5st-t3{animation-delay:-2.2s}
@keyframes w5st-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.w5st-bl{animation:w5st-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5st-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.w5st-pu{animation:w5st-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5st-p2{animation-delay:-1s}.w5st-p3{animation-delay:-2s}
@keyframes w5st-pu{50%{transform:scale(1.08)}}
.w5st-ring{animation:w5st-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5st-r2{animation-delay:-1.2s}.w5st-r3{animation-delay:-2.4s}
@keyframes w5st-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5st-flow{stroke-dasharray:5 10;animation:w5st-flow 1.4s linear infinite}
@keyframes w5st-flow{to{stroke-dashoffset:-30}}
.w5st-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5st-draw 5s ease-in-out infinite}
@keyframes w5st-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5st-bar{animation:w5st-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5st-bar{50%{transform:scaleY(.4)}}
.w5st-spin{animation:w5st-spin 12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5st-spin{to{transform:rotate(360deg)}}
.w5st-sw{animation:w5st-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5st-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5st-pop{animation:w5st-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5st-o2{animation-delay:-1.3s}.w5st-o3{animation-delay:-2.6s}
@keyframes w5st-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.w5st-prog{animation:w5st-prog 6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes w5st-prog{0%{transform:scaleX(.2)}80%,100%{transform:scaleX(1.6)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="w5st-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w5st-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".16"/></filter>
<filter id="w5st-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="w5st-dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="0.8" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="w5st-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w5st-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f0e3"/></linearGradient>
<linearGradient id="w5st-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c867"/><stop offset="1" stop-color="#d9962b"/></linearGradient>
<linearGradient id="w5st-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d4a66"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w5st-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b7fd0"/><stop offset="1" stop-color="#2f4f96"/></linearGradient>
<linearGradient id="w5st-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fa395"/><stop offset="1" stop-color="#226a61"/></linearGradient>
<linearGradient id="w5st-clay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e07a4f"/><stop offset="1" stop-color="#b0482a"/></linearGradient>
<linearGradient id="w5st-plum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d6bb0"/><stop offset="1" stop-color="#6a3d7c"/></linearGradient>
<linearGradient id="w5st-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c99b"/><stop offset="1" stop-color="#cfa46d"/></linearGradient>
<linearGradient id="w5st-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f5"/><stop offset="1" stop-color="#7cc0e3"/></linearGradient>
<linearGradient id="w5st-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3fb"/><stop offset="1" stop-color="#dfe8f5"/></linearGradient><linearGradient id="w5st-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0f7"/><stop offset="1" stop-color="#e8f4fc"/></linearGradient>
</defs>

