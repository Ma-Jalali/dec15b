-serif" font-size="11" font-weight="900" fill="#fff" >R</text><rect x="240" y="160" width="32" height="18" rx="5" fill="#c4562f" fill-opacity="0.25"/><text x="256" y="173.5" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="900" fill="#c4562f" >W</text><path d="M172 192h96M172 204h84M172 216h90" stroke="#c9d2df" stroke-width="3" stroke-linecap="round"/><rect x="172" y="226" width="96" height="6" rx="3" fill="#dbe3ef"/><rect class="w5st-prog" x="172" y="226" width="60" height="6" rx="3" fill="#2b776e"/><path d="M135.2 244H308.8L299.0 252.4H145.0z" fill="#c9d3e0"/><rect x="208.0" y="244" width="28.0" height="2.8" rx="1" fill="#9aa8bb"/></g><g transform="translate(80 214) scale(1.0)"><g filter="url(#w5st-sh2)"><rect x="-16" y="-26" width="32" height="52" rx="7" fill="url(#w5st-navy)"/></g><rect x="-10" y="-14" width="20" height="30" rx="3" fill="#fff" fill-opacity=".12"/><rect class="w5st-pu w5st-p1" x="-7" y="8" width="14" height="6" rx="2" fill="#2b776e"/><rect class="w5st-pu w5st-p2" x="-7" y="-1" width="14" height="6" rx="2" fill="#2b776e"/><rect class="w5st-pu w5st-p3" x="-7" y="-10" width="14" height="6" rx="2" fill="#2b776e"/><rect x="-5" y="-30" width="10" height="5" rx="2" fill="#9aa8bb"/></g><g transform="translate(330 250) scale(1.1)"><path d="M-12-30H12L9 2H-9z" fill="#e8f4fb" fill-opacity=".8" stroke="#9cc6de" stroke-width="2"/><path d="M-10.6-16H10.6L9 2H-9z" fill="url(#w5st-water)"/><path d="M-7-26L-6-4" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-opacity=".8"/><ellipse cx="0" cy="3" rx="11" ry="2.4" fill="#14293a" opacity=".1"/></g><g transform="translate(392 252) scale(1.0)"><g class="w5st-sw"><path d="M0-8C-4-22-16-30-24-30C-20-20-12-12 0-8z" fill="#5aa469"/><path d="M0-8C4-26 14-36 24-36C20-22 12-12 0-8z" fill="#3f8a52"/><path d="M0-8C-2-30 2-42 6-48C10-36 6-20 0-8z" fill="#6fbf7b"/><path d="M0-8C-6-18-8-24-6-34" stroke="#2f6b3d" stroke-width="1.2" stroke-opacity=".5"/></g><path d="M-14-8H14L