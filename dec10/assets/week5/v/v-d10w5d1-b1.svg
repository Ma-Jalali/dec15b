<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Prepare: paragraph G on a page beside a small iceberg — music, food and fashion float on top; values and beliefs sit deep under the water. A five-minute timer runs.">
