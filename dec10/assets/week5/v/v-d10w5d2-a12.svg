<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Two students face each other inside a dashed rotation circle. One holds her Cornell notes and gives a mini-lecture: The lecture was …. A gold 60-second timer. Two more students wait to rotate.">
