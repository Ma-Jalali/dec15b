<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A Cornell notes page: a narrow Review column, a wide Note-taking column and a Summary box, numbered 1 to 4, with a pencil writing">
<title>The Cornell note-taking technique</title>
<style>
.v52a4-tw{animation:v52a4-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.v52a4-t2{animation-delay:-1s}.v52a4-t3{animation-delay:-2s}
