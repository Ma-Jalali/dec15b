.v52a4-sp{animation:v52a4-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.v52a4-dr{stroke-dasharray:6 8;animation:v52a4-dr 1.6s linear infinite}
.v52a4-wv{animation:v52a4-wv 2.4s ease-out infinite}.v52a4-w2{animation-delay:-.8s}.v52a4-w3{animation-delay:-1.6s}
.v52a4-sw{animation:v52a4-sw 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}.v52a4-s2{animation-delay:-2s}
.v52a4-pen{animation:v52a4-pen 3s ease-in-out infinite}
.v52a4-spin{animation:v52a4-spin 9s linear infinite}
@keyframes v52a4-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes v52a4-fl{50%{transform:translateY(-4px)}}
@keyframes v52a4-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes v52a4-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes v52a4-sp{to{transform:rotate(360deg)}}
@keyframes v52a4-dr{to{stroke-dashoffset:-28}}
@keyframes v52a4-wv{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes v52a4-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes v52a4-pen{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-1px)}50%{transform:translate(6px,1px)}75%{transform:translate(9px,0)}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
