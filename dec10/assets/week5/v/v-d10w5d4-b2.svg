<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A clipboard with a checklist of seven questions, most ticked, under a big magnifying glass; a flip card turns over beside it.">
<title>The Useful Feedback checklist</title>
<style>
.w54b2-tw{animation:w54b2-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54b2-t2{animation-delay:-1s}.w54b2-t3{animation-delay:-2s}
.w54b2-fl{animation:w54b2-fl 6s ease-in-out infinite}.w54b2-f2{animation-delay:-2s}.w54b2-f3{animation-delay:-4s}
.w54b2-bl{animation:w54b2-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54b2-b2{animation-delay:-1.7s}.w54b2-b3{animation-delay:-3.2s}.w54b2-b4{animation-delay:-2.4s}
.w54b2-pu{animation:w54b2-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54b2-p2{animation-delay:-.9s}.w54b2-p3{animation-delay:-1.7s}
.w54b2-dr{stroke-dasharray:6 7;animation:w54b2-dr 1.8s linear infinite}
.w54b2-sp{animation:w54b2-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54b2-sw{animation:w54b2-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54b2-tk{animation:w54b2-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54b2-wv{animation:w54b2-wv 2.4s ease-in-out infinite}.w54b2-w2{animation-delay:-.8s}.w54b2-w3{animation-delay:-1.6s}
.w54b2-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54b2-dw 6s ease-in-out infinite}
@keyframes w54b2-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54b2-fl{50%{transform:translateY(-4px)}}
@keyframes w54b2-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54b2-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54b2-dr{to{stroke-dashoffset:-26}}
@keyframes w54b2-sp{to{transform:rotate(360deg)}}
@keyframes w54b2-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54b2-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54b2-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54b2-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
