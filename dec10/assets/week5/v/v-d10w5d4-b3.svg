@keyframes w54b3-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54b3-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
