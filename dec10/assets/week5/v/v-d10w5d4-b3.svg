<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Feedback speech cards on the left are joined by lines to evaluation labels on the right: a green tick for useful, specific feedback and a red cross for vague feedback such as “Your ideas are confusing”.">
<title>Match feedback to its evaluation</title>
<style>
.w54b3-tw{animation:w54b3-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54b3-t2{animation-delay:-1s}.w54b3-t3{animation-delay:-2s}
