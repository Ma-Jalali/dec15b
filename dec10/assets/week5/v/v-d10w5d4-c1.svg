<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="An hourglass: the top half narrows from background to thesis (introduction) and the bottom half widens from the thesis to a future statement (conclusion); an essay page with colour bands stands beside it.">
<title>The shape of an introduction and a conclusion</title>
<style>
.w54c1-tw{animation:w54c1-tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54c1-t2{animation-delay:-1s}.w54c1-t3{animation-delay:-2s}
.w54c1-fl{animation:w54c1-fl 6s ease-in-out infinite}.w54c1-f2{animation-delay:-2s}.w54c1-f3{animation-delay:-4s}
.w54c1-bl{animation:w54c1-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}.w54c1-b2{animation-delay:-1.7s}.w54c1-b3{animation-delay:-3.2s}.w54c1-b4{animation-delay:-2.4s}
.w54c1-pu{animation:w54c1-pu 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w54c1-p2{animation-delay:-.9s}.w54c1-p3{animation-delay:-1.7s}
.w54c1-dr{stroke-dasharray:6 7;animation:w54c1-dr 1.8s linear infinite}
.w54c1-sp{animation:w54c1-sp 14s linear infinite;transform-box:fill-box;transform-origin:center}
.w54c1-sw{animation:w54c1-sw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.w54c1-tk{animation:w54c1-tk 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.w54c1-wv{animation:w54c1-wv 2.4s ease-in-out infinite}.w54c1-w2{animation-delay:-.8s}.w54c1-w3{animation-delay:-1.6s}
.w54c1-dw{stroke-dasharray:400;stroke-dashoffset:400;animation:w54c1-dw 6s ease-in-out infinite}
@keyframes w54c1-tw{0%,100%{opacity:.35;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes w54c1-fl{50%{transform:translateY(-4px)}}
@keyframes w54c1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes w54c1-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes w54c1-dr{to{stroke-dashoffset:-26}}
@keyframes w54c1-sp{to{transform:rotate(360deg)}}
@keyframes w54c1-sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes w54c1-tk{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes w54c1-wv{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes w54c1-dw{0%{stroke-dashoffset:400}40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-400}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
