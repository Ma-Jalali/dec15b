<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A body paragraph drawn as five stacked layers (topic sentence, evidence, example, refutation, concluding sentence) with a magnifying glass on the refutation layer marked “However”.">
<title>Body Paragraph 1: the job of each sentence</title>
<style>
