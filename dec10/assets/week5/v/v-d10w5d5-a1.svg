<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="Three glowing badges for Listen, Read and Write circle around an LRW badge, linked by moving dotted lines; a student with a question bubble looks on.">
<title>What is the LRW Assessment?</title>
<style>
.w5v1-fl{animation:w5v1-fl 6s ease-in-out infinite}.w5v1-f2{animation-delay:-2s}.w5v1-f3{animation-delay:-4s}
@keyframes w5v1-fl{50%{transform:translateY(-3px)}}
.w5v1-fs{animation:w5v1-fs 5s ease-in-out infinite}
@keyframes w5v1-fs{50%{transform:translateY(-2px)}}
.w5v1-tw{animation:w5v1-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v1-t2{animation-delay:-1.1s}.w5v1-t3{animation-delay:-2.2s}
@keyframes w5v1-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.w5v1-bl{animation:w5v1-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5v1-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.w5v1-pu{animation:w5v1-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v1-p2{animation-delay:-1s}.w5v1-p3{animation-delay:-2s}
@keyframes w5v1-pu{50%{transform:scale(1.08)}}
.w5v1-ring{animation:w5v1-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5v1-r2{animation-delay:-1.2s}.w5v1-r3{animation-delay:-2.4s}
@keyframes w5v1-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5v1-flow{stroke-dasharray:5 10;animation:w5v1-flow 1.4s linear infinite}
@keyframes w5v1-flow{to{stroke-dashoffset:-30}}
.w5v1-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5v1-draw 5s ease-in-out infinite}
@keyframes w5v1-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5v1-bar{animation:w5v1-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5v1-bar{50%{transform:scaleY(.4)}}
.w5v1-spin{animation:w5v1-spin 12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5v1-spin{to{transform:rotate(360deg)}}
.w5v1-sw{animation:w5v1-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5v1-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5v1-pop{animation:w5v1-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v1-o2{animation-delay:-1.3s}.w5v1-o3{animation-delay:-2.6s}
@keyframes w5v1-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
