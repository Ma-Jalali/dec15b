<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A classroom speaker with sound waves, a playing audio bar, and a note card with an arrow symbol and a three-word answer box marked “3 words or fewer”.">
<title>Listening strategies</title>
<style>
.w5v4-fl{animation:w5v4-fl 6s ease-in-out infinite}.w5v4-f2{animation-delay:-2s}.w5v4-f3{animation-delay:-4s}
@keyframes w5v4-fl{50%{transform:translateY(-3px)}}
.w5v4-fs{animation:w5v4-fs 5s ease-in-out infinite}
@keyframes w5v4-fs{50%{transform:translateY(-2px)}}
.w5v4-tw{animation:w5v4-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v4-t2{animation-delay:-1.1s}.w5v4-t3{animation-delay:-2.2s}
@keyframes w5v4-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.w5v4-bl{animation:w5v4-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5v4-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.w5v4-pu{animation:w5v4-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v4-p2{animation-delay:-1s}.w5v4-p3{animation-delay:-2s}
@keyframes w5v4-pu{50%{transform:scale(1.08)}}
.w5v4-ring{animation:w5v4-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5v4-r2{animation-delay:-1.2s}.w5v4-r3{animation-delay:-2.4s}
@keyframes w5v4-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5v4-flow{stroke-dasharray:5 10;animation:w5v4-flow 1.4s linear infinite}
@keyframes w5v4-flow{to{stroke-dashoffset:-30}}
.w5v4-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5v4-draw 5s ease-in-out infinite}
@keyframes w5v4-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5v4-bar{animation:w5v4-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5v4-bar{50%{transform:scaleY(.4)}}
.w5v4-spin{animation:w5v4-spin 12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5v4-spin{to{transform:rotate(360deg)}}
.w5v4-sw{animation:w5v4-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5v4-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5v4-pop{animation:w5v4-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v4-o2{animation-delay:-1.3s}.w5v4-o3{animation-delay:-2.6s}
@keyframes w5v4-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="w5v4-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w5v4-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".16"/></filter>
<filter id="w5v4-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="w5v4-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="0.8" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="w5v4-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w5v4-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f0e3"/></linearGradient>
<linearGradient id="w5v4-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c867"/><stop offset="1" stop-color="#d9962b"/></linearGradient>
<linearGradient id="w5v4-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d4a66"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w5v4-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b7fd0"/><stop offset="1" stop-color="#2f4f96"/></linearGradient>
<linearGradient id="w5v4-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fa395"/><stop offset="1" stop-color="#226a61"/></linearGradient>
<linearGradient id="w5v4-clay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e07a4f"/><stop offset="1" stop-color="#b0482a"/></linearGradient>
<linearGradient id="w5v4-plum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d6bb0"/><stop offset="1" stop-color="#6a3d7c"/></linearGradient>
<linearGradient id="w5v4-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c99b"/><stop offset="1" stop-color="#cfa46d"/></linearGradient>
<linearGradient id="w5v4-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f5"/><stop offset="1" stop-color="#7cc0e3"/></linearGradient>

</defs>

<defs><linearGradient id="w5v4-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecf6f4"/><stop offset="1" stop-color="#d9ebe8"/></linearGradient></defs><path d="M44 20C84 8 168 10 200 22C230 36 232 81 228 112C224 156 180 170 120 170C60 171 20 162 14 119C8 81 12 32 44 20z" fill="url(#w5v4-bg)"/><path d="M44 20C84 8 168 10 200 22C230 36 232 81 228 112C224 156 180 170 120 170C60 171 20 162 14 119C8 81 12 32 44 20z" fill="url(#w5v4-dots)"/><ellipse cx="120" cy="76" rx="77" ry="54" fill="url(#w5v4-glow)" opacity=".7"/><g transform="translate(72 80) scale(1.0)" class=""><g filter="url(#w5v4-sh2)"><rect x="-22" y="-32" width="44" height="64" rx="10" fill="#14293a"/></g><rect x="-18" y="-28" width="14" height="56" rx="6" fill="#fff" fill-opacity=".08"/><circle cx="0" cy="-15" r="8" fill="#2d4a66" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/><circle cx="0" cy="-15" r="3" fill="#2b776e"/><circle cx="0" cy="12" r="14" fill="#2d4a66" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/><circle class="w5v4-pu" cx="0" cy="12" r="7" fill="#2b776e"/><circle cx="-2" cy="10" r="2" fill="#fff" fill-opacity=".5"/><path class="w5v4-ring w5v4-r2" d="M32 -14Q42 2 32 18" stroke="#2b776e" stroke-width="3.2" stroke-linecap="round"/><path class="w5v4-ring w5v4-r2" d="M-32 -14Q-42 2 -32 18" stroke="#2b776e" stroke-width="3.2" stroke-linecap="round"/><path class="w5v4-ring w5v4-r3" d="M44 -14Q54 2 44 18" stroke="#2b776e" stroke-width="3.2" stroke-linecap="round"/><path class="w5v4-ring w5v4-r3" d="M-44 -14Q-54 2 -44 18" stroke="#2b776e" stroke-width="3.2" stroke-linecap="round"/></g><g filter="url(#w5v4-sh)"><rect x="34" y="128" width="78" height="26" rx="13" fill="#fff"/></g><circle cx="48" cy="141" r="8" fill="#2b776e"/><path d="M45.5 137v8l6-4z" fill="#fff"/><rect class="w5v4-bar" style="animation-delay:-0.00s" x="62.0" y="138.0" width="3.4" height="6" rx="1.7" fill="#2b776e"/><rect class="w5v4-bar" style="animation-delay:-0.15s" x="68.5" y="135.0" width="3.4" height="12" rx="1.7" fill="#2b776e"/><rect class="w5v4-bar" style="animation-delay:-0.30s" x="75.0" y="137.0" width="3.4" height="8" rx="1.7" fill="#2b776e"/><rect class="w5v4-bar" style="animation-delay:-0.45s" x="81.5" y="134.0" width="3.4" height="14" rx="1.7" fill="#2b776e"/><rect class="w5v4-bar" style="animation-delay:-0.60s" x="88.0" y="136.0" width="3.4" height="10" rx="1.7" fill="#2b776e"/><rect class="w5v4-bar" style="animation-delay:-0.75s" x="94.5" y="138.0" width="3.4" height="6" rx="1.7" fill="#2b776e"/><rect class="w5v4-bar" style="animation-delay:-0.90s" x="101.0" y="135.0" width="3.4" height="12" rx="1.7" fill="#2b776e"/><g class="w5v4-fs"><g filter="url(#w5v4-sh)"><rect x="132" y="40" width="80" height="96" rx="8" fill="url(#w5v4-paper)"/></g><rect x="140" y="50" width="38" height="6" rx="3" fill="#3a58a0"/><path d="M140 68h20M164 68l6 0M174 68h24" stroke="#c9d2df" stroke-width="2.4" stroke-linecap="round"/><text x="167" y="71" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="10" font-weight="900" fill="#c4562f" >→</text><path d="M140 84h56M140 98h40" stroke="#c9d2df" stroke-width="2.4" stroke-linecap="round"/><rect x="140" y="110" width="50" height="16" rx="4" fill="#fff" stroke="#3a58a0" stroke-width="1.4"/><path d="M145 118h9M157 118h9M169 118h9" stroke="#14293a" stroke-width="2.4" stroke-linecap="round"/><g class="w5v4-pu"><circle cx="204" cy="118" r="11" fill="url(#w5v4-gold)"/><text x="204" y="122" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="900" fill="#14293a" >≤3</text></g></g><path class="w5v4-tw " d="M28 35C28.9 39.1 28.9 39.1 33 40C28.9 40.9 28.9 40.9 28 45C27.1 40.9 27.1 40.9 23 40C27.1 39.1 27.1 39.1 28 35z" fill="#e3a843"/><path class="w5v4-tw w5v4-t2" d="M120 26C120.72 29.28 120.72 29.28 124 30C120.72 30.72 120.72 30.72 120 34C119.28 30.72 119.28 30.72 116 30C119.28 29.28 119.28 29.28 120 26z" fill="#2f6db5"/>
</svg>
