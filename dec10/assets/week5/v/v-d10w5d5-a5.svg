<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="An open book with one highlighted line, a magnifying glass over the text, a dotted eye path labelled skim and a chip labelled scan.">
<title>Reading strategies</title>
<style>
.w5v5-fl{animation:w5v5-fl 6s ease-in-out infinite}.w5v5-f2{animation-delay:-2s}.w5v5-f3{animation-delay:-4s}
@keyframes w5v5-fl{50%{transform:translateY(-3px)}}
.w5v5-fs{animation:w5v5-fs 5s ease-in-out infinite}
@keyframes w5v5-fs{50%{transform:translateY(-2px)}}
.w5v5-tw{animation:w5v5-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v5-t2{animation-delay:-1.1s}.w5v5-t3{animation-delay:-2.2s}
@keyframes w5v5-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.w5v5-bl{animation:w5v5-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5v5-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.w5v5-pu{animation:w5v5-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v5-p2{animation-delay:-1s}.w5v5-p3{animation-delay:-2s}
@keyframes w5v5-pu{50%{transform:scale(1.08)}}
.w5v5-ring{animation:w5v5-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5v5-r2{animation-delay:-1.2s}.w5v5-r3{animation-delay:-2.4s}
@keyframes w5v5-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5v5-flow{stroke-dasharray:5 10;animation:w5v5-flow 1.4s linear infinite}
@keyframes w5v5-flow{to{stroke-dashoffset:-30}}
.w5v5-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5v5-draw 5s ease-in-out infinite}
@keyframes w5v5-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5v5-bar{animation:w5v5-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5v5-bar{50%{transform:scaleY(.4)}}
.w5v5-spin{animation:w5v5-spin 12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5v5-spin{to{transform:rotate(360deg)}}
.w5v5-sw{animation:w5v5-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5v5-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5v5-pop{animation:w5v5-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v5-o2{animation-delay:-1.3s}.w5v5-o3{animation-delay:-2.6s}
@keyframes w5v5-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<filter id="w5v5-sh" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14293a" flood-opacity=".14"/><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#14293a" flood-opacity=".12"/></filter>
<filter id="w5v5-sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14293a" flood-opacity=".16"/></filter>
<filter id="w5v5-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="w5v5-dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="0.8" fill="#14293a" fill-opacity=".08"/></pattern>
<radialGradient id="w5v5-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="w5v5-paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f0e3"/></linearGradient>
<linearGradient id="w5v5-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c867"/><stop offset="1" stop-color="#d9962b"/></linearGradient>
<linearGradient id="w5v5-navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d4a66"/><stop offset="1" stop-color="#14293a"/></linearGradient>
<linearGradient id="w5v5-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b7fd0"/><stop offset="1" stop-color="#2f4f96"/></linearGradient>
<linearGradient id="w5v5-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fa395"/><stop offset="1" stop-color="#226a61"/></linearGradient>
<linearGradient id="w5v5-clay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e07a4f"/><stop offset="1" stop-color="#b0482a"/></linearGradient>
<linearGradient id="w5v5-plum" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d6bb0"/><stop offset="1" stop-color="#6a3d7c"/></linearGradient>
<linearGradient id="w5v5-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c99b"/><stop offset="1" stop-color="#cfa46d"/></linearGradient>
<linearGradient id="w5v5-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f5"/><stop offset="1" stop-color="#7cc0e3"/></linearGradient>

</defs>

<defs><linearGradient id="w5v5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1fb"/><stop offset="1" stop-color="#dfe4f5"/></linearGradient></defs><path d="M44 20C84 8 168 10 200 22C230 36 232 81 228 112C224 156 180 170 120 170C60 171 20 162 14 119C8 81 12 32 44 20z" fill="url(#w5v5-bg)"/><path d="M44 20C84 8 168 10 200 22C230 36 232 81 228 112C224 156 180 170 120 170C60 171 20 162 14 119C8 81 12 32 44 20z" fill="url(#w5v5-dots)"/><ellipse cx="120" cy="76" rx="77" ry="54" fill="url(#w5v5-glow)" opacity=".7"/><g filter="url(#w5v5-sh)"><path d="M28.0 68H180.0V154H28.0z" rx="6" fill="#3a58a0"/></g><path d="M104 66C69.0 58 34.0 62 34.0 62V146C62.0 142 83.0 144 104 150z" fill="url(#w5v5-paper)"/><path d="M104 66C139.0 58 174.0 62 174.0 62V146C146.0 142 125.0 144 104 150z" fill="#fff"/><path d="M104 66V150" stroke="#14293a" stroke-opacity=".15" stroke-width="2"/><path d="M44.0 74.0h38.5" stroke="#c7d0de" stroke-width="2.6" stroke-linecap="round"/><path d="M114 74.0h34.6" stroke="#c7d0de" stroke-width="2.6" stroke-linecap="round" stroke-opacity="1"/><path d="M44.0 90.0h49.0" stroke="#c7d0de" stroke-width="2.6" stroke-linecap="round"/><path d="M114 90.0h44.1" stroke="#c7d0de" stroke-width="2.6" stroke-linecap="round" stroke-opacity="1"/><path d="M44.0 106.0h49.0" stroke="#c7d0de" stroke-width="2.6" stroke-linecap="round"/><path d="M114 106.0h44.1" stroke="#e3a843" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/><path d="M44.0 122.0h38.5" stroke="#c7d0de" stroke-width="2.6" stroke-linecap="round"/><path d="M114 122.0h34.6" stroke="#c7d0de" stroke-width="2.6" stroke-linecap="round" stroke-opacity="1"/><path d="M44.0 138.0h49.0" stroke="#c7d0de" stroke-width="2.6" stroke-linecap="round"/><path d="M114 138.0h44.1" stroke="#c7d0de" stroke-width="2.6" stroke-linecap="round" stroke-opacity="1"/><g class="w5v5-fl"><g class=""><circle cx="150" cy="92" r="20" fill="#fff" fill-opacity=".55" stroke="#14293a" stroke-width="4.4"/><path d="M164.4 106.4l15.0 15.0" stroke="#14293a" stroke-width="7.7" stroke-linecap="round"/><path d="M140.0 88.0a11.0 11.0 0 0 1 10.0 -7.0" stroke="#fff" stroke-width="2.9" stroke-linecap="round"/></g></g><path class="w5v5-flow" d="M40 50C60 40 80 58 100 46S140 40 166 50" stroke="#7a4a8c" stroke-width="2" stroke-linecap="round"/><g class="w5v5-fs"><g filter="url(#w5v5-sh2)"><path d="M178 40q16-14 32 0q-16 14-32 0z" fill="#fff"/></g><circle cx="194" cy="40" r="5" fill="#7a4a8c"/><circle cx="195.5" cy="38.5" r="1.5" fill="#fff"/></g><g class="w5v5-fs w5v5-f2"><g filter="url(#w5v5-sh2)"><rect x="42.7" y="21.0" width="38.5" height="18.0" rx="9.0" fill="#7a4a8c"/></g><rect x="45.7" y="23.0" width="32.5" height="6.8" rx="3.4" fill="#fff" fill-opacity=".16"/><text x="62" y="33.24" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" fill="#fff" >skim</text></g><g class="w5v5-fs w5v5-f3"><g filter="url(#w5v5-sh2)"><rect x="178.7" y="137.0" width="38.5" height="18.0" rx="9.0" fill="#3a58a0"/></g><rect x="181.7" y="139.0" width="32.5" height="6.8" rx="3.4" fill="#fff" fill-opacity=".16"/><text x="198" y="149.24" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="9" font-weight="800" fill="#fff" >scan</text></g><path class="w5v5-tw " d="M26 115C26.9 119.1 26.9 119.1 31 120C26.9 120.9 26.9 120.9 26 125C25.1 120.9 25.1 120.9 21 120C25.1 119.1 25.1 119.1 26 115z" fill="#e3a843"/><path class="w5v5-tw w5v5-t2" d="M218 86C218.72 89.28 218.72 89.28 222 90C218.72 90.72 218.72 90.72 218 94C217.28 90.72 217.28 90.72 214 90C217.28 89.28 217.28 89.28 218 86z" fill="#13887a"/>
