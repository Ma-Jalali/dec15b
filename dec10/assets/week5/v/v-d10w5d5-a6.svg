<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="An essay page being written with a pen. Chips around it say thesis, plan and (Author, 2012), and a green tick shows the final check.">
<title>Integrated writing strategies</title>
<style>
.w5v6-fl{animation:w5v6-fl 6s ease-in-out infinite}.w5v6-f2{animation-delay:-2s}.w5v6-f3{animation-delay:-4s}
@keyframes w5v6-fl{50%{transform:translateY(-3px)}}
.w5v6-fs{animation:w5v6-fs 5s ease-in-out infinite}
@keyframes w5v6-fs{50%{transform:translateY(-2px)}}
.w5v6-tw{animation:w5v6-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v6-t2{animation-delay:-1.1s}.w5v6-t3{animation-delay:-2.2s}
@keyframes w5v6-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.w5v6-bl{animation:w5v6-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5v6-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.w5v6-pu{animation:w5v6-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v6-p2{animation-delay:-1s}.w5v6-p3{animation-delay:-2s}
@keyframes w5v6-pu{50%{transform:scale(1.08)}}
.w5v6-ring{animation:w5v6-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5v6-r2{animation-delay:-1.2s}.w5v6-r3{animation-delay:-2.4s}
@keyframes w5v6-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5v6-flow{stroke-dasharray:5 10;animation:w5v6-flow 1.4s linear infinite}
@keyframes w5v6-flow{to{stroke-dashoffset:-30}}
.w5v6-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5v6-draw 5s ease-in-out infinite}
@keyframes w5v6-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5v6-bar{animation:w5v6-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5v6-bar{50%{transform:scaleY(.4)}}
.w5v6-spin{animation:w5v6-spin 12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5v6-spin{to{transform:rotate(360deg)}}
.w5v6-sw{animation:w5v6-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5v6-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5v6-pop{animation:w5v6-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v6-o2{animation-delay:-1.3s}.w5v6-o3{animation-delay:-2.6s}
@keyframes w5v6-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
