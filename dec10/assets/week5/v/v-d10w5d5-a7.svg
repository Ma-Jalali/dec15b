<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="An instruction card says “No more than THREE words”. A student points at it, and a question mark turns into an exclamation mark.">
<title>Exam instruction expressions</title>
<style>
.w5v7-fl{animation:w5v7-fl 6s ease-in-out infinite}.w5v7-f2{animation-delay:-2s}.w5v7-f3{animation-delay:-4s}
