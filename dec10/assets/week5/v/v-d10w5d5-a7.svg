.w5v7-sw{animation:w5v7-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5v7-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5v7-pop{animation:w5v7-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v7-o2{animation-delay:-1.3s}.w5v7-o3{animation-delay:-2.6s}
@keyframes w5v7-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
