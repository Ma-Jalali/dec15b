@keyframes w5v7-pu{50%{transform:scale(1.08)}}
.w5v7-ring{animation:w5v7-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5v7-r2{animation-delay:-1.2s}.w5v7-r3{animation-delay:-2.4s}
@keyframes w5v7-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5v7-flow{stroke-dasharray:5 10;animation:w5v7-flow 1.4s linear infinite}
@keyframes w5v7-flow{to{stroke-dashoffset:-30}}
.w5v7-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5v7-draw 5s ease-in-out infinite}
