<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" role="img" aria-label="A student holds a notebook and reflects. A path with three stepping stones leads up to a flag marked Week 9.">
<title>After the assessment: reflection</title>
<style>
.w5v8-fl{animation:w5v8-fl 6s ease-in-out infinite}.w5v8-f2{animation-delay:-2s}.w5v8-f3{animation-delay:-4s}
@keyframes w5v8-fl{50%{transform:translateY(-3px)}}
.w5v8-fs{animation:w5v8-fs 5s ease-in-out infinite}
@keyframes w5v8-fs{50%{transform:translateY(-2px)}}
.w5v8-tw{animation:w5v8-tw 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v8-t2{animation-delay:-1.1s}.w5v8-t3{animation-delay:-2.2s}
@keyframes w5v8-tw{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.w5v8-bl{animation:w5v8-bl 4.8s infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5v8-bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.w5v8-pu{animation:w5v8-pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v8-p2{animation-delay:-1s}.w5v8-p3{animation-delay:-2s}
@keyframes w5v8-pu{50%{transform:scale(1.08)}}
.w5v8-ring{animation:w5v8-ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.w5v8-r2{animation-delay:-1.2s}.w5v8-r3{animation-delay:-2.4s}
@keyframes w5v8-ring{0%{opacity:0;transform:scale(.85)}30%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.w5v8-flow{stroke-dasharray:5 10;animation:w5v8-flow 1.4s linear infinite}
@keyframes w5v8-flow{to{stroke-dashoffset:-30}}
.w5v8-draw{stroke-dasharray:400;stroke-dashoffset:400;animation:w5v8-draw 5s ease-in-out infinite}
@keyframes w5v8-draw{0%{stroke-dashoffset:400}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.w5v8-bar{animation:w5v8-bar 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes w5v8-bar{50%{transform:scaleY(.4)}}
.w5v8-spin{animation:w5v8-spin 12s linear infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5v8-spin{to{transform:rotate(360deg)}}
.w5v8-sw{animation:w5v8-sw 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes w5v8-sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.w5v8-pop{animation:w5v8-pop 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.w5v8-o2{animation-delay:-1.3s}.w5v8-o3{animation-delay:-2.6s}
@keyframes w5v8-pop{0%,20%{transform:scale(0);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
