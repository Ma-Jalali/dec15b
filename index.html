window.addEventListener('error', function (e) {

  var m = document.getElementById('main');
  if (m && !m.children.length) m.innerHTML = '<div style="max-width:640px;margin:60px auto;padding:24px;border:2px solid #e64626;border-radius:14px;background:#fff;font:16px/1.6 system-ui"><h1 style="font-size:22px;margin:0 0 8px">The lesson could not load</h1><p>Please reload the page without the cache: <b>Ctrl + Shift + R</b> (Windows) or <b>Cmd + Shift + R</b> (Mac). On a phone, close the tab and open the link again.</p><p style="color:#666;font-size:13px">Error: ' + String(msg).replace(/</g, '&lt;') + '</p></div>';
}, true);
</script>
