<script>
/* If any script fails, show a message instead of an empty page. */
window.addEventListener('error', function (e) {
  var msg = e.message || ('Could not load ' + ((e.target && (e.target.src || e.target.href)) || 'a file'));
  var m = document.getElementById('main');
  if (m && !m.children.length) m.innerHTML = '<div style="max-width:640px;margin:60px auto;padding:24px;border:2px solid #e64626;border-radius:14px;background:#fff;font:16px/1.6 system-ui"><h1 style="font-size:22px;margin:0 0 8px">The lesson could not load</h1><p>Please reload the page without the cache: <b>Ctrl + Shift + R</b> (Windows) or <b>Cmd + Shift + R</b> (Mac). On a phone, close the tab and open the link again.</p><p style="color:#666;font-size:13px">Error: ' + String(msg).replace(/</g, '&lt;') + '</p></div>';
}, true);
</script>
<link rel="stylesheet" href="css/dec15.css?v=2.6">
</head>
<body>
<a class="skip" href="#main">Skip to lesson</a>

  <a class="side-home" id="side-home" href="#/"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14m6-12v14"/></svg><span>Course map</span><small>All weeks</small></a>

    <div class="tools">
      <button id="glossary-open" title="Word meanings"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/><path d="M9 8h6m-6 4h4"/></svg><span>Word meanings</span></button>
      <button id="source-open" title="Readings"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4c4-1 7 0 9 2 2-2 5-3 9-2v15c-4-1-7 0-9 2-2-2-5-3-9-2zM12 6v15"/></svg><span>Readings</span></button>

    </div>
  </header>
  <main id="main" tabindex="-1"></main>
</div>

  <div class="dialog-head"><h2 id="resource-title">Readings</h2><button id="dialog-close" aria-label="Close">Close ×</button></div>

</dialog>
